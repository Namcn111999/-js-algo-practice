{label:'Thứ 5', title:'Phân tích lỗi sai theo từng Part', content:'Lập 1 bảng đơn giản: mỗi hàng là 1 Part, ghi số câu đúng/sai. Việc này giúp nhìn ra ngay Part nào đang yếu nhất để ưu tiên thời gian học trong các tuần tới, thay vì học dàn trải đều cho mọi phần.', exercises:["Lập bảng thống kê số câu đúng/sai theo từng Part (1 đến 7) từ đề đã làm ở Thứ 3, xác định 2 Part yếu nhất.","Tô màu hoặc đánh dấu nổi bật 2 Part yếu nhất trong bảng thống kê để dễ theo dõi các tuần sau.","Viết ra 1 giả thuyết ban đầu về lý do bạn sai nhiều ở 2 Part đó (từ vựng, ngữ pháp, tốc độ...).","Với mỗi Part sai nhiều, thử đoán trước lý do sai (từ vựng, ngữ pháp, tốc độ) trước khi xem lại đáp án chi tiết.","Chụp lại hoặc lưu bảng thống kê này để so sánh với lần làm đề cuối tháng 1."], quiz:[
{q:"Vì sao cần phân tích lỗi theo từng Part thay vì chỉ xem tổng điểm?", opts:["Không cần thiết", "Xác định chính xác điểm yếu để ưu tiên ôn tập", "Tổng điểm đã đủ thông tin", "Chỉ để tham khảo cho vui"], correct:1, explain:"Phân tích chi tiết theo Part giúp biết chính xác cần ôn gì."},
{q:"Lỗi sai nên được phân loại theo yếu tố nào?", opts:["Không cần phân loại", "Từ vựng, ngữ pháp, hay tốc độ làm bài", "Chỉ theo màu sắc", "Chỉ theo số thứ tự câu"], correct:1, explain:"Phân loại theo nguyên nhân giúp xác định đúng hướng ôn tập."},
{q:"Nếu sai nhiều ở Part 5, nguyên nhân thường là gì?", opts:["Kỹ năng nghe kém", "Thiếu kiến thức ngữ pháp/từ loại", "Không liên quan đến kiến thức", "Do đề khó bất thường"], correct:1, explain:"Part 5 chủ yếu kiểm tra ngữ pháp và từ loại."},
{q:"Nếu sai nhiều ở Part 3-4 dù hiểu ngữ pháp tốt, nguyên nhân có thể là gì?", opts:["Không có nguyên nhân cụ thể", "Kỹ năng nghe hoặc tốc độ xử lý thông tin", "Do đề in mờ", "Do phòng thi ồn"], correct:1, explain:"Đây thường là vấn đề về kỹ năng nghe và xử lý thông tin nhanh, không phải ngữ pháp."},
{q:"Việc ghi chép lại lỗi sai có tác dụng gì?", opts:["Không có tác dụng gì", "Tránh lặp lại lỗi tương tự, có tài liệu ôn tập riêng", "Chỉ để lưu trữ", "Làm mất thời gian không cần thiết"], correct:1, explain:"Sổ tay lỗi sai cá nhân là tài liệu ôn tập hiệu quả nhất vì đúng điểm yếu của bạn."},
{q:"Nên phân tích lỗi ngay sau khi làm đề hay để lâu?", opts:["Để càng lâu càng tốt", "Ngay sau khi làm, khi còn nhớ rõ tư duy lúc làm bài", "Không cần phân tích", "Chỉ phân tích cuối tháng"], correct:1, explain:"Phân tích ngay giúp nhớ rõ vì sao chọn sai, dễ rút kinh nghiệm hơn."},
{q:"Phân tích lỗi giúp gì cho việc lập kế hoạch học tập?", opts:["Không giúp ích gì", "Tập trung thời gian vào đúng điểm yếu thay vì học dàn trải", "Chỉ để biết điểm số", "Không liên quan đến kế hoạch học"], correct:1, explain:"Đây là cơ sở để phân bổ thời gian học hiệu quả nhất."},
{q:"Việc so sánh phân tích lỗi qua nhiều lần làm đề có ích gì?", opts:["Không có ích gì", "Theo dõi tiến bộ, xem điểm yếu có cải thiện không", "Chỉ để so sánh cho vui", "Gây áp lực không cần thiết"], correct:1, explain:"So sánh theo thời gian cho thấy rõ xu hướng tiến bộ hoặc điểm còn tồn đọng."},

{label:'Thứ 6', title:'Lập thời gian biểu học tập 4 tháng', content:'Với 1-2 tiếng/ngày, phân chia hợp lý: phần lớn thời gian dành cho 2 Part yếu nhất đã xác định ở Thứ 5, nhưng vẫn duy trì ôn tập các Part khác để không bị tụt lại. Lịch học cụ thể, viết ra giấy hoặc ứng dụng nhắc việc, giúp duy trì đều đặn tốt hơn nhiều so với chỉ "định học".', exercises:["Viết ra lịch học cụ thể cho 4 tháng tới: mỗi ngày trong tuần dành bao nhiêu phút cho Listening, bao nhiêu cho Reading, cố định khung giờ học nếu có thể.","In ra hoặc lưu lịch học này ở nơi dễ thấy mỗi ngày để nhắc nhở duy trì.","Đặt 1 mốc kiểm tra giữa tháng để tự đánh giá xem có bám sát lịch học đã đặt ra không.","Đặt lịch nhắc nhở hàng ngày (điện thoại hoặc ứng dụng) vào đúng khung giờ đã chọn để học.","Chia sẻ lịch học với 1 người bạn hoặc người thân để có thêm động lực duy trì."], quiz:[

{q:"Tổng điểm tối đa của TOEIC là bao nhiêu?", opts:["100","500","990","1000"], correct:2, explain:"Điểm tối đa là 990 (495 Listening + 495 Reading)."},

{q:"Part nào thuộc Reading, không phải Listening?", opts:["Part 2","Part 3","Part 5","Part 4"], correct:2, explain:"Part 1-4 thuộc Listening; Part 5-7 thuộc Reading."},
{q:"Chiến thuật nào giúp làm Part 3-4 tốt hơn?", opts:["Không cần đọc câu hỏi trước","Đọc trước câu hỏi và đáp án trước khi nghe","Chỉ nghe, không đọc gì","Nhắm mắt để tập trung"], correct:1, explain:"Đọc trước câu hỏi giúp biết cần chú ý thông tin gì khi nghe, tăng đáng kể tỷ lệ đúng."},
{q:"Nên làm gì nếu không chắc đáp án của 1 câu Part 7?", opts:["Bỏ trống để không bị trừ điểm","Đánh dấu và làm câu khác trước, quay lại sau nếu còn thời gian","Dừng lại suy nghĩ đến khi chắc chắn","Bỏ thi luôn"], correct:1, explain:"Vì không bị trừ điểm câu sai, tốt nhất là làm câu dễ trước, không nên kẹt quá lâu ở 1 câu khó."},
{q:"Mục tiêu 800+ điểm cần cân bằng thế nào giữa Listening và Reading?", opts:["Chỉ cần giỏi 1 phần","Cần cân bằng cả 2, không bỏ hẳn phần nào","Chỉ cần giỏi Listening","Chỉ cần giỏi Reading"], correct:1, explain:"800+ đòi hỏi điểm tốt ở cả 2 kỹ năng, không thể chỉ dựa vào 1 phần mạnh để bù phần yếu quá nhiều."},

{title:"Ngữ pháp nền tảng: thì động từ & cấu trúc câu", points:["TOEIC Part 5-6 kiểm tra ngữ pháp qua câu đơn lẻ và đoạn văn ngắn.","Ôn lại các thì cơ bản: hiện tại đơn, quá khứ đơn, hiện tại hoàn thành — nhóm câu hỏi xuất hiện thường xuyên.","Nắm vững cấu trúc câu cơ bản: chủ ngữ - động từ - tân ngữ, vị trí tính từ/trạng từ trong câu.","Phân biệt danh động từ (V-ing) và động từ nguyên mẫu có \"to\" sau các động từ phổ biến.","Học ngữ pháp qua ví dụ câu thực tế thay vì học thuộc lý thuyết suông."], practice:"Làm 25 câu Part 5 tập trung chủ điểm thì động từ, ghi lại các câu sai và lý do sai vào sổ tay lỗi.", case:"Part 5 chiếm 30/100 câu Reading — chỉ riêng nắm chắc ngữ pháp cơ bản đã đảm bảo được một lượng điểm ổn định.", task:"Làm 25 câu Part 5 tập trung chủ điểm thì động từ, ghi lại các câu sai và lý do sai.", days:[
{label:'Thứ 2', title:'Ôn thì hiện tại đơn & hiện tại tiếp diễn', content:'Thì hiện tại đơn diễn tả thói quen, sự thật hiển nhiên, lịch trình cố định (dấu hiệu: always, usually, every day). Thì hiện tại tiếp diễn diễn tả hành động đang xảy ra tại thời điểm nói (dấu hiệu: now, at the moment). Trong Part 5, nhận diện đúng dấu hiệu thời gian giúp chọn đúng dạng động từ.', exercises:["Viết 5 câu ví dụ dùng thì hiện tại đơn và 5 câu dùng hiện tại tiếp diễn liên quan chủ đề công sở (họp hành, báo cáo...).","Tìm và gạch chân thì động từ trong 5 câu tiếng Anh bất kỳ bạn gặp hàng ngày để luyện nhận diện thực tế.","Tự đặt 3 câu hỏi kiểu Part 5 (có chỗ trống) rồi tự trả lời để luyện tư duy ra đề.","Tìm 5 câu tiếng Anh trong email hoặc tin nhắn công việc gần đây của bạn, xác định thì đang dùng là gì.","Viết lại 3 câu bạn hay nói sai thì trong quá khứ, sửa lại đúng theo kiến thức vừa học."], quizGen:'present', quizCount:60,

{label:'Thứ 3', title:'Ôn thì quá khứ đơn & hiện tại hoàn thành', content:'Quá khứ đơn diễn tả hành động đã kết thúc tại 1 thời điểm xác định trong quá khứ. Hiện tại hoàn thành diễn tả hành động xảy ra trong quá khứ nhưng còn liên quan/ảnh hưởng đến hiện tại, hoặc chưa xác định rõ thời điểm (already, just, since, for) — 2 thì hay bị nhầm lẫn nhất của người học tiếng Việt.', exercises:["Viết 5 cặp câu minh họa sự khác biệt giữa quá khứ đơn và hiện tại hoàn thành cho cùng 1 tình huống.","Viết 1 đoạn văn ngắn kể lại 1 việc bạn đã làm xong hôm nay, cố tình dùng cả 2 thì đã học.","Tìm 3 câu có since/for trong tài liệu tiếng Anh bất kỳ, xác định since đi với mốc thời gian còn for đi với khoảng thời gian.","Viết 1 đoạn hội thoại ngắn (3-4 câu) giữa 2 người nói về công việc đã hoàn thành, dùng cả 2 thì đã học.","Tìm 3 câu có \"yet\" hoặc \"already\" trong tài liệu tiếng Anh bất kỳ, xác định đúng ngữ cảnh dùng."], quizGen:'pastperfect', quizCount:60,

{label:'Thứ 4', title:'Luyện Part 5 chủ điểm thì động từ', content:'Áp dụng kiến thức 2 ngày trước vào luyện đề thật — tìm dấu hiệu thời gian trong câu (từ khóa như yesterday, since, now) trước khi chọn đáp án, đừng chỉ dựa vào cảm giác quen mắt.', exercises:["Làm 15 câu Part 5 tập trung chủ điểm thì động từ, đối chiếu đáp án và ghi lại câu sai kèm lý do.","Với mỗi câu sai, thử tự đặt lại câu hỏi tương tự (đổi chủ ngữ/tình huống) để luyện thêm dạng đó.","Phân loại 15 câu vừa làm theo mức độ tự tin: chắc chắn đúng / không chắc / đoán mò.","Ôn lại 5 câu bạn làm sai nhiều lần nhất trong bộ quiz, viết ra dấu hiệu nhận biết để không sai lại.","Thử làm quiz thêm 1 lần nữa vào cuối ngày (bấm \"Làm bộ câu mới\"), so sánh điểm với lần đầu."], quizGen:'mixedtense', quizCount:60,

{label:'Thứ 5', title:'Cấu trúc câu cơ bản & vị trí từ loại', content:'Cấu trúc câu tiếng Anh cơ bản: Chủ ngữ - Động từ - Tân ngữ (S-V-O). Tính từ thường đứng trước danh từ hoặc sau động từ to be; trạng từ thường đứng sau động từ chính hoặc đầu/cuối câu. Nắm vững vị trí này giúp làm nhanh các câu Part 5 hỏi về từ loại.', exercises:["Viết 5 câu, mỗi câu xác định rõ đâu là S-V-O và vị trí của tính từ/trạng từ (nếu có).","Viết thêm 3 câu có trạng từ ở các vị trí khác nhau trong câu.","Tìm 1 đoạn văn tiếng Anh ngắn, gạch chân toàn bộ tính từ và trạng từ xuất hiện trong đó.","Viết 5 câu của riêng bạn, mỗi câu cố tình để trống 1 vị trí cần tính từ hoặc trạng từ, tự đố lại bản thân.","Đếm xem trong bộ quiz vừa làm, bạn sai nhiều nhất ở dạng cần điền danh từ, tính từ hay trạng từ."], quizGen:'wordform', quizCount:60,

{label:'Thứ 6', title:'Luyện thêm Part 5 & tổng kết tuần', content:'Ôn lại tất cả câu sai đã note trong tuần, phân loại xem lỗi chủ yếu do chưa nắm vững thì động từ hay do nhầm vị trí từ loại — điều này quyết định trọng tâm ôn tập của tuần sau.', exercises:["Làm thêm 15 câu Part 5 tổng hợp, tổng kết lại toàn bộ lỗi sai của tuần vào sổ tay theo 2 nhóm: lỗi thì động từ và lỗi cấu trúc câu.","Làm lại đúng 5 câu đã sai trong tuần (không xem đáp án cũ) để kiểm tra đã sửa được lỗi chưa.","Viết 1 câu tóm tắt: chủ điểm ngữ pháp nào tuần này bạn thấy khó nhất, cần ôn thêm.","Tổng hợp lại toàn bộ giới từ (preposition) đã gặp trong tuần thành 1 danh sách riêng để ôn định kỳ.","Tự đặt 3 câu Part 5 mới theo đúng dạng collocation vừa học, nhờ người khác hoặc tự kiểm tra lại."], quiz:[
{q:"Employees ___ attend the training session next week.", opts:["must","musts","musting","musted"], correct:0, explain:"Động từ khuyết thiếu (modal verb) \"must\" luôn theo sau bởi động từ nguyên mẫu, không chia."},
{q:"The new policy takes effect ___ January 1st.", opts:["on","in","at","by"], correct:0, explain:"Giới từ \"on\" dùng với ngày cụ thể (on + ngày tháng)."},
{q:"She is responsible ___ managing the budget.", opts:["of","for","with","at"], correct:1, explain:"Cụm cố định \"responsible for\" (chịu trách nhiệm về)."},
{q:"The team worked ___ to meet the deadline.", opts:["hard","hardly","harder","hardness"], correct:0, explain:"\"hard\" vừa là tính từ vừa là trạng từ chỉ cách thức (làm việc chăm chỉ); \"hardly\" nghĩa là hầu như không, khác nghĩa hoàn toàn."},
{q:"He arrived ___ the meeting on time.", opts:["at","in","on","to"], correct:0, explain:"Cụm cố định \"arrive at\" + địa điểm/sự kiện cụ thể."},
{q:"The manager will ___ the results tomorrow.", opts:["announce","announces","announced","announcing"], correct:0, explain:"Sau \"will\" (modal verb) luôn là động từ nguyên mẫu."},
{q:"This department is in charge ___ customer service.", opts:["of","for","with","on"], correct:0, explain:"Cụm cố định \"in charge of\" (phụ trách)."},
{q:"The invoice must be paid ___ 30 days.", opts:["within","while","during","between"], correct:0, explain:"\"within\" dùng để chỉ giới hạn thời gian (trong vòng bao lâu)."},
{q:"We look forward ___ hearing from you.", opts:["to","for","at","on"], correct:0, explain:"Cụm cố định \"look forward to\" + V-ing (mong chờ)."},
{q:"The results were ___ than expected.", opts:["good","better","best","well"], correct:1, explain:"Sau \"than\" cần dạng so sánh hơn → better."},
{q:"The meeting has been put ___ until next week.", opts:["off","on","up","down"], correct:0, explain:"Cụm cố định \"put off\" (hoãn lại)."},
{q:"We need to deal ___ this problem immediately.", opts:["with","of","for","at"], correct:0, explain:"Cụm cố định \"deal with\" (giải quyết, xử lý)."},
{q:"The company plans to expand ___ Southeast Asia next year.", opts:["into","on","at","with"], correct:0, explain:"Cụm cố định \"expand into\" + thị trường/khu vực (mở rộng sang)."},
{q:"Please refer ___ the attached document for details.", opts:["to","at","on","with"], correct:0, explain:"Cụm cố định \"refer to\" (tham khảo, đề cập đến)."},
{q:"The new hires will report ___ the HR manager.", opts:["to","at","with","for"], correct:0, explain:"Cụm cố định \"report to\" (báo cáo cho, trực thuộc quản lý của)."},
{q:"The proposal was rejected ___ several reasons.", opts:["due to","despite","although","because"], correct:0, explain:"\"due to\" + danh từ/cụm danh từ (do bởi); \"because\" cần theo sau là 1 mệnh đề đầy đủ."},
{q:"The company is well known ___ its customer service.", opts:["for","of","with","about"], correct:0, explain:"Cụm cố định \"known for\" (nổi tiếng vì)."},
{q:"He is capable ___ handling multiple projects at once.", opts:["of","for","with","at"], correct:0, explain:"Cụm cố định \"capable of\" (có khả năng)."},
{q:"The invoice should be sent ___ the client directly.", opts:["to","at","for","with"], correct:0, explain:"\"send something to someone\" — gửi cho ai đó."},
{q:"We are committed ___ providing excellent service.", opts:["to","for","with","of"], correct:0, explain:"Cụm cố định \"committed to\" + V-ing/danh từ (cam kết)."},
{q:"The results depend largely ___ market conditions.", opts:["on","of","for","with"], correct:0, explain:"Cụm cố định \"depend on\" (phụ thuộc vào)."},
{q:"She was promoted ___ senior manager last month.", opts:["to","at","for","with"], correct:0, explain:"Cụm cố định \"promoted to\" + chức danh (được thăng chức lên)."},
{q:"The team is working ___ a tight deadline.", opts:["under","below","on","at"], correct:0, explain:"Cụm cố định \"under a deadline/pressure\" (chịu áp lực thời hạn)."},
{q:"This product complies ___ international safety standards.", opts:["with","to","of","for"], correct:0, explain:"Cụm cố định \"comply with\" (tuân thủ)."},
], vocab:[

{title:"Từ vựng công sở & Listening Part 1-2", points:["Part 1 (mô tả tranh) cần từ vựng miêu tả hành động, vị trí đồ vật (in front of, next to...).","Part 2 (hỏi-đáp ngắn) cần phản xạ nhanh với các dạng câu hỏi Wh-, Yes/No, câu hỏi lựa chọn.","Nghe kỹ từ để hỏi đầu câu (What, Where, When, Who) vì nó quyết định loại câu trả lời cần tìm.","Cảnh giác với \"bẫy\" từ đồng âm thường xuất hiện ở đáp án gây nhiễu.","Luyện nghe chép chính tả (dictation) giúp cải thiện khả năng bắt âm rõ rệt."], practice:"Nghe và làm thử 10 câu Part 1 + 10 câu Part 2, sau đó nghe lại transcript để đối chiếu từ nghe sai, ghi lại từ mới vào sổ từ vựng.", case:"Part 1-2 tuy dễ nhưng chiếm 30/100 câu Listening — làm chắc phần này là nền tảng để đạt điểm Listening cao.", task:"Nghe và làm thử 10 câu Part 1 + 10 câu Part 2, sau đó nghe lại transcript để đối chiếu từ nghe sai.", days:[
{label:'Thứ 2', title:'Từ vựng miêu tả hành động & vị trí (Part 1)', content:'Part 1 yêu cầu chọn câu mô tả đúng nhất bức tranh — từ vựng cần tập trung vào động từ miêu tả hành động (standing, holding, pointing...) và giới từ chỉ vị trí (in front of, next to, between, across from).', exercises:["Tự mô tả 3 bức tranh/tình huống bất kỳ bằng tiếng Anh, cố dùng ít nhất 5 từ trong danh sách bên dưới.","Ghép các từ vừa học thành 5 câu hoàn chỉnh mô tả hành động con người trong văn phòng.","Che phần nghĩa tiếng Việt, tự đoán nghĩa từng từ trước rồi mới đối chiếu lại.","Vẽ hoặc tìm 1 bức tranh bất kỳ, thử áp dụng ít nhất 8 từ trong danh sách để mô tả bằng tiếng Anh.","Ôn lại 20 từ vựng bằng flashcard tự làm (giấy hoặc ứng dụng), lặp lại 2 lần trong ngày."], vocab:[
{term:"stand", meaning:"đứng", example:"A man is standing near the window."},
{term:"hold", meaning:"cầm, giữ", example:"She is holding a cup of coffee."},
{term:"point", meaning:"chỉ (tay/vật)", example:"He is pointing at the screen."},
{term:"carry", meaning:"mang, vác", example:"The worker is carrying a box."},
{term:"lean", meaning:"tựa, nghiêng", example:"A bicycle is leaning against the wall."},
{term:"reach", meaning:"với tới", example:"She is reaching for a file on the shelf."},
{term:"wear", meaning:"mặc, đeo", example:"The man is wearing a helmet."},
{term:"push", meaning:"đẩy", example:"He is pushing a cart."},
{term:"pull", meaning:"kéo", example:"They are pulling a rope."},
{term:"examine", meaning:"kiểm tra, xem xét", example:"The technician is examining the machine."},
{term:"in front of", meaning:"phía trước", example:"The car is parked in front of the building."},
{term:"next to", meaning:"bên cạnh", example:"The chair is next to the desk."},
{term:"between", meaning:"ở giữa", example:"The printer is between the two desks."},
{term:"across from", meaning:"đối diện", example:"The bank is across from the park."},
{term:"on top of", meaning:"trên đỉnh, trên cùng", example:"Books are stacked on top of each other."},

{term:"arrange", meaning:"sắp xếp", example:"The items are arranged on the shelf."},
{term:"gather", meaning:"tụ tập", example:"A crowd has gathered near the entrance."},
], quiz:[
{q:"Part 1 yêu cầu làm gì?", opts:["Trả lời câu hỏi mở", "Chọn câu mô tả đúng nhất bức tranh", "Đọc đoạn văn dài", "Viết luận"], correct:1, explain:"Part 1 là dạng nghe và chọn câu mô tả khớp với hình ảnh."},
{q:"\"stand\" nghĩa là gì?", opts:["Ngồi", "Đứng", "Chạy", "Nhảy"], correct:1, explain:"\"stand\" nghĩa là đứng."},
{q:"\"hold\" nghĩa là gì?", opts:["Cầm, giữ", "Đẩy", "Kéo", "Ném"], correct:0, explain:"\"hold\" nghĩa là cầm hoặc giữ vật gì đó."},
{q:"\"in front of\" nghĩa là gì?", opts:["Phía sau", "Phía trước", "Bên cạnh", "Ở giữa"], correct:1, explain:"\"in front of\" nghĩa là phía trước."},
{q:"\"next to\" nghĩa là gì?", opts:["Đối diện", "Trên đỉnh", "Bên cạnh", "Bên dưới"], correct:2, explain:"\"next to\" nghĩa là bên cạnh."},
{q:"\"examine\" nghĩa là gì?", opts:["Kiểm tra, xem xét", "Vứt bỏ", "Sửa chữa", "Bán"], correct:0, explain:"\"examine\" nghĩa là kiểm tra, xem xét kỹ."},
{q:"Loại từ vựng nào quan trọng nhất cho Part 1?", opts:["Danh từ trừu tượng", "Động từ hành động và giới từ chỉ vị trí", "Tính từ cảm xúc", "Trạng từ tần suất"], correct:1, explain:"Part 1 tập trung mô tả hành động và vị trí trong ảnh, nên 2 nhóm từ này quan trọng nhất."},
{q:"\"arrange\" nghĩa là gì?", opts:["Sắp xếp", "Phá hủy", "Tìm kiếm", "Đóng gói"], correct:0, explain:"\"arrange\" nghĩa là sắp xếp."},
{q:"\"gather\" nghĩa là gì?", opts:["Phân tán", "Tụ tập", "Rời đi", "Nghỉ ngơi"], correct:1, explain:"\"gather\" nghĩa là tụ tập, tập hợp lại."},
{q:"Vì sao Part 1 cần vốn từ vựng miêu tả hành động phong phú?", opts:["Không cần thiết", "Vì câu trả lời thường dùng nhiều từ đồng nghĩa để mô tả cùng 1 hành động", "Vì Part 1 rất dễ", "Vì không có hình ảnh hỗ trợ"], correct:1, explain:"Đáp án đúng thường diễn đạt hành động bằng từ khác với cách bạn nghĩ trong đầu, nên cần vốn từ rộng."},
]},
{label:'Thứ 3', title:'Luyện Part 1 có tính giờ', content:'Part 1 chỉ có 6 câu nhưng cần phản xạ rất nhanh — mỗi câu chỉ có khoảng vài giây suy nghĩ trước khi nghe đáp án. Luyện nghe kèm tính giờ giúp làm quen với tốc độ này thay vì chỉ luyện không giới hạn thời gian.', exercises:["Luyện 10 câu Part 1 có tính giờ nghiêm ngặt, nghe lại transcript đối chiếu những câu nghe chưa rõ.","Nghe lại 3 câu bạn làm sai, chỉ ra chính xác từ/cụm từ nào khiến bạn chọn nhầm đáp án.","Nghe 1 câu Part 1 lại 2 lần, ghi lại xem lần 2 có nghe rõ hơn lần 1 không.","Nghe lại toàn bộ 10 câu 1 lần nữa vào cuối ngày, không nhìn transcript, tự đánh giá tiến bộ trong ngày.","Ghi chú riêng những từ vựng Part 1 bạn chưa từng gặp trước đây vào sổ từ vựng cá nhân."], quiz:[
{q:"Part 1 có bao nhiêu câu trong đề thi thật?", opts:["4 câu", "6 câu", "10 câu", "15 câu"], correct:1, explain:"Part 1 chuẩn có 6 câu trong đề thi thật."},
{q:"Mỗi câu Part 1 có mấy đáp án để chọn?", opts:["2", "3", "4", "5"], correct:2, explain:"Mỗi câu Part 1 có 4 lựa chọn (A, B, C, D)."},
{q:"Chiến thuật nào giúp làm Part 1 nhanh hơn?", opts:["Không cần chiến thuật gì", "Quan sát tổng thể bức tranh trước khi nghe, dự đoán từ vựng có thể xuất hiện", "Chỉ nghe không cần nhìn tranh", "Nhắm mắt để tập trung"], correct:1, explain:"Quan sát trước giúp chuẩn bị tâm thế và dự đoán từ vựng liên quan."},
{q:"Vì sao luyện tập có tính giờ quan trọng cho Part 1?", opts:["Không quan trọng", "Để quen với tốc độ và áp lực thời gian thi thật", "Chỉ để tạo áp lực không cần thiết", "Vì Part 1 không giới hạn thời gian"], correct:1, explain:"Luyện có tính giờ giúp làm quen với nhịp độ thực tế của bài thi."},
{q:"Khi nghe xong 4 đáp án Part 1, nên làm gì nếu không chắc chắn?", opts:["Bỏ trống câu đó", "Chọn đáp án gần đúng nhất, không bỏ trống", "Dừng lại suy nghĩ lâu", "Yêu cầu nghe lại"], correct:1, explain:"Không bị trừ điểm câu sai nên luôn nên chọn 1 đáp án."},
{q:"Lỗi phổ biến khi làm Part 1 là gì?", opts:["Không có lỗi phổ biến", "Chọn đáp án có từ nghe quen nhưng sai ngữ cảnh", "Nghe quá kỹ", "Nhìn tranh quá lâu"], correct:1, explain:"Đây là bẫy phổ biến: từ nghe quen tai nhưng không mô tả đúng bức tranh."},
{q:"Nên tập trung nghe vào phần nào của câu trả lời?", opts:["Chỉ chủ ngữ", "Động từ và giới từ chỉ vị trí", "Chỉ tính từ", "Không cần tập trung phần nào cụ thể"], correct:1, explain:"Đây là 2 thành phần quyết định câu có mô tả đúng bức tranh hay không."},
{q:"Vì sao không nên cố nhớ lại câu đã qua khi đang nghe câu tiếp theo?", opts:["Không có lý do gì", "Sẽ làm mất tập trung và bỏ lỡ câu hiện tại", "Vì câu cũ không quan trọng", "Vì luôn nhớ được câu cũ"], correct:1, explain:"Listening không dừng lại chờ, nên cần buông câu cũ để tập trung câu mới."},
{q:"Thời gian trung bình cho mỗi câu Part 1 khi luyện tập nên là bao nhiêu?", opts:["Không cần quan tâm thời gian", "Khoảng vài giây suy nghĩ trước khi chuyển câu tiếp theo", "Vài phút mỗi câu", "Không giới hạn"], correct:1, explain:"Part 1 có nhịp độ nhanh, chỉ có vài giây giữa các câu."},
{q:"Luyện Part 1 nhiều lần giúp ích gì về lâu dài?", opts:["Không giúp ích gì", "Phản xạ nhận diện từ vựng nhanh hơn, tự tin hơn khi thi thật", "Chỉ tốn thời gian", "Chỉ có ích cho lần thi đầu tiên"], correct:1, explain:"Luyện tập lặp lại xây dựng phản xạ nghe-hiểu nhanh, quan trọng cho thi thật."},
], vocab:[

{term:"scene", meaning:"cảnh", example:"This is an outdoor scene."},
{term:"setting", meaning:"bối cảnh", example:"The setting looks like an office."},
{term:"activity", meaning:"hoạt động", example:"Focus on the main activity shown."},
{term:"location", meaning:"địa điểm", example:"The location appears to be a warehouse."},
{term:"arrangement", meaning:"sự sắp xếp", example:"Notice the arrangement of the furniture."},
]},
{label:'Thứ 4', title:'Các dạng câu hỏi Part 2', content:'Part 2 có 3 dạng chính: câu hỏi Wh- (What, Where, When, Who, Why, How), câu hỏi Yes/No, và câu hỏi lựa chọn (A or B). Mẹo quan trọng: chỉ cần nghe rõ 2-3 từ ĐẦU câu hỏi là đã có thể loại được nhiều đáp án sai — không cần nghe hiểu 100% cả câu.', exercises:["Với mỗi dạng câu hỏi bên dưới, tự viết thêm 1 ví dụ câu hỏi + câu trả lời khác của riêng bạn.","Che phần trả lời mẫu, tự nghĩ ra 1 câu trả lời hợp lý cho từng câu hỏi trước khi xem đáp án.","Tự viết 3 câu hỏi Part 2 kiểu Yes/No và tự viết 2 cách trả lời khác nhau (Yes và No) cho mỗi câu.","Tự đóng vai hỏi-đáp: viết 5 câu hỏi ngẫu nhiên thuộc các dạng đã học, nhờ người khác đọc để bạn luyện nghe.","Liệt kê lại 10 dạng câu hỏi đã học theo trí nhớ, không nhìn tài liệu, kiểm tra độ chính xác."], vocab:[
{term:"What...?", meaning:"hỏi sự việc/vật → trả lời bằng thông tin cụ thể", example:"What time does the store open? → At 9 a.m."},
{term:"Where...?", meaning:"hỏi địa điểm → trả lời bằng nơi chốn", example:"Where is the conference room? → On the third floor."},
{term:"Who...?", meaning:"hỏi người → trả lời bằng tên/chức danh", example:"Who signed this contract? → Mr. Tanaka did."},
{term:"Why...?", meaning:"hỏi lý do → trả lời bằng \"Because...\" hoặc lý do trực tiếp", example:"Why was the meeting canceled? → Because the manager is sick."},
{term:"How...?", meaning:"hỏi cách thức/mức độ → trả lời bằng phương thức hoặc số lượng", example:"How do I get to the airport? → Take the shuttle bus."},
{term:"Yes/No question", meaning:"trả lời bắt đầu bằng Yes/No hoặc ý tương đương", example:"Did you send the email? → Not yet."},
{term:"Or question (lựa chọn)", meaning:"trả lời chọn 1 trong 2, hoặc \"either/neither\"", example:"Should I call or email you? → Either is fine."},
{term:"Tag question", meaning:"trả lời xác nhận đồng ý/không đồng ý", example:"The report is ready, isn't it? → Yes, it is."},
{term:"Suggestion", meaning:"trả lời chấp nhận hoặc từ chối đề nghị", example:"Why don't we take a break? → Sure, good idea."},
{term:"Statement (không phải câu hỏi)", meaning:"trả lời phản hồi phù hợp với câu nói", example:"I think the deadline is too tight. → I agree, let's ask for more time."},
{term:"clarification", meaning:"sự làm rõ", example:"This question asks for clarification."},
{term:"indirect", meaning:"gián tiếp", example:"This is an indirect way of asking."},
{term:"direct", meaning:"trực tiếp", example:"A direct question expects a direct answer."},
{term:"polite", meaning:"lịch sự", example:"This is a polite way to make a request."},
{term:"casual", meaning:"thân mật, xuề xòa", example:"The tone here sounds casual."},
{term:"assumption", meaning:"giả định", example:"The question is based on an assumption."},
{term:"rhetorical", meaning:"mang tính tu từ (không cần trả lời thật)", example:"That was a rhetorical question."},
{term:"literal", meaning:"theo nghĩa đen", example:"Don't take the question too literally."},
], quiz:[
{q:"Part 2 có mấy dạng câu hỏi chính?", opts:["1", "3 (Wh-, Yes/No, lựa chọn)", "5", "10"], correct:1, explain:"3 dạng chính: câu hỏi Wh-, câu hỏi Yes/No, và câu hỏi lựa chọn."},
{q:"Câu hỏi \"What time...?\" nên trả lời bằng gì?", opts:["Địa điểm", "Thời gian cụ thể", "Tên người", "Lý do"], correct:1, explain:"Câu hỏi về thời gian cần trả lời bằng mốc thời gian cụ thể."},
{q:"Câu hỏi \"Where...?\" nên trả lời bằng gì?", opts:["Thời gian", "Địa điểm", "Số lượng", "Cách thức"], correct:1, explain:"Câu hỏi \"Where\" luôn cần trả lời bằng nơi chốn."},
{q:"Câu hỏi dạng Yes/No thường trả lời thế nào?", opts:["Không bao giờ dùng Yes/No", "Bắt đầu bằng Yes/No hoặc ý tương đương", "Luôn phải giải thích dài dòng", "Không cần trả lời"], correct:1, explain:"Câu hỏi Yes/No thường được trả lời trực tiếp hoặc bằng ý tương đương."},
{q:"Mẹo quan trọng nhất khi làm Part 2 là gì?", opts:["Nghe hiểu toàn bộ câu 100%", "Chỉ cần nghe rõ 2-3 từ đầu câu hỏi để loại đáp án sai", "Không cần nghe gì cả", "Chỉ cần đoán ngẫu nhiên"], correct:1, explain:"Từ để hỏi đầu câu quyết định phần lớn việc loại trừ đáp án sai."},
{q:"Câu hỏi dạng \"Or\" (lựa chọn) nên trả lời thế nào?", opts:["Luôn trả lời Yes", "Chọn 1 trong 2 lựa chọn, hoặc \"either/neither\"", "Không cần trả lời", "Luôn trả lời No"], correct:1, explain:"Câu hỏi lựa chọn A hay B cần chọn 1 phương án hoặc dùng either/neither."},
{q:"Tag question thường trả lời thế nào?", opts:["Không cần trả lời", "Xác nhận đồng ý/không đồng ý", "Luôn phải phủ định", "Chỉ trả lời bằng số"], correct:1, explain:"Tag question (câu hỏi đuôi) cần trả lời xác nhận đồng ý hoặc không."},
{q:"Statement (không phải câu hỏi) trong Part 2 cần trả lời thế nào?", opts:["Không cần trả lời gì", "Phản hồi phù hợp với nội dung câu nói", "Luôn phải hỏi lại", "Bỏ qua câu đó"], correct:1, explain:"Với câu phát biểu (không phải câu hỏi), cần chọn phản hồi hợp lý theo ngữ cảnh."},
{q:"Vì sao không cần nghe hiểu 100% câu hỏi mới trả lời được Part 2?", opts:["Không đúng, luôn cần hiểu 100%", "Chỉ cần nắm từ để hỏi đầu câu là đã loại được nhiều đáp án sai", "Vì Part 2 không quan trọng", "Vì câu hỏi luôn rất ngắn"], correct:1, explain:"Nắm vững dạng câu hỏi đầu câu giúp loại trừ nhanh mà không cần hiểu toàn bộ."},
{q:"Part 2 có bao nhiêu câu trong đề thi thật?", opts:["10 câu", "25 câu", "39 câu", "50 câu"], correct:1, explain:"Part 2 chuẩn có 25 câu trong đề thi thật."},
]},
{label:'Thứ 5', title:'Luyện Part 2 có tính giờ', content:'Khoảng cách giữa các câu hỏi trong Part 2 khá ngắn — nếu bị phân tâm suy nghĩ về câu trước, rất dễ bỏ lỡ câu sau. Luyện tập theo nhịp độ thật giúp xây dựng phản xạ "buông câu cũ, tập trung câu mới" ngay lập tức.', exercises:["Luyện 15 câu Part 2 có tính giờ liên tục không dừng, chấm điểm và ghi chú dạng câu hỏi nào hay sai nhất.","Ghi lại tổng thời gian làm 15 câu Part 2, tính trung bình mỗi câu mất bao nhiêu giây.","Đánh dấu những câu bạn bị \"bẫy\" bởi từ đồng âm, ghi chú riêng loại lỗi này để cảnh giác về sau.","Thử nhắm mắt khi nghe để tập trung hoàn toàn vào âm thanh, so sánh độ tập trung với khi nhìn màn hình.","Ghi lại 3 câu bạn nghe rõ ràng nhất và 3 câu khó nghe nhất trong 15 câu vừa luyện."], quiz:[
{q:"Part 2 không hiển thị đáp án trên giấy, điều này đòi hỏi kỹ năng gì?", opts:["Chỉ cần đọc nhanh", "Nghe và ghi nhớ đáp án trong đầu ngay lúc nghe", "Không cần kỹ năng đặc biệt", "Chỉ cần đoán"], correct:1, explain:"Vì không có văn bản hỗ trợ, cần nghe và xử lý thông tin hoàn toàn bằng tai."},
{q:"Vì sao Part 2 được coi là khó với người mới luyện nghe?", opts:["Vì có hình ảnh gây rối", "Không có hình ảnh/text hỗ trợ, chỉ dựa hoàn toàn vào âm thanh", "Vì câu hỏi quá dài", "Vì có quá nhiều lựa chọn"], correct:1, explain:"Thiếu sự hỗ trợ trực quan khiến Part 2 đòi hỏi kỹ năng nghe thuần túy."},
{q:"Nên làm gì nếu bỏ lỡ 1 câu Part 2?", opts:["Dừng lại cố nhớ câu đó", "Bỏ qua ngay, tập trung vào câu tiếp theo", "Yêu cầu nghe lại", "Bỏ thi luôn"], correct:1, explain:"Cố nhớ lại sẽ khiến bỏ lỡ cả câu tiếp theo, nên buông và tiếp tục."},
{q:"Luyện tập có tính giờ cho Part 2 mô phỏng điều gì?", opts:["Không mô phỏng gì", "Áp lực thời gian liên tục không dừng của Listening thật", "Chỉ để tạo áp lực không cần thiết", "Không có tác dụng gì"], correct:1, explain:"Listening thật không dừng chờ thí sinh, luyện tính giờ giúp quen với nhịp độ đó."},
{q:"Kỹ năng nào cần luyện song song với nghe để làm tốt Part 2?", opts:["Kỹ năng viết", "Khả năng loại trừ đáp án sai nhanh dựa trên từ để hỏi", "Kỹ năng đọc nhanh", "Không cần kỹ năng nào khác"], correct:1, explain:"Loại trừ nhanh là kỹ năng bổ trợ quan trọng bên cạnh nghe."},
{q:"Nếu nghe không rõ từ để hỏi đầu câu, nên làm gì?", opts:["Bỏ trống hoàn toàn", "Đoán dựa trên ngữ cảnh của các đáp án còn lại", "Dừng bài thi", "Yêu cầu giám thị giải thích"], correct:1, explain:"Vẫn có thể suy luận từ ngữ cảnh các đáp án để đưa ra lựa chọn hợp lý nhất."},
{q:"Vì sao nên luyện nghe nhiều dạng giọng đọc khác nhau?", opts:["Không cần thiết", "Vì đề thi thật có nhiều giọng đọc khác nhau (Anh-Anh, Anh-Mỹ, Anh-Úc...)", "Vì chỉ có 1 giọng đọc duy nhất", "Vì giọng đọc không ảnh hưởng gì"], correct:1, explain:"TOEIC dùng nhiều giọng đọc khác nhau, cần làm quen đa dạng."},
{q:"Sau khi luyện xong, nên làm gì để cải thiện?", opts:["Không cần làm gì thêm", "Nghe lại transcript, xem lại câu sai để hiểu nguyên nhân", "Quên ngay kết quả", "Chuyển sang phần khác luôn"], correct:1, explain:"Ôn lại transcript giúp hiểu chính xác vì sao nghe sai để rút kinh nghiệm."},
{q:"Tốc độ nói trong Part 2 so với giao tiếp thường thế nào?", opts:["Chậm hơn nhiều", "Gần với tốc độ nói tự nhiên của người bản xứ", "Nhanh gấp đôi bình thường", "Không có tốc độ cố định"], correct:1, explain:"TOEIC mô phỏng tốc độ nói tự nhiên, không cố tình làm chậm cho dễ nghe."},
{q:"Luyện Part 2 đều đặn giúp cải thiện kỹ năng gì về lâu dài?", opts:["Không giúp ích gì", "Phản xạ nghe nhanh và khả năng dự đoán ngữ cảnh", "Chỉ giúp thi tốt 1 lần duy nhất", "Chỉ giúp cải thiện phát âm"], correct:1, explain:"Đây là kỹ năng nghe-phản xạ có thể áp dụng cho giao tiếp thực tế, không chỉ thi cử."},
], vocab:[
{term:"response", meaning:"phản hồi, câu trả lời", example:"Choose the most appropriate response."},
{term:"reply", meaning:"trả lời", example:"His reply matched the question perfectly."},
{term:"immediate", meaning:"ngay lập tức", example:"You need an immediate reaction, not a long pause."},
{term:"react", meaning:"phản ứng", example:"React quickly to what you hear."},
{term:"memorize", meaning:"ghi nhớ", example:"Memorize common question patterns."},
{term:"recall", meaning:"nhớ lại", example:"Try to recall the first few words of the question."},
{term:"instinct", meaning:"bản năng, trực giác", example:"Trust your instinct if you're unsure."},
{term:"guess", meaning:"đoán", example:"A smart guess is better than leaving it blank."},
{term:"reflex", meaning:"phản xạ", example:"Build a fast reflex for common questions."},
{term:"automatic", meaning:"tự động", example:"Your response should feel almost automatic."},
{term:"spontaneous", meaning:"tự phát, tự nhiên", example:"A spontaneous reaction is often correct."},
{term:"deliberate", meaning:"có chủ đích, thận trọng", example:"Don't overthink; avoid being too deliberate."},
{term:"hesitate", meaning:"do dự", example:"Don't hesitate too long before choosing."},
{term:"pause", meaning:"sự dừng lại", example:"A short pause between questions is normal."},
{term:"fluency", meaning:"sự trôi chảy", example:"Fluency in listening takes regular practice."},
{term:"rhythm", meaning:"nhịp điệu", example:"Get used to the rhythm of natural speech."},
{term:"flow", meaning:"mạch, luồng", example:"Follow the flow of the conversation."},
{term:"pace", meaning:"nhịp độ", example:"Match the pace of the audio."},
]},
{label:'Thứ 6', title:'Nghe lại transcript & tổng kết tuần', content:'Nghe lại toàn bộ audio đã luyện trong tuần kèm xem transcript giúp phát hiện những từ/cụm từ bạn nghe sai do chưa quen phát âm, dù có thể bạn đã biết nghĩa của từ đó khi đọc.', exercises:["Nghe lại toàn bộ Part 1-2 đã luyện trong tuần, đối chiếu transcript, ghi ra sổ từ vựng những từ nghe chưa quen dù đã biết nghĩa.","Tổng hợp toàn bộ từ mới của tuần vào 1 danh sách, sắp xếp theo chủ đề.","Tự đọc to lại toàn bộ transcript đã nghe trong tuần để luyện phát âm và làm quen nhịp điệu câu.","Tổng hợp toàn bộ từ vựng Part 1-2 đã học cả tuần vào 1 danh sách duy nhất, sắp xếp theo chủ đề.","Tự làm 1 bài test nhỏ: nghe 5 câu ngẫu nhiên đã học trong tuần, viết lại nội dung nghe được."], quiz:[
{q:"Nghe lại transcript (bản ghi lời thoại) sau khi luyện đề có tác dụng gì?", opts:["Không có tác dụng gì", "Đối chiếu những gì nghe được với văn bản thật để tìm lỗi", "Chỉ để đọc cho vui", "Làm mất thời gian ôn tập"], correct:1, explain:"Đối chiếu giúp xác định chính xác điểm nghe sai hoặc bỏ lỡ."},
{q:"Vì sao nên đọc transcript SAU khi nghe, không phải trước?", opts:["Không có lý do gì", "Để không bị phụ thuộc vào việc đọc, rèn kỹ năng nghe thật sự", "Vì đọc trước sẽ mất thời gian", "Không có sự khác biệt"], correct:1, explain:"Đọc trước sẽ khiến bài luyện mất tác dụng rèn kỹ năng nghe thuần túy."},
{q:"Việc so sánh transcript với ghi chú nghe của mình giúp ích gì?", opts:["Không giúp ích gì", "Phát hiện chính xác từ/cụm từ nào nghe sai hoặc bỏ lỡ", "Chỉ để đối chiếu cho vui", "Gây nhầm lẫn thêm"], correct:1, explain:"So sánh trực tiếp cho thấy rõ khoảng cách giữa nghe thực tế và văn bản gốc."},
{q:"Sau khi hoàn thành tuần 3, người học đã luyện được kỹ năng nào chính?", opts:["Chỉ ngữ pháp", "Từ vựng Part 1 và các dạng câu hỏi Part 2", "Chỉ Reading", "Không có kỹ năng cụ thể"], correct:1, explain:"Tuần 3 tập trung vào từ vựng Part 1 và các dạng câu hỏi đặc trưng của Part 2."},
{q:"Tổng kết tuần nên bao gồm việc gì?", opts:["Không cần tổng kết gì", "Ôn lại từ vựng và các lỗi sai đã ghi nhận trong tuần", "Chỉ cần nghỉ ngơi", "Bỏ qua toàn bộ nội dung đã học"], correct:1, explain:"Tổng kết là cơ hội củng cố lại toàn bộ kiến thức đã học trong tuần."},
{q:"Việc luyện nghe transcript nhiều lần có nên dừng lại ở 1 lần không?", opts:["Đúng, chỉ cần 1 lần", "Không, nên nghe lại nhiều lần để củng cố", "Không bao giờ cần nghe lại", "Chỉ cần đọc, không cần nghe"], correct:1, explain:"Lặp lại nhiều lần giúp củng cố trí nhớ và phản xạ nghe tốt hơn."},
{q:"Kỹ năng nghe hiểu có cải thiện nhanh trong 1 tuần không?", opts:["Có, hoàn thiện ngay sau 1 tuần", "Cải thiện dần, cần kiên trì luyện tập nhiều tuần", "Không thể cải thiện được", "Chỉ cải thiện nếu có năng khiếu đặc biệt"], correct:1, explain:"Nghe hiểu là kỹ năng cần thời gian tích lũy, không thể vội vàng trong 1 tuần."},
{q:"Sau tuần 3, trọng tâm tuần 4 sẽ chuyển sang gì theo lộ trình?", opts:["Học lại từ đầu", "Ngữ pháp Part 5 nâng cao và tổng kết tháng 1", "Ngừng học TOEIC", "Chỉ học từ vựng mới"], correct:1, explain:"Tuần 4 chuyển trọng tâm sang Reading Part 5 nâng cao và tổng kết toàn tháng."},
{q:"Việc ghi chú riêng từ vựng khó nghe có ích gì?", opts:["Không có ích gì", "Tạo tài liệu ôn tập cá nhân hóa theo đúng điểm yếu", "Chỉ để trang trí sổ tay", "Làm mất thời gian không cần thiết"], correct:1, explain:"Sổ từ vựng cá nhân là tài liệu ôn tập hiệu quả vì đúng trọng tâm điểm yếu của bạn."},
{q:"Đây là hoạt động nên duy trì ở mức độ nào trong suốt quá trình học TOEIC?", opts:["Chỉ 1 lần duy nhất", "Thường xuyên, không chỉ 1 lần duy nhất", "Không cần duy trì", "Chỉ khi gần thi"], correct:1, explain:"Nghe lại transcript nên là thói quen duy trì xuyên suốt quá trình học, không chỉ 1 lần."},
], vocab:[
{term:"transcript", meaning:"bản ghi lời thoại", example:"Read the transcript after listening."},
{term:"compare", meaning:"so sánh", example:"Compare what you heard with the transcript."},
{term:"accurate", meaning:"chính xác", example:"Check how accurate your notes were."},

{title:"Reading Part 5 nâng cao & tổng kết tháng 1", points:["Part 5 thường kiểm tra từ loại (danh từ/động từ/tính từ/trạng từ) qua vị trí trống trong câu.","Xác định vị trí từ cần điền trước, sau đó mới xét nghĩa — nhiều câu chỉ cần biết từ loại là chọn được đáp án.","Học nhóm từ đi kèm cố định (collocations) như \"make a decision\", \"take responsibility\".","Không cần dịch toàn bộ câu để làm Part 5 — kỹ năng nhận diện cấu trúc quan trọng hơn hiểu 100% nghĩa.","Cuối tháng 1: làm lại 1 đề thử để so sánh tiến bộ so với tuần 1."], practice:"Làm 1 đề mini (Listening Part 1-2 + Reading Part 5, khoảng 30 câu) có tính giờ, so sánh điểm với tuần 1.", case:"Thí sinh đạt 800+ thường không giỏi vượt trội mọi thứ, mà làm rất chắc các câu Part 5 và Part 1-2 — đây là 'điểm sàn an toàn' của hầu hết thí sinh điểm cao.", task:"Làm 1 đề mini (Listening Part 1-2 + Reading Part 5, khoảng 30 câu) có tính giờ, so sánh điểm với tuần 1.", days:[
{label:'Thứ 2', title:'Nhận diện từ loại qua vị trí trong câu', content:'Phần lớn câu hỏi Part 5 có thể giải bằng cách xác định từ loại cần điền dựa vào VỊ TRÍ trong câu, không cần hiểu 100% nghĩa cả câu. Ví dụ: sau tính từ sở hữu (their, his) hoặc mạo từ (a, the) thường là danh từ; đứng trước danh từ thường là tính từ.', example:'Their ___ (decision) was final.  → cần danh từ (decision)\nShe made a ___ (quick) decision. → cần tính từ (quick)', exercises:["Làm 10 câu Part 5 chỉ tập trung xác định từ loại cần điền (không cần dịch nghĩa cả câu), đối chiếu đáp án.","Với mỗi câu đã làm, viết ra lý do từ loại bạn chọn đáp án đó.","Tự tạo 3 câu Part 5 mới dựa trên cấu trúc câu bạn vừa phân tích, tự đố lại bản thân.","Tự tạo 5 câu Part 5 mới có chỗ trống cần điền đúng từ loại, đổi cho bạn học cùng (nếu có) để giải chéo.","Ôn lại quy tắc vị trí tính từ/danh từ/trạng từ bằng cách tự vẽ sơ đồ đơn giản trên giấy."], quiz:[
{q:"Tính từ thường đứng ở vị trí nào trong câu?", opts:["Cuối câu luôn luôn", "Trước danh từ hoặc sau động từ to be", "Đầu câu", "Không có vị trí cố định"], correct:1, explain:"Đây là 2 vị trí phổ biến nhất của tính từ trong câu tiếng Anh."},
{q:"Trạng từ thường đứng ở vị trí nào?", opts:["Chỉ đứng đầu câu", "Trước động từ chính hoặc cuối câu", "Chỉ giữa 2 danh từ", "Không tồn tại vị trí cố định"], correct:1, explain:"Trạng từ linh hoạt hơn nhưng phổ biến nhất ở 2 vị trí này."},
{q:"Danh từ thường đóng vai trò gì trong câu?", opts:["Chỉ làm vị ngữ", "Chủ ngữ hoặc tân ngữ", "Chỉ làm trạng từ", "Không có vai trò cụ thể"], correct:1, explain:"Danh từ là thành phần cốt lõi làm chủ ngữ hoặc tân ngữ trong câu."},
{q:"Câu \"This is a very ___ solution\" cần điền từ loại gì?", opts:["Danh từ", "Tính từ", "Trạng từ", "Động từ"], correct:1, explain:"Trước danh từ \"solution\" cần tính từ để bổ nghĩa."},
{q:"Câu \"He ___ completed the task\" (trước động từ) cần điền từ loại gì?", opts:["Danh từ", "Tính từ", "Trạng từ", "Giới từ"], correct:2, explain:"Trước động từ chính, cần trạng từ để bổ nghĩa cho hành động."},
{q:"Vì sao nhận diện từ loại qua vị trí quan trọng cho Part 5?", opts:["Không quan trọng", "Giúp chọn đúng đáp án mà không cần biết nghĩa chính xác của từ", "Chỉ có ích cho người mới học", "Không áp dụng được trong thực tế"], correct:1, explain:"Đây là chiến thuật mạnh giúp giải nhanh Part 5 dù chưa biết hết nghĩa từ."},
{q:"Hậu tố nào thường gặp ở tính từ?", opts:["-tion, -ment", "-ful, -ive, -able, -al", "-ly", "-ize"], correct:1, explain:"Đây là các hậu tố phổ biến tạo thành tính từ trong tiếng Anh."},
{q:"Hậu tố nào thường gặp ở trạng từ?", opts:["-tion", "-ful", "-ly", "-ness"], correct:2, explain:"-ly là hậu tố đặc trưng nhất của trạng từ."},
{q:"Hậu tố nào thường gặp ở danh từ?", opts:["-ly", "-tion, -ment, -ness, -ity", "-ive", "-al"], correct:1, explain:"Đây là nhóm hậu tố phổ biến nhất tạo thành danh từ."},
{q:"Kỹ năng nhận diện từ loại có áp dụng được cho từ vựng chưa từng gặp không?", opts:["Không áp dụng được", "Có, đây là điểm mạnh của phương pháp này", "Chỉ áp dụng với từ đã biết", "Không liên quan gì đến từ vựng mới"], correct:1, explain:"Nhận diện qua vị trí/hậu tố giúp đoán đúng dù chưa biết nghĩa chính xác của từ."},

{label:'Thứ 3', title:'Học collocation thường gặp', content:'Collocation là các cụm từ đi kèm cố định theo thói quen ngôn ngữ (ví dụ "make a decision" chứ không phải "do a decision"). Nhiều câu Part 5-6 kiểm tra chính xác kiến thức collocation này thay vì ngữ pháp thuần túy.', exercises:["Học 15 collocation thường gặp trong đề thi TOEIC (chủ đề công sở), viết mỗi collocation kèm 1 câu ví dụ.","Viết 5 câu ví dụ tự nghĩ ra có sử dụng đúng các collocation vừa học.","Ghép các collocation đã học thành 1 đoạn email công sở ngắn hoàn chỉnh.","Viết 1 email công sở ngắn (4-5 câu) cố gắng dùng ít nhất 5 collocation vừa học.","Tự kiểm tra: che phần nghĩa, chỉ nhìn collocation tiếng Anh, thử nhớ lại nghĩa tiếng Việt."], quiz:[
{q:"Collocation là gì?", opts:["Cụm từ đi kèm nhau theo thói quen ngôn ngữ, không dịch từng từ riêng lẻ", "Một loại thì động từ", "Một dạng câu hỏi Part 2", "Tên gọi khác của từ đồng nghĩa"], correct:0, explain:"Collocation là các từ thường xuất hiện cùng nhau theo thói quen ngôn ngữ tự nhiên."},
{q:"\"responsible ___\" cần giới từ gì?", opts:["of", "for", "with", "at"], correct:1, explain:"Cụm cố định \"responsible for\" (chịu trách nhiệm về)."},
{q:"\"in charge ___\" cần giới từ gì?", opts:["of", "for", "with", "on"], correct:0, explain:"Cụm cố định \"in charge of\" (phụ trách)."},
{q:"\"depend ___\" cần giới từ gì?", opts:["of", "for", "with", "on"], correct:3, explain:"Cụm cố định \"depend on\" (phụ thuộc vào)."},
{q:"\"look forward ___\" cần giới từ gì?", opts:["to", "for", "at", "on"], correct:0, explain:"Cụm cố định \"look forward to\" + V-ing (mong chờ)."},
{q:"Vì sao không nên dịch collocation theo nghĩa đen từng từ?", opts:["Không có lý do gì", "Vì nghĩa của cụm từ khác với nghĩa ghép từng từ riêng lẻ", "Vì dịch từng từ luôn đúng", "Vì collocation không có nghĩa"], correct:1, explain:"Collocation cần học như 1 khối cố định, dịch từng từ dễ gây hiểu sai."},
{q:"\"comply ___\" cần giới từ gì?", opts:["with", "for", "at", "on"], correct:0, explain:"Cụm cố định \"comply with\" (tuân thủ)."},
{q:"Cách học collocation hiệu quả nhất là gì?", opts:["Học từng từ riêng lẻ", "Học theo cụm cố định, không tách rời từng từ", "Không cần học, chỉ cần đoán", "Chỉ cần học nghĩa của giới từ"], correct:1, explain:"Ghi nhớ nguyên cụm giúp phản xạ đúng khi gặp trong bài thi."},
{q:"Collocation thường xuất hiện nhiều nhất ở Part nào của TOEIC?", opts:["Chỉ Part 1", "Part 5 và Part 6", "Chỉ Part 2", "Không xuất hiện ở Part nào"], correct:1, explain:"Đây là 2 Part kiểm tra ngữ pháp và từ vựng, nơi collocation xuất hiện nhiều nhất."},
{q:"\"arrive ___\" (địa điểm cụ thể) cần giới từ gì?", opts:["at", "in", "on", "to"], correct:0, explain:"Cụm cố định \"arrive at\" + địa điểm/sự kiện cụ thể."},

{label:'Thứ 4', title:'Luyện Part 5 tổng hợp có tính giờ', content:'Kết hợp toàn bộ kiến thức đã học trong tháng: nhận diện thì động từ, từ loại theo vị trí, và collocation — luyện với tốc độ tính giờ để quen áp lực thời gian thật.', exercises:["Làm hết bộ quiz bên dưới trong 1 lần, cố gắng dưới 10 phút, không xem lại lý thuyết.","Phân loại các câu sai xem thuộc nhóm lỗi thì động từ, từ loại, hay collocation để biết đang yếu phần nào nhất.","Đợi 1 ngày rồi làm lại bộ quiz này lần 2 (không xem đáp án cũ), so sánh điểm số.","Ôn lại các câu sai trong bộ quiz, phân loại theo 3 nhóm: lỗi thì động từ, lỗi từ loại, lỗi collocation.","Làm lại quiz lần 2 sau khi đã ôn lỗi, so sánh điểm số cải thiện được bao nhiêu."], quiz:[
{q:"The finance team ___ the budget every quarter.", opts:["review","reviews","is reviewing","reviewed"], correct:1, explain:"\"every quarter\" chỉ thói quen lặp lại → hiện tại đơn."},
{q:"Look, the shipment ___ right now — go check it.", opts:["arrives","arrived","is arriving","has arrived"], correct:2, explain:"\"Look\" + \"right now\" là dấu hiệu của hiện tại tiếp diễn."},
{q:"We ___ this vendor since 2019.", opts:["use","used","have used","are using"], correct:2, explain:"\"since 2019\" → hiện tại hoàn thành."},
{q:"He ___ his resignation letter last Friday.", opts:["has submitted","submitted","submits","is submitting"], correct:1, explain:"\"last Friday\" là mốc thời gian xác định trong quá khứ → quá khứ đơn."},
{q:"The new intern is very ___.", opts:["hardworking","hardworkingly","hardwork","hardworked"], correct:0, explain:"Sau to be \"is\" cần tính từ → hardworking."},
{q:"She completed the task ___.", opts:["efficient","efficiently","efficiency","efficacious"], correct:1, explain:"Trạng từ bổ nghĩa cho động từ \"completed\", đứng cuối câu → efficiently."},
{q:"This decision will have a major ___ on our budget.", opts:["impact","impactful","impactfully","impacted"], correct:0, explain:"Sau tính từ \"major\" cần danh từ → impact."},
{q:"The manager is ___ for approving all expenses.", opts:["response","responsible","responsibly","responsibility"], correct:1, explain:"Sau to be \"is\" cần tính từ → responsible (responsible for)."},
{q:"Please comply ___ the new safety regulations.", opts:["with","to","for","at"], correct:0, explain:"Cụm cố định \"comply with\" (tuân thủ)."},
{q:"The proposal is subject ___ approval by the board.", opts:["to","of","with","for"], correct:0, explain:"Cụm cố định \"subject to\" (tùy thuộc vào, cần được)."},
{q:"They ___ two more staff members next month.", opts:["hire","hires","are hiring","hired"], correct:2, explain:"Kế hoạch tương lai đã sắp xếp (\"next month\") → hiện tại tiếp diễn."},
{q:"He has never ___ such a difficult client before.", opts:["handled","handle","handling","was handling"], correct:0, explain:"\"never ... before\" là dấu hiệu của hiện tại hoàn thành; sau \"has\" cần past participle → handled."},
{q:"The equipment ___ regularly to avoid breakdowns.", opts:["inspect","inspects","is inspected","inspected"], correct:1, explain:"Quy trình thường xuyên → hiện tại đơn (chủ ngữ số ít thêm -s; đây không phải câu bị động nên chọn dạng chủ động thường gặp trong đề)."},
{q:"Our goal is to provide ___ service to every customer.", opts:["exceptional","exceptionally","exception","except"], correct:0, explain:"Cần tính từ đứng trước danh từ \"service\" → exceptional."},
{q:"The department relies heavily ___ customer feedback.", opts:["on","at","with","to"], correct:0, explain:"Cụm cố định \"rely on\" (dựa vào, phụ thuộc vào)."},

{label:'Thứ 5', title:'Làm đề mini tổng hợp', content:'Đề mini kết hợp Part 1-2 (Listening) và Part 5 (Reading) là bài kiểm tra tổng thể đầu tiên sau 4 tuần học có hệ thống — giúp đánh giá khách quan mức độ tiến bộ so với đề thử ban đầu ở tuần 1.', exercises:["Làm 1 đề mini khoảng 30 câu (Part 1-2 + Part 5) có tính giờ nghiêm ngặt như thi thật.","Ghi lại chính xác thời gian làm từng Part trong đề mini, so với mốc thời gian gợi ý.","Highlight lại 3 câu bạn tự tin nhất và 3 câu bạn không chắc nhất để phân tích riêng sau.","Trước khi làm đề, dự đoán trước điểm số bạn nghĩ mình sẽ đạt được, so sánh với kết quả thật.","Highlight lại 3 câu bạn tự tin nhất và 3 câu không chắc chắn nhất trong đề vừa làm."], quiz:[
{q:"Đề mini tổng hợp nên bao gồm những Part nào đã học?", opts:["Chỉ Part 7", "Part 1, 2, 5 (những phần đã học sâu trong tháng 1)", "Toàn bộ 7 Part dù chưa học hết", "Không cần theo Part cụ thể"], correct:1, explain:"Đề mini nên tập trung đúng những phần đã được học kỹ trong tháng 1."},
{q:"Vì sao nên làm đề mini có tính giờ thay vì không giới hạn thời gian?", opts:["Không cần thiết", "Để quen với áp lực thời gian thật của đề thi", "Chỉ để tạo áp lực không cần thiết", "Vì không có sự khác biệt"], correct:1, explain:"Luyện tính giờ giúp làm quen với nhịp độ và áp lực của bài thi thật."},
{q:"Sau khi làm đề mini, bước quan trọng tiếp theo là gì?", opts:["Không cần làm gì thêm", "Chấm điểm và phân tích lỗi sai chi tiết", "Quên kết quả ngay", "Làm đề khác luôn không cần xem lại"], correct:1, explain:"Chấm điểm và phân tích là bước biến kết quả thành bài học thực sự."},
{q:"So sánh điểm đề mini với đề thử tuần 1 có ý nghĩa gì?", opts:["Không có ý nghĩa gì", "Đo lường mức độ tiến bộ sau 1 tháng học", "Chỉ để so sánh cho vui", "Gây áp lực không cần thiết"], correct:1, explain:"Đây là cách khách quan nhất để đánh giá hiệu quả của quá trình học tháng 1."},
{q:"Nếu điểm đề mini không cải thiện nhiều, nên làm gì?", opts:["Bỏ học TOEIC", "Xem lại phương pháp học, tăng cường ôn tập điểm yếu", "Không cần thay đổi gì", "Chỉ cần làm thêm nhiều đề mà không phân tích"], correct:1, explain:"Điểm không cải thiện là tín hiệu cần điều chỉnh cách học, không phải lý do bỏ cuộc."},
{q:"Đề mini khác đề thi thật ở điểm nào?", opts:["Không khác gì", "Ngắn hơn, chỉ tập trung vào các Part đã học", "Dài hơn đề thi thật", "Không có đáp án"], correct:1, explain:"Đề mini được thiết kế gọn để phù hợp với tiến độ học tập hiện tại."},
{q:"Việc làm đề định kỳ hàng tháng có lợi ích gì?", opts:["Không có lợi ích gì", "Theo dõi xu hướng tiến bộ một cách khách quan", "Chỉ để lấy điểm số", "Gây căng thẳng không cần thiết"], correct:1, explain:"Làm đề định kỳ tạo ra chuỗi dữ liệu để theo dõi tiến bộ theo thời gian."},
{q:"Kỹ năng quản lý thời gian có nên luyện qua đề mini không?", opts:["Không cần thiết", "Có, đây là kỹ năng quan trọng cần luyện sớm", "Chỉ cần luyện khi gần thi thật", "Không liên quan đến đề mini"], correct:1, explain:"Luyện quản lý thời gian sớm giúp hình thành thói quen tốt trước khi thi thật."},
{q:"Sau khi hoàn thành đề mini, nên ăn mừng hay tiếp tục căng thẳng?", opts:["Luôn phải căng thẳng", "Ghi nhận nỗ lực, giữ tinh thần tích cực để duy trì động lực", "Không cần quan tâm cảm xúc", "Chỉ nên buồn nếu điểm thấp"], correct:1, explain:"Duy trì tinh thần tích cực quan trọng cho hành trình học dài hạn."},
{q:"Đề mini tháng 1 chuẩn bị nền tảng gì cho các tháng tiếp theo?", opts:["Không chuẩn bị gì cả", "Thói quen làm đề có tính giờ và tự phân tích lỗi sai", "Chỉ để lấy điểm số cao", "Không liên quan đến các tháng sau"], correct:1, explain:"Đây là kỹ năng nền tảng sẽ được lặp lại và nâng cao dần qua các tháng học tiếp theo."},

{label:'Thứ 6', title:'Tổng kết tháng 1 & lên kế hoạch tháng 2', content:'So sánh điểm đề mini hôm nay với đề thử ở tuần 1 — nếu có tiến bộ dù nhỏ, đó là tín hiệu tốt cho thấy phương pháp học đang đúng hướng. Tháng 2 sẽ mở rộng sang Part 3-4 (Listening) và Part 6 (Reading), đòi hỏi nền tảng ngữ pháp và từ vựng đã xây trong tháng 1.', exercises:["So sánh chi tiết điểm số và số câu đúng theo từng Part giữa đề mini hôm nay và đề thử tuần 1, viết ra 2-3 điểm đã cải thiện rõ rệt nhất.","Viết 1 đoạn nhật ký học tập ngắn tổng kết cảm nhận sau tháng 1.","Đặt mục tiêu cụ thể (bằng số liệu) cho tháng 2, ví dụ: \"giảm số câu sai Part 3 xuống dưới X câu\".","Vẽ biểu đồ đơn giản (trên giấy) thể hiện điểm số qua 4 lần làm đề/quiz lớn trong tháng để thấy xu hướng tiến bộ.","Viết ra 3 mục tiêu cụ thể cho tháng 2 dựa trên điểm yếu đã xác định được trong tháng 1."], quiz:[
{q:"Thì nào dùng với dấu hiệu \"since 2020\"?", opts:["Hiện tại đơn","Quá khứ đơn","Hiện tại hoàn thành","Tương lai"], correct:2, explain:"\"since\" đi kèm mốc thời gian bắt đầu, là dấu hiệu của hiện tại hoàn thành."},
{q:"Thì nào dùng với dấu hiệu \"yesterday\"?", opts:["Hiện tại đơn","Quá khứ đơn","Hiện tại hoàn thành","Hiện tại tiếp diễn"], correct:1, explain:"\"yesterday\" là mốc thời gian xác định trong quá khứ → quá khứ đơn."},
{q:"Cấu trúc nào đúng: \"She is very ___\" (cần tính từ)?", opts:["success","successful","successfully","succeed"], correct:1, explain:"Sau to be \"is\" cần tính từ → successful."},
{q:"Cụm từ nào đúng nghĩa \"chịu trách nhiệm về\"?", opts:["responsible of","responsible for","responsible with","responsible at"], correct:1, explain:"Cụm cố định chuẩn là \"responsible for\"."},
{q:"Trong 4 tuần đã học, ngữ pháp thì và từ loại liên quan với nhau thế nào?", opts:["Không liên quan gì nhau, học riêng biệt","Cả 2 đều quan trọng và thường kết hợp trong cùng 1 câu Part 5","Chỉ có 1 loại kiến thức quan trọng","Chỉ từ loại quan trọng, thì không cần"], correct:1, explain:"Đề Part 5 thường kết hợp cả 2: vừa cần nhận diện thì đúng, vừa cần chọn đúng từ loại theo vị trí."},
{q:"Đề Part 5 thường kiểm tra điều gì nhiều nhất?", opts:["Chỉ từ vựng khó, hiếm gặp","Ngữ pháp và từ loại qua vị trí trong câu","Chỉ phát âm","Chỉ nghĩa của cả câu"], correct:1, explain:"Phần lớn câu Part 5 giải được bằng cách xác định đúng cấu trúc ngữ pháp/từ loại cần điền, không cần dịch cả câu."},
{q:"Nếu bạn hay sai dạng bài xác định từ loại, nên ôn tập gì?", opts:["Học thuộc từ vựng ngẫu nhiên không liên quan","Ôn lại quy tắc vị trí (trước/sau danh từ, động từ...) của từng từ loại","Bỏ qua, không cần ôn lại","Chỉ luyện nghe, không cần đọc"], correct:1, explain:"Nắm vững quy tắc vị trí từ loại giúp giải nhanh Part 5 mà không cần nhớ nghĩa từng từ."},
{q:"Việc làm đề mini hàng tuần có lợi ích gì?", opts:["Không có lợi ích rõ ràng","Giúp đo lường tiến bộ thực tế và làm quen áp lực thời gian","Chỉ để lấy điểm cao nhất thời","Chỉ cần làm đúng 1 lần duy nhất là đủ"], correct:1, explain:"Làm đề định kỳ giúp theo dõi xu hướng tiến bộ khách quan, thay vì chỉ cảm nhận chủ quan."},
{q:"Sau tháng 1, trọng tâm tháng 2 nên là gì theo lộ trình đã học?", opts:["Học lại toàn bộ tháng 1 từ đầu","Mở rộng sang Part 3-4 Listening và Part 6-7 Reading","Ngừng học TOEIC","Chỉ học từ vựng, bỏ ngữ pháp"], correct:1, explain:"Tháng 2 xây dựng trên nền tảng tháng 1, mở rộng sang các Part khó hơn (hội thoại, đoạn văn dài)."},
{q:"Cách ôn tập hiệu quả nhất khi có nhiều lỗi sai là gì?", opts:["Ôn tất cả kiến thức từ đầu như chưa học gì","Phân loại lỗi sai theo nhóm, ưu tiên ôn nhóm sai nhiều nhất","Bỏ qua lỗi sai, học tiếp bài mới","Chỉ ôn 1 lần duy nhất là đủ"], correct:1, explain:"Ôn tập có trọng tâm (dựa trên thống kê lỗi sai thực tế) hiệu quả hơn nhiều so với ôn lan man toàn bộ."},
{q:"Chủ đề từ vựng nào ĐÃ được học trong tháng 1?", opts:["Y học chuyên sâu","Công sở cơ bản, hành động/vị trí (Part 1), câu hỏi giao tiếp (Part 2)","Chỉ toán học nâng cao","Chỉ lịch sử thế giới"], correct:1, explain:"Tháng 1 tập trung từ vựng nền tảng: công sở, mô tả hành động/vị trí, và các dạng câu hỏi giao tiếp cơ bản."},
{q:"Điều gì quan trọng nhất để đạt 800+ sau khi hoàn thành lộ trình 4 tháng?", opts:["Chỉ cần học lý thuyết, không cần luyện đề","Luyện tập đều đặn, làm nhiều đề thử, và ôn đúng trọng tâm lỗi sai của bản thân","Học thuộc lòng toàn bộ từ điển tiếng Anh","Chỉ cần may mắn khi đi thi"], correct:1, explain:"Sự đều đặn kết hợp với ôn tập có trọng tâm (dựa trên lỗi sai thực tế) là yếu tố quyết định thành công, quan trọng hơn học lý thuyết suông."},

{title:"Listening Part 3 — hội thoại ngắn", points:["Part 3 là hội thoại 2-3 người, mỗi bài có 3 câu hỏi liên quan.","Đọc trước câu hỏi và đáp án trước khi nghe giúp biết cần chú ý thông tin gì.","Câu hỏi cuối cùng mỗi bài thường liên quan ý định/hành động tiếp theo — cần nghe đến cuối đoạn.","Ghi chú nhanh (note-taking) các con số, tên, thời gian nhắc đến trong lúc nghe.","Một số câu hỏi kèm hình ảnh/biểu đồ yêu cầu kết hợp thông tin nghe được với hình."], practice:"Làm 3 bài hội thoại Part 3 (9 câu), sau đó nghe lại và note ra những từ khóa quan trọng đã bỏ lỡ.", case:"Part 3 là phần nhiều thí sinh mất điểm nhất vì tốc độ hội thoại nhanh và có 3 câu hỏi dồn dập cho 1 bài nghe.", task:"Làm 3 bài hội thoại Part 3 (9 câu), sau đó nghe lại và note ra những từ khóa quan trọng đã bỏ lỡ.", days:[
{label:'Thứ 2', title:'Cấu trúc Part 3 & chiến thuật đọc trước câu hỏi', content:'Part 3 gồm 13 đoạn hội thoại ngắn (2-3 người), mỗi đoạn có 3 câu hỏi, tổng 39 câu — chiếm phần lớn số câu trong Listening. Chiến thuật quan trọng nhất: đọc trước cả 3 câu hỏi và đáp án TRƯỚC khi audio bắt đầu, để biết cần chú ý thông tin gì trong lúc nghe. Vì chỉ nghe được 1 lần duy nhất, không có cơ hội nghe lại như luyện tập ở nhà — kỹ năng đọc trước và ghi chú nhanh cực kỳ quan trọng.', exercises:["Làm 2 đoạn hội thoại Part 3 (6 câu), thử áp dụng kỹ thuật đọc trước câu hỏi trong 5-8 giây trước khi nghe.","So sánh kết quả làm bài khi đọc trước câu hỏi và khi không đọc trước, ghi nhận sự khác biệt.","Luyện đọc nhanh 3 câu hỏi + 4 đáp án mỗi câu trong thời gian ngắn (khoảng 8 giây) để quen tốc độ.","Ghi chú lại 5 từ khóa (keyword) bạn thường gạch chân khi đọc trước câu hỏi Part 3.","Tìm hiểu vì sao Part 3 chỉ phát audio 1 lần duy nhất trong đề thi thật (khác luyện tập có thể tua lại)."], quiz:[
{q:"Part 3 có tổng cộng bao nhiêu đoạn hội thoại?", opts:["6", "13", "20", "30"], correct:1, explain:"Part 3 gồm 13 đoạn hội thoại, mỗi đoạn 3 câu hỏi, tổng 39 câu."},
{q:"Mỗi đoạn hội thoại Part 3 có bao nhiêu câu hỏi?", opts:["1", "2", "3", "5"], correct:2, explain:"Mỗi đoạn hội thoại đi kèm đúng 3 câu hỏi liên quan."},
{q:"Chiến thuật quan trọng nhất khi làm Part 3 là gì?", opts:["Nghe kỹ từng từ một", "Đọc trước câu hỏi và đáp án trước khi audio bắt đầu", "Không cần đọc gì trước", "Chỉ cần nghe từ đầu đến cuối"], correct:1, explain:"Đọc trước giúp biết cần chú ý thông tin gì trong lúc nghe, tăng hiệu quả đáng kể."},
{q:"Đoạn hội thoại Part 3 được phát mấy lần trong đề thi thật?", opts:["3 lần", "2 lần", "1 lần duy nhất", "Không giới hạn"], correct:2, explain:"Khác với luyện tập có thể nghe lại, đề thi thật chỉ phát 1 lần duy nhất."},
{q:"Part 3 là hội thoại giữa mấy người?", opts:["Chỉ 1 người", "2-3 người", "Luôn 4 người", "Không xác định"], correct:1, explain:"Part 3 là hội thoại ngắn giữa 2 hoặc 3 người."},
{q:"Vì sao cần đọc trước TẤT CẢ 3 câu hỏi thay vì chỉ câu đầu tiên?", opts:["Không cần thiết", "Để nắm được toàn bộ thông tin cần chú ý xuyên suốt cả đoạn hội thoại, không chỉ phần đầu", "Chỉ câu đầu quan trọng", "Đọc trước gây mất thời gian không cần thiết"], correct:1, explain:"Thông tin cho 3 câu hỏi trải đều trong đoạn hội thoại, cần biết trước để không bỏ lỡ."},
{q:"Thời gian đọc trước câu hỏi Part 3 thường có khoảng bao lâu?", opts:["Không có thời gian nào", "Vài giây (khoảng 8 giây) trước khi audio bắt đầu", "5 phút", "Không giới hạn"], correct:1, explain:"Khoảng thời gian ngắn giữa các đoạn chỉ đủ để đọc nhanh câu hỏi, cần luyện tốc độ."},
{q:"Part 3 thường được đánh giá là phần nào của Listening?", opts:["Dễ nhất", "Phần nhiều thí sinh mất điểm nhất do tốc độ nhanh và 3 câu hỏi dồn dập", "Không quan trọng", "Ít câu hỏi nhất"], correct:1, explain:"Đây là phần chiếm nhiều câu hỏi nhất và có độ khó cao do tốc độ hội thoại tự nhiên."},
{q:"Đáp án của Part 3 có hiển thị sẵn trên giấy để nhìn không?", opts:["Không, phải tự nghĩ ra đáp án", "Có, câu hỏi và 4 đáp án đều in sẵn trên đề, chỉ cần chọn", "Chỉ có câu hỏi, không có đáp án", "Không có gì hiển thị"], correct:1, explain:"Khác Part 2, Part 3 có đầy đủ câu hỏi và đáp án in sẵn để đọc trước."},
{q:"Kỹ năng ghi chú nhanh (note-taking) quan trọng thế nào với Part 3?", opts:["Không quan trọng", "Giúp ghi lại nhanh các thông tin (số liệu, tên, thời gian) trong lúc nghe để trả lời chính xác", "Chỉ cần trí nhớ, không cần ghi chú", "Ghi chú làm mất tập trung"], correct:1, explain:"Ghi chú nhanh giúp không phải phụ thuộc hoàn toàn vào trí nhớ ngắn hạn."},

{label:'Thứ 3', title:'Nhận diện chủ đề hội thoại thường gặp', content:'Chủ đề hội thoại Part 3 thường xoay quanh: công sở (họp hành, deadline, phân công công việc), mua sắm/dịch vụ khách hàng, du lịch/đặt vé, sự kiện công ty. Nhận diện được chủ đề ngay từ vài giây đầu giúp dự đoán từ vựng và luồng thông tin sắp nghe, tăng khả năng bắt đúng ý chính dù có 1-2 từ nghe không rõ.', exercises:["Liệt kê 4 chủ đề hội thoại Part 3 phổ biến nhất, học 5 từ vựng đặc trưng cho mỗi chủ đề.","Làm 3 đoạn hội thoại Part 3, thử đoán chủ đề chỉ dựa vào câu đầu tiên nghe được.","Học 10 từ vựng liên quan chủ đề công sở thường gặp trong Part 3 (deadline, schedule, assignment...).","Học 10 từ vựng liên quan chủ đề mua sắm/dịch vụ khách hàng (refund, receipt, complaint...).","Tự ghi âm 1 đoạn hội thoại ngắn (bằng tiếng Việt hoặc tiếng Anh) theo 1 trong 4 chủ đề để hiểu cấu trúc hội thoại thường gặp."], quiz:[
{q:"Chủ đề nào KHÔNG phổ biến trong Part 3?", opts:["Công sở (họp hành, deadline)", "Mua sắm/dịch vụ khách hàng", "Du lịch/đặt vé", "Nghiên cứu khoa học chuyên sâu"], correct:3, explain:"TOEIC tập trung vào tình huống công việc/đời sống thường ngày, không phải chủ đề học thuật chuyên sâu."},
{q:"Nhận diện chủ đề hội thoại sớm giúp ích gì?", opts:["Không giúp ích gì", "Dự đoán từ vựng và luồng thông tin sắp nghe, tăng khả năng bắt đúng ý chính", "Chỉ để giải trí", "Làm mất tập trung"], correct:1, explain:"Biết trước chủ đề giúp não bộ chuẩn bị sẵn ngữ cảnh, dễ hiểu hơn khi nghe."},
{q:"\"deadline\" thuộc chủ đề nào thường gặp trong Part 3?", opts:["Du lịch", "Công sở", "Ẩm thực", "Thời tiết"], correct:1, explain:"\"deadline\" (hạn chót) là từ vựng đặc trưng chủ đề công sở."},
{q:"\"refund\" thuộc chủ đề nào thường gặp trong Part 3?", opts:["Công sở", "Mua sắm/dịch vụ khách hàng", "Du lịch", "Thời tiết"], correct:1, explain:"\"refund\" (hoàn tiền) đặc trưng cho tình huống mua sắm/dịch vụ khách hàng."},
{q:"Vì sao vẫn có thể hiểu đúng ý chính dù nghe không rõ 1-2 từ?", opts:["Không thể, phải nghe rõ 100%", "Vì đã dự đoán được ngữ cảnh chủ đề, có thể suy luận từ còn lại", "May mắn đoán đúng", "Không có cách nào"], correct:1, explain:"Hiểu ngữ cảnh giúp bù đắp cho những chỗ nghe chưa rõ hoàn toàn."},
{q:"Chủ đề sự kiện công ty trong Part 3 thường liên quan gì?", opts:["Chỉ liên quan thời tiết", "Tiệc công ty, hội nghị, lễ kỷ niệm...", "Chỉ liên quan gia đình", "Không xuất hiện trong đề thi"], correct:1, explain:"Đây là 1 trong 4 nhóm chủ đề phổ biến nhất của Part 3."},
{q:"Học từ vựng theo chủ đề có hiệu quả hơn học ngẫu nhiên không?", opts:["Không có sự khác biệt", "Có, giúp liên kết từ vựng với ngữ cảnh cụ thể, dễ nhớ và áp dụng đúng hơn", "Học ngẫu nhiên luôn tốt hơn", "Không liên quan đến hiệu quả học"], correct:1, explain:"Học theo cụm chủ đề tạo liên kết ngữ nghĩa, giúp ghi nhớ và vận dụng tốt hơn."},
{q:"Vì sao nên đoán chủ đề chỉ dựa vào câu đầu tiên nghe được?", opts:["Không có lý do gì", "Để luyện phản xạ nhanh nhận diện ngữ cảnh ngay từ đầu đoạn hội thoại", "Vì không cần nghe tiếp", "Vì câu đầu luôn sai"], correct:1, explain:"Đây là bài luyện phản xạ giúp nhận diện chủ đề nhanh hơn trong đề thi thật."},
{q:"Chủ đề du lịch/đặt vé thường xuất hiện từ vựng nào?", opts:["Reservation, itinerary, boarding", "Deadline, meeting, report", "Refund, receipt, complaint", "Salary, promotion, interview"], correct:0, explain:"Đây là các từ đặc trưng cho chủ đề du lịch/đặt vé (đặt chỗ, hành trình, lên máy bay)."},
{q:"Việc tự ghi âm 1 đoạn hội thoại theo chủ đề có lợi ích gì?", opts:["Không có lợi ích gì", "Giúp hiểu sâu cấu trúc hội thoại thường gặp từ góc độ người tạo ra nội dung", "Chỉ để giải trí", "Làm mất thời gian không cần thiết"], correct:1, explain:"Tự tạo nội dung giúp hiểu rõ hơn cách thông tin được tổ chức trong 1 đoạn hội thoại điển hình."},

{label:'Thứ 4', title:'Câu hỏi suy luận ý định/hành động tiếp theo', content:'Câu hỏi cuối cùng trong bộ 3 câu của mỗi đoạn Part 3 thường hỏi về Ý ĐỊNH hoặc HÀNH ĐỘNG TIẾP THEO (\"What will the woman probably do next?\") — loại câu này đòi hỏi nghe đến tận cuối đoạn hội thoại, không thể trả lời sớm dù đã nghe đủ thông tin cho 2 câu đầu. Cần phân bổ sự chú ý đều trong suốt đoạn hội thoại, không \"buông lỏng\" sau khi đã có đáp án cho câu 1-2.', exercises:["Làm 3 đoạn hội thoại Part 3, đặc biệt tập trung vào câu hỏi cuối (dạng \"next action\") của mỗi đoạn.","Ghi chú lại các cụm từ tín hiệu thường báo trước hành động tiếp theo (I'll..., Let me..., Why don't we...).","Thử tự đoán trước hành động tiếp theo có thể xảy ra dựa vào ngữ cảnh, sau đó đối chiếu với đáp án đúng.","Phân tích 3 câu bạn từng làm sai dạng \"next action\", tìm ra nguyên nhân sai (nghe thiếu, đoán sai, phân tâm).","Luyện nghe trọn vẹn không dừng giữa chừng 5 đoạn hội thoại liên tiếp để quen giữ tập trung đến cuối."], quiz:[
{q:"Câu hỏi cuối cùng trong Part 3 thường hỏi về điều gì?", opts:["Tên nhân vật", "Ý định/hành động tiếp theo", "Thời tiết", "Giá cả sản phẩm"], correct:1, explain:"Câu hỏi thứ 3 (cuối) trong bộ 3 câu thường là dạng \"next action\"."},
{q:"Câu hỏi dạng \"next action\" đòi hỏi điều gì khi nghe?", opts:["Chỉ cần nghe đầu đoạn", "Nghe đến tận cuối đoạn hội thoại mới có đủ thông tin trả lời", "Không cần nghe gì cả", "Chỉ cần đoán ngẫu nhiên"], correct:1, explain:"Thông tin cho câu hỏi này thường xuất hiện ở cuối đoạn hội thoại."},
{q:"Cụm từ nào thường là tín hiệu báo trước hành động tiếp theo?", opts:["Yesterday, last week", "I'll..., Let me..., Why don't we...", "The weather is...", "How much does it cost"], correct:1, explain:"Các cụm từ này thường báo hiệu 1 hành động/đề nghị sắp xảy ra."},
{q:"Vì sao không nên \"buông lỏng\" sau khi đã trả lời được câu 1-2?", opts:["Không có lý do gì", "Câu hỏi thứ 3 vẫn cần thông tin ở cuối đoạn, bỏ lỡ sẽ mất điểm câu đó", "Câu 3 luôn dễ đoán", "Không ảnh hưởng gì đến điểm số"], correct:1, explain:"Cần duy trì tập trung xuyên suốt cả đoạn hội thoại, không chỉ đến khi đủ ý cho câu đầu."},
{q:"\"What will the woman probably do next?\" là dạng câu hỏi gì?", opts:["Hỏi về địa điểm", "Hỏi về hành động tiếp theo (next action)", "Hỏi về giá cả", "Hỏi về thời tiết"], correct:1, explain:"Đây là mẫu câu hỏi \"next action\" điển hình của Part 3."},
{q:"Kỹ năng nào giúp cải thiện khả năng trả lời câu hỏi \"next action\"?", opts:["Chỉ cần nghe từ đầu, bỏ qua phần sau", "Giữ tập trung đến hết đoạn và chú ý các tín hiệu đề nghị/dự định", "Không có kỹ năng nào giúp ích", "Chỉ cần đoán ngẫu nhiên"], correct:1, explain:"Duy trì tập trung và nhận diện tín hiệu ngôn ngữ là chìa khóa cho dạng câu hỏi này."},
{q:"Phân tích lỗi sai ở câu hỏi \"next action\" giúp ích gì?", opts:["Không có ích gì", "Tìm ra nguyên nhân cụ thể (nghe thiếu, đoán sai, phân tâm) để cải thiện đúng chỗ", "Chỉ để tự trách bản thân", "Làm mất động lực học"], correct:1, explain:"Hiểu rõ nguyên nhân sai giúp điều chỉnh chiến lược luyện tập hiệu quả hơn."},
{q:"Luyện nghe liên tục 5 đoạn không dừng giữa chừng có mục đích gì?", opts:["Không có mục đích cụ thể", "Quen với việc giữ tập trung liên tục như điều kiện thi thật", "Chỉ để tốn thời gian", "Không liên quan đến kỹ năng thi"], correct:1, explain:"Đề thi thật yêu cầu tập trung liên tục nhiều đoạn liên tiếp, cần luyện tập tương tự."},
{q:"Câu hỏi \"next action\" có thể trả lời được ngay từ đầu đoạn không?", opts:["Có, luôn trả lời được ngay", "Thường không, cần thông tin ở phần sau/cuối đoạn hội thoại", "Không bao giờ có thể trả lời", "Không liên quan đến vị trí thông tin"], correct:1, explain:"Đặc trưng của dạng câu này là thông tin xuất hiện muộn trong đoạn hội thoại."},
{q:"Vì sao dạng câu hỏi \"next action\" thường khó hơn 2 câu hỏi đầu?", opts:["Không khó hơn", "Đòi hỏi suy luận và ghi nhớ thông tin xuyên suốt đoạn, không chỉ 1 chi tiết cụ thể", "Vì có đáp án khó đọc hơn", "Vì luôn có từ vựng khó"], correct:1, explain:"Cần tổng hợp thông tin và duy trì tập trung lâu hơn so với các câu hỏi chi tiết đơn giản."},

{label:'Thứ 5', title:'Câu hỏi có hình ảnh/biểu đồ kèm theo', content:'Một số đoạn Part 3 (thường 2-3 trong tổng 13 đoạn) đi kèm hình ảnh/biểu đồ (lịch trình, bảng giá, sơ đồ) — câu hỏi yêu cầu KẾT HỢP thông tin nghe được với hình ảnh để trả lời, không thể chỉ dựa vào audio đơn thuần. Cần liếc nhanh hình ảnh trước khi nghe để biết loại thông tin nào (giá, thời gian, địa điểm) cần đối chiếu.', exercises:["Làm 2 đoạn hội thoại Part 3 có kèm hình ảnh/bảng biểu, luyện kỹ năng đọc nhanh bảng trước khi nghe.","Ghi chú lại loại thông tin thường xuất hiện trong hình ảnh kèm theo (giá, giờ, số phòng, tên người).","Thử tự vẽ 1 bảng lịch trình đơn giản rồi tự đặt 3 câu hỏi Part 3 kiểu kết hợp hình ảnh.","Phân tích vì sao dạng câu hỏi này khó hơn câu hỏi thông thường không có hình ảnh.","Luyện kỹ năng quét nhanh (scan) bảng biểu trong vài giây để tìm đúng thông tin cần đối chiếu."], quiz:[
{q:"Bao nhiêu trong tổng số 13 đoạn Part 3 thường kèm hình ảnh?", opts:["0", "Khoảng 2-3 đoạn", "Toàn bộ 13 đoạn", "10 đoạn"], correct:1, explain:"Chỉ 1 phần nhỏ (thường 2-3 đoạn) có kèm hình ảnh/biểu đồ."},
{q:"Câu hỏi kèm hình ảnh yêu cầu điều gì?", opts:["Chỉ cần nghe, không cần nhìn hình", "Kết hợp thông tin nghe được với hình ảnh để trả lời đúng", "Chỉ cần nhìn hình, không cần nghe", "Bỏ qua câu hỏi này"], correct:1, explain:"Đây là điểm đặc biệt: phải đối chiếu cả audio và hình ảnh mới trả lời đúng."},
{q:"Nên làm gì trước khi audio bắt đầu với câu hỏi có hình ảnh?", opts:["Không cần làm gì", "Liếc nhanh hình ảnh để biết loại thông tin cần chú ý (giá, giờ, địa điểm)", "Chỉ đọc câu hỏi, bỏ qua hình", "Nhắm mắt để tập trung nghe"], correct:1, explain:"Xem trước hình ảnh giúp biết cần đối chiếu loại thông tin nào khi nghe."},
{q:"Loại hình ảnh nào thường xuất hiện trong Part 3?", opts:["Chỉ có bản đồ thế giới", "Lịch trình, bảng giá, sơ đồ", "Chỉ có ảnh phong cảnh", "Không có loại hình ảnh cụ thể"], correct:1, explain:"Đây là các loại hình ảnh/bảng biểu thường gặp nhất trong dạng câu hỏi này."},
{q:"Vì sao dạng câu hỏi kèm hình ảnh khó hơn câu hỏi thông thường?", opts:["Không khó hơn", "Đòi hỏi xử lý đồng thời 2 nguồn thông tin (audio và hình ảnh) thay vì chỉ 1", "Vì hình ảnh luôn mờ", "Vì không có đáp án đúng"], correct:1, explain:"Xử lý song song 2 nguồn thông tin đòi hỏi kỹ năng cao hơn xử lý 1 nguồn duy nhất."},
{q:"Kỹ năng \"scan\" (quét nhanh) bảng biểu dùng để làm gì?", opts:["Không có tác dụng gì", "Tìm nhanh đúng thông tin cần đối chiếu trong thời gian ngắn trước khi nghe", "Đọc kỹ từng chi tiết trong bảng", "Chỉ dùng khi làm Part 7"], correct:1, explain:"Scan nhanh giúp tiết kiệm thời gian trong khoảng nghỉ ngắn giữa các đoạn."},
{q:"Nếu không kịp xem hình ảnh trước, nên làm gì?", opts:["Bỏ luôn câu hỏi đó", "Vừa nghe vừa cố gắng liếc nhanh hình ảnh song song, chọn đáp án hợp lý nhất có thể", "Dừng lại để xem kỹ hình", "Đoán hoàn toàn ngẫu nhiên không cần nghe"], correct:1, explain:"Trong tình huống không kịp chuẩn bị, vẫn nên cố gắng xử lý song song thay vì bỏ hẳn."},
{q:"Tự vẽ 1 bảng lịch trình rồi tự đặt câu hỏi có ích gì?", opts:["Không có ích gì", "Giúp hiểu logic cách câu hỏi kết hợp hình ảnh được xây dựng, từ đó làm bài thật hiệu quả hơn", "Chỉ để giải trí", "Làm mất thời gian ôn tập thật"], correct:1, explain:"Tự tạo ra dạng bài giúp hiểu sâu hơn cách đề thi thiết kế loại câu hỏi này."},
{q:"Câu hỏi kèm hình ảnh có phải dạng phổ biến nhất trong Part 3 không?", opts:["Có, chiếm đa số câu hỏi", "Không, chỉ là 1 phần nhỏ trong tổng 39 câu", "Chiếm đúng 50%", "Không xuất hiện trong đề thi thật"], correct:1, explain:"Phần lớn câu hỏi Part 3 vẫn là dạng thông thường không kèm hình ảnh."},
{q:"Vì sao cần luyện riêng kỹ năng xử lý câu hỏi kèm hình ảnh?", opts:["Không cần thiết", "Vì đây là dạng câu hỏi đặc thù, đòi hỏi kỹ năng khác với câu hỏi nghe thông thường", "Vì dạng này không xuất hiện trong đề thi", "Vì luôn dễ hơn câu hỏi thường"], correct:1, explain:"Kỹ năng xử lý song song audio và hình ảnh cần được luyện tập riêng biệt."},

{label:'Thứ 6', title:'Tổng kết tuần 9', content:'Part 3 là phần nhiều thí sinh mất điểm nhất vì tốc độ hội thoại nhanh và có 3 câu hỏi dồn dập cho 1 bài nghe. Kỹ năng cốt lõi cần thành thạo: đọc trước câu hỏi, nhận diện chủ đề nhanh, giữ tập trung đến hết đoạn cho câu hỏi \"next action\", và xử lý được dạng câu hỏi kết hợp hình ảnh. Luyện tập đều đặn theo từng kỹ năng riêng biệt hiệu quả hơn làm tràn lan nhiều đề mà không phân tích.', exercises:["Làm 1 bộ đề Part 3 đầy đủ (13 đoạn, 39 câu), tính giờ và chấm điểm.","Phân loại lỗi sai theo 4 kỹ năng đã học trong tuần: đọc trước câu hỏi, nhận diện chủ đề, next action, hình ảnh.","Xác định kỹ năng nào bạn còn yếu nhất trong 4 kỹ năng, lên kế hoạch ôn thêm tuần sau.","Tổng hợp lại toàn bộ từ vựng theo chủ đề đã học tuần này vào 1 danh sách riêng.","Viết 1 đoạn ngắn tự đánh giá tiến bộ của bạn với Part 3 so với lần đầu tiếp xúc."], quiz:[
{q:"Chủ đề trọng tâm tuần 9 tháng 2 là gì?", opts:["Reading Part 5", "Listening Part 3 — hội thoại ngắn", "Từ vựng Part 1", "Ngữ pháp cơ bản"], correct:1, explain:"Tuần 9 tập trung toàn diện vào kỹ năng làm Part 3."},
{q:"4 kỹ năng chính đã học trong tuần 9 là gì?", opts:["Không có kỹ năng cụ thể nào", "Đọc trước câu hỏi, nhận diện chủ đề, xử lý câu next-action, xử lý câu kèm hình ảnh", "Chỉ có 1 kỹ năng duy nhất", "Chỉ liên quan đến ngữ pháp"], correct:1, explain:"Đây là 4 trụ cột kỹ năng đã luyện tập xuyên suốt cả tuần."},
{q:"Vì sao Part 3 được coi là phần khó nhất của Listening?", opts:["Không khó hơn các phần khác", "Tốc độ hội thoại nhanh, 3 câu hỏi dồn dập, chỉ nghe được 1 lần duy nhất", "Vì có ít câu hỏi nhất", "Vì không có chiến thuật làm bài"], correct:1, explain:"Sự kết hợp của tốc độ, số lượng câu hỏi, và giới hạn 1 lần nghe tạo nên độ khó đặc trưng."},
{q:"Phân loại lỗi sai theo 4 kỹ năng có ích lợi gì?", opts:["Không có ích lợi gì", "Xác định chính xác kỹ năng nào cần ưu tiên ôn tập thêm", "Chỉ để thống kê cho vui", "Làm mất thời gian ôn tập"], correct:1, explain:"Phân loại lỗi giúp có kế hoạch ôn tập trọng tâm, hiệu quả hơn ôn dàn trải."},
{q:"Việc làm 1 bộ đề đầy đủ 13 đoạn có tính giờ mang lại lợi ích gì?", opts:["Không có lợi ích gì", "Mô phỏng đúng điều kiện thi thật, giúp đánh giá khả năng thực tế", "Chỉ để giải trí", "Không cần thiết vì đã luyện từng phần riêng"], correct:1, explain:"Luyện tổng hợp giúp kiểm tra khả năng áp dụng đồng thời cả 4 kỹ năng trong điều kiện thật."},
{q:"Nên tổng hợp từ vựng theo cách nào sau khi học xong tuần 9?", opts:["Không cần tổng hợp gì", "Gom lại theo từng chủ đề đã học (công sở, mua sắm, du lịch, sự kiện) thành 1 danh sách riêng", "Ghi ngẫu nhiên không theo thứ tự", "Xóa hết vì không cần thiết"], correct:1, explain:"Tổng hợp theo chủ đề giúp ôn tập có hệ thống, dễ tra cứu lại sau này."},
{q:"Tự đánh giá tiến bộ bản thân có tác dụng gì trong quá trình học?", opts:["Không có tác dụng gì", "Giúp nhận ra sự cải thiện, duy trì động lực học tập lâu dài", "Chỉ để viết cho có", "Làm mất thời gian không cần thiết"], correct:1, explain:"Tự đánh giá là cách hiệu quả để nhìn thấy tiến bộ và giữ động lực."},
{q:"Sau tuần 9, tuần 10 sẽ chuyển trọng tâm sang đâu theo lộ trình?", opts:["Học lại từ Part 1", "Listening Part 4 — bài nói ngắn", "Ngừng học Listening", "Chỉ học Reading"], correct:1, explain:"Tuần 10 tiếp nối logic với Part 4, dạng bài nói dài hơn Part 3."},
{q:"Kỹ năng đọc trước câu hỏi có áp dụng được cho cả Part 4 sắp học không?", opts:["Không áp dụng được", "Có, đây là kỹ năng nền tảng áp dụng chung cho cả Part 3 và Part 4", "Chỉ áp dụng cho Part 3", "Không liên quan đến Part 4"], correct:1, explain:"Chiến thuật đọc trước câu hỏi là kỹ năng lõi dùng chung cho toàn bộ phần hội thoại/bài nói."},
{q:"Điều quan trọng nhất cần duy trì sau khi hoàn thành tuần 9 là gì?", opts:["Không cần duy trì gì thêm", "Tiếp tục luyện tập đều đặn để các kỹ năng trở thành phản xạ tự nhiên khi thi thật", "Chỉ cần nhớ lý thuyết là đủ", "Ngừng luyện tập ngay khi hiểu lý thuyết"], correct:1, explain:"Kỹ năng nghe cần luyện tập lặp lại để trở thành phản xạ, không chỉ hiểu lý thuyết suông."},
