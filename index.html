{q:"MFA thêm lớp bảo vệ nào?", opts:["Mã hóa file", "Xác thực bổ sung ngoài mật khẩu (OTP/thiết bị)", "Tường lửa", "Sao lưu tự động"], correct:1, explain:"MFA yêu cầu thêm 1 mã xác thực ngoài mật khẩu thông thường."},
{q:"Nên bật MFA cho tài khoản nào đầu tiên?", opts:["Chỉ IAM User thường", "Root account", "Không cần bật", "Chỉ tài khoản test"], correct:1, explain:"Root account có toàn quyền nên cần được bảo vệ bằng MFA đầu tiên."},
{q:"Billing Alert giúp ích gì?", opts:["Tăng tốc AWS", "Cảnh báo khi chi phí vượt ngưỡng đặt trước", "Bảo mật dữ liệu", "Sao lưu file"], correct:1, explain:"Billing Alert phát hiện sớm chi phí vượt mức dự kiến."},
{q:"AWS Budget khác Billing Alert ở điểm nào?", opts:["Không khác gì", "Budget cho phép đặt giới hạn & theo dõi chi tiết hơn theo dịch vụ/thời gian", "Budget chỉ dùng cho EC2", "Billing Alert mạnh hơn Budget"], correct:1, explain:"Budget cho phép thiết lập chi tiết và linh hoạt hơn so với Billing Alert đơn giản."},
{q:"CloudTrail dùng để làm gì?", opts:["Tạo VPC", "Ghi lại lịch sử mọi API call trong tài khoản", "Mã hóa ổ đĩa", "Tính chi phí"], correct:1, explain:"CloudTrail là công cụ audit ghi lại toàn bộ hành động API trong tài khoản."},
{q:"Vì sao mới học AWS nên bật Billing Alert ngay?", opts:["Không cần thiết", "Tránh phát sinh chi phí ngoài ý muốn khi thử nghiệm", "Bắt buộc theo luật", "Chỉ để trang trí"], correct:1, explain:"Người mới dễ vô tình để tài nguyên chạy quên, Billing Alert giúp phát hiện sớm."},
{q:"Security Status trong IAM Dashboard hiển thị gì?", opts:["Chi phí", "Các cảnh báo bảo mật cần xử lý", "Tốc độ mạng", "Dung lượng ổ đĩa"], correct:1, explain:"Đây là bảng tổng hợp các khuyến nghị bảo mật cần khắc phục."},
{q:"App nào thường dùng để tạo mã OTP cho MFA?", opts:["Google Authenticator", "Microsoft Word", "Notepad", "Calculator"], correct:0, explain:"Google Authenticator là app phổ biến để tạo mã OTP theo thời gian thực."},
{q:"Vì sao hạn chế dùng root cho việc hàng ngày dù đã bật MFA?", opts:["MFA không hoạt động với root", "Giảm thiểu rủi ro nếu root bị xâm nhập, vì root có toàn quyền tuyệt đối", "Root chậm hơn", "Không có lý do"], correct:1, explain:"Dù có MFA, root vẫn nên hạn chế dùng vì hậu quả nếu bị xâm nhập là lớn nhất."},
]},
{label:'Thứ 6', title:'Tổng kết tuần 1 & thực hành tổng hợp', content:'Tuần đầu tập trung vào nền tảng bảo mật và quản lý truy cập — kiến thức nền bắt buộc trước khi động vào bất kỳ dịch vụ compute/storage nào. Nguyên tắc cốt lõi: không dùng root cho việc hàng ngày, luôn áp dụng least privilege, luôn bật MFA. Đề thi SAA-C03 dành khoảng 15-20% câu hỏi liên quan trực tiếp hoặc gián tiếp đến IAM và bảo mật. Thực hành tay giúp nhớ lâu hơn nhiều so với chỉ xem video.', exercises:['Viết lại (bằng lời của bạn) nguyên tắc least privilege và giải thích tại sao nó quan trọng.','Tạo thêm 1 IAM User nữa với quyền hạn khác (ví dụ chỉ quyền EC2 read-only), thực hành tạo policy từ đầu không xem lại tuần trước.','Tự đánh giá: bạn đã tự tin giải thích được sự khác biệt giữa User/Group/Role chưa?','Viết checklist bảo mật cơ bản gồm ít nhất 5 việc cần làm ngay khi tạo tài khoản AWS mới.','Tự giải thích lại khái niệm IAM bạn thấy khó hiểu nhất bằng lời của chính mình, không nhìn tài liệu.'], quiz:[
{q:"IAM Role khác IAM User ở điểm nào?", opts:["Role có mật khẩu cố định","Role là bộ quyền tạm thời gán cho dịch vụ, không cần lưu access key cố định","Role chỉ dùng cho root account","Không có khác biệt"], correct:1, explain:"Role được các dịch vụ AWS (như EC2) \"đóng vai\" tạm thời để có quyền, an toàn hơn lưu access key cố định trên user."},
{q:"Nguyên tắc \"least privilege\" nghĩa là gì?", opts:["Cấp toàn quyền cho dễ quản lý","Chỉ cấp đúng quyền cần thiết, không dư thừa","Chỉ admin mới có quyền","Không cấp quyền cho ai cả"], correct:1, explain:"Least privilege là nguyên tắc bảo mật cốt lõi: mỗi user/role chỉ nên có đúng quyền cần cho công việc, không hơn."},
{q:"MFA là viết tắt của gì và dùng để làm gì?", opts:["Multi-Factor Authentication, thêm 1 lớp xác thực ngoài mật khẩu","Main File Access, quản lý file","Multiple File Allocation","Managed Federal Access"], correct:0, explain:"MFA yêu cầu thêm mã OTP hoặc thiết bị vật lý ngoài mật khẩu, giảm rủi ro bị chiếm tài khoản."},
{q:"Trong IAM Policy, nếu có 1 statement Allow và 1 statement Deny cùng áp dụng cho 1 action, kết quả là gì?", opts:["Allow luôn thắng","Deny luôn được ưu tiên","Ngẫu nhiên","Lỗi hệ thống"], correct:1, explain:"AWS luôn ưu tiên Deny khi có xung đột giữa các policy — đây là quy tắc bảo mật mặc định."},
{q:"Access Key dùng để làm gì?", opts:["Đăng nhập Console","Xác thực khi gọi AWS qua CLI/SDK","Mã hóa dữ liệu","Đặt tên cho resource"], correct:1, explain:"Access Key ID + Secret Access Key dùng để xác thực chương trình/CLI gọi AWS API, khác với đăng nhập Console bằng mật khẩu."},
{q:"Vì sao không nên dùng root account cho công việc hàng ngày?", opts:["Root chậm hơn","Root có toàn quyền, rủi ro cao nếu bị lộ hoặc thao tác nhầm","Root không hỗ trợ MFA","Root miễn phí có giới hạn"], correct:1, explain:"Root account có toàn quyền không giới hạn — nếu bị lộ hoặc thao tác sai sẽ gây hậu quả nghiêm trọng nhất."},
{q:"IAM Group dùng để làm gì?", opts:["Nhóm nhiều User lại để gán quyền chung dễ quản lý hơn","Chỉ chứa 1 user","Thay thế Access Key","Mã hóa dữ liệu"], correct:0, explain:"Group giúp gán cùng 1 bộ quyền cho nhiều user cùng lúc, thay vì gán riêng lẻ từng user."},
{q:"Billing Alert giúp ích gì?", opts:["Tăng tốc độ AWS","Cảnh báo khi chi phí vượt ngưỡng đặt trước","Bảo mật tài khoản","Sao lưu dữ liệu"], correct:1, explain:"Billing Alert giúp phát hiện sớm khi chi phí AWS vượt mức dự kiến, tránh phát sinh hóa đơn bất ngờ."},
{q:"Managed Policy khác Customer Managed Policy thế nào?", opts:["Managed Policy do AWS tạo sẵn; Customer Managed Policy do người dùng tự viết","Không khác gì","Managed Policy chỉ dùng cho root","Customer Managed Policy miễn phí hơn"], correct:0, explain:"AWS Managed Policy là policy có sẵn AWS tạo; Customer Managed Policy do chính bạn viết theo nhu cầu riêng."},
{q:"Điều gì xảy ra nếu 1 IAM User không được gán bất kỳ Policy nào?", opts:["Có toàn quyền mặc định","Không có quyền truy cập bất kỳ tài nguyên nào (mặc định deny)","Chỉ đọc được S3","Tự động có quyền admin"], correct:1, explain:"AWS mặc định KHÔNG cấp quyền gì — mọi quyền phải được cấp rõ ràng qua policy (implicit deny)."},
{q:"IAM Policy Simulator dùng để làm gì?", opts:["Tạo user tự động","Mô phỏng và kiểm tra quyền của 1 policy trước khi gán thật","Tính chi phí","Backup dữ liệu"], correct:1, explain:"Công cụ này cho phép kiểm tra 1 policy sẽ cho phép/từ chối hành động nào trước khi thực sự áp dụng."},
{q:"Trong đề thi SAA, chủ đề IAM/bảo mật chiếm khoảng bao nhiêu % câu hỏi?", opts:["1-2%","15-20%","50%","90%"], correct:1, explain:"IAM và bảo mật là 1 trong những chủ đề trọng tâm, chiếm tỷ trọng đáng kể trong đề thi SAA-C03."},
]},
]},
{title:"EC2 — máy chủ ảo", points:["EC2 là dịch vụ máy chủ ảo cho phép thuê tài nguyên tính toán theo nhu cầu.","Instance type quyết định cấu hình CPU/RAM/network — ví dụ t2.micro (nhỏ, free tier) đến các loại lớn hơn cho khối lượng công việc nặng.","AMI (Amazon Machine Image) là bản snapshot hệ điều hành + phần mềm cài sẵn, dùng để khởi tạo instance nhanh chóng.","Security Group hoạt động như firewall ở cấp instance, kiểm soát traffic vào/ra theo port và IP.","Elastic IP là địa chỉ IP tĩnh có thể gán cố định cho instance, không đổi khi restart."], practice:"Khởi tạo 1 EC2 instance t2.micro (free tier), cấu hình Security Group chỉ mở port 22 và 80, SSH vào instance.", case:"Câu hỏi về Security Group vs Network ACL (khác biệt stateful/stateless) là chủ đề rất hay gặp trong đề thi SAA.", task:"Cài đặt 1 web server đơn giản (ví dụ Nginx) trên EC2 instance vừa tạo, truy cập được từ trình duyệt qua địa chỉ IP public.", days:[
{label:'Thứ 2', title:'EC2 cơ bản & Instance Types', content:'EC2 cho phép khởi tạo máy chủ ảo trong vài phút, chọn cấu hình theo nhu cầu. Instance type được đặt tên theo họ + kích thước, ví dụ t2.micro: "t" là họ general purpose burstable, "2" là thế hệ, "micro" là kích thước. Các họ phổ biến: T (general purpose, rẻ), M (cân bằng), C (compute optimized), R (memory optimized). Free Tier cho phép dùng t2.micro/t3.micro miễn phí 750 giờ/tháng trong 12 tháng đầu.', exercises:['Đọc bảng so sánh các họ instance type (T, M, C, R), ghi chú khi nào nên dùng loại nào.','Khởi tạo 1 EC2 instance t2.micro với Amazon Linux 2 AMI.','Xem thông tin chi tiết instance vừa tạo (Public IP, Private IP, Instance ID).','So sánh chi phí ước tính của t2.micro chạy 24/7 trong 1 tháng bằng AWS Pricing Calculator.','Thử dừng (stop) rồi khởi động lại (start) instance, quan sát Public IP có đổi không.'], quiz:[
{q:"EC2 là dịch vụ gì?", opts:["Lưu trữ đối tượng", "Máy chủ ảo (Virtual Server)", "Mạng riêng ảo", "Quản lý DNS"], correct:1, explain:"EC2 (Elastic Compute Cloud) cung cấp máy chủ ảo cho thuê theo nhu cầu."},
{q:"t2.micro thuộc Free Tier nghĩa là gì?", opts:["Không giới hạn thời gian dùng", "Miễn phí 750 giờ/tháng trong 12 tháng đầu", "Miễn phí vĩnh viễn", "Chỉ miễn phí 1 giờ"], correct:1, explain:"AWS Free Tier cho phép dùng miễn phí trong giới hạn 12 tháng đầu tài khoản mới."},
{q:"AMI dùng để làm gì?", opts:["Định tuyến mạng", "Khuôn mẫu OS+phần mềm để khởi tạo instance nhanh", "Mã hóa dữ liệu", "Giám sát chi phí"], correct:1, explain:"AMI là snapshot hệ điều hành/phần mềm giúp khởi tạo instance nhanh chóng."},
{q:"Instance type quyết định điều gì?", opts:["Tên miền", "Cấu hình CPU/RAM/network", "Địa chỉ email", "Loại database"], correct:1, explain:"Instance type là thông số phần cứng ảo (CPU/RAM/network) của máy chủ."},
{q:"Họ instance nào tối ưu cho compute nặng?", opts:["T (burstable)", "C (compute optimized)", "Chỉ có 1 họ duy nhất", "Không có sự khác biệt"], correct:1, explain:"Họ C được thiết kế cho workload cần nhiều CPU."},
{q:"Muốn xem Public IP của instance, xem ở đâu?", opts:["S3 Console", "EC2 instance details", "IAM Dashboard", "Billing Dashboard"], correct:1, explain:"Thông tin IP hiển thị trong trang chi tiết của chính instance đó."},
{q:"General purpose burstable phù hợp workload nào?", opts:["Tải cao liên tục 24/7", "Workload nhẹ, không cần hiệu năng ổn định liên tục", "Chỉ dùng cho database lớn", "Không dùng được cho web server"], correct:1, explain:"Họ T tích lũy \"credit\" CPU, phù hợp workload không cần hiệu năng cao liên tục."},
{q:"Muốn tạo EC2 instance cần chọn gì đầu tiên?", opts:["Chỉ cần chọn tên", "AMI (hệ điều hành) và Instance Type", "Chỉ cần Region", "Không cần chọn gì"], correct:1, explain:"2 lựa chọn cốt lõi khi khởi tạo là AMI và loại instance."},
{q:"EC2 instance mới tạo mặc định có thể SSH vào ngay không?", opts:["Có ngay lập tức không cần gì thêm", "Cần cấu hình Security Group + Key Pair trước", "Không bao giờ SSH được", "Chỉ Windows mới SSH được"], correct:1, explain:"Cần mở port 22 trên Security Group và có private key tương ứng mới SSH được."},
{q:"Free Tier EC2 áp dụng cho những instance type nào?", opts:["Mọi loại instance", "t2.micro/t3.micro", "Chỉ loại lớn nhất", "Không áp dụng free tier cho EC2"], correct:1, explain:"Free Tier chỉ áp dụng cho các instance nhỏ nhất như t2.micro/t3.micro."},
]},
{label:'Thứ 3', title:'Security Group & kết nối SSH', content:'Security Group hoạt động như firewall ảo ở cấp instance, mặc định chặn hết inbound, cho phép hết outbound. Inbound Rule định nghĩa traffic được PHÉP đi VÀO; không nên mở "0.0.0.0/0" cho port nhạy cảm như SSH nếu không cần thiết. Key Pair dùng để xác thực SSH vào Linux instance — private key phải giữ bí mật, mất là không khôi phục được. Security Group là stateful: traffic phản hồi tự động được phép ra mà không cần rule riêng.', exercises:['Tạo Security Group chỉ mở port 22 (SSH) giới hạn IP của bạn, và port 80 (HTTP) mở cho mọi nơi.','Tải Key Pair (.pem) khi tạo instance, cấp quyền file đúng cách (chmod 400 trên Mac/Linux).','SSH vào EC2 instance thành công từ terminal.','Thử xóa rule mở port 22 rồi thử SSH lại, xác nhận bị từ chối kết nối — sau đó thêm lại rule.','Tìm hiểu Security Group có thể tham chiếu đến Security Group khác (thay vì chỉ IP) để làm gì.'], quiz:[
{q:"Security Group mặc định cho phép gì?", opts:["Cho phép hết inbound, chặn hết outbound", "Chặn hết inbound, cho phép hết outbound", "Cho phép tất cả", "Chặn tất cả"], correct:1, explain:"Mặc định Security Group chặn mọi traffic vào, cho phép mọi traffic ra."},
{q:"Inbound Rule định nghĩa gì?", opts:["Traffic đi RA", "Traffic được PHÉP đi VÀO", "Tên instance", "Loại ổ đĩa"], correct:1, explain:"Inbound Rule kiểm soát traffic được phép đi vào instance."},
{q:"Vì sao không nên mở port SSH cho \"0.0.0.0/0\" (mọi nơi)?", opts:["Không có rủi ro gì", "Tăng rủi ro bị tấn công từ bất kỳ đâu trên internet", "Sẽ làm chậm mạng", "Bắt buộc phải mở vậy"], correct:1, explain:"Mở port SSH cho mọi IP làm tăng bề mặt tấn công đáng kể."},
{q:"Key Pair dùng để làm gì?", opts:["Mã hóa bucket S3", "Xác thực SSH vào Linux instance", "Đặt tên VPC", "Tính chi phí"], correct:1, explain:"Key Pair (public/private key) là cơ chế xác thực SSH tiêu chuẩn của EC2."},
{q:"Nếu mất private key, có khôi phục lại được không?", opts:["Có, AWS lưu bản sao", "Không, mất là mất vĩnh viễn", "Chỉ cần gọi hotline", "Tự động khôi phục sau 24h"], correct:1, explain:"AWS không lưu private key, mất là không thể khôi phục lại."},
{q:"Security Group là stateful nghĩa là gì?", opts:["Không lưu trạng thái gì", "Traffic phản hồi tự động được phép ra không cần rule riêng", "Luôn chặn mọi traffic", "Chỉ áp dụng 1 lần duy nhất"], correct:1, explain:"Stateful nghĩa là traffic phản hồi cho request đã được phép tự động được cho qua."},
{q:"Trên Mac/Linux, cần cấp quyền gì cho file .pem trước khi SSH?", opts:["chmod 777", "chmod 400", "Không cần cấp quyền", "chmod 000"], correct:1, explain:"chmod 400 giới hạn quyền đọc file key chỉ cho chủ sở hữu, theo yêu cầu bảo mật SSH."},
{q:"Port mặc định của SSH là gì?", opts:["80", "22", "443", "3389"], correct:1, explain:"Port 22 là port chuẩn của giao thức SSH."},
{q:"Security Group có thể tham chiếu đến gì thay vì chỉ IP?", opts:["Chỉ IP duy nhất", "Security Group khác", "Không tham chiếu được gì khác", "Chỉ tên miền"], correct:1, explain:"Có thể cho phép traffic từ 1 Security Group khác, hữu ích khi thiết kế kiến trúc nhiều tầng."},
{q:"Muốn web server truy cập được qua trình duyệt, cần mở port nào?", opts:["22", "80 (HTTP)", "3306", "Không cần mở port nào"], correct:1, explain:"Port 80 là port chuẩn cho HTTP, cần mở để trình duyệt truy cập được."},
]},
{label:'Thứ 4', title:'Cài đặt web server & Elastic IP', content:'Sau khi SSH vào instance, có thể cài đặt phần mềm như 1 máy Linux bình thường. Elastic IP là địa chỉ IP public tĩnh, không đổi dù restart — khác Public IP mặc định sẽ đổi mỗi lần restart. Elastic IP miễn phí khi đang gắn với instance đang chạy, bị tính phí nếu không gắn instance nào. User Data cho phép chạy script tự động khi instance khởi động lần đầu.', exercises:['SSH vào instance, cài đặt Nginx hoặc Apache, xác nhận truy cập được qua trình duyệt bằng Public IP.','Gán 1 Elastic IP cho instance, xác nhận địa chỉ không đổi sau khi restart.','Viết 1 đoạn User Data đơn giản (tự cài Nginx khi khởi động) và tạo instance mới dùng User Data đó.','Thử truy cập instance qua Public IP mặc định trước và sau khi gán Elastic IP, so sánh.','Viết User Data script cài thêm 1 trang index.html tùy chỉnh khi khởi động instance.'], quiz:[
{q:"Elastic IP khác Public IP mặc định ở điểm nào?", opts:["Không khác gì", "Elastic IP không đổi khi restart, Public IP mặc định có thể đổi", "Elastic IP luôn miễn phí", "Public IP nhanh hơn"], correct:1, explain:"Elastic IP là địa chỉ IP tĩnh cố định, khác Public IP thường đổi khi restart."},
{q:"Elastic IP bị tính phí khi nào?", opts:["Luôn luôn miễn phí", "Khi không gắn với instance nào đang chạy", "Khi gắn với instance đang chạy", "Không bao giờ tính phí"], correct:1, explain:"AWS tính phí Elastic IP không sử dụng để khuyến khích không giữ IP lãng phí."},
{q:"User Data dùng để làm gì?", opts:["Lưu file cá nhân", "Chạy script tự động khi instance khởi động lần đầu", "Đặt tên instance", "Mã hóa ổ đĩa"], correct:1, explain:"User Data cho phép tự động hóa cấu hình ngay khi instance khởi động."},
{q:"Sau khi SSH vào EC2 Linux, cài phần mềm như thế nào?", opts:["Không thể cài thêm gì", "Như 1 máy Linux bình thường (yum/apt install)", "Chỉ AWS mới cài được", "Cần license riêng"], correct:1, explain:"EC2 instance hoạt động như 1 máy Linux thông thường sau khi SSH vào."},
{q:"Nginx và Apache là gì?", opts:["Loại database", "Phần mềm web server phổ biến", "Loại instance", "Dịch vụ lưu trữ"], correct:1, explain:"Cả 2 đều là phần mềm web server mã nguồn mở phổ biến."},
{q:"Muốn website luôn có cùng 1 địa chỉ IP dù restart, nên dùng gì?", opts:["Public IP mặc định", "Elastic IP", "Private IP", "Không thể làm được"], correct:1, explain:"Elastic IP giữ cố định địa chỉ dù instance restart nhiều lần."},
{q:"User Data script chạy vào thời điểm nào?", opts:["Mỗi khi SSH vào", "Khi instance khởi động lần đầu", "Mỗi giờ 1 lần", "Không bao giờ chạy tự động"], correct:1, explain:"User Data mặc định chỉ chạy 1 lần khi instance khởi động đầu tiên."},
{q:"Muốn kiểm tra web server đã chạy chưa, cách đơn giản nhất là gì?", opts:["Xem log AWS", "Truy cập Public IP qua trình duyệt", "Gọi hotline AWS", "Không thể kiểm tra"], correct:1, explain:"Cách nhanh nhất là mở trình duyệt và truy cập trực tiếp Public IP của instance."},
{q:"Nếu không gán Elastic IP, restart instance sẽ ảnh hưởng gì?", opts:["Không ảnh hưởng gì", "Public IP mặc định có thể thay đổi", "Mất toàn bộ dữ liệu", "Instance bị xóa"], correct:1, explain:"Public IP mặc định không cố định, có thể đổi sau mỗi lần restart."},
{q:"Elastic IP thuộc loại tài nguyên nào trong AWS?", opts:["Storage", "Networking (địa chỉ IP tĩnh)", "Compute", "Database"], correct:1, explain:"Elastic IP là tài nguyên mạng, không phải storage hay compute."},
]},
{label:'Thứ 5', title:'EBS Volume & Instance Store', content:'EBS là ổ đĩa ảo gắn với EC2 instance, dữ liệu tồn tại độc lập với vòng đời instance. Instance Store là ổ đĩa vật lý gắn liền với host, tốc độ rất nhanh nhưng dữ liệu MẤT HẲN khi instance dừng/terminate. EBS Snapshot là bản sao lưu của volume tại 1 thời điểm, lưu trên S3, dùng để khôi phục hoặc tạo volume mới. Có thể thay đổi kích thước/loại EBS volume mà không cần dừng instance trong nhiều trường hợp.', exercises:['Xem EBS volume đang gắn với EC2 instance, kiểm tra kích thước và loại volume.','Tạo 1 Snapshot thủ công của volume đó.','Tạo 1 volume mới từ Snapshot vừa tạo, gắn thêm vào instance.','Thử gắn thêm 1 EBS volume mới (không phải volume gốc) vào instance đang chạy.','Tìm hiểu sự khác biệt giữa EBS gp3 và io2 về hiệu năng và chi phí.'], quiz:[
{q:"EBS là gì?", opts:["Ổ đĩa vật lý gắn liền host", "Ổ đĩa ảo (block storage) gắn với EC2 instance, tồn tại độc lập", "Dịch vụ DNS", "Loại VPC"], correct:1, explain:"EBS là block storage ảo, dữ liệu tồn tại độc lập với vòng đời instance."},
{q:"Instance Store khác EBS ở điểm quan trọng nào?", opts:["Không khác gì", "Instance Store mất dữ liệu khi instance dừng/terminate", "Instance Store luôn lớn hơn", "EBS luôn miễn phí"], correct:1, explain:"Instance Store gắn liền host vật lý, mất dữ liệu khi instance dừng."},
{q:"EBS Snapshot lưu trữ ở đâu?", opts:["Trên chính volume gốc", "Trên S3", "Trên máy local", "Không lưu được"], correct:1, explain:"Snapshot của EBS được lưu độc lập trên S3."},
{q:"Snapshot dùng để làm gì?", opts:["Tăng tốc CPU", "Khôi phục hoặc tạo volume mới từ bản sao lưu", "Đổi tên instance", "Mã hóa mật khẩu"], correct:1, explain:"Snapshot là bản sao lưu tại 1 thời điểm, dùng để khôi phục hoặc nhân bản volume."},
{q:"Có thể gắn 1 EBS volume vào nhiều instance cùng lúc thông thường không?", opts:["Có, không giới hạn", "Thông thường chỉ gắn được 1 instance tại 1 thời điểm", "Luôn gắn được không giới hạn", "Không bao giờ gắn được"], correct:1, explain:"EBS thông thường chỉ gắn với 1 instance tại 1 thời điểm (trừ 1 số loại đặc biệt hỗ trợ multi-attach)."},
{q:"gp3 và io2 là gì?", opts:["Loại EC2 instance", "Loại EBS volume khác nhau về hiệu năng/chi phí", "Loại VPC", "Loại Security Group"], correct:1, explain:"Đây là các loại EBS volume với đặc tính hiệu năng và chi phí khác nhau."},
{q:"Vì sao Instance Store phù hợp dữ liệu tạm thời?", opts:["Vì rẻ nhất", "Vì tốc độ rất nhanh nhưng mất dữ liệu khi dừng instance", "Vì dung lượng lớn nhất", "Vì mã hóa tự động"], correct:1, explain:"Tốc độ cao đánh đổi với việc mất dữ liệu khi instance dừng/terminate."},
{q:"Có thể thay đổi kích thước EBS volume mà không dừng instance không?", opts:["Không bao giờ được", "Có thể trong nhiều trường hợp", "Phải xóa hẳn tài khoản", "Phải xóa instance trước"], correct:1, explain:"AWS hỗ trợ thay đổi kích thước EBS volume mà không cần dừng instance trong nhiều trường hợp."},
{q:"EBS thuộc loại storage nào?", opts:["Object storage", "Block storage", "File storage", "Archive storage"], correct:1, explain:"EBS là block storage, khác S3 (object storage)."},
{q:"Muốn backup dữ liệu 1 volume trước khi thay đổi lớn, nên làm gì?", opts:["Không cần làm gì", "Tạo Snapshot thủ công trước", "Xóa volume", "Terminate instance"], correct:1, explain:"Tạo Snapshot trước khi thay đổi lớn là thực hành an toàn tiêu chuẩn."},
]},
{label:'Thứ 6', title:'Tổng kết tuần 2 & so sánh với triển khai truyền thống', content:'Sau tuần này, bạn đã có khả năng tự khởi tạo và quản lý 1 máy chủ web hoàn chỉnh trên AWS. So với thuê server vật lý truyền thống, EC2 cho phép scale trong vài phút thay vì vài tuần đặt hàng phần cứng. Chi phí EC2 tính theo giờ/giây sử dụng thực tế (on-demand) hoặc rẻ hơn với Reserved Instance (cam kết dài hạn) hoặc Spot Instance (giá rẻ nhưng có thể bị thu hồi). Hiểu rõ đánh đổi giữa các pricing model là kiến thức quan trọng cho đề thi SAA.', exercises:['Đọc 3 loại pricing của EC2 (On-Demand, Reserved, Spot), viết ra tình huống phù hợp cho mỗi loại.','Terminate các instance test không cần dùng nữa để tránh phát sinh phí (giữ lại ít nhất 1 cái cho tuần sau).','Tự vẽ sơ đồ đơn giản mô tả những gì đã làm tuần này (EC2 + Security Group + EBS + Elastic IP).','Ước tính chi phí hàng tháng cho toàn bộ hạ tầng đã tạo tuần này bằng AWS Pricing Calculator.','Viết 3 câu hỏi bạn còn thắc mắc về EC2 để tự tra cứu thêm hoặc hỏi cộng đồng AWS.'], quiz:[
{q:"t2.micro thuộc họ instance nào?", opts:["Compute optimized","General purpose burstable","Memory optimized","Storage optimized"], correct:1, explain:"Họ \"t\" là general purpose burstable, phù hợp workload nhẹ không cần hiệu năng ổn định liên tục."},
{q:"AMI là gì?", opts:["Loại instance","Bản snapshot hệ điều hành + phần mềm cài sẵn để khởi tạo instance","Địa chỉ IP","Loại ổ đĩa"], correct:1, explain:"AMI (Amazon Machine Image) là khuôn mẫu để khởi tạo nhanh 1 instance với hệ điều hành/phần mềm đã cài sẵn."},
{q:"Security Group hoạt động ở cấp nào?", opts:["Cấp VPC","Cấp Subnet","Cấp Instance","Cấp Region"], correct:2, explain:"Security Group là firewall ảo gắn trực tiếp với từng instance (network interface)."},
{q:"Security Group là stateful nghĩa là gì?", opts:["Không lưu trạng thái","Traffic phản hồi tự động được phép ra mà không cần rule riêng","Chỉ áp dụng 1 lần","Luôn chặn mọi traffic"], correct:1, explain:"Stateful nghĩa là nếu traffic được phép vào, phản hồi tương ứng tự động được phép ra."},
{q:"Elastic IP khác Public IP mặc định thế nào?", opts:["Elastic IP là địa chỉ tĩnh không đổi khi restart; Public IP mặc định đổi mỗi lần restart","Không khác gì","Elastic IP chỉ dùng cho S3","Public IP luôn miễn phí, Elastic IP luôn tính phí"], correct:0, explain:"Elastic IP giữ nguyên địa chỉ dù instance restart, còn Public IP thường thay đổi."},
{q:"EBS khác Instance Store ở điểm quan trọng nào?", opts:["EBS dữ liệu tồn tại độc lập vòng đời instance; Instance Store mất dữ liệu khi instance dừng","Không khác gì","EBS luôn miễn phí","Instance Store nhanh hơn nên luôn tốt hơn"], correct:0, explain:"EBS là persistent storage; Instance Store gắn liền với host vật lý và mất dữ liệu khi instance dừng/terminate."},
{q:"User Data trong EC2 dùng để làm gì?", opts:["Lưu trữ file cá nhân","Chạy script tự động khi instance khởi động lần đầu","Đặt tên instance","Mã hóa ổ đĩa"], correct:1, explain:"User Data cho phép tự động hóa việc cài đặt/cấu hình ngay khi instance khởi động."},
{q:"EBS Snapshot lưu trữ ở đâu?", opts:["Trên chính instance","Trên S3","Trên máy local","Không lưu trữ được"], correct:1, explain:"Snapshot của EBS được lưu trên S3, độc lập với instance/volume gốc."},
{q:"On-Demand pricing phù hợp với tình huống nào nhất?", opts:["Chạy 24/7 trong nhiều năm","Workload không dự đoán trước, chạy ngắn hạn","Chỉ dùng cho database","Không bao giờ nên dùng"], correct:1, explain:"On-Demand linh hoạt, trả theo giờ/giây sử dụng, phù hợp workload không cam kết dài hạn."},
{q:"Spot Instance có rủi ro gì?", opts:["Không có rủi ro","Có thể bị AWS thu hồi bất cứ lúc nào khi cần tài nguyên","Chỉ chạy được 1 giờ","Không thể cài phần mềm"], correct:1, explain:"Spot Instance rẻ nhưng AWS có thể thu hồi bất cứ lúc nào nếu cần tài nguyên đó cho khách hàng On-Demand."},
{q:"Muốn SSH vào EC2 Linux instance cần gì?", opts:["Chỉ cần Public IP","Key Pair (private key) và Security Group cho phép port 22","Chỉ cần Security Group","Không cần gì cả"], correct:1, explain:"Cần cả private key để xác thực VÀ Security Group mở đúng port 22 mới SSH được."},
{q:"Reserved Instance phù hợp nhất khi nào?", opts:["Workload chạy ổn định, dài hạn, có thể cam kết trước","Workload ngắn hạn không dự đoán được","Chỉ dùng để test","Không bao giờ nên dùng"], correct:0, explain:"Reserved Instance đổi cam kết sử dụng dài hạn lấy giá rẻ hơn đáng kể so với On-Demand."},
]},
]},
{title:"S3 — lưu trữ đối tượng", points:["S3 là dịch vụ lưu trữ object storage có độ bền cao (99.999999999%), không giới hạn dung lượng.","Bucket là đơn vị chứa dữ liệu trong S3, tên bucket phải duy nhất toàn cầu.","Storage class (Standard, IA, Glacier...) tối ưu chi phí theo tần suất truy cập dữ liệu.","Versioning cho phép giữ lại nhiều phiên bản của 1 object, hữu ích để khôi phục khi bị ghi đè/xóa nhầm.","Bucket Policy và ACL kiểm soát quyền truy cập ở cấp bucket/object, cần cấu hình cẩn thận để tránh lộ dữ liệu công khai ngoài ý muốn."], practice:"Tạo 1 S3 bucket, upload vài file, bật Versioning, thử ghi đè 1 file và khôi phục phiên bản cũ.", case:"Rất nhiều sự cố bảo mật thực tế xảy ra do S3 bucket bị cấu hình public nhầm — đây là lỗi cấu hình phổ biến nhất trong thực tế vận hành AWS.", task:"Cấu hình 1 bucket S3 để host 1 trang web tĩnh đơn giản (Static Website Hosting), truy cập được qua URL S3 cung cấp.", days:[
{label:'Thứ 2', title:'S3 cơ bản — Bucket & Object', content:'S3 lưu trữ dữ liệu dưới dạng object trong bucket, không có cấu trúc thư mục thật (dùng prefix để mô phỏng). Tên bucket phải duy nhất TOÀN CẦU, viết thường, không khoảng trắng. Mỗi object có Key, Value, Metadata, và Version ID (nếu bật Versioning). S3 mặc định BLOCK toàn bộ public access — thiết lập an toàn nên giữ nguyên trừ khi thực sự cần công khai.', exercises:['Tạo 1 S3 bucket với tên duy nhất, upload vài file thử.','Tạo "thư mục" ảo bằng cách upload file với prefix (ví dụ images/photo.jpg).','Xem Properties của bucket, ghi chú lại Region đang lưu trữ.','Thử tạo 1 bucket trùng tên với bucket đã tồn tại (của người khác), quan sát lỗi báo tên không duy nhất.','Upload 1 file có kích thước lớn hơn 100MB, quan sát S3 Console hiển thị tiến trình upload thế nào.'], quiz:[
{q:"Tên bucket S3 cần đáp ứng điều kiện gì?", opts:["Duy nhất trong tài khoản", "Duy nhất TOÀN CẦU", "Không cần duy nhất", "Chỉ cần duy nhất trong Region"], correct:1, explain:"Tên bucket S3 phải duy nhất trên toàn bộ AWS, không chỉ trong tài khoản bạn."},
{q:"S3 lưu dữ liệu dưới dạng gì?", opts:["Block", "Object", "File hệ thống truyền thống", "Bảng quan hệ"], correct:1, explain:"S3 là object storage, khác EBS (block storage)."},
{q:"S3 có thư mục thật sự không?", opts:["Có, giống hệ điều hành", "Không, dùng prefix để mô phỏng thư mục", "Chỉ có 1 cấp thư mục", "Không lưu được nhiều file"], correct:1, explain:"S3 không có cấu trúc thư mục thật, dùng prefix trong tên object để mô phỏng."},
{q:"Mỗi object trong S3 có gì?", opts:["Chỉ có tên", "Key, Value, Metadata, Version ID (nếu bật Versioning)", "Chỉ có kích thước", "Không có thuộc tính gì"], correct:1, explain:"Object S3 có đầy đủ Key (định danh), Value (dữ liệu), Metadata và Version ID."},
{q:"S3 mặc định có cho phép public access không?", opts:["Có", "Mặc định BLOCK toàn bộ public access", "Chỉ chặn file lớn", "Tùy Region"], correct:1, explain:"S3 mặc định chặn public access để đảm bảo an toàn."},
{q:"Region ảnh hưởng gì đến bucket S3?", opts:["Không ảnh hưởng gì", "Ảnh hưởng đến nơi lưu trữ vật lý và độ trễ truy cập", "Chỉ ảnh hưởng giá tên miền", "Không thể chọn Region"], correct:1, explain:"Chọn Region gần người dùng giúp giảm độ trễ khi truy cập dữ liệu."},
{q:"Có thể đổi tên bucket sau khi tạo không?", opts:["Có, dễ dàng", "Không, phải tạo bucket mới", "Chỉ đổi được 1 lần", "Chỉ admin mới đổi được"], correct:1, explain:"S3 không hỗ trợ đổi tên bucket, cần tạo bucket mới nếu muốn tên khác."},
{q:"Prefix trong S3 dùng để làm gì?", opts:["Mã hóa file", "Mô phỏng cấu trúc thư mục", "Đặt tên bucket", "Tính phí"], correct:1, explain:"Prefix (phần đầu của Key) được dùng để tạo cảm giác có thư mục phân cấp."},
{q:"S3 phù hợp nhất cho loại dữ liệu nào?", opts:["Chỉ database quan hệ", "File/object như ảnh, video, backup, log", "Chỉ real-time streaming", "Không lưu được file lớn"], correct:1, explain:"S3 tối ưu cho lưu trữ file/object đa dạng loại, không phải database có cấu trúc."},
{q:"Khi upload file lớn, S3 Console hiển thị gì?", opts:["Không hiển thị gì", "Tiến trình (progress) upload", "Chỉ hiện khi xong", "Tự động ẩn đi"], correct:1, explain:"Console hiển thị thanh tiến trình để theo dõi quá trình upload."},
]},
{label:'Thứ 3', title:'Storage Class & vòng đời dữ liệu (Lifecycle)', content:'S3 Standard phù hợp dữ liệu truy cập thường xuyên; Standard-IA rẻ hơn nhưng tính phí khi truy xuất; Glacier phù hợp lưu trữ lâu dài, chi phí cực rẻ nhưng thời gian truy xuất chậm. Lifecycle Policy tự động chuyển object sang storage class rẻ hơn theo thời gian, hoặc tự động xóa sau X ngày. Chọn sai storage class có thể gây vấn đề nghiêm trọng về thời gian phản hồi.', exercises:['Đọc bảng giá các storage class, so sánh chi phí lưu trữ 1GB/tháng giữa Standard, IA, Glacier.','Tạo 1 Lifecycle Rule tự động chuyển object sang Standard-IA sau 30 ngày.','Thử đổi storage class thủ công cho 1 object đã upload.','Tính thử: nếu lưu 100GB dữ liệu ít truy cập trong 1 năm, so sánh chi phí giữa để nguyên Standard và chuyển sang Glacier.','Đọc về S3 Intelligent-Tiering, tìm hiểu nó tự động làm gì khác so với Lifecycle Policy thủ công.'], quiz:[
{q:"Storage class nào phù hợp dữ liệu truy cập thường xuyên?", opts:["Glacier", "S3 Standard", "Standard-IA", "Không storage class nào"], correct:1, explain:"S3 Standard tối ưu cho dữ liệu cần truy cập nhanh, thường xuyên."},
{q:"Standard-IA khác Standard ở điểm nào?", opts:["Không khác gì", "Rẻ hơn nhưng tính phí khi truy xuất", "Đắt hơn Standard", "Không thể truy xuất được"], correct:1, explain:"Standard-IA giảm chi phí lưu trữ, đổi lại tính thêm phí mỗi lần truy xuất."},
{q:"Glacier phù hợp nhất cho tình huống nào?", opts:["Dữ liệu cần truy cập tức thời liên tục", "Lưu trữ lâu dài, ít truy cập, chấp nhận độ trễ khi lấy ra", "Website tĩnh", "Database production"], correct:1, explain:"Glacier tối ưu chi phí lưu trữ dài hạn, đánh đổi bằng độ trễ truy xuất."},
{q:"Lifecycle Policy dùng để làm gì?", opts:["Tạo bucket mới", "Tự động chuyển storage class hoặc xóa object theo thời gian", "Đổi tên object", "Backup toàn bộ tài khoản"], correct:1, explain:"Lifecycle Policy tự động hóa quản lý vòng đời dữ liệu."},
{q:"S3 Intelligent-Tiering khác Lifecycle Policy thủ công thế nào?", opts:["Không khác gì", "Tự động phân tích và chuyển storage class dựa trên pattern truy cập thực tế", "Chỉ dùng cho Glacier", "Đắt hơn nhiều"], correct:1, explain:"Intelligent-Tiering tự động hóa hoàn toàn dựa trên hành vi truy cập thực tế, không cần đặt rule thủ công."},
{q:"Thời gian truy xuất Glacier so với Standard thế nào?", opts:["Nhanh hơn", "Chậm hơn (vài phút đến vài giờ)", "Bằng nhau", "Không thể truy xuất"], correct:1, explain:"Đổi lấy giá rẻ, Glacier có thời gian truy xuất chậm hơn nhiều so với Standard."},
{q:"Chọn sai storage class có thể gây hậu quả gì?", opts:["Không ảnh hưởng gì", "Vấn đề nghiêm trọng về thời gian phản hồi hoặc chi phí không cần thiết", "Mất dữ liệu ngay lập tức", "Bucket tự xóa"], correct:1, explain:"Chọn sai storage class có thể gây chậm trễ nghiêm trọng hoặc lãng phí chi phí."},
{q:"Lifecycle Rule có thể tự động làm gì sau X ngày?", opts:["Chỉ đổi tên file", "Chuyển storage class hoặc xóa object", "Chỉ gửi email", "Không làm được gì tự động"], correct:1, explain:"Rule có thể tự động chuyển class hoặc xóa hẳn object sau khoảng thời gian định trước."},
{q:"Nên dùng storage class nào cho log file cũ hiếm khi xem lại?", opts:["Standard", "Glacier hoặc Standard-IA tùy tần suất", "Luôn dùng Standard", "Không cần lưu log cũ"], correct:1, explain:"Log cũ ít truy cập nên chuyển sang class rẻ hơn để tối ưu chi phí."},
{q:"Chi phí lưu trữ Glacier so với Standard cho cùng dung lượng?", opts:["Đắt hơn nhiều", "Rẻ hơn đáng kể", "Bằng nhau", "Miễn phí hoàn toàn"], correct:1, explain:"Glacier có chi phí lưu trữ rẻ hơn đáng kể so với Standard."},
]},
{label:'Thứ 4', title:'Versioning & Static Website Hosting', content:'Versioning giữ lại toàn bộ lịch sử phiên bản của 1 object. Bật Versioning giúp khôi phục dữ liệu khi bị xóa/sửa nhầm, nhưng tăng chi phí lưu trữ. S3 Static Website Hosting cho phép host trực tiếp file HTML/CSS/JS tĩnh, có URL endpoint riêng. Với website tĩnh public, cần cấu hình Bucket Policy cho phép public read.', exercises:['Bật Versioning cho bucket, upload 1 file, sửa và upload lại, xem lịch sử phiên bản.','Cấu hình bucket host 1 trang HTML tĩnh, viết Bucket Policy cho phép public read.','Truy cập được website qua URL endpoint S3 cung cấp.','Xóa 1 file đã bật Versioning, sau đó khôi phục lại bằng cách xóa Delete Marker.','Thêm 1 trang lỗi 404 tùy chỉnh (error.html) cho website tĩnh đã cấu hình.'], quiz:[
{q:"Versioning giúp ích gì?", opts:["Tăng tốc độ", "Giữ lại nhiều phiên bản object, khôi phục khi xóa/ghi đè nhầm", "Giảm chi phí", "Mã hóa dữ liệu"], correct:1, explain:"Versioning bảo vệ dữ liệu khỏi thao tác nhầm bằng cách giữ lịch sử phiên bản."},
{q:"Bật Versioning có ảnh hưởng gì đến chi phí?", opts:["Không ảnh hưởng", "Tăng chi phí lưu trữ vì giữ nhiều bản", "Giảm chi phí", "Miễn phí hoàn toàn"], correct:1, explain:"Giữ nhiều phiên bản đồng nghĩa với việc tốn thêm dung lượng lưu trữ."},
{q:"S3 Static Website Hosting dùng để làm gì?", opts:["Chạy database", "Host trực tiếp file HTML/CSS/JS tĩnh", "Chạy server backend động", "Gửi email"], correct:1, explain:"Tính năng này cho phép S3 phục vụ trực tiếp nội dung web tĩnh."},
{q:"Muốn website tĩnh public được, cần cấu hình gì?", opts:["Không cần gì", "Bucket Policy cho phép public read", "Chỉ cần đổi tên bucket", "Chỉ AWS Support mới cấu hình được"], correct:1, explain:"Cần Bucket Policy cho phép đọc công khai thì website mới truy cập được."},
{q:"Delete Marker trong S3 Versioning là gì?", opts:["Xóa vĩnh viễn object", "Đánh dấu \"đã xóa\" nhưng phiên bản cũ vẫn còn, có thể khôi phục", "Tên bucket", "Loại storage class"], correct:1, explain:"Delete Marker chỉ là 1 dấu hiệu, dữ liệu thật vẫn còn và khôi phục được."},
{q:"Static Website Hosting có URL riêng dạng nào?", opts:["Chỉ IP số", "bucket-name.s3-website-region.amazonaws.com", "Không có URL", "Chỉ truy cập qua CLI"], correct:1, explain:"S3 cung cấp 1 URL endpoint riêng theo định dạng chuẩn cho website tĩnh."},
{q:"Trang lỗi 404 tùy chỉnh dùng để làm gì?", opts:["Tăng tốc website", "Hiển thị trang thân thiện khi người dùng truy cập link không tồn tại", "Mã hóa dữ liệu", "Không có tác dụng gì"], correct:1, explain:"Giúp trải nghiệm người dùng tốt hơn khi gặp link lỗi thay vì trang lỗi mặc định xấu."},
{q:"Xóa Delete Marker sẽ làm gì?", opts:["Xóa vĩnh viễn object", "Khôi phục lại phiên bản trước đó của object", "Tạo bucket mới", "Không có tác dụng"], correct:1, explain:"Xóa Delete Marker đồng nghĩa với việc \"hủy lệnh xóa\", khôi phục lại object."},
{q:"Vì sao S3 Static Hosting phù hợp cho landing page đơn giản?", opts:["Không phù hợp", "Chi phí rẻ, không cần quản lý server, dễ triển khai", "Chỉ dùng được cho ứng dụng phức tạp", "Bắt buộc cần EC2"], correct:1, explain:"Không cần server, chi phí thấp, phù hợp cho các trang tĩnh đơn giản."},
{q:"Versioning và Backup có giống nhau hoàn toàn không?", opts:["Giống hệt nhau", "Versioning giúp khôi phục lỗi thao tác, không thay thế hoàn toàn chiến lược backup toàn diện", "Không liên quan gì", "Backup không cần thiết nếu có Versioning"], correct:1, explain:"Versioning bảo vệ khỏi lỗi thao tác, nhưng chiến lược backup toàn diện vẫn cần thiết cho các rủi ro khác."},
]},
{label:'Thứ 5', title:'Bảo mật S3 — Bucket Policy & Encryption', content:'Bucket Policy là JSON định nghĩa quyền truy cập ở cấp bucket, áp dụng cho mọi object (khác IAM Policy gán cho user/role). Server-Side Encryption mã hóa dữ liệu tại nghỉ, dùng SSE-S3 (AWS tự quản lý khóa) hoặc SSE-KMS (kiểm soát chi tiết hơn). Pre-signed URL cấp quyền truy cập TẠM THỜI vào 1 object cụ thể mà không cần thay đổi quyền bucket.', exercises:['Bật Server-Side Encryption (SSE-S3) mặc định cho bucket.','Tạo 1 Pre-signed URL cho 1 object có thời hạn 1 giờ, test truy cập.','Viết 1 Bucket Policy DENY toàn bộ truy cập nếu request không dùng HTTPS.','Thử upload 1 file mới sau khi bật Encryption mặc định, xác nhận file tự động được mã hóa.','Viết thêm 1 điều kiện trong Bucket Policy chỉ cho phép truy cập từ 1 dải IP cụ thể.'], quiz:[
{q:"Bucket Policy áp dụng ở cấp nào?", opts:["Cấp user", "Cấp bucket, ảnh hưởng mọi object trong đó", "Cấp Region", "Cấp tài khoản"], correct:1, explain:"Bucket Policy gắn với chính bucket, áp dụng cho mọi object bên trong."},
{q:"SSE-S3 nghĩa là gì?", opts:["Không mã hóa", "Server-Side Encryption với khóa do AWS tự quản lý", "Mã hóa phía client", "Không tồn tại"], correct:1, explain:"SSE-S3 là mã hóa phía server, khóa được AWS tự động quản lý."},
{q:"SSE-KMS khác SSE-S3 ở điểm nào?", opts:["Không khác gì", "SSE-KMS cho kiểm soát khóa mã hóa chi tiết hơn qua dịch vụ KMS", "SSE-KMS không mã hóa thật", "SSE-S3 mạnh hơn"], correct:1, explain:"SSE-KMS tích hợp với KMS, cho phép kiểm soát và audit khóa chi tiết hơn."},
{q:"Pre-signed URL dùng để làm gì?", opts:["Xóa bucket vĩnh viễn", "Cấp quyền truy cập tạm thời có thời hạn vào 1 object", "Tạo IAM User", "Đổi Region"], correct:1, explain:"Pre-signed URL cho phép chia sẻ quyền truy cập tạm thời không cần thay đổi quyền bucket."},
{q:"aws:SecureTransport trong policy dùng để kiểm tra gì?", opts:["Tốc độ mạng", "Request có dùng HTTPS hay không", "Dung lượng file", "Tên người dùng"], correct:1, explain:"Điều kiện này kiểm tra request có được mã hóa qua HTTPS không."},
{q:"Nên mã hóa dữ liệu nhạy cảm trên S3 không?", opts:["Không cần thiết", "Có, nên bật Server-Side Encryption mặc định", "Chỉ cần với file nhỏ", "AWS tự động làm hết không cần quan tâm"], correct:1, explain:"Bật mã hóa mặc định là thực hành bảo mật cơ bản nên áp dụng."},
{q:"Bucket Policy khác IAM Policy ở điểm nào?", opts:["Không khác gì", "Bucket Policy gắn với bucket cụ thể; IAM Policy gắn với danh tính (user/role)", "IAM Policy chỉ dùng cho S3", "Bucket Policy không dùng JSON"], correct:1, explain:"Đây là 2 cách tiếp cận khác nhau: theo tài nguyên (bucket) hay theo danh tính (user/role)."},
{q:"Pre-signed URL có thời hạn không?", opts:["Không, dùng vĩnh viễn", "Có, có thể đặt thời hạn cụ thể (ví dụ 1 giờ)", "Chỉ dùng 1 lần duy nhất", "Không thể tạo được"], correct:1, explain:"Có thể tùy chỉnh thời hạn hiệu lực của URL khi tạo."},
{q:"Vì sao nên viết Policy DENY nếu request không dùng HTTPS?", opts:["Không cần thiết", "Đảm bảo dữ liệu truyền tải luôn được mã hóa, tránh lộ thông tin", "Chỉ để tăng tốc độ", "Bắt buộc theo cú pháp AWS"], correct:1, explain:"Buộc dùng HTTPS đảm bảo dữ liệu không bị lộ khi truyền qua mạng."},
{q:"Khi bật Encryption mặc định, file mới upload sẽ như thế nào?", opts:["Không bị ảnh hưởng gì", "Tự động được mã hóa theo cấu hình đã đặt", "Bị từ chối upload", "Phải mã hóa thủ công từng file"], correct:1, explain:"Encryption mặc định áp dụng tự động cho mọi file upload sau khi bật."},
]},
{label:'Thứ 6', title:'Tổng kết tuần 3 & thực hành tổng hợp', content:'S3 là dịch vụ nền tảng nhất của AWS, dùng làm backend lưu trữ cho rất nhiều dịch vụ khác. Kiến thức trọng tâm: phân biệt storage class theo tần suất truy cập, hiểu Versioning để bảo vệ dữ liệu, luôn cẩn trọng với cấu hình public access. Đề thi SAA thường có câu hỏi tình huống yêu cầu chọn đúng storage class hoặc thiết kế Lifecycle Policy.', exercises:['Tự thiết kế 1 Lifecycle Policy hoàn chỉnh: log file giữ 30 ngày ở Standard, sau đó Glacier, xóa hẳn sau 1 năm.','Ôn lại điểm khác biệt giữa Bucket Policy và IAM Policy bằng lời của bạn.','Dọn dẹp bucket test không cần dùng để tránh phát sinh phí.','So sánh bảng giá 3 storage class (Standard/IA/Glacier) cho chính dữ liệu bạn đã upload tuần này.','Viết lại quy trình bạn sẽ làm nếu cần host 1 website tĩnh thật cho dự án cá nhân, từ đầu đến cuối.'], quiz:[
{q:"Tên bucket S3 cần đáp ứng điều kiện gì?", opts:["Duy nhất trong tài khoản của bạn","Duy nhất TOÀN CẦU","Không cần duy nhất","Chỉ cần duy nhất trong Region"], correct:1, explain:"Tên bucket S3 phải duy nhất trên toàn bộ AWS, không chỉ riêng tài khoản của bạn."},
{q:"S3 mặc định có public access không?", opts:["Có, mặc định public","Mặc định BLOCK toàn bộ public access","Chỉ public với file nhỏ","Tùy Region"], correct:1, explain:"S3 mặc định chặn toàn bộ truy cập công khai — đây là thiết lập an toàn nên giữ nguyên trừ khi thực sự cần."},
{q:"Storage class nào rẻ nhất nhưng thời gian truy xuất chậm nhất?", opts:["S3 Standard","S3 Standard-IA","S3 Glacier","Không có sự khác biệt"], correct:2, explain:"Glacier tối ưu cho lưu trữ lâu dài với chi phí thấp, đánh đổi bằng thời gian truy xuất chậm hơn (vài phút đến vài giờ)."},
{q:"Versioning giúp ích gì?", opts:["Tăng tốc độ truy cập","Giữ lại nhiều phiên bản của object, khôi phục khi bị xóa/ghi đè nhầm","Giảm chi phí","Mã hóa dữ liệu"], correct:1, explain:"Versioning lưu lại lịch sử các phiên bản, giúp khôi phục dữ liệu khi bị ghi đè hoặc xóa nhầm."},
{q:"Lifecycle Policy dùng để làm gì?", opts:["Tự động chuyển storage class hoặc xóa object theo thời gian","Tạo bucket mới","Đổi tên bucket","Backup toàn bộ tài khoản"], correct:0, explain:"Lifecycle Policy tự động hóa việc quản lý vòng đời dữ liệu để tối ưu chi phí."},
{q:"Bucket Policy khác IAM Policy ở điểm nào?", opts:["Không khác gì","Bucket Policy áp dụng ở cấp bucket cho mọi object; IAM Policy gán cho user/role cụ thể","Bucket Policy chỉ dùng cho EC2","IAM Policy chỉ áp dụng cho S3"], correct:1, explain:"Bucket Policy gắn với chính bucket đó; IAM Policy gắn với danh tính (user/role) truy cập vào nhiều tài nguyên khác nhau."},
{q:"SSE-S3 và SSE-KMS khác nhau ở điểm nào?", opts:["Không khác gì","SSE-S3 để AWS tự quản lý khóa mã hóa; SSE-KMS cho kiểm soát khóa chi tiết hơn","SSE-KMS miễn phí hơn","SSE-S3 không mã hóa thật"], correct:1, explain:"SSE-KMS cho phép kiểm soát và audit khóa mã hóa chi tiết hơn thông qua dịch vụ KMS."},
{q:"Pre-signed URL dùng để làm gì?", opts:["Xóa bucket","Cấp quyền truy cập tạm thời vào 1 object cụ thể có thời hạn","Tạo user mới","Đổi Region"], correct:1, explain:"Pre-signed URL cho phép chia sẻ quyền truy cập tạm thời vào 1 object mà không cần thay đổi quyền bucket."},
{q:"S3 Static Website Hosting yêu cầu gì để hoạt động public?", opts:["Không cần cấu hình gì","Cần Bucket Policy cho phép public read","Cần trả phí thêm","Không thể làm được"], correct:1, explain:"Cần cấu hình Bucket Policy cho phép đọc công khai thì website tĩnh mới truy cập được từ bên ngoài."},
{q:"Nguyên nhân phổ biến nhất gây rò rỉ dữ liệu S3 trong thực tế là gì?", opts:["AWS bị hack","Bucket bị cấu hình public nhầm","Mất mật khẩu","Lỗi phần cứng"], correct:1, explain:"Lỗi cấu hình public access nhầm là nguyên nhân phổ biến nhất trong các sự cố rò rỉ dữ liệu S3 thực tế."},
{q:"S3 có độ bền dữ liệu (durability) khoảng bao nhiêu?", opts:["99%","99.9%","99.999999999% (11 số 9)","100% tuyệt đối"], correct:2, explain:"S3 cam kết độ bền cực cao (99.999999999%), gần như không bao giờ mất dữ liệu do lỗi hạ tầng AWS."},
{q:"Khi nào nên dùng Standard-IA thay vì Standard?", opts:["Dữ liệu truy cập thường xuyên hàng ngày","Dữ liệu ít truy cập nhưng cần sẵn sàng khi cần","Dữ liệu không bao giờ cần nữa","Không có sự khác biệt"], correct:1, explain:"Standard-IA tối ưu chi phí cho dữ liệu ít truy cập nhưng vẫn cần lấy nhanh khi cần, khác Glacier vốn dùng cho lưu trữ dài hạn."},
]},
]},
{title:"VPC — mạng ảo & tổng kết tháng 1", points:["VPC là mạng ảo riêng biệt trong AWS, cho phép kiểm soát toàn bộ hạ tầng mạng.","Subnet chia VPC thành các vùng nhỏ hơn — public subnet có route ra internet, private subnet thì không.","Internet Gateway cho phép public subnet truy cập internet; NAT Gateway cho phép private subnet truy cập internet ra ngoài mà không bị truy cập ngược vào.","Route Table quyết định traffic từ subnet đi đâu — mỗi subnet phải gắn với 1 route table.","Hiểu rõ VPC là nền tảng bắt buộc để hiểu hầu hết các dịch vụ AWS khác (EC2, RDS... đều chạy trong VPC)."], practice:"Tạo 1 VPC mới với 1 public subnet và 1 private subnet, cấu hình Internet Gateway cho public subnet.", case:"Thiết kế VPC đúng cách (public/private subnet tách biệt) là yêu cầu bảo mật cơ bản cho hầu hết kiến trúc production trên AWS.", task:"Đặt 1 EC2 instance vào private subnet vừa tạo, xác nhận nó không truy cập được internet trực tiếp, sau đó thêm NAT Gateway để khắc phục.", days:[
{label:'Thứ 2', title:'VPC, Subnet cơ bản', content:'VPC là mạng ảo riêng biệt hoàn toàn trong AWS, bạn tự định nghĩa dải IP (CIDR block, ví dụ 10.0.0.0/16). Subnet chia VPC thành các vùng nhỏ hơn, mỗi subnet nằm trong 1 Availability Zone cụ thể. Public Subnet có route đến Internet Gateway; Private Subnet không có route đó. Mỗi AWS Account có sẵn 1 Default VPC, nhưng thiết kế production nên tạo VPC riêng theo nhu cầu.', exercises:['Đọc và hiểu ký hiệu CIDR (ví dụ 10.0.0.0/16 nghĩa là gì, /24 khác gì).','Tạo 1 VPC mới với CIDR 10.0.0.0/16.','Tạo 2 Subnet trong VPC đó, đặt tên rõ ràng "public-subnet" và "private-subnet".','Vẽ sơ đồ CIDR: từ dải 10.0.0.0/16, chia ra ít nhất 4 subnet /24 khác nhau trên giấy.','Tìm hiểu VPC Peering là gì, dùng để làm gì khi có nhiều VPC cần giao tiếp với nhau.'], quiz:[
{q:"VPC là gì?", opts:["1 loại EC2 instance", "Mạng ảo riêng biệt, tự định nghĩa dải IP", "Dịch vụ lưu trữ", "Công cụ giám sát"], correct:1, explain:"VPC là mạng ảo hoàn toàn riêng, bạn tự kiểm soát cấu trúc và dải IP."},
{q:"CIDR block dùng để làm gì?", opts:["Đặt tên VPC", "Định nghĩa dải địa chỉ IP cho VPC/subnet", "Mã hóa traffic", "Tính chi phí"], correct:1, explain:"CIDR biểu diễn dải địa chỉ IP có thể dùng trong VPC/subnet."},
{q:"Subnet là gì?", opts:["1 loại instance", "Vùng nhỏ hơn chia từ VPC, nằm trong 1 AZ cụ thể", "Loại storage", "Tên miền"], correct:1, explain:"Subnet là 1 phần của VPC, luôn thuộc về 1 Availability Zone."},
{q:"Public Subnet khác Private Subnet ở điểm nào?", opts:["Không khác gì", "Public Subnet có route đến Internet Gateway", "Public Subnet luôn nhỏ hơn", "Private Subnet nhanh hơn"], correct:1, explain:"Khác biệt cốt lõi nằm ở route table: có hay không route ra Internet Gateway."},
{q:"Mỗi AWS Account có sẵn gì để dùng ngay?", opts:["Không có gì sẵn", "1 Default VPC", "10 VPC miễn phí", "Không có VPC mặc định"], correct:1, explain:"AWS tự động tạo sẵn 1 Default VPC cho mỗi account mới."},
{q:"10.0.0.0/16 cho phép khoảng bao nhiêu địa chỉ IP?", opts:["256", "65536", "16", "Không giới hạn"], correct:1, explain:"/16 để lại 16 bit linh hoạt, tương đương 2^16 = 65536 địa chỉ."},
{q:"Vì sao production nên tạo VPC riêng thay vì dùng Default VPC?", opts:["Không có lý do gì", "Kiểm soát tốt hơn về bảo mật và cấu trúc mạng theo nhu cầu riêng", "Default VPC không hoạt động được", "Bắt buộc theo quy định"], correct:1, explain:"VPC riêng cho phép thiết kế mạng chặt chẽ, phù hợp yêu cầu bảo mật thực tế."},
{q:"1 Subnet có thể nằm trong nhiều AZ cùng lúc không?", opts:["Có, không giới hạn", "Không, mỗi subnet chỉ nằm trong 1 AZ cụ thể", "Luôn nằm trong tất cả AZ", "Không liên quan đến AZ"], correct:1, explain:"Mỗi subnet gắn cố định với đúng 1 Availability Zone."},
{q:"/24 so với /16 thì dải IP nhỏ hơn hay lớn hơn?", opts:["/24 nhỏ hơn (ít địa chỉ hơn)", "/24 lớn hơn", "Bằng nhau", "Không liên quan"], correct:0, explain:"Số sau dấu / càng lớn thì dải IP càng nhỏ (ít địa chỉ khả dụng hơn)."},
{q:"VPC giúp ích gì cho việc kiểm soát hạ tầng?", opts:["Không giúp ích gì", "Cho phép kiểm soát toàn bộ hạ tầng mạng theo ý muốn", "Chỉ dùng để tính phí", "Chỉ áp dụng cho S3"], correct:1, explain:"VPC là nền tảng để thiết kế toàn bộ kiến trúc mạng cho hệ thống."},
]},
{label:'Thứ 3', title:'Internet Gateway, Route Table', content:'Internet Gateway là cổng kết nối VPC với internet, mỗi VPC chỉ gắn được 1 IGW. Route Table định nghĩa "traffic từ subnet này nên đi đâu" — mỗi subnet phải liên kết với đúng 1 route table. Để 1 subnet trở thành "public", route table của nó cần có route 0.0.0.0/0 trỏ đến Internet Gateway. Instance trong public subnet vẫn cần có Public IP hoặc Elastic IP thì mới thực sự truy cập được internet.', exercises:['Tạo 1 Internet Gateway, gắn vào VPC đã tạo ở Thứ 2.','Tạo 1 Route Table mới, thêm route 0.0.0.0/0 → Internet Gateway, gắn vào public subnet.','Khởi tạo 1 EC2 instance trong public subnet, xác nhận truy cập internet được.','Thử tạo 1 subnet thứ 3, KHÔNG gắn route table public, xác nhận nó vẫn là private theo mặc định.','Xem Route Table hiện tại của VPC, liệt kê toàn bộ route đang có và giải thích ý nghĩa từng route.'], quiz:[
{q:"Internet Gateway dùng để làm gì?", opts:["Mã hóa dữ liệu", "Cổng kết nối VPC với internet", "Lưu trữ file", "Giám sát chi phí"], correct:1, explain:"IGW là thành phần bắt buộc để VPC giao tiếp được với internet."},
{q:"Mỗi VPC gắn được bao nhiêu Internet Gateway?", opts:["Không giới hạn", "Chỉ 1", "0", "Tối thiểu 5"], correct:1, explain:"Mỗi VPC chỉ gắn được đúng 1 Internet Gateway."},
{q:"Route Table dùng để làm gì?", opts:["Lưu trữ dữ liệu", "Định nghĩa traffic từ subnet nên đi đâu", "Mã hóa traffic", "Tạo IAM User"], correct:1, explain:"Route Table là bản đồ chỉ đường cho traffic mạng."},
{q:"Để 1 subnet trở thành public, route table cần có gì?", opts:["Không cần gì đặc biệt", "Route 0.0.0.0/0 trỏ đến Internet Gateway", "Chỉ cần đặt tên là public", "Cần xóa hết route khác"], correct:1, explain:"Route ra IGW là điều kiện để subnet được coi là public."},
{q:"Mỗi subnet cần liên kết với bao nhiêu route table?", opts:["0", "Đúng 1 route table", "Ít nhất 5", "Không cần liên kết"], correct:1, explain:"Mỗi subnet luôn liên kết với đúng 1 route table tại 1 thời điểm."},
{q:"Instance trong public subnet có tự động truy cập internet được không nếu không có Public/Elastic IP?", opts:["Có, luôn tự động được", "Không, vẫn cần có Public IP hoặc Elastic IP", "Không liên quan đến IP", "Luôn bị chặn dù có IP"], correct:1, explain:"Route table chỉ định đường đi; instance vẫn cần có IP public để thực sự giao tiếp được."},
{q:"Nhiều subnet có thể dùng chung 1 route table không?", opts:["Không bao giờ được", "Có thể, nhiều subnet có thể dùng chung 1 route table", "Chỉ 2 subnet được dùng chung", "Chỉ Public Subnet mới dùng chung được"], correct:1, explain:"1 route table có thể được gắn cho nhiều subnet cùng lúc."},
{q:"Nếu 1 subnet KHÔNG gắn route table nào có route ra Internet Gateway, nó là loại subnet gì?", opts:["Public Subnet", "Private Subnet (mặc định)", "Không tồn tại được", "Luôn là Public"], correct:1, explain:"Không có route ra IGW đồng nghĩa subnet đó là private theo mặc định."},
{q:"Route trong Route Table gồm những thành phần chính nào?", opts:["Chỉ có đích đến", "Destination (đích) và Target (đường đi qua đâu)", "Chỉ có tên", "Không có cấu trúc cụ thể"], correct:1, explain:"Mỗi route gồm Destination (dải IP đích) và Target (nơi traffic đi qua, ví dụ IGW)."},
{q:"Internet Gateway có tính phí theo giờ sử dụng như NAT Gateway không?", opts:["Có, tính phí giống NAT Gateway", "Không, Internet Gateway không tính phí theo giờ như NAT Gateway", "Đắt hơn NAT Gateway", "Chỉ tính phí ban đêm"], correct:1, explain:"Khác NAT Gateway, Internet Gateway không tính phí theo giờ hoạt động."},
]},
{label:'Thứ 4', title:'NAT Gateway & Private Subnet', content:'NAT Gateway cho phép instance trong Private Subnet chủ động kết nối RA internet mà KHÔNG cho phép kết nối NGƯỢC VÀO — bảo mật hơn Public Subnet. NAT Gateway phải đặt trong Public Subnet. Route Table của Private Subnet cần route 0.0.0.0/0 trỏ đến NAT Gateway (không trỏ trực tiếp đến Internet Gateway). NAT Gateway tính phí theo giờ hoạt động + lượng dữ liệu xử lý.', exercises:['Tạo 1 NAT Gateway trong public subnet, gán Elastic IP cho nó.','Tạo Route Table riêng cho private subnet với route 0.0.0.0/0 → NAT Gateway.','Khởi tạo 1 EC2 instance trong private subnet, xác nhận nó tải được update qua NAT Gateway nhưng không truy cập trực tiếp từ internet vào được.','Tính chi phí ước tính của NAT Gateway nếu chạy 24/7 trong 1 tháng, so sánh với chi phí EC2 t2.micro.','Tìm hiểu NAT Instance (dùng EC2 thường) khác gì với NAT Gateway (dịch vụ quản lý), khi nào nên dùng loại nào.'], quiz:[
{q:"NAT Gateway đặt ở đâu?", opts:["Private Subnet", "Public Subnet", "Ngoài VPC", "Không cần đặt cụ thể"], correct:1, explain:"NAT Gateway cần có route ra internet nên phải đặt trong Public Subnet."},
{q:"NAT Gateway giúp Private Subnet làm gì?", opts:["Truy cập internet 2 chiều tự do", "Chủ động kết nối RA internet mà không bị truy cập ngược VÀO", "Chặn hoàn toàn mọi kết nối", "Tăng tốc độ CPU"], correct:1, explain:"NAT Gateway cho phép truy cập 1 chiều ra ngoài, bảo vệ khỏi kết nối ngược vào."},
{q:"NAT Gateway cần gì để hoạt động?", opts:["Không cần gì đặc biệt", "Elastic IP và route đến Internet Gateway", "Chỉ cần Security Group", "Chỉ hoạt động trong Private Subnet"], correct:1, explain:"NAT Gateway cần Elastic IP riêng và đặt trong subnet có route ra IGW."},
{q:"NAT Instance khác NAT Gateway thế nào?", opts:["Không khác gì", "NAT Instance dùng EC2 thường tự quản lý; NAT Gateway là dịch vụ AWS quản lý hoàn toàn", "NAT Instance mạnh hơn", "NAT Gateway miễn phí hoàn toàn"], correct:1, explain:"NAT Gateway là dịch vụ managed, tiện lợi hơn nhưng tốn phí hơn NAT Instance tự quản lý."},
{q:"NAT Gateway tính phí theo yếu tố nào?", opts:["Miễn phí hoàn toàn", "Giờ hoạt động + lượng dữ liệu xử lý", "Chỉ tính 1 lần duy nhất", "Theo số lượng instance"], correct:1, explain:"Chi phí NAT Gateway gồm phí theo giờ và phí theo lượng dữ liệu xử lý."},
{q:"Route Table của Private Subnet cần trỏ 0.0.0.0/0 đến đâu?", opts:["Internet Gateway trực tiếp", "NAT Gateway", "Không cần route gì", "S3 Gateway"], correct:1, explain:"Private Subnet route ra ngoài qua NAT Gateway, không trực tiếp qua IGW."},
{q:"Vì sao Private Subnet an toàn hơn Public Subnet?", opts:["Không có lý do gì", "Không có route trực tiếp từ internet vào, giảm bề mặt tấn công", "Private Subnet nhanh hơn", "Private Subnet miễn phí"], correct:1, explain:"Không có route trực tiếp từ internet vào giúp giảm nguy cơ bị tấn công trực tiếp."},
{q:"Instance trong Private Subnet có Public IP không thông thường?", opts:["Có, luôn có", "Thông thường không có Public IP", "Bắt buộc phải có", "Không liên quan đến Public IP"], correct:1, explain:"Instance private thường không cần và không có Public IP."},
{q:"Nếu quên thêm NAT Gateway, instance Private Subnet có tải được update từ internet không?", opts:["Có, vẫn tải được bình thường", "Không, sẽ không truy cập được internet ra ngoài", "Luôn tải được", "Không liên quan"], correct:1, explain:"Không có NAT Gateway thì Private Subnet hoàn toàn không có đường ra internet."},
{q:"Vì sao nên tắt NAT Gateway khi không dùng đến trong quá trình học?", opts:["Không cần thiết", "NAT Gateway tính phí theo giờ, để chạy không cần thiết sẽ tốn chi phí", "NAT Gateway miễn phí nên không cần tắt", "Không thể tắt được"], correct:1, explain:"NAT Gateway là 1 trong những dịch vụ dễ gây phát sinh chi phí nếu quên tắt khi không dùng."},
]},
{label:'Thứ 5', title:'Network ACL vs Security Group', content:'Network ACL (NACL) hoạt động ở cấp SUBNET, là tầng bảo mật thứ 2 sau Security Group. NACL là STATELESS — phải tự định nghĩa rule cho cả inbound VÀ outbound riêng biệt. NACL hỗ trợ cả Allow và Deny rule; xử lý rule theo thứ tự số (rule số nhỏ hơn được ưu tiên xét trước). Mỗi VPC có 1 Default NACL cho phép tất cả traffic.', exercises:['Xem Default NACL của VPC, đọc hiểu các rule mặc định.','Tạo 1 Custom NACL, thử thêm 1 Deny rule chặn 1 IP cụ thể.','Viết 1 bảng so sánh (Security Group vs NACL) theo 4 tiêu chí: cấp áp dụng, stateful/stateless, Allow/Deny, cách xử lý rule.','Thử đặt 1 Deny rule có số thứ tự nhỏ hơn 1 Allow rule cho cùng điều kiện, quan sát rule nào được áp dụng.','Vẽ sơ đồ minh họa traffic đi qua cả NACL và Security Group theo đúng thứ tự khi vào 1 instance.'], quiz:[
{q:"Network ACL hoạt động ở cấp nào?", opts:["Cấp instance", "Cấp Subnet", "Cấp Region", "Cấp tài khoản"], correct:1, explain:"NACL là tầng bảo mật hoạt động ở cấp subnet, khác Security Group (cấp instance)."},
{q:"NACL là stateless nghĩa là gì?", opts:["Tự động cho phép traffic phản hồi", "Phải tự định nghĩa rule riêng cho cả inbound VÀ outbound", "Không có rule nào", "Giống hệt Security Group"], correct:1, explain:"Khác Security Group, NACL cần định nghĩa rule riêng biệt cho cả 2 chiều traffic."},
{q:"NACL hỗ trợ loại rule nào?", opts:["Chỉ Allow", "Cả Allow và Deny", "Chỉ Deny", "Không có rule"], correct:1, explain:"NACL hỗ trợ cả Allow và Deny, khác Security Group chỉ có Allow."},
{q:"NACL xử lý rule theo thứ tự nào?", opts:["Ngẫu nhiên", "Theo số thứ tự, rule số nhỏ hơn được ưu tiên xét trước", "Luôn xét rule cuối", "Không có thứ tự"], correct:1, explain:"NACL xét rule tuần tự theo số thứ tự, dừng ở rule đầu tiên khớp."},
{q:"Default NACL của VPC mặc định cho phép gì?", opts:["Chặn tất cả", "Cho phép tất cả traffic", "Chỉ cho phép HTTP", "Không hoạt động"], correct:1, explain:"Default NACL mặc định cho phép toàn bộ traffic ra vào."},
{q:"Security Group khác NACL ở điểm cốt lõi nào?", opts:["Không khác gì", "Security Group ở cấp instance, stateful; NACL ở cấp subnet, stateless", "NACL ở cấp instance", "Security Group chỉ có Deny"], correct:1, explain:"Đây là 2 khác biệt then chốt: cấp áp dụng và cơ chế stateful/stateless."},
{q:"Muốn chặn 1 IP cụ thể ở cấp subnet, nên dùng gì?", opts:["Chỉ Security Group", "Custom NACL với Deny rule", "Không thể chặn được", "Chỉ IAM Policy"], correct:1, explain:"NACL hỗ trợ Deny rule, phù hợp để chặn hẳn 1 IP ở cấp subnet."},
{q:"Traffic vào 1 instance đi qua thành phần nào trước?", opts:["Chỉ Security Group", "NACL (cấp subnet) trước, sau đó đến Security Group (cấp instance)", "Chỉ NACL", "Không theo thứ tự nào"], correct:1, explain:"Traffic đi qua NACL ở cấp subnet trước khi đến Security Group ở cấp instance."},
{q:"Vì sao NACL cần cấu hình rule outbound riêng dù đã cho phép inbound?", opts:["Không cần thiết", "Vì NACL stateless, không tự động cho phép traffic phản hồi như Security Group", "NACL không có outbound", "Luôn tự động giống Security Group"], correct:1, explain:"Do tính chất stateless, NACL cần rule tường minh cho cả 2 chiều traffic."},
{q:"Rule có số thứ tự nhỏ hơn trong NACL có ý nghĩa gì?", opts:["Không quan trọng", "Được xét và áp dụng trước các rule số lớn hơn", "Luôn bị bỏ qua", "Chỉ áp dụng cho outbound"], correct:1, explain:"NACL xét rule theo thứ tự số tăng dần, số nhỏ hơn có độ ưu tiên cao hơn."},
]},
{label:'Thứ 6', title:'Tổng kết tháng 1 — vẽ sơ đồ kiến trúc hoàn chỉnh', content:'Sau 4 tuần, bạn đã có đủ kiến thức nền tảng để hiểu và tự thiết kế 1 kiến trúc VPC 2 tầng cơ bản — pattern xuất hiện trong phần lớn câu hỏi thiết kế của đề thi SAA. Việc kết hợp EC2 + S3 + VPC là nền tảng để tháng 2 học các dịch vụ nâng cao hơn. Một Solutions Architect giỏi không chỉ biết dùng từng dịch vụ riêng lẻ mà phải biết cách chúng phối hợp với nhau.', exercises:['Vẽ sơ đồ hoàn chỉnh toàn bộ hạ tầng đã tạo trong tháng 1: VPC, 2 subnet, IGW, NAT Gateway, EC2 instances, S3 bucket.','Viết đoạn tóm tắt (5-6 câu) giải thích luồng traffic: người dùng truy cập web server ở public subnet, private subnet kết nối internet qua đâu.','Dọn dẹp toàn bộ tài nguyên test (NAT Gateway đặc biệt tốn phí) trước khi nghỉ, chuẩn bị cho tháng 2.','Ước tính tổng chi phí AWS đã phát sinh trong tháng 1 (kiểm tra Billing Dashboard thật).','Viết ra 3 khái niệm bạn tự tin nhất và 3 khái niệm còn mơ hồ nhất sau tháng 1, làm mục tiêu ôn tập.'], quiz:[
{q:"VPC là gì?", opts:["1 loại EC2 instance","Mạng ảo riêng biệt trong AWS, tự định nghĩa dải IP","Dịch vụ lưu trữ","Công cụ giám sát"], correct:1, explain:"VPC (Virtual Private Cloud) là mạng ảo hoàn toàn riêng biệt, bạn tự kiểm soát dải IP và cấu trúc mạng."},
{q:"Public Subnet khác Private Subnet ở điểm nào?", opts:["Không khác gì","Public Subnet có route đến Internet Gateway; Private Subnet thì không","Public Subnet miễn phí hơn","Private Subnet nhanh hơn"], correct:1, explain:"Sự khác biệt cốt lõi là route table: Public Subnet có route ra internet qua IGW, Private Subnet thì không."},
{q:"Internet Gateway dùng để làm gì?", opts:["Mã hóa dữ liệu","Cổng kết nối VPC với internet","Lưu trữ file","Giám sát chi phí"], correct:1, explain:"IGW là thành phần bắt buộc để VPC có thể giao tiếp với internet bên ngoài."},
{q:"NAT Gateway nên đặt ở đâu?", opts:["Private Subnet","Public Subnet","Ngoài VPC","Không cần đặt ở đâu cụ thể"], correct:1, explain:"NAT Gateway cần có Elastic IP và route ra Internet Gateway, nên phải đặt trong Public Subnet."},
{q:"NAT Gateway giúp ích gì cho Private Subnet?", opts:["Cho phép truy cập internet 2 chiều","Cho phép instance chủ động kết nối RA internet nhưng không cho kết nối ngược VÀO","Chặn hoàn toàn internet","Tăng tốc độ mạng"], correct:1, explain:"NAT Gateway cho phép truy cập 1 chiều ra ngoài (ví dụ tải update) mà vẫn giữ an toàn không bị truy cập ngược vào."},
{q:"Network ACL khác Security Group ở điểm quan trọng nào?", opts:["Không khác gì","NACL hoạt động ở cấp subnet và stateless; Security Group ở cấp instance và stateful","NACL chỉ có Allow, không có Deny","Security Group ở cấp subnet"], correct:1, explain:"Đây là 2 khác biệt cốt lõi: cấp áp dụng (subnet vs instance) và cơ chế (stateless vs stateful)."},
{q:"Route Table dùng để làm gì?", opts:["Lưu trữ dữ liệu","Định nghĩa traffic từ subnet nên đi đâu","Mã hóa traffic","Tạo IAM User"], correct:1, explain:"Route Table là \"bản đồ chỉ đường\" cho traffic mạng trong VPC."},
{q:"CIDR block 10.0.0.0/16 cho phép khoảng bao nhiêu địa chỉ IP?", opts:["256 địa chỉ","65536 địa chỉ","16 địa chỉ","Không giới hạn"], correct:1, explain:"/16 nghĩa là 16 bit đầu cố định, còn lại 16 bit linh hoạt → 2^16 = 65536 địa chỉ."},
{q:"Region và Availability Zone khác nhau thế nào?", opts:["Không khác gì","Region là khu vực địa lý lớn chứa nhiều Availability Zone (trung tâm dữ liệu độc lập)","AZ lớn hơn Region","Chỉ có 1 AZ trên toàn cầu"], correct:1, explain:"1 Region chứa nhiều AZ độc lập về mặt vật lý, giúp thiết kế hệ thống chịu lỗi cao (high availability)."},
{q:"NACL xử lý các rule theo thứ tự nào?", opts:["Ngẫu nhiên","Theo số thứ tự, rule số nhỏ hơn được ưu tiên xét trước","Luôn xét rule cuối cùng trước","Không có thứ tự"], correct:1, explain:"NACL xét rule theo số thứ tự tăng dần, dừng lại ở rule đầu tiên khớp điều kiện."},
{q:"Vì sao nên tách Public/Private Subnet trong thiết kế VPC?", opts:["Không có lý do đặc biệt","Bảo mật — dữ liệu nhạy cảm (database) nên đặt ở Private Subnet, không truy cập trực tiếp từ internet","Chỉ để tiết kiệm chi phí","Bắt buộc theo luật"], correct:1, explain:"Tách lớp giúp giảm bề mặt tấn công — dữ liệu quan trọng không tiếp xúc trực tiếp với internet."},
{q:"Well-Architected Framework của AWS gồm bao nhiêu trụ cột chính?", opts:["3","5","7","10"], correct:1, explain:"5 trụ cột: Operational Excellence, Security, Reliability, Performance Efficiency, Cost Optimization."},
]},
]},
{title:"RDS — cơ sở dữ liệu quản lý", points:["RDS là dịch vụ database quan hệ được AWS quản lý, tự động xử lý backup, patching, scaling.","Multi-AZ deployment tạo bản sao đồng bộ ở Availability Zone khác, tự động failover khi AZ chính gặp sự cố.","Read Replica tạo bản sao chỉ đọc để giảm tải cho instance chính, khác với Multi-AZ (dùng cho failover, không dùng để đọc).","RDS Automated Backup lưu trữ backup hàng ngày, cho phép khôi phục về bất kỳ thời điểm nào trong khoảng retention period.","So với tự cài database trên EC2, RDS giảm đáng kể công sức vận hành nhưng đánh đổi ít quyền kiểm soát hơn."], practice:"Tạo 1 RDS instance (MySQL, free tier), kết nối từ EC2 instance ở tuần trước tới database này.", case:"Phân biệt Multi-AZ (failover) và Read Replica (scale đọc) là câu hỏi kinh điển trong đề thi SAA.", task:"Bật Automated Backup cho RDS instance, thử tạo 1 snapshot thủ công và khôi phục database từ snapshot đó.", days:[
{label:'Thứ 2', title:'RDS cơ bản & Engine lựa chọn', content:'RDS hỗ trợ nhiều database engine: MySQL, PostgreSQL, MariaDB, Oracle, SQL Server, và Amazon Aurora (engine riêng của AWS, tương thích MySQL/PostgreSQL nhưng hiệu năng cao hơn). Khi tạo RDS instance, cần chọn Instance Class (quyết định CPU/RAM, tương tự EC2 instance type) và Storage Type (gp3 cho general purpose, io1/io2 cho I/O cao). RDS tự động xử lý các tác vụ vận hành: cài đặt engine, patching bảo mật, backup định kỳ — giảm đáng kể khối lượng công việc DBA so với tự quản lý database trên EC2. Free Tier RDS cho phép dùng db.t3.micro miễn phí 750 giờ/tháng trong 12 tháng đầu.', exercises:["Tạo 1 RDS instance MySQL (db.t3.micro, free tier), ghi chú lại endpoint kết nối được cấp.","So sánh Aurora với MySQL/PostgreSQL thường về hiệu năng và chi phí qua tài liệu AWS.","Thử kết nối vào RDS instance vừa tạo bằng công cụ client (MySQL Workbench hoặc dòng lệnh mysql).","Tìm hiểu sự khác biệt giữa gp3 và io1 storage type cho RDS, khi nào nên dùng loại nào.","Đọc bảng giá RDS cho instance class db.t3.micro, ước tính chi phí nếu chạy 24/7 ngoài Free Tier."], quiz:[
{q:"RDS Free Tier áp dụng instance class nào?", opts:["db.t3.micro", "db.r5.large", "Mọi loại", "Không có free tier"], correct:0, explain:"Free Tier RDS áp dụng cho db.t3.micro (hoặc tương đương), 750 giờ/tháng trong 12 tháng đầu."},
{q:"Aurora là gì?", opts:["Loại VPC", "Engine database riêng của AWS, tương thích MySQL/PostgreSQL", "Loại Load Balancer", "Dịch vụ DNS"], correct:1, explain:"Aurora là engine tối ưu riêng của AWS, hiệu năng cao hơn MySQL/PostgreSQL gốc."},
{q:"Instance Class trong RDS tương tự khái niệm gì ở EC2?", opts:["Security Group", "Instance Type", "VPC", "IAM Role"], correct:1, explain:"Instance Class quyết định cấu hình CPU/RAM, tương đương Instance Type ở EC2."},
{q:"RDS tự động xử lý những tác vụ nào?", opts:["Không tự động gì cả", "Cài đặt engine, patching, backup định kỳ", "Chỉ backup", "Chỉ patching"], correct:1, explain:"RDS là managed service, tự động hóa toàn bộ các tác vụ vận hành cơ bản."},
{q:"So với tự cài database trên EC2, RDS đánh đổi điều gì?", opts:["Không đánh đổi gì", "Giảm quyền kiểm soát (không SSH vào OS) để lấy tiện lợi vận hành", "RDS luôn đắt hơn nhiều", "RDS không hỗ trợ backup"], correct:1, explain:"Đây là đánh đổi cốt lõi của mọi managed service."},
{q:"gp3 trong RDS Storage Type là loại gì?", opts:["Loại lưu trữ I/O rất cao chuyên dụng", "Loại general purpose phổ biến", "Không tồn tại", "Chỉ dùng cho Aurora"], correct:1, explain:"gp3 là storage type general purpose phổ biến nhất cho RDS."},
{q:"RDS hỗ trợ được bao nhiêu engine chính (ngoài Aurora)?", opts:["Chỉ 1", "5 (MySQL, PostgreSQL, MariaDB, Oracle, SQL Server)", "20", "Không giới hạn"], correct:1, explain:"5 engine truyền thống cộng với Aurora là engine riêng của AWS."},
{q:"Endpoint của RDS instance dùng để làm gì?", opts:["Địa chỉ để ứng dụng kết nối đến database", "Tên miền website", "Địa chỉ IP của EC2", "Không có tác dụng"], correct:0, explain:"Endpoint là địa chỉ (hostname) dùng để ứng dụng kết nối vào database."},
{q:"Khi mới tạo, RDS instance cần cấu hình gì để ứng dụng kết nối được?", opts:["Không cần cấu hình gì", "Security Group cho phép đúng port và nguồn kết nối", "Chỉ cần bật public", "Chỉ cần IAM Role"], correct:1, explain:"Cần mở đúng port (ví dụ 3306 cho MySQL) từ đúng nguồn (EC2/ứng dụng) trong Security Group."},
{q:"Vì sao Aurora thường có hiệu năng cao hơn MySQL/PostgreSQL gốc?", opts:["Không có sự khác biệt", "Aurora được AWS tối ưu kiến trúc lưu trữ riêng cho hiệu năng và độ bền cao hơn", "Aurora rẻ hơn nên nhanh hơn", "Aurora không phải database thật"], correct:1, explain:"Aurora dùng kiến trúc lưu trữ phân tán riêng, tối ưu hiệu năng và độ bền hơn engine gốc."},
]},
{label:'Thứ 3', title:'Multi-AZ & Read Replica', content:'Multi-AZ deployment tạo 1 bản sao ĐỒNG BỘ ở Availability Zone khác — khi AZ chính gặp sự cố, RDS tự động failover sang bản sao này, thời gian gián đoạn thường dưới 1-2 phút. Read Replica tạo bản sao BẤT ĐỒNG BỘ dùng để giảm tải truy vấn ĐỌC cho instance chính — có thể tạo nhiều Read Replica, thậm chí ở Region khác. Điểm khác biệt cốt lõi: Multi-AZ phục vụ HIGH AVAILABILITY, còn Read Replica phục vụ SCALE ĐỌC. Có thể kết hợp cả 2: Multi-AZ cho instance chính, cộng thêm Read Replica để scale đọc.', exercises:["Bật Multi-AZ cho RDS instance đã tạo, quan sát AWS tạo standby instance ở AZ khác.","Tạo 1 Read Replica từ instance chính, thử chạy truy vấn SELECT trên Read Replica.","Viết bảng so sánh Multi-AZ vs Read Replica theo 3 tiêu chí: mục đích, đồng bộ/bất đồng bộ, có đọc trực tiếp được không.","Tìm hiểu Cross-Region Read Replica dùng trong tình huống nào (ví dụ Disaster Recovery).","Tính thử: nếu ứng dụng có 90% truy vấn đọc và 10% ghi, thiết kế kiến trúc RDS phù hợp dùng bao nhiêu Read Replica."], quiz:[
{q:"Multi-AZ dùng bản sao đồng bộ hay bất đồng bộ?", opts:["Đồng bộ", "Bất đồng bộ", "Không có bản sao", "Tùy engine"], correct:0, explain:"Multi-AZ đồng bộ dữ liệu ngay lập tức để đảm bảo failover an toàn."},
{q:"Read Replica dùng để làm gì chủ yếu?", opts:["Failover tự động", "Giảm tải truy vấn đọc", "Mã hóa dữ liệu", "Backup tự động"], correct:1, explain:"Read Replica chuyên phục vụ mục đích scale truy vấn đọc."},
{q:"Khi AZ chính của RDS gặp sự cố (đã bật Multi-AZ), điều gì xảy ra?", opts:["Mất toàn bộ dữ liệu", "Tự động failover sang standby ở AZ khác", "Không có gì xảy ra", "Phải khôi phục thủ công"], correct:1, explain:"Đây chính là mục đích cốt lõi của Multi-AZ: failover tự động."},
{q:"Read Replica có thể đặt ở Region khác Region chính không?", opts:["Không bao giờ được", "Có, gọi là Cross-Region Read Replica", "Chỉ Aurora mới hỗ trợ", "Không liên quan đến Region"], correct:1, explain:"Cross-Region Read Replica hữu ích cho Disaster Recovery và giảm độ trễ theo khu vực."},
{q:"Multi-AZ standby instance có thể dùng để đọc trực tiếp bình thường không?", opts:["Có, dùng để scale đọc tốt", "Không, chỉ dùng cho mục đích failover", "Luôn dùng để đọc chính", "Không tồn tại standby"], correct:1, explain:"Standby của Multi-AZ chỉ phục vụ failover, không phải để scale đọc như Read Replica."},
{q:"Nếu ứng dụng có tỷ lệ đọc rất cao, giải pháp nào phù hợp?", opts:["Chỉ dùng Multi-AZ", "Thêm Read Replica để phân tải đọc", "Xóa database", "Không cần thay đổi gì"], correct:1, explain:"Read Replica được thiết kế chính xác cho tình huống tải đọc cao."},
{q:"Multi-AZ ảnh hưởng thế nào đến chi phí?", opts:["Không ảnh hưởng gì", "Tăng chi phí vì có thêm 1 bản sao standby", "Luôn giảm chi phí", "Chỉ ảnh hưởng đến tốc độ"], correct:1, explain:"Multi-AZ yêu cầu duy trì thêm 1 instance standby, làm tăng chi phí."},
{q:"Thời gian gián đoạn khi Multi-AZ failover thường là bao lâu?", opts:["Vài giờ", "Dưới 1-2 phút", "Vài giây tuyệt đối", "Không có gián đoạn"], correct:1, explain:"Failover Multi-AZ thường hoàn tất trong khoảng 1-2 phút."},
{q:"Kết hợp cả Multi-AZ và Read Replica có hợp lý không?", opts:["Không thể kết hợp", "Có, Multi-AZ cho HA và Read Replica để scale đọc, bổ trợ nhau", "Chỉ chọn 1 trong 2", "Kết hợp làm chậm hệ thống"], correct:1, explain:"Đây là kiến trúc phổ biến cho hệ thống production cần cả độ sẵn sàng và khả năng scale đọc."},
{q:"Read Replica đồng bộ dữ liệu theo cơ chế nào?", opts:["Đồng bộ tức thời tuyệt đối", "Bất đồng bộ, có độ trễ nhỏ so với instance chính", "Không đồng bộ bao giờ", "Chỉ đồng bộ 1 lần duy nhất"], correct:1, explain:"Vì bất đồng bộ, Read Replica có thể có độ trễ nhỏ (replication lag) so với dữ liệu gốc."},
]},
{label:'Thứ 4', title:'Backup, Snapshot & Restore', content:'RDS Automated Backup chạy tự động hàng ngày trong \"backup window\" bạn cấu hình, lưu trữ theo retention period (1-35 ngày) — cho phép Point-in-Time Recovery (khôi phục về BẤT KỲ thời điểm nào trong khoảng đó). Manual Snapshot do người dùng chủ động tạo, KHÔNG bị xóa tự động khi retention hết hạn hoặc khi xóa RDS instance — phù hợp lưu trữ lâu dài. Khi Restore từ backup/snapshot, AWS tạo ra 1 RDS INSTANCE MỚI (không ghi đè instance cũ) — cần cập nhật lại endpoint kết nối trong ứng dụng sau khi restore.', exercises:["Kiểm tra cấu hình Automated Backup hiện tại của RDS instance (backup window, retention period).","Tạo 1 Manual Snapshot, đặt tên rõ ràng để dễ nhận biết mục đích.","Thử Restore RDS instance về 1 thời điểm cụ thể trong quá khứ (Point-in-Time Recovery), quan sát instance mới được tạo ra.","Xóa RDS instance test (KHÔNG xóa Manual Snapshot), xác nhận Snapshot vẫn còn sau khi xóa instance.","Viết quy trình backup/restore bạn sẽ áp dụng cho 1 dự án thật, xác định retention period phù hợp."], quiz:[
{q:"Automated Backup cho phép khôi phục theo cách nào?", opts:["Chỉ khôi phục về đúng lúc backup chạy", "Point-in-Time Recovery — về bất kỳ thời điểm nào trong retention period", "Không thể khôi phục", "Chỉ khôi phục 1 lần duy nhất"], correct:1, explain:"Point-in-Time Recovery là tính năng nổi bật của Automated Backup."},
{q:"Manual Snapshot có bị xóa khi retention period hết hạn không?", opts:["Có", "Không, tồn tại đến khi người dùng chủ động xóa", "Tự động xóa sau 7 ngày", "Không thể tạo Manual Snapshot"], correct:1, explain:"Khác Automated Backup, Manual Snapshot không tự động xóa theo retention."},
{q:"Khi Restore RDS từ Snapshot, điều gì xảy ra?", opts:["Ghi đè instance cũ", "Tạo ra 1 RDS instance MỚI", "Xóa toàn bộ dữ liệu", "Không thể restore"], correct:1, explain:"Restore luôn tạo ra instance mới với endpoint mới, không ghi đè instance gốc."},
{q:"Retention period của Automated Backup có thể đặt tối đa bao nhiêu ngày?", opts:["7 ngày", "35 ngày", "100 ngày", "Không giới hạn"], correct:1, explain:"Retention period của RDS Automated Backup tối đa là 35 ngày."},
{q:"Backup Window là gì?", opts:["Khung giờ cấu hình để backup tự động chạy", "Cửa sổ ứng dụng", "Thời gian bảo trì OS", "Không tồn tại khái niệm này"], correct:0, explain:"Backup Window là khoảng thời gian bạn chỉ định để RDS thực hiện backup hàng ngày."},
{q:"Nếu xóa RDS instance, Manual Snapshot có bị xóa theo không?", opts:["Có, luôn bị xóa theo", "Không, Manual Snapshot vẫn giữ lại độc lập", "Tùy cấu hình mặc định", "Không thể xóa instance có snapshot"], correct:1, explain:"Manual Snapshot tồn tại độc lập với vòng đời của RDS instance gốc."},
{q:"Vì sao cần cập nhật lại endpoint sau khi Restore RDS?", opts:["Không cần cập nhật gì", "Vì instance mới có endpoint khác với instance gốc", "Endpoint tự động cập nhật trong ứng dụng", "Vì dữ liệu bị mất"], correct:1, explain:"Do restore tạo instance mới, endpoint kết nối cũng thay đổi theo."},
{q:"Automated Backup có ảnh hưởng đến hiệu năng RDS lúc đang chạy không?", opts:["Không ảnh hưởng gì tuyệt đối", "Có thể ảnh hưởng nhẹ trong lúc backup chạy, nên chọn Backup Window vào giờ thấp điểm", "Luôn làm sập database", "Không thể backup khi đang chạy"], correct:1, explain:"Nên chọn Backup Window vào giờ ít traffic để giảm ảnh hưởng."},
{q:"Snapshot được lưu trữ dựa trên công nghệ nào?", opts:["Lưu trên chính EBS volume gốc", "Lưu độc lập, dùng công nghệ tương tự S3", "Lưu trên máy local", "Không lưu trữ thật, chỉ là metadata"], correct:1, explain:"Snapshot là bản sao lưu độc lập, không phụ thuộc vào volume gốc."},
{q:"Nên tạo Manual Snapshot trong tình huống nào?", opts:["Không bao giờ cần thiết", "Trước khi thực hiện thay đổi lớn hoặc cần lưu trữ lâu dài ngoài retention period", "Chỉ khi Automated Backup lỗi", "Chỉ dùng cho môi trường test"], correct:1, explain:"Manual Snapshot phù hợp cho các mốc quan trọng cần giữ lâu dài, độc lập với retention tự động."},
]},
{label:'Thứ 5', title:'Bảo mật RDS & Parameter Groups', content:'RDS instance nên đặt trong Private Subnet, chỉ cho phép kết nối từ EC2/ứng dụng qua Security Group — không nên public RDS trực tiếp ra internet trừ trường hợp đặc biệt. Encryption at rest có thể bật khi tạo RDS instance (dùng KMS), LƯU Ý: không thể bật mã hóa sau khi đã tạo instance không mã hóa — cần snapshot rồi restore sang instance mã hóa nếu cần bổ sung sau. Parameter Group chứa các cấu hình engine database (ví dụ max_connections, character set) — có thể tùy chỉnh thay vì dùng mặc định.', exercises:["Kiểm tra RDS instance của bạn đang đặt ở Public hay Private Subnet, giải thích vì sao nên chọn Private.","Xem Security Group của RDS instance, xác nhận chỉ cho phép kết nối từ đúng nguồn cần thiết (không mở 0.0.0.0/0).","Tìm hiểu cách bật Encryption at rest khi tạo RDS instance mới, thử tạo 1 instance có mã hóa.","Xem 1 Parameter Group mặc định, tìm và ghi chú ý nghĩa của tham số max_connections.","Viết checklist bảo mật RDS gồm ít nhất 4 việc cần kiểm tra cho 1 RDS instance production."], quiz:[
{q:"RDS instance nên đặt ở loại Subnet nào trong hầu hết trường hợp?", opts:["Public Subnet", "Private Subnet", "Không cần Subnet", "Ngoài VPC"], correct:1, explain:"Đặt RDS ở Private Subnet giúp giảm bề mặt tấn công."},
{q:"Có thể bật Encryption at rest sau khi RDS instance đã tồn tại (chưa mã hóa từ đầu) không?", opts:["Có, bật trực tiếp bất cứ lúc nào", "Không trực tiếp — cần snapshot rồi restore sang instance mã hóa", "Không bao giờ mã hóa được", "Tự động mã hóa mặc định"], correct:1, explain:"Đây là hạn chế quan trọng cần nhớ: phải restore sang instance mới để bổ sung mã hóa."},
{q:"Parameter Group dùng để làm gì?", opts:["Quản lý IAM User", "Chứa cấu hình engine database (như max_connections)", "Tạo VPC", "Định tuyến DNS"], correct:1, explain:"Parameter Group là nơi tùy chỉnh các tham số cấu hình của engine database."},
{q:"Encryption at rest trong RDS dùng dịch vụ nào để quản lý khóa?", opts:["IAM", "KMS", "CloudTrail", "Route 53"], correct:1, explain:"KMS (Key Management Service) quản lý khóa mã hóa cho RDS."},
{q:"Vì sao không nên mở Security Group của RDS cho 0.0.0.0/0?", opts:["Không có lý do gì", "Cho phép mọi IP trên internet kết nối, rủi ro bảo mật rất cao", "Sẽ làm RDS chạy chậm", "Bắt buộc phải mở vậy để hoạt động"], correct:1, explain:"Đây là lỗi cấu hình bảo mật nghiêm trọng, chỉ nên cho phép đúng nguồn cần thiết."},
{q:"Option Group trong RDS dùng để làm gì?", opts:["Không có tác dụng gì", "Bổ sung tính năng đặc biệt cho 1 số engine (ví dụ Oracle APEX)", "Thay thế Parameter Group hoàn toàn", "Chỉ dùng cho Aurora"], correct:1, explain:"Option Group bổ sung tính năng mở rộng riêng của từng engine cụ thể."},
{q:"max_connections trong Parameter Group kiểm soát điều gì?", opts:["Số lượng IAM User", "Số kết nối đồng thời tối đa đến database", "Dung lượng lưu trữ", "Băng thông mạng"], correct:1, explain:"max_connections giới hạn số kết nối đồng thời database có thể xử lý."},
