      <div class="week-nav">
        <button class="nav-btn" id="btn-prev" ${currentWeek === 0 ? 'disabled' : ''}>← Tuần trước</button>
        <button class="nav-btn" id="btn-next" ${currentWeek === t.weeks.length-1 ? 'disabled' : ''}>Tuần tiếp →</button>
      </div>
    `;
    document.getElementById('check-btn').addEventListener('click', () => {
      setDone(currentTrack, currentWeek, !isDone(currentTrack, currentWeek));
      renderAll();
    });
  } else {
    const problem = problems[w.problemId];
    main.innerHTML = `
      <div class="week-title">Tuần ${currentWeek+1} — Tháng ${month}: ${problem.name}</div>
      <div class="week-subtitle">Thuật toán · độ khó: ${problem.difficulty}</div>
      ${dayPlanHTML(true)}
      <div class="section">
        <div class="section-head">
          <div style="display:flex;align-items:center;gap:10px"><span class="track-tag">THUẬT TOÁN</span></div>
          <span style="font-family:var(--mono);font-size:11px;color:var(--text-dim)">${problem.difficulty}</span>
        </div>
        <div class="section-body">
          <p class="algo-desc">${problem.desc}</p>
          <div class="algo-example">${problem.example}</div>
          <div class="info-box practice"><b>Gợi ý cách tiếp cận</b>${problem.approach}</div>
          <div class="editor-wrap">
            <div class="editor-topbar">
              <span class="fname">${problem.signature}</span>
              <div class="btn-row">
                <button class="action btn-reset" id="btn-reset">Đặt lại</button>
                <button class="action btn-run" id="btn-run">▶ Chạy test</button>
              </div>
            </div>
            <textarea class="editor" id="editor" spellcheck="false">${(savedCode[w.problemId] || problem.starter).replace(/</g,'&lt;')}</textarea>
          </div>
          <div class="console">
            <div class="console-topbar">console</div>
            <div class="console-body" id="console-body"><div class="console-empty">nhấn "Chạy test" để kiểm tra bài giải</div></div>
          </div>
          <div class="info-box case"><b>Ứng dụng thực tế</b>${problem.caseReal}</div>
        </div>
      </div>
      <div class="week-nav">
        <button class="nav-btn" id="btn-prev" ${currentWeek === 0 ? 'disabled' : ''}>← Tuần trước</button>
        <button class="nav-btn" id="btn-next" ${currentWeek === t.weeks.length-1 ? 'disabled' : ''}>Tuần tiếp →</button>
      </div>
    `;
    document.getElementById('btn-reset').addEventListener('click', () => {
      document.getElementById('editor').value = problem.starter;
      delete savedCode[w.problemId];
      saveCode();
      document.getElementById('console-body').innerHTML = '<div class="console-empty">nhấn "Chạy test" để kiểm tra bài giải</div>';
    });
    document.getElementById('editor').addEventListener('input', (e) => {
      savedCode[w.problemId] = e.target.value;
      saveCode();
    });
    document.getElementById('btn-run').addEventListener('click', () => runTests(w.problemId, problem));
  }

  document.getElementById('btn-prev').addEventListener('click', () => { if(currentWeek>0){ currentWeek--; renderAll(); window.scrollTo(0,0);} });
  document.getElementById('btn-next').addEventListener('click', () => { if(currentWeek<t.weeks.length-1){ currentWeek++; renderAll(); window.scrollTo(0,0);} });
}

function runTests(problemId, problem){
  const code = document.getElementById('editor').value;
  const body = document.getElementById('console-body');
  let userFn;
  try {
    const scope = new Function(code + '\nreturn solve;');
    userFn = scope();
    if (typeof userFn !== 'function') throw new Error('Không tìm thấy hàm solve() hợp lệ.');
  } catch(e){
    body.innerHTML = `<div class="error-line">✗ Lỗi cú pháp: ${e.message}</div>`;
    return;
  }

  let lines = '';
  let passCount = 0;
  problem.tests.forEach((t, i) => {
    try {
      const actual = userFn(...t.args);
      const pass = t.normalize === 'anagram' ? anagramEqual(actual, t.expected) : deepEqual(actual, t.expected);
      if (pass) passCount++;
      const detail = pass ? '' : `mong đợi ${JSON.stringify(t.expected)}, nhận được ${JSON.stringify(actual)}`;
      lines += `<div class="test-line ${pass ? 'pass' : 'fail'}"><span class="mark">${pass ? '✓' : '✗'}</span><span><span class="txt">test ${i+1} — input: ${JSON.stringify(t.args)}</span>${detail ? `<span class="detail">${detail}</span>` : ''}</span></div>`;
    } catch(e){
      lines += `<div class="test-line fail"><span class="mark">✗</span><span><span class="txt">test ${i+1} — lỗi khi chạy</span><span class="detail">${e.message}</span></span></div>`;
    }
  });

  const allPass = passCount === problem.tests.length;
  lines += `<div class="summary-line ${allPass ? 'pass' : 'fail'}">${passCount}/${problem.tests.length} test passed${allPass ? ' — hoàn thành bài này!' : ''}</div>`;
  body.innerHTML = lines;

  if (allPass) {
    setDone(currentTrack, currentWeek, true);
    renderAll();
  }
}

/* ============ INIT ============ */
function renderAll(){
  renderMenu();
  renderSidebar();
  renderMain();
}
renderAll();
</script>
</body>
</html>
