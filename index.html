<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lộ Trình Học Tập · FE / Java Backend / Thuật Toán / TOEIC</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg-primary:#F6F7FA;
    --bg-panel:#FFFFFF;
    --bg-elevated:#EEF0F5;
    --border:#E1E4EA;
    --text-primary:#1B2130;
    --text-muted:#5B6472;
    --text-dim:#9AA3B2;
    --fe:#0E8F82;
    --fe-dim:rgba(14,143,130,0.09);
    --be:#C2760B;
    --be-dim:rgba(194,118,11,0.10);
    --algo:#7C3AED;
    --algo-dim:rgba(124,58,237,0.09);
    --toeic:#2563EB;
    --toeic-dim:rgba(37,99,235,0.09);
    --coral:#DC2626;
    --coral-dim:rgba(220,38,38,0.09);
    --amber2:#B45309;
    --amber2-dim:rgba(180,83,9,0.08);
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:var(--bg-primary); color:var(--text-primary); font-family:var(--sans); display:flex; flex-direction:column; min-height:100vh;}
  ::selection{background:var(--algo-dim); color:var(--algo);}

  header{padding:14px 28px 0; border-bottom:1px solid var(--border); background:var(--bg-panel); position:sticky; top:0; z-index:10;}
  .brand{display:flex; align-items:baseline; gap:12px; margin-bottom:14px;}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--algo); display:inline-block;}
  .brand h1{font-family:var(--mono); font-size:15.5px; font-weight:700; letter-spacing:-0.02em;}
  .brand .path{font-family:var(--mono); font-size:11.5px; color:var(--text-dim);}

  nav.menu{display:flex; gap:4px; overflow-x:auto;}
  .menu-btn{display:flex; flex-direction:column; align-items:flex-start; gap:3px; padding:10px 18px; border:none; background:transparent; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; font-family:var(--sans); transition:.15s;}
  .menu-btn .label{font-size:13.5px; font-weight:600; color:var(--text-muted);}
  .menu-btn .sub{font-family:var(--mono); font-size:10.5px; color:var(--text-dim);}
  .menu-btn:hover .label{color:var(--text-primary);}
  .menu-btn.active{border-bottom-color:var(--track-color, var(--algo));}
  .menu-btn.active .label{color:var(--track-color, var(--algo));}
  .menu-btn.active .sub{color:var(--track-color, var(--algo));}

  .app{flex:1; display:grid; grid-template-columns:250px 1fr; min-height:0;}
  @media (max-width:860px){ .app{grid-template-columns:1fr;} .sidebar{border-right:none; border-bottom:1px solid var(--border); max-height:220px;} }
  @media (min-width:1300px){ .app{grid-template-columns:250px 1fr 320px;} #notesPanel.notes-panel{display:flex;} }

  .sidebar{border-right:1px solid var(--border); overflow-y:auto; padding:14px 0; background:var(--bg-panel);}
  .month-label{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--text-dim); padding:12px 20px 6px; text-transform:uppercase;}
  .month-label:first-child{padding-top:4px;}
  .week-item{display:flex; align-items:center; gap:10px; padding:8px 20px; cursor:pointer; border-left:2px solid transparent; transition:background .15s, border-color .15s;}
  .week-item:hover{background:var(--bg-elevated);}
  .week-item.active{background:var(--bg-elevated); border-left-color:var(--track-color, var(--algo));}
  .week-item .num{font-family:var(--mono); font-size:12px; color:var(--text-dim); width:20px; flex-shrink:0;}
  .week-item .title{font-size:12.5px; color:var(--text-muted); flex:1; line-height:1.3;}
  .week-item.active .title{color:var(--text-primary);}
  .week-item .tick{font-size:12px; color:var(--track-color, var(--algo)); flex-shrink:0; width:14px; text-align:center;}

  main{padding:26px 32px 60px; overflow-y:auto;}

  .notes-panel{display:none; flex-direction:column; border-left:1px solid var(--border); background:var(--bg-panel); overflow-y:auto;}
  .notes-header{padding:16px 18px 12px; border-bottom:1px solid var(--border);}
  .notes-header .title{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:10px; font-weight:700;}
  .notes-tabs{display:flex; flex-wrap:wrap; gap:5px;}
  .notes-tab{font-family:var(--mono); font-size:11.5px; font-weight:600; padding:6px 10px; border-radius:6px; border:1px solid var(--border); background:var(--bg-panel); color:var(--text-muted); cursor:pointer; transition:.15s;}
  .notes-tab:hover{border-color:var(--text-dim); color:var(--text-primary);}
  .notes-tab.active{background:var(--track-color, var(--algo)); border-color:var(--track-color, var(--algo)); color:#fff;}
  .notes-body{flex:1; padding:16px 18px; display:flex; flex-direction:column; min-height:0;}
  .notes-body textarea{flex:1; width:100%; min-height:420px; box-sizing:border-box; resize:vertical; border:1px solid var(--border); border-radius:8px; background:#FAFBFC; color:var(--text-primary); font-family:var(--sans); font-size:13.5px; line-height:1.6; padding:12px 14px; outline:none;}
  .notes-body textarea:focus{border-color:var(--track-color, var(--algo));}
  .notes-hint{font-size:11px; color:var(--text-dim); margin-top:8px; line-height:1.5;}
  .notes-saved{font-family:var(--mono); font-size:10.5px; color:var(--fe); margin-top:6px; opacity:0; transition:opacity .3s;}
  .notes-saved.show{opacity:1;}
  .week-title{font-family:var(--mono); font-size:21px; font-weight:700; letter-spacing:-0.01em; margin-bottom:4px;}
  .week-subtitle{color:var(--text-dim); font-size:12.5px; margin-bottom:18px;}

  .day-plan{border:1px solid var(--border); border-radius:10px; background:var(--bg-elevated); padding:14px 18px; margin-bottom:22px;}
  .day-plan b{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:10px; font-weight:700;}
  .day-plan .row{display:flex; gap:12px; padding:4px 0; font-size:13px; line-height:1.5;}
  .day-plan .row .d{font-family:var(--mono); font-weight:700; color:var(--text-primary); width:52px; flex-shrink:0;}
  .day-plan .row .t{color:var(--text-muted);}

  .day-tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .day-tab{font-family:var(--mono); font-size:12px; font-weight:600; padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg-panel); color:var(--text-muted); cursor:pointer; transition:.15s;}
  .day-tab:hover{border-color:var(--text-dim); color:var(--text-primary);}
  .day-tab.active{background:var(--track-color, var(--algo)); border-color:var(--track-color, var(--algo)); color:#fff;}
  .day-detail{border:1px solid var(--border); border-radius:12px; background:var(--bg-panel); padding:20px 22px; margin-bottom:20px;}
  .day-detail h4{font-size:15.5px; font-weight:700; margin-bottom:10px;}
  .day-detail .content{font-size:14px; line-height:1.7; color:var(--text-muted); margin-bottom:14px;}
  .day-detail .code-example{font-family:var(--mono); font-size:12px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; padding:12px 14px; color:var(--text-primary); white-space:pre-wrap; margin-bottom:14px; overflow-x:auto;}
  .day-detail .exercise-box{background:var(--toeic-dim); border:1px solid rgba(37,99,235,0.25); border-radius:8px; padding:12px 14px; font-size:13.5px; line-height:1.6; color:var(--text-primary);}
  .day-detail .exercise-box b{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--toeic); margin-bottom:8px; font-weight:700;}
  .exercise-list{padding-left:20px;}
  .exercise-list li{margin-bottom:8px; line-height:1.6;}
  .exercise-list li:last-child{margin-bottom:0;}

  .vocab-table{margin-top:16px; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .vocab-row{display:grid; grid-template-columns:1fr 1fr 1.4fr; gap:10px; padding:9px 12px; font-size:13px; line-height:1.5; border-bottom:1px solid var(--border);}
  .vocab-row:last-child{border-bottom:none;}
  .vocab-row.head{background:var(--bg-elevated); font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); font-weight:700;}
  .vocab-row .term{font-weight:600; color:var(--text-primary);}
  .vocab-row .meaning{color:var(--text-muted);}
  .vocab-row .example{color:var(--text-dim); font-style:italic;}

  .quiz-block{margin-top:18px;}
  .quiz-block > .quiz-title{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:10px; font-weight:700;}
  .quiz-item{border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:10px;}
  .quiz-q{font-size:14px; margin-bottom:10px; line-height:1.5;}
  .quiz-opts{display:flex; flex-direction:column; gap:6px;}
  .quiz-opt{text-align:left; font-size:13px; padding:8px 12px; border:1px solid var(--border); border-radius:6px; background:var(--bg-panel); cursor:pointer; transition:.15s; color:var(--text-primary);}
  .quiz-opt:hover:not(.answered .quiz-opt){border-color:var(--text-dim);}
  .quiz-opt.correct{background:var(--fe-dim); border-color:var(--fe); color:var(--fe); font-weight:600;}
  .quiz-opt.incorrect{background:var(--coral-dim); border-color:var(--coral); color:var(--coral); font-weight:600;}
  .quiz-explain{margin-top:8px; font-size:12.5px; color:var(--text-muted); line-height:1.5; padding-top:8px; border-top:1px dashed var(--border);}

  .section{border:1px solid var(--border); border-radius:12px; background:var(--bg-panel); overflow:hidden; margin-bottom:20px;}
  .section-head{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background:var(--bg-elevated); border-bottom:1px solid var(--border);}
  .track-tag{font-family:var(--mono); font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; letter-spacing:.04em; background:var(--track-dim, var(--algo-dim)); color:var(--track-color, var(--algo));}

  .check-btn{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11.5px; background:var(--bg-panel); border:1px solid var(--border); color:var(--text-muted); padding:7px 13px; border-radius:6px; cursor:pointer; transition:.15s;}
  .check-btn:hover{border-color:var(--text-dim); color:var(--text-primary);}
  .check-btn.checked{background:var(--track-dim, var(--algo-dim)); border-color:var(--track-color, var(--algo)); color:var(--track-color, var(--algo));}

  .section-body{padding:20px 22px;}
  .points{list-style:none; margin-bottom:4px;}
  .points li{position:relative; padding-left:20px; margin-bottom:11px; font-size:14px; line-height:1.65; color:var(--text-muted);}
  .points li::before{content:'—'; position:absolute; left:0; color:var(--text-dim);}

  .info-box{border-radius:8px; padding:14px 16px; font-size:13.5px; line-height:1.6; color:var(--text-primary); margin-top:14px;}
  .info-box b{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; font-weight:700;}
  .info-box.practice{background:var(--toeic-dim); border:1px solid rgba(37,99,235,0.25);}
  .info-box.practice b{color:var(--toeic);}
  .info-box.case{background:var(--amber2-dim); border:1px solid rgba(180,83,9,0.22);}
  .info-box.case b{color:var(--amber2);}
  .info-box.apply{background:var(--bg-elevated); border:1px solid var(--border);}
  .info-box.apply b{color:var(--text-dim);}

  .algo-desc{color:var(--text-muted); font-size:14px; line-height:1.6; margin-bottom:14px;}
  .algo-example{font-family:var(--mono); font-size:12px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; padding:11px 14px; color:var(--text-muted); margin-bottom:14px; white-space:pre-wrap;}
  .algo-example b{color:var(--algo); font-weight:600;}

  .editor-wrap{border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:14px; margin-top:14px;}
  .editor-topbar{display:flex; align-items:center; justify-content:space-between; padding:8px 14px; background:var(--bg-elevated); border-bottom:1px solid var(--border);}
  .editor-topbar .fname{font-family:var(--mono); font-size:11.5px; color:var(--text-muted);}
  .btn-row{display:flex; gap:8px;}
  button.action{font-family:var(--mono); font-size:12px; font-weight:600; border:none; border-radius:6px; padding:7px 14px; cursor:pointer; transition:transform .1s, opacity .15s;}
  button.action:active{transform:scale(0.97);}
  .btn-run{background:var(--algo); color:#fff;}
  .btn-run:hover{opacity:.88;}
  .btn-reset{background:var(--bg-panel); color:var(--text-muted); border:1px solid var(--border);}
  .btn-reset:hover{color:var(--text-primary); border-color:var(--text-dim);}

  textarea.editor{width:100%; min-height:180px; background:#FAFBFC; color:var(--text-primary); border:none; outline:none; resize:vertical; font-family:var(--mono); font-size:13px; line-height:1.6; padding:14px 16px; tab-size:2;}

  .console{border:1px solid var(--border); border-radius:10px; background:#FAFBFC; overflow:hidden;}
  .console-topbar{padding:8px 14px; background:var(--bg-elevated); border-bottom:1px solid var(--border); font-family:var(--mono); font-size:11.5px; color:var(--text-dim);}
  .console-body{padding:13px 16px; font-family:var(--mono); font-size:12.5px; line-height:1.8; min-height:50px;}
  .console-empty{color:var(--text-dim);}
  .test-line{display:flex; gap:9px; align-items:flex-start; margin-bottom:5px;}
  .test-line .mark{width:13px; flex-shrink:0;}
  .test-line.pass .mark{color:var(--fe);}
  .test-line.fail .mark{color:var(--coral);}
  .test-line .txt{color:var(--text-muted);}
  .test-line.fail .txt{color:var(--text-primary);}
  .test-line .detail{color:var(--text-dim); display:block; margin-top:2px; font-size:11.5px;}
  .summary-line{margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); font-weight:600;}
  .summary-line.pass{color:var(--fe);}
  .summary-line.fail{color:var(--coral);}
  .error-line{color:var(--coral); white-space:pre-wrap;}

  .week-nav{display:flex; justify-content:space-between; margin-top:20px; gap:10px;}
  .nav-btn{font-family:var(--mono); font-size:12.5px; font-weight:600; background:var(--bg-panel); border:1px solid var(--border); color:var(--text-primary); padding:10px 18px; border-radius:8px; cursor:pointer; flex:1; text-align:center; transition:.15s;}
  .nav-btn:hover{border-color:var(--text-dim);}
  .nav-btn:disabled{opacity:.35; cursor:default;}

  footer{text-align:center; padding:16px; font-family:var(--mono); font-size:11px; color:var(--text-dim); border-top:1px solid var(--border); background:var(--bg-panel);}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span><h1>lộ trình học tập</h1><span class="path">6 tháng FE/BE/Thuật toán · 4 tháng TOEIC</span></div>
  <nav class="menu" id="menu"></nav>
</header>

<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
  <aside class="notes-panel" id="notesPanel"></aside>
</div>

<footer>tự học mỗi ngày, đều đặn mỗi tuần · tiến độ lưu trên trình duyệt này · bản v10</footer>

<script>
/* ============ ALGORITHM PROBLEMS BANK ============ */
const problems = {
'two-sum':{name:'Two Sum', difficulty:'Dễ', signature:'function solve(nums, target)', desc:'Cho mảng số nguyên nums và số target, trả về chỉ số của hai phần tử có tổng bằng target.', example:'<b>Input:</b> nums=[2,7,11,15], target=9\n<b>Output:</b> [0,1]', starter:'function solve(nums, target) {\n  // viết code tại đây\n}', approach:'Dùng HashMap lưu giá trị đã duyệt qua cùng chỉ số, kiểm tra xem target - số hiện tại đã tồn tại trong map chưa — độ phức tạp O(n) thay vì O(n²) nếu duyệt 2 vòng lặp lồng nhau.', caseReal:'Dạng bài tìm cặp giá trị thỏa điều kiện xuất hiện nhiều trong xử lý dữ liệu thực tế, ví dụ tìm 2 giao dịch có tổng bằng 1 số tiền nghi vấn trong hệ thống chống gian lận.', days:[
{label:'Thứ 2', title:'Phân tích đề & cách brute-force', content:'Trước khi tối ưu, luôn thử cách đơn giản nhất trước: dùng 2 vòng lặp lồng nhau kiểm tra mọi cặp (i,j), nếu nums[i]+nums[j]===target thì trả về [i,j]. Cách này đúng nhưng độ phức tạp O(n²) — với mảng lớn sẽ rất chậm.', example:'for (let i = 0; i < nums.length; i++) {\n  for (let j = i+1; j < nums.length; j++) {\n    if (nums[i] + nums[j] === target) return [i, j];\n  }\n}', exercises:["Tự code cách brute-force O(n²) trước, chạy thử với ví dụ nhỏ để chắc chắn logic đúng.","Thử với input có 5-10 phần tử, tự tay lần theo từng vòng lặp trên giấy để chắc chắn hiểu đúng brute-force.","Tính thử số phép so sánh brute-force cần làm với mảng 10 phần tử (ước lượng bằng công thức n(n-1)/2)."]},
{label:'Thứ 3', title:'Tối ưu bằng HashMap', content:'Duyệt mảng 1 lần, tại mỗi phần tử kiểm tra xem "target - phần tử hiện tại" đã xuất hiện trong map chưa (map lưu giá trị → chỉ số). Nếu có, trả về ngay — không cần vòng lặp thứ 2. Độ phức tạp giảm còn O(n) vì tra cứu HashMap gần như tức thời.', example:'const map = {};\nfor (let i = 0; i < nums.length; i++) {\n  const need = target - nums[i];\n  if (need in map) return [map[need], i];\n  map[nums[i]] = i;\n}', exercises:["Viết lại giải pháp bằng HashMap, so sánh độ dài code và độ phức tạp với cách brute-force ở Thứ 2.","Thử với input KHÔNG có đáp án (không có cặp nào cộng bằng target), xử lý trường hợp này trả về gì hợp lý.","Vẽ lại trên giấy trạng thái của map sau mỗi bước lặp với ví dụ nums=[2,7,11,15], target=9."]},
{label:'Thứ 4', title:'Code trong editor & chạy test', content:'Áp dụng giải pháp HashMap vào ô code chính thức của bài, chạy test để xác nhận đúng với mọi trường hợp (bao gồm trường hợp 2 phần tử giống nhau như [3,3]).', exercises:["Hoàn thành function solve() trong editor của bài Two Sum, chạy \"Chạy test\" đến khi pass hết.","Test thêm với mảng có số âm, xác nhận giải pháp vẫn hoạt động đúng.","Thử cố tình viết sai (ví dụ gán map trước khi kiểm tra need in map) để thấy lỗi logic xảy ra như thế nào."]},
{label:'Thứ 5', title:'Biến thể: mảng đã sắp xếp (Two Pointers)', content:'Nếu đề bài cho mảng ĐÃ SẮP XẾP, có thể giải bằng 2 con trỏ (left, right) thay vì HashMap: tổng 2 đầu quá lớn thì giảm right, quá nhỏ thì tăng left — tiết kiệm bộ nhớ hơn (O(1) thay vì O(n) cho map).', example:'let left = 0, right = nums.length - 1;\nwhile (left < right) {\n  const sum = nums[left] + nums[right];\n  if (sum === target) return [left, right];\n  sum < target ? left++ : right--;\n}', exercises:["Giả sử input luôn là mảng đã sắp xếp, viết thêm 1 phiên bản giải bằng two-pointer, so sánh với bản HashMap.","Test phiên bản two-pointer với input có nhiều cặp thỏa mãn, xác nhận nó trả về đúng 1 cặp hợp lệ.","So sánh độ phức tạp không gian (space complexity) giữa 2 cách: HashMap O(n) vs two-pointer O(1)."]},
{label:'Thứ 6', title:'Tự giải lại & review', content:'Cách tốt nhất để kiểm tra đã thực sự hiểu bài hay chỉ nhớ code là thử giải lại từ đầu mà KHÔNG xem lại lời giải cũ. Nếu vẫn giải được trong thời gian hợp lý, nghĩa là kiến thức đã thực sự nội hóa.', exercises:["Đóng hết code cũ lại, tự giải lại bài Two Sum từ đầu, đo thời gian bạn mất bao lâu để hoàn thành.","Sau khi tự giải lại, so sánh code mới viết với code cũ — có điểm nào bạn viết gọn/rõ hơn không?","Thử giải thích lời giải Two Sum cho 1 người khác (hoặc viết ra như đang giải thích) để kiểm tra hiểu sâu tới đâu."]},
], tests:[{args:[[2,7,11,15],9], expected:[0,1]},{args:[[3,2,4],6], expected:[1,2]},{args:[[3,3],6], expected:[0,1]}]},
'fizzbuzz':{name:'FizzBuzz', difficulty:'Dễ', signature:'function solve(n)', desc:'Trả về mảng từ 1 đến n, số chia hết cho 3 thành "Fizz", cho 5 thành "Buzz", cho cả hai thành "FizzBuzz".', example:'<b>Input:</b> 5\n<b>Output:</b> ["1","2","Fizz","4","Buzz"]', starter:'function solve(n) {\n  // viết code tại đây\n}', approach:'Duyệt từ 1 đến n, dùng toán tử modulo (%) kiểm tra chia hết cho 3 và 5, chú ý kiểm tra điều kiện chia hết cho cả hai trước.', caseReal:'FizzBuzz nổi tiếng vì được dùng làm câu hỏi sàng lọc nhanh trong phỏng vấn — không phải vì độ khó mà để kiểm tra khả năng suy luận logic cơ bản.', days:[
{label:'Thứ 2', title:'Phân tích đề & modulo operator', content:'Phép modulo (%) trả về số dư của phép chia — n % 3 === 0 nghĩa là n chia hết cho 3. Điểm dễ sai nhất: phải kiểm tra điều kiện chia hết cho CẢ 3 VÀ 5 trước, nếu không sẽ chỉ in ra "Fizz" mà quên trường hợp "FizzBuzz".', exercises:["Viết ra giấy (không code) thứ tự các điều kiện if cần kiểm tra và giải thích tại sao thứ tự đó quan trọng.","Tự tay tính n%3 và n%5 cho vài số từ 1-20 trên giấy để chắc chắn hiểu rõ modulo trước khi code.","Liệt kê trước 5 số đầu tiên sẽ in ra gì (1,2,Fizz,4,Buzz) để có đáp án đối chiếu khi code."]},
{label:'Thứ 3', title:'Code trong editor & chạy test', content:'Áp dụng logic đã phân tích vào editor, đặc biệt chú ý convert số thành chuỗi khi không chia hết cho 3 hay 5 (kết quả mong đợi là mảng string, không phải number).', exercises:["Hoàn thành function solve(n) trong editor, chạy test đến khi pass hết.","Test với n=1 (trường hợp nhỏ nhất) và n=100 (trường hợp lớn hơn) để chắc chắn không có lỗi biên.","Thử in ra console.log từng bước để debug trực quan nếu kết quả sai."]},
{label:'Thứ 4', title:'Biến thể: thêm điều kiện thứ 3', content:'Thử mở rộng bài toán: thêm điều kiện chia hết cho 7 thì in "Bang" (và các tổ hợp: cả 3&7 thành "FizzBang", cả 5&7 thành "BuzzBang", cả 3&5&7 thành "FizzBuzzBang"). Đây là cách luyện tư duy tổng quát hóa 1 bài toán quen thuộc.', exercises:["Viết lại FizzBuzz có thêm điều kiện chia hết cho 7 → \"Bang\", xử lý đúng các tổ hợp.","Test kỹ tổ hợp chia hết cả 3 số (3,5,7) — ví dụ n=105 phải ra đúng \"FizzBuzzBang\".","Thử thêm điều kiện thứ 4 (chia hết cho 11) theo đúng pattern đã học, tự đặt tên riêng cho nó."]},
{label:'Thứ 5', title:'Refactor cho dễ đọc hơn', content:'Với nhiều điều kiện, code if-else lồng nhau dễ khó đọc. Cách refactor phổ biến: nối string theo từng điều kiện độc lập (chia hết 3 thì cộng "Fizz", chia hết 5 thì cộng "Buzz"), cuối cùng nếu chuỗi rỗng thì dùng số gốc.', example:'let result = "";\nif (n % 3 === 0) result += "Fizz";\nif (n % 5 === 0) result += "Buzz";\nreturn result || String(n);', exercises:["Refactor lại giải pháp theo cách nối chuỗi này, so sánh độ dễ đọc với cách if-else lồng nhau ban đầu.","Áp dụng cách refactor nối chuỗi cho cả phiên bản mở rộng (3 điều kiện) ở Thứ 4.","Đo thử xem code sau refactor có ngắn hơn bao nhiêu dòng so với bản if-else lồng nhau."]},
{label:'Thứ 6', title:'Tự giải lại & review', content:'FizzBuzz tuy đơn giản nhưng là bài kiểm tra tốt về khả năng viết code sạch, dễ mở rộng — kỹ năng này quan trọng hơn nhiều so với việc chỉ giải đúng bài toán.', exercises:["Tự giải lại FizzBuzz (bản gốc và bản mở rộng chia hết cho 7) từ đầu không xem code cũ.","Thử giải FizzBuzz theo 1 cách hoàn toàn khác (ví dụ dùng mảng điều kiện thay vì if/nối chuỗi) để luyện tư duy đa dạng.","Ghi chú lại: nếu được hỏi FizzBuzz trong phỏng vấn, bạn sẽ giải thích cách tiếp cận trong bao nhiêu câu."]},
], tests:[{args:[5], expected:["1","2","Fizz","4","Buzz"]},{args:[15], expected:["1","2","Fizz","4","Buzz","Fizz","7","8","Fizz","Buzz","11","Fizz","13","14","FizzBuzz"]}]},
'reverse-string':{name:'Đảo ngược chuỗi', difficulty:'Dễ', signature:'function solve(str)', desc:'Đảo ngược một chuỗi ký tự, không dùng .reverse() có sẵn của Array.', example:'<b>Input:</b> "hello"\n<b>Output:</b> "olleh"', starter:'function solve(str) {\n  // viết code tại đây\n}', approach:'Dùng 2 con trỏ (two pointers) từ đầu và cuối chuỗi, hoán đổi ký tự và di chuyển vào giữa — độ phức tạp O(n).', caseReal:'Two-pointer là kỹ thuật nền tảng dùng lại trong rất nhiều bài toán mảng/chuỗi khác, không chỉ riêng đảo ngược.', days:[
{label:'Thứ 2', title:'Two-pointer technique', content:'Ý tưởng cốt lõi: dùng 2 con trỏ, 1 từ đầu chuỗi (left=0), 1 từ cuối chuỗi (right=length-1), hoán đổi ký tự tại 2 vị trí rồi di chuyển left++ và right-- cho đến khi 2 con trỏ gặp nhau ở giữa. Kỹ thuật nền tảng dùng lại trong rất nhiều bài toán mảng/chuỗi khác.', exercises:["Vẽ ra giấy quá trình đảo ngược chuỗi \"hello\" bằng two-pointer, đánh dấu vị trí left/right sau mỗi bước.","Thử với chuỗi có số ký tự lẻ (ví dụ \"abcde\") và chẵn (ví dụ \"abcd\"), xác nhận cách xử lý điểm giữa đúng cho cả 2.","Vẽ lại trên giấy vị trí left/right sau mỗi bước với chuỗi \"code\"."]},
{label:'Thứ 3', title:'Code trong editor & chạy test', content:'Vì string trong JavaScript là immutable (không sửa trực tiếp từng ký tự được), cách phổ biến là chuyển string thành array ký tự trước, hoán đổi trong array, rồi join lại thành string.', example:'const arr = str.split("");\n// hoán đổi trong arr bằng two-pointer\nreturn arr.join("");', exercises:["Hoàn thành function solve(str) trong editor bằng kỹ thuật two-pointer, chạy test đến khi pass hết.","Test với chuỗi có khoảng trắng và ký tự đặc biệt, xác nhận vẫn đảo đúng thứ tự.","Thử viết thêm 1 cách khác không dùng split/join, thao tác trực tiếp trên string bằng vòng lặp cộng chuỗi."]},
{label:'Thứ 4', title:'Biến thể: đảo ngược từng từ trong câu', content:'Bài toán mở rộng: đảo ngược THỨ TỰ CHỮ trong mỗi từ nhưng vẫn giữ nguyên thứ tự các từ trong câu (ví dụ "hello world" → "olleh dlrow"). Cách làm: tách câu thành mảng từ, áp dụng đảo ngược two-pointer cho từng từ, rồi join lại.', exercises:["Viết hàm đảo ngược từng từ trong 1 câu (giữ nguyên thứ tự từ), test với câu \"hello world\" phải ra \"olleh dlrow\".","Test với câu có nhiều khoảng trắng liên tiếp, xử lý xem kết quả có hợp lý không.","Thử kết hợp: vừa đảo từng từ vừa đảo cả thứ tự câu, so sánh với yêu cầu ban đầu để không nhầm 2 bài toán."]},
{label:'Thứ 5', title:'So sánh cách lặp thủ công vs đệ quy', content:'Ngoài two-pointer, có thể đảo ngược chuỗi bằng đệ quy: solve(str) = solve(phần còn lại) + ký tự đầu. Cách đệ quy dễ hiểu về khái niệm nhưng tốn nhiều bộ nhớ hơn (mỗi lời gọi tạo 1 stack frame) — với chuỗi rất dài có thể gây stack overflow.', example:'function reverseRecursive(str) {\n  if (str === "") return "";\n  return reverseRecursive(str.slice(1)) + str[0];\n}', exercises:["Viết thêm 1 phiên bản đảo ngược chuỗi bằng đệ quy, so sánh ưu nhược điểm với two-pointer.","Test bản đệ quy với chuỗi dài hơn nếu môi trường cho phép, quan sát có lỗi stack overflow không.","Viết 1 bản đệ quy tối ưu hơn (đệ quy đuôi) nếu có thể, so sánh với bản đệ quy thường."]},
{label:'Thứ 6', title:'Tự giải lại & review', content:'Two-pointer là 1 trong những kỹ thuật xuất hiện nhiều nhất trong các bài toán mảng/chuỗi cơ bản đến trung bình — luyện thành thạo kỹ thuật này giúp giải nhanh rất nhiều bài toán tương tự sau này.', exercises:["Tự giải lại bài đảo ngược chuỗi (cả bản gốc và bản đảo từng từ) từ đầu không xem code cũ.","Tự giải lại cả 2 bài (đảo chuỗi + đảo từng từ) và đo thời gian hoàn thành, so với lần đầu làm.","Viết ra 2-3 bài toán khác mà bạn nghĩ có thể áp dụng được two-pointer."]},
], tests:[{args:['hello'], expected:'olleh'},{args:['JavaScript'], expected:'tpircSavaJ'},{args:[''], expected:''}]},
'valid-palindrome':{name:'Kiểm tra Palindrome', difficulty:'Dễ', signature:'function solve(str)', desc:'Kiểm tra chuỗi có phải palindrome không, bỏ qua khoảng trắng và không phân biệt hoa thường.', example:'<b>Input:</b> "A man a plan a canal Panama"\n<b>Output:</b> true', starter:'function solve(str) {\n  // viết code tại đây\n}', approach:'Chuẩn hóa chuỗi (bỏ khoảng trắng, viết thường) rồi dùng two-pointer so sánh từ 2 đầu vào giữa.', caseReal:'Kiểm tra tính đối xứng của dữ liệu xuất hiện trong xử lý văn bản, kiểm tra mã checksum, hoặc bài toán chuỗi DNA trong sinh học tính toán.', days:[
{label:'Thứ 2', title:'Chuẩn hóa dữ liệu đầu vào', content:'Trước khi kiểm tra palindrome, cần chuẩn hóa chuỗi: chuyển về chữ thường và loại bỏ khoảng trắng/ký tự đặc biệt. Bước chuẩn hóa dữ liệu đầu vào là thói quen quan trọng — rất nhiều bug thực tế đến từ việc bỏ qua bước này.', example:'const clean = str.toLowerCase().replace(/[^a-z0-9]/g, "");', exercises:["Viết đoạn code chuẩn hóa chuỗi (lowercase + bỏ ký tự không phải chữ/số), test với \"A man, a plan, a canal: Panama\".","Test hàm chuẩn hóa với chuỗi có số (ví dụ \"12321\"), xác nhận số vẫn được giữ lại đúng.","Liệt kê 3 loại ký tự đặc biệt khác nhau (dấu câu, emoji, chữ có dấu) và suy nghĩ cách chuẩn hóa xử lý chúng."]},
{label:'Thứ 3', title:'Code trong editor & chạy test', content:'Sau khi chuẩn hóa, áp dụng lại kỹ thuật two-pointer đã học ở tuần 3: so sánh ký tự từ 2 đầu vào giữa, nếu có bất kỳ cặp nào không khớp thì trả về false ngay lập tức.', exercises:["Hoàn thành function solve(str) trong editor kết hợp chuẩn hóa + two-pointer, chạy test đến khi pass hết.","Test với chuỗi rỗng và chuỗi chỉ có 1 ký tự, xác nhận cả 2 đều trả về true hợp lý.","Test với chuỗi chỉ chứa toàn ký tự đặc biệt (sau khi chuẩn hóa thành rỗng), xem kết quả có hợp lý không."]},
{label:'Thứ 4', title:'Biến thể: Palindrome cho phép bỏ qua 1 ký tự', content:'Bài toán khó hơn: chuỗi được coi là "gần palindrome" nếu chỉ cần xóa TỐI ĐA 1 ký tự là thành palindrome thật sự. Ý tưởng: khi gặp cặp ký tự không khớp, thử bỏ qua ký tự bên trái HOẶC bên phải, kiểm tra phần còn lại có phải palindrome không.', exercises:["Thử tự nghĩ hướng giải cho bài toán \"Palindrome cho phép xóa tối đa 1 ký tự\" (chỉ cần viết ý tưởng ra giấy, không cần code hoàn chỉnh).","Thử tự tay lần qua ví dụ \"abca\" để xác nhận ý tưởng đúng trước khi code thật.","Nếu có thời gian, thử code thử bài toán mở rộng này (không bắt buộc phải hoàn thiện)."]},
{label:'Thứ 5', title:'Tổng quát hóa pattern Two-Pointer', content:'Sau 4 tuần, bạn đã dùng two-pointer cho Two Sum (mảng sắp xếp), Reverse String, và Valid Palindrome. Điểm chung: cả 3 bài đều xử lý dữ liệu tuyến tính (mảng/chuỗi) và cần so sánh/xử lý từ 2 đầu vào giữa — nhận diện pattern này giúp nhận ra ngay khi gặp bài toán tương tự.', exercises:["Viết ra 1 câu tóm tắt (bằng ngôn ngữ của bạn) về \"khi nào nên nghĩ đến two-pointer\" để tự nhắc lại sau này.","Viết ra bằng lời sự khác biệt giữa two-pointer để SO SÁNH (palindrome) và two-pointer để HOÁN ĐỔI (reverse string).","Thử áp dụng two-pointer cho 1 bài toán mới bạn tự nghĩ ra (ví dụ kiểm tra mảng có đối xứng không)."]},
{label:'Thứ 6', title:'Tự giải lại & review toàn bộ tháng 1', content:'Đây là ngày tổng kết tháng 1 của track Thuật toán — nhìn lại 4 bài đã học (Two Sum, FizzBuzz, Reverse String, Valid Palindrome) và pattern chung giữa chúng, chuẩn bị tinh thần cho tháng 2 với độ khó tăng dần.', exercises:["Tự giải lại cả 4 bài của tháng 1 (không xem code cũ), ghi lại bài nào bạn còn chưa tự tin, ưu tiên ôn lại bài đó trước khi sang tháng 2.","Tự đặt ra 3 bài toán ngẫu nhiên trong 4 bài đã học, giải lại không xem đáp án, tự chấm điểm.","Viết ra kế hoạch ôn tập riêng cho các bài bạn còn yếu trước khi bắt đầu tháng 2."]},
], tests:[{args:['A man a plan a canal Panama'], expected:true},{args:['race a car'], expected:false},{args:['level'], expected:true}]},
'count-chars':{name:'Đếm tần suất ký tự', difficulty:'Dễ', signature:'function solve(str)', desc:'Đếm số lần xuất hiện của mỗi ký tự trong chuỗi, trả về object {ký_tự: số_lần}.', example:'<b>Input:</b> "aabbc"\n<b>Output:</b> {a:2, b:2, c:1}', starter:'function solve(str) {\n  // viết code tại đây\n}', approach:'Dùng object/HashMap làm bộ đếm, duyệt qua từng ký tự và tăng giá trị đếm tương ứng — O(n).', caseReal:'Đếm tần suất là bước đầu tiên của rất nhiều bài toán phân tích dữ liệu, ví dụ đếm số lần xuất hiện từ khóa trong log hệ thống.', tests:[{args:['aabbc'], expected:{a:2,b:2,c:1}},{args:['xyz'], expected:{x:1,y:1,z:1}}]},
'bubble-sort':{name:'Bubble Sort', difficulty:'Dễ', signature:'function solve(arr)', desc:'Tự cài đặt Bubble Sort để sắp xếp mảng số tăng dần (không dùng .sort() có sẵn).', example:'<b>Input:</b> [5,3,8,1]\n<b>Output:</b> [1,3,5,8]', starter:'function solve(arr) {\n  // viết code tại đây\n}', approach:'So sánh từng cặp phần tử liền kề, hoán đổi nếu sai thứ tự, lặp lại nhiều vòng cho đến khi không còn hoán đổi nào — độ phức tạp O(n²).', caseReal:'Bubble Sort ít dùng trong thực tế vì chậm, nhưng là bài học nền tảng để hiểu độ phức tạp thuật toán trước khi học QuickSort/MergeSort.', tests:[{args:[[5,3,8,1]], expected:[1,3,5,8]},{args:[[1]], expected:[1]},{args:[[4,2,2,1]], expected:[1,2,2,4]}]},
'binary-search':{name:'Tìm kiếm nhị phân', difficulty:'Trung bình', signature:'function solve(sortedArr, target)', desc:'Cài đặt binary search trên mảng đã sắp xếp tăng dần, trả về chỉ số của target hoặc -1. Yêu cầu O(log n).', example:'<b>Input:</b> sortedArr=[1,3,5,7,9,11], target=7\n<b>Output:</b> 3', starter:'function solve(sortedArr, target) {\n  // viết code tại đây\n}', approach:'So sánh phần tử giữa mảng với target, thu hẹp phạm vi tìm kiếm về nửa trái hoặc nửa phải — độ phức tạp O(log n).', caseReal:'Binary search là nền tảng của nhiều hệ thống thực tế: tìm kiếm trong database đã đánh index, git bisect tìm commit gây lỗi.', tests:[{args:[[1,3,5,7,9,11],7], expected:3},{args:[[1,3,5,7,9,11],2], expected:-1},{args:[[5],5], expected:0}]},
'valid-parentheses':{name:'Ngoặc hợp lệ', difficulty:'Trung bình', signature:'function solve(str)', desc:'Kiểm tra chuỗi chỉ gồm (){}[] có hợp lệ không (mở/đóng đúng thứ tự, dùng Stack).', example:'<b>Input:</b> "({[]})"\n<b>Output:</b> true', starter:'function solve(str) {\n  // viết code tại đây\n}', approach:'Dùng Stack: gặp dấu mở thì đẩy vào stack, gặp dấu đóng thì kiểm tra đỉnh stack có khớp không rồi pop ra.', caseReal:'Kỹ thuật Stack kiểm tra cặp ngoặc được dùng trong trình biên dịch/parser thực tế để kiểm tra cú pháp code hợp lệ.', tests:[{args:['({[]})'], expected:true},{args:['(]'], expected:false},{args:['(('], expected:false},{args:[''], expected:true}]},
'merge-sorted-arrays':{name:'Trộn 2 mảng đã sắp xếp', difficulty:'Dễ', signature:'function solve(a, b)', desc:'Trộn 2 mảng số đã sắp xếp tăng dần thành 1 mảng sắp xếp tăng dần.', example:'<b>Input:</b> a=[1,3,5], b=[2,4,6]\n<b>Output:</b> [1,2,3,4,5,6]', starter:'function solve(a, b) {\n  // viết code tại đây\n}', approach:'Dùng 2 con trỏ duyệt song song 2 mảng, so sánh và lấy phần tử nhỏ hơn ra mảng kết quả — O(n+m).', caseReal:'Đây chính là bước "merge" trong Merge Sort, và là thao tác cốt lõi khi gộp log từ nhiều server đã sắp xếp theo thời gian.', tests:[{args:[[1,3,5],[2,4,6]], expected:[1,2,3,4,5,6]},{args:[[],[1,2]], expected:[1,2]},{args:[[1],[]], expected:[1]}]},
'remove-duplicates':{name:'Xóa phần tử trùng', difficulty:'Dễ', signature:'function solve(sortedArr)', desc:'Cho mảng số đã sắp xếp tăng dần, trả về mảng mới chỉ giữ giá trị duy nhất.', example:'<b>Input:</b> [1,1,2,2,3]\n<b>Output:</b> [1,2,3]', starter:'function solve(sortedArr) {\n  // viết code tại đây\n}', approach:'Vì mảng đã sắp xếp, chỉ cần so sánh phần tử hiện tại với phần tử trước đó, bỏ qua nếu trùng — O(n).', caseReal:'Loại bỏ dữ liệu trùng lặp là thao tác làm sạch dữ liệu (data cleaning) rất phổ biến trước khi xử lý hoặc phân tích dữ liệu thực tế.', tests:[{args:[[1,1,2,2,3]], expected:[1,2,3]},{args:[[1,1,1]], expected:[1]},{args:[[]], expected:[]}]},
'factorial':{name:'Giai thừa (đệ quy)', difficulty:'Dễ', signature:'function solve(n)', desc:'Tính n! bằng đệ quy (n! = n * (n-1) * ... * 1, 0! = 1).', example:'<b>Input:</b> 5\n<b>Output:</b> 120', starter:'function solve(n) {\n  // viết code tại đây, dùng đệ quy\n}', approach:'Hàm đệ quy với điều kiện dừng (base case) n<=1 trả về 1, ngược lại trả về n * solve(n-1).', caseReal:'Giai thừa xuất hiện trong tính toán xác suất, tổ hợp — nền tảng cho các bài toán thống kê và machine learning cơ bản.', tests:[{args:[5], expected:120},{args:[0], expected:1},{args:[1], expected:1},{args:[6], expected:720}]},
'fibonacci':{name:'Fibonacci', difficulty:'Trung bình', signature:'function solve(n)', desc:'Trả về số Fibonacci thứ n (F(0)=0, F(1)=1). Nên dùng memoization để tối ưu.', example:'<b>Input:</b> 10\n<b>Output:</b> 55', starter:'function solve(n) {\n  // viết code tại đây\n}', approach:'Đệ quy thuần có độ phức tạp mũ O(2^n) do tính lại nhiều lần; dùng memoization (lưu kết quả đã tính) đưa về O(n).', caseReal:'Fibonacci là ví dụ kinh điển để học memoization/Dynamic Programming — kỹ thuật áp dụng rộng rãi để tối ưu bài toán đệ quy có tính toán lặp lại.', tests:[{args:[0], expected:0},{args:[1], expected:1},{args:[10], expected:55},{args:[20], expected:6765}]},
'missing-number':{name:'Tìm số bị thiếu', difficulty:'Trung bình', signature:'function solve(nums)', desc:'Cho mảng n số phân biệt lấy từ đoạn 0..n, tìm số duy nhất bị thiếu.', example:'<b>Input:</b> [3,0,1]\n<b>Output:</b> 2', starter:'function solve(nums) {\n  // viết code tại đây\n}', approach:'Tính tổng kỳ vọng của dãy 0..n bằng công thức n(n+1)/2, trừ đi tổng thực tế của mảng để ra số bị thiếu — O(n).', caseReal:'Dùng công thức toán học thay vì brute-force giúp tối ưu đáng kể — tư duy hữu ích khi cần xử lý dữ liệu lớn với thời gian giới hạn.', tests:[{args:[[3,0,1]], expected:2},{args:[[0,1]], expected:2},{args:[[9,6,4,2,3,5,7,0,1]], expected:8}]},
'flatten':{name:'Làm phẳng mảng lồng nhau', difficulty:'Khó', signature:'function solve(arr)', desc:'Làm phẳng hoàn toàn mảng lồng nhau ở bất kỳ độ sâu nào, không dùng .flat(Infinity).', example:'<b>Input:</b> [1,[2,[3,[4,5]],6]]\n<b>Output:</b> [1,2,3,4,5,6]', starter:'function solve(arr) {\n  // viết code tại đây\n}', approach:'Dùng đệ quy: duyệt từng phần tử, nếu là mảng thì gọi đệ quy làm phẳng tiếp, nếu không thì thêm thẳng vào kết quả.', caseReal:'Làm phẳng dữ liệu lồng nhau thường gặp khi xử lý JSON response phức tạp từ API hoặc cấu trúc cây (tree) trong hệ thống thực tế.', tests:[{args:[[1,[2,[3,[4,5]],6]]], expected:[1,2,3,4,5,6]},{args:[[1,2,3]], expected:[1,2,3]},{args:[[[1],[2,[3]]]], expected:[1,2,3]}]},
'group-anagrams':{name:'Nhóm Anagram', difficulty:'Trung bình', signature:'function solve(words)', desc:'Nhóm các từ là anagram của nhau lại thành các mảng con.', example:'<b>Input:</b> ["eat","tea","tan","ate","nat","bat"]\n<b>Output:</b> [["eat","tea","ate"],["tan","nat"],["bat"]]', starter:'function solve(words) {\n  // viết code tại đây\n}', approach:'Dùng HashMap với key là chuỗi đã sắp xếp ký tự (chữ ký chung của các anagram), value là danh sách các từ có cùng chữ ký.', caseReal:'Kỹ thuật "chuẩn hóa thành key rồi group" được dùng để phát hiện trùng lặp gần đúng, ví dụ nhóm bài viết đạo văn có nội dung xáo trộn thứ tự từ.', tests:[{args:[["eat","tea","tan","ate","nat","bat"]], expected:[["ate","eat","tea"],["nat","tan"],["bat"]], normalize:'anagram'}]},
'longest-substring':{name:'Chuỗi con không lặp dài nhất', difficulty:'Khó', signature:'function solve(str)', desc:'Tìm độ dài của chuỗi con dài nhất không chứa ký tự lặp lại (sliding window).', example:'<b>Input:</b> "abcabcbb"\n<b>Output:</b> 3', starter:'function solve(str) {\n  // viết code tại đây\n}', approach:'Dùng sliding window với 1 Set lưu ký tự trong cửa sổ hiện tại, mở rộng cửa sổ về bên phải và thu hẹp bên trái khi gặp ký tự trùng.', caseReal:'Sliding window là kỹ thuật nền tảng cho bài toán phân tích chuỗi/mảng liên tục, ví dụ phát hiện đoạn traffic bất thường trong 1 khoảng thời gian trượt.', tests:[{args:['abcabcbb'], expected:3},{args:['bbbbb'], expected:1},{args:['pwwkew'], expected:3},{args:[''], expected:0}]},
'merge-intervals':{name:'Gộp khoảng thời gian', difficulty:'Khó', signature:'function solve(intervals)', desc:'Cho mảng các khoảng [start,end], gộp các khoảng chồng lấn lại với nhau.', example:'<b>Input:</b> [[1,3],[2,6],[8,10]]\n<b>Output:</b> [[1,6],[8,10]]', starter:'function solve(intervals) {\n  // viết code tại đây\n}', approach:'Sắp xếp các khoảng theo giá trị bắt đầu, sau đó duyệt qua và gộp khoảng hiện tại với khoảng trước nếu chúng chồng lấn.', caseReal:'Gộp khoảng thời gian là bài toán thực tế khi xử lý lịch họp (tìm khoảng trống chung), hoặc gộp khoảng booking phòng trong hệ thống đặt lịch.', tests:[{args:[[[1,3],[2,6],[8,10]]], expected:[[1,6],[8,10]]},{args:[[[1,4],[4,5]]], expected:[[1,5]]}]},
'climbing-stairs':{name:'Leo cầu thang (DP)', difficulty:'Trung bình', signature:'function solve(n)', desc:'Mỗi bước leo 1 hoặc 2 bậc, tính số cách khác nhau để leo hết n bậc thang.', example:'<b>Input:</b> 3\n<b>Output:</b> 3', starter:'function solve(n) {\n  // viết code tại đây\n}', approach:'Đây thực chất là dãy Fibonacci: số cách leo n bậc = số cách leo (n-1) bậc + số cách leo (n-2) bậc — giải bằng DP bottom-up O(n).', caseReal:'Bài toán "đếm số cách" là dạng cơ bản nhất của Dynamic Programming, nền tảng để giải các bài DP phức tạp hơn sau này.', tests:[{args:[2], expected:2},{args:[3], expected:3},{args:[5], expected:8}]},
'queue-two-stacks':{name:'Queue bằng 2 Stack', difficulty:'Khó', signature:'function solve(operations)', desc:'Cài đặt hàng đợi bằng 2 Stack. operations là mảng lệnh ["enqueue",giá_trị] hoặc ["dequeue"]. Trả về mảng kết quả các lệnh dequeue theo thứ tự.', example:'<b>Input:</b> [["enqueue",1],["enqueue",2],["dequeue"],["enqueue",3],["dequeue"]]\n<b>Output:</b> [1,2]', starter:'function solve(operations) {\n  // gợi ý: dùng 2 mảng làm 2 stack\n}', approach:'Dùng 1 stack cho việc enqueue (đẩy trực tiếp), khi dequeue mà stack kia rỗng thì đổ hết stack enqueue sang stack dequeue rồi pop.', caseReal:'Bài toán "dùng cấu trúc dữ liệu này để cài đặt cấu trúc dữ liệu khác" là dạng câu hỏi phỏng vấn kinh điển để kiểm tra hiểu bản chất Stack/Queue.', tests:[{args:[[["enqueue",1],["enqueue",2],["dequeue"],["enqueue",3],["dequeue"]]], expected:[1,2]},{args:[[["enqueue","a"],["dequeue"],["enqueue","b"],["enqueue","c"],["dequeue"],["dequeue"]]], expected:['a','b','c']}]},
'max-subarray':{name:'Tổng mảng con lớn nhất', difficulty:'Khó', signature:'function solve(nums)', desc:'Tìm tổng lớn nhất của 1 mảng con liên tiếp (thuật toán Kadane, O(n)).', example:'<b>Input:</b> [-2,1,-3,4,-1,2,1,-5,4]\n<b>Output:</b> 6', starter:'function solve(nums) {\n  // viết code tại đây\n}', approach:'Thuật toán Kadane: duyệt qua mảng, tại mỗi bước giữ tổng lớn nhất kết thúc tại vị trí hiện tại, reset về 0 nếu tổng đang âm — O(n).', caseReal:'Kadane là ví dụ kinh điển về DP 1 chiều, ứng dụng thực tế trong phân tích chuỗi lợi nhuận/lỗ liên tiếp (tìm giai đoạn lãi lớn nhất trong dữ liệu chứng khoán).', tests:[{args:[[-2,1,-3,4,-1,2,1,-5,4]], expected:6},{args:[[1]], expected:1},{args:[[5,4,-1,7,8]], expected:23},{args:[[-3,-1,-2]], expected:-1}]},

{title:"Kiến trúc Component & Composable trong Vue 3", points:["Composable là hàm bắt đầu bằng \"use\" đóng gói logic có thể tái sử dụng, tách biệt khỏi UI.","Nguyên tắc: mỗi component nên làm một việc, logic phức tạp đẩy ra composable.","So với mixin cũ ở Vue 2, composable tránh xung đột tên và dễ trace nguồn gốc hơn.","Composable có thể nhận tham số reactive (ref/computed) và trả về state + method.","Trong AWX Refiner, các pattern lặp lại như gọi API + loading state là ứng viên tốt để tách composable."], practice:"Viết composable useApiRequest(url) tự quản lý state loading/data/error, dùng lại nó ở ít nhất 2 nơi khác nhau trong project demo.", case:"Trong các dự án Vue 3 thực tế, composable là cách chuẩn để chia sẻ logic gọi API, xử lý form, hay theo dõi kích thước màn hình — tránh lặp code giữa các component mà không cần Pinia cho những state không thực sự global.", task:"Chọn 1 đoạn logic lặp lại trong AWX Refiner (ví dụ gọi API + loading state), tách thành composable useXxx() và áp dụng lại ở 2 component.", days:[
{label:'Thứ 2', title:'Vì sao cần Composable', content:'Trước Composition API, logic dùng chung giữa các component thường được xử lý bằng mixin — nhưng mixin có 2 vấn đề lớn: xung đột tên khi 2 mixin cùng định nghĩa 1 property, và không rõ property/method nào đến từ mixin nào khi đọc code. Composable giải quyết cả 2 vấn đề này bằng cách trả về object rõ ràng và import tường minh — bạn luôn biết chính xác 1 biến "đến từ đâu".', exercises:["Tìm 2 chỗ trong project (hoặc dự án demo) đang có logic trùng lặp — ví dụ pattern loading/data/error khi gọi API. Ghi ra giấy điểm chung giữa 2 chỗ đó.","Giải thích bằng lời (không cần viết code) tại sao mixin cũ dễ gây xung đột tên hơn composable.","Liệt kê thêm 1 ví dụ ngoài AWX Refiner có thể áp dụng composable."]},
{label:'Thứ 3', title:'Cấu trúc 1 Composable chuẩn', content:'Một composable là hàm JS thường, quy ước đặt tên bắt đầu bằng "use". Nó có thể dùng ref/reactive bên trong và return ra 1 object chứa state + method để component dùng. Composable KHÔNG nên được gọi bên trong điều kiện (if) hay vòng lặp — luôn gọi ở top-level của setup(), giống quy tắc Hooks bên React.', example:'function useToggle(initial = false) {\n  const state = ref(initial);\n  function toggle() { state.value = !state.value; }\n  return { state, toggle };\n}', exercises:["Viết composable useToggle(initial) như ví dụ trên, dùng nó ở 2 component khác nhau (ví dụ 1 modal và 1 dropdown).","Viết thêm composable useCounter(initial=0) có increment()/decrement(), dùng thử ở 1 component.","Thử gọi useToggle() bên trong 1 điều kiện if (sai cách) để tự quan sát vấn đề xảy ra, rồi sửa lại đúng cách."]},
{label:'Thứ 4', title:'Composable gọi API', content:'Pattern phổ biến nhất trong thực tế: composable quản lý vòng đời của 1 lời gọi API — bao gồm trạng thái loading, data trả về, và error nếu có. Cần nhớ reset error/data khi gọi lại API mới, tránh hiển thị dữ liệu/lỗi cũ trong lúc đang load lại.', example:'function useApiRequest(url) {\n  const data = ref(null), error = ref(null), loading = ref(false);\n  async function fetchData() {\n    loading.value = true; error.value = null;\n    try { data.value = await (await fetch(url)).json(); }\n    catch (e) { error.value = e.message; }\n    finally { loading.value = false; }\n  }\n  return { data, error, loading, fetchData };\n}', exercises:["Cài đặt useApiRequest(url) như trên, test với 1 API công khai (ví dụ jsonplaceholder.typicode.com/todos/1).","Thêm khả năng hủy request cũ khi fetchData() được gọi lại trước khi request trước hoàn thành.","Viết vài dòng console.log kiểm tra useApiRequest trả về đúng trạng thái loading/data/error qua từng bước."]},
{label:'Thứ 5', title:'Composable dùng composable khác', content:'Composable có thể gọi các composable khác bên trong nó — đây là cách chia nhỏ logic phức tạp thành các phần dễ hiểu, mỗi phần chỉ làm 1 việc (Single Responsibility). Ví dụ useUserProfile có thể dùng useApiRequest bên trong để lấy dữ liệu, rồi thêm logic riêng (format tên, tính tuổi...) lên trên.', exercises:["Viết thêm 1 composable mới gọi lại useApiRequest bên trong (ví dụ useUserProfile dùng useApiRequest để lấy data user, sau đó thêm 1 computed để format lại tên hiển thị).","Vẽ sơ đồ (trên giấy) thể hiện composable nào gọi composable nào trong ví dụ useUserProfile.","Thử refactor 1 composable dài đang làm nhiều việc thành 2 composable nhỏ hơn, mỗi cái 1 trách nhiệm."]},
{label:'Thứ 6', title:'Áp dụng thực tế & tổng kết tuần', content:'Checklist nhận diện 1 đoạn code nên tách thành composable: (1) logic xuất hiện ở 2+ nơi, (2) logic không phụ thuộc trực tiếp vào template cụ thể, (3) logic có thể test độc lập không cần render UI. Nếu thỏa cả 3 điều kiện, gần như chắc chắn nên tách composable.', exercises:["Áp dụng useApiRequest (hoặc composable tương tự) vào ít nhất 1 chỗ thật trong AWX Refiner, thay thế code loading/data/error đang viết tay.","Viết lại checklist 3 tiêu chí nhận diện composable bằng lời của chính bạn (không nhìn lại bài học).","Sau khi áp dụng vào AWX Refiner, đo lại xem file component ngắn đi bao nhiêu dòng code."]},
]},
{title:"Reactivity system nội bộ (Proxy, ref vs reactive)", points:["Vue 3 dùng Proxy để theo dõi thay đổi object, thay cho Object.defineProperty ở Vue 2.","ref() bọc giá trị primitive trong object có .value; reactive() dùng cho object/array, không cần .value.","reactive() mất reactivity khi destructure — dùng toRefs() để giữ lại.","computed là giá trị được cache, chỉ tính lại khi dependency thay đổi.","watch theo dõi nguồn cụ thể; watchEffect tự động track mọi dependency dùng bên trong nó."], practice:"Viết 1 component nhỏ có object reactive() chứa 3 field, thử destructure trực tiếp (sai) rồi sửa bằng toRefs(), log ra console để thấy khác biệt về reactivity.", case:"Bug phổ biến trong dự án lớn: destructure props hoặc store state trực tiếp khiến UI không cập nhật khi state đổi — hiểu rõ ref/reactive giúp debug nhanh loại lỗi này.", task:"Viết đoạn code nhỏ minh họa việc destructure reactive() làm mất reactivity, rồi sửa lại bằng toRefs().", days:[
{label:'Thứ 2', title:'Vì sao Vue 3 chuyển sang Proxy', content:'Vue 2 dùng Object.defineProperty để theo dõi thay đổi, nhưng cách này có 2 hạn chế lớn: không phát hiện được khi thêm/xóa property mới vào object (phải dùng Vue.set), và không theo dõi được thay đổi qua index của mảng. Proxy trong Vue 3 bọc toàn bộ object và bắt được MỌI thao tác đọc/ghi, kể cả thêm property mới hay đổi index mảng — không cần API đặc biệt nào nữa.', exercises:["Đọc lại 1 đoạn code Vue 2 cũ (nếu có) dùng Vue.set(), thử hình dung nó sẽ đơn giản hơn thế nào nếu viết lại bằng Vue 3 reactive().","Viết ra 2 ví dụ cụ thể Vue 2 sẽ KHÔNG phát hiện được thay đổi (thêm property mới, đổi index mảng).","Thử tạo 1 Proxy JS thuần (không qua Vue) bằng new Proxy({}, handler) để hiểu cơ chế get/set bên dưới."]},
{label:'Thứ 3', title:'ref() vs reactive() — khi nào dùng cái nào', content:'ref() dùng cho giá trị đơn (số, chuỗi, boolean) hoặc khi bạn muốn gán lại toàn bộ giá trị (ví dụ user.value = newUser). reactive() dùng cho object/array mà bạn chỉ sửa từng field bên trong, không gán lại toàn bộ. Quy tắc thực dụng: nếu không chắc, dùng ref() cho mọi thứ — nó hoạt động với cả object và an toàn hơn khi destructure.', example:'const count = ref(0);           // primitive\nconst user = reactive({ name: "An", age: 20 }); // object', exercises:["Viết 1 component nhỏ dùng cả ref() cho 1 số đếm và reactive() cho 1 object user, log ra console để thấy cách truy cập khác nhau (.value vs truy cập trực tiếp).","Viết 1 object chứa 5 field bằng reactive(), thử sửa từng field và quan sát UI cập nhật đúng.","Thử gán lại toàn bộ user.value bằng ref(), so sánh với việc gán lại reactive() (không cho phép theo cách này)."]},
{label:'Thứ 4', title:'Mất reactivity khi destructure', content:'Khi destructure trực tiếp từ 1 object reactive(), các biến lấy ra chỉ còn là giá trị thường (snapshot), không còn liên kết với object gốc — thay đổi sau đó sẽ KHÔNG kích hoạt re-render. toRefs() chuyển từng property của object reactive thành ref riêng biệt, giữ nguyên liên kết reactivity khi destructure.', example:'const state = reactive({ count: 0 });\nconst { count } = state;         // SAI — mất reactivity\nconst { count } = toRefs(state); // ĐÚNG — vẫn liên kết với state.count', exercises:["Viết đoạn code minh họa lỗi mất reactivity khi destructure trực tiếp, sau đó sửa lại bằng toRefs() và xác nhận UI cập nhật đúng.","Thử dùng toRef() cho 1 field riêng lẻ, so sánh cú pháp khác gì toRefs().","Tìm trong 1 dự án thật xem có đoạn code nào đang destructure store/props có thể đang bị mất reactivity."]},
{label:'Thứ 5', title:'computed vs watch vs watchEffect', content:'computed dùng khi cần 1 giá trị được TÍNH ra từ state khác (có return, có cache). watch dùng khi cần chạy 1 HÀNH ĐỘNG phụ (side effect) khi 1 nguồn cụ thể thay đổi — bạn chỉ định rõ nguồn cần theo dõi. watchEffect tự động theo dõi MỌI reactive value được dùng bên trong nó, tiện nhưng khó kiểm soát hơn khi hàm phức tạp.', exercises:["Viết 1 ví dụ: computed tính \"họ tên đầy đủ\" từ firstName+lastName, và 1 watch gọi console.log mỗi khi searchQuery thay đổi (giả lập gọi API).","Viết thêm 1 watch có immediate:true để chạy ngay khi component mount.","So sánh code cùng 1 logic viết bằng watch và watchEffect, nhận xét đoạn nào dễ đọc hơn."]},
{label:'Thứ 6', title:'Áp dụng thực tế & tổng kết tuần', content:'Bug UI "không cập nhật dù data đã đổi" gần như luôn quy về 1 trong 2 nguyên nhân: destructure reactive() sai cách, hoặc gán lại toàn bộ object thay vì sửa từng field. Khi debug loại bug này, luôn kiểm tra ref/reactive được dùng đúng cách trước khi nghi ngờ nguyên nhân phức tạp hơn.', exercises:["Rà lại 1 component thật trong AWX Refiner, tìm xem có chỗ nào destructure props hoặc store state trực tiếp có thể gây mất reactivity không.","Viết ra 3 dấu hiệu nhận biết 1 bug là do reactivity sai cách (không phải do logic sai).","Ghi chú lại phát hiện reactivity bạn tìm được trong dự án tuần này."]},
]},
{title:"State management pattern (Pinia)", points:["Pinia thay thế Vuex ở Vue 3, API đơn giản hơn và hỗ trợ TypeScript tốt.","Store gồm state, getters (như computed), actions (như methods, có thể async).","Nguyên tắc: chỉ đưa state vào store khi nhiều component không liên quan cần dùng chung.","Tránh lạm dụng store cho state cục bộ chỉ 1 component dùng — ref/reactive local là đủ.","Có thể chia nhiều store nhỏ theo domain (userStore, modelStore...) thay vì 1 store khổng lồ."], practice:"Tạo 1 Pinia store quản lý danh sách item (thêm/xóa/sửa), viết 1 getter tính toán (ví dụ đếm số item), và 1 action gọi API giả lập.", case:"Ở quy mô enterprise, chia store theo domain (thay vì 1 store khổng lồ) giúp nhiều dev làm việc song song mà không đụng code nhau, và dễ code-split theo route.", task:"Liệt kê 3 state hiện đang truyền qua nhiều props (prop drilling) trong AWX Refiner, đánh giá xem có nên đưa vào store không.", days:[
{label:'Thứ 2', title:'Khi nào cần store toàn cục', content:'Nguyên tắc quyết định: nếu state chỉ được dùng bởi 1 component và con cháu trực tiếp của nó, dùng props/provide-inject là đủ. Chỉ đưa vào Pinia store khi state cần chia sẻ giữa nhiều component KHÔNG có quan hệ cha-con trực tiếp (user đăng nhập, giỏ hàng, filter đang chọn ở nhiều trang khác nhau). Đưa quá nhiều state cục bộ vào store khiến app khó debug vì state "toàn cục" ở khắp nơi.', exercises:["Liệt kê 3 state trong AWX Refiner hiện tại — với mỗi cái, quyết định nó nên là local state, props, hay Pinia store, và giải thích lý do.","Viết ra 1 ví dụ state SAI khi đưa vào store (chỉ 1 component dùng) để tự nhận diện phản ví dụ.","Thử tưởng tượng nếu KHÔNG có Pinia, bạn sẽ truyền 3 state đã liệt kê qua props như thế nào."]},
{label:'Thứ 3', title:'Cấu trúc 1 Pinia store', content:'defineStore() nhận 1 id duy nhất và 1 object gồm state (hàm trả về object dữ liệu ban đầu), getters (giống computed), và actions (giống methods, có thể async). Actions là nơi DUY NHẤT nên thay đổi state trực tiếp — tránh sửa state từ bên ngoài store để dễ trace nguồn gốc thay đổi.', example:'export const useCartStore = defineStore("cart", {\n  state: () => ({ items: [] }),\n  getters: { total: (s) => s.items.reduce((a,b)=>a+b.price,0) },\n  actions: { addItem(item) { this.items.push(item); } }\n});', exercises:["Tạo 1 store quản lý danh sách item (thêm/xóa), viết 1 getter tính tổng số lượng item.","Thêm 1 getter thứ 2 (ví dụ lọc item theo điều kiện) vào store đã tạo.","Thử gọi trực tiếp store.items.push() từ component (sai cách) rồi sửa lại gọi qua action đúng cách."]},
{label:'Thứ 4', title:'Actions bất đồng bộ (gọi API)', content:'Actions trong Pinia có thể là async function bình thường — không cần cú pháp đặc biệt nào khác. Pattern phổ biến: action set loading=true, gọi API, set data khi thành công, set error khi thất bại, cuối cùng set loading=false trong finally.', example:'actions: {\n  async fetchItems() {\n    this.loading = true;\n    try { this.items = await api.getItems(); }\n    finally { this.loading = false; }\n  }\n}', exercises:["Thêm 1 action bất đồng bộ vào store ở Thứ 3, gọi 1 API giả lập (có thể dùng setTimeout để mô phỏng độ trễ mạng).","Thêm xử lý lỗi (try/catch) vào action bất đồng bộ, lưu error vào 1 state riêng trong store.","Gọi action đó từ 2 component khác nhau, xác nhận cả 2 đều nhận được cùng 1 state cập nhật."]},
{label:'Thứ 5', title:'Chia nhỏ store theo domain', content:'Thay vì 1 store "app" khổng lồ chứa mọi thứ, chia thành nhiều store nhỏ theo domain nghiệp vụ (userStore, cartStore, modelStore...). Điều này giúp nhiều dev làm việc song song không đụng code nhau, và dễ code-split store theo route nếu cần. 1 store vẫn có thể gọi action/state của store khác khi cần phối hợp.', exercises:["Nếu project của bạn có 1 store lớn gộp nhiều domain khác nhau, thử vẽ ra (trên giấy) cách chia nó thành 2-3 store nhỏ hơn.","Viết ra tên gợi ý cho 2-3 store nhỏ nếu chia store lớn của bạn.","Thử để 1 action trong store A gọi action của store B, quan sát cách 2 store phối hợp."]},
{label:'Thứ 6', title:'Áp dụng thực tế & tổng kết tuần', content:'Trước khi thêm state mới vào store, tự hỏi: "state này có thực sự cần chia sẻ giữa nhiều component không liên quan không?" Nếu câu trả lời là không, giữ nó ở local state — store gọn gàng dễ maintain hơn nhiều so với store ôm đồm mọi thứ.', exercises:["Chọn 1 trong 3 state đã liệt kê ở Thứ 2 mà bạn xác định nên đưa vào store, thực sự implement nó vào Pinia store thật trong dự án.","Viết 1 đoạn ghi chú ngắn tổng kết: bạn đã học được gì mới về Pinia so với trước đây.","Kiểm tra lại toàn bộ store trong dự án, đánh dấu state nào có thể nên chuyển về local state."]},
]},
{title:"Performance: lazy loading & code splitting", points:["Code splitting chia bundle thành nhiều chunk nhỏ, chỉ tải khi cần.","Vue Router hỗ trợ lazy load route: component: () => import('./View.vue').","defineAsyncComponent cho phép lazy load component không qua router.","Lazy load ảnh bằng loading=\"lazy\" hoặc IntersectionObserver.","Đo tác động bằng Lighthouse hoặc tab Network trong DevTools trước/sau khi áp dụng."], practice:"Chuyển 2 route bất kỳ trong 1 project Vue sang lazy load, dùng Chrome DevTools Coverage tab đo % code chưa dùng tới khi tải trang chủ.", case:"Các ứng dụng dashboard lớn (như AWX Refiner) thường có hàng chục màn hình quản trị — lazy load theo route là kỹ thuật bắt buộc để giữ thời gian tải ban đầu nhanh.", task:"Chọn 1 route ít dùng trong AWX Refiner, chuyển sang lazy load và so sánh kích thước bundle trước/sau.", days:[
{label:'Thứ 2', title:'Vì sao bundle lớn ảnh hưởng performance', content:'Khi tải trang, trình duyệt phải tải VÀ parse toàn bộ JS bundle trước khi trang tương tác được (Time to Interactive). Bundle càng lớn, thời gian này càng lâu — đặc biệt ảnh hưởng nặng trên mạng chậm hoặc thiết bị yếu. Code splitting giải quyết vấn đề này bằng cách chỉ tải phần code thực sự cần cho màn hình hiện tại.', exercises:["Mở DevTools Network trên 1 trang thật, xem kích thước file JS chính được tải về là bao nhiêu KB/MB.","So sánh kích thước bundle giữa build production và dev mode, giải thích sự khác biệt.","Ghi lại thời gian tải trang hiển thị trong tab Network trước khi tối ưu, làm mốc so sánh."]},
{label:'Thứ 3', title:'Lazy load route với dynamic import', content:'Vue Router hỗ trợ sẵn lazy loading chỉ bằng cách thay import tĩnh bằng dynamic import trong khai báo route component. Khi build, Vite tự động tách route đó thành 1 chunk riêng, chỉ tải khi người dùng thực sự vào route đó.', example:'// Thay vì:\nimport SettingsView from "./SettingsView.vue";\n// Dùng:\nconst SettingsView = () => import("./SettingsView.vue");', exercises:["Chuyển 2 route ít dùng trong project sang lazy load bằng dynamic import.","Xác nhận trong build output (thư mục dist) thực sự xuất hiện file chunk riêng cho route vừa lazy load.","Thử lazy load thêm 1 route thứ 3, đo lại tổng kích thước bundle chính đã giảm bao nhiêu."]},
{label:'Thứ 4', title:'defineAsyncComponent cho component thường', content:'Với các component KHÔNG phải route (ví dụ 1 modal nặng, 1 chart phức tạp chỉ hiện khi người dùng bấm nút), dùng defineAsyncComponent để lazy load tương tự, kèm tùy chọn loadingComponent hiển thị trong lúc chờ tải.', example:'const HeavyChart = defineAsyncComponent(() =>\n  import("./HeavyChart.vue")\n);', exercises:["Tìm 1 component nặng trong project chỉ hiện có điều kiện (ví dụ modal), chuyển sang defineAsyncComponent.","Thêm 1 loadingComponent đơn giản (ví dụ spinner) hiển thị trong lúc defineAsyncComponent đang tải.","Thử xử lý trường hợp lỗi khi component async load thất bại."]},
{label:'Thứ 5', title:'Lazy load ảnh & IntersectionObserver', content:'Với hình ảnh, thuộc tính loading="lazy" của thẻ img đã được hầu hết trình duyệt hiện đại hỗ trợ sẵn, không cần thư viện. Với các trường hợp phức tạp hơn, IntersectionObserver cho phép tự viết logic "chỉ tải khi phần tử sắp xuất hiện trong màn hình".', example:'<img src="photo.jpg" loading="lazy" alt="..." />', exercises:["Thêm loading=\"lazy\" vào các thẻ img trong 1 trang có nhiều ảnh, so sánh Network tab trước/sau khi cuộn trang.","Thử đặt thuộc tính width/height cho ảnh có loading=\"lazy\" để tránh layout shift khi ảnh tải xong.","Tìm 1 ví dụ thực tế (không phải ảnh) có thể áp dụng IntersectionObserver, ví dụ animation chỉ chạy khi cuộn tới."]},
{label:'Thứ 6', title:'Đo lường & áp dụng thực tế', content:'Lighthouse chấm điểm Performance dựa trên các chỉ số như First Contentful Paint, Time to Interactive. Luôn đo TRƯỚC khi tối ưu để có baseline so sánh, rồi đo lại SAU khi áp dụng lazy loading để xác nhận thực sự cải thiện, không chỉ đoán.', exercises:["Chạy Lighthouse trên 1 trang của AWX Refiner trước và sau khi áp dụng lazy loading cho ít nhất 1 route, so sánh điểm Performance.","So sánh điểm Lighthouse Performance trước/sau, ghi lại chênh lệch cụ thể.","Viết 1 đoạn tóm tắt ngắn về những gì đã tối ưu trong tuần, dùng làm ghi chú cho code review sau này."]},
]},
{title:"Virtual DOM & thuật toán diffing", points:["Virtual DOM là cây object JS đại diện cho DOM thật, giúp so sánh (diff) rẻ hơn thao tác DOM trực tiếp.","Vue 3 dùng thuật toán diff tối ưu hơn Vue 2 nhờ compile-time hints (patch flag).","key trong v-for giúp Vue nhận diện đúng phần tử khi list thay đổi, tránh render sai.","Không phải lúc nào Virtual DOM cũng nhanh hơn thao tác DOM trực tiếp — nó đánh đổi để dễ maintain.","Hiểu cơ chế này giải thích tại sao thiếu key gây bug re-render kỳ lạ."], practice:"Tạo 1 danh sách 20 item render bằng v-for, thử đổi thứ tự index làm key rồi dùng Vue Devtools quan sát component nào bị re-render không cần thiết.", case:"Bug UI 'nhảy lung tung' khi xóa/thêm item giữa danh sách gần như luôn bắt nguồn từ dùng sai key trong v-for — lỗi rất phổ biến khi review code frontend.", task:"Tìm 1 chỗ dùng v-for trong code hiện tại thiếu key hoặc dùng index làm key, đánh giá rủi ro và sửa nếu cần."},
{title:"CSS Architecture", points:["BEM (Block Element Modifier) đặt tên class theo cấu trúc rõ ràng, tránh xung đột style.","Utility-first (như TailwindCSS) ưu tiên compose class nhỏ thay vì viết CSS riêng.","Scoped style trong Vue SFC tự động giới hạn phạm vi CSS theo component.","CSS Variables giúp theming động (dark mode, design token) mà không cần build lại.","Kiến trúc CSS nên nhất quán toàn dự án, tránh trộn lẫn nhiều cách đặt tên."], practice:"Chọn 1 trang bất kỳ, viết lại toàn bộ CSS theo đúng 1 quy ước (BEM hoặc utility-first) từ đầu đến cuối, không trộn lẫn.", case:"Dự án có nhiều dev cùng viết CSS mà không theo quy ước chung thường dẫn đến !important tràn lan và CSS ngày càng khó bảo trì — vấn đề rất thực tế ở các team frontend lớn.", task:"Xem lại 1 file .vue trong dự án, đánh giá style đang theo quy ước nào và có nhất quán với phần còn lại không."},
{title:"Accessibility (a11y) cơ bản cho SPA", points:["Dùng đúng thẻ HTML ngữ nghĩa (button, nav, header) thay vì div/span cho mọi thứ.","Mọi input cần có label liên kết (for/id hoặc aria-label).","Đảm bảo tương phản màu đủ để người khiếm thị màu vẫn đọc được.","Hỗ trợ điều hướng bằng bàn phím (Tab, Enter, Esc) cho modal, dropdown.","aria-* attributes bổ sung ngữ nghĩa cho screen reader khi HTML thuần không đủ."], practice:"Audit 1 trang bất kỳ bằng Lighthouse Accessibility score, sửa ít nhất 3 vấn đề nó chỉ ra (thiếu label, contrast thấp...).", case:"Nhiều công ty (đặc biệt khách hàng doanh nghiệp lớn ở Âu-Mỹ) yêu cầu bắt buộc đạt chuẩn WCAG — thiếu a11y có thể khiến sản phẩm không được duyệt hợp đồng.", task:"Thử điều hướng 1 form trong AWX Refiner chỉ bằng bàn phím (không dùng chuột), ghi lại chỗ nào bị kẹt."},
{title:"Web Security: XSS, CSRF trong ứng dụng FE", points:["XSS xảy ra khi input người dùng được render thẳng thành HTML/JS mà không escape.","Vue tự động escape nội dung trong {{ }}, nhưng v-html thì không — cẩn thận khi dùng.","CSRF lợi dụng session đã login để gửi request giả mạo.","CSRF token hoặc SameSite cookie là cách phòng chống phổ biến.","Không bao giờ tin dữ liệu từ client, kể cả khi đã validate ở FE."], practice:"Viết 1 đoạn demo nhỏ: hiển thị input người dùng bằng v-html với nội dung chứa thẻ script, quan sát hành vi, sau đó sửa lại an toàn bằng cách escape hoặc dùng thư viện sanitize (DOMPurify).", case:"Các cuộc pentest bảo mật ở doanh nghiệp thường tìm chính xác các điểm dùng v-html không kiểm soát — đây là lỗ hổng XSS kinh điển vẫn xuất hiện trong code thực tế.", task:"Tìm trong dự án chỗ nào đang dùng v-html, kiểm tra dữ liệu đưa vào có được sanitize không."},
{title:"HTTP caching & network optimization", points:["Cache-Control header quyết định trình duyệt lưu cache bao lâu, khi nào phải revalidate.","ETag giúp server trả 304 Not Modified nếu nội dung không đổi, tiết kiệm băng thông.","Gộp nhiều request nhỏ hoặc dùng HTTP/2 multiplexing để giảm overhead.","Debounce/throttle request khi người dùng gõ tìm kiếm liên tục.","Dùng DevTools tab Network để phân tích request nào chậm, request nào lặp không cần thiết."], practice:"Mở DevTools Network trên 1 trang thật, tìm 1 API bị gọi lại nhiều lần không cần thiết khi gõ tìm kiếm, thêm debounce 300ms và đo số lượng request giảm bao nhiêu.", case:"Chi phí server tăng vọt vì frontend gọi API không kiểm soát là vấn đề thực tế nhiều team gặp khi scale — debounce/cache ở FE là cách rẻ nhất để giảm tải backend.", task:"Mở DevTools Network khi thao tác trên AWX Refiner, tìm 1 request có thể debounce hoặc cache lại."},
{title:"TypeScript nâng cao cho FE", points:["Generics cho phép viết hàm/type tái sử dụng với nhiều kiểu dữ liệu mà vẫn type-safe.","Utility types như Partial, Pick, Omit giúp biến đổi type có sẵn mà không viết lại.","Union type và discriminated union giúp mô hình hóa nhiều trạng thái rõ ràng (loading/success/error).","unknown an toàn hơn any vì bắt buộc kiểm tra kiểu trước khi dùng.","Type guard (typeof, in, instanceof) giúp TypeScript thu hẹp kiểu trong từng nhánh code."], practice:"Viết 1 type ApiState<T> gồm 3 nhánh {status:'loading'} | {status:'success',data:T} | {status:'error',message:string} và áp dụng cho 1 component gọi API thật.", case:"Codebase TypeScript lớn thường có bug ở chỗ dùng any để 'cho qua' lỗi compiler — dần dà mất hết lợi ích type-safety; không lạm dụng any là kỹ năng phân biệt dev giỏi và dev thường.", task:"Viết 1 type union cho trạng thái gọi API (loading | success | error) và áp dụng vào 1 component thực tế."},
{title:"Testing FE với Vitest", points:["Unit test kiểm tra 1 đơn vị logic nhỏ (function, composable) độc lập với UI.","Component test kiểm tra component render đúng, phản ứng đúng với sự kiện người dùng.","Vitest tích hợp tốt với Vite, cú pháp gần giống Jest.","Mock API call khi test để không phụ thuộc vào backend thật.","Test không cần phủ 100%, ưu tiên phần logic quan trọng và dễ vỡ khi refactor."], practice:"Viết 3 test case cho 1 function util (ví dụ formatCurrency): 1 case input hợp lệ, 1 case edge case (số 0/âm), 1 case input không hợp lệ.", case:"Trong CI/CD chuyên nghiệp, PR không có test cho logic quan trọng thường bị reviewer từ chối merge — viết test là kỹ năng bắt buộc, không phải tùy chọn.", task:"Viết 1 unit test đơn giản cho 1 composable hoặc function util hiện có trong dự án."},
{title:"Build tools: Vite", points:["Vite dùng ES Module native trong dev, khởi động nhanh hơn Webpack truyền thống.","Tree-shaking loại bỏ code không dùng tới khi build production.","Chia chunk hợp lý giúp trình duyệt cache hiệu quả hơn khi deploy version mới.","Plugin Vite mở rộng khả năng xử lý (SVG, i18n, compress ảnh...).","Phân biệt rõ config cho dev và production trong vite.config.js."], practice:"Chạy build production (vite build), dùng plugin rollup-plugin-visualizer để xem chunk nào nặng nhất, đề xuất cách giảm.", case:"Bundle size tăng dần theo thời gian là vấn đề âm thầm ở dự án lâu năm — định kỳ phân tích bundle là việc senior FE dev thường làm trước mỗi release lớn.", task:"Xem file vite.config trong dự án, liệt kê các plugin đang dùng và tác dụng của từng cái."},
{title:"Browser rendering pipeline", points:["Trình duyệt xử lý qua các bước: Parse HTML/CSS → Style → Layout → Paint → Composite.","Thay đổi CSS ảnh hưởng layout (width, height) tốn kém hơn thay đổi chỉ ảnh hưởng paint (color).","transform và opacity được tối ưu bởi GPU, nên ưu tiên dùng cho animation.","Reflow hàng loạt do đọc/ghi DOM xen kẽ gây giật lag — nên gộp (batch) lại.","Hiểu pipeline này giải thích tại sao animate width lại giật hơn animate transform."], practice:"Tạo 1 animation di chuyển 1 box bằng cách đổi thuộc tính 'left' (gây reflow), đo FPS bằng Performance tab, sau đó đổi sang 'transform: translateX' và so sánh FPS.", case:"Animation giật lag trên thiết bị yếu thường do đổi sai thuộc tính CSS (layout-triggering thay vì composite-only) — lỗi performance cổ điển hay bị hỏi khi phỏng vấn senior FE.", task:"Tìm 1 chỗ trong CSS/animation của dự án đang animate thuộc tính gây reflow (width, top...), đề xuất đổi sang transform."},
{title:"Web APIs nâng cao", points:["IntersectionObserver phát hiện phần tử xuất hiện trong viewport, dùng cho lazy load, infinite scroll.","Web Worker chạy JS ở luồng riêng, không block UI khi xử lý nặng.","ResizeObserver theo dõi thay đổi kích thước phần tử mà không cần lắng nghe resize toàn trang.","localStorage/sessionStorage lưu dữ liệu phía client, khác nhau về vòng đời.","Các API này giúp giảm tải cho main thread và cải thiện trải nghiệm người dùng."], practice:"Cài đặt infinite scroll đơn giản bằng IntersectionObserver cho 1 danh sách dài (fetch thêm data khi cuộn đến cuối).", case:"Các bảng dữ liệu lớn trong dashboard quản trị (model list, log list...) gần như luôn cần phân trang hoặc infinite scroll để không load hết dữ liệu cùng lúc gây treo trang.", task:"Nghĩ 1 tính năng trong AWX Refiner có thể hưởng lợi từ IntersectionObserver (ví dụ infinite scroll danh sách model)."},
{title:"Design patterns trong FE", points:["Observer pattern: component lắng nghe và phản ứng khi state thay đổi (nền tảng của reactivity).","Factory pattern: hàm tạo ra component/object khác nhau dựa trên điều kiện đầu vào.","Singleton: đảm bảo chỉ có 1 instance duy nhất (ví dụ 1 instance axios dùng chung toàn app).","Provide/Inject trong Vue là dạng Dependency Injection, tránh truyền props qua nhiều tầng.","Nhận diện pattern giúp đọc hiểu code người khác nhanh hơn, không phải để áp dụng máy móc."], practice:"Refactor 1 chỗ đang truyền props qua 2-3 tầng component sang dùng provide/inject, so sánh độ rõ ràng của code trước/sau.", case:"'Prop drilling' là code smell rất phổ biến trong codebase Vue lớn tuổi — nhận diện và refactor đúng lúc là kỹ năng phân biệt code sạch và code rối.", task:"Tìm 1 chỗ trong dự án đang truyền props qua 3+ tầng component, đánh giá có nên dùng provide/inject không."},
{title:"SSR vs CSR vs SSG", points:["CSR: trình duyệt tải JS rồi mới render — SEO kém, first paint chậm hơn.","SSR: server render HTML sẵn, tốt cho SEO và tốc độ tải đầu.","SSG: build sẵn HTML tĩnh lúc build time, nhanh nhất nhưng không hợp nội dung động.","Nuxt.js là framework phổ biến để làm SSR/SSG cho Vue.","Chọn hướng nào phụ thuộc yêu cầu SEO và tần suất thay đổi nội dung, không có hướng nào tốt hơn tuyệt đối."], practice:"Dựng thử 1 project Nuxt nhỏ (npx nuxi init), so sánh view-source của trang CSR thuần và trang SSR Nuxt để thấy khác biệt HTML trả về.", case:"Landing page hoặc trang blog của sản phẩm SaaS thường cần SSR/SSG để lên Google tốt, trong khi phần dashboard sau đăng nhập (như AWX Refiner) vẫn dùng CSR vì không cần SEO.", task:"AWX Refiner hiện là CSR — thử nghĩ xem có phần nào (landing page, docs) sẽ hưởng lợi nếu chuyển sang SSR/SSG."},
{title:"Micro-frontend là gì, khi nào cần", points:["Micro-frontend chia 1 ứng dụng lớn thành nhiều phần độc lập, có thể phát triển/deploy riêng.","Phù hợp với team lớn, nhiều nhóm cùng làm trên 1 sản phẩm mà không muốn đụng code nhau.","Module Federation (Webpack 5) là kỹ thuật phổ biến để chia sẻ code giữa các micro-frontend.","Đánh đổi: phức tạp hơn về hạ tầng, cần đồng bộ version dependency giữa các phần.","Không nên áp dụng cho dự án nhỏ hoặc team nhỏ — độ phức tạp không đáng."], practice:"Đọc 1 case study thực tế về micro-frontend (ví dụ của Spotify hoặc IKEA), tóm tắt lại lý do họ chọn kiến trúc này bằng 3-4 câu.", case:"Micro-frontend chỉ thực sự đáng đầu tư khi có nhiều team lớn (50+ dev) làm cùng 1 sản phẩm — với quy mô nhỏ hơn, chi phí phức tạp thường lớn hơn lợi ích.", task:"Viết vài dòng nhận định xem AWX Refiner có đang ở quy mô cần micro-frontend hay chưa, vì sao."},
{title:"Progressive Web App (PWA) cơ bản", points:["PWA là web app có thể cài đặt như app native, hoạt động offline nhờ Service Worker.","Service Worker là script chạy nền, can thiệp vào network request để cache tài nguyên.","manifest.json khai báo icon, tên app, màu theme khi cài lên màn hình chính.","PWA phù hợp cho ứng dụng cần dùng offline hoặc muốn trải nghiệm giống app di động.","Không phải app nào cũng cần PWA — cân nhắc dựa trên nhu cầu người dùng thực tế."], practice:"Thêm 1 file manifest.json cơ bản và 1 Service Worker đơn giản (cache 1 vài file tĩnh) vào 1 project demo, thử tắt mạng và load lại trang.", case:"Ứng dụng thương mại điện tử hoặc tin tức thường dùng PWA để giữ chân người dùng ở khu vực mạng yếu — đây là bài toán thực tế PWA giải quyết tốt.", task:"Thử mở 1 web PWA quen thuộc trên điện thoại, quan sát cách nó hoạt động khi mất mạng."},
{title:"Debugging & performance profiling", points:["Tab Performance trong DevTools ghi lại timeline render, giúp tìm hàm nào tốn thời gian nhất.","Vue Devtools extension giúp xem component tree, props, state real-time.","console.time/console.timeEnd đo nhanh thời gian chạy 1 đoạn code cụ thể.","Memory tab giúp phát hiện memory leak (component không được garbage collect sau khi unmount).","Luôn đo trước khi tối ưu — đừng đoán chỗ nào chậm mà không có số liệu."], practice:"Ghi lại 1 đoạn Performance timeline khi thao tác 1 trang có danh sách dài, tìm hàm nào chiếm 'Self time' nhiều nhất trong flame chart.", case:"Khi người dùng report 'trang bị đơ', bước đầu tiên của FE dev chuyên nghiệp luôn là mở Performance tab để có số liệu cụ thể, thay vì đoán mò.", task:"Dùng tab Performance ghi lại 1 thao tác trong AWX Refiner cảm thấy chậm, xem hàm nào chiếm nhiều thời gian nhất."},
{title:"Code review & clean code cho FE", points:["Đặt tên biến/hàm rõ nghĩa quan trọng hơn viết comment giải thích code khó hiểu.","1 hàm nên làm 1 việc — nếu tên hàm có chữ \"and\" thường là dấu hiệu nên tách nhỏ.","Khi review code người khác, hỏi \"tại sao\" trước khi hỏi \"sao không làm cách khác\".","Convention nhất quán quan trọng hơn convention \"đúng nhất\" về lý thuyết.","Refactor an toàn khi có test bảo vệ — nếu chưa có test, cẩn trọng hơn khi đổi cấu trúc."], practice:"Chọn 1 hàm dài hơn 30 dòng trong 1 project, refactor tách thành 2-3 hàm nhỏ hơn, mỗi hàm có 1 trách nhiệm rõ ràng.", case:"Code review ở môi trường chuyên nghiệp thường xoay quanh việc đặt tên và tách hàm hợp lý hơn là style cá nhân — kỹ năng ảnh hưởng trực tiếp đến việc code có được approve nhanh hay không.", task:"Tự review lại 1 đoạn code bạn viết tuần trước, tìm 1 chỗ có thể đặt tên rõ hơn hoặc tách nhỏ hàm."},
{title:"Nuxt.js tổng quan", points:["Nuxt là framework xây trên Vue, hỗ trợ sẵn SSR/SSG, routing tự động theo cấu trúc thư mục.","File-based routing: mỗi file trong pages/ tự động thành 1 route, không cần khai báo thủ công.","Nuxt cung cấp sẵn tối ưu SEO (meta tag động) dễ dàng hơn so với tự cấu hình Vue CSR.","useFetch/useAsyncData là composable đặc trưng của Nuxt để fetch dữ liệu tương thích SSR.","Nuxt phù hợp khi dự án cần SEO tốt hoặc muốn giảm cấu hình thủ công so với Vue CLI/Vite thuần."], practice:"Tạo 1 trang trong Nuxt project demo, dùng useFetch để lấy dữ liệu từ 1 API công khai (ví dụ JSONPlaceholder), kiểm tra view-source thấy dữ liệu đã có sẵn trong HTML.", case:"Các công ty chuyển từ Vue CSR sang Nuxt thường vì lý do SEO hoặc muốn giảm thời gian cấu hình routing/build thủ công.", task:"Đọc qua tài liệu Nuxt, so sánh cấu trúc thư mục pages/ với cách tổ chức route hiện tại của AWX Refiner."},
{title:"Pinia nâng cao: plugin & persisted state", points:["Pinia hỗ trợ plugin để mở rộng hành vi cho mọi store (ví dụ tự động lưu localStorage).","pinia-plugin-persistedstate giúp giữ state qua lần reload trang mà không cần tự viết logic lưu/khôi phục.","Có thể subscribe vào store ($subscribe) để lắng nghe mọi thay đổi state, hữu ích cho logging/debug.","Composing nhiều store với nhau cần cẩn thận tránh phụ thuộc vòng.","Không phải state nào cũng cần persist — chỉ nên lưu những gì thực sự cần giữ qua phiên làm việc."], practice:"Thêm pinia-plugin-persistedstate vào 1 store, chọn 1 field (ví dụ filter đang chọn) để tự động lưu qua localStorage, test bằng cách reload trang.", case:"Tính năng 'giữ nguyên bộ lọc sau khi F5' là yêu cầu UX rất hay gặp trong các dashboard quản trị — pattern này giải quyết gọn bằng persisted state.", task:"Xác định 1 state trong AWX Refiner nên được giữ lại sau khi reload trang (ví dụ filter đang chọn), thử áp dụng persisted state."},
{title:"Web Components & Custom Elements", points:["Web Components là chuẩn trình duyệt cho phép tạo custom HTML tag tái sử dụng, độc lập framework.","Shadow DOM đóng gói style/markup của component, tránh xung đột CSS với trang cha.","Có thể dùng Web Components bên trong Vue, hữu ích khi cần chia sẻ UI giữa nhiều dự án khác framework.","Web Components chạy được ở bất kỳ nơi nào hỗ trợ HTML/JS chuẩn, không cần build riêng.","Đánh đổi: cú pháp và tooling kém tiện hơn Vue component thông thường."], practice:"Tạo 1 custom element đơn giản (ví dụ my-badge) bằng Web Components API thuần (customElements.define), nhúng thử vào 1 trang HTML bất kỳ.", case:"Design system dùng chung giữa nhiều dự án khác framework (Vue, React, Angular) đôi khi được xây bằng Web Components để không phụ thuộc framework cụ thể.", task:"Thử tạo 1 custom element đơn giản bằng Web Components API thuần, không dùng framework."},
{title:"GraphQL vs REST từ góc nhìn Frontend", points:["REST trả về cấu trúc dữ liệu cố định theo endpoint; GraphQL cho phép client tự chọn field cần lấy.","GraphQL giúp giảm over-fetching/under-fetching dữ liệu so với REST truyền thống.","REST đơn giản hơn để cache (theo URL); GraphQL cần thư viện riêng (Apollo Client, urql) để cache hiệu quả.","Chọn GraphQL hợp lý khi UI phức tạp cần dữ liệu từ nhiều nguồn; REST vẫn đủ tốt cho hầu hết CRUD đơn giản.","Không cần đổi toàn bộ hệ thống — có thể đánh giá theo từng tính năng cụ thể cần loại API nào."], practice:"Viết thử 1 GraphQL query giả định lấy đúng 3 field cần thiết cho 1 màn hình cụ thể, so sánh với response JSON đầy đủ mà REST API tương ứng trả về.", case:"Ứng dụng mobile với băng thông hạn chế thường được nhắc tới như lý do điển hình để chọn GraphQL thay vì REST, vì giảm dữ liệu thừa truyền qua mạng.", task:"So sánh 1 API REST đang dùng trong AWX Refiner với cách nó sẽ trông như thế nào nếu viết bằng GraphQL query."},
];

/* ============ JAVA BACKEND TRACK — 24 TUẦN / 6 THÁNG ============ */
const beWeeks = [
