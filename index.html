{q:"Nguyên âm ㅛ đọc là gì?", opts:["yu","yo","ya","yeo"], correct:1, explain:"ㅛ là phiên bản có thêm nét của ㅗ, đọc thành \"yo\"."},
{q:"Nguyên âm ㅜ đọc là gì?", opts:["o","u","eu","i"], correct:1, explain:"ㅜ đọc là \"u\", môi tròn đưa ra trước."},
{q:"Nguyên âm ㅠ đọc là gì?", opts:["yu","yo","ya","yeo"], correct:0, explain:"ㅠ là phiên bản có thêm nét của ㅜ, đọc thành \"yu\"."},
{q:"Nguyên âm ㅡ đọc là gì?", opts:["i","eu","u","a"], correct:1, explain:"ㅡ là âm không có trong tiếng Việt, đọc gần giống \"ư\" nhưng miệng ít tròn hơn."},
{q:"Nguyên âm ㅣ đọc là gì?", opts:["eu","i","a","o"], correct:1, explain:"ㅣ chỉ có 1 nét dọc, đọc là \"i\"."},
{q:"Âm tiết 아 (ㅇ+ㅏ) đọc là gì?", opts:["a","ya","o","u"], correct:0, explain:"ㅇ đứng đầu là phụ âm câm, chỉ giữ chỗ — âm tiết đọc theo đúng nguyên âm ㅏ là \"a\"."},
{q:"Âm tiết 여 (ㅇ+ㅕ) đọc là gì?", opts:["yo","yeo","ya","eo"], correct:1, explain:"Ghép ㅇ câm với ㅕ cho ra âm tiết đọc là \"yeo\"."},
]},
]},
{title:"Phụ âm cơ bản (기본 자음)", points:["14 phụ âm cơ bản: ㄱ(g/k), ㄴ(n), ㄷ(d/t), ㄹ(r/l), ㅁ(m), ㅂ(b/p), ㅅ(s), ㅇ(câm/ng), ㅈ(j), ㅊ(ch), ㅋ(k), ㅌ(t), ㅍ(p), ㅎ(h).","Một số phụ âm phát âm khác nhau tùy vị trí trong âm tiết.","Cấu trúc âm tiết tiếng Hàn: phụ âm đầu + nguyên âm + (phụ âm cuối, không bắt buộc) — ví dụ 한 = ㅎ+ㅏ+ㄴ.","Ghép phụ âm với nguyên âm tạo thành khối âm tiết vuông vắn, không viết rời như chữ Latin.","Luyện ghép các phụ âm đã học với 10 nguyên âm ở tuần 1 để tạo thành âm tiết hoàn chỉnh."], practice:"Luyện viết 14 phụ âm cơ bản, sau đó ghép thử ít nhất 20 âm tiết khác nhau và đọc to.", case:"Phát âm chuẩn ngay từ giai đoạn Hangul giúp tránh phải sửa lỗi phát âm về sau — đây là giai đoạn quan trọng nhất dù có vẻ đơn giản.", task:"Viết tên của bạn bằng tiếng Hàn (phiên âm gần đúng) bằng những phụ âm/nguyên âm đã học.", days:[
{label:'Thứ 2', title:'ㄱ, ㄷ, ㅂ, ㅈ — nhóm phụ âm tắc (âm thường)', content:'ㄱ (g/k) phát âm gần "g" tiếng Việt nhưng nhẹ hơn ở đầu từ, giống "k" ở cuối âm tiết. ㄷ (d/t) tương tự, đầu từ gần "đ" nhẹ, cuối âm tiết gần "t". ㅂ (b/p) đầu từ gần "b" nhẹ, cuối gần "p". ㅈ (j) gần âm "ch" nhẹ trong tiếng Việt. Đây là nhóm phụ âm "thường" (평음), sẽ có cặp "căng" (쌍자음, tuần 3) và "bật hơi" (격음, tuần này) — 3 mức độ này là điểm khó nhất của phát âm tiếng Hàn.', exercises:['Viết tay 4 phụ âm (ㄱ,ㄷ,ㅂ,ㅈ) mỗi âm 15 lần, đúng thứ tự nét.','Ghép mỗi phụ âm với 10 nguyên âm đã học tuần 1, viết ra tổng cộng 40 âm tiết.','Chọn 10 trong 40 âm tiết đó, đọc to và ghi âm lại để tự nghe.','Viết 4 phụ âm này xen kẽ với 10 nguyên âm theo thứ tự ngẫu nhiên (không theo hàng), luyện phản xạ ghép nhanh.','Tìm 2 từ tiếng Hàn đơn giản cho mỗi phụ âm (ví dụ 가방=cặp sách cho ㄱ), viết ra kèm nghĩa.']},
{label:'Thứ 3', title:'ㅋ, ㅌ, ㅍ, ㅊ — nhóm phụ âm bật hơi (격음)', content:'Nhóm này là phiên bản "bật hơi mạnh" của 4 phụ âm hôm trước: ㅋ(k mạnh), ㅌ(t mạnh), ㅍ(p mạnh), ㅊ(ch mạnh). Cách nhận biết: đặt tờ giấy mỏng trước miệng khi phát âm — với phụ âm bật hơi, giấy rung mạnh do luồng hơi thoát ra nhiều hơn. Khác biệt giữa ㄱ/ㅋ hay ㄷ/ㅌ là khác NGHĨA hoàn toàn — ví dụ 콩(đậu) khác 공(quả bóng).', exercises:['Thực hiện "test tờ giấy": phát âm cặp ㄱ/ㅋ, ㄷ/ㅌ, ㅂ/ㅍ, ㅈ/ㅊ trước 1 tờ giấy mỏng, cảm nhận luồng hơi.','Viết tay 4 phụ âm bật hơi, ghép với 10 nguyên âm, viết 40 âm tiết mới.','Viết cặp đôi 가/카, 다/타, 바/파, 자/차 và luyện đọc phân biệt rõ ràng.','Tự ghi âm bạn đọc 4 cặp phụ âm thường/bật hơi, nhờ người khác nghe thử xem có phân biệt được không.','Viết 3 từ có phụ âm bật hơi bạn tìm được, đọc to và luyện cảm giác luồng hơi khi phát âm.']},
{label:'Thứ 4', title:'ㄹ, ㅎ, ㅇ và ôn tập 14 phụ âm cơ bản', content:'ㄹ (r/l) là âm khó nhất cho người Việt vì nằm giữa "r" và "l". ㅎ (h) phát âm giống "h" tiếng Việt. ㅇ khi đứng đầu âm tiết là phụ âm CÂM (chỉ giữ chỗ để viết nguyên âm), nhưng khi đứng CUỐI âm tiết lại phát âm thành "ng" (như 강 = sông). Sau tuần này, bạn đã học đủ toàn bộ 14 phụ âm cơ bản của Hangul.', exercises:['Luyện riêng âm ㄹ bằng cách so sánh với "l" và "r" tiếng Anh/Việt, nghe nhiều lần từ có ㄹ.','Viết tay ㄹ, ㅎ mỗi âm 15 lần, ghép với 10 nguyên âm.','Tự viết lại toàn bộ bảng 14 phụ âm cơ bản theo trí nhớ, kiểm tra lại độ chính xác.','Xếp 14 phụ âm theo nhóm 3 mức độ đã biết (nếu đã học tới đó) hoặc theo cách bạn tự phân loại dễ nhớ nhất.','Viết tên 3 người bạn hoặc người thân bằng tiếng Hàn dùng các phụ âm đã học, thử đọc to lên.']},
{label:'Thứ 5', title:'Luyện ghép âm tiết hoàn chỉnh & từ vựng đầu tiên', content:'Với 14 phụ âm + 10 nguyên âm, bạn có thể ghép được 140 âm tiết cơ bản — đủ để bắt đầu đọc những từ tiếng Hàn đơn giản không có batchim. Một số từ cơ bản không có batchim: 어머니(mẹ), 아버지(bố), 바나나(chuối), 커피(cà phê), 사과(táo). Nhận diện từ mượn (외래어) như 커피(coffee), 버스(bus) là cách luyện đọc thú vị vì gần giống tiếng Anh gốc.', exercises:['Đọc và học nghĩa 8 từ tiếng Hàn đơn giản không có batchim (mẹ, bố, chuối, cà phê, táo, xe buýt, taxi, trà).','Viết tay lại 8 từ này, luyện đọc to từng từ 5 lần.','Tìm thêm 3 từ mượn tiếng Hàn khác (외래어) có thể đoán nghĩa qua cách đọc gần giống tiếng Anh.','Tự tạo thêm 10 âm tiết mới (ghép ngẫu nhiên phụ âm+nguyên âm đã học), không cần có nghĩa, chỉ luyện phản xạ viết-đọc.','Học thêm 4 từ vựng mượn (외래어) khác ngoài 3 từ đã tìm ở tuần trước, ví dụ 택시(taxi), 초콜릿(chocolate).']},
{label:'Thứ 6', title:'Tổng kết tuần 2 & kiểm tra tổng hợp', content:'Sau 2 tuần, bạn đã học đủ 10 nguyên âm + 14 phụ âm cơ bản — nền tảng của gần như toàn bộ Hangul. Đây là tốc độ khá nhanh — LUYỆN TẬP LẶP LẠI ĐỀU ĐẶN quan trọng hơn học nhanh mà không nhớ. Nếu chưa vững, hoàn toàn bình thường và nên dành thêm 1-2 ngày ôn lại trước khi qua tuần 3. Từ tuần 3, độ khó tăng nhẹ nhưng bạn đã có nền tảng vững để tiếp thu nhanh hơn.', exercises:['Làm bài tự kiểm tra: nhìn 20 âm tiết ngẫu nhiên, viết lại chính xác.','Ôn lại toàn bộ 8 từ vựng đã học ở Thứ 5, đảm bảo nhớ cả cách đọc và nghĩa.','Tự đánh giá theo thang 1-10 mức độ tự tin với toàn bộ phụ âm+nguyên âm cơ bản, nếu dưới 7 thì dành thêm thời gian ôn.','Làm bài tự kiểm tra: viết 14 phụ âm + 10 nguyên âm hoàn toàn theo trí nhớ trong 5 phút, tính thời gian.','Ôn lại toàn bộ 8 từ vựng đã học tuần này bằng cách viết nghĩa tiếng Việt trước, tự đoán từ tiếng Hàn tương ứng.'], quiz:[
{q:"Phụ âm ㄱ (ở đầu âm tiết) đọc gần với âm nào?", opts:["g/k","n","d/t","m"], correct:0, explain:"ㄱ đọc gần \"g\" nhẹ ở đầu âm tiết, gần \"k\" khi ở cuối."},
{q:"Phụ âm ㄴ đọc gần với âm nào?", opts:["g","n","r/l","b"], correct:1, explain:"ㄴ đọc giống âm \"n\" trong tiếng Việt."},
{q:"Phụ âm ㄷ đọc gần với âm nào?", opts:["d/t","s","j","h"], correct:0, explain:"ㄷ đọc gần \"đ\" nhẹ ở đầu âm tiết, gần \"t\" khi ở cuối."},
{q:"Phụ âm ㄹ đọc gần với âm nào?", opts:["n","r/l","m","ng"], correct:1, explain:"ㄹ là âm khó nhất cho người Việt, nằm giữa \"r\" và \"l\"."},
{q:"Phụ âm ㅁ đọc gần với âm nào?", opts:["m","b","s","ch"], correct:0, explain:"ㅁ đọc giống âm \"m\" trong tiếng Việt."},
{q:"Phụ âm ㅂ đọc gần với âm nào?", opts:["p","b/p","k","h"], correct:1, explain:"ㅂ đọc gần \"b\" nhẹ ở đầu âm tiết, gần \"p\" khi ở cuối."},
{q:"Phụ âm ㅅ đọc gần với âm nào?", opts:["s","j","ch","h"], correct:0, explain:"ㅅ đọc giống âm \"s\" trong tiếng Việt."},
{q:"Phụ âm ㅇ ở ĐẦU âm tiết có vai trò gì?", opts:["đọc là \"ng\"","câm, không có âm, chỉ giữ chỗ","đọc là \"h\"","đọc là \"m\""], correct:1, explain:"ㅇ ở đầu âm tiết là phụ âm câm; chỉ khi đứng CUỐI âm tiết mới đọc thành \"ng\"."},
{q:"Phụ âm ㅈ đọc gần với âm nào?", opts:["s","j (gần \"ch\" nhẹ)","h","k"], correct:1, explain:"ㅈ đọc gần âm \"ch\" nhẹ trong tiếng Việt."},
{q:"Phụ âm ㅎ đọc gần với âm nào?", opts:["h","k","t","p"], correct:0, explain:"ㅎ đọc giống âm \"h\" trong tiếng Việt."},
{q:"Phụ âm ㅋ so với ㄱ khác nhau thế nào?", opts:["Giống hệt ㄱ","ㅋ bật hơi mạnh hơn ㄱ","ㅋ là nguyên âm","ㅋ đọc là \"s\""], correct:1, explain:"ㅋ là phiên bản bật hơi mạnh của ㄱ, luồng hơi thoát ra nhiều hơn khi phát âm."},
{q:"Âm tiết 나 (ㄴ+ㅏ) đọc là gì?", opts:["na","da","ga","ma"], correct:0, explain:"Ghép phụ âm ㄴ với nguyên âm ㅏ cho ra âm tiết \"na\"."},
]},
]},
{title:"Nguyên âm đôi & phụ âm căng (이중모음, 쌍자음)", points:["Nguyên âm đôi là tổ hợp 2 nguyên âm đọc thành 1 âm: ㅐ(ae), ㅔ(e), ㅘ(wa), ㅝ(wo), ㅙ(wae), ㅞ(we), ㅚ(oe), ㅟ(wi), ㅢ(ui).","ㅐ và ㅔ phát âm khá giống nhau trong tiếng Hàn hiện đại, nhiều người bản xứ cũng không phân biệt rõ khi nói.","Phụ âm căng là phụ âm đôi, phát âm căng và dứt khoát hơn: ㄲ, ㄸ, ㅃ, ㅆ, ㅉ.","Phụ âm căng khác hoàn toàn về nghĩa so với phụ âm thường dù nhìn gần giống.","Luyện nghe phân biệt phụ âm thường/căng/bật hơi là kỹ năng khó nhất giai đoạn đầu, cần luyện tai nhiều."], practice:"Luyện viết toàn bộ nguyên âm đôi và phụ âm căng, ghép thử với các phụ âm/nguyên âm đã học ở 2 tuần trước.", case:"Bảng chữ cái Hangul hoàn chỉnh gồm 21 nguyên âm và 19 phụ âm — sau tuần này bạn đã học đủ toàn bộ Hangul cơ bản.", task:"Viết và đọc đúng bộ 3 phụ âm ㄱ/ㄲ/ㅋ, ㄷ/ㄸ/ㅌ, ㅂ/ㅃ/ㅍ, ㅅ/ㅆ, ㅈ/ㅉ/ㅊ để phân biệt độ căng/bật hơi.", days:[
{label:'Thứ 2', title:'ㅐ, ㅔ — nguyên âm đôi dễ nhầm nhất', content:'ㅐ (ae) và ㅔ (e) là 2 nguyên âm mà ngay cả người Hàn hiện đại cũng phát âm gần như giống hệt nhau. Về mặt viết, ㅐ = ㅏ+ㅣ, ㅔ = ㅓ+ㅣ. Với người mới, không cần quá lo phân biệt khi NGHE, nhưng cần nhớ chính xác khi VIẾT vì chính tả vẫn phân biệt rõ. Ví dụ: 개(chó) dùng ㅐ, 게(cua) dùng ㅔ.', exercises:['Viết tay ㅐ và ㅔ mỗi âm 15 lần, ghép với vài phụ âm đã học (개,게,내,네...).','Học 6 từ đơn giản phân biệt theo chính tả: 개(chó)/게(cua), 배(bụng/tàu/lê)/베개(gối).','Nghe và thử phân biệt (dù khó) 5 cặp từ dùng ㅐ/ㅔ khác nhau qua audio.','Viết 5 cặp từ tối thiểu (minimal pairs) khác ngoài 개/게 nếu tìm được, để luyện thêm phân biệt chính tả.','Thử viết 1 câu ngắn có cả ㅐ và ㅔ, đọc to và không cần lo lắng nếu phát âm chưa phân biệt rõ.']},
{label:'Thứ 3', title:'ㅘ, ㅝ, ㅙ, ㅞ, ㅚ, ㅟ, ㅢ — nguyên âm đôi còn lại', content:'Nhóm nguyên âm đôi phức tạp hơn: ㅘ(wa)=ㅗ+ㅏ, ㅝ(wo)=ㅜ+ㅓ, ㅙ(wae)=ㅗ+ㅐ, ㅞ(we)=ㅜ+ㅔ, ㅚ(oe)=ㅗ+ㅣ, ㅟ(wi)=ㅜ+ㅣ, ㅢ(ui) là trường hợp đặc biệt, đọc khác nhau tùy vị trí trong từ. Nhóm âm bắt đầu "w" tương đối dễ đoán nếu đã thuộc nguyên âm cơ bản. Sau tuần này, bạn hoàn thành đủ 21 nguyên âm của Hangul.', exercises:['Viết tay 7 nguyên âm đôi còn lại, mỗi âm 10 lần.','Học 5 từ ví dụ: 과일(hoa quả, ㅘ), 뭐(cái gì, ㅝ), 의사(bác sĩ, ㅢ), 위(trên, ㅟ), 왜(tại sao, ㅙ).','Viết lại toàn bộ 21 nguyên âm (10 cơ bản + 11 đôi) theo đúng thứ tự học, kiểm tra không sót âm nào.','Tự vẽ sơ đồ ghép nguyên âm đôi (ví dụ ㅗ+ㅏ=ㅘ) cho cả 7 âm để hiểu logic hình thành thay vì học thuộc máy móc.','Viết 1 câu đơn giản có chứa ít nhất 2 trong 7 nguyên âm đôi vừa học.']},
{label:'Thứ 4', title:'5 phụ âm căng (쌍자음): ㄲ, ㄸ, ㅃ, ㅆ, ㅉ', content:'Phụ âm căng viết bằng cách nhân đôi phụ âm thường tương ứng: ㄲ(từ ㄱ), ㄸ(từ ㄷ), ㅃ(từ ㅂ), ㅆ(từ ㅅ), ㅉ(từ ㅈ). Phát âm căng, dứt khoát, không có luồng hơi bật ra — giọng hơi "gằn" ở cổ họng. Đây là mức độ thứ 3 trong hệ thống 3 mức độ phụ âm (thường/bật hơi/căng), ví dụ đủ bộ 3: ㄱ(g nhẹ)/ㅋ(k bật hơi)/ㄲ(k căng).', exercises:['Viết tay 5 phụ âm căng, mỗi âm 15 lần.','Luyện phát âm căng bằng cách "gằn" nhẹ ở cổ họng, so sánh trực tiếp với phụ âm thường (가/까, 다/따, 바/빠, 사/싸, 자/짜).','Học 5 từ ví dụ dùng phụ âm căng: 까치(chim khách), 뿌리(rễ cây), 싸다(rẻ), 짜다(mặn), 떡(bánh gạo).','Ghi âm bạn đọc 5 cặp phụ âm thường/căng (가/까...), nghe lại và so sánh độ "gằn" giữa 2 âm.','Tìm thêm 2 từ khác có phụ âm căng ngoài 5 từ đã học, tra nghĩa và luyện đọc.']},
{label:'Thứ 5', title:'Luyện tổng hợp 3 mức độ phụ âm', content:'Ngày luyện tập trọng tâm nhất tuần — hệ thống hóa 5 bộ 3 mức độ: ㄱ/ㅋ/ㄲ, ㄷ/ㅌ/ㄸ, ㅂ/ㅍ/ㅃ, ㅅ/ㅆ, ㅈ/ㅊ/ㅉ. Luyện nghe phân biệt 3 mức độ này là kỹ năng khó nhất của giai đoạn học Hangul, nhưng cũng quan trọng nhất. Không nên nản nếu chưa phân biệt tốt — đây là kỹ năng cần luyện nghe liên tục nhiều tháng, không chỉ 1 tuần.', exercises:['Nghe 15 âm tiết ngẫu nhiên thuộc 3 mức độ khác nhau, viết lại chính xác âm nghe được, tự chấm điểm.','Luyện nói bộ 3: 가/카/까, đọc liên tiếp 10 lần để cảm nhận khác biệt.','Ghi âm giọng bạn đọc bộ 3 âm này, nghe lại và tự đánh giá độ rõ ràng.','Tự lập bảng đầy đủ 5 bộ 3 mức độ (thường/bật hơi/căng) ra giấy, dán ở nơi dễ thấy để ôn hàng ngày.','Thử đố 1 người khác đọc ngẫu nhiên 1 âm trong 3 mức độ, bạn đoán xem là mức nào.']},
{label:'Thứ 6', title:'Tổng kết tuần 3 — hoàn thành Hangul cơ bản', content:'Sau tuần này, bạn đã học đủ TOÀN BỘ bảng chữ cái Hangul: 21 nguyên âm và 19 phụ âm — cột mốc rất quan trọng, đánh dấu hoàn thành giai đoạn "học chữ". Từ tuần sau, trọng tâm chuyển sang quy tắc đọc nối âm và bắt đầu ngữ pháp thực sự. Đọc được chữ và HIỂU nghĩa là 2 việc khác nhau, hành trình phía trước vẫn còn dài.', exercises:['Không nhìn tài liệu, viết lại toàn bộ 21 nguyên âm và 19 phụ âm theo trí nhớ, đối chiếu và sửa lỗi.','Tổng ôn toàn bộ từ vựng đã học 3 tuần qua (khoảng 15-20 từ), đảm bảo đọc đúng và nhớ nghĩa.','Tự thưởng cho bản thân — đây là cột mốc lớn, hãy ăn mừng việc hoàn thành Hangul trước khi bước vào giai đoạn ngữ pháp.','Viết toàn bộ 21 nguyên âm + 19 phụ âm lên 1 tờ giấy duy nhất theo trí nhớ, đây sẽ là "chứng chỉ" tự trao cho bản thân.','Chia sẻ cột mốc hoàn thành Hangul với ai đó (bạn bè, gia đình) — chia sẻ mục tiêu giúp duy trì động lực học tiếp.'], quiz:[
{q:"Nguyên âm ㅐ đọc gần với âm nào?", opts:["ae","wa","wo","ui"], correct:0, explain:"ㅐ = ㅏ+ㅣ, đọc là \"ae\"."},
{q:"Nguyên âm ㅔ đọc gần với âm nào?", opts:["ae","e","oe","wi"], correct:1, explain:"ㅔ = ㅓ+ㅣ, đọc là \"e\" — khá giống ㅐ trong tiếng Hàn hiện đại."},
{q:"Nguyên âm ㅘ (ㅗ+ㅏ) đọc là gì?", opts:["wa","wo","wae","we"], correct:0, explain:"Ghép ㅗ+ㅏ tạo thành âm \"wa\"."},
{q:"Nguyên âm ㅝ (ㅜ+ㅓ) đọc là gì?", opts:["wa","wo","wi","ui"], correct:1, explain:"Ghép ㅜ+ㅓ tạo thành âm \"wo\"."},
{q:"Nguyên âm ㅟ (ㅜ+ㅣ) đọc là gì?", opts:["wa","wo","wi","we"], correct:2, explain:"Ghép ㅜ+ㅣ tạo thành âm \"wi\"."},
{q:"Phụ âm căng ㄲ là phiên bản căng của phụ âm nào?", opts:["ㄱ","ㄷ","ㅂ","ㅅ"], correct:0, explain:"ㄲ được viết bằng cách nhân đôi ㄱ."},
{q:"Phụ âm căng ㄸ là phiên bản căng của phụ âm nào?", opts:["ㄱ","ㄷ","ㅂ","ㅈ"], correct:1, explain:"ㄸ được viết bằng cách nhân đôi ㄷ."},
{q:"Phụ âm căng ㅃ là phiên bản căng của phụ âm nào?", opts:["ㅂ","ㄷ","ㅅ","ㅈ"], correct:0, explain:"ㅃ được viết bằng cách nhân đôi ㅂ."},
{q:"Phụ âm căng ㅆ là phiên bản căng của phụ âm nào?", opts:["ㅅ","ㅈ","ㄱ","ㄷ"], correct:0, explain:"ㅆ được viết bằng cách nhân đôi ㅅ."},
{q:"Phụ âm căng ㅉ là phiên bản căng của phụ âm nào?", opts:["ㅅ","ㅈ","ㅊ","ㄱ"], correct:1, explain:"ㅉ được viết bằng cách nhân đôi ㅈ."},
{q:"So với phụ âm thường, phụ âm căng phát âm như thế nào?", opts:["Nhẹ hơn, ít rõ hơn","Căng, dứt khoát, không có luồng hơi bật ra","Chỉ dùng trong văn viết","Không có sự khác biệt"], correct:1, explain:"Phụ âm căng phát âm căng và dứt khoát, khác hẳn phụ âm thường và phụ âm bật hơi."},
{q:"Âm tiết 까 (ㄲ+ㅏ) đọc là gì?", opts:["ga (nhẹ)","ka (bật hơi)","kka (căng)","na"], correct:2, explain:"ㄲ là phụ âm căng nên 까 đọc căng, dứt khoát, khác hẳn 가 (nhẹ) và 카 (bật hơi)."},
]},
]},
{title:"Quy tắc đọc nối âm & tổng kết Hangul", points:["Batchim là phụ âm cuối của âm tiết, ảnh hưởng đến cách đọc nối với âm tiết tiếp theo.","Quy tắc nối âm (연음): khi âm tiết có batchim đứng trước âm tiết bắt đầu bằng ㅇ, batchim đó được đọc nối sang âm tiết sau.","Một số batchim có cách đọc đại diện khác với chữ viết khi đứng riêng.","Luyện đọc từ có batchim kép (2 phụ âm cuối) như 없다, 닭 — chỉ 1 trong 2 phụ âm được phát âm tùy trường hợp.","Nắm vững quy tắc đọc nối âm là nền tảng để nghe hiểu tiếng Hàn tự nhiên, vì người bản xứ luôn nói nối âm."], practice:"Luyện đọc to 15 từ tiếng Hàn có batchim đơn giản, ghi âm lại giọng đọc của mình để tự nghe lại.", case:"Đây là bước chuyển quan trọng từ \"biết mặt chữ\" sang \"đọc được tiếng Hàn thật\" — nhiều người bỏ qua bước này nên nghe/nói rất khó khăn về sau.", task:"Tự đọc to được đoạn văn tiếng Hàn ngắn (3-4 câu, có phiên âm hỗ trợ) không vấp, đúng quy tắc nối âm cơ bản.", days:[
{label:'Thứ 2', title:'Batchim cơ bản & cách đọc đại diện', content:'Batchim là phụ âm đứng ở vị trí CUỐI âm tiết (ví dụ ㄴ trong 한). Dù có 19 phụ âm có thể làm batchim, khi phát âm CUỐI âm tiết (đứng riêng), chúng chỉ đại diện cho 7 âm: ㄱ,ㄴ,ㄷ,ㄹ,ㅁ,ㅂ,ㅇ. Ví dụ: ㄷ,ㅌ,ㅅ,ㅆ,ㅈ,ㅊ,ㅎ khi làm batchim đều đọc đại diện thành âm "ㄷ". Quy tắc này giúp việc PHÁT ÂM đơn giản hơn nhiều so với phải nhớ 19 cách đọc khác nhau.', exercises:['Học bảng quy tắc 7 âm đại diện cho batchim.','Luyện đọc 10 từ có batchim đơn giản: 책(sách), 밥(cơm), 산(núi), 문(cửa), 강(sông)...','Viết ra 5 từ mới có batchim, tự đọc và kiểm tra lại với quy tắc đại diện.','Viết 5 từ mới có batchim khác với 10 từ đã học ở bài học, tra nghĩa và luyện đọc theo quy tắc đại diện.','Tự kiểm tra: với mỗi batchim trong 19 phụ âm, nói xem nó thuộc nhóm đại diện nào trong 7 âm cuối.']},
{label:'Thứ 3', title:'Quy tắc nối âm (연음) — phần quan trọng nhất', content:'Khi 1 âm tiết có batchim đứng NGAY TRƯỚC 1 âm tiết bắt đầu bằng ㅇ, batchim đó được đọc NỐI sang làm phụ âm đầu âm tiết sau. Ví dụ: 한국어 không đọc rời "han-guk-eo" mà đọc nối "han-gu-geo". Đây LÀ QUY TẮC QUAN TRỌNG NHẤT để nghe hiểu tiếng Hàn tự nhiên — người bản xứ luôn nói nối âm. Không nắm quy tắc này sẽ khiến bạn nghe không kịp dù đã học đủ từ vựng.', exercises:['Học và luyện đọc 8 ví dụ nối âm: 한국어, 직업(nghề nghiệp), 음악(âm nhạc), 발음(phát âm), 연습(luyện tập), 웃어요(cười), 먹어요(ăn), 있어요(có).','Viết cách đọc phiên âm cho 5 từ nối âm khác bạn tự tìm được.','Nghe 1 đoạn hội thoại tiếng Hàn ngắn và cố gắng nhận ra ít nhất 2-3 chỗ có nối âm.','Tự tìm thêm 3 ví dụ nối âm mới trong tài liệu tiếng Hàn bất kỳ bạn có, luyện đọc đúng quy tắc.','Thử đọc chậm rồi đọc nhanh dần 8 ví dụ nối âm đã học, cảm nhận sự khác biệt khi đọc tự nhiên hơn.']},
{label:'Thứ 4', title:'Batchim kép & trường hợp đặc biệt', content:'Một số âm tiết có 2 phụ âm cuối cùng lúc (겹받침), ví dụ 없다(không có), 닭(gà), 앉다(ngồi) — chỉ 1 trong 2 phụ âm được phát âm. Quy tắc chung: nếu âm tiết sau bắt đầu bằng nguyên âm, cả 2 phụ âm đều đọc nối; nếu không, chỉ 1 phụ âm đọc theo quy tắc riêng. Đây là phần khó và nhiều ngoại lệ nhất — chỉ cần nhận biết SỰ TỒN TẠI của hiện tượng này, chưa cần thành thạo hoàn toàn.', exercises:['Học cách đọc 5 từ có batchim kép: 없다, 있다(ôn lại), 앉다, 많다(nhiều), 닭.','Nghe audio phát âm chuẩn 5 từ này, so sánh với cách bạn tự đoán đọc.','Ghi chú lại đây là điểm sẽ tiếp tục học sâu hơn trong các tháng tới, không cần lo lắng.','Nghe lại 5 từ batchim kép nhiều lần, tự ghi chú cách đọc bằng phiên âm của riêng bạn để dễ nhớ.','Không cần lo lắng nếu chưa nhớ hết — thử liệt kê lại những gì bạn NHỚ ĐƯỢC về batchim kép sau bài học.']},
{label:'Thứ 5', title:'Luyện đọc đoạn văn ngắn hoàn chỉnh', content:'Bài kiểm tra tổng hợp 4 tuần: đọc 1 đoạn văn ngắn (3-5 câu) kết hợp đầy đủ nguyên âm, phụ âm, batchim, quy tắc nối âm. Mục tiêu là ĐỌC ĐÚNG ÂM, đúng nhịp điệu, chưa cần hiểu 100% nghĩa. Đọc to (không đọc thầm) là phương pháp luyện phát âm hiệu quả nhất — cơ miệng cần "luyện tập" như luyện thể chất. Ghi âm lại giọng đọc và nghe lại là cách tốt để tự phát hiện lỗi.', exercises:['Tìm 1 đoạn văn tiếng Hàn ngắn có phiên âm/dịch hỗ trợ, đọc to 5 lần.','Ghi âm lần đọc thứ 5, nghe lại và tự đánh giá những chỗ còn vấp hoặc sai quy tắc nối âm.','So sánh giọng đọc của bạn với audio mẫu (nếu có), ghi chú 3 điểm cần cải thiện nhất.','Thử đọc đoạn văn đó cho 1 người khác nghe (kể cả người không biết tiếng Hàn), tập trung vào sự tự tin khi đọc to.','Chọn 1 đoạn văn KHÁC (ngắn hơn) và thử áp dụng lại quy trình luyện đọc tương tự.']},
{label:'Thứ 6', title:'Tổng kết tháng 1 — sẵn sàng cho ngữ pháp', content:'Chúc mừng bạn đã hoàn thành tháng đầu tiên — cột mốc khó nhất về tâm lý (bảng chữ cái hoàn toàn mới) đã qua. Từ tháng 2, bạn bắt đầu học ngữ pháp thực sự: trợ từ, cách chia động từ, các thì — lúc tiếng Hàn "trở nên có nghĩa" thay vì chỉ là âm thanh ghép lại. Duy trì ôn lại Hangul định kỳ (5-10 phút/ngày) vài tuần tới để tránh quên khi chuyển sang tập trung ngữ pháp mới.', exercises:['Làm bài tự kiểm tra tổng hợp: viết + đọc toàn bộ 21 nguyên âm, 19 phụ âm, giải thích được quy tắc nối âm bằng lời của bạn.','Ôn lại toàn bộ từ vựng đã học tháng 1 (khoảng 30-35 từ qua các tuần), đảm bảo nhớ nghĩa.','Viết 1 đoạn nhật ký ngắn tổng kết cảm nhận sau tháng đầu học tiếng Hàn — điều gì thú vị nhất, điều gì khó nhất.','Viết ra lộ trình bạn hình dung cho tháng 2 dựa trên những gì đã biết (ngữ pháp cơ bản sắp học).','Tự thưởng cho bản thân bằng cách nào đó (đơn giản như nghe 1 bài nhạc Hàn Quốc) để ăn mừng hoàn thành tháng đầu.'], quiz:[
{q:"Batchim là gì?", opts:["Nguyên âm đầu âm tiết","Phụ âm đứng ở CUỐI âm tiết","Dấu câu","Từ nối"], correct:1, explain:"Batchim (받침) là phụ âm cuối cùng của 1 âm tiết, ví dụ ㄴ trong 한."},
{q:"Có tối đa bao nhiêu âm ĐẠI DIỆN khi phát âm batchim đứng riêng?", opts:["3","5","7","19"], correct:2, explain:"Dù có 19 phụ âm làm batchim được, khi đọc riêng chúng chỉ đại diện cho 7 âm: ㄱ,ㄴ,ㄷ,ㄹ,ㅁ,ㅂ,ㅇ."},
{q:"Batchim ㄷ, ㅌ, ㅅ, ㅆ, ㅈ, ㅊ, ㅎ khi đứng riêng đều đọc đại diện thành âm nào?", opts:["ㄱ","ㄴ","ㄷ","ㄹ"], correct:2, explain:"Cả nhóm phụ âm này khi làm batchim đều đọc đại diện thành âm \"ㄷ\"."},
{q:"Quy tắc nối âm (연음) xảy ra khi nào?", opts:["Âm tiết có batchim đứng trước âm tiết bắt đầu bằng ㅇ","Luôn luôn xảy ra bất kể trường hợp nào","Chỉ xảy ra với nguyên âm đôi","Không bao giờ xảy ra"], correct:0, explain:"Khi batchim đứng ngay trước 1 âm tiết bắt đầu bằng ㅇ (phụ âm câm), batchim đó được đọc nối sang."},
{q:"Từ 한국어 khi đọc nối âm sẽ nghe gần giống cách đọc nào?", opts:["han-guk-eo (đọc rời)","han-gu-geo (đọc nối)","ha-guk-o","han-gu-go"], correct:1, explain:"Batchim ㄱ của 국 được đọc nối sang làm phụ âm đầu của 어, tạo thành \"gu-geo\"."},
{q:"Batchim kép (겹받침) nghĩa là gì?", opts:["Có 2 nguyên âm trong âm tiết","Có 2 phụ âm cuối cùng lúc trong 1 âm tiết","Không có batchim","Có 2 âm tiết ghép lại"], correct:1, explain:"Batchim kép là khi 1 âm tiết có 2 phụ âm cuối, ví dụ 없다, 닭."},
{q:"Với từ 없다 (không có), thường mấy phụ âm trong batchim kép được phát âm?", opts:["Cả 2","1 trong 2","Không phụ âm nào","Tùy người nói tự do"], correct:1, explain:"Với batchim kép, thường chỉ 1 trong 2 phụ âm được phát âm theo quy tắc riêng của từng trường hợp."},
{q:"Vì sao quy tắc nối âm quan trọng khi luyện NGHE tiếng Hàn?", opts:["Không quan trọng lắm","Vì người bản xứ luôn nói nối âm tự nhiên, không đọc tách rời","Chỉ quan trọng khi viết văn bản","Chỉ dùng trong bài hát"], correct:1, explain:"Nếu không nắm quy tắc nối âm, người học sẽ nghe không kịp dù đã biết đủ từ vựng, vì âm thực tế khác cách đọc tách rời."},
{q:"Từ 사람 (người) — âm tiết nào KHÔNG có batchim?", opts:["사","람","Cả 2 đều không có","Cả 2 đều có"], correct:0, explain:"사 không có phụ âm cuối; 람 có batchim ㅁ."},
{q:"Đọc nối âm khác gì so với đọc tách rời từng âm tiết?", opts:["Không khác gì cả","Đọc nối âm tự nhiên và trôi chảy hơn, âm cuối \"chảy\" sang âm tiết sau","Đọc nối âm luôn chậm hơn","Chỉ dùng khi hát"], correct:1, explain:"Đọc nối âm là cách phát âm tự nhiên thật sự của người bản xứ, khác hẳn cách đọc tách rời từng âm tiết của người mới học."},
{q:"Sau khi hoàn thành Hangul (Tháng 1), bước tiếp theo trong lộ trình là gì?", opts:["Học ngay TOPIK 6","Học ngữ pháp sơ cấp và trợ từ cơ bản","Ngừng học tiếng Hàn","Học chữ Hán trước"], correct:1, explain:"Tháng 2 sẽ chuyển sang trợ từ cơ bản (은/는, 이/가...) và 2 thể lịch sự đầu tiên."},
{q:"Tại sao nên luyện đọc TO thay vì chỉ đọc thầm khi học Hangul?", opts:["Không có sự khác biệt","Cơ miệng cần luyện tập thực tế để phát âm chuẩn, giống luyện tập thể chất","Đọc thầm nhanh hơn nên luôn tốt hơn","Đọc to gây ồn nên nên tránh"], correct:1, explain:"Phát âm là kỹ năng vận động cơ miệng, cần luyện tập thực tế bằng cách đọc to, không chỉ đọc trong đầu."},
]},
]},
{title:"Đại từ nhân xưng & câu chào hỏi cơ bản", points:["저 (jeo) là \"tôi\" thể trang trọng/khiêm nhường, 나 (na) là \"tôi\" thể thân mật — người mới nên dùng 저 trong hầu hết tình huống.","이것/그것/저것 (cái này/cái đó/cái kia) là hệ thống chỉ định theo khoảng cách, có 3 cấp thay vì 2 như tiếng Việt.","안녕하세요 (xin chào, thể trang trọng lịch sự) là câu chào phổ biến nhất, dùng được trong hầu hết tình huống giao tiếp hàng ngày.","감사합니다/고맙습니다 đều nghĩa \"cảm ơn\", 감사합니다 trang trọng hơn một chút, dùng phổ biến trong môi trường công việc.","Tiếng Hàn có hệ thống kính ngữ phức tạp theo tuổi tác/địa vị — người mới nên bắt đầu học và dùng thể trang trọng trước."], practice:"Học thuộc 10 câu giao tiếp cơ bản (chào hỏi, cảm ơn, xin lỗi, tạm biệt), luyện nói to từng câu 5 lần.", case:"Người Hàn Quốc coi trọng việc dùng đúng kính ngữ theo tuổi tác — bắt đầu bằng thể trang trọng luôn là lựa chọn an toàn khi giao tiếp với người lạ.", task:"Tự giới thiệu bản thân bằng tiếng Hàn (tên, quốc tịch, nghề nghiệp) trong 3-4 câu, dùng thể trang trọng đã học."},
{title:"Trợ từ cơ bản (조사) — 은/는, 이/가, 을/를", points:["은/는 là trợ từ chủ đề, dùng để nhấn mạnh hoặc giới thiệu chủ đề của câu — 은 đi sau phụ âm, 는 đi sau nguyên âm.","이/가 là trợ từ chủ ngữ, thường dùng khi giới thiệu thông tin mới hoặc nhấn mạnh chủ thể hành động.","Phân biệt 은/는 và 이/가 là 1 trong những điểm ngữ pháp khó nhất cho người mới, vì tiếng Việt không có khái niệm tương đương rõ ràng.","을/를 là trợ từ tân ngữ, đánh dấu đối tượng chịu tác động của động từ — 을 đi sau phụ âm, 를 đi sau nguyên âm.","Trợ từ trong tiếng Hàn gắn liền vào sau danh từ, quyết định vai trò ngữ pháp — khác hẳn tiếng Việt dựa vào trật tự từ."], practice:"Viết 10 câu đơn giản (chủ ngữ - tân ngữ - động từ) áp dụng đúng trợ từ 은/는, 이/가, 을/를 tùy ngữ cảnh.", case:"Trợ từ là đặc điểm ngữ pháp cốt lõi phân biệt tiếng Hàn với tiếng Việt — nắm vững trợ từ là nền tảng bắt buộc trước khi học ngữ pháp phức tạp hơn.", task:"Tìm 5 câu tiếng Hàn đơn giản (từ sách/app học tiếng Hàn), xác định và giải thích tại sao mỗi trợ từ được dùng như vậy."},
{title:"Động từ/tính từ thể 습니다/ㅂ니다 (thể trang trọng)", points:["Thể 습니다/ㅂ니다 là dạng chia trang trọng nhất, dùng trong tình huống công việc, thuyết trình, tin tức.","Quy tắc chia: động từ có batchim + 습니다; động từ không có batchim + ㅂ니다.","Ví dụ: 먹다 (ăn) → 먹습니다; 가다 (đi) → 갑니다.","Dạng câu hỏi thay 다 bằng 까: 습니까?/ㅂ니까?","Đây là 1 trong 2 thể trang trọng chính của tiếng Hàn (cùng với 해요체 sẽ học sau) — TOPIK 1 yêu cầu thành thạo cả 2 thể này."], practice:"Chia 15 động từ/tính từ cơ bản sang thể 습니다/ㅂ니다, cả câu khẳng định và câu hỏi.", case:"Thể 습니다 xuất hiện rất nhiều trong tin tức, bản tin thời tiết tiếng Hàn — nghe được thể này giúp bạn tiếp cận nguồn tài liệu nghe thực tế ngay từ trình độ sơ cấp.", task:"Viết 1 đoạn giới thiệu ngắn (5 câu) về công việc/sở thích của bạn, toàn bộ động từ chia ở thể 습니다/ㅂ니다."},
{title:"Động từ/tính từ thể 해요 & tổng kết tháng 2", points:["Thể 해요 là thể lịch sự nhưng thân mật hơn 습니다, dùng phổ biến nhất trong giao tiếp hàng ngày.","Quy tắc chia dựa vào nguyên âm cuối của gốc động từ (ㅏ/ㅗ thêm 아요, các nguyên âm khác thêm 어요, một số trường hợp bất quy tắc).","Ví dụ: 가다 → 가요; 먹다 → 먹어요; 하다 → 해요 (bất quy tắc phổ biến nhất).","Trong hội thoại thực tế, người Hàn dùng 해요체 nhiều hơn 습니다체.","Cả 2 thể đều là thể lịch sự, khác với thể suồng sã (반말) dùng với bạn bè thân — TOPIK 1-2 tập trung vào 2 thể lịch sự trước."], practice:"Chia lại 15 động từ/tính từ đã học ở tuần 7 sang thể 해요, so sánh sắc thái với thể 습니다.", case:"Thể 해요 là thể bạn sẽ nghe nhiều nhất khi xem phim/nghe nhạc Hàn Quốc — luyện thành thạo giúp bạn hiểu phần lớn hội thoại đời thường.", task:"Viết lại đoạn giới thiệu bản thân đã viết ở tuần 7, chuyển toàn bộ sang thể 해요, cảm nhận sự khác biệt sắc thái."},
{title:"Thì quá khứ (았/었어요, 았/었습니다)", points:["Thì quá khứ tạo bằng cách chèn 았/었 vào trước đuôi câu, quy tắc chọn tương tự cách chọn 아요/어요.","Ví dụ: 가다 → 갔어요 (đã đi); 먹다 → 먹었어요 (đã ăn); 하다 → 했어요 (đã làm).","Với thể 습니다, quá khứ trở thành 았/었습니다 — ví dụ 갔습니다, 먹었습니다.","Trạng từ chỉ thời gian quá khứ thường đi kèm: 어제 (hôm qua), 지난주 (tuần trước), 작년 (năm ngoái).","Luyện kết hợp thì quá khứ với cả 2 thể lịch sự đã học để linh hoạt trong nhiều ngữ cảnh."], practice:"Viết 10 câu kể lại việc bạn đã làm hôm qua, dùng đúng thì quá khứ ở cả 2 thể lịch sự.", case:"Kể chuyện quá khứ là kỹ năng giao tiếp cơ bản nhất — chủ đề này gần như chắc chắn xuất hiện trong phần thi nói/viết TOPIK dù ở cấp độ nào.", task:"Viết 1 đoạn nhật ký ngắn (5-6 câu) kể lại 1 ngày cụ thể trong tuần, toàn bộ dùng thì quá khứ."},
{title:"Thì tương lai/dự định & liên từ cơ bản", points:["을/ㄹ 거예요 diễn tả dự định hoặc dự đoán trong tương lai — 을 거예요 sau gốc có batchim, ㄹ 거예요 sau gốc không batchim.","Ví dụ: 가다 → 갈 거예요 (sẽ đi); 먹다 → 먹을 거예요 (sẽ ăn).","그리고 (và) nối 2 câu/cụm từ liên tiếp; 그런데/하지만 (nhưng) diễn tả tương phản; 그래서 (vì vậy) diễn tả kết quả.","Liên từ trong tiếng Hàn thường đứng đầu câu sau, nối 2 câu hoàn chỉnh riêng biệt.","Kết hợp thì tương lai với liên từ giúp diễn đạt kế hoạch phức tạp hơn."], practice:"Viết 10 câu về kế hoạch cuối tuần của bạn, dùng thì tương lai kết hợp ít nhất 3 liên từ đã học.", case:"Diễn đạt kế hoạch tương lai kết hợp liên từ là nội dung thường gặp trong đề thi TOPIK 1 phần viết.", task:"Viết đoạn văn 5-6 câu mô tả kế hoạch của bạn cho tháng tới, dùng cả thì quá khứ và thì tương lai."},
{title:"Từ vựng chủ đề gia đình & số đếm", points:["Tiếng Hàn có 2 hệ thống số đếm song song: số Hán-Hàn (일, 이, 삼...) dùng cho tiền, ngày tháng; số thuần Hàn (하나, 둘, 셋...) dùng để đếm đồ vật, tuổi.","Từ vựng gia đình có 2 cách gọi khác nhau tùy người nói là con trai hay con gái.","Đơn vị đếm đi kèm số thuần Hàn khi đếm đồ vật — ví dụ 사람 (người), 개 (cái), 마리 (con vật).","Tuổi tác trong văn hóa Hàn Quốc rất quan trọng để xác định cách xưng hô.","Ghi nhớ 2 hệ thống số song song là điểm gây nhầm lẫn phổ biến nhất cho người mới học."], practice:"Học thuộc số đếm Hán-Hàn và thuần Hàn từ 1-20, luyện đếm đồ vật xung quanh bằng số thuần Hàn kèm đơn vị đếm phù hợp.", case:"Nhầm lẫn giữa 2 hệ thống số là lỗi rất phổ biến — ví dụ nói tuổi phải dùng số thuần Hàn (스무 살 = 20 tuổi) chứ không phải số Hán-Hàn.", task:"Viết 1 đoạn giới thiệu về gia đình bạn (bao nhiêu người, mỗi người bao nhiêu tuổi), dùng đúng hệ thống số phù hợp."},
{title:"Ôn tập ngữ pháp TOPIK 1 & làm đề thử", points:["TOPIK 1 gồm Nghe (30 câu, 40 phút) và Đọc (40 câu, 60 phút), tổng 200 điểm, chia Cấp 1 (80-139) và Cấp 2 (140-200).","Từ vựng TOPIK 1 tập trung chủ đề sinh hoạt hàng ngày: gia đình, thời gian, mua sắm, ăn uống, giao thông cơ bản.","Ngữ pháp trọng tâm đã học: trợ từ cơ bản, 2 thể lịch sự, các thì, liên từ cơ bản — nền tảng đủ để làm quen đề thi TOPIK 1.","Chiến thuật Đọc: đọc câu hỏi trước, gạch chân từ khóa, tìm thông tin tương ứng trong đoạn văn.","Chiến thuật Nghe: đọc trước đáp án khi có thể, chú ý từ khóa đầu câu hỏi trước khi nghe audio."], practice:"Làm 1 đề thi thử TOPIK 1, chấm điểm và xác định cấp độ hiện tại.", case:"Hoàn thành 3 tháng đầu với nền tảng Hangul vững và ngữ pháp sơ cấp là cột mốc quan trọng — nền tảng để tháng 4 học sâu hơn.", task:"Lập danh sách 15 từ vựng/ngữ pháp bạn còn yếu nhất qua đề thử, dành tuần đầu tháng 4 để ôn lại."},
{title:"Bổ ngữ 고 싶다 (muốn), 을/ㄹ 수 있다/없다 (có thể/không thể)", points:["고 싶다 (muốn làm gì) gắn trực tiếp vào gốc động từ — ví dụ 먹고 싶어요 (muốn ăn).","을/ㄹ 수 있다 diễn tả khả năng làm được việc gì; 을/ㄹ 수 없다 diễn tả không thể làm được.","Ví dụ: 한국어를 할 수 있어요 (tôi có thể nói tiếng Hàn); 오늘 갈 수 없어요 (hôm nay tôi không thể đi).","고 싶다 chỉ dùng được với động từ, còn 을/ㄹ 수 있다/없다 diễn tả khả năng khách quan.","Đây là 2 cấu trúc cực kỳ thông dụng trong giao tiếp hàng ngày, xuất hiện sớm trong hầu hết giáo trình TOPIK 2."], practice:"Viết 10 câu diễn tả mong muốn (고 싶다) và khả năng (을/ㄹ 수 있다/없다) liên quan sở thích cá nhân của bạn.", case:"2 cấu trúc này thường xuất hiện cùng nhau trong hội thoại thực tế, ví dụ khi nói về ước mơ, dự định du học.", task:"Viết đoạn văn ngắn (5 câu) về 1 ước mơ hoặc mục tiêu của bạn, dùng cả 고 싶다 và 을/ㄹ 수 있다."},
{title:"Bổ ngữ 아/어야 되다 (phải làm gì), 지 말다 (đừng làm gì)", points:["아/어야 되다/하다 diễn tả nghĩa vụ \"phải làm\" — quy tắc chọn 아/어 giống thì quá khứ đã học.","Ví dụ: 공부해야 돼요 (phải học bài); 가야 해요 (phải đi).","지 마세요 diễn tả \"đừng làm gì\", dùng để khuyên/yêu cầu ai đó không làm việc gì.","Ví dụ: 걱정하지 마세요 (đừng lo lắng); 늦지 마세요 (đừng đến muộn).","Đây là các cấu trúc diễn tả nghĩa vụ và lời khuyên/cấm đoán — rất hữu ích trong giao tiếp công sở và đời sống hàng ngày."], practice:"Viết 10 câu (5 câu nghĩa vụ với 아/어야 되다, 5 câu khuyên nhủ với 지 마세요) liên quan tình huống công việc/học tập.", case:"Cấu trúc này xuất hiện rất nhiều trong bảng chỉ dẫn, quy định nơi công cộng ở Hàn Quốc — nhận biết được giúp ích khi thực tế đến Hàn Quốc.", task:"Viết 1 bảng \"nội quy\" hài hước cho phòng của bạn (5 câu) dùng cả 2 cấu trúc đã học."},
{title:"Định ngữ (관형사형) — tính từ/động từ bổ nghĩa danh từ", points:["Định ngữ biến động từ/tính từ thành dạng bổ nghĩa trực tiếp cho danh từ đứng sau, giống \"cái... mà\" trong tiếng Việt.","Tính từ + ㄴ/은 + danh từ (ví dụ 예쁜 사람 = người đẹp); động từ hiện tại + 는 + danh từ (ví dụ 먹는 사람 = người đang ăn).","Động từ quá khứ + ㄴ/은 + danh từ; động từ tương lai + ㄹ/을 + danh từ.","Đây là 1 trong những điểm ngữ pháp phức tạp nhất ở trình độ TOPIK 2 vì có nhiều dạng biến đổi tùy thì và loại từ.","Thành thạo định ngữ giúp câu văn tự nhiên và phong phú hơn nhiều, thay vì chỉ dùng câu đơn giản."], practice:"Viết 10 cụm danh từ có định ngữ (ví dụ \"cuốn sách tôi đang đọc\") bằng tiếng Hàn.", case:"Định ngữ là ranh giới rõ rệt giữa trình độ sơ cấp và trung cấp — thành thạo cấu trúc này là dấu hiệu bạn đã sẵn sàng cho TOPIK 2.", task:"Viết 1 đoạn văn ngắn (4-5 câu) mô tả về 1 người bạn thân, dùng ít nhất 3 cụm định ngữ khác nhau (hiện tại, quá khứ, tương lai)."},
{title:"Ôn tập tháng 4 & làm đề thử TOPIK 2 sơ bộ", points:["TOPIK 2 gồm 3 kỹ năng: Nghe, Đọc, Viết, độ khó tăng đáng kể so với TOPIK 1, chia 4 cấp (Cấp 3-6).","Từ vựng TOPIK 2 mở rộng sang chủ đề trừu tượng hơn: cảm xúc, quan điểm, xã hội, công việc.","Phần Viết ở TOPIK 2 yêu cầu viết đoạn văn hoàn chỉnh có cấu trúc, khác hẳn TOPIK 1 chỉ có trắc nghiệm.","Ôn lại toàn bộ ngữ pháp 4 tháng qua: trợ từ, 2 thể lịch sự, các thì, định ngữ, các cấu trúc nghĩa vụ/mong muốn/khả năng.","Từ đây trở đi, lộ trình sẽ tiếp tục đi sâu vào TOPIK 2 (Cấp 3-4) rồi tiến dần lên TOPIK 3-6 với ngữ pháp và từ vựng phức tạp hơn."], practice:"Làm thử 1 phần đề TOPIK 2 (Đọc hoặc Nghe cấp độ dễ) để làm quen định dạng, không cần áp lực điểm số.", case:"Hoàn thành 4 tháng đầu (Hangul + toàn bộ ngữ pháp sơ cấp) là nền tảng quan trọng nhất trong hành trình học tiếng Hàn — từ đây tốc độ học phụ thuộc nhiều vào luyện tập đều đặn hàng ngày.", task:"Viết 1 đoạn nhật ký tổng kết 4 tháng học tiếng Hàn của bạn — bạn tự tin nhất ở điểm nào, còn yếu ở điểm nào."},

const algoDayTheory = {
  '0-0': {title:'Duyệt mảng cơ bản & phép tổng hợp', text:'Hầu hết bài toán xử lý mảng đơn giản đều dựa trên 1 pattern chung: khởi tạo 1 biến "tích lũy" (accumulator), duyệt qua từng phần tử bằng vòng lặp for hoặc phương thức reduce(), rồi cập nhật biến tích lũy theo quy tắc của bài toán (cộng dồn để tính tổng, so sánh để tìm max/min, đếm để đếm số lượng thỏa điều kiện). Độ phức tạp của các bài này luôn là O(n) vì chỉ cần duyệt mảng đúng 1 lần. Khi quen với pattern này, bạn sẽ nhận ra rất nhiều bài toán "nhìn có vẻ khác nhau" thực chất chỉ là biến thể của cùng 1 kỹ thuật duyệt-và-tích-lũy — đây là nền tảng bắt buộc trước khi học các kỹ thuật nâng cao hơn như two-pointer hay sliding window.'},
  '0-1': {title:'Xử lý chuỗi cơ bản', text:'Chuỗi (string) trong JavaScript là kiểu dữ liệu bất biến (immutable) — không thể sửa trực tiếp từng ký tự, nên cách xử lý phổ biến là: tách chuỗi thành mảng ký tự hoặc mảng từ (split), biến đổi mảng đó, rồi ghép lại thành chuỗi mới (join). Các phương thức cần thành thạo: split(), join(), trim(), replace(), toLowerCase()/toUpperCase(), và charAt()/[index] để truy cập từng ký tự. Khi so sánh 2 chuỗi có "cùng thành phần nhưng khác thứ tự" (như kiểm tra anagram), kỹ thuật chuẩn là chuẩn hóa cả 2 chuỗi về cùng 1 dạng (ví dụ sắp xếp ký tự) rồi so sánh trực tiếp — kỹ thuật "chuẩn hóa rồi so sánh" này sẽ còn quay lại rất nhiều lần trong các bài sau.'},
  '0-2': {title:'Set, kiểm tra điều kiện & thao tác tại chỗ', text:'Set là cấu trúc dữ liệu đặc biệt trong JavaScript chỉ lưu các giá trị DUY NHẤT — viết new Set(array) rồi chuyển lại thành mảng bằng [...set] là cách nhanh nhất để loại bỏ trùng lặp, độ phức tạp O(n). Với các bài toán "kiểm tra điều kiện" (ví dụ mảng đã sắp xếp chưa), nguyên tắc chung là duyệt và so sánh phần tử hiện tại với phần tử liền trước, trả về false NGAY khi phát hiện vi phạm thay vì duyệt hết mảng — gọi là "early return", giúp code hiệu quả hơn khi có thể thoát sớm. Kỹ thuật two-pointer (đã học tháng trước) cũng áp dụng được cho việc đảo ngược mảng tại chỗ.'},
  '0-3': {title:'Ôn tập tổng hợp Tuần 1', text:'Ngày ôn tập kết hợp cả 3 nhóm kỹ thuật đã học trong tuần: xử lý chuỗi (đếm từ, tìm từ dài nhất), HashMap để tối ưu tìm kiếm (Two Sum), và thuật toán sắp xếp cơ bản (Bubble Sort). Việc luyện tập xen kẽ nhiều dạng bài khác nhau trong 1 buổi — thay vì làm liên tiếp các bài cùng dạng — là phương pháp học hiệu quả đã được chứng minh trong khoa học nhận thức, gọi là "interleaving practice". Nó giúp não bộ thực sự phân biệt được KHI NÀO nên dùng kỹ thuật nào, thay vì chỉ áp dụng máy móc kỹ thuật vừa học ngay trước đó.'},
  '0-4': {title:'Binary Search, Stack & thao tác tập hợp', text:'Ngày khó nhất tuần, giới thiệu 2 kỹ thuật quan trọng: Binary Search (tìm kiếm trên mảng đã sắp xếp bằng cách chia đôi phạm vi tìm kiếm liên tục, độ phức tạp O(log n) thay vì O(n)) và Stack (cấu trúc dữ liệu "vào sau ra trước", dùng để kiểm tra tính hợp lệ của cặp ngoặc lồng nhau). Các bài toán "tập hợp" (giao, hiệu của 2 mảng) tận dụng Set để tra cứu nhanh O(1) thay vì so sánh từng cặp phần tử O(n²). Nắm vững cả 3 kỹ thuật này trong 1 buổi giúp bạn có đủ "vũ khí" để giải quyết phần lớn bài toán mảng/chuỗi cơ bản.'},
  '1-0': {title:'Vòng lặp lồng nhau & đệ quy cơ bản', text:'Selection Sort và Insertion Sort đều có độ phức tạp O(n²) do dùng 2 vòng lặp lồng nhau, nhưng tư duy khác nhau: Selection Sort "chọn phần tử nhỏ nhất rồi đặt đúng chỗ", còn Insertion Sort "chèn từng phần tử vào đúng vị trí trong phần đã sắp xếp" (giống cách sắp bài trên tay khi chơi bài). Đệ quy là kỹ thuật hàm tự gọi lại chính nó với input nhỏ hơn — MỌI hàm đệ quy đều cần 1 "điều kiện dừng" (base case) rõ ràng, nếu không sẽ gây lỗi tràn stack. Bài tính lũy thừa đệ quy là ví dụ đơn giản nhất để làm quen tư duy này.'},
  '1-1': {title:'Luyện tư duy đệ quy', text:'Ngày tập trung hoàn toàn vào đệ quy để xây dựng phản xạ. Công thức tư duy chung khi viết hàm đệ quy: (1) Xác định điều kiện dừng — trường hợp đơn giản nhất không cần đệ quy tiếp; (2) Xác định "bước đệ quy" — làm sao bài toán lớn quy về bài toán nhỏ hơn; (3) Tin tưởng rằng lời gọi đệ quy nhỏ hơn sẽ hoạt động đúng, không cần hình dung toàn bộ chuỗi gọi. Ba bài đầu (tổng, đếm ngược, giai thừa) đều có cấu trúc gần giống nhau, chỉ khác phép toán ở bước kết hợp kết quả — nhận ra điểm chung này giúp đệ quy bớt "đáng sợ" hơn nhiều.'},
  '1-2': {title:'Tách chữ số & lọc theo điều kiện', text:'Nhóm bài "tách chữ số" dùng chung 1 kỹ thuật: chuyển số thành chuỗi bằng String(n) để dễ duyệt từng ký tự, hoặc dùng phép toán %10 (lấy chữ số cuối) và /10 (bỏ chữ số cuối) nếu muốn xử lý thuần số học không qua chuỗi. Với bài lọc số chẵn/lẻ, phương thức filter() kết hợp reduce() tạo thành 1 "pipeline" xử lý dữ liệu rất phổ biến trong JavaScript hiện đại: lọc trước (filter) rồi tổng hợp sau (reduce), thay vì viết 1 vòng lặp for dài với nhiều điều kiện if lồng nhau.'},
  '1-3': {title:'Biến thể sắp xếp & merge', text:'Ngày này cho thấy cùng 1 thuật toán cơ bản (Bubble Sort, merge mảng) có thể biến đổi linh hoạt theo yêu cầu khác nhau chỉ bằng cách đổi điều kiện so sánh hoặc thêm bước xử lý phụ. Kỹ thuật "merge" 2 mảng đã sắp xếp (dùng 2 con trỏ duyệt song song) là bước lõi của thuật toán Merge Sort nổi tiếng — hiểu vững bước này là nền tảng để học Merge Sort đầy đủ sau này. Với bài trung vị và phần tử lớn thứ K, cách đơn giản nhất luôn là "sắp xếp trước rồi lấy vị trí cần thiết" dù chưa phải cách tối ưu nhất về hiệu năng.'},
  '1-4': {title:'Đệ quy nâng cao & số học', text:'Fibonacci đệ quy thuần có độ phức tạp mũ O(2^n) vì tính lại rất nhiều giá trị trùng lặp — ví dụ kinh điển cho thấy đệ quy không phải lúc nào cũng hiệu quả nếu không tối ưu (sẽ học kỹ thuật memoization để khắc phục ở các tuần sau). Thuật toán Euclid tìm GCD (ước chung lớn nhất) bằng đệ quy là 1 trong những thuật toán cổ nhất còn được dùng, dựa trên tính chất gcd(a,b) = gcd(b, a mod b). Ngày này kết hợp cả tư duy đệ quy lẫn tư duy toán học thuần túy — 2 kỹ năng nền tảng của lập trình giải thuật.'},
  '2-0': {title:'Ôn Two-pointer & làm quen Queue', text:'Tuần 3 chuyển trọng tâm sang cấu trúc dữ liệu (Stack, Queue, HashMap) — nền tảng của rất nhiều thuật toán nâng cao. Queue (hàng đợi) hoạt động theo nguyên tắc "vào trước ra trước" (FIFO), khác với Stack (vào sau ra trước - LIFO) đã học ở tháng trước. Trong JavaScript, có thể mô phỏng Queue đơn giản bằng mảng: push() để thêm vào cuối, shift() để lấy ra từ đầu — dù cách này không tối ưu về hiệu năng cho Queue lớn, nó đủ dùng để hiểu khái niệm trước khi học cấu trúc dữ liệu Queue thực thụ.'},
  '2-1': {title:'HashMap tối ưu tra cứu', text:'Chủ đề xuyên suốt ngày này là dùng HashMap/object để giảm độ phức tạp từ O(n²) (so sánh từng cặp) xuống O(n) (tra cứu tức thời). Khi cần đếm tần suất (ký tự, từ) hoặc kiểm tra "phần tử này đã xuất hiện chưa", luôn ưu tiên nghĩ đến HashMap trước khi nghĩ đến vòng lặp lồng nhau. Bài kiểm tra dãy con (subsequence) giới thiệu kỹ thuật 2 con trỏ độc lập di chuyển với tốc độ khác nhau — 1 con trỏ luôn di chuyển, con trỏ kia chỉ di chuyển khi có điều kiện khớp.'},
  '2-2': {title:'Xử lý chuỗi & mảng nâng cao', text:'Nhóm bài này yêu cầu xây dựng kết quả DẦN DẦN trong lúc duyệt (thay vì tính 1 lần rồi trả về), ví dụ nén chuỗi phải theo dõi "ký tự hiện tại + số lần lặp" liên tục cập nhật. Mẹo hay của bài kiểm tra chuỗi xoay vòng (is-rotation): nếu B là xoay vòng của A thì B chắc chắn là chuỗi con của (A nối với chính A) — ví dụ cho thấy đôi khi 1 quan sát toán học thông minh giúp bài toán khó trở nên cực kỳ đơn giản để code.'},
  '2-3': {title:'Ôn tập nhóm & phát hiện bất thường', text:'Ngày ôn tập tập trung vào việc "nhóm dữ liệu theo đặc điểm chung" — dùng 1 giá trị đại diện (chữ ký/signature) làm key trong HashMap để gom các phần tử có cùng đặc điểm lại với nhau (ví dụ các từ anagram dùng chung 1 "chữ ký" là chuỗi ký tự đã sắp xếp). Bài tìm số bị thiếu ôn lại mẹo dùng công thức toán học (tổng kỳ vọng trừ tổng thực tế) thay vì brute-force — nhắc lại rằng luôn nên tìm xem bài toán có "mẹo" toán học nào trước khi vội viết vòng lặp phức tạp.'},
  '2-4': {title:'Tổng hợp nâng cao Tuần 3', text:'Ngày khó nhất tuần, kết hợp HashMap nâng cao (đếm số cặp), Stack nâng cao (độ sâu lồng ngoặc, Stack có getMin), đệ quy đa cấp (làm phẳng mảng lồng sâu), và sliding window (chuỗi con không lặp dài nhất). Bài cài đặt Stack có getMin() O(1) là ví dụ điển hình của kỹ thuật "duy trì thêm 1 cấu trúc phụ trợ song song" để tối ưu 1 thao tác cụ thể — đánh đổi thêm bộ nhớ để đổi lấy tốc độ, một cân nhắc rất phổ biến trong thiết kế thuật toán thực tế.'},
  '3-0': {title:'Khởi động Tuần 4: mảng 2 chiều & điều kiện', text:'Tuần 4 giới thiệu Dynamic Programming (DP) — kỹ thuật quan trọng nhất của lập trình giải thuật ở trình độ trung-cao cấp. Trước khi vào DP, ngày này ôn lại các kỹ thuật nền: two-pointer (palindrome), duyệt mảng 2 chiều (ma trận — về bản chất là mảng chứa mảng, duyệt bằng 2 vòng lặp lồng nhau), và các bài kiểm tra điều kiện toán học đơn giản. Ma trận sẽ xuất hiện nhiều trong các bài toán thực tế như xử lý ảnh, đồ họa, bảng dữ liệu.'},
  '3-1': {title:'Nhập môn Dynamic Programming', text:'Dynamic Programming (DP) là kỹ thuật giải bài toán bằng cách chia thành các bài toán con nhỏ hơn, LƯU LẠI kết quả các bài toán con đã giải (gọi là "bảng dp") để không phải tính lại — đây chính là cách khắc phục vấn đề "tính lại nhiều lần" của đệ quy thuần đã thấy ở bài Fibonacci. Công thức chung: dp[i] = kết quả tại bước i, được tính từ dp[i-1], dp[i-2]... theo 1 công thức truy hồi cụ thể của từng bài. Leo cầu thang và Tribonacci là 2 ví dụ DP đơn giản nhất — nắm vững cách xây bảng dp ở đây là nền tảng cho mọi bài DP phức tạp hơn sau này.'},

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function isWeekend(dateStr){
  const day = new Date(dateStr+'T00:00:00').getDay();
  return day === 0 || day === 6;
}
function saveStreak(){ localStorage.setItem(pKey('roadmap-streak'), JSON.stringify(streakData)); }
function markTodayActive(){
  const t = todayStr();
  if (!streakData.activity[t]) {
    streakData.activity[t] = true;
    saveStreak();
    renderStreakWidget();
  }
}
function startStreakToday(){
  streakData.startDate = todayStr();
  markTodayActive();
  renderStreakWidget();
}
function computeStreakInfo(){
  if (!streakData.startDate) return null;
  const start = new Date(streakData.startDate+'T00:00:00');
  const today = new Date(todayStr()+'T00:00:00');
  const days = [];
  for (let d = new Date(start); d <= today; d.setDate(d.getDate()+1)) {
    const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    let status;
    if (isWeekend(ds)) status = 'weekend';
    else if (ds === todayStr()) status = streakData.activity[ds] ? 'done' : 'today';
    else status = streakData.activity[ds] ? 'done' : 'missed';
    days.push({date: ds, status});
  }
  let streak = 0;
  for (let i = days.length-1; i>=0; i--){
    if (days[i].status === 'weekend') continue;
    if (days[i].status === 'done' || days[i].status === 'today') { if (days[i].status==='done') streak++; continue; }
    break;
  }
  const missedCount = days.filter(d => d.status === 'missed').length;
  return { days: days.slice(-14), streak, missedCount };
}

/* ============ TEST ENGINE (for Algorithm track) ============ */
function deepEqual(a, b){
  if (Array.isArray(a) && Array.isArray(b)) {
    if (a.length !== b.length) return false;
    return a.every((v,i) => deepEqual(v, b[i]));
  }
  if (a && b && typeof a === 'object' && typeof b === 'object') {
    const ak = Object.keys(a).sort(), bk = Object.keys(b).sort();
    if (ak.length !== bk.length) return false;
    return ak.every((k,i) => k === bk[i] && deepEqual(a[k], b[k]));
  }
  return a === b;
}
function anagramEqual(a, b){
  const norm = (arr) => arr.map(inner => [...inner].sort().join(',')).sort().join('|');
  try { return norm(a) === norm(b); } catch(e){ return false; }
}

function shuffleArr(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickOne(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function lowerFirst(s){ return s.charAt(0).toLowerCase()+s.slice(1); }

const gPastSignals = ["yesterday","last week","last month","two days ago","last year","last Friday","three days ago","last quarter","in 2019","a week ago"];
const gPerfectSignals = ["already","just recently","since 2020","since last year","for five years","for three months","for a decade","so far"];

function genPresentQ(used){
  for(let tries=0; tries<80; tries++){
    const isCont = Math.random()<0.5;
    const isPlural = Math.random()<0.35;
    const subj = isPlural?pickOne(gSubjPl):pickOne(gSubjSg);
    const verb = pickOne(gVerbs);
    const key = 'pres|'+subj+'|'+verb.base+'|'+isCont;
    if (used.has(key)) continue;
    used.add(key);
    const obj = pickOne(gObjects);
    let sentence, correct, distractors, signal;
    if (isCont){
      signal = pickOne(gContSignals);
      correct = (isPlural?"are ":"is ")+verb.ing;
      sentence = `${signal}, ${lowerFirst(subj)} ___ ${obj}.`;
      distractors = [isPlural?verb.base:verb.s, verb.p, (isPlural?"is ":"are ")+verb.ing];
    } else {
      signal = pickOne(gSimpleSignals);
      correct = isPlural?verb.base:verb.s;
      sentence = `${subj} ___ ${obj} ${signal}.`;
      distractors = [(isPlural?"are ":"is ")+verb.ing, verb.p, isPlural?verb.s:verb.base];
    }
    const opts = shuffleArr([correct, ...distractors]);
    const explain = `"${signal}" là dấu hiệu của thì hiện tại ${isCont?'tiếp diễn':'đơn'}; chủ ngữ "${subj}" số ${isPlural?'nhiều':'ít'} nên dùng "${correct}".`;
    return {q:sentence, opts, correct:opts.indexOf(correct), explain};
  }
  return null;
}
function genPastPerfectQ(used){
  for(let tries=0; tries<80; tries++){
    const isPerfect = Math.random()<0.5;
    const isPlural = Math.random()<0.35;
    const subj = isPlural?pickOne(gSubjPl):pickOne(gSubjSg);
    const verb = pickOne(gVerbs);
    const key = 'pp|'+subj+'|'+verb.base+'|'+isPerfect;
    if (used.has(key)) continue;
    used.add(key);
    const obj = pickOne(gObjects);
    let sentence, correct, distractors, signal;
    if (isPerfect){
      signal = pickOne(gPerfectSignals);
      correct = (isPlural?"have ":"has ")+verb.p;
      sentence = `${subj} ___ ${obj} ${signal}.`;
      distractors = [verb.p, isPlural?verb.base:verb.s, (isPlural?"has ":"have ")+verb.p];
    } else {
      signal = pickOne(gPastSignals);
      correct = verb.p;
      sentence = `${subj} ___ ${obj} ${signal}.`;
      distractors = [isPlural?verb.base:verb.s, (isPlural?"are ":"is ")+verb.ing, (isPlural?"have ":"has ")+verb.p];
    }
    const opts = shuffleArr([correct, ...distractors]);
    const explain = isPerfect
      ? `"${signal}" là dấu hiệu của thì hiện tại hoàn thành; chủ ngữ "${subj}" số ${isPlural?'nhiều':'ít'} nên dùng "${correct}".`
      : `"${signal}" là mốc thời gian xác định trong quá khứ → dùng quá khứ đơn "${correct}" (quá khứ đơn không chia theo số ít/nhiều).`;
    return {q:sentence, opts, correct:opts.indexOf(correct), explain};
  }
  return null;
}

  {noun:"flexibility",adj:"flexible",adv:"flexibly",distractor:"flex"},
  {noun:"professionalism",adj:"professional",adv:"professionally",distractor:"profession"},
  {noun:"safety",adj:"safe",adv:"safely",distractor:"safen"},
  {noun:"responsibility",adj:"responsible",adv:"responsibly",distractor:"respond"},
  {noun:"attention",adj:"attentive",adv:"attentively",distractor:"attend"},
  {noun:"patience",adj:"patient",adv:"patiently",distractor:"patienthood"},
  {noun:"effectiveness",adj:"effective",adv:"effectively",distractor:"effect"},
];
const gNounTemplates = ["The team showed great ___.","This requires careful ___.","The manager values ___ above all.","Customers appreciate the ___ of our service."];
const gAdjTemplates = ["This is a very ___ approach.","She gave a ___ answer.","The results were highly ___.","We need a more ___ solution."];
const gAdvTemplates = ["He completed the task ___.","She responded ___ to the question.","They handled the situation ___.","The team worked ___ throughout the project."];

function genWordFormQ(used){
  for(let tries=0; tries<80; tries++){
    const type = pickOne(['noun','adj','adv']);
    const fam = pickOne(gWordFamilies);
    const templates = type==='noun'?gNounTemplates:type==='adj'?gAdjTemplates:gAdvTemplates;
    const template = pickOne(templates);
    const key = type+'|'+fam.noun+'|'+template;
    if (used.has(key)) continue;
    used.add(key);
    const correct = fam[type];
    const opts = shuffleArr([fam.noun, fam.adj, fam.adv, fam.distractor]);
    const label = type==='noun'?'danh từ':type==='adj'?'tính từ':'trạng từ';
    const explain = `Vị trí chỗ trống trong câu này cần ${label} → "${correct}".`;
    return {q:template.replace('___','___'), opts, correct:opts.indexOf(correct), explain};
  }
  return null;
}

const quizGenerators = {
  present: (n) => { const used=new Set(); const out=[]; for(let i=0;i<n;i++){ const item=genPresentQ(used); if(item) out.push(item); } return out; },
  pastperfect: (n) => { const used=new Set(); const out=[]; for(let i=0;i<n;i++){ const item=genPastPerfectQ(used); if(item) out.push(item); } return out; },
  wordform: (n) => { const used=new Set(); const out=[]; for(let i=0;i<n;i++){ const item=genWordFormQ(used); if(item) out.push(item); } return out; },
  mixedtense: (n) => { const used=new Set(); const out=[]; for(let i=0;i<n;i++){ const item = i%2===0 ? genPresentQ(used) : genPastPerfectQ(used); if(item) out.push(item); } return shuffleArr(out); },
};

function runTests(problemId, problem, editorId, consoleId){
  editorId = editorId || 'editor';
  consoleId = consoleId || 'console-body';
  const code = document.getElementById(editorId).value;
  const body = document.getElementById(consoleId);
  let userFn;
  try {
    const scope = new Function(code + '\nreturn solve;');
    userFn = scope();
    if (typeof userFn !== 'function') throw new Error('Không tìm thấy hàm solve() hợp lệ.');
  } catch(e){
    body.innerHTML = `<div class="error-line">✗ Lỗi cú pháp: ${e.message}</div>`;
    return;
  }

  let lines = '';
  let passCount = 0;
  problem.tests.forEach((t, i) => {
    try {
      const actual = userFn(...t.args);
      const pass = t.normalize === 'anagram' ? anagramEqual(actual, t.expected) : deepEqual(actual, t.expected);
      if (pass) passCount++;
      const detail = pass ? '' : `mong đợi ${JSON.stringify(t.expected)}, nhận được ${JSON.stringify(actual)}`;
      lines += `<div class="test-line ${pass ? 'pass' : 'fail'}"><span class="mark">${pass ? '✓' : '✗'}</span><span><span class="txt">test ${i+1} — input: ${JSON.stringify(t.args)}</span>${detail ? `<span class="detail">${detail}</span>` : ''}</span></div>`;
    } catch(e){
      lines += `<div class="test-line fail"><span class="mark">✗</span><span><span class="txt">test ${i+1} — lỗi khi chạy</span><span class="detail">${e.message}</span></span></div>`;
    }
  });

  const allPass = passCount === problem.tests.length;
  lines += `<div class="summary-line ${allPass ? 'pass' : 'fail'}">${passCount}/${problem.tests.length} test passed${allPass ? ' — hoàn thành bài này!' : ''}</div>`;
  body.innerHTML = lines;

  if (allPass) {
    setDone(currentTrack, currentWeek, true);
    renderAll();
  }
}

  if (!streakData.startDate) {
    wrap.innerHTML = `<button class="start-streak-btn" id="startStreakBtn">🚀 Bắt đầu học từ hôm nay</button>`;
    document.getElementById('startStreakBtn').addEventListener('click', () => {
      startStreakToday();
      renderAll();
    });
    return;
  }
  const info = computeStreakInfo();
  const cal = info.days.map(d => `<span class="streak-day ${d.status}" title="${d.date}: ${d.status==='done'?'đã học':d.status==='missed'?'đã miss':d.status==='today'?'hôm nay':'cuối tuần'}"></span>`).join('');
  const warn = info.missedCount > 0;
  wrap.innerHTML = `
    <div class="streak-widget">
      <span class="streak-count ${warn?'warn':''}">${warn ? `⚠️ Miss ${info.missedCount} ngày` : `🔥 ${info.streak} ngày liên tiếp`}</span>
      <div class="streak-cal">${cal}</div>
    </div>
  `;
}

/* ============ PROFILE SCREEN ============ */
function showProfileScreen(){
  document.getElementById('siteHeader').classList.add('app-hidden');
  document.getElementById('siteApp').classList.add('app-hidden');
  document.getElementById('siteFooter').classList.add('app-hidden');
  const screen = document.getElementById('profileScreen');
  screen.classList.remove('app-hidden');
  const cards = profiles.map(p => `
    <div class="ps-card" data-id="${p.id}">
      <div class="ps-avatar">${p.name.charAt(0).toUpperCase()}${p.password ? '<span class="ps-lock">🔒</span>' : ''}<button class="ps-del" data-id="${p.id}" title="Xóa hồ sơ">✕</button></div>
      <div class="ps-name">${p.name}</div>
    </div>
  `).join('');
  screen.innerHTML = `
    <div class="ps-brand"><span class="dot"></span><h1 style="font-family:var(--mono);font-size:16px;font-weight:700">lộ trình học tập</h1></div>
    <h2>Ai đang học vậy?</h2>
    <div class="ps-grid">
      ${cards}
      <div class="ps-card ps-add" id="psAddCard">
        <div class="ps-avatar">+</div>
        <div class="ps-name">Thêm hồ sơ</div>
      </div>
    </div>
    <div class="ps-form app-hidden" id="psForm" style="flex-direction:column; align-items:center; gap:10px;">
      <input type="text" id="psNameInput" placeholder="Tên hồ sơ (ví dụ: Nam)" maxlength="20">
      <input type="password" id="psPassInput" placeholder="Mật khẩu (tùy chọn, để trống nếu không cần)" maxlength="30">
      <button id="psCreateBtn">Tạo hồ sơ</button>
    </div>
    <div class="ps-hint">Mỗi hồ sơ có tiến độ, ghi chú và bài đã lưu hoàn toàn riêng biệt trên trình duyệt này. Không đồng bộ được qua thiết bị khác. Mật khẩu chỉ là lớp chặn nhẹ trên máy này, không phải bảo mật thật sự.</div>
  `;
  document.querySelectorAll('.ps-card[data-id]').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.classList.contains('ps-del')) return;
      tryOpenProfile(card.dataset.id);
    });
  });
  document.querySelectorAll('.ps-del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!confirm('Xóa hồ sơ này? Toàn bộ tiến độ, ghi chú sẽ mất vĩnh viễn.')) return;
      const id = btn.dataset.id;
      ['roadmap-notes','roadmap-progress','roadmap-code','roadmap-streak'].forEach(k => localStorage.removeItem(`profile:${id}:${k}`));
      profiles = profiles.filter(p => p.id !== id);
      saveProfiles();
      showProfileScreen();
    });
  });
  document.getElementById('psAddCard').addEventListener('click', () => {
    document.getElementById('psForm').classList.remove('app-hidden');
    document.getElementById('psNameInput').focus();
  });
  document.getElementById('psCreateBtn').addEventListener('click', createProfile);
  document.getElementById('psNameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('psPassInput').focus(); });
  document.getElementById('psPassInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') createProfile(); });
}
function tryOpenProfile(id){
  const p = profiles.find(x => x.id === id);
  if (!p) return;
  if (!p.password) { selectProfile(id); return; }
  const input = prompt(`Hồ sơ "${p.name}" có mật khẩu — nhập mật khẩu để mở:`);
  if (input === null) return;
  if (input === p.password) { selectProfile(id); }
  else { alert('Sai mật khẩu.'); }
}
function createProfile(){
  const input = document.getElementById('psNameInput');
  const passInput = document.getElementById('psPassInput');
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  const password = passInput.value.trim();
  const id = 'p' + Date.now();
  profiles.push({id, name, password: password || null});
  saveProfiles();
  selectProfile(id);
}
function selectProfile(id){
  activeProfileId = id;
  localStorage.setItem('active-profile-id', id);
  document.getElementById('profileScreen').classList.add('app-hidden');
  document.getElementById('siteHeader').classList.remove('app-hidden');
  document.getElementById('siteApp').classList.remove('app-hidden');
  document.getElementById('siteFooter').classList.remove('app-hidden');
  loadProfileData();
  const p = profiles.find(x => x.id === id);
  document.getElementById('brandPath').textContent = `Hồ sơ: ${p ? p.name : ''} · 6 tháng FE/BE/Thuật toán/AWS/Hàn · 4 tháng TOEIC`;
  renderAll();
}
document.getElementById('switchProfileBtn').addEventListener('click', showProfileScreen);

/* ============ BOOT ============ */
showProfileScreen();

</script>
</body>
