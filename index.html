{title:"Listening Part 4 — bài nói ngắn", points:["Part 4 là các bài nói dài hơn Part 3 (thông báo, quảng cáo, voice mail...), mỗi bài 3 câu hỏi.","Nhận diện loại bài nói giúp đoán trước nội dung sẽ nghe.","Chiến lược đọc trước câu hỏi vẫn áp dụng như Part 3, càng quan trọng hơn vì bài dài hơn.","Từ vựng thường gặp: thông báo nội bộ, lịch trình, sự kiện công ty — nên học theo chủ đề này.","Luyện nghe tốc độ thật (không làm chậm lại) để quen với tốc độ đề thi thật."], practice:"Làm 3 bài Part 4 (9 câu), chấm điểm và liệt kê loại bài nói nào mình yếu nhất.", case:"Part 4 thường có giọng đọc chuẩn hơn Part 3 (ít hội thoại tự nhiên) nên với thí sinh luyện đúng phương pháp, đây lại là phần dễ ăn điểm hơn Part 3.", task:"Làm 3 bài Part 4 (9 câu), chấm điểm và liệt kê loại bài nói nào mình yếu nhất.", days:[
{label:'Thứ 2', title:'Cấu trúc Part 4 & nhận diện loại bài nói', content:'Part 4 gồm 10 bài nói ngắn (chỉ 1 người nói: thông báo, quảng cáo, voice mail, bản tin...), mỗi bài 3 câu hỏi, tổng 30 câu. Khác Part 3 (hội thoại tự nhiên giữa nhiều người), Part 4 thường có giọng đọc CHUẨN và MẠCH LẠC hơn vì là bài nói 1 chiều đã chuẩn bị trước — với thí sinh luyện đúng phương pháp, đây có thể là phần dễ ăn điểm hơn Part 3. Nhận diện loại bài nói (thông báo nội bộ, quảng cáo, voice mail...) ngay từ câu đầu giúp dự đoán cấu trúc thông tin sắp nghe.', exercises:["Làm 2 bài Part 4 (6 câu), thử nhận diện loại bài nói chỉ dựa vào câu mở đầu.","Liệt kê 4 loại bài nói phổ biến trong Part 4: thông báo nội bộ, quảng cáo, voice mail, bản tin/dự báo.","So sánh cảm nhận về tốc độ/độ rõ ràng giữa audio Part 3 và Part 4 sau khi làm cả 2.","Học 5 cụm từ mở đầu điển hình cho mỗi loại bài nói (ví dụ \"Attention all employees\" cho thông báo).","Ghi chú lại cấu trúc thông tin thường gặp trong 1 bài voice mail điển hình (người gọi, lý do gọi, yêu cầu hành động)."], quiz:[
{q:"Part 4 có tổng cộng bao nhiêu bài nói?", opts:["5", "10", "13", "20"], correct:1, explain:"Part 4 gồm 10 bài nói ngắn, mỗi bài 3 câu hỏi, tổng 30 câu."},
{q:"Part 4 khác Part 3 ở điểm cơ bản nào?", opts:["Không có khác biệt", "Part 4 chỉ có 1 người nói (bài nói 1 chiều), Part 3 là hội thoại nhiều người", "Part 4 có nhiều người nói hơn", "Part 4 không có câu hỏi"], correct:1, explain:"Đây là khác biệt cấu trúc cơ bản nhất giữa 2 Part."},
{q:"Vì sao Part 4 có thể dễ ăn điểm hơn Part 3 với người luyện đúng cách?", opts:["Không có lý do gì", "Giọng đọc thường chuẩn và mạch lạc hơn vì là bài nói 1 chiều đã chuẩn bị trước", "Part 4 có ít câu hỏi hơn", "Part 4 không cần nghe kỹ"], correct:1, explain:"Tính chất bài nói chuẩn bị trước giúp cấu trúc rõ ràng hơn hội thoại tự nhiên."},
{q:"Loại bài nói nào KHÔNG thuộc Part 4?", opts:["Thông báo nội bộ", "Quảng cáo", "Voice mail", "Hội thoại giữa 3 người bạn"], correct:3, explain:"Hội thoại nhiều người là đặc trưng của Part 3, không phải Part 4."},
{q:"Nhận diện loại bài nói sớm giúp ích gì?", opts:["Không giúp ích gì", "Dự đoán cấu trúc thông tin sắp nghe, tăng khả năng nắm bắt ý chính", "Chỉ để phân loại cho vui", "Làm mất tập trung"], correct:1, explain:"Biết trước loại bài nói giúp chuẩn bị tâm thế đúng để tiếp nhận thông tin."},
{q:"\"Attention all employees\" thường mở đầu cho loại bài nói nào?", opts:["Quảng cáo sản phẩm", "Thông báo nội bộ", "Dự báo thời tiết", "Voice mail cá nhân"], correct:1, explain:"Đây là cụm mở đầu điển hình cho thông báo gửi đến toàn thể nhân viên."},
{q:"Voice mail trong Part 4 thường có cấu trúc thông tin nào?", opts:["Không có cấu trúc cố định", "Người gọi, lý do gọi, yêu cầu hành động", "Chỉ có lời chào đơn thuần", "Luôn là quảng cáo"], correct:1, explain:"Voice mail điển hình thường theo cấu trúc: giới thiệu, lý do, yêu cầu phản hồi."},
{q:"Tốc độ nói trong Part 4 so với Part 3 thế nào?", opts:["Luôn chậm hơn nhiều", "Tương đương hoặc rõ ràng hơn do là bài nói chuẩn bị trước", "Luôn nhanh hơn đáng kể", "Không thể so sánh"], correct:1, explain:"Bài nói chuẩn bị trước thường có nhịp điệu đều đặn, dễ theo dõi hơn hội thoại tự nhiên."},
{q:"Mỗi bài nói Part 4 có bao nhiêu câu hỏi đi kèm?", opts:["1", "2", "3", "5"], correct:2, explain:"Giống Part 3, mỗi bài Part 4 cũng có đúng 3 câu hỏi."},
{q:"Vì sao nên luyện nhận diện loại bài nói ngay từ câu đầu?", opts:["Không cần thiết", "Vì câu mở đầu thường tiết lộ mục đích và loại nội dung sắp trình bày", "Câu đầu luôn không quan trọng", "Chỉ để giải trí"], correct:1, explain:"Câu mở đầu là tín hiệu quan trọng nhất để định hướng nghe hiểu toàn bài."},

{label:'Thứ 3', title:'Từ vựng chủ đề thông báo & lịch trình công ty', content:'Từ vựng thường gặp trong Part 4: thông báo nội bộ, lịch trình, sự kiện công ty — nên học theo chủ đề này để tăng khả năng bắt đúng thông tin. Các từ như \"renovation\" (cải tạo), \"postpone\" (hoãn lại), \"mandatory\" (bắt buộc), \"agenda\" (chương trình nghị sự) xuất hiện thường xuyên trong thông báo công ty. Việc nắm vững từ vựng chủ đề giúp không bị \"đứng hình\" khi gặp từ khóa quan trọng quyết định câu trả lời.', exercises:["Học 15 từ vựng chủ đề thông báo/lịch trình công ty thường gặp trong Part 4.","Làm 3 bài Part 4 tập trung chủ đề thông báo nội bộ, ghi chú các từ vựng mới gặp.","Viết 3 câu ví dụ dùng từ \"postpone\", \"mandatory\", \"renovation\" theo ngữ cảnh công sở.","Tìm hiểu sự khác biệt giữa \"schedule\" và \"agenda\" trong ngữ cảnh công việc.","Ôn lại 15 từ vựng đã học bằng flashcard tự làm, lặp lại 2 lần trong ngày."], quiz:[
{q:"\"postpone\" nghĩa là gì?", opts:["Bắt buộc", "Hoãn lại", "Cải tạo", "Thông báo"], correct:1, explain:"\"postpone\" nghĩa là hoãn lại, dời sang thời điểm khác."},
{q:"\"mandatory\" nghĩa là gì?", opts:["Tự nguyện", "Bắt buộc", "Miễn phí", "Tạm thời"], correct:1, explain:"\"mandatory\" nghĩa là bắt buộc, không thể bỏ qua."},
{q:"\"renovation\" nghĩa là gì?", opts:["Cải tạo/sửa chữa", "Tuyển dụng", "Nghỉ phép", "Quảng cáo"], correct:0, explain:"\"renovation\" nghĩa là việc cải tạo, sửa chữa (thường dùng cho tòa nhà/văn phòng)."},
{q:"\"agenda\" nghĩa là gì?", opts:["Lịch nghỉ", "Chương trình nghị sự/nội dung cuộc họp", "Hóa đơn", "Hợp đồng"], correct:1, explain:"\"agenda\" là danh sách các nội dung sẽ được thảo luận trong 1 cuộc họp/sự kiện."},
{q:"\"schedule\" khác \"agenda\" ở điểm nào?", opts:["Không khác gì", "\"schedule\" thường chỉ lịch trình thời gian; \"agenda\" chỉ nội dung/chương trình làm việc", "\"agenda\" chỉ dùng cho email", "\"schedule\" không tồn tại trong tiếng Anh công sở"], correct:1, explain:"2 từ có sắc thái khác nhau: thời gian biểu vs nội dung chương trình."},
{q:"Vì sao nên học từ vựng theo chủ đề thông báo/lịch trình cho Part 4?", opts:["Không cần thiết", "Vì đây là nhóm từ vựng xuất hiện thường xuyên nhất trong dạng bài này", "Từ vựng ngẫu nhiên hiệu quả hơn", "Part 4 không cần từ vựng chuyên biệt"], correct:1, explain:"Học đúng trọng tâm từ vựng theo chủ đề giúp tối ưu thời gian ôn luyện."},
{q:"Nắm vững từ vựng chủ đề giúp ích gì khi nghe?", opts:["Không giúp ích gì", "Tránh bị \"đứng hình\" khi gặp từ khóa quan trọng quyết định câu trả lời", "Chỉ giúp đọc nhanh hơn", "Không liên quan đến kỹ năng nghe"], correct:1, explain:"Từ vựng quen thuộc giúp xử lý thông tin nhanh và chính xác hơn khi nghe."},
{q:"Trong câu \"The meeting has been postponed\", điều gì đã xảy ra?", opts:["Cuộc họp đã diễn ra", "Cuộc họp bị hoãn lại", "Cuộc họp bị hủy vĩnh viễn", "Cuộc họp được rút ngắn"], correct:1, explain:"\"postponed\" nghĩa là bị hoãn, không phải hủy hẳn."},
{q:"Flashcard tự làm có lợi ích gì khi ôn từ vựng?", opts:["Không có lợi ích gì", "Giúp lặp lại và tự kiểm tra trí nhớ hiệu quả, cá nhân hóa theo từ mình còn yếu", "Chỉ tốn thời gian làm", "Không hiệu quả bằng học thuộc lòng"], correct:1, explain:"Flashcard là công cụ ôn tập chủ động, giúp ghi nhớ lâu dài hơn."},
{q:"\"mandatory training\" nghĩa là gì?", opts:["Đào tạo tự chọn", "Đào tạo bắt buộc", "Đào tạo miễn phí", "Đào tạo trực tuyến"], correct:1, explain:"\"mandatory training\" là khóa đào tạo bắt buộc mọi người phải tham gia."},

{label:'Thứ 4', title:'Chiến thuật đọc trước & luyện tốc độ thật', content:'Chiến lược đọc trước câu hỏi vẫn áp dụng như Part 3, càng quan trọng hơn vì bài nói Part 4 thường dài hơn đoạn hội thoại Part 3. Luyện nghe tốc độ thật (không làm chậm lại) để quen với tốc độ đề thi thật — nhiều thí sinh luyện nghe ở tốc độ chậm hơn thực tế khiến khi vào phòng thi bị choáng ngợp vì tốc độ nhanh hơn dự kiến.', exercises:["Làm 3 bài Part 4 với tốc độ audio gốc (không làm chậm lại), tính giờ đọc trước câu hỏi.","So sánh kết quả làm bài ở tốc độ thật với tốc độ đã làm chậm trước đó (nếu từng luyện chậm).","Luyện đọc nhanh 3 câu hỏi + đáp án trong khoảng 8 giây cho mỗi bài Part 4.","Ghi chú lại 3 tình huống bạn bị \"tụt lại\" vì tốc độ audio, phân tích nguyên nhân.","Luyện nghe liên tục 5 bài Part 4 không dừng giữa chừng để quen áp lực thi thật."], quiz:[
{q:"Chiến thuật đọc trước câu hỏi có áp dụng cho Part 4 không?", opts:["Không áp dụng được", "Có, và càng quan trọng hơn vì bài nói Part 4 thường dài hơn", "Chỉ áp dụng cho Part 3", "Không liên quan đến Part 4"], correct:1, explain:"Đọc trước câu hỏi là kỹ năng nền tảng dùng chung cho cả Part 3 và Part 4."},
{q:"Vì sao nên luyện nghe ở tốc độ audio gốc thay vì làm chậm lại?", opts:["Không có lý do gì", "Để quen với tốc độ thật của đề thi, tránh bị choáng ngợp khi vào phòng thi", "Tốc độ chậm luôn hiệu quả hơn", "Không có sự khác biệt về tốc độ"], correct:1, explain:"Luyện ở tốc độ không thực tế có thể gây sốc khi gặp tốc độ thật trong đề thi."},
{q:"Nếu quen luyện nghe chậm, khi vào phòng thi có thể gặp vấn đề gì?", opts:["Không có vấn đề gì", "Cảm thấy audio thi thật nhanh hơn dự kiến, khó theo kịp", "Sẽ làm bài nhanh hơn bình thường", "Không ảnh hưởng đến kết quả"], correct:1, explain:"Sự chênh lệch tốc độ luyện tập và thực tế có thể gây bất ngờ, ảnh hưởng tâm lý làm bài."},
{q:"Thời gian đọc trước câu hỏi Part 4 nên trong khoảng bao lâu?", opts:["Không giới hạn thời gian", "Khoảng 8 giây, tương tự Part 3", "5 phút", "Không cần đọc trước"], correct:1, explain:"Tương tự Part 3, khoảng nghỉ giữa các bài chỉ đủ để đọc nhanh câu hỏi."},
{q:"Luyện nghe liên tục 5 bài không dừng có mục đích gì?", opts:["Không có mục đích cụ thể", "Mô phỏng áp lực tập trung liên tục như điều kiện thi thật", "Chỉ để tốn thời gian", "Không liên quan đến kỹ năng thi"], correct:1, explain:"Đề thi thật đòi hỏi duy trì tập trung xuyên suốt nhiều bài liên tiếp không nghỉ."},
{q:"Việc \"tụt lại\" khi nghe Part 4 thường do nguyên nhân gì?", opts:["Không có nguyên nhân cụ thể", "Tốc độ audio nhanh hơn khả năng xử lý thông tin hiện tại của người nghe", "Chỉ do thiết bị nghe kém", "Do đề thi cố tình gây khó"], correct:1, explain:"Đây là vấn đề về tốc độ xử lý ngôn ngữ cần cải thiện qua luyện tập."},
{q:"So sánh kết quả làm bài ở 2 tốc độ (chậm và thật) giúp ích gì?", opts:["Không giúp ích gì", "Đánh giá khách quan mức độ ảnh hưởng của tốc độ đến khả năng làm bài của bản thân", "Chỉ để so sánh cho vui", "Gây nản lòng không cần thiết"], correct:1, explain:"So sánh cụ thể giúp nhận ra chính xác cần cải thiện tốc độ xử lý đến đâu."},
{q:"Kỹ năng đọc nhanh 3 câu hỏi trong 8 giây cần luyện tập thế nào?", opts:["Không cần luyện, tự nhiên sẽ làm được", "Luyện tập lặp lại nhiều lần với đồng hồ bấm giờ để cải thiện tốc độ dần", "Chỉ cần đọc 1 lần là đủ", "Không quan trọng với kết quả thi"], correct:1, explain:"Tốc độ đọc là kỹ năng cần rèn luyện có chủ đích qua thực hành lặp lại."},
{q:"Vì sao tốc độ thật của đề thi TOEIC không được làm chậm lại cho thí sinh?", opts:["Không có lý do gì", "Vì mục đích của bài thi là đánh giá khả năng nghe hiểu tiếng Anh tự nhiên trong công việc thực tế", "Do lỗi kỹ thuật của đề thi", "Chỉ là ngẫu nhiên"], correct:1, explain:"TOEIC được thiết kế để phản ánh khả năng giao tiếp thực tế, nên dùng tốc độ tự nhiên."},
{q:"Luyện tốc độ thật ngay từ đầu (thay vì luyện chậm rồi tăng dần) có lợi ích gì?", opts:["Không có lợi ích gì", "Giúp làm quen sớm với điều kiện thi thật, tránh phải \"điều chỉnh lại\" sau này", "Luôn gây khó khăn không cần thiết", "Không có sự khác biệt về kết quả"], correct:1, explain:"Luyện đúng điều kiện thực tế ngay từ đầu giúp tránh mất thời gian điều chỉnh sau này."},

{label:'Thứ 5', title:'Câu hỏi suy luận mục đích & đối tượng nghe', content:'Part 4 thường có câu hỏi dạng \"What is the purpose of the talk?\" (mục đích bài nói) hoặc \"Who is the audience?\" (đối tượng nghe) — đây là dạng câu hỏi TỔNG QUAN, cần hiểu được ý chính toàn bài chứ không chỉ 1 chi tiết cụ thể. Khác với câu hỏi chi tiết (hỏi số liệu, thời gian cụ thể), câu hỏi tổng quan đòi hỏi tổng hợp thông tin xuyên suốt cả bài nói.', exercises:["Làm 3 bài Part 4, đặc biệt chú ý câu hỏi dạng \"purpose\" hoặc \"audience\".","Ghi chú lại các từ khóa giúp nhận diện mục đích bài nói (ví dụ \"I'm calling to...\", \"This is to inform...\").","Phân biệt câu hỏi chi tiết (hỏi số liệu cụ thể) và câu hỏi tổng quan (hỏi mục đích/đối tượng) qua 5 ví dụ.","Thử tóm tắt bằng 1 câu tiếng Việt mục đích chính của 3 bài Part 4 vừa làm.","Phân tích 2 câu bạn từng làm sai dạng \"purpose/audience\", tìm nguyên nhân sai."], quiz:[
{q:"Câu hỏi \"What is the purpose of the talk?\" thuộc dạng câu hỏi nào?", opts:["Câu hỏi chi tiết cụ thể", "Câu hỏi tổng quan về mục đích bài nói", "Câu hỏi về giá cả", "Câu hỏi về thời tiết"], correct:1, explain:"Đây là dạng câu hỏi tổng quan, cần hiểu ý chính toàn bài."},
{q:"Câu hỏi \"Who is the audience?\" hỏi về điều gì?", opts:["Người nói", "Đối tượng nghe bài nói", "Địa điểm diễn ra", "Thời gian bài nói"], correct:1, explain:"Câu hỏi này hỏi về đối tượng mà bài nói đang hướng đến."},
{q:"Câu hỏi tổng quan khác câu hỏi chi tiết ở điểm nào?", opts:["Không có khác biệt", "Câu hỏi tổng quan cần tổng hợp ý toàn bài; câu hỏi chi tiết chỉ cần 1 thông tin cụ thể", "Câu hỏi tổng quan luôn dễ hơn", "Câu hỏi chi tiết không xuất hiện trong Part 4"], correct:1, explain:"Đây là khác biệt cốt lõi về cách xử lý thông tin cho 2 dạng câu hỏi."},
{q:"\"I'm calling to...\" là tín hiệu cho dạng câu hỏi nào?", opts:["Câu hỏi về thời tiết", "Câu hỏi về mục đích cuộc gọi (purpose)", "Câu hỏi về giá cả", "Không liên quan đến câu hỏi nào"], correct:1, explain:"Cụm từ này trực tiếp báo hiệu mục đích của voice mail/cuộc gọi."},
{q:"Vì sao câu hỏi tổng quan khó hơn câu hỏi chi tiết với nhiều thí sinh?", opts:["Không khó hơn", "Đòi hỏi hiểu và tổng hợp ý toàn bài thay vì chỉ bắt 1 chi tiết cụ thể", "Vì luôn có từ vựng khó", "Vì đáp án luôn mơ hồ"], correct:1, explain:"Xử lý tổng thể đòi hỏi khả năng nghe hiểu sâu hơn xử lý chi tiết đơn lẻ."},
{q:"Tóm tắt bằng 1 câu tiếng Việt sau khi nghe có tác dụng gì?", opts:["Không có tác dụng gì", "Kiểm tra xem đã nắm được ý chính (mục đích) của bài nói chưa", "Chỉ để luyện dịch thuật", "Làm mất thời gian không cần thiết"], correct:1, explain:"Đây là cách tự kiểm tra hiệu quả việc hiểu ý chính, không chỉ nghe chi tiết rời rạc."},
{q:"\"This is to inform...\" thường xuất hiện trong loại bài nói nào?", opts:["Quảng cáo sản phẩm", "Thông báo (announcement)", "Dự báo thời tiết cá nhân", "Không xuất hiện trong Part 4"], correct:1, explain:"Đây là cụm từ mở đầu điển hình cho thông báo, báo hiệu mục đích thông tin."},
{q:"Câu hỏi chi tiết (hỏi số liệu cụ thể) cần chiến thuật nghe khác gì so với câu hỏi tổng quan?", opts:["Không cần chiến thuật khác", "Cần chú ý bắt đúng 1 thông tin cụ thể (số, tên, thời gian) tại đúng thời điểm được nhắc đến", "Luôn giống hệt câu hỏi tổng quan", "Không cần nghe kỹ với dạng này"], correct:1, explain:"Câu hỏi chi tiết cần độ chính xác cao tại 1 điểm thông tin cụ thể."},
{q:"Phân tích lỗi sai ở câu hỏi purpose/audience giúp ích gì?", opts:["Không có ích gì", "Xác định xem vấn đề là do không hiểu ý chính hay do bỏ lỡ từ khóa quan trọng", "Chỉ để thống kê", "Không liên quan đến cải thiện kỹ năng"], correct:1, explain:"Phân tích chi tiết giúp xác định đúng nguyên nhân để có hướng khắc phục phù hợp."},
{q:"Kỹ năng nghe hiểu tổng quan có áp dụng được cho Reading Part 7 sau này không?", opts:["Không liên quan gì", "Có, kỹ năng nắm ý chính là kỹ năng nền tảng dùng chung cho cả Listening và Reading", "Chỉ áp dụng cho Listening", "Part 7 không cần kỹ năng này"], correct:1, explain:"Nắm ý chính (main idea) là kỹ năng xuyên suốt áp dụng cho nhiều dạng bài khác nhau."},

{label:'Thứ 6', title:'Tổng kết tuần 10', content:'Part 4 thường có giọng đọc chuẩn hơn Part 3 (ít hội thoại tự nhiên) nên với thí sinh luyện đúng phương pháp, đây lại là phần dễ ăn điểm hơn Part 3. Kỹ năng cốt lõi: nhận diện loại bài nói, nắm từ vựng chủ đề thông báo/lịch trình, luyện tốc độ thật, và xử lý tốt câu hỏi tổng quan (purpose/audience). Đây là tuần hoàn thiện kỹ năng Listening cuối cùng của tháng 2 trước khi chuyển sang Reading Part 6.', exercises:["Làm 1 bộ đề Part 4 đầy đủ (10 bài, 30 câu), tính giờ và chấm điểm.","So sánh điểm số Part 3 và Part 4, xác định phần nào bạn làm tốt hơn.","Tổng hợp toàn bộ từ vựng chủ đề thông báo/lịch trình đã học tuần này.","Viết lại 4 loại bài nói Part 4 từ trí nhớ, không nhìn tài liệu.","Đặt mục tiêu cụ thể cho phần Listening trước khi chuyển sang Reading Part 6 tuần sau."], quiz:[
{q:"Chủ đề trọng tâm tuần 10 tháng 2 là gì?", opts:["Reading Part 6", "Listening Part 4 — bài nói ngắn", "Từ vựng Part 1", "Ngữ pháp Part 5"], correct:1, explain:"Tuần 10 tập trung toàn diện vào kỹ năng làm Part 4."},
{q:"4 kỹ năng chính đã học trong tuần 10 là gì?", opts:["Không có kỹ năng cụ thể nào", "Nhận diện loại bài nói, từ vựng chủ đề, luyện tốc độ thật, xử lý câu hỏi tổng quan", "Chỉ có 1 kỹ năng duy nhất", "Chỉ liên quan đến ngữ pháp"], correct:1, explain:"Đây là 4 trụ cột kỹ năng đã luyện tập xuyên suốt tuần 10."},
{q:"Vì sao Part 4 có thể dễ ăn điểm hơn Part 3 nếu luyện đúng cách?", opts:["Không có lý do gì", "Giọng đọc chuẩn, mạch lạc hơn vì là bài nói chuẩn bị trước, không phải hội thoại tự nhiên", "Vì có ít câu hỏi hơn", "Vì không cần từ vựng chuyên biệt"], correct:1, explain:"Tính nhất quán của bài nói 1 chiều giúp dễ theo dõi hơn hội thoại tự nhiên."},
{q:"So sánh điểm Part 3 và Part 4 sau khi làm đề đầy đủ có ích gì?", opts:["Không có ích gì", "Xác định phần nào bạn mạnh/yếu hơn để phân bổ thời gian ôn tập hợp lý", "Chỉ để so sánh cho vui", "Gây áp lực không cần thiết"], correct:1, explain:"So sánh cụ thể giúp nhận diện điểm mạnh/yếu để điều chỉnh chiến lược ôn tập."},
{q:"Sau tuần 9-10, bạn đã hoàn thành đầy đủ kỹ năng nào của Listening?", opts:["Chỉ mới học Part 1-2", "Đã học đầy đủ Part 1-4 (toàn bộ phần Listening)", "Chưa học phần nào", "Chỉ học lý thuyết chưa thực hành"], correct:1, explain:"Sau 2 tuần này, toàn bộ 4 Part của Listening đã được học qua chiến thuật cụ thể."},
{q:"Tuần 11 sắp tới sẽ chuyển trọng tâm sang đâu theo lộ trình?", opts:["Tiếp tục Listening", "Reading Part 6 — đoạn văn điền từ", "Ngừng học TOEIC", "Chỉ ôn lại Part 1"], correct:1, explain:"Sau khi hoàn thành Listening, lộ trình chuyển sang Reading Part 6."},
{q:"Việc viết lại 4 loại bài nói Part 4 từ trí nhớ có tác dụng gì?", opts:["Không có tác dụng gì", "Kiểm tra và củng cố lại kiến thức đã học trong tuần, không chỉ đọc lướt qua", "Chỉ để viết cho có", "Làm mất thời gian không cần thiết"], correct:1, explain:"Đây là kỹ thuật active recall giúp củng cố kiến thức hiệu quả hơn đọc lại thụ động."},
{q:"Đặt mục tiêu cụ thể trước khi chuyển sang kỹ năng mới có lợi ích gì?", opts:["Không có lợi ích gì", "Giúp định hướng rõ ràng, biết cần cải thiện gì trước khi tiếp tục học phần mới", "Chỉ để trang trí kế hoạch", "Không cần thiết vì đã học xong"], correct:1, explain:"Mục tiêu cụ thể giúp việc học có định hướng và dễ đo lường tiến bộ hơn."},
{q:"Tổng hợp từ vựng theo chủ đề sau mỗi tuần có nên duy trì xuyên suốt khóa học không?", opts:["Không cần thiết", "Có, đây nên là thói quen duy trì để xây dựng vốn từ vựng có hệ thống", "Chỉ cần làm 1 lần duy nhất", "Không liên quan đến kết quả học"], correct:1, explain:"Duy trì thói quen tổng hợp từ vựng giúp xây dựng nền tảng vững chắc theo thời gian."},
{q:"Sau khi hoàn thành cả Part 3 và Part 4, kỹ năng Listening tổng thể của bạn nên đạt mức nào?", opts:["Không có tiến bộ gì", "Đã nắm được chiến thuật cơ bản cho toàn bộ 4 Part Listening, sẵn sàng luyện tổng hợp và nâng cao", "Vẫn hoàn toàn như ban đầu", "Chỉ giỏi 1 Part duy nhất"], correct:1, explain:"Sau 2 tuần luyện tập có hệ thống, nền tảng chiến thuật cho toàn bộ Listening đã hình thành."},

{title:"Reading Part 6 — đoạn văn điền từ", points:["Part 6 giống Part 5 nhưng đặt trong đoạn văn có ngữ cảnh, cần đọc câu trước/sau để chọn đúng.","Có dạng câu hỏi chọn cả 1 câu hoàn chỉnh để điền vào chỗ trống — cần hiểu mạch ý cả đoạn.","Chú ý các từ nối (however, therefore, in addition) vì gợi ý quan hệ logic giữa các câu.","Thì động từ trong Part 6 phụ thuộc ngữ cảnh thời gian của cả đoạn, không chỉ câu chứa chỗ trống.","Làm Part 6 chậm hơn Part 5 một chút vì cần đọc hiểu ngữ cảnh, nhưng vẫn cần kiểm soát thời gian."], practice:"Làm 2 đoạn Part 6 (8 câu), phân tích riêng câu dạng \"chọn cả câu\" xem đã hiểu đúng mạch ý đoạn chưa.", case:"Part 6 chỉ có 16 câu nhưng lại bị nhiều thí sinh bỏ qua ôn luyện kỹ — trong khi đây là phần tương đối dễ lấy điểm nếu nắm vững ngữ pháp theo ngữ cảnh.", task:"Làm 2 đoạn Part 6 (8 câu), phân tích riêng câu dạng \"chọn cả câu\" xem đã hiểu đúng mạch ý đoạn chưa.", days:[
{label:'Thứ 2', title:'Cấu trúc Part 6 & khác biệt với Part 5', content:'Part 6 gồm 4 đoạn văn, mỗi đoạn có 4 chỗ trống, tổng 16 câu. Giống Part 5 về hình thức (chọn từ điền vào chỗ trống), nhưng Part 6 đặt trong NGỮ CẢNH đoạn văn — cần đọc câu trước/sau chỗ trống, thậm chí cả đoạn, mới chọn được đáp án đúng, khác Part 5 chỉ cần đọc đúng 1 câu chứa chỗ trống. Nhiều thí sinh áp dụng sai chiến thuật Part 5 (chỉ đọc câu chứa chỗ trống) vào Part 6 và bị sai vì bỏ lỡ ngữ cảnh quan trọng.', exercises:["Làm 1 đoạn Part 6 (4 câu), thử áp dụng chiến thuật CHỈ đọc câu chứa chỗ trống như Part 5 và ghi lại kết quả.","Làm lại đúng đoạn đó nhưng đọc toàn bộ đoạn văn trước khi chọn đáp án, so sánh kết quả với cách làm trước.","Liệt kê 3 điểm khác biệt cụ thể giữa cách làm Part 5 và Part 6.","Đọc 2 đoạn văn Part 6 mẫu, gạch chân các câu ngay trước/sau mỗi chỗ trống để thấy rõ mối liên hệ ngữ cảnh.","Ghi chú lại 1 trường hợp cụ thể mà đáp án chỉ có thể xác định đúng nhờ đọc cả đoạn, không thể chỉ dựa vào 1 câu."], quiz:[
{q:"Part 6 có tổng cộng bao nhiêu câu hỏi?", opts:["8", "16", "30", "54"], correct:1, explain:"Part 6 gồm 4 đoạn văn, mỗi đoạn 4 câu, tổng 16 câu."},
{q:"Part 6 giống Part 5 ở điểm nào?", opts:["Không giống gì cả", "Đều là dạng chọn từ điền vào chỗ trống", "Đều là bài nghe", "Đều không có đáp án lựa chọn"], correct:1, explain:"Cả 2 Part đều yêu cầu chọn đáp án đúng điền vào chỗ trống, khác về ngữ cảnh."},
{q:"Khác biệt cốt lõi giữa Part 5 và Part 6 là gì?", opts:["Không có khác biệt", "Part 6 đặt trong ngữ cảnh đoạn văn, cần đọc câu trước/sau; Part 5 chỉ cần đọc 1 câu chứa chỗ trống", "Part 5 khó hơn Part 6", "Part 6 không có đáp án lựa chọn"], correct:1, explain:"Đây là khác biệt quan trọng nhất quyết định chiến thuật làm bài."},
{q:"Vì sao nhiều thí sinh làm sai Part 6 dù giỏi Part 5?", opts:["Không có lý do gì", "Vì áp dụng sai chiến thuật chỉ đọc 1 câu như Part 5, bỏ lỡ ngữ cảnh quan trọng", "Vì Part 6 luôn khó hơn tuyệt đối", "Vì từ vựng Part 6 khó hơn nhiều"], correct:1, explain:"Đây là lỗi chiến thuật phổ biến nhất khi chuyển từ Part 5 sang Part 6."},
{q:"Part 6 gồm bao nhiêu đoạn văn?", opts:["1", "2", "4", "10"], correct:2, explain:"Part 6 có 4 đoạn văn, mỗi đoạn 4 chỗ trống."},
{q:"Nên đọc bao nhiêu phần của đoạn văn Part 6 trước khi chọn đáp án?", opts:["Chỉ câu chứa chỗ trống", "Toàn bộ đoạn văn hoặc ít nhất câu trước/sau chỗ trống", "Không cần đọc gì", "Chỉ đọc câu cuối cùng"], correct:1, explain:"Cần đọc rộng hơn 1 câu để nắm được ngữ cảnh quyết định đáp án đúng."},
{q:"Việc so sánh 2 cách làm (chỉ đọc 1 câu vs đọc cả đoạn) có mục đích gì?", opts:["Không có mục đích gì", "Trực tiếp cảm nhận sự khác biệt về độ chính xác giữa 2 chiến thuật", "Chỉ để tốn thời gian", "Không liên quan đến việc học"], correct:1, explain:"Trải nghiệm trực tiếp giúp ghi nhớ sâu hơn tầm quan trọng của ngữ cảnh."},
{q:"Gạch chân câu trước/sau chỗ trống có tác dụng gì khi luyện tập?", opts:["Không có tác dụng gì", "Trực quan hóa mối liên hệ ngữ cảnh giữa các câu, hỗ trợ chọn đáp án chính xác", "Chỉ để trang trí bài làm", "Làm mất thời gian không cần thiết"], correct:1, explain:"Đây là kỹ thuật hỗ trợ hình dung rõ mối liên kết logic giữa các câu."},
{q:"Có trường hợp nào đáp án Part 6 CHỈ xác định đúng nhờ đọc cả đoạn không?", opts:["Không bao giờ có trường hợp này", "Có, đây là lý do chính vì sao Part 6 khác biệt với Part 5", "Luôn có thể xác định chỉ với 1 câu", "Không liên quan đến ngữ cảnh"], correct:1, explain:"Đây chính là bản chất của Part 6, phân biệt rõ với cách làm Part 5."},
{q:"Thời gian trung bình làm Part 6 so với Part 5 nên như thế nào?", opts:["Giống hệt nhau", "Thường chậm hơn 1 chút vì cần đọc hiểu ngữ cảnh, nhưng vẫn cần kiểm soát thời gian", "Luôn nhanh hơn Part 5", "Không cần quan tâm thời gian"], correct:1, explain:"Đọc ngữ cảnh cần thêm thời gian, nhưng vẫn phải quản lý tổng thời gian Reading hợp lý."},

{label:'Thứ 3', title:'Dạng câu hỏi chọn cả câu hoàn chỉnh', content:'Part 6 có 1 dạng câu hỏi đặc biệt không xuất hiện ở Part 5: chọn CẢ 1 CÂU HOÀN CHỈNH (không phải chỉ 1 từ) để điền vào chỗ trống — dạng này chiếm khoảng 1 câu trong mỗi đoạn 4 câu. Để làm đúng dạng này, cần hiểu được MẠCH Ý của cả đoạn văn: câu được chọn phải logic về nội dung VÀ liên kết mượt mà với câu trước/sau nó, không chỉ đúng ngữ pháp đơn thuần.', exercises:["Làm 2 đoạn Part 6, xác định rõ câu nào là dạng \"chọn cả câu\" trong mỗi đoạn.","Với mỗi câu dạng này, thử tự tóm tắt ý chính của đoạn văn trước khi chọn đáp án.","Phân tích 4 đáp án của 1 câu \"chọn cả câu\" mẫu, giải thích vì sao 3 đáp án còn lại sai (dù ngữ pháp đúng).","Viết ra 2 tiêu chí cần kiểm tra khi làm dạng câu hỏi này: logic nội dung và liên kết mạch văn.","Thử tự viết 1 đoạn văn ngắn (4-5 câu) rồi xóa đi 1 câu, xem việc chọn lại câu đó có dễ dàng nếu chỉ dựa vào ngữ pháp không."], quiz:[
{q:"Dạng câu hỏi \"chọn cả câu\" trong Part 6 khác gì so với các câu còn lại?", opts:["Không khác gì", "Yêu cầu chọn cả 1 câu hoàn chỉnh thay vì chỉ 1 từ đơn lẻ", "Không có đáp án lựa chọn", "Chỉ xuất hiện ở Part 5"], correct:1, explain:"Đây là dạng đặc biệt chỉ có ở Part 6, không xuất hiện ở Part 5."},
{q:"Dạng câu hỏi \"chọn cả câu\" xuất hiện với tần suất nào trong mỗi đoạn 4 câu?", opts:["Không bao giờ xuất hiện", "Thường khoảng 1 câu trong mỗi đoạn", "Luôn chiếm cả 4 câu", "Chỉ xuất hiện ở đoạn cuối cùng"], correct:1, explain:"Thông thường mỗi đoạn 4 câu sẽ có khoảng 1 câu thuộc dạng chọn cả câu."},
{q:"Để làm đúng dạng \"chọn cả câu\", cần dựa vào yếu tố nào?", opts:["Chỉ cần đúng ngữ pháp", "Câu được chọn phải logic về nội dung VÀ liên kết mượt mà với câu trước/sau", "Chỉ cần độ dài câu phù hợp", "Không cần yếu tố cụ thể nào"], correct:1, explain:"Cả logic nội dung và sự liên kết mạch văn đều quan trọng, không chỉ ngữ pháp đúng."},
{q:"Vì sao 1 đáp án có thể đúng ngữ pháp nhưng vẫn sai trong dạng \"chọn cả câu\"?", opts:["Không thể xảy ra trường hợp này", "Vì nội dung câu đó không phù hợp mạch ý của đoạn văn dù ngữ pháp không sai", "Ngữ pháp luôn là yếu tố duy nhất quyết định", "Đáp án đúng ngữ pháp luôn là đáp án đúng"], correct:1, explain:"Đây là bẫy phổ biến: đáp án gây nhiễu thường đúng ngữ pháp nhưng sai về nội dung/logic."},
{q:"Tóm tắt ý chính đoạn văn trước khi chọn đáp án \"chọn cả câu\" có ích lợi gì?", opts:["Không có ích lợi gì", "Giúp định hướng đúng loại thông tin/logic câu cần điền vào phải phù hợp", "Chỉ tốn thêm thời gian không cần thiết", "Không liên quan đến việc chọn đáp án"], correct:1, explain:"Nắm ý chính giúp lọc nhanh các đáp án không phù hợp mạch nội dung."},
{q:"Việc tự viết đoạn văn rồi xóa 1 câu để luyện tập có mục đích gì?", opts:["Không có mục đích cụ thể", "Trải nghiệm từ góc độ người viết để hiểu rõ hơn cách 1 câu liên kết với đoạn văn", "Chỉ để luyện viết tiếng Anh", "Không liên quan đến kỹ năng đọc"], correct:1, explain:"Hiểu cách xây dựng đoạn văn giúp nhận diện tốt hơn khi phải chọn lại câu phù hợp."},
{q:"Kỹ năng cần thiết nhất cho dạng câu hỏi \"chọn cả câu\" là gì?", opts:["Chỉ cần từ vựng phong phú", "Đọc hiểu và nắm bắt mạch ý (coherence) của đoạn văn", "Chỉ cần ngữ pháp chính xác", "Chỉ cần tốc độ đọc nhanh"], correct:1, explain:"Khả năng nắm mạch ý đoạn văn là kỹ năng quyết định cho dạng câu hỏi này."},
{q:"4 đáp án trong 1 câu hỏi \"chọn cả câu\" thường có đặc điểm gì?", opts:["Đều hoàn toàn giống nhau", "Thường đều là câu hoàn chỉnh về ngữ pháp, nhưng chỉ 1 câu phù hợp về logic/nội dung", "Luôn có 1 đáp án sai ngữ pháp rõ ràng", "Không có quy luật chung nào"], correct:1, explain:"Bẫy chính nằm ở việc phân biệt logic nội dung, không phải ngữ pháp."},
{q:"Dạng câu hỏi \"chọn cả câu\" kiểm tra kỹ năng gì cao hơn so với câu hỏi điền từ đơn?", opts:["Không kiểm tra kỹ năng gì đặc biệt", "Khả năng đọc hiểu tổng thể và tư duy logic văn bản", "Chỉ kiểm tra vốn từ vựng", "Chỉ kiểm tra tốc độ đọc"], correct:1, explain:"Đây là dạng câu hỏi đòi hỏi kỹ năng đọc hiểu ở mức cao hơn điền từ đơn thuần."},
{q:"Nên phân bổ thời gian thế nào cho câu hỏi \"chọn cả câu\" so với câu điền từ đơn?", opts:["Dành ít thời gian hơn vì đơn giản hơn", "Có thể cần nhiều thời gian hơn 1 chút vì phải đọc hiểu ngữ cảnh sâu hơn", "Thời gian như nhau tuyệt đối cho mọi câu", "Không cần phân bổ thời gian cụ thể"], correct:1, explain:"Độ phức tạp cao hơn có thể đòi hỏi thêm chút thời gian xử lý so với câu điền từ đơn giản."},

{label:'Thứ 4', title:'Từ nối & quan hệ logic giữa các câu', content:'Chú ý các từ nối (however, therefore, in addition, as a result) vì chúng gợi ý quan hệ logic giữa các câu — đây là manh mối quan trọng để chọn đúng đáp án, đặc biệt với câu hỏi yêu cầu điền từ nối vào chỗ trống. \"However\" báo hiệu ý tương phản với câu trước, \"therefore\" báo hiệu kết quả/hệ quả, \"in addition\" báo hiệu bổ sung thêm ý cùng chiều. Nhận diện đúng quan hệ logic giúp loại trừ nhanh các đáp án sai.', exercises:["Học 8 từ nối phổ biến trong Part 6 (however, therefore, in addition, as a result, meanwhile, consequently, otherwise, furthermore) kèm nghĩa và cách dùng.","Làm 2 đoạn Part 6 có chứa chỗ trống là từ nối, phân tích quan hệ logic giữa 2 câu liên quan.","Viết 4 cặp câu ví dụ, mỗi cặp dùng 1 từ nối khác nhau trong 8 từ đã học.","Phân biệt \"however\" (tương phản) và \"in addition\" (bổ sung) qua 3 cặp câu ví dụ cụ thể.","Tự kiểm tra: che đáp án, chỉ đọc 2 câu liên quan, tự đoán từ nối phù hợp trước khi xem đáp án thật."], quiz:[
{q:"\"however\" trong đoạn văn thường báo hiệu quan hệ gì giữa 2 câu?", opts:["Bổ sung ý cùng chiều", "Tương phản với ý trước đó", "Kết quả/hệ quả", "Không có quan hệ logic nào"], correct:1, explain:"\"however\" (tuy nhiên) là từ nối chỉ sự tương phản."},
{q:"\"therefore\" trong đoạn văn thường báo hiệu quan hệ gì?", opts:["Tương phản", "Kết quả/hệ quả của điều vừa nêu", "Bổ sung thông tin", "Không có ý nghĩa cụ thể"], correct:1, explain:"\"therefore\" (vì vậy) chỉ mối quan hệ nguyên nhân-kết quả."},
{q:"\"in addition\" dùng để làm gì?", opts:["Chỉ sự tương phản", "Bổ sung thêm ý cùng chiều với câu trước", "Chỉ kết quả", "Chỉ thời gian"], correct:1, explain:"\"in addition\" (thêm vào đó) dùng để bổ sung thông tin cùng hướng."},
{q:"\"as a result\" có nghĩa và chức năng tương tự từ nối nào?", opts:["however", "therefore", "meanwhile", "otherwise"], correct:1, explain:"\"as a result\" và \"therefore\" đều diễn tả quan hệ kết quả."},
{q:"\"meanwhile\" thường dùng để chỉ điều gì?", opts:["Sự tương phản mạnh", "Một sự việc xảy ra đồng thời hoặc song song", "Kết quả cuối cùng", "Sự kết thúc"], correct:1, explain:"\"meanwhile\" (trong khi đó) chỉ 2 sự việc diễn ra cùng lúc."},
{q:"\"otherwise\" mang ý nghĩa gì trong câu?", opts:["Nếu không thì (điều kiện ngược lại)", "Bổ sung thông tin", "Kết quả trực tiếp", "Đồng thời"], correct:0, explain:"\"otherwise\" (nếu không thì) diễn tả điều kiện ngược lại với điều vừa nêu."},
{q:"Nhận diện đúng quan hệ logic giữa các câu giúp ích gì khi chọn từ nối?", opts:["Không giúp ích gì", "Loại trừ nhanh các đáp án không phù hợp về mặt ý nghĩa logic", "Chỉ giúp đọc nhanh hơn", "Không liên quan đến việc chọn đáp án"], correct:1, explain:"Hiểu đúng quan hệ logic là chìa khóa để chọn đúng từ nối phù hợp."},
{q:"\"furthermore\" có chức năng gần giống từ nối nào đã học?", opts:["however", "in addition", "therefore", "otherwise"], correct:1, explain:"\"furthermore\" và \"in addition\" đều dùng để bổ sung thông tin cùng chiều."},
{q:"Nếu câu trước nói về khó khăn và câu sau nói về giải pháp thành công, từ nối nào phù hợp nhất?", opts:["in addition", "however (chỉ sự tương phản/chuyển hướng tích cực)", "meanwhile", "furthermore"], correct:1, explain:"\"however\" phù hợp để chuyển từ ý khó khăn sang ý tương phản (giải pháp/thành công)."},
{q:"Việc tự đoán từ nối trước khi xem đáp án (che đáp án) có tác dụng gì?", opts:["Không có tác dụng gì", "Tự kiểm tra khả năng nhận diện quan hệ logic độc lập, củng cố kỹ năng thực sự", "Chỉ để giải trí", "Làm bài chậm hơn không cần thiết"], correct:1, explain:"Tự đoán trước là cách luyện tập chủ động, hiệu quả hơn chỉ đọc đáp án thụ động."},
], vocab:[

{label:'Thứ 5', title:'Thì động từ theo ngữ cảnh cả đoạn', content:'Thì động từ trong Part 6 phụ thuộc ngữ cảnh THỜI GIAN của cả đoạn văn, không chỉ câu chứa chỗ trống — ví dụ nếu đoạn văn đang kể về sự kiện đã xảy ra (dùng quá khứ ở các câu khác), chỗ trống thường cũng cần chia ở thì quá khứ dù bản thân câu đó không có dấu hiệu thời gian rõ ràng. Đây là điểm khác biệt quan trọng so với Part 5, nơi dấu hiệu thời gian luôn nằm ngay trong câu chứa chỗ trống.', exercises:["Làm 2 đoạn Part 6 có câu hỏi về thì động từ, xác định thì của các câu XUNG QUANH chỗ trống trước khi chọn đáp án.","Tìm 1 đoạn văn Part 6 mà chỗ trống không có dấu hiệu thời gian rõ ràng trong chính câu đó, chỉ ra ngữ cảnh nào giúp xác định đúng thì.","Viết 1 đoạn văn ngắn (4-5 câu) nhất quán 1 thì duy nhất (ví dụ toàn bộ thì quá khứ) để luyện cảm nhận sự nhất quán thời gian trong đoạn văn.","So sánh cách xác định thì động từ giữa Part 5 (dựa vào dấu hiệu trong câu) và Part 6 (dựa vào ngữ cảnh cả đoạn).","Phân tích 2 câu bạn từng làm sai về thì động từ trong Part 6, xác định đã bỏ lỡ ngữ cảnh nào."], quiz:[
{q:"Thì động từ trong Part 6 phụ thuộc chủ yếu vào điều gì?", opts:["Chỉ dấu hiệu trong chính câu chứa chỗ trống", "Ngữ cảnh thời gian của cả đoạn văn", "Không có quy tắc cụ thể", "Luôn là thì hiện tại đơn"], correct:1, explain:"Khác Part 5, Part 6 cần xét ngữ cảnh thời gian của toàn đoạn."},
{q:"Nếu đoạn văn đang kể chuyện đã xảy ra (dùng thì quá khứ), chỗ trống thường cần thì gì?", opts:["Luôn là thì hiện tại", "Thường cũng ở thì quá khứ để nhất quán với ngữ cảnh", "Luôn là thì tương lai", "Không liên quan đến thì của đoạn văn"], correct:1, explain:"Tính nhất quán thời gian trong đoạn văn là nguyên tắc quan trọng."},
{q:"Vì sao xác định thì trong Part 6 khó hơn Part 5?", opts:["Không khó hơn", "Vì dấu hiệu thời gian có thể nằm ở CÂU KHÁC, không phải câu chứa chỗ trống", "Part 6 luôn có ít thì hơn", "Part 5 không có thì động từ"], correct:1, explain:"Đây là điểm khác biệt quan trọng cần đặc biệt lưu ý khi làm Part 6."},
{q:"Đọc các câu XUNG QUANH chỗ trống giúp ích gì cho việc chọn thì đúng?", opts:["Không giúp ích gì", "Xác định được ngữ cảnh thời gian chung của đoạn văn để chọn thì nhất quán", "Chỉ giúp đọc nhanh hơn", "Không liên quan đến ngữ pháp"], correct:1, explain:"Ngữ cảnh xung quanh cung cấp manh mối quan trọng về thì cần dùng."},
{q:"Viết 1 đoạn văn nhất quán 1 thì duy nhất có tác dụng luyện tập gì?", opts:["Không có tác dụng gì", "Cảm nhận trực tiếp sự nhất quán thời gian cần có trong 1 đoạn văn mạch lạc", "Chỉ luyện kỹ năng viết", "Không liên quan đến đọc hiểu"], correct:1, explain:"Trải nghiệm từ góc độ người viết giúp hiểu sâu hơn về tính nhất quán thời gian."},
{q:"So với Part 5, cách xác định thì động từ ở Part 6 khác biệt ở đâu?", opts:["Không có khác biệt", "Part 5 dựa vào dấu hiệu trong chính câu; Part 6 dựa vào ngữ cảnh cả đoạn", "Part 6 không cần xác định thì", "Part 5 luôn khó hơn Part 6 về thì động từ"], correct:1, explain:"Đây là khác biệt cốt lõi giữa 2 Part về cách tiếp cận câu hỏi thì động từ."},
{q:"Nếu 1 câu trong Part 6 không có dấu hiệu thời gian rõ ràng, nên làm gì?", opts:["Đoán ngẫu nhiên", "Tìm dấu hiệu thời gian ở các câu lân cận trong đoạn văn", "Bỏ qua câu đó", "Luôn chọn thì hiện tại đơn"], correct:1, explain:"Cần mở rộng phạm vi tìm kiếm dấu hiệu ra toàn bộ đoạn văn."},
{q:"Phân tích lỗi sai về thì động từ trong Part 6 giúp ích gì?", opts:["Không có ích gì", "Xác định xem đã bỏ lỡ ngữ cảnh nào dẫn đến chọn sai thì", "Chỉ để thống kê", "Không liên quan đến cải thiện kỹ năng"], correct:1, explain:"Hiểu rõ nguyên nhân cụ thể giúp tránh lặp lại lỗi tương tự."},
{q:"Tính nhất quán thời gian trong 1 đoạn văn có phải luôn tuyệt đối không?", opts:["Luôn tuyệt đối 100% không có ngoại lệ", "Thường nhất quán nhưng có thể có ngoại lệ khi ngữ cảnh thực sự đổi mốc thời gian", "Không có quy tắc nào về tính nhất quán", "Không liên quan đến việc làm bài"], correct:1, explain:"Phần lớn trường hợp nhất quán, nhưng cần đọc kỹ để phát hiện ngoại lệ hợp lý khi có."},
{q:"Kỹ năng xác định thì theo ngữ cảnh cả đoạn có áp dụng cho Part 7 sau này không?", opts:["Không liên quan gì", "Có, kỹ năng đọc hiểu ngữ cảnh rộng là nền tảng chung cho cả Part 6 và Part 7", "Chỉ áp dụng cho Part 6", "Part 7 không cần hiểu ngữ cảnh"], correct:1, explain:"Đọc hiểu theo ngữ cảnh rộng là kỹ năng nền tảng dùng chung cho các Part đọc hiểu nâng cao."},

{label:'Thứ 6', title:'Tổng kết tuần 11', content:'Part 6 chỉ có 16 câu nhưng lại bị nhiều thí sinh bỏ qua ôn luyện kỹ — trong khi đây là phần tương đối dễ lấy điểm nếu nắm vững ngữ pháp theo ngữ cảnh. Làm Part 6 chậm hơn Part 5 một chút vì cần đọc hiểu ngữ cảnh, nhưng vẫn cần kiểm soát thời gian hợp lý trong tổng thời gian làm Reading. 4 kỹ năng cốt lõi: đọc hiểu ngữ cảnh cả đoạn, xử lý câu \"chọn cả câu\", nhận diện từ nối, và xác định thì theo ngữ cảnh.', exercises:["Làm 1 bộ đề Part 6 đầy đủ (4 đoạn, 16 câu), tính giờ và chấm điểm.","Phân loại lỗi sai theo 4 kỹ năng đã học: ngữ cảnh chung, chọn cả câu, từ nối, thì động từ theo ngữ cảnh.","So sánh thời gian trung bình làm 1 câu Part 6 với 1 câu Part 5, xem có đang làm quá chậm không.","Tổng hợp lại 8 từ nối đã học tuần này thành 1 bảng ghi nhớ riêng.","Viết 1 đoạn ngắn tự đánh giá: bạn thấy Part 6 dễ hay khó hơn Part 5, vì sao."], quiz:[
{q:"Chủ đề trọng tâm tuần 11 tháng 2 là gì?", opts:["Listening Part 4", "Reading Part 6 — đoạn văn điền từ", "Từ vựng Part 1", "Ngữ pháp cơ bản Part 5"], correct:1, explain:"Tuần 11 tập trung toàn diện vào kỹ năng làm Part 6."},
{q:"4 kỹ năng chính đã học trong tuần 11 là gì?", opts:["Không có kỹ năng cụ thể nào", "Đọc hiểu ngữ cảnh cả đoạn, xử lý câu chọn cả câu, nhận diện từ nối, xác định thì theo ngữ cảnh", "Chỉ có 1 kỹ năng duy nhất", "Chỉ liên quan đến từ vựng"], correct:1, explain:"Đây là 4 trụ cột kỹ năng đã luyện tập xuyên suốt tuần 11."},
{q:"Vì sao Part 6 được coi là phần \"dễ lấy điểm\" nếu ôn đúng cách dù ít câu?", opts:["Không dễ lấy điểm", "Chỉ 16 câu nhưng bản chất vẫn là ngữ pháp/từ vựng quen thuộc, chỉ cần thêm kỹ năng đọc ngữ cảnh", "Vì Part 6 không có gì mới cần học", "Vì đáp án luôn dễ đoán"], correct:1, explain:"Nắm vững ngữ pháp Part 5 kết hợp thêm kỹ năng đọc ngữ cảnh sẽ giải quyết tốt Part 6."},
{q:"Vì sao nhiều thí sinh bỏ qua ôn luyện kỹ Part 6?", opts:["Vì Part 6 không xuất hiện trong đề thi", "Vì ít câu hỏi (chỉ 16 câu) nên dễ bị xem nhẹ so với các Part khác", "Vì Part 6 quá dễ không cần ôn", "Vì Part 6 không tính điểm"], correct:1, explain:"Số lượng câu ít khiến nhiều người đánh giá thấp tầm quan trọng của việc ôn luyện kỹ."},
{q:"So sánh thời gian làm 1 câu Part 6 và Part 5 có mục đích gì?", opts:["Không có mục đích gì", "Kiểm tra xem có đang làm Part 6 quá chậm, ảnh hưởng đến quỹ thời gian tổng thể không", "Chỉ để so sánh cho vui", "Không liên quan đến quản lý thời gian"], correct:1, explain:"Quản lý thời gian hợp lý giữa các Part là kỹ năng quan trọng cho toàn bộ bài thi."},
{q:"Bảng ghi nhớ 8 từ nối đã học có tác dụng gì lâu dài?", opts:["Không có tác dụng gì", "Tài liệu tra cứu nhanh để ôn tập định kỳ, tránh quên kiến thức đã học", "Chỉ để trang trí", "Chỉ dùng 1 lần rồi bỏ"], correct:1, explain:"Tổng hợp kiến thức thành tài liệu riêng giúp ôn tập hiệu quả về lâu dài."},
{q:"Việc tự đánh giá Part 6 dễ hay khó hơn Part 5 giúp ích gì?", opts:["Không có ích gì", "Hiểu rõ cảm nhận cá nhân về độ khó, từ đó điều chỉnh thời gian ôn tập phù hợp", "Chỉ để viết cho có", "Không liên quan đến chiến lược học"], correct:1, explain:"Tự nhận thức về độ khó cá nhân giúp phân bổ nguồn lực ôn tập hợp lý hơn."},
{q:"Sau tuần 11, phần nào của Reading đã được học đầy đủ chiến thuật?", opts:["Chỉ mới học Part 5", "Đã học đầy đủ Part 5 và Part 6", "Chưa học phần Reading nào", "Đã học hết toàn bộ Reading kể cả Part 7"], correct:1, explain:"Sau tuần 11, Part 5 và Part 6 đã được trang bị đầy đủ chiến thuật, Part 7 sẽ học sau."},
{q:"Tuần 12 sắp tới sẽ tập trung vào chủ đề gì theo lộ trình?", opts:["Tiếp tục Reading Part 6", "Từ vựng mở rộng và tổng kết tháng 2", "Bắt đầu học Part 7", "Ngừng học TOEIC"], correct:1, explain:"Tuần 12 sẽ tổng kết tháng 2 với từ vựng mở rộng và ôn tập tổng hợp."},
{q:"Kỹ năng đọc hiểu ngữ cảnh học được ở Part 6 có ý nghĩa gì cho việc học Part 7 sắp tới?", opts:["Không liên quan gì", "Là nền tảng quan trọng vì Part 7 đòi hỏi đọc hiểu đoạn văn dài hơn nhiều so với Part 6", "Part 7 không cần đọc hiểu ngữ cảnh", "Part 6 và Part 7 hoàn toàn độc lập"], correct:1, explain:"Kỹ năng đọc hiểu ngữ cảnh từ Part 6 là bước đệm quan trọng chuẩn bị cho Part 7."},

{title:"Từ vựng mở rộng & tổng kết tháng 2", points:["Mở rộng từ vựng theo chủ đề: tài chính, nhân sự, sản xuất, du lịch công tác.","Học từ vựng theo cụm (collocation) thay vì từ đơn lẻ giúp nhớ lâu và dùng đúng ngữ cảnh hơn.","Ôn lại các câu sai của tháng 2, phân loại lỗi theo dạng (ngữ pháp/từ vựng/nghe không kịp).","Làm 1 đề mini tổng hợp cả 4 kỹ năng đã học (Part 1-4 Listening, Part 5-6 Reading).","Cuối tháng 2 nên đã quen với format và tốc độ của từng dạng câu hỏi."], practice:"Làm 1 đề mini đầy đủ hơn (khoảng 50 câu, đủ Part 1-6), so sánh điểm với đề thử tháng 1.", case:"Nhiều đề thi thật lặp lại các chủ đề quen thuộc (họp hành, du lịch công tác, tuyển dụng) — học từ vựng đúng chủ đề tiết kiệm thời gian hơn học từ vựng ngẫu nhiên.", task:"Làm 1 đề mini đầy đủ hơn (khoảng 50 câu, đủ Part 1-6), so sánh điểm với đề thử tháng 1.", days:[
{label:'Thứ 2', title:'Từ vựng chủ đề tài chính & nhân sự', content:'Mở rộng từ vựng theo chủ đề tài chính (budget, invoice, revenue, expense) và nhân sự (recruitment, resignation, promotion, benefits) — đây là 2 chủ đề rất phổ biến trong cả Listening và Reading của TOEIC. Học từ vựng theo cụm (collocation) thay vì từ đơn lẻ giúp nhớ lâu và dùng đúng ngữ cảnh hơn, ví dụ \"submit an invoice\" thay vì chỉ học riêng từ \"invoice\".', exercises:["Học 10 từ vựng chủ đề tài chính (budget, invoice, revenue, expense, profit...) kèm 1 collocation cho mỗi từ.","Học 10 từ vựng chủ đề nhân sự (recruitment, resignation, promotion, benefits, applicant...) kèm 1 collocation cho mỗi từ.","Viết 5 câu ví dụ sử dụng ít nhất 1 từ vựng tài chính và 1 từ vựng nhân sự trong mỗi câu.","Tìm 3 collocation khác liên quan tài chính bạn từng gặp trong các đề đã làm trước đó.","Ôn lại 20 từ vựng vừa học bằng flashcard, che nghĩa tiếng Việt và tự đoán lại."], quiz:[
{q:"\"invoice\" nghĩa là gì?", opts:["Ngân sách", "Hóa đơn", "Doanh thu", "Chi phí"], correct:1, explain:"\"invoice\" là hóa đơn, chứng từ yêu cầu thanh toán."},
{q:"\"budget\" nghĩa là gì?", opts:["Ngân sách", "Hóa đơn", "Lợi nhuận", "Tuyển dụng"], correct:0, explain:"\"budget\" là ngân sách, kế hoạch chi tiêu."},
{q:"\"revenue\" nghĩa là gì?", opts:["Chi phí", "Doanh thu", "Nghỉ việc", "Thăng chức"], correct:1, explain:"\"revenue\" là doanh thu, tổng số tiền thu được."},
{q:"\"resignation\" nghĩa là gì?", opts:["Thăng chức", "Tuyển dụng", "Nghỉ việc/từ chức", "Phúc lợi"], correct:2, explain:"\"resignation\" là việc từ chức hoặc nghỉ việc."},
{q:"\"promotion\" trong ngữ cảnh nhân sự nghĩa là gì?", opts:["Quảng cáo sản phẩm", "Thăng chức", "Giảm giá", "Nghỉ phép"], correct:1, explain:"Trong ngữ cảnh nhân sự, \"promotion\" nghĩa là thăng chức."},
{q:"\"benefits\" trong ngữ cảnh công việc thường chỉ điều gì?", opts:["Lợi ích cá nhân ngẫu nhiên", "Các phúc lợi nhân viên (bảo hiểm, nghỉ phép...)", "Lương cơ bản", "Giờ làm việc"], correct:1, explain:"\"benefits\" chỉ các quyền lợi/phúc lợi mà nhân viên được hưởng."},
{q:"Cụm từ \"submit an invoice\" nghĩa là gì?", opts:["Nộp hóa đơn", "Hủy hóa đơn", "In hóa đơn", "Xóa hóa đơn"], correct:0, explain:"\"submit\" nghĩa là nộp/gửi, kết hợp với \"invoice\" thành \"nộp hóa đơn\"."},
{q:"\"applicant\" nghĩa là gì?", opts:["Nhân viên hiện tại", "Người ứng tuyển", "Quản lý", "Khách hàng"], correct:1, explain:"\"applicant\" là người nộp đơn ứng tuyển vào 1 vị trí."},
{q:"Vì sao nên học từ vựng theo collocation thay vì từ đơn lẻ?", opts:["Không có lý do gì", "Giúp nhớ lâu hơn và dùng đúng ngữ cảnh thực tế hơn", "Học từ đơn lẻ luôn hiệu quả hơn", "Không liên quan đến hiệu quả học"], correct:1, explain:"Collocation phản ánh cách từ thực sự được dùng trong ngữ cảnh tự nhiên."},
{q:"\"expense\" nghĩa là gì?", opts:["Doanh thu", "Chi phí", "Lợi nhuận", "Ngân sách"], correct:1, explain:"\"expense\" là chi phí, khoản tiền phải chi trả."},

{label:'Thứ 3', title:'Từ vựng chủ đề sản xuất & du lịch công tác', content:'Tiếp tục mở rộng từ vựng chủ đề sản xuất (manufacturing, inventory, quality control, shipment) và du lịch công tác (itinerary, accommodation, boarding pass, reimbursement) — đây là 2 chủ đề còn lại thường gặp trong đề thi TOEIC bên cạnh tài chính/nhân sự đã học hôm trước. Nhiều đề thi thật lặp lại các chủ đề quen thuộc này, nên học đúng trọng tâm tiết kiệm thời gian hơn học từ vựng ngẫu nhiên.', exercises:["Học 10 từ vựng chủ đề sản xuất (manufacturing, inventory, quality control, shipment, defect...).","Học 10 từ vựng chủ đề du lịch công tác (itinerary, accommodation, boarding pass, reimbursement...).","Viết 1 đoạn hội thoại ngắn giả định (4-5 câu) giữa 2 nhân viên đang bàn về chuyến công tác, dùng ít nhất 4 từ vừa học.","So sánh 4 chủ đề từ vựng đã học 2 ngày qua (tài chính, nhân sự, sản xuất, du lịch), xác định chủ đề bạn còn yếu nhất.","Tổng hợp toàn bộ 40 từ vựng của 2 ngày vào 1 danh sách theo 4 nhóm chủ đề riêng biệt."], quiz:[
{q:"\"manufacturing\" nghĩa là gì?", opts:["Sản xuất", "Du lịch", "Tài chính", "Tuyển dụng"], correct:0, explain:"\"manufacturing\" là ngành/hoạt động sản xuất."},
{q:"\"inventory\" nghĩa là gì?", opts:["Hàng tồn kho", "Hóa đơn", "Chuyến công tác", "Phúc lợi"], correct:0, explain:"\"inventory\" là hàng tồn kho, danh mục hàng hóa trong kho."},
{q:"\"quality control\" nghĩa là gì?", opts:["Kiểm soát chất lượng", "Kiểm soát ngân sách", "Kiểm soát nhân sự", "Kiểm soát thời gian"], correct:0, explain:"\"quality control\" là hoạt động kiểm soát/đảm bảo chất lượng sản phẩm."},
{q:"\"itinerary\" nghĩa là gì?", opts:["Hóa đơn", "Lịch trình chuyến đi", "Hợp đồng", "Đơn xin nghỉ"], correct:1, explain:"\"itinerary\" là lịch trình chi tiết của 1 chuyến đi."},
{q:"\"accommodation\" nghĩa là gì?", opts:["Chỗ ở/lưu trú", "Phương tiện di chuyển", "Vé máy bay", "Hộ chiếu"], correct:0, explain:"\"accommodation\" là chỗ ở, nơi lưu trú khi đi công tác/du lịch."},
{q:"\"reimbursement\" nghĩa là gì?", opts:["Tiền lương", "Hoàn tiền (chi phí đã ứng trước)", "Tiền thưởng", "Tiền phạt"], correct:1, explain:"\"reimbursement\" là việc hoàn lại tiền cho khoản chi phí đã tự ứng trước."},

{q:"Vì sao nhiều đề thi TOEIC lặp lại các chủ đề quen thuộc (họp hành, du lịch công tác, tuyển dụng)?", opts:["Không có lý do gì đặc biệt", "Vì đây là các tình huống công sở phổ biến, phản ánh đúng mục tiêu đánh giá của bài thi", "Vì đề thi thiếu sáng tạo", "Ngẫu nhiên không có chủ đích"], correct:1, explain:"TOEIC tập trung đánh giá khả năng giao tiếp tiếng Anh trong môi trường công sở thực tế."},

{label:'Thứ 4', title:'Ôn tập lỗi sai tháng 2 theo phân loại', content:'Ôn lại các câu sai của tháng 2, phân loại lỗi theo dạng (ngữ pháp/từ vựng/nghe không kịp) — việc phân loại có hệ thống giúp thấy rõ pattern lỗi lặp lại thay vì chỉ nhớ mơ hồ \"mình hay sai\". Nếu phần lớn lỗi thuộc 1 nhóm cụ thể (ví dụ luôn sai câu hỏi \"next action\" ở Part 3), đó chính là tín hiệu rõ ràng cần ưu tiên ôn tập nhóm đó trong thời gian tới.', exercises:["Tổng hợp lại toàn bộ câu sai đã ghi chú trong suốt tháng 2 (từ tuần 5 tháng 1 đến nay) vào 1 danh sách.","Phân loại các lỗi sai theo 3 nhóm: ngữ pháp, từ vựng, nghe không kịp/đọc không kịp thời gian.","Tính tỷ lệ % lỗi thuộc mỗi nhóm, xác định nhóm chiếm tỷ lệ cao nhất.","Với nhóm lỗi cao nhất, viết ra kế hoạch ôn tập cụ thể cho 2 tuần tới.","Làm lại 5 câu bạn từng sai (không xem đáp án cũ) để kiểm tra đã khắc phục được chưa."], quiz:[
{q:"Vì sao nên phân loại lỗi sai theo dạng (ngữ pháp/từ vựng/nghe không kịp)?", opts:["Không cần thiết", "Giúp thấy rõ pattern lỗi lặp lại để ôn tập đúng trọng tâm", "Chỉ để thống kê cho vui", "Làm mất thời gian không cần thiết"], correct:1, explain:"Phân loại có hệ thống giúp xác định chính xác nguyên nhân gốc rễ của lỗi."},
{q:"Nếu phần lớn lỗi thuộc 1 nhóm cụ thể, điều đó có ý nghĩa gì?", opts:["Không có ý nghĩa gì", "Đây là tín hiệu rõ ràng cần ưu tiên ôn tập nhóm đó trong thời gian tới", "Chỉ là ngẫu nhiên không cần quan tâm", "Nên bỏ qua nhóm đó vì đã quá quen thuộc"], correct:1, explain:"Pattern lỗi tập trung là chỉ dấu quan trọng để định hướng ôn tập hiệu quả."},
{q:"Việc tổng hợp toàn bộ câu sai từ tháng 1 đến tháng 2 có lợi ích gì?", opts:["Không có lợi ích gì", "Có cái nhìn tổng thể về xu hướng lỗi sai xuyên suốt quá trình học, không chỉ 1 thời điểm", "Chỉ để lưu trữ", "Làm mất thời gian không cần thiết"], correct:1, explain:"Nhìn tổng thể giúp phát hiện pattern dài hạn mà từng lần riêng lẻ khó nhận ra."},
{q:"Tính tỷ lệ % lỗi theo từng nhóm có tác dụng gì?", opts:["Không có tác dụng gì", "Định lượng hóa mức độ nghiêm trọng của từng loại lỗi, giúp ưu tiên đúng", "Chỉ để làm bài tập toán", "Không liên quan đến việc ôn tập"], correct:1, explain:"Định lượng cụ thể giúp đưa ra quyết định ưu tiên ôn tập dựa trên dữ liệu thực tế."},
{q:"Làm lại các câu từng sai (không xem đáp án cũ) có mục đích gì?", opts:["Không có mục đích gì", "Kiểm tra khách quan xem đã thực sự khắc phục được lỗi hay chưa", "Chỉ để ôn lại cho vui", "Luôn cho kết quả giống lần đầu"], correct:1, explain:"Đây là cách kiểm tra hiệu quả ôn tập một cách khách quan, tránh ảo tưởng đã học thuộc."},
{q:"Nếu vẫn sai lại câu đã từng sai trước đó, điều đó cho thấy gì?", opts:["Không có ý nghĩa gì", "Lỗi đó vẫn chưa thực sự được khắc phục, cần ôn sâu hơn nữa", "Đề bài có vấn đề", "Không cần quan tâm vì đã từng làm rồi"], correct:1, explain:"Sai lại là tín hiệu rõ ràng cho thấy cần đầu tư thêm thời gian ôn tập vào điểm đó."},
{q:"Ôn tập có phân loại hệ thống hiệu quả hơn ôn tập ngẫu nhiên như thế nào?", opts:["Không có sự khác biệt", "Tập trung đúng nguồn lực vào điểm yếu thực sự thay vì ôn dàn trải không trọng tâm", "Ôn ngẫu nhiên luôn hiệu quả hơn", "Không liên quan đến hiệu quả ôn tập"], correct:1, explain:"Ôn tập có mục tiêu rõ ràng luôn hiệu quả hơn ôn tập không có định hướng."},
{q:"Kế hoạch ôn tập cụ thể cho nhóm lỗi cao nhất nên bao gồm điều gì?", opts:["Không cần lên kế hoạch cụ thể", "Xác định rõ nội dung cần ôn, thời gian dành cho việc ôn, và cách tự kiểm tra tiến bộ", "Chỉ cần ý định chung chung", "Chỉ cần nhớ trong đầu không cần viết ra"], correct:1, explain:"Kế hoạch cụ thể, có thể đo lường được sẽ hiệu quả hơn ý định mơ hồ."},
{q:"Việc ghi chú lỗi sai ngay khi làm bài (thay vì để sau) có lợi ích gì?", opts:["Không có lợi ích gì", "Ghi lại khi còn nhớ rõ ngữ cảnh và lý do sai, chính xác hơn nhớ lại sau này", "Chỉ tốn thêm thời gian làm bài", "Không ảnh hưởng đến chất lượng ghi chú"], correct:1, explain:"Ghi chú ngay lập tức giữ được độ chính xác cao hơn về nguyên nhân sai."},
{q:"Phân loại lỗi là \"nghe không kịp\" khác gì với lỗi \"từ vựng\"?", opts:["Không có khác biệt gì", "\"Nghe không kịp\" liên quan tốc độ xử lý; \"từ vựng\" liên quan việc chưa biết nghĩa từ", "Cả 2 đều giống hệt nhau về nguyên nhân", "Không thể phân biệt được 2 loại lỗi này"], correct:1, explain:"2 loại lỗi có nguyên nhân gốc khác nhau, cần giải pháp ôn tập khác nhau."},

{label:'Thứ 5', title:'Luyện đề mini tổng hợp Part 1-6', content:'Làm 1 đề mini tổng hợp cả 4 kỹ năng đã học (Part 1-4 Listening, Part 5-6 Reading) — đây là bài kiểm tra toàn diện đầu tiên kết hợp đầy đủ các Part đã ôn luyện trong cả tháng 1 và tháng 2. Cuối tháng 2 nên đã quen với format và tốc độ của từng dạng câu hỏi, nên đề mini này nên được làm có tính giờ nghiêm túc để đánh giá đúng năng lực thực tế tại thời điểm này.', exercises:["Làm 1 đề mini khoảng 50 câu (đủ Part 1-6), tính giờ nghiêm túc như thi thật.","Chấm điểm chi tiết theo từng Part, không chỉ tổng điểm chung.","So sánh điểm số với đề thử ở tuần 1 tháng 1, tính mức độ tiến bộ theo từng Part.","Xác định Part nào tiến bộ rõ rệt nhất và Part nào còn ít cải thiện nhất.","Viết ra 3 nguyên nhân có thể lý giải cho Part còn ít tiến bộ nhất."], quiz:[
{q:"Đề mini tổng hợp cuối tháng 2 nên bao gồm những Part nào?", opts:["Chỉ Part 7", "Part 1-4 Listening và Part 5-6 Reading", "Chỉ Part 1", "Toàn bộ 7 Part kể cả Part 7 chưa học"], correct:1, explain:"Đề mini nên tập trung đúng các Part đã học sâu trong tháng 1-2."},
{q:"Vì sao nên làm đề mini có tính giờ nghiêm túc?", opts:["Không cần thiết", "Để đánh giá đúng năng lực thực tế trong điều kiện áp lực thời gian giống thi thật", "Chỉ để tiết kiệm thời gian", "Không ảnh hưởng đến độ chính xác đánh giá"], correct:1, explain:"Điều kiện làm bài càng giống thi thật, kết quả đánh giá càng chính xác."},
{q:"So sánh điểm đề mini với đề thử tuần 1 tháng 1 có mục đích gì?", opts:["Không có mục đích gì", "Đo lường mức độ tiến bộ cụ thể sau 2 tháng học tập", "Chỉ để so sánh cho vui", "Gây áp lực không cần thiết"], correct:1, explain:"So sánh với điểm khởi đầu là thước đo khách quan nhất cho sự tiến bộ."},
{q:"Chấm điểm chi tiết theo từng Part quan trọng hơn chỉ xem tổng điểm ở điểm nào?", opts:["Không quan trọng hơn", "Cho biết chính xác Part nào cần cải thiện thêm, thay vì chỉ biết điểm tổng chung chung", "Tổng điểm luôn đủ thông tin", "Không có sự khác biệt về giá trị thông tin"], correct:1, explain:"Điểm chi tiết theo Part cung cấp thông tin actionable hơn tổng điểm đơn thuần."},
{q:"Nếu 1 Part có ít tiến bộ nhất, bước tiếp theo hợp lý là gì?", opts:["Bỏ qua Part đó vì không cải thiện được", "Tìm hiểu nguyên nhân cụ thể và điều chỉnh phương pháp ôn tập cho Part đó", "Ngừng học TOEIC", "Chỉ tập trung vào Part đã giỏi"], correct:1, explain:"Cần phân tích nguyên nhân để điều chỉnh chiến lược, không nên bỏ qua điểm yếu."},
{q:"Đề mini tổng hợp khác đề thử đơn lẻ từng Part ở điểm nào?", opts:["Không khác gì", "Đề mini kiểm tra khả năng chuyển đổi linh hoạt giữa nhiều dạng bài liên tiếp, giống thi thật hơn", "Đề mini luôn ngắn hơn nhiều", "Đề mini không có giá trị đánh giá"], correct:1, explain:"Khả năng chuyển đổi giữa các Part là kỹ năng quan trọng chỉ đề tổng hợp mới đánh giá được."},
{q:"Vì sao cuối tháng 2 là thời điểm hợp lý để làm đề mini tổng hợp đầu tiên?", opts:["Không có lý do đặc biệt", "Vì đã học đủ các kỹ năng cơ bản của Part 1-6, đủ nền tảng để đánh giá tổng hợp", "Ngẫu nhiên không có chủ đích", "Vì đây là thời điểm bắt buộc theo quy định"], correct:1, explain:"Sau khi hoàn thành nền tảng Part 1-6, đây là thời điểm hợp lý để đánh giá tổng hợp."},
{q:"Kết quả đề mini nên được sử dụng như thế nào cho tháng 3?", opts:["Không cần dùng để làm gì", "Làm cơ sở điều chỉnh kế hoạch ôn tập, đặc biệt cho Part còn yếu, trước khi học Part 7", "Chỉ để lưu trữ không dùng đến", "Bỏ qua hoàn toàn không cần xem lại"], correct:1, explain:"Kết quả đề mini là dữ liệu quan trọng để lập kế hoạch học tập tháng 3 hiệu quả hơn."},
{q:"3 nguyên nhân có thể khiến 1 Part ít tiến bộ nhất thường liên quan đến điều gì?", opts:["Không có nguyên nhân cụ thể nào", "Có thể là thiếu thời gian ôn tập, chưa đúng phương pháp, hoặc bản chất Part đó khó hơn với cá nhân", "Luôn chỉ do 1 nguyên nhân duy nhất", "Không thể xác định được nguyên nhân"], correct:1, explain:"Việc xác định đúng nguyên nhân (thời gian, phương pháp, hay độ khó cá nhân) giúp có giải pháp phù hợp."},
{q:"Đề mini tổng hợp có nên làm định kỳ trong suốt quá trình học không?", opts:["Không cần thiết, chỉ cần làm 1 lần", "Có, nên làm định kỳ để liên tục theo dõi tiến bộ theo thời gian", "Chỉ cần làm ở cuối khóa học", "Không có giá trị nếu làm nhiều lần"], correct:1, explain:"Làm định kỳ giúp theo dõi xu hướng tiến bộ liên tục, không chỉ đánh giá 1 lần duy nhất."},

{label:'Thứ 6', title:'Tổng kết tháng 2 & lên kế hoạch tháng 3', content:'Sau tháng 2, bạn đã hoàn thành toàn bộ 6 Part đầu tiên của TOEIC (Part 1-6), chỉ còn Part 7 (đọc hiểu đoạn văn) chưa học sâu — đây sẽ là trọng tâm chính của tháng 3 cùng với việc luyện đề tổng hợp có tính giờ nghiêm ngặt để chuẩn bị cho kỳ thi thật. Nhiều đề thi thật lặp lại các chủ đề quen thuộc (họp hành, du lịch công tác, tuyển dụng) — vốn từ vựng theo chủ đề đã xây dựng trong tháng 2 sẽ tiếp tục phát huy tác dụng ở các tháng sau.', exercises:["Viết lại từ trí nhớ tên và nội dung chính của cả 6 Part đã học (Part 1-6), không nhìn tài liệu.","Tổng hợp toàn bộ từ vựng theo 4 chủ đề đã học tuần này (tài chính, nhân sự, sản xuất, du lịch) thành 1 tài liệu ôn tập hoàn chỉnh.","Đặt mục tiêu điểm số cụ thể cho từng Part trước khi bước vào tháng 3.","Viết 1 đoạn nhật ký tổng kết 2 tháng học TOEIC: điều gì tiến bộ rõ nhất, điều gì còn cần cải thiện nhiều nhất.","Lên lịch học sơ bộ cho tháng 3, dành nhiều thời gian hơn cho Part 7 (phần chưa học sâu)."], quiz:[
{q:"Sau tháng 2, bạn đã học đầy đủ những Part nào của TOEIC?", opts:["Chỉ Part 1-2", "Part 1-6 (toàn bộ trừ Part 7)", "Chỉ Part 5-6", "Toàn bộ 7 Part"], correct:1, explain:"Sau tháng 2, Part 1-6 đã được học đầy đủ, chỉ còn Part 7 dành cho tháng 3."},
{q:"Tháng 3 sẽ tập trung chủ yếu vào đâu theo lộ trình?", opts:["Học lại từ Part 1", "Part 7 (đọc hiểu đoạn văn) và luyện đề tổng hợp có tính giờ nghiêm ngặt", "Chỉ ôn ngữ pháp cơ bản", "Kết thúc khóa học tại đây"], correct:1, explain:"Part 7 là mảnh ghép cuối cùng, cùng với luyện đề tổng hợp chuẩn bị cho kỳ thi thật."},
{q:"Vì sao vốn từ vựng theo chủ đề xây dựng trong tháng 2 vẫn có giá trị ở các tháng sau?", opts:["Không còn giá trị gì", "Vì các chủ đề quen thuộc (họp hành, du lịch, tuyển dụng) tiếp tục xuất hiện xuyên suốt đề thi thật", "Từ vựng sẽ thay đổi hoàn toàn ở tháng 3", "Không liên quan đến các tháng sau"], correct:1, explain:"Vốn từ vựng theo chủ đề là tài sản lâu dài, không chỉ dùng riêng cho 1 giai đoạn học."},
{q:"Viết lại từ trí nhớ nội dung 6 Part đã học có tác dụng gì?", opts:["Không có tác dụng gì", "Kiểm tra và củng cố lại toàn bộ kiến thức framework đã xây dựng trong 2 tháng", "Chỉ để viết cho có", "Làm mất thời gian không cần thiết"], correct:1, explain:"Đây là cách tổng ôn hiệu quả bằng kỹ thuật active recall ở quy mô lớn."},
{q:"Đặt mục tiêu điểm số cụ thể cho từng Part trước tháng 3 có ích lợi gì?", opts:["Không có ích lợi gì", "Tạo động lực và tiêu chí rõ ràng để đo lường tiến bộ trong giai đoạn tiếp theo", "Chỉ để trang trí kế hoạch", "Gây áp lực không cần thiết, không có tác dụng thực tế"], correct:1, explain:"Mục tiêu cụ thể, đo lường được là yếu tố quan trọng cho việc học có định hướng."},
{q:"Viết nhật ký tổng kết 2 tháng học có lợi ích tâm lý gì?", opts:["Không có lợi ích gì", "Giúp nhìn nhận rõ tiến bộ đã đạt được, duy trì động lực cho hành trình dài phía trước", "Chỉ là hình thức không cần thiết", "Có thể gây chán nản không nên làm"], correct:1, explain:"Nhìn lại tiến bộ cụ thể là cách hiệu quả để duy trì động lực học tập dài hạn."},
{q:"Vì sao nên dành nhiều thời gian hơn cho Part 7 trong kế hoạch tháng 3?", opts:["Không cần ưu tiên đặc biệt", "Vì đây là phần chưa được học sâu, có nhiều câu hỏi nhất (54 câu) trong Reading", "Part 7 không quan trọng", "Part 7 đã học xong không cần ôn thêm"], correct:1, explain:"Part 7 chiếm số lượng câu hỏi lớn nhất Reading và là phần hoàn toàn mới, cần ưu tiên thời gian."},
{q:"Kỹ năng đọc hiểu ngữ cảnh học ở Part 6 có mối liên hệ gì với Part 7?", opts:["Không có mối liên hệ nào", "Là nền tảng quan trọng vì Part 7 đòi hỏi đọc hiểu đoạn văn ở quy mô lớn hơn nhiều", "Part 7 dùng kỹ năng hoàn toàn khác biệt", "Part 6 và Part 7 không liên quan gì đến nhau"], correct:1, explain:"Kỹ năng đọc hiểu ngữ cảnh từ Part 6 chính là bước đệm chuẩn bị cho Part 7."},
{q:"Sau 2 tháng học có hệ thống, điều gì là thành quả quan trọng nhất đạt được?", opts:["Chỉ là điểm số cao hơn", "Xây dựng được nền tảng kiến thức vững chắc VÀ thói quen học tập/ôn luyện có phương pháp", "Không có thành quả gì đáng kể", "Chỉ là ghi nhớ được nhiều từ vựng"], correct:1, explain:"Thành quả lớn nhất không chỉ là điểm số mà còn là phương pháp học tập bền vững đã hình thành."},
{q:"Lên lịch học sơ bộ cho tháng 3 ngay từ cuối tháng 2 có lợi ích gì?", opts:["Không có lợi ích gì", "Đảm bảo quá trình học liên tục, không bị gián đoạn giữa các giai đoạn", "Chỉ để có kế hoạch cho vui", "Không ảnh hưởng đến hiệu quả học tập"], correct:1, explain:"Lên kế hoạch trước giúp duy trì tính liên tục và động lực học tập giữa các giai đoạn."},

{title:"Reading Part 7 — đọc hiểu đơn", points:["Part 7 chiếm phần lớn thời gian Reading, cần chiến lược quản lý thời gian chặt chẽ.","Đọc lướt (skim) tiêu đề và câu đầu đoạn trước để nắm ý chính, sau đó đọc kỹ theo câu hỏi.","Câu hỏi dạng \"theo đoạn văn, điều gì đúng\" cần đối chiếu từng đáp án với văn bản, không đoán.","Câu hỏi từ đồng nghĩa cần xét nghĩa theo ngữ cảnh cụ thể, không theo nghĩa từ điển chung.","Luyện đọc nhanh nhưng chính xác quan trọng hơn đọc chậm để hiểu 100%."], practice:"Làm 2 bài đọc đơn Part 7 (10 câu) trong thời gian giới hạn khoảng 15 phút, tự đánh giá tốc độ đọc.", case:"Part 7 đơn chiếm khoảng 29 câu — đây là phần 'ăn chắc' cần luyện tốc độ đọc trước khi chuyển sang phần khó hơn.", task:"Làm 2 bài đọc đơn Part 7 (10 câu) trong thời gian giới hạn khoảng 15 phút, tự đánh giá tốc độ đọc."},
{title:"Reading Part 7 — đọc hiểu kép/ba", points:["Dạng đọc kép/ba yêu cầu kết hợp thông tin từ 2-3 văn bản khác nhau.","Luôn xác định câu hỏi cần thông tin từ văn bản nào trước khi tìm kiếm, tránh đọc lan man.","Câu hỏi khó nhất thường yêu cầu suy luận chéo giữa 2 văn bản.","Quản lý thời gian: nên dành không quá 8-10 phút cho mỗi bộ đọc kép/ba.","Đây là phần khó nhất của đề thi — không cần làm hoàn hảo, ưu tiên các câu dễ suy luận trước."], practice:"Làm 1 bộ đọc kép hoặc ba (khoảng 5 câu), đo thời gian làm và ghi lại câu nào cần suy luận chéo.", case:"Đọc hiểu kép/ba tuy khó nhưng chỉ chiếm khoảng 25 câu cuối — chiến thuật hợp lý là làm chắc phần dễ trước, dành thời gian còn lại cho phần khó.", task:"Làm 1 bộ đọc kép hoặc ba (khoảng 5 câu), đo thời gian làm và ghi lại câu nào cần suy luận chéo."},
{title:"Luyện đề tổng hợp có tính giờ", points:["Bắt đầu luyện đề theo đúng format thời gian thật: 45 phút Listening liền mạch + 75 phút Reading liền mạch.","Quen với việc không dừng lại giữa chừng — đề thi thật không có cơ hội tua lại băng nghe.","Ghi nhận Part nào tốn thời gian nhất trong Reading để phân bổ lại thời gian hợp lý hơn.","Sau khi làm xong, dành thời gian review kỹ tất cả câu sai thay vì chỉ xem điểm số.","Áp lực thời gian là yếu tố quan trọng nhất ảnh hưởng điểm số ở giai đoạn luyện đề."], practice:"Làm 1 đề TOEIC đầy đủ có tính giờ nghiêm ngặt, ghi lại điểm từng phần và thời gian còn dư/thiếu ở Reading.", case:"Nhiều thí sinh luyện đề rời rạc từng Part mà không luyện full-test có tính giờ — dẫn đến làm tốt khi luyện tập nhưng đuối sức khi thi thật vì không quen áp lực thời gian liên tục 2 tiếng.", task:"Làm 1 đề TOEIC đầy đủ có tính giờ nghiêm ngặt, ghi lại điểm từng phần và thời gian còn dư/thiếu ở Reading."},
{title:"Phân tích lỗi sai & tổng kết tháng 3", points:["Lập bảng thống kê lỗi sai theo Part, theo dạng câu hỏi để biết chính xác điểm yếu còn lại.","Với Listening: xác định lỗi do không nghe kịp tốc độ, không hiểu từ vựng, hay do mất tập trung.","Với Reading: xác định lỗi do thiếu từ vựng, sai ngữ pháp, hay do hết thời gian chưa kịp làm.","Ưu tiên ôn lại đúng nhóm lỗi sai nhiều nhất thay vì học lan man toàn bộ kiến thức.","Mục tiêu cuối tháng 3: điểm mini-test tổng hợp nên đã cải thiện rõ rệt so với tháng 2."], practice:"Làm 1 đề đầy đủ khác, lập bảng thống kê lỗi sai chi tiết theo Part và dạng câu hỏi.", case:"Việc thống kê lỗi sai có hệ thống là điều phân biệt thí sinh tự học hiệu quả với thí sinh học tràn lan không tiến bộ dù luyện rất nhiều đề.", task:"Làm 1 đề đầy đủ khác, lập bảng thống kê lỗi sai chi tiết theo Part và dạng câu hỏi."},
{title:"Chiến thuật Listening tốc độ cao", points:["Trong lúc nghe Part 3-4, tranh thủ đọc trước câu hỏi của bài tiếp theo nếu đã trả lời xong bài hiện tại.","Nếu bỏ lỡ 1 câu, đừng dừng lại suy nghĩ — bỏ qua ngay để không ảnh hưởng các câu sau.","Luyện tai với nhiều giọng khác nhau (Anh-Anh, Anh-Mỹ, Anh-Úc) vì đề thi có đủ các giọng này.","Đoán đáp án có cơ sở (loại trừ) tốt hơn bỏ trống — TOEIC không trừ điểm câu sai.","Giữ nhịp độ ổn định xuyên suốt, tránh dồn tập trung hết vào các bài đầu rồi đuối ở cuối."], practice:"Làm 2 đề Listening liên tiếp không nghỉ để luyện sức bền tập trung, ghi lại thời điểm bắt đầu mất tập trung.", case:"Giọng Anh-Úc thường là giọng gây khó nhất cho thí sinh Việt Nam vì ít được tiếp xúc trong quá trình học phổ thông — cần chủ động luyện thêm giọng này.", task:"Làm 2 đề Listening liên tiếp không nghỉ để luyện sức bền tập trung, ghi lại thời điểm bắt đầu mất tập trung."},
{title:"Chiến thuật Reading & quản lý thời gian", points:["Phân bổ thời gian gợi ý: Part 5 khoảng 10 phút, Part 6 khoảng 10 phút, Part 7 còn lại khoảng 55 phút.","Nếu 1 câu Part 7 mất quá 1 phút mà vẫn chưa chắc đáp án, đánh dấu và làm câu tiếp theo trước.","Luôn để lại vài phút cuối để tô đáp án cho các câu đã đánh dấu bỏ qua, không để trống.","Làm quen với việc đọc nhanh không dịch từng từ, chỉ nắm ý chính và từ khóa trong câu hỏi.","Thực hành đúng thời gian thật nhiều lần giúp cảm giác quản lý thời gian trở thành phản xạ."], practice:"Làm 1 đề Reading đầy đủ, tự đặt mốc thời gian cho từng Part và kiểm tra xem có bám sát kế hoạch không.", case:"Rất nhiều thí sinh mất điểm ở Part 7 không phải vì không hiểu bài mà vì hết giờ chưa kịp làm — quản lý thời gian đôi khi quan trọng hơn trình độ đọc hiểu.", task:"Làm 1 đề Reading đầy đủ, tự đặt mốc thời gian cho từng Part và kiểm tra xem có bám sát kế hoạch không."},
{title:"Luyện full test có tính giờ nghiêm ngặt", points:["Làm đề đầy đủ trong điều kiện giống thi thật nhất có thể (không gian yên tĩnh, không dừng giữa chừng).","So sánh điểm số qua các lần làm đề để thấy rõ xu hướng tiến bộ, không chỉ nhìn 1 lần duy nhất.","Nếu điểm chưa đạt 800, xác định rõ đang thiếu ở Listening hay Reading để tập trung tuần cuối.","Ôn lại các collocation, cụm từ hay gặp đã note trong suốt 3 tháng trước — không học từ mới tràn lan giai đoạn này.","Giữ tâm lý ổn định, tránh học dồn ép quá mức gây căng thẳng trước ngày thi."], practice:"Làm 1 đề full test có tính giờ nghiêm ngặt, ghi lại điểm số để so sánh với các lần luyện đề trước.", case:"Điểm số dao động ±30-50 điểm giữa các lần luyện đề là bình thường — nên nhìn vào xu hướng trung bình của nhiều lần thi thử thay vì 1 kết quả đơn lẻ.", task:"Làm 1 đề full test có tính giờ nghiêm ngặt, ghi lại điểm số để so sánh với các lần luyện đề trước."},
{title:"Tổng ôn & sẵn sàng cho ngày thi", points:["Rà soát lại toàn bộ lỗi sai đã note trong 4 tháng, tập trung vào các lỗi lặp lại nhiều lần.","Ôn lại nhanh danh sách từ vựng/collocation quan trọng, không học kiến thức hoàn toàn mới ở tuần cuối.","Chuẩn bị tâm lý và thể lực: ngủ đủ giấc, tránh luyện đề nặng sát ngày thi (nghỉ 1 ngày trước khi thi).","Kiểm tra lại giấy tờ, địa điểm, giờ thi để tránh sự cố phút chót gây mất tập trung không cần thiết.","Nhắc lại chiến thuật cốt lõi: đọc trước câu hỏi, không bỏ trống câu nào, quản lý thời gian theo mốc đã luyện."], practice:"Làm 1 đề full test cuối cùng nhẹ nhàng (không cần tính giờ quá căng thẳng) để giữ phong độ trước ngày thi thật.", case:"Tâm lý phòng thi (căng thẳng, thiếu ngủ) có thể khiến thí sinh mất 20-30 điểm so với lúc luyện tập ở nhà — chuẩn bị tâm lý là bước cuối cùng nhưng không kém quan trọng.", task:"Làm 1 đề full test cuối cùng nhẹ nhàng (không cần tính giờ quá căng thẳng) để giữ phong độ trước ngày thi thật."},
];

{title:"Tổng quan AWS & IAM", points:["AWS là nền tảng điện toán đám mây lớn nhất thế giới, cung cấp hạ tầng (compute, storage, network) theo mô hình trả tiền theo nhu cầu sử dụng.","IAM quản lý người dùng, nhóm, vai trò (role) và quyền truy cập vào tài nguyên AWS.","Nguyên tắc \"least privilege\" (đặc quyền tối thiểu): chỉ cấp đúng quyền cần thiết, không cấp dư thừa.","Root account có toàn quyền — nên hạn chế dùng hàng ngày, tạo IAM user riêng cho công việc thường xuyên.","MFA (xác thực đa yếu tố) nên bật cho mọi tài khoản quan trọng, đặc biệt root account."], practice:"Tạo tài khoản AWS Free Tier, tạo 1 IAM user mới với quyền hạn chế (không phải admin), bật MFA cho root account.", case:"SAA-C03 luôn có câu hỏi về IAM best practice — hiểu đúng least privilege là kiến thức nền bắt buộc.", task:"Tạo 1 IAM policy tùy chỉnh chỉ cho phép đọc (read-only) 1 dịch vụ cụ thể (ví dụ S3), gán cho user vừa tạo và thử nghiệm quyền hạn.", days:[
{label:'Thứ 2', title:'Giới thiệu điện toán đám mây & mô hình AWS', content:'Điện toán đám mây cho phép thuê tài nguyên IT qua internet thay vì tự đầu tư hạ tầng vật lý. AWS có 3 mô hình dịch vụ chính: IaaS (hạ tầng, ví dụ EC2), PaaS (nền tảng, ví dụ Elastic Beanstalk), SaaS (phần mềm hoàn chỉnh). Mô hình pay-as-you-go nghĩa là chỉ trả tiền cho tài nguyên thực sự dùng. AWS có mặt tại nhiều Region trên thế giới, mỗi Region gồm nhiều Availability Zone độc lập.', exercises:['Đăng ký tài khoản AWS Free Tier (cần thẻ tín dụng nhưng free tier đủ dùng cho khóa học này).','Đọc qua trang AWS Free Tier để biết dịch vụ nào miễn phí trong 12 tháng đầu.','Chọn 1 Region gần Việt Nam nhất (ví dụ ap-southeast-1 Singapore) làm Region mặc định khi thao tác.','Tìm hiểu sự khác biệt giữa On-Demand, Reserved Instance và Spot Instance của AWS, ghi chú tình huống nên dùng loại nào.','Xem trang AWS Global Infrastructure, đếm xem hiện có bao nhiêu Region đang hoạt động trên toàn cầu.'], quiz:[
{q:"Điện toán đám mây cho phép làm gì?", opts:["Chỉ lưu trữ ảnh", "Thuê tài nguyên IT qua internet thay vì tự đầu tư hạ tầng", "Chỉ dùng cho game", "Không liên quan đến internet"], correct:1, explain:"Cloud computing cho thuê tài nguyên IT theo nhu cầu qua internet."},
{q:"AWS có mấy mô hình dịch vụ chính?", opts:["1", "3 (IaaS, PaaS, SaaS)", "5", "10"], correct:1, explain:"3 mô hình cốt lõi: IaaS, PaaS, SaaS."},
{q:"IaaS là viết tắt của gì?", opts:["Infrastructure as a Service", "Internet as a Service", "Instance as a Service", "Information as a Service"], correct:0, explain:"IaaS cung cấp hạ tầng thô (compute, network, storage)."},
{q:"EC2 thuộc mô hình dịch vụ nào?", opts:["SaaS", "IaaS", "PaaS", "Không thuộc mô hình nào"], correct:1, explain:"EC2 cung cấp hạ tầng máy chủ ảo, thuộc nhóm IaaS."},

{q:"Mỗi Region gồm nhiều gì?", opts:["Availability Zone (AZ) độc lập", "Chỉ 1 trung tâm dữ liệu duy nhất", "Không có cấu trúc con", "Chỉ có 1 server"], correct:0, explain:"1 Region chứa nhiều AZ độc lập về mặt vật lý."},

{q:"AWS Free Tier áp dụng trong thời gian bao lâu cho tài khoản mới?", opts:["Vĩnh viễn", "12 tháng đầu (với nhiều dịch vụ)", "Chỉ 1 tháng", "Không có Free Tier"], correct:1, explain:"Phần lớn ưu đãi Free Tier áp dụng trong 12 tháng đầu tài khoản mới."},

{label:'Thứ 3', title:'IAM User, Group, Role', content:'IAM User đại diện cho 1 người/ứng dụng cụ thể cần truy cập AWS. IAM Group nhóm nhiều User lại để gán quyền chung. IAM Role là "bộ quyền tạm thời" gán cho dịch vụ AWS khác (ví dụ EC2) chứ không gán trực tiếp cho người dùng — an toàn hơn vì không cần lưu access key cố định. Access Key dùng để xác thực khi gọi AWS qua CLI/SDK, cần bảo mật tuyệt đối, không commit lên Git.', exercises:['Tạo 1 IAM Group tên "Developers", tạo 1 IAM User và thêm vào group đó.','Gán policy có sẵn "ReadOnlyAccess" cho group vừa tạo.','Thử đăng nhập bằng IAM User vừa tạo (không phải root) để xác nhận hoạt động.','Đọc tài liệu AWS về sự khác biệt giữa IAM User và IAM Role, viết ra 2 tình huống nên dùng Role thay vì User.','Thử xóa rồi tạo lại IAM User từ đầu để quen thao tác, lần này thêm mô tả (tag) rõ ràng cho user.'], quiz:[
{q:"IAM User đại diện cho gì?", opts:["Cá nhân/ứng dụng cần truy cập AWS", "1 loại EC2", "1 vùng địa lý", "1 loại storage"], correct:0, explain:"IAM User là danh tính đại diện cho 1 người hoặc ứng dụng cụ thể cần truy cập tài nguyên AWS."},
{q:"IAM Group dùng để làm gì?", opts:["Mã hóa dữ liệu", "Nhóm nhiều User để gán quyền chung", "Lưu trữ file", "Giám sát chi phí"], correct:1, explain:"Group giúp quản lý quyền cho nhiều user cùng lúc thay vì gán riêng lẻ."},
{q:"Vì sao nên dùng Role thay vì lưu access key cố định cho dịch vụ AWS?", opts:["Role rẻ hơn", "Role là quyền tạm thời, an toàn hơn vì không cần lưu key cố định", "Role nhanh hơn", "Không có lý do"], correct:1, explain:"Role cấp quyền tạm thời cho dịch vụ, tránh rủi ro lộ access key cố định."},
{q:"Access Key dùng khi nào?", opts:["Đăng nhập Console", "Gọi AWS qua CLI/SDK", "Đặt tên bucket", "Tạo VPC"], correct:1, explain:"Access Key dùng để xác thực chương trình/CLI gọi API AWS, khác đăng nhập Console."},
{q:"Policy \"ReadOnlyAccess\" cho phép làm gì?", opts:["Sửa và xóa tài nguyên", "Chỉ đọc, không sửa/xóa", "Toàn quyền", "Không quyền gì"], correct:1, explain:"Đúng như tên gọi, policy này chỉ cấp quyền xem, không cho phép thay đổi."},
{q:"Muốn nhiều User có cùng 1 bộ quyền, cách quản lý hiệu quả nhất là gì?", opts:["Gán riêng lẻ từng user", "Gán quyền qua Group", "Không thể làm được", "Phải tạo Role riêng"], correct:1, explain:"Group cho phép gán 1 lần, áp dụng cho toàn bộ thành viên."},
{q:"IAM Role thường được gán cho đối tượng nào?", opts:["Chỉ con người", "Dịch vụ AWS như EC2", "Chỉ root account", "Không gán được cho ai"], correct:1, explain:"Role phổ biến nhất là gán cho dịch vụ AWS (như EC2) cần quyền truy cập dịch vụ khác."},
{q:"Access Key gồm mấy thành phần?", opts:["1", "2 (Access Key ID + Secret Access Key)", "3", "4"], correct:1, explain:"Access Key gồm 1 ID công khai và 1 Secret Key cần giữ bí mật."},
{q:"Điều nào KHÔNG nên làm với Access Key?", opts:["Bảo mật cẩn thận", "Commit lên Git công khai", "Lưu ở nơi an toàn", "Xoay vòng định kỳ"], correct:1, explain:"Commit access key lên Git công khai là lỗi bảo mật nghiêm trọng và rất phổ biến."},
{q:"Đăng nhập bằng IAM User khác đăng nhập bằng root account ở điểm nào?", opts:["Không khác gì", "IAM User dùng tài khoản riêng, không có toàn quyền như root", "IAM User luôn có toàn quyền", "Root không đăng nhập được"], correct:1, explain:"IAM User có quyền giới hạn theo policy được gán, an toàn hơn dùng root."},
]},
{label:'Thứ 4', title:'IAM Policy & thực hành cấp quyền', content:'IAM Policy là văn bản JSON định nghĩa quyền được phép/bị từ chối, gồm Effect (Allow/Deny), Action, Resource. AWS Managed Policy là policy có sẵn do AWS tạo; Customer Managed Policy là policy tự viết theo nhu cầu riêng. Deny luôn được ưu tiên hơn Allow khi có xung đột giữa nhiều policy áp dụng cùng lúc. Policy có thể gán trực tiếp cho User, hoặc gián tiếp qua Group/Role.', example:'{\n  "Effect": "Allow",\n  "Action": ["s3:GetObject", "s3:ListBucket"],\n  "Resource": ["arn:aws:s3:::my-bucket/*"]\n}', exercises:['Viết 1 Customer Managed Policy JSON chỉ cho phép List và Get object trong 1 bucket S3 cụ thể.','Gán policy vừa viết cho IAM User, thử test quyền (nên bị từ chối các hành động khác như Delete).','Đọc và giải thích từng phần của 1 AWS Managed Policy có sẵn.','Thử sửa policy đã tạo để thêm quyền s3:PutObject (upload file), xác nhận user giờ upload được.','Tìm hiểu công cụ IAM Policy Simulator của AWS, dùng thử để kiểm tra 1 policy trước khi gán thật.'], quiz:[
{q:"IAM Policy là gì?", opts:["File âm thanh", "Văn bản JSON định nghĩa quyền Allow/Deny", "Loại EC2 instance", "Địa chỉ IP"], correct:1, explain:"Policy là văn bản JSON mô tả quyền được phép hoặc bị từ chối."},
{q:"Policy gồm những thành phần chính nào?", opts:["Effect, Action, Resource", "Chỉ có Effect", "Chỉ có Resource", "Region, AZ, VPC"], correct:0, explain:"3 thành phần cốt lõi của 1 policy statement là Effect, Action, Resource."},
{q:"AWS Managed Policy khác Customer Managed Policy thế nào?", opts:["Không khác gì", "Managed Policy do AWS tạo sẵn; Customer Managed do người dùng tự viết", "Managed Policy chỉ dùng cho root", "Customer Managed miễn phí hơn"], correct:1, explain:"Managed Policy có sẵn từ AWS; Customer Managed do chính bạn tự soạn theo nhu cầu."},
{q:"Nếu 1 policy Allow và 1 policy Deny cùng áp dụng, kết quả là gì?", opts:["Allow thắng", "Deny luôn được ưu tiên", "Ngẫu nhiên", "Lỗi"], correct:1, explain:"AWS luôn ưu tiên Deny khi có xung đột giữa các policy áp dụng."},
{q:"Effect trong policy có 2 giá trị nào?", opts:["Yes/No", "Allow/Deny", "True/False", "On/Off"], correct:1, explain:"Effect chỉ nhận 1 trong 2 giá trị: Allow hoặc Deny."},
{q:"Policy có thể gán cho đối tượng nào?", opts:["Chỉ User", "User, Group, hoặc Role", "Chỉ Group", "Không gán được"], correct:1, explain:"Policy linh hoạt gán được cho cả 3 loại danh tính IAM."},
{q:"IAM Policy Simulator dùng để làm gì?", opts:["Tạo user tự động", "Mô phỏng/kiểm tra quyền trước khi gán thật", "Tính chi phí", "Backup dữ liệu"], correct:1, explain:"Công cụ này giúp kiểm tra tác động của policy trước khi áp dụng thực tế."},
{q:"Muốn cho phép đọc 1 bucket S3 cụ thể, Action nào phù hợp?", opts:["s3:DeleteObject", "s3:GetObject", "ec2:RunInstances", "iam:CreateUser"], correct:1, explain:"s3:GetObject là action cho phép đọc (lấy) object từ S3."},
{q:"Resource trong policy dùng để làm gì?", opts:["Chỉ định tài nguyên cụ thể áp dụng quyền", "Đặt tên policy", "Ghi chú", "Không có tác dụng"], correct:0, explain:"Resource xác định chính xác tài nguyên nào (ví dụ ARN của 1 bucket) mà quyền áp dụng."},
{q:"Vì sao nên chỉ định đúng Resource thay vì dùng dấu * cho mọi tài nguyên?", opts:["Không quan trọng", "Tuân thủ least privilege, giảm rủi ro bảo mật", "Chỉ để code ngắn hơn", "Bắt buộc theo cú pháp"], correct:1, explain:"Chỉ định cụ thể giúp giới hạn phạm vi quyền, đúng nguyên tắc least privilege."},
]},
{label:'Thứ 5', title:'Bảo mật tài khoản: MFA & Billing Alert', content:'MFA yêu cầu thêm 1 lớp xác thực (mã OTP từ app hoặc thiết bị vật lý) ngoài mật khẩu, giảm đáng kể rủi ro bị chiếm tài khoản. Root account nên bật MFA ngay từ đầu và hạn chế sử dụng cho công việc hàng ngày. CloudTrail (học sâu hơn ở tuần 10) ghi lại mọi hành động API. AWS Billing Alert giúp cảnh báo khi chi phí vượt ngưỡng đặt trước, quan trọng khi mới học để tránh phát sinh chi phí ngoài ý muốn.', exercises:['Bật MFA cho root account bằng app Google Authenticator hoặc tương tự.','Tạo 1 Billing Alert cảnh báo khi chi phí vượt 5 USD.','Xem lại Security Status trong IAM Dashboard, xử lý hết các cảnh báo màu đỏ nếu có.','Tìm hiểu sự khác biệt giữa Billing Alert và AWS Budget, tạo thử 1 Budget đơn giản giới hạn 10 USD/tháng.','Xem lại toàn bộ IAM User đã tạo trong tuần, viết mô tả ngắn cho vai trò của từng user.'], quiz:[
{q:"MFA là viết tắt của gì?", opts:["Multi-Factor Authentication", "Main File Access", "Multiple Function App", "Managed Federal Access"], correct:0, explain:"MFA nghĩa là xác thực đa yếu tố."},
