{title:"Java 8: Lambda & Stream API", points:["Lambda expression là cách viết hàm ẩn danh gọn hơn, cú pháp (params) -> expression.","Stream API xử lý Collection theo phong cách functional: filter, map, reduce, collect.","Stream không thay đổi dữ liệu gốc, trả về stream mới sau mỗi phép biến đổi (giống method chain trong JS).","Functional interface (Runnable, Comparator...) chỉ có 1 method trừu tượng, dùng được với lambda.","Stream giúp code ngắn gọn hơn nhưng debug khó hơn vòng lặp thường — cân nhắc độ phức tạp bài toán."], practice:"Từ 1 List<Employee> có field salary, dùng Stream để lọc nhân viên lương lớn hơn X rồi tính lương trung bình.", case:"Xử lý danh sách bằng Stream thay vì vòng lặp thủ công là phong cách code Java hiện đại được kỳ vọng ở dev từ mid-level trở lên.", task:"Dùng Stream API: từ 1 List<Integer>, lọc số chẵn rồi tính tổng bằng filter + reduce."},
{title:"Generics trong Java", points:["Generics cho phép class/method hoạt động với nhiều kiểu dữ liệu mà vẫn type-safe tại compile time.","List<String> đảm bảo compiler bắt lỗi nếu thêm nhầm kiểu khác vào list.","Ký hiệu quy ước: T (Type), E (Element), K/V (Key/Value) khi định nghĩa generic.","Bounded type (<T extends Number>) giới hạn generic chỉ nhận kiểu con của 1 class/interface.","Generics giúp tránh phải ép kiểu (cast) thủ công và giảm lỗi runtime."], practice:"Viết class Pair<K,V> chứa 2 giá trị bất kỳ kiểu, có method getKey()/getValue().", case:"Các thư viện enterprise Java (Optional<T>, List<T>...) đều dựa trên Generics — không hiểu Generics sẽ rất khó đọc signature của các thư viện phổ biến.", task:"Viết 1 class Box<T> chứa 1 giá trị kiểu T bất kỳ, với method get/set."},
{title:"Multithreading cơ bản", points:["Thread là 1 luồng thực thi độc lập, cho phép chương trình làm nhiều việc \"song song\".","Tạo thread bằng extends Thread hoặc implements Runnable (Runnable linh hoạt hơn).","Race condition xảy ra khi nhiều thread cùng truy cập/sửa 1 dữ liệu chung không kiểm soát.","Từ khóa synchronized đảm bảo chỉ 1 thread truy cập đoạn code tại 1 thời điểm.","Multithreading mạnh nhưng phức tạp — chỉ dùng khi thực sự cần xử lý song song."], practice:"Viết 2 thread cùng tăng 1 biến counter chung 10.000 lần không đồng bộ, quan sát kết quả sai lệch, sau đó sửa bằng synchronized và so sánh.", case:"Race condition là nguyên nhân của nhiều bug 'ngẫu nhiên khó tái hiện' nổi tiếng khó debug nhất trong hệ thống backend thực tế có xử lý song song.", task:"Viết 2 Thread cùng in số đếm từ 1 đến 5, quan sát thứ tự output có bị xen kẽ không dự đoán được."},
{title:"File I/O trong Java", points:["java.io và java.nio là 2 package chính để đọc/ghi file trong Java.","BufferedReader/BufferedWriter đọc/ghi theo dòng, hiệu quả hơn đọc từng byte.","try-with-resources tự động đóng file/stream sau khi dùng xong, tránh leak tài nguyên.","Files.readAllLines() (java.nio) là cách ngắn gọn để đọc nhanh 1 file nhỏ.","Luôn xử lý exception khi làm việc với file vì file có thể không tồn tại hoặc thiếu quyền."], practice:"Viết chương trình đọc 1 file CSV đơn giản (tên,tuổi) và in ra danh sách người trên 18 tuổi.", case:"Xử lý file (import/export CSV, log file) vẫn là tác vụ backend rất phổ biến trong các hệ thống doanh nghiệp, đặc biệt các module báo cáo.", task:"Viết chương trình đọc 1 file text và đếm số dòng, số từ trong file đó."},
{title:"Maven/Gradle — quản lý dependency", points:["Maven/Gradle quản lý thư viện bên ngoài (dependency) và quy trình build của dự án Java.","pom.xml (Maven) hoặc build.gradle khai báo dependency, version, plugin cần dùng.","Dependency scope (compile, test, runtime) quyết định thư viện dùng ở giai đoạn nào.","Build lifecycle: compile → test → package → install/deploy.","Gradle dùng Groovy/Kotlin DSL, thường nhanh hơn Maven nhờ build cache và incremental build."], practice:"Tạo project Maven mới, thêm dependency Gson hoặc Jackson, viết code chuyển 1 object Java thành chuỗi JSON.", case:"Không dự án Java thực tế nào không dùng build tool để quản lý dependency — kỹ năng nền tảng bắt buộc trước khi làm việc với bất kỳ codebase Java nào.", task:"Tạo 1 project Maven/Gradle mới, thêm 1 dependency đơn giản (ví dụ JUnit) và build thử."},
{title:"JDBC — kết nối Database", points:["JDBC là API chuẩn để Java giao tiếp với database quan hệ.","Connection, Statement/PreparedStatement, ResultSet là 3 thành phần chính khi thao tác JDBC.","PreparedStatement tránh SQL Injection bằng cách tham số hóa câu query thay vì nối chuỗi thủ công.","Luôn đóng Connection/Statement/ResultSet sau khi dùng (hoặc dùng try-with-resources).","JDBC là nền tảng để hiểu ORM (JPA/Hibernate) hoạt động bên dưới thế nào."], practice:"Kết nối tới 1 database SQLite/MySQL cục bộ, viết query SELECT lấy danh sách và in ra console.", case:"Dù đã có ORM hiện đại, hiểu JDBC vẫn cần thiết để debug các câu query phức tạp hoặc tối ưu performance mà ORM sinh SQL không hiệu quả.", task:"Viết đoạn code JDBC kết nối tới 1 database (SQLite/MySQL) và query 1 bảng đơn giản."},
{title:"Giới thiệu Spring Boot", points:["Spring Boot giúp xây dựng ứng dụng Java (đặc biệt REST API) nhanh, ít cấu hình thủ công.","@SpringBootApplication là annotation khởi động toàn bộ ứng dụng Spring Boot.","Dependency Injection (DI) là core concept: Spring tự quản lý vòng đời và inject các object (bean) cần thiết.","@Component, @Service, @Repository đánh dấu các loại bean khác nhau theo tầng trong ứng dụng.","Spring Boot dùng embedded server (Tomcat) nên chạy được ngay bằng lệnh, không cần cài server riêng."], practice:"Tạo project Spring Boot với 1 dependency Spring Web, viết 1 endpoint GET /hello trả về chuỗi 'Hello Spring Boot'.", case:"Spring Boot là framework backend Java phổ biến nhất hiện nay ở các công ty — hầu hết vị trí Java Backend đều yêu cầu thành thạo Spring Boot.", task:"Tạo project Spring Boot mới (dùng start.spring.io), chạy thử và xem log khởi động ứng dụng."},
{title:"REST API với Spring Boot", points:["@RestController đánh dấu class xử lý request và trả về dữ liệu (thường là JSON).","@GetMapping, @PostMapping, @PutMapping, @DeleteMapping map tới các HTTP method tương ứng.","@RequestBody lấy dữ liệu từ body request, @PathVariable lấy dữ liệu từ URL path.","Response nên có status code rõ ràng (200, 201, 404, 400...) thay vì luôn trả 200.","Thiết kế REST tốt: đặt tên endpoint theo resource (danh từ), dùng đúng HTTP method cho đúng hành động."], practice:"Xây REST API CRUD đầy đủ (GET/POST/PUT/DELETE) cho 1 resource đơn giản (ví dụ Product) lưu tạm trong List (chưa cần database).", case:"CRUD API là bài test kỹ thuật phổ biến nhất khi phỏng vấn vị trí Java Backend — thành thạo phần này là yêu cầu tối thiểu.", task:"Viết 1 REST API đơn giản quản lý danh sách \"model\" (giống AWX Refiner) với endpoint GET và POST."},
{title:"Spring Data JPA & ORM", points:["ORM ánh xạ giữa class Java và bảng database, giảm code SQL thủ công.","@Entity đánh dấu class tương ứng với 1 bảng, @Id đánh dấu khóa chính.","JpaRepository cung cấp sẵn các method CRUD cơ bản (save, findById, findAll, delete) không cần viết SQL.","Có thể viết custom query bằng tên method (findByName) hoặc @Query khi cần phức tạp hơn.","ORM tiện lợi nhưng cần hiểu SQL bên dưới để debug khi performance có vấn đề (N+1 query...)."], practice:"Kết nối Entity Product ở tuần 15 với database thật qua Spring Data JPA, thay List tạm bằng JpaRepository, test lại toàn bộ CRUD.", case:"Hầu hết hệ thống backend thực tế đều cần lưu dữ liệu lâu dài qua database — JPA là kỹ năng phải có để biến demo thành ứng dụng thật.", task:"Định nghĩa 1 Entity Model với vài field, tạo Repository kế thừa JpaRepository và thử save/find dữ liệu."},
{title:"Authentication & JWT cơ bản", points:["Authentication trả lời \"bạn là ai\"; Authorization trả lời \"bạn được làm gì\".","JWT là chuỗi mã hóa chứa thông tin user, được ký để chống giả mạo.","Luồng phổ biến: login trả về JWT → client gửi JWT trong header Authorization ở các request sau.","JWT không nên chứa dữ liệu nhạy cảm vì phần payload chỉ encode chứ không mã hóa.","Spring Security là thư viện phổ biến để tích hợp authentication/authorization vào Spring Boot."], practice:"Thêm 1 endpoint /login trả về JWT giả lập (có thể dùng thư viện jjwt), thử decode token đó ở jwt.io để xem payload.", case:"Gần như mọi hệ thống backend production đều cần cơ chế authentication — JWT là chuẩn phổ biến nhất cho REST API stateless hiện nay.", task:"Đọc thử cấu trúc 1 JWT thật (header.payload.signature) bằng jwt.io, xác định phần nào chứa thông tin gì."},
{title:"Unit Testing với JUnit", points:["JUnit là framework testing phổ biến nhất cho Java, tương tự Vitest/Jest bên JS.","@Test đánh dấu 1 method là test case; assertEquals/assertTrue kiểm tra kết quả mong đợi.","@BeforeEach/@AfterEach chạy trước/sau mỗi test, dùng để setup/cleanup dữ liệu test.","Mockito giúp giả lập (mock) dependency bên ngoài khi test logic, không phụ thuộc hệ thống thật.","Test tốt nên độc lập với nhau — thứ tự chạy test không được ảnh hưởng tới kết quả."], practice:"Viết test case JUnit cho CRUD API ở tuần 15/16, dùng MockMvc hoặc test trực tiếp method service.", case:"Dự án backend không có test coverage cho business logic quan trọng thường bị đánh giá thấp về chất lượng trong review kỹ thuật khi ứng tuyển hoặc audit code.", task:"Viết 1–2 test case JUnit cho hàm chia có xử lý exception đã viết ở tuần 5."},
{title:"Design Patterns phổ biến trong Java", points:["Singleton đảm bảo 1 class chỉ có đúng 1 instance trong toàn ứng dụng (ví dụ 1 connection pool).","Factory pattern tách logic tạo object ra khỏi nơi sử dụng, dễ mở rộng thêm loại mới.","Builder pattern giúp tạo object phức tạp với nhiều field optional mà không cần constructor rối rắm.","Strategy pattern cho phép đổi thuật toán/xử lý linh hoạt tại runtime thông qua interface chung.","Design pattern là công cụ giải quyết vấn đề lặp lại, không phải mục tiêu để nhồi vào mọi chỗ."], practice:"Refactor 1 chỗ trong code Spring Boot đang new trực tiếp object phụ thuộc, chuyển sang inject qua constructor (@Autowired).", case:"Spring Boot bản chất được xây trên nguyên lý Dependency Injection — hiểu design pattern giúp giải thích được 'tại sao Spring hoạt động như vậy' thay vì chỉ copy code mẫu.", task:"Nhận diện xem trong code Spring Boot đã viết (JpaRepository, @Service...) có dùng pattern nào ở trên không."},
{title:"Triển khai Java với Docker cơ bản", points:["Docker đóng gói ứng dụng cùng môi trường chạy (JDK, dependency) thành 1 image thống nhất.","Dockerfile định nghĩa các bước build image: FROM, COPY, RUN, CMD/ENTRYPOINT.","Build image bằng docker build, chạy container bằng docker run.","Multi-stage build giúp giảm kích thước image cuối (build bằng JDK, chạy bằng JRE nhẹ hơn).","Docker giúp môi trường dev/staging/production giống nhau, tránh lỗi \"chạy trên máy tôi thì được\"."], practice:"Viết 1 Dockerfile đơn giản để đóng gói ứng dụng Spring Boot đã tạo ở tuần 14, build và chạy thử container.", case:"Hầu hết công ty deploy backend Java lên Docker/Kubernetes ngày nay — không biết Docker gần như đồng nghĩa không thể tham gia quy trình deploy thực tế của team.", task:"Viết 1 Dockerfile đơn giản để đóng gói ứng dụng Spring Boot đã tạo ở tuần 14, build và chạy thử container."},
{title:"Spring Security nâng cao", points:["Spring Security cho phép phân quyền chi tiết theo role (ADMIN, USER...) trên từng endpoint.","@PreAuthorize kiểm tra quyền ngay tại method trước khi cho thực thi.","SecurityFilterChain định nghĩa endpoint nào public, endpoint nào cần xác thực.","Phân biệt rõ 401 (chưa xác thực) và 403 (đã xác thực nhưng không đủ quyền) khi trả response lỗi.","Không nên tự viết hệ thống authentication từ đầu khi đã có Spring Security xử lý tốt các trường hợp phổ biến."], practice:"Thêm 2 role (ADMIN, USER) vào hệ thống JWT ở tuần 17, giới hạn 1 endpoint chỉ ADMIN mới gọi được, test bằng 2 token khác role.", case:"Phân quyền theo role là yêu cầu gần như bắt buộc ở mọi hệ thống backend có nhiều loại người dùng (admin, nhân viên, khách hàng...).", task:"Thêm phân quyền đơn giản (ADMIN/USER) vào REST API đã viết ở tuần 15, thử gọi bằng 2 role khác nhau."},
{title:"Caching cơ bản với Redis", points:["Cache lưu tạm kết quả tính toán/tra cứu tốn kém để lần sau trả nhanh hơn mà không cần làm lại.","Redis là in-memory data store phổ biến để làm cache layer trước database.","@Cacheable trong Spring Boot tự động cache kết quả method theo key, không cần tự viết logic thủ công.","Cần đặt thời gian hết hạn (TTL) cho cache để tránh trả dữ liệu cũ mãi mãi.","Cache hữu ích cho dữ liệu đọc nhiều, ghi ít — không phù hợp cho dữ liệu thay đổi liên tục."], practice:"Thử thêm @Cacheable vào 1 method truy vấn dữ liệu trong project Spring Boot, đo thời gian phản hồi trước/sau.", case:"Cache giúp giảm tải database đáng kể ở các API đọc nhiều — kỹ thuật tối ưu performance rất thường gặp khi hệ thống có lượng truy cập lớn.", task:"Thử thêm @Cacheable vào 1 method truy vấn dữ liệu trong project Spring Boot, đo thời gian phản hồi trước/sau."},
{title:"Kiến trúc Microservices tổng quan", points:["Microservices chia hệ thống lớn thành nhiều service nhỏ độc lập, mỗi service 1 trách nhiệm rõ ràng.","Trái ngược với Monolith (toàn bộ logic gói trong 1 ứng dụng duy nhất, dễ phát triển ban đầu hơn).","Các service giao tiếp qua REST API hoặc message queue (Kafka, RabbitMQ) thay vì gọi hàm trực tiếp.","Đánh đổi: phức tạp hơn về vận hành, cần xử lý network failure, đồng bộ dữ liệu giữa các service.","Không nên bắt đầu dự án mới bằng microservices — thường bắt đầu Monolith rồi tách dần khi cần."], practice:"Vẽ sơ đồ đơn giản (trên giấy hoặc draw.io) 1 hệ thống e-commerce chia thành 3 service: Order, Product, User — xác định chúng cần gọi nhau ở đâu.", case:"Nhiều công ty lớn (Amazon, Netflix) nổi tiếng với kiến trúc microservices — hiểu tư duy này giúp đọc hiểu các hệ thống doanh nghiệp lớn dù chưa trực tiếp xây dựng chúng.", task:"Vẽ sơ đồ đơn giản: nếu AWX Refiner tách thành microservices, những service nào sẽ tách riêng (model management, auth, notification...)?"},
{title:"CI/CD cơ bản cho ứng dụng Java", points:["CI (Continuous Integration) tự động build + test mỗi khi có code mới được push lên.","CD (Continuous Deployment/Delivery) tự động triển khai ứng dụng sau khi CI pass.","GitHub Actions là công cụ phổ biến để định nghĩa pipeline CI/CD bằng file YAML.","Pipeline cơ bản: checkout code → build (Maven/Gradle) → chạy test → build Docker image → deploy.","CI/CD giúp phát hiện lỗi sớm và giảm rủi ro khi deploy thủ công."], practice:"Viết 1 file GitHub Actions đơn giản tự động build và chạy test cho project Spring Boot mỗi khi push code, quan sát kết quả ở tab Actions.", case:"CI/CD là quy trình chuẩn ở mọi team backend chuyên nghiệp — code không qua được pipeline test tự động thường không được phép merge vào nhánh chính.", task:"Viết 1 file GitHub Actions đơn giản chạy 'mvn test' mỗi khi push code lên GitHub, quan sát kết quả ở tab Actions."},
];

/* ============ TOEIC TRACK — 16 TUẦN / 4 THÁNG (MỤC TIÊU 800+) ============ */
const toeicWeeks = [
{title:"Làm quen cấu trúc đề & đánh giá đầu vào", points:["TOEIC gồm 2 phần: Listening (100 câu, ~45 phút) và Reading (100 câu, 75 phút), tổng 990 điểm.","Làm 1 đề thi thử đầy đủ để xác định điểm xuất phát và phần yếu nhất.","Mục tiêu 800+ nghĩa là cần cân bằng cả Listening và Reading, không bỏ hẳn phần nào.","Lập thời gian biểu học cố định mỗi ngày, duy trì đều đặn quan trọng hơn học dồn.","Chuẩn bị bộ từ vựng theo chủ đề công sở cơ bản (office, meeting, contract...) để học dần mỗi ngày."], practice:"Làm 1 đề TOEIC thử đầy đủ (hoặc rút gọn), tự chấm điểm, ghi lại số câu đúng/sai theo từng Part vào 1 bảng theo dõi.", case:"Đề thi thật luôn ưu tiên thí sinh làm quen format trước — nhiều bạn mất điểm oan chỉ vì bỡ ngỡ dạng câu hỏi chứ không phải do kém tiếng Anh.", task:"Làm 1 đề TOEIC thử đầy đủ (hoặc rút gọn), tự chấm điểm và ghi lại phần nào yếu nhất.", days:[
{label:'Thứ 2', title:'Tìm hiểu format đề thi TOEIC', content:'TOEIC gồm 7 Part: Part 1-4 thuộc Listening (Part 1: mô tả tranh 6 câu, Part 2: hỏi-đáp 25 câu, Part 3: hội thoại 39 câu, Part 4: bài nói 30 câu), Part 5-7 thuộc Reading (Part 5: điền từ đơn 30 câu, Part 6: điền từ đoạn văn 16 câu, Part 7: đọc hiểu 54 câu). Tổng thời gian khoảng 2 tiếng, không nghỉ giữa giờ.', exercises:["Tìm và lưu lại 1 bảng tóm tắt cấu trúc 7 Part kèm số câu và thời gian, để ở nơi dễ thấy trong quá trình học.","Vẽ sơ đồ hoặc bảng cho thấy 2 phần Listening/Reading chiếm bao nhiêu % tổng thời gian thi.","Tìm hiểu thêm về hình thức thi và quy định phòng thi ở nơi bạn dự định đăng ký thi.","Tính thử: nếu bạn làm đúng 70% Part 5 (21/30 câu) và 60% các phần còn lại, thử ước lượng tổng điểm bằng bảng quy đổi tham khảo.","Tìm hiểu lệ phí thi và địa điểm thi TOEIC gần nơi bạn ở nhất."]},
{label:'Thứ 3', title:'Làm 1 đề thử đầy đủ', content:'Lần đầu làm đề, mục tiêu KHÔNG phải để đạt điểm cao mà để có số liệu thật về trình độ hiện tại — làm nghiêm túc, tính giờ đầy đủ như thi thật để kết quả phản ánh đúng thực lực.', exercises:["Làm 1 đề TOEIC đầy đủ (hoặc bản rút gọn), ghi lại thời gian bắt đầu và kết thúc từng phần.","Ghi chú lại cảm giác/khó khăn gặp phải ở từng Part ngay khi vừa làm xong, để so sánh với kết quả thực tế.","Đánh dấu lại những câu bạn phải đoán (không chắc chắn) để phân biệt với câu làm chắc chắn khi phân tích sau.","Ghi lại cảm giác của bạn ngay sau khi làm xong đề (tự tin, lo lắng, mệt...) để so sánh tâm lý ở lần luyện đề sau.","Đếm số câu bạn phải bỏ trống hoàn toàn vì hết giờ, ghi chú riêng để theo dõi cải thiện."]},
{label:'Thứ 4', title:'Tự chấm điểm & quy đổi thang điểm', content:'TOEIC quy đổi số câu đúng sang thang điểm 5-495 cho mỗi kỹ năng (Listening và Reading), tổng tối đa 990. Bảng quy đổi chính thức không tuyến tính tuyệt đối, nhưng có thể tra bảng quy đổi tham khảo có sẵn trong sách luyện thi hoặc tìm online để ước lượng điểm.', exercises:["Đếm số câu đúng ở Listening và Reading riêng biệt, tra bảng quy đổi điểm ước lượng, ghi lại kết quả làm mốc so sánh.","So sánh điểm ước lượng của bạn với mục tiêu 800+ để biết khoảng cách cần thu hẹp trong 4 tháng.","Tìm hiểu xem điểm 800+ tương đương trình độ nào theo khung CEFR để hình dung rõ mục tiêu.","Tra thêm 1 bảng quy đổi điểm TOEIC khác (nếu có) để so sánh, xem kết quả có chênh lệch nhiều không.","Viết ra khoảng cách điểm số hiện tại so với mục tiêu 800, chia nhỏ thành mục tiêu từng tháng."]},
{label:'Thứ 5', title:'Phân tích lỗi sai theo từng Part', content:'Lập 1 bảng đơn giản: mỗi hàng là 1 Part, ghi số câu đúng/sai. Việc này giúp nhìn ra ngay Part nào đang yếu nhất để ưu tiên thời gian học trong các tuần tới, thay vì học dàn trải đều cho mọi phần.', exercises:["Lập bảng thống kê số câu đúng/sai theo từng Part (1 đến 7) từ đề đã làm ở Thứ 3, xác định 2 Part yếu nhất.","Tô màu hoặc đánh dấu nổi bật 2 Part yếu nhất trong bảng thống kê để dễ theo dõi các tuần sau.","Viết ra 1 giả thuyết ban đầu về lý do bạn sai nhiều ở 2 Part đó (từ vựng, ngữ pháp, tốc độ...).","Với mỗi Part sai nhiều, thử đoán trước lý do sai (từ vựng, ngữ pháp, tốc độ) trước khi xem lại đáp án chi tiết.","Chụp lại hoặc lưu bảng thống kê này để so sánh với lần làm đề cuối tháng 1."]},
{label:'Thứ 6', title:'Lập thời gian biểu học tập 4 tháng', content:'Với 1-2 tiếng/ngày, phân chia hợp lý: phần lớn thời gian dành cho 2 Part yếu nhất đã xác định ở Thứ 5, nhưng vẫn duy trì ôn tập các Part khác để không bị tụt lại. Lịch học cụ thể, viết ra giấy hoặc ứng dụng nhắc việc, giúp duy trì đều đặn tốt hơn nhiều so với chỉ "định học".', exercises:["Viết ra lịch học cụ thể cho 4 tháng tới: mỗi ngày trong tuần dành bao nhiêu phút cho Listening, bao nhiêu cho Reading, cố định khung giờ học nếu có thể.","In ra hoặc lưu lịch học này ở nơi dễ thấy mỗi ngày để nhắc nhở duy trì.","Đặt 1 mốc kiểm tra giữa tháng để tự đánh giá xem có bám sát lịch học đã đặt ra không.","Đặt lịch nhắc nhở hàng ngày (điện thoại hoặc ứng dụng) vào đúng khung giờ đã chọn để học.","Chia sẻ lịch học với 1 người bạn hoặc người thân để có thêm động lực duy trì."], quiz:[
{q:"TOEIC gồm mấy phần chính?", opts:["1","2 (Listening và Reading)","3","4"], correct:1, explain:"TOEIC chuẩn (2 kỹ năng) gồm Listening và Reading."},
{q:"Phần Listening của TOEIC có bao nhiêu câu?", opts:["50","100","200","30"], correct:1, explain:"Listening gồm 100 câu (Part 1-4), thời gian khoảng 45 phút."},
{q:"Phần Reading của TOEIC có bao nhiêu câu?", opts:["50","100","150","60"], correct:1, explain:"Reading gồm 100 câu (Part 5-7)."},
{q:"Tổng thời gian làm bài Reading là bao lâu?", opts:["45 phút","60 phút","75 phút","90 phút"], correct:2, explain:"Reading có 75 phút để hoàn thành 100 câu, không có thời gian nghỉ giữa các Part."},
{q:"Tổng điểm tối đa của TOEIC là bao nhiêu?", opts:["100","500","990","1000"], correct:2, explain:"Điểm tối đa là 990 (495 Listening + 495 Reading)."},
{q:"TOEIC có trừ điểm khi trả lời sai không?", opts:["Có, trừ điểm nặng","Không, nên luôn nên chọn đáp án dù không chắc","Chỉ trừ ở Part 7","Tùy giám thị"], correct:1, explain:"TOEIC không trừ điểm câu sai, nên tuyệt đối không nên để trống câu nào."},
{q:"Part nào thuộc Reading, không phải Listening?", opts:["Part 2","Part 3","Part 5","Part 4"], correct:2, explain:"Part 1-4 thuộc Listening; Part 5-7 thuộc Reading."},
{q:"Chiến thuật nào giúp làm Part 3-4 tốt hơn?", opts:["Không cần đọc câu hỏi trước","Đọc trước câu hỏi và đáp án trước khi nghe","Chỉ nghe, không đọc gì","Nhắm mắt để tập trung"], correct:1, explain:"Đọc trước câu hỏi giúp biết cần chú ý thông tin gì khi nghe, tăng đáng kể tỷ lệ đúng."},
{q:"Nên làm gì nếu không chắc đáp án của 1 câu Part 7?", opts:["Bỏ trống để không bị trừ điểm","Đánh dấu và làm câu khác trước, quay lại sau nếu còn thời gian","Dừng lại suy nghĩ đến khi chắc chắn","Bỏ thi luôn"], correct:1, explain:"Vì không bị trừ điểm câu sai, tốt nhất là làm câu dễ trước, không nên kẹt quá lâu ở 1 câu khó."},
{q:"Mục tiêu 800+ điểm cần cân bằng thế nào giữa Listening và Reading?", opts:["Chỉ cần giỏi 1 phần","Cần cân bằng cả 2, không bỏ hẳn phần nào","Chỉ cần giỏi Listening","Chỉ cần giỏi Reading"], correct:1, explain:"800+ đòi hỏi điểm tốt ở cả 2 kỹ năng, không thể chỉ dựa vào 1 phần mạnh để bù phần yếu quá nhiều."},
{q:"TOEIC 990 điểm tương đương điều gì?", opts:["Điểm tối thiểu để đỗ","Điểm tuyệt đối (điểm tối đa có thể đạt)","Điểm trung bình","Không có ý nghĩa gì"], correct:1, explain:"990 là điểm số tối đa của bài thi TOEIC, không có khái niệm \"đỗ/trượt\" mà chỉ có mức điểm đạt được."},
{q:"Vì sao nên làm đề thử ngay từ tuần đầu tiên trước khi học sâu?", opts:["Không cần thiết","Để biết điểm xuất phát và xác định phần yếu nhất cần ưu tiên","Để thi thử lấy chứng chỉ","Vì bắt buộc theo quy định"], correct:1, explain:"Đề thử đầu tiên giúp có số liệu thật về trình độ, từ đó lập kế hoạch học tập trọng tâm đúng chỗ yếu."},
]},
]},
{title:"Ngữ pháp nền tảng: thì động từ & cấu trúc câu", points:["TOEIC Part 5-6 kiểm tra ngữ pháp qua câu đơn lẻ và đoạn văn ngắn.","Ôn lại các thì cơ bản: hiện tại đơn, quá khứ đơn, hiện tại hoàn thành — nhóm câu hỏi xuất hiện thường xuyên.","Nắm vững cấu trúc câu cơ bản: chủ ngữ - động từ - tân ngữ, vị trí tính từ/trạng từ trong câu.","Phân biệt danh động từ (V-ing) và động từ nguyên mẫu có \"to\" sau các động từ phổ biến.","Học ngữ pháp qua ví dụ câu thực tế thay vì học thuộc lý thuyết suông."], practice:"Làm 25 câu Part 5 tập trung chủ điểm thì động từ, ghi lại các câu sai và lý do sai vào sổ tay lỗi.", case:"Part 5 chiếm 30/100 câu Reading — chỉ riêng nắm chắc ngữ pháp cơ bản đã đảm bảo được một lượng điểm ổn định.", task:"Làm 25 câu Part 5 tập trung chủ điểm thì động từ, ghi lại các câu sai và lý do sai.", days:[
{label:'Thứ 2', title:'Ôn thì hiện tại đơn & hiện tại tiếp diễn', content:'Thì hiện tại đơn diễn tả thói quen, sự thật hiển nhiên, lịch trình cố định (dấu hiệu: always, usually, every day). Thì hiện tại tiếp diễn diễn tả hành động đang xảy ra tại thời điểm nói (dấu hiệu: now, at the moment). Trong Part 5, nhận diện đúng dấu hiệu thời gian giúp chọn đúng dạng động từ.', exercises:["Viết 5 câu ví dụ dùng thì hiện tại đơn và 5 câu dùng hiện tại tiếp diễn liên quan chủ đề công sở (họp hành, báo cáo...).","Tìm và gạch chân thì động từ trong 5 câu tiếng Anh bất kỳ bạn gặp hàng ngày để luyện nhận diện thực tế.","Tự đặt 3 câu hỏi kiểu Part 5 (có chỗ trống) rồi tự trả lời để luyện tư duy ra đề.","Tìm 5 câu tiếng Anh trong email hoặc tin nhắn công việc gần đây của bạn, xác định thì đang dùng là gì.","Viết lại 3 câu bạn hay nói sai thì trong quá khứ, sửa lại đúng theo kiến thức vừa học."], quizGen:'present', quizCount:60,
},
{label:'Thứ 3', title:'Ôn thì quá khứ đơn & hiện tại hoàn thành', content:'Quá khứ đơn diễn tả hành động đã kết thúc tại 1 thời điểm xác định trong quá khứ. Hiện tại hoàn thành diễn tả hành động xảy ra trong quá khứ nhưng còn liên quan/ảnh hưởng đến hiện tại, hoặc chưa xác định rõ thời điểm (already, just, since, for) — 2 thì hay bị nhầm lẫn nhất của người học tiếng Việt.', exercises:["Viết 5 cặp câu minh họa sự khác biệt giữa quá khứ đơn và hiện tại hoàn thành cho cùng 1 tình huống.","Viết 1 đoạn văn ngắn kể lại 1 việc bạn đã làm xong hôm nay, cố tình dùng cả 2 thì đã học.","Tìm 3 câu có since/for trong tài liệu tiếng Anh bất kỳ, xác định since đi với mốc thời gian còn for đi với khoảng thời gian.","Viết 1 đoạn hội thoại ngắn (3-4 câu) giữa 2 người nói về công việc đã hoàn thành, dùng cả 2 thì đã học.","Tìm 3 câu có \"yet\" hoặc \"already\" trong tài liệu tiếng Anh bất kỳ, xác định đúng ngữ cảnh dùng."], quizGen:'pastperfect', quizCount:60,
},
{label:'Thứ 4', title:'Luyện Part 5 chủ điểm thì động từ', content:'Áp dụng kiến thức 2 ngày trước vào luyện đề thật — tìm dấu hiệu thời gian trong câu (từ khóa như yesterday, since, now) trước khi chọn đáp án, đừng chỉ dựa vào cảm giác quen mắt.', exercises:["Làm 15 câu Part 5 tập trung chủ điểm thì động từ, đối chiếu đáp án và ghi lại câu sai kèm lý do.","Với mỗi câu sai, thử tự đặt lại câu hỏi tương tự (đổi chủ ngữ/tình huống) để luyện thêm dạng đó.","Phân loại 15 câu vừa làm theo mức độ tự tin: chắc chắn đúng / không chắc / đoán mò.","Ôn lại 5 câu bạn làm sai nhiều lần nhất trong bộ quiz, viết ra dấu hiệu nhận biết để không sai lại.","Thử làm quiz thêm 1 lần nữa vào cuối ngày (bấm \"Làm bộ câu mới\"), so sánh điểm với lần đầu."], quizGen:'mixedtense', quizCount:60,
},
{label:'Thứ 5', title:'Cấu trúc câu cơ bản & vị trí từ loại', content:'Cấu trúc câu tiếng Anh cơ bản: Chủ ngữ - Động từ - Tân ngữ (S-V-O). Tính từ thường đứng trước danh từ hoặc sau động từ to be; trạng từ thường đứng sau động từ chính hoặc đầu/cuối câu. Nắm vững vị trí này giúp làm nhanh các câu Part 5 hỏi về từ loại.', exercises:["Viết 5 câu, mỗi câu xác định rõ đâu là S-V-O và vị trí của tính từ/trạng từ (nếu có).","Viết thêm 3 câu có trạng từ ở các vị trí khác nhau trong câu.","Tìm 1 đoạn văn tiếng Anh ngắn, gạch chân toàn bộ tính từ và trạng từ xuất hiện trong đó.","Viết 5 câu của riêng bạn, mỗi câu cố tình để trống 1 vị trí cần tính từ hoặc trạng từ, tự đố lại bản thân.","Đếm xem trong bộ quiz vừa làm, bạn sai nhiều nhất ở dạng cần điền danh từ, tính từ hay trạng từ."], quizGen:'wordform', quizCount:60,
},
{label:'Thứ 6', title:'Luyện thêm Part 5 & tổng kết tuần', content:'Ôn lại tất cả câu sai đã note trong tuần, phân loại xem lỗi chủ yếu do chưa nắm vững thì động từ hay do nhầm vị trí từ loại — điều này quyết định trọng tâm ôn tập của tuần sau.', exercises:["Làm thêm 15 câu Part 5 tổng hợp, tổng kết lại toàn bộ lỗi sai của tuần vào sổ tay theo 2 nhóm: lỗi thì động từ và lỗi cấu trúc câu.","Làm lại đúng 5 câu đã sai trong tuần (không xem đáp án cũ) để kiểm tra đã sửa được lỗi chưa.","Viết 1 câu tóm tắt: chủ điểm ngữ pháp nào tuần này bạn thấy khó nhất, cần ôn thêm.","Tổng hợp lại toàn bộ giới từ (preposition) đã gặp trong tuần thành 1 danh sách riêng để ôn định kỳ.","Tự đặt 3 câu Part 5 mới theo đúng dạng collocation vừa học, nhờ người khác hoặc tự kiểm tra lại."], quiz:[
{q:"Employees ___ attend the training session next week.", opts:["must","musts","musting","musted"], correct:0, explain:"Động từ khuyết thiếu (modal verb) \"must\" luôn theo sau bởi động từ nguyên mẫu, không chia."},
{q:"The new policy takes effect ___ January 1st.", opts:["on","in","at","by"], correct:0, explain:"Giới từ \"on\" dùng với ngày cụ thể (on + ngày tháng)."},
{q:"She is responsible ___ managing the budget.", opts:["of","for","with","at"], correct:1, explain:"Cụm cố định \"responsible for\" (chịu trách nhiệm về)."},
{q:"The team worked ___ to meet the deadline.", opts:["hard","hardly","harder","hardness"], correct:0, explain:"\"hard\" vừa là tính từ vừa là trạng từ chỉ cách thức (làm việc chăm chỉ); \"hardly\" nghĩa là hầu như không, khác nghĩa hoàn toàn."},
{q:"He arrived ___ the meeting on time.", opts:["at","in","on","to"], correct:0, explain:"Cụm cố định \"arrive at\" + địa điểm/sự kiện cụ thể."},
{q:"The manager will ___ the results tomorrow.", opts:["announce","announces","announced","announcing"], correct:0, explain:"Sau \"will\" (modal verb) luôn là động từ nguyên mẫu."},
{q:"This department is in charge ___ customer service.", opts:["of","for","with","on"], correct:0, explain:"Cụm cố định \"in charge of\" (phụ trách)."},
{q:"The invoice must be paid ___ 30 days.", opts:["within","while","during","between"], correct:0, explain:"\"within\" dùng để chỉ giới hạn thời gian (trong vòng bao lâu)."},
{q:"We look forward ___ hearing from you.", opts:["to","for","at","on"], correct:0, explain:"Cụm cố định \"look forward to\" + V-ing (mong chờ)."},
{q:"The results were ___ than expected.", opts:["good","better","best","well"], correct:1, explain:"Sau \"than\" cần dạng so sánh hơn → better."},
{q:"The meeting has been put ___ until next week.", opts:["off","on","up","down"], correct:0, explain:"Cụm cố định \"put off\" (hoãn lại)."},
{q:"We need to deal ___ this problem immediately.", opts:["with","of","for","at"], correct:0, explain:"Cụm cố định \"deal with\" (giải quyết, xử lý)."},
{q:"The company plans to expand ___ Southeast Asia next year.", opts:["into","on","at","with"], correct:0, explain:"Cụm cố định \"expand into\" + thị trường/khu vực (mở rộng sang)."},
{q:"Please refer ___ the attached document for details.", opts:["to","at","on","with"], correct:0, explain:"Cụm cố định \"refer to\" (tham khảo, đề cập đến)."},
{q:"The new hires will report ___ the HR manager.", opts:["to","at","with","for"], correct:0, explain:"Cụm cố định \"report to\" (báo cáo cho, trực thuộc quản lý của)."},
{q:"The proposal was rejected ___ several reasons.", opts:["due to","despite","although","because"], correct:0, explain:"\"due to\" + danh từ/cụm danh từ (do bởi); \"because\" cần theo sau là 1 mệnh đề đầy đủ."},
{q:"The company is well known ___ its customer service.", opts:["for","of","with","about"], correct:0, explain:"Cụm cố định \"known for\" (nổi tiếng vì)."},
{q:"He is capable ___ handling multiple projects at once.", opts:["of","for","with","at"], correct:0, explain:"Cụm cố định \"capable of\" (có khả năng)."},
{q:"The invoice should be sent ___ the client directly.", opts:["to","at","for","with"], correct:0, explain:"\"send something to someone\" — gửi cho ai đó."},
{q:"We are committed ___ providing excellent service.", opts:["to","for","with","of"], correct:0, explain:"Cụm cố định \"committed to\" + V-ing/danh từ (cam kết)."},
{q:"The results depend largely ___ market conditions.", opts:["on","of","for","with"], correct:0, explain:"Cụm cố định \"depend on\" (phụ thuộc vào)."},
{q:"She was promoted ___ senior manager last month.", opts:["to","at","for","with"], correct:0, explain:"Cụm cố định \"promoted to\" + chức danh (được thăng chức lên)."},
{q:"The team is working ___ a tight deadline.", opts:["under","below","on","at"], correct:0, explain:"Cụm cố định \"under a deadline/pressure\" (chịu áp lực thời hạn)."},
{q:"This product complies ___ international safety standards.", opts:["with","to","of","for"], correct:0, explain:"Cụm cố định \"comply with\" (tuân thủ)."},
]},
]},
{title:"Từ vựng công sở & Listening Part 1-2", points:["Part 1 (mô tả tranh) cần từ vựng miêu tả hành động, vị trí đồ vật (in front of, next to...).","Part 2 (hỏi-đáp ngắn) cần phản xạ nhanh với các dạng câu hỏi Wh-, Yes/No, câu hỏi lựa chọn.","Nghe kỹ từ để hỏi đầu câu (What, Where, When, Who) vì nó quyết định loại câu trả lời cần tìm.","Cảnh giác với \"bẫy\" từ đồng âm thường xuất hiện ở đáp án gây nhiễu.","Luyện nghe chép chính tả (dictation) giúp cải thiện khả năng bắt âm rõ rệt."], practice:"Nghe và làm thử 10 câu Part 1 + 10 câu Part 2, sau đó nghe lại transcript để đối chiếu từ nghe sai, ghi lại từ mới vào sổ từ vựng.", case:"Part 1-2 tuy dễ nhưng chiếm 30/100 câu Listening — làm chắc phần này là nền tảng để đạt điểm Listening cao.", task:"Nghe và làm thử 10 câu Part 1 + 10 câu Part 2, sau đó nghe lại transcript để đối chiếu từ nghe sai.", days:[
{label:'Thứ 2', title:'Từ vựng miêu tả hành động & vị trí (Part 1)', content:'Part 1 yêu cầu chọn câu mô tả đúng nhất bức tranh — từ vựng cần tập trung vào động từ miêu tả hành động (standing, holding, pointing...) và giới từ chỉ vị trí (in front of, next to, between, across from).', exercises:["Tự mô tả 3 bức tranh/tình huống bất kỳ bằng tiếng Anh, cố dùng ít nhất 5 từ trong danh sách bên dưới.","Ghép các từ vừa học thành 5 câu hoàn chỉnh mô tả hành động con người trong văn phòng.","Che phần nghĩa tiếng Việt, tự đoán nghĩa từng từ trước rồi mới đối chiếu lại.","Vẽ hoặc tìm 1 bức tranh bất kỳ, thử áp dụng ít nhất 8 từ trong danh sách để mô tả bằng tiếng Anh.","Ôn lại 20 từ vựng bằng flashcard tự làm (giấy hoặc ứng dụng), lặp lại 2 lần trong ngày."], vocab:[
{term:"stand", meaning:"đứng", example:"A man is standing near the window."},
{term:"hold", meaning:"cầm, giữ", example:"She is holding a cup of coffee."},
{term:"point", meaning:"chỉ (tay/vật)", example:"He is pointing at the screen."},
{term:"carry", meaning:"mang, vác", example:"The worker is carrying a box."},
{term:"lean", meaning:"tựa, nghiêng", example:"A bicycle is leaning against the wall."},
{term:"reach", meaning:"với tới", example:"She is reaching for a file on the shelf."},
{term:"wear", meaning:"mặc, đeo", example:"The man is wearing a helmet."},
{term:"push", meaning:"đẩy", example:"He is pushing a cart."},
{term:"pull", meaning:"kéo", example:"They are pulling a rope."},
{term:"examine", meaning:"kiểm tra, xem xét", example:"The technician is examining the machine."},
{term:"in front of", meaning:"phía trước", example:"The car is parked in front of the building."},
{term:"next to", meaning:"bên cạnh", example:"The chair is next to the desk."},
{term:"between", meaning:"ở giữa", example:"The printer is between the two desks."},
{term:"across from", meaning:"đối diện", example:"The bank is across from the park."},
{term:"on top of", meaning:"trên đỉnh, trên cùng", example:"Books are stacked on top of each other."},
{term:"underneath", meaning:"bên dưới", example:"The cat is sleeping underneath the table."},
{term:"behind", meaning:"phía sau", example:"The garden is behind the house."},
{term:"along", meaning:"dọc theo", example:"People are walking along the river."},
{term:"arrange", meaning:"sắp xếp", example:"The items are arranged on the shelf."},
{term:"gather", meaning:"tụ tập", example:"A crowd has gathered near the entrance."},
]},
{label:'Thứ 3', title:'Luyện Part 1 có tính giờ', content:'Part 1 chỉ có 6 câu nhưng cần phản xạ rất nhanh — mỗi câu chỉ có khoảng vài giây suy nghĩ trước khi nghe đáp án. Luyện nghe kèm tính giờ giúp làm quen với tốc độ này thay vì chỉ luyện không giới hạn thời gian.', exercises:["Luyện 10 câu Part 1 có tính giờ nghiêm ngặt, nghe lại transcript đối chiếu những câu nghe chưa rõ.","Nghe lại 3 câu bạn làm sai, chỉ ra chính xác từ/cụm từ nào khiến bạn chọn nhầm đáp án.","Nghe 1 câu Part 1 lại 2 lần, ghi lại xem lần 2 có nghe rõ hơn lần 1 không.","Nghe lại toàn bộ 10 câu 1 lần nữa vào cuối ngày, không nhìn transcript, tự đánh giá tiến bộ trong ngày.","Ghi chú riêng những từ vựng Part 1 bạn chưa từng gặp trước đây vào sổ từ vựng cá nhân."]},
{label:'Thứ 4', title:'Các dạng câu hỏi Part 2', content:'Part 2 có 3 dạng chính: câu hỏi Wh- (What, Where, When, Who, Why, How), câu hỏi Yes/No, và câu hỏi lựa chọn (A or B). Mẹo quan trọng: chỉ cần nghe rõ 2-3 từ ĐẦU câu hỏi là đã có thể loại được nhiều đáp án sai — không cần nghe hiểu 100% cả câu.', exercises:["Với mỗi dạng câu hỏi bên dưới, tự viết thêm 1 ví dụ câu hỏi + câu trả lời khác của riêng bạn.","Che phần trả lời mẫu, tự nghĩ ra 1 câu trả lời hợp lý cho từng câu hỏi trước khi xem đáp án.","Tự viết 3 câu hỏi Part 2 kiểu Yes/No và tự viết 2 cách trả lời khác nhau (Yes và No) cho mỗi câu.","Tự đóng vai hỏi-đáp: viết 5 câu hỏi ngẫu nhiên thuộc các dạng đã học, nhờ người khác đọc để bạn luyện nghe.","Liệt kê lại 10 dạng câu hỏi đã học theo trí nhớ, không nhìn tài liệu, kiểm tra độ chính xác."], vocab:[
{term:"What...?", meaning:"hỏi sự việc/vật → trả lời bằng thông tin cụ thể", example:"What time does the store open? → At 9 a.m."},
{term:"Where...?", meaning:"hỏi địa điểm → trả lời bằng nơi chốn", example:"Where is the conference room? → On the third floor."},
{term:"Who...?", meaning:"hỏi người → trả lời bằng tên/chức danh", example:"Who signed this contract? → Mr. Tanaka did."},
{term:"Why...?", meaning:"hỏi lý do → trả lời bằng \"Because...\" hoặc lý do trực tiếp", example:"Why was the meeting canceled? → Because the manager is sick."},
{term:"How...?", meaning:"hỏi cách thức/mức độ → trả lời bằng phương thức hoặc số lượng", example:"How do I get to the airport? → Take the shuttle bus."},
{term:"Yes/No question", meaning:"trả lời bắt đầu bằng Yes/No hoặc ý tương đương", example:"Did you send the email? → Not yet."},
{term:"Or question (lựa chọn)", meaning:"trả lời chọn 1 trong 2, hoặc \"either/neither\"", example:"Should I call or email you? → Either is fine."},
{term:"Tag question", meaning:"trả lời xác nhận đồng ý/không đồng ý", example:"The report is ready, isn't it? → Yes, it is."},
{term:"Suggestion", meaning:"trả lời chấp nhận hoặc từ chối đề nghị", example:"Why don't we take a break? → Sure, good idea."},
{term:"Statement (không phải câu hỏi)", meaning:"trả lời phản hồi phù hợp với câu nói", example:"I think the deadline is too tight. → I agree, let's ask for more time."},
]},
{label:'Thứ 5', title:'Luyện Part 2 có tính giờ', content:'Khoảng cách giữa các câu hỏi trong Part 2 khá ngắn — nếu bị phân tâm suy nghĩ về câu trước, rất dễ bỏ lỡ câu sau. Luyện tập theo nhịp độ thật giúp xây dựng phản xạ "buông câu cũ, tập trung câu mới" ngay lập tức.', exercises:["Luyện 15 câu Part 2 có tính giờ liên tục không dừng, chấm điểm và ghi chú dạng câu hỏi nào hay sai nhất.","Ghi lại tổng thời gian làm 15 câu Part 2, tính trung bình mỗi câu mất bao nhiêu giây.","Đánh dấu những câu bạn bị \"bẫy\" bởi từ đồng âm, ghi chú riêng loại lỗi này để cảnh giác về sau.","Thử nhắm mắt khi nghe để tập trung hoàn toàn vào âm thanh, so sánh độ tập trung với khi nhìn màn hình.","Ghi lại 3 câu bạn nghe rõ ràng nhất và 3 câu khó nghe nhất trong 15 câu vừa luyện."]},
{label:'Thứ 6', title:'Nghe lại transcript & tổng kết tuần', content:'Nghe lại toàn bộ audio đã luyện trong tuần kèm xem transcript giúp phát hiện những từ/cụm từ bạn nghe sai do chưa quen phát âm, dù có thể bạn đã biết nghĩa của từ đó khi đọc.', exercises:["Nghe lại toàn bộ Part 1-2 đã luyện trong tuần, đối chiếu transcript, ghi ra sổ từ vựng những từ nghe chưa quen dù đã biết nghĩa.","Tổng hợp toàn bộ từ mới của tuần vào 1 danh sách, sắp xếp theo chủ đề.","Tự đọc to lại toàn bộ transcript đã nghe trong tuần để luyện phát âm và làm quen nhịp điệu câu.","Tổng hợp toàn bộ từ vựng Part 1-2 đã học cả tuần vào 1 danh sách duy nhất, sắp xếp theo chủ đề.","Tự làm 1 bài test nhỏ: nghe 5 câu ngẫu nhiên đã học trong tuần, viết lại nội dung nghe được."]},
]},
{title:"Reading Part 5 nâng cao & tổng kết tháng 1", points:["Part 5 thường kiểm tra từ loại (danh từ/động từ/tính từ/trạng từ) qua vị trí trống trong câu.","Xác định vị trí từ cần điền trước, sau đó mới xét nghĩa — nhiều câu chỉ cần biết từ loại là chọn được đáp án.","Học nhóm từ đi kèm cố định (collocations) như \"make a decision\", \"take responsibility\".","Không cần dịch toàn bộ câu để làm Part 5 — kỹ năng nhận diện cấu trúc quan trọng hơn hiểu 100% nghĩa.","Cuối tháng 1: làm lại 1 đề thử để so sánh tiến bộ so với tuần 1."], practice:"Làm 1 đề mini (Listening Part 1-2 + Reading Part 5, khoảng 30 câu) có tính giờ, so sánh điểm với tuần 1.", case:"Thí sinh đạt 800+ thường không giỏi vượt trội mọi thứ, mà làm rất chắc các câu Part 5 và Part 1-2 — đây là 'điểm sàn an toàn' của hầu hết thí sinh điểm cao.", task:"Làm 1 đề mini (Listening Part 1-2 + Reading Part 5, khoảng 30 câu) có tính giờ, so sánh điểm với tuần 1.", days:[
{label:'Thứ 2', title:'Nhận diện từ loại qua vị trí trong câu', content:'Phần lớn câu hỏi Part 5 có thể giải bằng cách xác định từ loại cần điền dựa vào VỊ TRÍ trong câu, không cần hiểu 100% nghĩa cả câu. Ví dụ: sau tính từ sở hữu (their, his) hoặc mạo từ (a, the) thường là danh từ; đứng trước danh từ thường là tính từ.', example:'Their ___ (decision) was final.  → cần danh từ (decision)\nShe made a ___ (quick) decision. → cần tính từ (quick)', exercises:["Làm 10 câu Part 5 chỉ tập trung xác định từ loại cần điền (không cần dịch nghĩa cả câu), đối chiếu đáp án.","Với mỗi câu đã làm, viết ra lý do từ loại bạn chọn đáp án đó.","Tự tạo 3 câu Part 5 mới dựa trên cấu trúc câu bạn vừa phân tích, tự đố lại bản thân.","Tự tạo 5 câu Part 5 mới có chỗ trống cần điền đúng từ loại, đổi cho bạn học cùng (nếu có) để giải chéo.","Ôn lại quy tắc vị trí tính từ/danh từ/trạng từ bằng cách tự vẽ sơ đồ đơn giản trên giấy."]},
{label:'Thứ 3', title:'Học collocation thường gặp', content:'Collocation là các cụm từ đi kèm cố định theo thói quen ngôn ngữ (ví dụ "make a decision" chứ không phải "do a decision"). Nhiều câu Part 5-6 kiểm tra chính xác kiến thức collocation này thay vì ngữ pháp thuần túy.', exercises:["Học 15 collocation thường gặp trong đề thi TOEIC (chủ đề công sở), viết mỗi collocation kèm 1 câu ví dụ.","Viết 5 câu ví dụ tự nghĩ ra có sử dụng đúng các collocation vừa học.","Ghép các collocation đã học thành 1 đoạn email công sở ngắn hoàn chỉnh.","Viết 1 email công sở ngắn (4-5 câu) cố gắng dùng ít nhất 5 collocation vừa học.","Tự kiểm tra: che phần nghĩa, chỉ nhìn collocation tiếng Anh, thử nhớ lại nghĩa tiếng Việt."]},
{label:'Thứ 4', title:'Luyện Part 5 tổng hợp có tính giờ', content:'Kết hợp toàn bộ kiến thức đã học trong tháng: nhận diện thì động từ, từ loại theo vị trí, và collocation — luyện với tốc độ tính giờ để quen áp lực thời gian thật.', exercises:["Làm hết bộ quiz bên dưới trong 1 lần, cố gắng dưới 10 phút, không xem lại lý thuyết.","Phân loại các câu sai xem thuộc nhóm lỗi thì động từ, từ loại, hay collocation để biết đang yếu phần nào nhất.","Đợi 1 ngày rồi làm lại bộ quiz này lần 2 (không xem đáp án cũ), so sánh điểm số.","Ôn lại các câu sai trong bộ quiz, phân loại theo 3 nhóm: lỗi thì động từ, lỗi từ loại, lỗi collocation.","Làm lại quiz lần 2 sau khi đã ôn lỗi, so sánh điểm số cải thiện được bao nhiêu."], quiz:[
{q:"The finance team ___ the budget every quarter.", opts:["review","reviews","is reviewing","reviewed"], correct:1, explain:"\"every quarter\" chỉ thói quen lặp lại → hiện tại đơn."},
{q:"Look, the shipment ___ right now — go check it.", opts:["arrives","arrived","is arriving","has arrived"], correct:2, explain:"\"Look\" + \"right now\" là dấu hiệu của hiện tại tiếp diễn."},
{q:"We ___ this vendor since 2019.", opts:["use","used","have used","are using"], correct:2, explain:"\"since 2019\" → hiện tại hoàn thành."},
{q:"He ___ his resignation letter last Friday.", opts:["has submitted","submitted","submits","is submitting"], correct:1, explain:"\"last Friday\" là mốc thời gian xác định trong quá khứ → quá khứ đơn."},
{q:"The new intern is very ___.", opts:["hardworking","hardworkingly","hardwork","hardworked"], correct:0, explain:"Sau to be \"is\" cần tính từ → hardworking."},
{q:"She completed the task ___.", opts:["efficient","efficiently","efficiency","efficacious"], correct:1, explain:"Trạng từ bổ nghĩa cho động từ \"completed\", đứng cuối câu → efficiently."},
{q:"This decision will have a major ___ on our budget.", opts:["impact","impactful","impactfully","impacted"], correct:0, explain:"Sau tính từ \"major\" cần danh từ → impact."},
{q:"The manager is ___ for approving all expenses.", opts:["response","responsible","responsibly","responsibility"], correct:1, explain:"Sau to be \"is\" cần tính từ → responsible (responsible for)."},
{q:"Please comply ___ the new safety regulations.", opts:["with","to","for","at"], correct:0, explain:"Cụm cố định \"comply with\" (tuân thủ)."},
{q:"The proposal is subject ___ approval by the board.", opts:["to","of","with","for"], correct:0, explain:"Cụm cố định \"subject to\" (tùy thuộc vào, cần được)."},
{q:"They ___ two more staff members next month.", opts:["hire","hires","are hiring","hired"], correct:2, explain:"Kế hoạch tương lai đã sắp xếp (\"next month\") → hiện tại tiếp diễn."},
{q:"He has never ___ such a difficult client before.", opts:["handled","handle","handling","was handling"], correct:0, explain:"\"never ... before\" là dấu hiệu của hiện tại hoàn thành; sau \"has\" cần past participle → handled."},
{q:"The equipment ___ regularly to avoid breakdowns.", opts:["inspect","inspects","is inspected","inspected"], correct:1, explain:"Quy trình thường xuyên → hiện tại đơn (chủ ngữ số ít thêm -s; đây không phải câu bị động nên chọn dạng chủ động thường gặp trong đề)."},
{q:"Our goal is to provide ___ service to every customer.", opts:["exceptional","exceptionally","exception","except"], correct:0, explain:"Cần tính từ đứng trước danh từ \"service\" → exceptional."},
{q:"The department relies heavily ___ customer feedback.", opts:["on","at","with","to"], correct:0, explain:"Cụm cố định \"rely on\" (dựa vào, phụ thuộc vào)."},
]},
{label:'Thứ 5', title:'Làm đề mini tổng hợp', content:'Đề mini kết hợp Part 1-2 (Listening) và Part 5 (Reading) là bài kiểm tra tổng thể đầu tiên sau 4 tuần học có hệ thống — giúp đánh giá khách quan mức độ tiến bộ so với đề thử ban đầu ở tuần 1.', exercises:["Làm 1 đề mini khoảng 30 câu (Part 1-2 + Part 5) có tính giờ nghiêm ngặt như thi thật.","Ghi lại chính xác thời gian làm từng Part trong đề mini, so với mốc thời gian gợi ý.","Highlight lại 3 câu bạn tự tin nhất và 3 câu bạn không chắc nhất để phân tích riêng sau.","Trước khi làm đề, dự đoán trước điểm số bạn nghĩ mình sẽ đạt được, so sánh với kết quả thật.","Highlight lại 3 câu bạn tự tin nhất và 3 câu không chắc chắn nhất trong đề vừa làm."]},
{label:'Thứ 6', title:'Tổng kết tháng 1 & lên kế hoạch tháng 2', content:'So sánh điểm đề mini hôm nay với đề thử ở tuần 1 — nếu có tiến bộ dù nhỏ, đó là tín hiệu tốt cho thấy phương pháp học đang đúng hướng. Tháng 2 sẽ mở rộng sang Part 3-4 (Listening) và Part 6 (Reading), đòi hỏi nền tảng ngữ pháp và từ vựng đã xây trong tháng 1.', exercises:["So sánh chi tiết điểm số và số câu đúng theo từng Part giữa đề mini hôm nay và đề thử tuần 1, viết ra 2-3 điểm đã cải thiện rõ rệt nhất.","Viết 1 đoạn nhật ký học tập ngắn tổng kết cảm nhận sau tháng 1.","Đặt mục tiêu cụ thể (bằng số liệu) cho tháng 2, ví dụ: \"giảm số câu sai Part 3 xuống dưới X câu\".","Vẽ biểu đồ đơn giản (trên giấy) thể hiện điểm số qua 4 lần làm đề/quiz lớn trong tháng để thấy xu hướng tiến bộ.","Viết ra 3 mục tiêu cụ thể cho tháng 2 dựa trên điểm yếu đã xác định được trong tháng 1."], quiz:[
{q:"Thì nào dùng với dấu hiệu \"since 2020\"?", opts:["Hiện tại đơn","Quá khứ đơn","Hiện tại hoàn thành","Tương lai"], correct:2, explain:"\"since\" đi kèm mốc thời gian bắt đầu, là dấu hiệu của hiện tại hoàn thành."},
{q:"Thì nào dùng với dấu hiệu \"yesterday\"?", opts:["Hiện tại đơn","Quá khứ đơn","Hiện tại hoàn thành","Hiện tại tiếp diễn"], correct:1, explain:"\"yesterday\" là mốc thời gian xác định trong quá khứ → quá khứ đơn."},
{q:"Cấu trúc nào đúng: \"She is very ___\" (cần tính từ)?", opts:["success","successful","successfully","succeed"], correct:1, explain:"Sau to be \"is\" cần tính từ → successful."},
{q:"Cụm từ nào đúng nghĩa \"chịu trách nhiệm về\"?", opts:["responsible of","responsible for","responsible with","responsible at"], correct:1, explain:"Cụm cố định chuẩn là \"responsible for\"."},
{q:"Trong 4 tuần đã học, ngữ pháp thì và từ loại liên quan với nhau thế nào?", opts:["Không liên quan gì nhau, học riêng biệt","Cả 2 đều quan trọng và thường kết hợp trong cùng 1 câu Part 5","Chỉ có 1 loại kiến thức quan trọng","Chỉ từ loại quan trọng, thì không cần"], correct:1, explain:"Đề Part 5 thường kết hợp cả 2: vừa cần nhận diện thì đúng, vừa cần chọn đúng từ loại theo vị trí."},
{q:"Đề Part 5 thường kiểm tra điều gì nhiều nhất?", opts:["Chỉ từ vựng khó, hiếm gặp","Ngữ pháp và từ loại qua vị trí trong câu","Chỉ phát âm","Chỉ nghĩa của cả câu"], correct:1, explain:"Phần lớn câu Part 5 giải được bằng cách xác định đúng cấu trúc ngữ pháp/từ loại cần điền, không cần dịch cả câu."},
{q:"Nếu bạn hay sai dạng bài xác định từ loại, nên ôn tập gì?", opts:["Học thuộc từ vựng ngẫu nhiên không liên quan","Ôn lại quy tắc vị trí (trước/sau danh từ, động từ...) của từng từ loại","Bỏ qua, không cần ôn lại","Chỉ luyện nghe, không cần đọc"], correct:1, explain:"Nắm vững quy tắc vị trí từ loại giúp giải nhanh Part 5 mà không cần nhớ nghĩa từng từ."},
{q:"Việc làm đề mini hàng tuần có lợi ích gì?", opts:["Không có lợi ích rõ ràng","Giúp đo lường tiến bộ thực tế và làm quen áp lực thời gian","Chỉ để lấy điểm cao nhất thời","Chỉ cần làm đúng 1 lần duy nhất là đủ"], correct:1, explain:"Làm đề định kỳ giúp theo dõi xu hướng tiến bộ khách quan, thay vì chỉ cảm nhận chủ quan."},
{q:"Sau tháng 1, trọng tâm tháng 2 nên là gì theo lộ trình đã học?", opts:["Học lại toàn bộ tháng 1 từ đầu","Mở rộng sang Part 3-4 Listening và Part 6-7 Reading","Ngừng học TOEIC","Chỉ học từ vựng, bỏ ngữ pháp"], correct:1, explain:"Tháng 2 xây dựng trên nền tảng tháng 1, mở rộng sang các Part khó hơn (hội thoại, đoạn văn dài)."},
{q:"Cách ôn tập hiệu quả nhất khi có nhiều lỗi sai là gì?", opts:["Ôn tất cả kiến thức từ đầu như chưa học gì","Phân loại lỗi sai theo nhóm, ưu tiên ôn nhóm sai nhiều nhất","Bỏ qua lỗi sai, học tiếp bài mới","Chỉ ôn 1 lần duy nhất là đủ"], correct:1, explain:"Ôn tập có trọng tâm (dựa trên thống kê lỗi sai thực tế) hiệu quả hơn nhiều so với ôn lan man toàn bộ."},
{q:"Chủ đề từ vựng nào ĐÃ được học trong tháng 1?", opts:["Y học chuyên sâu","Công sở cơ bản, hành động/vị trí (Part 1), câu hỏi giao tiếp (Part 2)","Chỉ toán học nâng cao","Chỉ lịch sử thế giới"], correct:1, explain:"Tháng 1 tập trung từ vựng nền tảng: công sở, mô tả hành động/vị trí, và các dạng câu hỏi giao tiếp cơ bản."},
{q:"Điều gì quan trọng nhất để đạt 800+ sau khi hoàn thành lộ trình 4 tháng?", opts:["Chỉ cần học lý thuyết, không cần luyện đề","Luyện tập đều đặn, làm nhiều đề thử, và ôn đúng trọng tâm lỗi sai của bản thân","Học thuộc lòng toàn bộ từ điển tiếng Anh","Chỉ cần may mắn khi đi thi"], correct:1, explain:"Sự đều đặn kết hợp với ôn tập có trọng tâm (dựa trên lỗi sai thực tế) là yếu tố quyết định thành công, quan trọng hơn học lý thuyết suông."},
]},
]},
{title:"Listening Part 3 — hội thoại ngắn", points:["Part 3 là hội thoại 2-3 người, mỗi bài có 3 câu hỏi liên quan.","Đọc trước câu hỏi và đáp án trước khi nghe giúp biết cần chú ý thông tin gì.","Câu hỏi cuối cùng mỗi bài thường liên quan ý định/hành động tiếp theo — cần nghe đến cuối đoạn.","Ghi chú nhanh (note-taking) các con số, tên, thời gian nhắc đến trong lúc nghe.","Một số câu hỏi kèm hình ảnh/biểu đồ yêu cầu kết hợp thông tin nghe được với hình."], practice:"Làm 3 bài hội thoại Part 3 (9 câu), sau đó nghe lại và note ra những từ khóa quan trọng đã bỏ lỡ.", case:"Part 3 là phần nhiều thí sinh mất điểm nhất vì tốc độ hội thoại nhanh và có 3 câu hỏi dồn dập cho 1 bài nghe.", task:"Làm 3 bài hội thoại Part 3 (9 câu), sau đó nghe lại và note ra những từ khóa quan trọng đã bỏ lỡ."},
{title:"Listening Part 4 — bài nói ngắn", points:["Part 4 là các bài nói dài hơn Part 3 (thông báo, quảng cáo, voice mail...), mỗi bài 3 câu hỏi.","Nhận diện loại bài nói giúp đoán trước nội dung sẽ nghe.","Chiến lược đọc trước câu hỏi vẫn áp dụng như Part 3, càng quan trọng hơn vì bài dài hơn.","Từ vựng thường gặp: thông báo nội bộ, lịch trình, sự kiện công ty — nên học theo chủ đề này.","Luyện nghe tốc độ thật (không làm chậm lại) để quen với tốc độ đề thi thật."], practice:"Làm 3 bài Part 4 (9 câu), chấm điểm và liệt kê loại bài nói nào mình yếu nhất.", case:"Part 4 thường có giọng đọc chuẩn hơn Part 3 (ít hội thoại tự nhiên) nên với thí sinh luyện đúng phương pháp, đây lại là phần dễ ăn điểm hơn Part 3.", task:"Làm 3 bài Part 4 (9 câu), chấm điểm và liệt kê loại bài nói nào mình yếu nhất."},
{title:"Reading Part 6 — đoạn văn điền từ", points:["Part 6 giống Part 5 nhưng đặt trong đoạn văn có ngữ cảnh, cần đọc câu trước/sau để chọn đúng.","Có dạng câu hỏi chọn cả 1 câu hoàn chỉnh để điền vào chỗ trống — cần hiểu mạch ý cả đoạn.","Chú ý các từ nối (however, therefore, in addition) vì gợi ý quan hệ logic giữa các câu.","Thì động từ trong Part 6 phụ thuộc ngữ cảnh thời gian của cả đoạn, không chỉ câu chứa chỗ trống.","Làm Part 6 chậm hơn Part 5 một chút vì cần đọc hiểu ngữ cảnh, nhưng vẫn cần kiểm soát thời gian."], practice:"Làm 2 đoạn Part 6 (8 câu), phân tích riêng câu dạng \"chọn cả câu\" xem đã hiểu đúng mạch ý đoạn chưa.", case:"Part 6 chỉ có 16 câu nhưng lại bị nhiều thí sinh bỏ qua ôn luyện kỹ — trong khi đây là phần tương đối dễ lấy điểm nếu nắm vững ngữ pháp theo ngữ cảnh.", task:"Làm 2 đoạn Part 6 (8 câu), phân tích riêng câu dạng \"chọn cả câu\" xem đã hiểu đúng mạch ý đoạn chưa."},
{title:"Từ vựng mở rộng & tổng kết tháng 2", points:["Mở rộng từ vựng theo chủ đề: tài chính, nhân sự, sản xuất, du lịch công tác.","Học từ vựng theo cụm (collocation) thay vì từ đơn lẻ giúp nhớ lâu và dùng đúng ngữ cảnh hơn.","Ôn lại các câu sai của tháng 2, phân loại lỗi theo dạng (ngữ pháp/từ vựng/nghe không kịp).","Làm 1 đề mini tổng hợp cả 4 kỹ năng đã học (Part 1-4 Listening, Part 5-6 Reading).","Cuối tháng 2 nên đã quen với format và tốc độ của từng dạng câu hỏi."], practice:"Làm 1 đề mini đầy đủ hơn (khoảng 50 câu, đủ Part 1-6), so sánh điểm với đề thử tháng 1.", case:"Nhiều đề thi thật lặp lại các chủ đề quen thuộc (họp hành, du lịch công tác, tuyển dụng) — học từ vựng đúng chủ đề tiết kiệm thời gian hơn học từ vựng ngẫu nhiên.", task:"Làm 1 đề mini đầy đủ hơn (khoảng 50 câu, đủ Part 1-6), so sánh điểm với đề thử tháng 1."},
{title:"Reading Part 7 — đọc hiểu đơn", points:["Part 7 chiếm phần lớn thời gian Reading, cần chiến lược quản lý thời gian chặt chẽ.","Đọc lướt (skim) tiêu đề và câu đầu đoạn trước để nắm ý chính, sau đó đọc kỹ theo câu hỏi.","Câu hỏi dạng \"theo đoạn văn, điều gì đúng\" cần đối chiếu từng đáp án với văn bản, không đoán.","Câu hỏi từ đồng nghĩa cần xét nghĩa theo ngữ cảnh cụ thể, không theo nghĩa từ điển chung.","Luyện đọc nhanh nhưng chính xác quan trọng hơn đọc chậm để hiểu 100%."], practice:"Làm 2 bài đọc đơn Part 7 (10 câu) trong thời gian giới hạn khoảng 15 phút, tự đánh giá tốc độ đọc.", case:"Part 7 đơn chiếm khoảng 29 câu — đây là phần 'ăn chắc' cần luyện tốc độ đọc trước khi chuyển sang phần khó hơn.", task:"Làm 2 bài đọc đơn Part 7 (10 câu) trong thời gian giới hạn khoảng 15 phút, tự đánh giá tốc độ đọc."},
{title:"Reading Part 7 — đọc hiểu kép/ba", points:["Dạng đọc kép/ba yêu cầu kết hợp thông tin từ 2-3 văn bản khác nhau.","Luôn xác định câu hỏi cần thông tin từ văn bản nào trước khi tìm kiếm, tránh đọc lan man.","Câu hỏi khó nhất thường yêu cầu suy luận chéo giữa 2 văn bản.","Quản lý thời gian: nên dành không quá 8-10 phút cho mỗi bộ đọc kép/ba.","Đây là phần khó nhất của đề thi — không cần làm hoàn hảo, ưu tiên các câu dễ suy luận trước."], practice:"Làm 1 bộ đọc kép hoặc ba (khoảng 5 câu), đo thời gian làm và ghi lại câu nào cần suy luận chéo.", case:"Đọc hiểu kép/ba tuy khó nhưng chỉ chiếm khoảng 25 câu cuối — chiến thuật hợp lý là làm chắc phần dễ trước, dành thời gian còn lại cho phần khó.", task:"Làm 1 bộ đọc kép hoặc ba (khoảng 5 câu), đo thời gian làm và ghi lại câu nào cần suy luận chéo."},
{title:"Luyện đề tổng hợp có tính giờ", points:["Bắt đầu luyện đề theo đúng format thời gian thật: 45 phút Listening liền mạch + 75 phút Reading liền mạch.","Quen với việc không dừng lại giữa chừng — đề thi thật không có cơ hội tua lại băng nghe.","Ghi nhận Part nào tốn thời gian nhất trong Reading để phân bổ lại thời gian hợp lý hơn.","Sau khi làm xong, dành thời gian review kỹ tất cả câu sai thay vì chỉ xem điểm số.","Áp lực thời gian là yếu tố quan trọng nhất ảnh hưởng điểm số ở giai đoạn luyện đề."], practice:"Làm 1 đề TOEIC đầy đủ có tính giờ nghiêm ngặt, ghi lại điểm từng phần và thời gian còn dư/thiếu ở Reading.", case:"Nhiều thí sinh luyện đề rời rạc từng Part mà không luyện full-test có tính giờ — dẫn đến làm tốt khi luyện tập nhưng đuối sức khi thi thật vì không quen áp lực thời gian liên tục 2 tiếng.", task:"Làm 1 đề TOEIC đầy đủ có tính giờ nghiêm ngặt, ghi lại điểm từng phần và thời gian còn dư/thiếu ở Reading."},
{title:"Phân tích lỗi sai & tổng kết tháng 3", points:["Lập bảng thống kê lỗi sai theo Part, theo dạng câu hỏi để biết chính xác điểm yếu còn lại.","Với Listening: xác định lỗi do không nghe kịp tốc độ, không hiểu từ vựng, hay do mất tập trung.","Với Reading: xác định lỗi do thiếu từ vựng, sai ngữ pháp, hay do hết thời gian chưa kịp làm.","Ưu tiên ôn lại đúng nhóm lỗi sai nhiều nhất thay vì học lan man toàn bộ kiến thức.","Mục tiêu cuối tháng 3: điểm mini-test tổng hợp nên đã cải thiện rõ rệt so với tháng 2."], practice:"Làm 1 đề đầy đủ khác, lập bảng thống kê lỗi sai chi tiết theo Part và dạng câu hỏi.", case:"Việc thống kê lỗi sai có hệ thống là điều phân biệt thí sinh tự học hiệu quả với thí sinh học tràn lan không tiến bộ dù luyện rất nhiều đề.", task:"Làm 1 đề đầy đủ khác, lập bảng thống kê lỗi sai chi tiết theo Part và dạng câu hỏi."},
{title:"Chiến thuật Listening tốc độ cao", points:["Trong lúc nghe Part 3-4, tranh thủ đọc trước câu hỏi của bài tiếp theo nếu đã trả lời xong bài hiện tại.","Nếu bỏ lỡ 1 câu, đừng dừng lại suy nghĩ — bỏ qua ngay để không ảnh hưởng các câu sau.","Luyện tai với nhiều giọng khác nhau (Anh-Anh, Anh-Mỹ, Anh-Úc) vì đề thi có đủ các giọng này.","Đoán đáp án có cơ sở (loại trừ) tốt hơn bỏ trống — TOEIC không trừ điểm câu sai.","Giữ nhịp độ ổn định xuyên suốt, tránh dồn tập trung hết vào các bài đầu rồi đuối ở cuối."], practice:"Làm 2 đề Listening liên tiếp không nghỉ để luyện sức bền tập trung, ghi lại thời điểm bắt đầu mất tập trung.", case:"Giọng Anh-Úc thường là giọng gây khó nhất cho thí sinh Việt Nam vì ít được tiếp xúc trong quá trình học phổ thông — cần chủ động luyện thêm giọng này.", task:"Làm 2 đề Listening liên tiếp không nghỉ để luyện sức bền tập trung, ghi lại thời điểm bắt đầu mất tập trung."},
{title:"Chiến thuật Reading & quản lý thời gian", points:["Phân bổ thời gian gợi ý: Part 5 khoảng 10 phút, Part 6 khoảng 10 phút, Part 7 còn lại khoảng 55 phút.","Nếu 1 câu Part 7 mất quá 1 phút mà vẫn chưa chắc đáp án, đánh dấu và làm câu tiếp theo trước.","Luôn để lại vài phút cuối để tô đáp án cho các câu đã đánh dấu bỏ qua, không để trống.","Làm quen với việc đọc nhanh không dịch từng từ, chỉ nắm ý chính và từ khóa trong câu hỏi.","Thực hành đúng thời gian thật nhiều lần giúp cảm giác quản lý thời gian trở thành phản xạ."], practice:"Làm 1 đề Reading đầy đủ, tự đặt mốc thời gian cho từng Part và kiểm tra xem có bám sát kế hoạch không.", case:"Rất nhiều thí sinh mất điểm ở Part 7 không phải vì không hiểu bài mà vì hết giờ chưa kịp làm — quản lý thời gian đôi khi quan trọng hơn trình độ đọc hiểu.", task:"Làm 1 đề Reading đầy đủ, tự đặt mốc thời gian cho từng Part và kiểm tra xem có bám sát kế hoạch không."},
{title:"Luyện full test có tính giờ nghiêm ngặt", points:["Làm đề đầy đủ trong điều kiện giống thi thật nhất có thể (không gian yên tĩnh, không dừng giữa chừng).","So sánh điểm số qua các lần làm đề để thấy rõ xu hướng tiến bộ, không chỉ nhìn 1 lần duy nhất.","Nếu điểm chưa đạt 800, xác định rõ đang thiếu ở Listening hay Reading để tập trung tuần cuối.","Ôn lại các collocation, cụm từ hay gặp đã note trong suốt 3 tháng trước — không học từ mới tràn lan giai đoạn này.","Giữ tâm lý ổn định, tránh học dồn ép quá mức gây căng thẳng trước ngày thi."], practice:"Làm 1 đề full test có tính giờ nghiêm ngặt, ghi lại điểm số để so sánh với các lần luyện đề trước.", case:"Điểm số dao động ±30-50 điểm giữa các lần luyện đề là bình thường — nên nhìn vào xu hướng trung bình của nhiều lần thi thử thay vì 1 kết quả đơn lẻ.", task:"Làm 1 đề full test có tính giờ nghiêm ngặt, ghi lại điểm số để so sánh với các lần luyện đề trước."},
{title:"Tổng ôn & sẵn sàng cho ngày thi", points:["Rà soát lại toàn bộ lỗi sai đã note trong 4 tháng, tập trung vào các lỗi lặp lại nhiều lần.","Ôn lại nhanh danh sách từ vựng/collocation quan trọng, không học kiến thức hoàn toàn mới ở tuần cuối.","Chuẩn bị tâm lý và thể lực: ngủ đủ giấc, tránh luyện đề nặng sát ngày thi (nghỉ 1 ngày trước khi thi).","Kiểm tra lại giấy tờ, địa điểm, giờ thi để tránh sự cố phút chót gây mất tập trung không cần thiết.","Nhắc lại chiến thuật cốt lõi: đọc trước câu hỏi, không bỏ trống câu nào, quản lý thời gian theo mốc đã luyện."], practice:"Làm 1 đề full test cuối cùng nhẹ nhàng (không cần tính giờ quá căng thẳng) để giữ phong độ trước ngày thi thật.", case:"Tâm lý phòng thi (căng thẳng, thiếu ngủ) có thể khiến thí sinh mất 20-30 điểm so với lúc luyện tập ở nhà — chuẩn bị tâm lý là bước cuối cùng nhưng không kém quan trọng.", task:"Làm 1 đề full test cuối cùng nhẹ nhàng (không cần tính giờ quá căng thẳng) để giữ phong độ trước ngày thi thật."},
];

/* ============ AWS SOLUTIONS ARCHITECT ASSOCIATE — 12 TUẦN / 3 THÁNG ============ */
const awsWeeks = [
{title:"Tổng quan AWS & IAM", points:["AWS là nền tảng điện toán đám mây lớn nhất thế giới, cung cấp hạ tầng (compute, storage, network) theo mô hình trả tiền theo nhu cầu sử dụng.","IAM quản lý người dùng, nhóm, vai trò (role) và quyền truy cập vào tài nguyên AWS.","Nguyên tắc \"least privilege\" (đặc quyền tối thiểu): chỉ cấp đúng quyền cần thiết, không cấp dư thừa.","Root account có toàn quyền — nên hạn chế dùng hàng ngày, tạo IAM user riêng cho công việc thường xuyên.","MFA (xác thực đa yếu tố) nên bật cho mọi tài khoản quan trọng, đặc biệt root account."], practice:"Tạo tài khoản AWS Free Tier, tạo 1 IAM user mới với quyền hạn chế (không phải admin), bật MFA cho root account.", case:"SAA-C03 luôn có câu hỏi về IAM best practice — hiểu đúng least privilege là kiến thức nền bắt buộc.", task:"Tạo 1 IAM policy tùy chỉnh chỉ cho phép đọc (read-only) 1 dịch vụ cụ thể (ví dụ S3), gán cho user vừa tạo và thử nghiệm quyền hạn.", days:[
{label:'Thứ 2', title:'Giới thiệu điện toán đám mây & mô hình AWS', content:'Điện toán đám mây cho phép thuê tài nguyên IT qua internet thay vì tự đầu tư hạ tầng vật lý. AWS có 3 mô hình dịch vụ chính: IaaS (hạ tầng, ví dụ EC2), PaaS (nền tảng, ví dụ Elastic Beanstalk), SaaS (phần mềm hoàn chỉnh). Mô hình pay-as-you-go nghĩa là chỉ trả tiền cho tài nguyên thực sự dùng. AWS có mặt tại nhiều Region trên thế giới, mỗi Region gồm nhiều Availability Zone độc lập.', exercises:['Đăng ký tài khoản AWS Free Tier (cần thẻ tín dụng nhưng free tier đủ dùng cho khóa học này).','Đọc qua trang AWS Free Tier để biết dịch vụ nào miễn phí trong 12 tháng đầu.','Chọn 1 Region gần Việt Nam nhất (ví dụ ap-southeast-1 Singapore) làm Region mặc định khi thao tác.','Tìm hiểu sự khác biệt giữa On-Demand, Reserved Instance và Spot Instance của AWS, ghi chú tình huống nên dùng loại nào.','Xem trang AWS Global Infrastructure, đếm xem hiện có bao nhiêu Region đang hoạt động trên toàn cầu.'], quiz:[
{q:"Điện toán đám mây cho phép làm gì?", opts:["Chỉ lưu trữ ảnh", "Thuê tài nguyên IT qua internet thay vì tự đầu tư hạ tầng", "Chỉ dùng cho game", "Không liên quan đến internet"], correct:1, explain:"Cloud computing cho thuê tài nguyên IT theo nhu cầu qua internet."},
{q:"AWS có mấy mô hình dịch vụ chính?", opts:["1", "3 (IaaS, PaaS, SaaS)", "5", "10"], correct:1, explain:"3 mô hình cốt lõi: IaaS, PaaS, SaaS."},
{q:"IaaS là viết tắt của gì?", opts:["Infrastructure as a Service", "Internet as a Service", "Instance as a Service", "Information as a Service"], correct:0, explain:"IaaS cung cấp hạ tầng thô (compute, network, storage)."},
{q:"EC2 thuộc mô hình dịch vụ nào?", opts:["SaaS", "IaaS", "PaaS", "Không thuộc mô hình nào"], correct:1, explain:"EC2 cung cấp hạ tầng máy chủ ảo, thuộc nhóm IaaS."},
{q:"Pay-as-you-go nghĩa là gì?", opts:["Trả trước toàn bộ 1 năm", "Chỉ trả tiền cho tài nguyên thực sự dùng", "Miễn phí hoàn toàn", "Trả 1 lần duy nhất"], correct:1, explain:"Mô hình tính phí theo mức sử dụng thực tế, không cam kết trước."},
{q:"Region trong AWS là gì?", opts:["1 loại EC2 instance", "Khu vực địa lý nơi AWS đặt hạ tầng", "1 loại bảo mật", "Tên miền"], correct:1, explain:"Region là khu vực địa lý chứa hạ tầng vật lý của AWS."},
{q:"Mỗi Region gồm nhiều gì?", opts:["Availability Zone (AZ) độc lập", "Chỉ 1 trung tâm dữ liệu duy nhất", "Không có cấu trúc con", "Chỉ có 1 server"], correct:0, explain:"1 Region chứa nhiều AZ độc lập về mặt vật lý."},
{q:"Vì sao nên chọn Region gần người dùng?", opts:["Không quan trọng", "Giảm độ trễ (latency) khi truy cập", "Chỉ để tiết kiệm chi phí", "Bắt buộc theo luật"], correct:1, explain:"Region gần giúp giảm thời gian phản hồi cho người dùng cuối."},
{q:"SaaS khác gì so với IaaS?", opts:["Không khác gì", "SaaS là phần mềm hoàn chỉnh sẵn dùng; IaaS chỉ cung cấp hạ tầng thô", "SaaS rẻ hơn luôn", "IaaS không tồn tại"], correct:1, explain:"SaaS là phần mềm sẵn sàng sử dụng; IaaS đòi hỏi tự xây dựng trên hạ tầng."},
{q:"AWS Free Tier áp dụng trong thời gian bao lâu cho tài khoản mới?", opts:["Vĩnh viễn", "12 tháng đầu (với nhiều dịch vụ)", "Chỉ 1 tháng", "Không có Free Tier"], correct:1, explain:"Phần lớn ưu đãi Free Tier áp dụng trong 12 tháng đầu tài khoản mới."},
]},
{label:'Thứ 3', title:'IAM User, Group, Role', content:'IAM User đại diện cho 1 người/ứng dụng cụ thể cần truy cập AWS. IAM Group nhóm nhiều User lại để gán quyền chung. IAM Role là "bộ quyền tạm thời" gán cho dịch vụ AWS khác (ví dụ EC2) chứ không gán trực tiếp cho người dùng — an toàn hơn vì không cần lưu access key cố định. Access Key dùng để xác thực khi gọi AWS qua CLI/SDK, cần bảo mật tuyệt đối, không commit lên Git.', exercises:['Tạo 1 IAM Group tên "Developers", tạo 1 IAM User và thêm vào group đó.','Gán policy có sẵn "ReadOnlyAccess" cho group vừa tạo.','Thử đăng nhập bằng IAM User vừa tạo (không phải root) để xác nhận hoạt động.','Đọc tài liệu AWS về sự khác biệt giữa IAM User và IAM Role, viết ra 2 tình huống nên dùng Role thay vì User.','Thử xóa rồi tạo lại IAM User từ đầu để quen thao tác, lần này thêm mô tả (tag) rõ ràng cho user.'], quiz:[
{q:"IAM User đại diện cho gì?", opts:["Cá nhân/ứng dụng cần truy cập AWS", "1 loại EC2", "1 vùng địa lý", "1 loại storage"], correct:0, explain:"IAM User là danh tính đại diện cho 1 người hoặc ứng dụng cụ thể cần truy cập tài nguyên AWS."},
{q:"IAM Group dùng để làm gì?", opts:["Mã hóa dữ liệu", "Nhóm nhiều User để gán quyền chung", "Lưu trữ file", "Giám sát chi phí"], correct:1, explain:"Group giúp quản lý quyền cho nhiều user cùng lúc thay vì gán riêng lẻ."},
{q:"Vì sao nên dùng Role thay vì lưu access key cố định cho dịch vụ AWS?", opts:["Role rẻ hơn", "Role là quyền tạm thời, an toàn hơn vì không cần lưu key cố định", "Role nhanh hơn", "Không có lý do"], correct:1, explain:"Role cấp quyền tạm thời cho dịch vụ, tránh rủi ro lộ access key cố định."},
{q:"Access Key dùng khi nào?", opts:["Đăng nhập Console", "Gọi AWS qua CLI/SDK", "Đặt tên bucket", "Tạo VPC"], correct:1, explain:"Access Key dùng để xác thực chương trình/CLI gọi API AWS, khác đăng nhập Console."},
{q:"Policy \"ReadOnlyAccess\" cho phép làm gì?", opts:["Sửa và xóa tài nguyên", "Chỉ đọc, không sửa/xóa", "Toàn quyền", "Không quyền gì"], correct:1, explain:"Đúng như tên gọi, policy này chỉ cấp quyền xem, không cho phép thay đổi."},
{q:"Muốn nhiều User có cùng 1 bộ quyền, cách quản lý hiệu quả nhất là gì?", opts:["Gán riêng lẻ từng user", "Gán quyền qua Group", "Không thể làm được", "Phải tạo Role riêng"], correct:1, explain:"Group cho phép gán 1 lần, áp dụng cho toàn bộ thành viên."},
{q:"IAM Role thường được gán cho đối tượng nào?", opts:["Chỉ con người", "Dịch vụ AWS như EC2", "Chỉ root account", "Không gán được cho ai"], correct:1, explain:"Role phổ biến nhất là gán cho dịch vụ AWS (như EC2) cần quyền truy cập dịch vụ khác."},
{q:"Access Key gồm mấy thành phần?", opts:["1", "2 (Access Key ID + Secret Access Key)", "3", "4"], correct:1, explain:"Access Key gồm 1 ID công khai và 1 Secret Key cần giữ bí mật."},
{q:"Điều nào KHÔNG nên làm với Access Key?", opts:["Bảo mật cẩn thận", "Commit lên Git công khai", "Lưu ở nơi an toàn", "Xoay vòng định kỳ"], correct:1, explain:"Commit access key lên Git công khai là lỗi bảo mật nghiêm trọng và rất phổ biến."},
{q:"Đăng nhập bằng IAM User khác đăng nhập bằng root account ở điểm nào?", opts:["Không khác gì", "IAM User dùng tài khoản riêng, không có toàn quyền như root", "IAM User luôn có toàn quyền", "Root không đăng nhập được"], correct:1, explain:"IAM User có quyền giới hạn theo policy được gán, an toàn hơn dùng root."},
]},
{label:'Thứ 4', title:'IAM Policy & thực hành cấp quyền', content:'IAM Policy là văn bản JSON định nghĩa quyền được phép/bị từ chối, gồm Effect (Allow/Deny), Action, Resource. AWS Managed Policy là policy có sẵn do AWS tạo; Customer Managed Policy là policy tự viết theo nhu cầu riêng. Deny luôn được ưu tiên hơn Allow khi có xung đột giữa nhiều policy áp dụng cùng lúc. Policy có thể gán trực tiếp cho User, hoặc gián tiếp qua Group/Role.', example:'{\n  "Effect": "Allow",\n  "Action": ["s3:GetObject", "s3:ListBucket"],\n  "Resource": ["arn:aws:s3:::my-bucket/*"]\n}', exercises:['Viết 1 Customer Managed Policy JSON chỉ cho phép List và Get object trong 1 bucket S3 cụ thể.','Gán policy vừa viết cho IAM User, thử test quyền (nên bị từ chối các hành động khác như Delete).','Đọc và giải thích từng phần của 1 AWS Managed Policy có sẵn.','Thử sửa policy đã tạo để thêm quyền s3:PutObject (upload file), xác nhận user giờ upload được.','Tìm hiểu công cụ IAM Policy Simulator của AWS, dùng thử để kiểm tra 1 policy trước khi gán thật.'], quiz:[
{q:"IAM Policy là gì?", opts:["File âm thanh", "Văn bản JSON định nghĩa quyền Allow/Deny", "Loại EC2 instance", "Địa chỉ IP"], correct:1, explain:"Policy là văn bản JSON mô tả quyền được phép hoặc bị từ chối."},
{q:"Policy gồm những thành phần chính nào?", opts:["Effect, Action, Resource", "Chỉ có Effect", "Chỉ có Resource", "Region, AZ, VPC"], correct:0, explain:"3 thành phần cốt lõi của 1 policy statement là Effect, Action, Resource."},
{q:"AWS Managed Policy khác Customer Managed Policy thế nào?", opts:["Không khác gì", "Managed Policy do AWS tạo sẵn; Customer Managed do người dùng tự viết", "Managed Policy chỉ dùng cho root", "Customer Managed miễn phí hơn"], correct:1, explain:"Managed Policy có sẵn từ AWS; Customer Managed do chính bạn tự soạn theo nhu cầu."},
{q:"Nếu 1 policy Allow và 1 policy Deny cùng áp dụng, kết quả là gì?", opts:["Allow thắng", "Deny luôn được ưu tiên", "Ngẫu nhiên", "Lỗi"], correct:1, explain:"AWS luôn ưu tiên Deny khi có xung đột giữa các policy áp dụng."},
{q:"Effect trong policy có 2 giá trị nào?", opts:["Yes/No", "Allow/Deny", "True/False", "On/Off"], correct:1, explain:"Effect chỉ nhận 1 trong 2 giá trị: Allow hoặc Deny."},
{q:"Policy có thể gán cho đối tượng nào?", opts:["Chỉ User", "User, Group, hoặc Role", "Chỉ Group", "Không gán được"], correct:1, explain:"Policy linh hoạt gán được cho cả 3 loại danh tính IAM."},
{q:"IAM Policy Simulator dùng để làm gì?", opts:["Tạo user tự động", "Mô phỏng/kiểm tra quyền trước khi gán thật", "Tính chi phí", "Backup dữ liệu"], correct:1, explain:"Công cụ này giúp kiểm tra tác động của policy trước khi áp dụng thực tế."},
{q:"Muốn cho phép đọc 1 bucket S3 cụ thể, Action nào phù hợp?", opts:["s3:DeleteObject", "s3:GetObject", "ec2:RunInstances", "iam:CreateUser"], correct:1, explain:"s3:GetObject là action cho phép đọc (lấy) object từ S3."},
{q:"Resource trong policy dùng để làm gì?", opts:["Chỉ định tài nguyên cụ thể áp dụng quyền", "Đặt tên policy", "Ghi chú", "Không có tác dụng"], correct:0, explain:"Resource xác định chính xác tài nguyên nào (ví dụ ARN của 1 bucket) mà quyền áp dụng."},
{q:"Vì sao nên chỉ định đúng Resource thay vì dùng dấu * cho mọi tài nguyên?", opts:["Không quan trọng", "Tuân thủ least privilege, giảm rủi ro bảo mật", "Chỉ để code ngắn hơn", "Bắt buộc theo cú pháp"], correct:1, explain:"Chỉ định cụ thể giúp giới hạn phạm vi quyền, đúng nguyên tắc least privilege."},
]},
{label:'Thứ 5', title:'Bảo mật tài khoản: MFA & Billing Alert', content:'MFA yêu cầu thêm 1 lớp xác thực (mã OTP từ app hoặc thiết bị vật lý) ngoài mật khẩu, giảm đáng kể rủi ro bị chiếm tài khoản. Root account nên bật MFA ngay từ đầu và hạn chế sử dụng cho công việc hàng ngày. CloudTrail (học sâu hơn ở tuần 10) ghi lại mọi hành động API. AWS Billing Alert giúp cảnh báo khi chi phí vượt ngưỡng đặt trước, quan trọng khi mới học để tránh phát sinh chi phí ngoài ý muốn.', exercises:['Bật MFA cho root account bằng app Google Authenticator hoặc tương tự.','Tạo 1 Billing Alert cảnh báo khi chi phí vượt 5 USD.','Xem lại Security Status trong IAM Dashboard, xử lý hết các cảnh báo màu đỏ nếu có.','Tìm hiểu sự khác biệt giữa Billing Alert và AWS Budget, tạo thử 1 Budget đơn giản giới hạn 10 USD/tháng.','Xem lại toàn bộ IAM User đã tạo trong tuần, viết mô tả ngắn cho vai trò của từng user.'], quiz:[
{q:"MFA là viết tắt của gì?", opts:["Multi-Factor Authentication", "Main File Access", "Multiple Function App", "Managed Federal Access"], correct:0, explain:"MFA nghĩa là xác thực đa yếu tố."},
{q:"MFA thêm lớp bảo vệ nào?", opts:["Mã hóa file", "Xác thực bổ sung ngoài mật khẩu (OTP/thiết bị)", "Tường lửa", "Sao lưu tự động"], correct:1, explain:"MFA yêu cầu thêm 1 mã xác thực ngoài mật khẩu thông thường."},
{q:"Nên bật MFA cho tài khoản nào đầu tiên?", opts:["Chỉ IAM User thường", "Root account", "Không cần bật", "Chỉ tài khoản test"], correct:1, explain:"Root account có toàn quyền nên cần được bảo vệ bằng MFA đầu tiên."},
{q:"Billing Alert giúp ích gì?", opts:["Tăng tốc AWS", "Cảnh báo khi chi phí vượt ngưỡng đặt trước", "Bảo mật dữ liệu", "Sao lưu file"], correct:1, explain:"Billing Alert phát hiện sớm chi phí vượt mức dự kiến."},
{q:"AWS Budget khác Billing Alert ở điểm nào?", opts:["Không khác gì", "Budget cho phép đặt giới hạn & theo dõi chi tiết hơn theo dịch vụ/thời gian", "Budget chỉ dùng cho EC2", "Billing Alert mạnh hơn Budget"], correct:1, explain:"Budget cho phép thiết lập chi tiết và linh hoạt hơn so với Billing Alert đơn giản."},
{q:"CloudTrail dùng để làm gì?", opts:["Tạo VPC", "Ghi lại lịch sử mọi API call trong tài khoản", "Mã hóa ổ đĩa", "Tính chi phí"], correct:1, explain:"CloudTrail là công cụ audit ghi lại toàn bộ hành động API trong tài khoản."},
{q:"Vì sao mới học AWS nên bật Billing Alert ngay?", opts:["Không cần thiết", "Tránh phát sinh chi phí ngoài ý muốn khi thử nghiệm", "Bắt buộc theo luật", "Chỉ để trang trí"], correct:1, explain:"Người mới dễ vô tình để tài nguyên chạy quên, Billing Alert giúp phát hiện sớm."},
{q:"Security Status trong IAM Dashboard hiển thị gì?", opts:["Chi phí", "Các cảnh báo bảo mật cần xử lý", "Tốc độ mạng", "Dung lượng ổ đĩa"], correct:1, explain:"Đây là bảng tổng hợp các khuyến nghị bảo mật cần khắc phục."},
{q:"App nào thường dùng để tạo mã OTP cho MFA?", opts:["Google Authenticator", "Microsoft Word", "Notepad", "Calculator"], correct:0, explain:"Google Authenticator là app phổ biến để tạo mã OTP theo thời gian thực."},
{q:"Vì sao hạn chế dùng root cho việc hàng ngày dù đã bật MFA?", opts:["MFA không hoạt động với root", "Giảm thiểu rủi ro nếu root bị xâm nhập, vì root có toàn quyền tuyệt đối", "Root chậm hơn", "Không có lý do"], correct:1, explain:"Dù có MFA, root vẫn nên hạn chế dùng vì hậu quả nếu bị xâm nhập là lớn nhất."},
]},
{label:'Thứ 6', title:'Tổng kết tuần 1 & thực hành tổng hợp', content:'Tuần đầu tập trung vào nền tảng bảo mật và quản lý truy cập — kiến thức nền bắt buộc trước khi động vào bất kỳ dịch vụ compute/storage nào. Nguyên tắc cốt lõi: không dùng root cho việc hàng ngày, luôn áp dụng least privilege, luôn bật MFA. Đề thi SAA-C03 dành khoảng 15-20% câu hỏi liên quan trực tiếp hoặc gián tiếp đến IAM và bảo mật. Thực hành tay giúp nhớ lâu hơn nhiều so với chỉ xem video.', exercises:['Viết lại (bằng lời của bạn) nguyên tắc least privilege và giải thích tại sao nó quan trọng.','Tạo thêm 1 IAM User nữa với quyền hạn khác (ví dụ chỉ quyền EC2 read-only), thực hành tạo policy từ đầu không xem lại tuần trước.','Tự đánh giá: bạn đã tự tin giải thích được sự khác biệt giữa User/Group/Role chưa?','Viết checklist bảo mật cơ bản gồm ít nhất 5 việc cần làm ngay khi tạo tài khoản AWS mới.','Tự giải thích lại khái niệm IAM bạn thấy khó hiểu nhất bằng lời của chính mình, không nhìn tài liệu.'], quiz:[
{q:"IAM Role khác IAM User ở điểm nào?", opts:["Role có mật khẩu cố định","Role là bộ quyền tạm thời gán cho dịch vụ, không cần lưu access key cố định","Role chỉ dùng cho root account","Không có khác biệt"], correct:1, explain:"Role được các dịch vụ AWS (như EC2) \"đóng vai\" tạm thời để có quyền, an toàn hơn lưu access key cố định trên user."},
{q:"Nguyên tắc \"least privilege\" nghĩa là gì?", opts:["Cấp toàn quyền cho dễ quản lý","Chỉ cấp đúng quyền cần thiết, không dư thừa","Chỉ admin mới có quyền","Không cấp quyền cho ai cả"], correct:1, explain:"Least privilege là nguyên tắc bảo mật cốt lõi: mỗi user/role chỉ nên có đúng quyền cần cho công việc, không hơn."},
{q:"MFA là viết tắt của gì và dùng để làm gì?", opts:["Multi-Factor Authentication, thêm 1 lớp xác thực ngoài mật khẩu","Main File Access, quản lý file","Multiple File Allocation","Managed Federal Access"], correct:0, explain:"MFA yêu cầu thêm mã OTP hoặc thiết bị vật lý ngoài mật khẩu, giảm rủi ro bị chiếm tài khoản."},
{q:"Trong IAM Policy, nếu có 1 statement Allow và 1 statement Deny cùng áp dụng cho 1 action, kết quả là gì?", opts:["Allow luôn thắng","Deny luôn được ưu tiên","Ngẫu nhiên","Lỗi hệ thống"], correct:1, explain:"AWS luôn ưu tiên Deny khi có xung đột giữa các policy — đây là quy tắc bảo mật mặc định."},
{q:"Access Key dùng để làm gì?", opts:["Đăng nhập Console","Xác thực khi gọi AWS qua CLI/SDK","Mã hóa dữ liệu","Đặt tên cho resource"], correct:1, explain:"Access Key ID + Secret Access Key dùng để xác thực chương trình/CLI gọi AWS API, khác với đăng nhập Console bằng mật khẩu."},
{q:"Vì sao không nên dùng root account cho công việc hàng ngày?", opts:["Root chậm hơn","Root có toàn quyền, rủi ro cao nếu bị lộ hoặc thao tác nhầm","Root không hỗ trợ MFA","Root miễn phí có giới hạn"], correct:1, explain:"Root account có toàn quyền không giới hạn — nếu bị lộ hoặc thao tác sai sẽ gây hậu quả nghiêm trọng nhất."},
{q:"IAM Group dùng để làm gì?", opts:["Nhóm nhiều User lại để gán quyền chung dễ quản lý hơn","Chỉ chứa 1 user","Thay thế Access Key","Mã hóa dữ liệu"], correct:0, explain:"Group giúp gán cùng 1 bộ quyền cho nhiều user cùng lúc, thay vì gán riêng lẻ từng user."},
{q:"Billing Alert giúp ích gì?", opts:["Tăng tốc độ AWS","Cảnh báo khi chi phí vượt ngưỡng đặt trước","Bảo mật tài khoản","Sao lưu dữ liệu"], correct:1, explain:"Billing Alert giúp phát hiện sớm khi chi phí AWS vượt mức dự kiến, tránh phát sinh hóa đơn bất ngờ."},
{q:"Managed Policy khác Customer Managed Policy thế nào?", opts:["Managed Policy do AWS tạo sẵn; Customer Managed Policy do người dùng tự viết","Không khác gì","Managed Policy chỉ dùng cho root","Customer Managed Policy miễn phí hơn"], correct:0, explain:"AWS Managed Policy là policy có sẵn AWS tạo; Customer Managed Policy do chính bạn viết theo nhu cầu riêng."},
