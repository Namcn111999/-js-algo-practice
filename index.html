{title:"Java cơ bản: cú pháp, kiểu dữ liệu, biến", points:["Java là ngôn ngữ biên dịch — code .java được compile thành bytecode .class chạy trên JVM.","Kiểu dữ liệu nguyên thủy (int, double, boolean, char...) khác với kiểu tham chiếu (String, Object).","Biến phải khai báo kiểu rõ ràng (static typing), không suy luận linh hoạt như JavaScript.","Java phân biệt hoa thường; mỗi file .java có class public phải trùng tên file.","Câu lệnh điều kiện (if/else, switch) và vòng lặp (for/while) khá giống JS về cú pháp."], practice:"Viết chương trình nhận 2 số từ bàn phím (Scanner), in ra tổng, hiệu, tích, thương.", case:"Hầu hết hệ thống backend doanh nghiệp (ngân hàng, bảo hiểm) vẫn chạy Java vì tính ổn định và hệ sinh thái enterprise lâu đời — nắm vững cú pháp cơ bản là bước đầu bắt buộc.", task:"Cài JDK, viết chương trình Java đầu tiên in ra \"Hello World\" và 1 phép tính đơn giản, chạy bằng javac rồi java.", days:[
{label:'Thứ 2', title:'Cài đặt môi trường & chương trình đầu tiên', content:'JDK bao gồm compiler (javac) biên dịch file .java thành bytecode .class, và JVM (java) chạy bytecode đó. Mỗi file .java chứa 1 class public phải trùng tên file (ví dụ Main.java chứa class Main). Điểm vào chương trình luôn là method public static void main(String[] args).', example:'public class Main {\n  public static void main(String[] args) {\n    System.out.println("Hello World");\n  }\n}', exercises:["Cài JDK, viết và chạy chương trình Hello World bằng lệnh javac Main.java rồi java Main.","Thử đổi tên class trong file .java khác với tên file, quan sát lỗi compiler báo gì.","Viết thêm 1 dòng in ra kết quả phép tính ngay trong cùng chương trình Hello World."]},
{label:'Thứ 3', title:'Kiểu dữ liệu & biến', content:'Kiểu nguyên thủy (int, double, boolean, char, long...) lưu trực tiếp giá trị. Kiểu tham chiếu (String, class tự định nghĩa, mảng...) lưu địa chỉ tham chiếu đến object trong heap. Java là static typing — kiểu của biến phải khai báo rõ và không đổi được sau đó, khác JS/TS linh hoạt hơn.', example:'int age = 25;\ndouble price = 19.99;\nString name = "AWX";\nboolean isActive = true;', exercises:["Khai báo 5 biến với 5 kiểu dữ liệu khác nhau, in giá trị của chúng ra console.","Thử gán 1 giá trị double vào biến int, quan sát lỗi compiler báo gì và giải thích tại sao.","Tra cứu kích thước bộ nhớ (byte) của từng kiểu dữ liệu (int=4 byte, double=8 byte...)."]},
{label:'Thứ 4', title:'Toán tử & câu lệnh điều kiện', content:'Java hỗ trợ đầy đủ toán tử số học (+,-,*,/,%), so sánh (==, !=, >, <), logic (&&, ||, !) — cú pháp gần giống JavaScript. if/else if/else xử lý rẽ nhánh; switch phù hợp khi so sánh 1 biến với nhiều giá trị cụ thể, tránh chuỗi if-else dài.', example:'int score = 85;\nif (score >= 90) System.out.println("A");\nelse if (score >= 70) System.out.println("B");\nelse System.out.println("C");', exercises:["Viết chương trình nhập điểm (0-100), in ra xếp loại A/B/C/D dùng if-else.","Viết thêm 1 chương trình dùng switch-case thay vì if-else cho cùng bài toán xếp loại điểm.","Thử kết hợp nhiều điều kiện bằng && và || trong 1 câu if, ví dụ kiểm tra điểm nằm trong khoảng cụ thể."]},
{label:'Thứ 5', title:'Vòng lặp & mảng cơ bản', content:'for phù hợp khi biết trước số lần lặp; while/do-while phù hợp khi điều kiện dừng phụ thuộc logic runtime. Mảng trong Java có kích thước cố định khi khai báo (int[] arr = new int[5];), khác với Array linh hoạt của JS.', example:'int[] scores = {80, 90, 75, 60};\nint sum = 0;\nfor (int i = 0; i < scores.length; i++) {\n  sum += scores[i];\n}', exercises:["Viết chương trình tính tổng và trung bình cộng của 1 mảng điểm số cho sẵn.","Viết thêm chương trình tìm giá trị lớn nhất/nhỏ nhất trong mảng bằng vòng lặp.","Thử dùng vòng lặp for-each thay vì for thường để duyệt mảng, so sánh cú pháp."]},
{label:'Thứ 6', title:'Áp dụng thực tế: chương trình tổng hợp', content:'Kết hợp toàn bộ kiến thức tuần này: khai báo biến, nhập dữ liệu, dùng vòng lặp và điều kiện để xử lý logic thực tế — bài tổng hợp giúp kiểm tra bạn đã nắm chắc nền tảng trước khi bước vào OOP tuần sau.', exercises:["Viết chương trình nhập vào 1 mảng điểm số (dùng Scanner), tính điểm trung bình, và phân loại học lực (Giỏi/Khá/Trung bình/Yếu) dựa trên điểm trung bình đó.","Mở rộng chương trình: cho phép nhập số lượng điểm số tùy ý, dùng mảng kích thước động hoặc ArrayList nếu đã biết.","Viết thêm phần xử lý khi người dùng nhập điểm không hợp lệ (âm hoặc quá lớn)."]},
]},
{title:"OOP: Class & Object", points:["Class là khuôn mẫu định nghĩa thuộc tính (field) và hành vi (method) của object.","Object là thực thể cụ thể được tạo ra từ class bằng từ khóa new.","Constructor là method đặc biệt chạy khi tạo object, dùng để khởi tạo giá trị ban đầu.","Access modifier (private, public, protected) kiểm soát phạm vi truy cập field/method.","Getter/Setter là cách phổ biến để truy cập field private một cách có kiểm soát (encapsulation)."], practice:"Viết class BankAccount với field balance, method deposit()/withdraw() có kiểm tra số dư âm.", case:"Encapsulation (field private + getter/setter) là yêu cầu tối thiểu trong mọi code review Java chuyên nghiệp — lộ field public trực tiếp gần như luôn bị từ chối merge.", task:"Viết class Model (giống khái niệm model trong AWX Refiner) với vài field private, constructor, getter/setter, rồi tạo vài object thử.", days:[
{label:'Thứ 2', title:'Class là gì, vì sao cần OOP', content:'Lập trình hướng đối tượng (OOP) mô hình hóa dữ liệu và hành vi liên quan thành các "đối tượng" thay vì viết hàm và biến rời rạc (procedural). Class là bản thiết kế (blueprint) định nghĩa object sẽ có field (dữ liệu) và method (hành vi) gì. Lợi ích chính: dữ liệu và logic liên quan được nhóm lại, dễ tái sử dụng và mở rộng hơn.', exercises:["Nghĩ về 1 khái niệm thực tế (ví dụ Xe hơi, Tài khoản ngân hàng), liệt kê nó nên có field gì và method gì nếu mô hình hóa thành class.","Viết thêm 1 class khác (ví dụ Book: title, author) áp dụng cùng cách tư duy vừa học.","So sánh cách bạn sẽ viết class này bằng procedural để thấy rõ khác biệt với OOP."]},
{label:'Thứ 3', title:'Field & Constructor', content:'Field là biến khai báo trong class, đại diện cho dữ liệu của mỗi object. Constructor là method đặc biệt cùng tên với class, được gọi tự động khi tạo object bằng từ khóa new, dùng để khởi tạo giá trị ban đầu cho field.', example:'public class Account {\n  private double balance;\n  public Account(double initialBalance) {\n    this.balance = initialBalance;\n  }\n}', exercises:["Viết class Account với field balance và constructor nhận initialBalance, tạo thử 2 object Account với số dư khác nhau.","Thêm 1 constructor thứ 2 không tham số (default constructor) khởi tạo balance = 0.","Tạo 3 object Account khác nhau, in ra balance của từng object để xác nhận chúng độc lập với nhau."]},
{label:'Thứ 4', title:'Access modifier & Encapsulation', content:'private giới hạn field/method chỉ truy cập được trong chính class đó — đây là cách thực hành encapsulation chuẩn: field luôn private, truy cập từ bên ngoài thông qua getter/setter có kiểm soát (setter có thể validate dữ liệu trước khi gán).', example:'public double getBalance() { return balance; }\npublic void deposit(double amount) {\n  if (amount > 0) balance += amount;\n}', exercises:["Thêm method deposit()/withdraw() vào class Account, đảm bảo withdraw() không cho phép rút quá số dư hiện có.","Thử bỏ private đi (đổi thành public) để quan sát field bị sửa trực tiếp từ bên ngoài — rồi khôi phục lại private.","Thêm validate cho constructor: không cho phép khởi tạo balance âm ngay từ đầu."]},
{label:'Thứ 5', title:'this keyword & Method Overloading', content:'this dùng để tham chiếu đến chính object hiện tại, thường dùng khi tên tham số trùng tên field. Method Overloading cho phép nhiều method cùng tên nhưng khác tham số (số lượng hoặc kiểu) — Java tự chọn đúng method dựa trên tham số truyền vào lúc gọi.', example:'public void deposit(double amount) { this.balance += amount; }\npublic void deposit(double amount, String note) { /* ... */ }', exercises:["Viết 2 phiên bản overload của method deposit() — 1 bản chỉ nhận amount, 1 bản nhận thêm ghi chú giao dịch.","Viết 1 method overload thứ 3 (ví dụ deposit không tham số, nạp mặc định 1 khoản cố định).","Giải thích bằng lời sự khác nhau giữa Method Overloading và việc chỉ đổi tên hàm khác nhau."]},
{label:'Thứ 6', title:'Áp dụng thực tế & hoàn thiện BankAccount', content:'Ghép toàn bộ kiến thức tuần này thành 1 class hoàn chỉnh, thể hiện đúng encapsulation: field private, constructor khởi tạo hợp lệ, method public có kiểm tra điều kiện trước khi thay đổi state — tiêu chuẩn tối thiểu mọi class Java trong code review chuyên nghiệp.', exercises:["Hoàn thiện class BankAccount đầy đủ: field private balance, constructor, deposit(), withdraw() có validate, getBalance(). Viết đoạn code test thử: nạp tiền, rút tiền hợp lệ, rút tiền vượt số dư.","Viết thêm method transferTo(Account other, double amount) chuyển tiền giữa 2 object Account.","Viết đoạn code test đầy đủ: tạo 2 account, chuyển tiền giữa chúng, in ra số dư cuối cùng."]},
]},
{title:"Kế thừa & Đa hình", points:["extends cho phép 1 class kế thừa field/method từ class cha, tránh lặp code.","Đa hình cho phép gọi cùng 1 method nhưng hành vi khác nhau tùy class con.","@Override đánh dấu method con ghi đè method cha, giúp compiler kiểm tra lỗi.","super() gọi constructor của class cha từ class con.","Đa hình hữu ích khi xử lý danh sách nhiều loại object khác nhau qua cùng 1 kiểu cha."], practice:"Viết class Shape cha, các class con Circle/Square override method calculateArea(), tính tổng diện tích của 1 danh sách Shape hỗn hợp.", case:"Đa hình là nền tảng của các framework enterprise Java (Spring xử lý mọi bean qua interface) — hiểu sai đa hình khiến rất khó đọc hiểu code Spring sau này.", task:"Tạo class cha Animal và 2 class con Dog, Cat override method makeSound(), thử gọi qua 1 mảng kiểu Animal.", days:[
{label:'Thứ 2', title:'extends — kế thừa cơ bản', content:'extends cho phép 1 class con thừa hưởng toàn bộ field/method public và protected từ class cha, tránh viết lại code trùng lặp. Class con có thể thêm field/method riêng, hoặc ghi đè (override) hành vi của class cha khi cần khác biệt.', example:'public class Animal {\n  protected String name;\n  public void eat() { System.out.println(name + " is eating"); }\n}\npublic class Dog extends Animal { }', exercises:["Viết class Animal với field name và method eat(), tạo class Dog extends Animal, thử gọi eat() từ object Dog.","Thêm field tuổi (age) vào Animal, thử truy cập field đó từ object Dog để xác nhận kế thừa hoạt động đúng.","Thử khai báo field private (thay vì protected) ở Animal, quan sát Dog có truy cập được không."]},
{label:'Thứ 3', title:'@Override & super()', content:'@Override đánh dấu rõ ràng method này ghi đè method của class cha — nếu tên/tham số không khớp chính xác, compiler báo lỗi ngay thay vì âm thầm tạo ra 1 method mới không liên quan. super() gọi constructor của class cha, thường ở dòng đầu tiên trong constructor của class con.', example:'public class Dog extends Animal {\n  public Dog(String name) { super(); this.name = name; }\n  @Override\n  public void eat() { System.out.println(name + " is eating dog food"); }\n}', exercises:["Viết class Dog và Cat cùng extends Animal, mỗi class override method makeSound() với âm thanh khác nhau.","Thêm class con thứ 3 (ví dụ Bird) cũng override makeSound().","Thử KHÔNG gọi super() trong constructor của Dog, quan sát điều gì xảy ra."]},
{label:'Thứ 4', title:'Đa hình runtime (Polymorphism)', content:'Đa hình cho phép 1 biến khai báo kiểu cha (Animal) nhưng trỏ tới object của bất kỳ class con nào (Dog, Cat), và khi gọi method, Java tự động chạy đúng phiên bản override của class con thực sự tại runtime — gọi là dynamic dispatch.', example:'Animal[] animals = { new Dog("Rex"), new Cat("Mimi") };\nfor (Animal a : animals) { a.makeSound(); } // gọi đúng version của từng loại', exercises:["Tạo 1 mảng Animal chứa cả Dog và Cat, dùng vòng lặp gọi makeSound() cho từng phần tử, quan sát mỗi object gọi đúng version override của nó.","Thêm 1 method mới trong Animal (ví dụ move()) mà KHÔNG override ở class con nào, xác nhận Dog/Cat vẫn dùng chung version của Animal.","Viết thêm vòng lặp tính tổng tuổi của tất cả animal trong mảng."]},
{label:'Thứ 5', title:'instanceof & downcasting', content:'Khi cần gọi method CHỈ có ở class con (không có ở class cha), phải kiểm tra kiểu bằng instanceof trước rồi ép kiểu (downcast) về class con tương ứng. Lạm dụng instanceof/downcast nhiều thường là dấu hiệu thiết kế class chưa tối ưu.', example:'if (animal instanceof Dog) {\n  Dog dog = (Dog) animal;\n  dog.fetch(); // method chỉ Dog mới có\n}', exercises:["Thêm 1 method riêng chỉ Dog có (ví dụ fetch()), viết code dùng instanceof để gọi đúng method đó khi duyệt qua mảng Animal.","Thử dùng instanceof kiểm tra kiểu Cat trong cùng vòng lặp, gọi 1 method riêng của Cat.","Giải thích bằng lời tại sao lạm dụng instanceof/downcast nhiều lần là dấu hiệu thiết kế chưa tối ưu."]},
{label:'Thứ 6', title:'Áp dụng thực tế & tổng kết tuần', content:'Đa hình là nền tảng giúp code linh hoạt: bạn có thể thêm class con mới (ví dụ Bird) mà không cần sửa code đang xử lý mảng Animal — đây chính là nguyên lý Open/Closed trong lập trình hướng đối tượng.', exercises:["Thêm 1 class con mới (ví dụ Bird extends Animal) vào hệ thống đã viết, xác nhận code vòng lặp cũ vẫn chạy đúng mà không cần sửa gì.","Viết thêm 1 method chung trong Animal nhận danh sách animal và in ra thông tin từng con (dùng đa hình, không cần instanceof).","Tổng kết bằng lời: đa hình giúp code linh hoạt hơn cụ thể ở điểm nào trong ví dụ Animal này."]},
]},
{title:"Interface & Abstract class", points:["Interface định nghĩa \"hợp đồng\" các method phải implement, không chứa logic (trước Java 8).","Abstract class có thể chứa cả method đã implement và method trừu tượng chưa implement.","1 class có thể implement nhiều interface nhưng chỉ extends 1 class (abstract hoặc thường).","Interface phù hợp khi muốn định nghĩa khả năng cho nhiều class không liên quan.","Abstract class phù hợp khi các class con có chung 1 phần logic cơ bản."], practice:"Định nghĩa interface PaymentMethod với method pay(amount), implement ở 2 class CreditCardPayment và CashPayment.", case:"Các hệ thống thanh toán thực tế luôn dùng interface để dễ dàng thêm phương thức thanh toán mới (Momo, ZaloPay...) mà không sửa code cũ — đúng nguyên lý Open/Closed.", task:"Định nghĩa interface Trainable với method train(), implement nó ở 2 class khác nhau.", days:[
{label:'Thứ 2', title:'Interface — hợp đồng method', content:'Interface định nghĩa danh sách method mà bất kỳ class nào implement nó BẮT BUỘC phải cung cấp cách triển khai cụ thể — giống như 1 "hợp đồng". Interface (trước Java 8) không chứa logic, chỉ chứa signature của method.', example:'public interface PaymentMethod {\n  void pay(double amount);\n}\npublic class CreditCardPayment implements PaymentMethod {\n  public void pay(double amount) { System.out.println("Paid " + amount + " by card"); }\n}', exercises:["Định nghĩa interface PaymentMethod, implement nó ở 2 class CreditCardPayment và CashPayment với logic pay() khác nhau.","Thêm class thứ 3 implement PaymentMethod (ví dụ BankTransferPayment).","Thử tạo object trực tiếp từ interface để xác nhận Java không cho phép, giải thích tại sao."]},
{label:'Thứ 3', title:'Abstract class', content:'Abstract class nằm giữa class thường và interface: CÓ THỂ chứa method đã implement sẵn (dùng chung cho mọi class con) VÀ method trừu tượng (abstract, bắt buộc class con implement). Không thể tạo object trực tiếp từ abstract class — chỉ dùng làm class cha để kế thừa.', example:'public abstract class Shape {\n  public void describe() { System.out.println("This is a shape"); }\n  public abstract double calculateArea();\n}', exercises:["Viết abstract class Shape với 1 method thường (describe()) và 1 method abstract (calculateArea()), tạo 2 class con Circle/Square implement calculateArea().","Thêm class con thứ 3 (ví dụ Triangle) cũng implement calculateArea().","Thử gọi describe() từ cả 3 class con, xác nhận chúng dùng chung đúng 1 version từ Shape."]},
{label:'Thứ 4', title:'1 class implement nhiều interface', content:'Khác với extends (chỉ kế thừa được 1 class), 1 class có thể implement NHIỀU interface cùng lúc — hữu ích khi 1 object cần đáp ứng nhiều "khả năng" độc lập với nhau.', example:'public class Product implements Comparable<Product>, Sellable {\n  // phải implement method của cả 2 interface\n}', exercises:["Định nghĩa thêm 1 interface thứ 2 (ví dụ Refundable với method refund()), cho 1 class implement cả PaymentMethod lẫn Refundable.","Viết đoạn code xử lý 1 object vừa là PaymentMethod vừa là Refundable, gọi cả 2 method pay() và refund().","Liệt kê thêm 1 khả năng thứ 3 (interface khác) mà 1 class thanh toán trong thực tế có thể cần."]},
{label:'Thứ 5', title:'Interface vs Abstract class — khi nào dùng cái nào', content:'Dùng Interface khi các class không liên quan cần chia sẻ 1 khả năng chung (nhiều loại thanh toán khác nhau đều pay() được). Dùng Abstract class khi các class con có quan hệ "là một loại của" rõ ràng VÀ có phần logic chung có thể dùng lại.', exercises:["Viết ra 1 bảng so sánh ngắn: 3 điểm khác biệt chính giữa Interface và Abstract class, kèm 1 ví dụ thực tế cho mỗi loại.","Áp dụng bảng so sánh vừa viết vào 1 tình huống cụ thể khác ngoài ví dụ Shape/PaymentMethod đã học.","Nghĩ 1 trường hợp có thể dùng CẢ interface lẫn abstract class cùng lúc, giải thích lý do."]},
{label:'Thứ 6', title:'Áp dụng thực tế & tổng kết tháng 1', content:'Các hệ thống thanh toán thực tế luôn dùng interface để dễ dàng thêm phương thức thanh toán mới (Momo, ZaloPay...) mà không cần sửa code xử lý thanh toán đã có — đây là ứng dụng trực tiếp của nguyên lý Open/Closed đã học ở tuần 3.', exercises:["Hoàn thiện hệ thống PaymentMethod: có ít nhất 3 class implement (CreditCard, Cash, và 1 loại tự chọn), viết đoạn code xử lý thanh toán nhận vào PaymentMethod bất kỳ và gọi pay() — xác nhận hoạt động đúng với cả 3 loại.","Viết thêm 1 class Factory đơn giản: nhận vào tên loại thanh toán, trả về đúng object PaymentMethod tương ứng.","Tổng kết tháng 1 Java Backend bằng 3-4 câu: khái niệm nào bạn thấy khó nhất, sẽ ưu tiên ôn lại."]},
]},
{title:"Exception Handling", points:["try/catch/finally xử lý lỗi runtime mà không làm crash toàn chương trình.","Checked exception (bắt buộc catch hoặc khai báo throws) khác unchecked exception (RuntimeException).","finally luôn chạy dù có exception hay không, thường dùng để đóng tài nguyên (file, connection).","Tự định nghĩa custom exception bằng cách extends Exception hoặc RuntimeException.","Không nên catch Exception chung chung rồi bỏ qua — luôn xử lý hoặc log rõ ràng."], practice:"Viết class InsufficientFundsException custom, ném ra khi rút tiền vượt số dư trong ví dụ BankAccount ở tuần 2.", case:"Hệ thống production luôn cần custom exception có message rõ ràng để log lỗi hữu ích — exception chung chung là ác mộng khi debug production.", task:"Viết hàm chia 2 số, ném custom exception khi chia cho 0, và catch xử lý ở nơi gọi."},
{title:"Collections Framework", points:["List (ArrayList, LinkedList) lưu dữ liệu có thứ tự, cho phép trùng lặp.","Set (HashSet, TreeSet) không cho phép trùng lặp; HashSet không đảm bảo thứ tự.","Map (HashMap, TreeMap) lưu cặp key-value, tra cứu theo key rất nhanh (gần O(1) với HashMap).","Chọn cấu trúc dữ liệu phù hợp quan trọng hơn nhớ hết API — hỏi \"cần thứ tự không, cần unique không, cần tra cứu nhanh không\".","Duyệt Collection bằng for-each hoặc Stream API (Java 8+)."], practice:"Dùng HashMap<String,Integer> để đếm số lần xuất hiện của mỗi từ trong 1 đoạn văn bản dài.", case:"Đếm tần suất, group dữ liệu theo key là thao tác cực kỳ phổ biến trong xử lý dữ liệu backend thực tế (thống kê log, báo cáo...).", task:"Dùng HashMap để đếm tần suất xuất hiện của từng ký tự trong 1 chuỗi."},
{title:"String & StringBuilder", points:["String trong Java là immutable — mỗi lần \"sửa\" thực chất tạo object String mới.","Nối chuỗi bằng + trong vòng lặp lớn kém hiệu quả vì tạo nhiều object thừa.","StringBuilder mutable, phù hợp khi cần nối/sửa chuỗi nhiều lần trong vòng lặp.","Các method thường dùng: substring(), split(), trim(); dùng equals() để so sánh nội dung, không dùng ==.","== so sánh tham chiếu (địa chỉ object), equals() so sánh nội dung — lỗi phổ biến của người mới."], practice:"Viết hàm nối 10.000 chuỗi nhỏ bằng String + trong vòng lặp và bằng StringBuilder, đo thời gian chạy của cả 2 cách.", case:"Dùng String + trong vòng lặp lớn là lỗi performance kinh điển bị bắt lỗi trong code review Java ở môi trường chuyên nghiệp.", task:"Viết hàm dùng StringBuilder để đảo ngược 1 chuỗi, so sánh cách viết với dùng String + trong vòng lặp."},
{title:"Java 8: Lambda & Stream API", points:["Lambda expression là cách viết hàm ẩn danh gọn hơn, cú pháp (params) -> expression.","Stream API xử lý Collection theo phong cách functional: filter, map, reduce, collect.","Stream không thay đổi dữ liệu gốc, trả về stream mới sau mỗi phép biến đổi (giống method chain trong JS).","Functional interface (Runnable, Comparator...) chỉ có 1 method trừu tượng, dùng được với lambda.","Stream giúp code ngắn gọn hơn nhưng debug khó hơn vòng lặp thường — cân nhắc độ phức tạp bài toán."], practice:"Từ 1 List<Employee> có field salary, dùng Stream để lọc nhân viên lương lớn hơn X rồi tính lương trung bình.", case:"Xử lý danh sách bằng Stream thay vì vòng lặp thủ công là phong cách code Java hiện đại được kỳ vọng ở dev từ mid-level trở lên.", task:"Dùng Stream API: từ 1 List<Integer>, lọc số chẵn rồi tính tổng bằng filter + reduce."},
{title:"Generics trong Java", points:["Generics cho phép class/method hoạt động với nhiều kiểu dữ liệu mà vẫn type-safe tại compile time.","List<String> đảm bảo compiler bắt lỗi nếu thêm nhầm kiểu khác vào list.","Ký hiệu quy ước: T (Type), E (Element), K/V (Key/Value) khi định nghĩa generic.","Bounded type (<T extends Number>) giới hạn generic chỉ nhận kiểu con của 1 class/interface.","Generics giúp tránh phải ép kiểu (cast) thủ công và giảm lỗi runtime."], practice:"Viết class Pair<K,V> chứa 2 giá trị bất kỳ kiểu, có method getKey()/getValue().", case:"Các thư viện enterprise Java (Optional<T>, List<T>...) đều dựa trên Generics — không hiểu Generics sẽ rất khó đọc signature của các thư viện phổ biến.", task:"Viết 1 class Box<T> chứa 1 giá trị kiểu T bất kỳ, với method get/set."},
{title:"Multithreading cơ bản", points:["Thread là 1 luồng thực thi độc lập, cho phép chương trình làm nhiều việc \"song song\".","Tạo thread bằng extends Thread hoặc implements Runnable (Runnable linh hoạt hơn).","Race condition xảy ra khi nhiều thread cùng truy cập/sửa 1 dữ liệu chung không kiểm soát.","Từ khóa synchronized đảm bảo chỉ 1 thread truy cập đoạn code tại 1 thời điểm.","Multithreading mạnh nhưng phức tạp — chỉ dùng khi thực sự cần xử lý song song."], practice:"Viết 2 thread cùng tăng 1 biến counter chung 10.000 lần không đồng bộ, quan sát kết quả sai lệch, sau đó sửa bằng synchronized và so sánh.", case:"Race condition là nguyên nhân của nhiều bug 'ngẫu nhiên khó tái hiện' nổi tiếng khó debug nhất trong hệ thống backend thực tế có xử lý song song.", task:"Viết 2 Thread cùng in số đếm từ 1 đến 5, quan sát thứ tự output có bị xen kẽ không dự đoán được."},
{title:"File I/O trong Java", points:["java.io và java.nio là 2 package chính để đọc/ghi file trong Java.","BufferedReader/BufferedWriter đọc/ghi theo dòng, hiệu quả hơn đọc từng byte.","try-with-resources tự động đóng file/stream sau khi dùng xong, tránh leak tài nguyên.","Files.readAllLines() (java.nio) là cách ngắn gọn để đọc nhanh 1 file nhỏ.","Luôn xử lý exception khi làm việc với file vì file có thể không tồn tại hoặc thiếu quyền."], practice:"Viết chương trình đọc 1 file CSV đơn giản (tên,tuổi) và in ra danh sách người trên 18 tuổi.", case:"Xử lý file (import/export CSV, log file) vẫn là tác vụ backend rất phổ biến trong các hệ thống doanh nghiệp, đặc biệt các module báo cáo.", task:"Viết chương trình đọc 1 file text và đếm số dòng, số từ trong file đó."},
{title:"Maven/Gradle — quản lý dependency", points:["Maven/Gradle quản lý thư viện bên ngoài (dependency) và quy trình build của dự án Java.","pom.xml (Maven) hoặc build.gradle khai báo dependency, version, plugin cần dùng.","Dependency scope (compile, test, runtime) quyết định thư viện dùng ở giai đoạn nào.","Build lifecycle: compile → test → package → install/deploy.","Gradle dùng Groovy/Kotlin DSL, thường nhanh hơn Maven nhờ build cache và incremental build."], practice:"Tạo project Maven mới, thêm dependency Gson hoặc Jackson, viết code chuyển 1 object Java thành chuỗi JSON.", case:"Không dự án Java thực tế nào không dùng build tool để quản lý dependency — kỹ năng nền tảng bắt buộc trước khi làm việc với bất kỳ codebase Java nào.", task:"Tạo 1 project Maven/Gradle mới, thêm 1 dependency đơn giản (ví dụ JUnit) và build thử."},
{title:"JDBC — kết nối Database", points:["JDBC là API chuẩn để Java giao tiếp với database quan hệ.","Connection, Statement/PreparedStatement, ResultSet là 3 thành phần chính khi thao tác JDBC.","PreparedStatement tránh SQL Injection bằng cách tham số hóa câu query thay vì nối chuỗi thủ công.","Luôn đóng Connection/Statement/ResultSet sau khi dùng (hoặc dùng try-with-resources).","JDBC là nền tảng để hiểu ORM (JPA/Hibernate) hoạt động bên dưới thế nào."], practice:"Kết nối tới 1 database SQLite/MySQL cục bộ, viết query SELECT lấy danh sách và in ra console.", case:"Dù đã có ORM hiện đại, hiểu JDBC vẫn cần thiết để debug các câu query phức tạp hoặc tối ưu performance mà ORM sinh SQL không hiệu quả.", task:"Viết đoạn code JDBC kết nối tới 1 database (SQLite/MySQL) và query 1 bảng đơn giản."},
{title:"Giới thiệu Spring Boot", points:["Spring Boot giúp xây dựng ứng dụng Java (đặc biệt REST API) nhanh, ít cấu hình thủ công.","@SpringBootApplication là annotation khởi động toàn bộ ứng dụng Spring Boot.","Dependency Injection (DI) là core concept: Spring tự quản lý vòng đời và inject các object (bean) cần thiết.","@Component, @Service, @Repository đánh dấu các loại bean khác nhau theo tầng trong ứng dụng.","Spring Boot dùng embedded server (Tomcat) nên chạy được ngay bằng lệnh, không cần cài server riêng."], practice:"Tạo project Spring Boot với 1 dependency Spring Web, viết 1 endpoint GET /hello trả về chuỗi 'Hello Spring Boot'.", case:"Spring Boot là framework backend Java phổ biến nhất hiện nay ở các công ty — hầu hết vị trí Java Backend đều yêu cầu thành thạo Spring Boot.", task:"Tạo project Spring Boot mới (dùng start.spring.io), chạy thử và xem log khởi động ứng dụng."},
{title:"REST API với Spring Boot", points:["@RestController đánh dấu class xử lý request và trả về dữ liệu (thường là JSON).","@GetMapping, @PostMapping, @PutMapping, @DeleteMapping map tới các HTTP method tương ứng.","@RequestBody lấy dữ liệu từ body request, @PathVariable lấy dữ liệu từ URL path.","Response nên có status code rõ ràng (200, 201, 404, 400...) thay vì luôn trả 200.","Thiết kế REST tốt: đặt tên endpoint theo resource (danh từ), dùng đúng HTTP method cho đúng hành động."], practice:"Xây REST API CRUD đầy đủ (GET/POST/PUT/DELETE) cho 1 resource đơn giản (ví dụ Product) lưu tạm trong List (chưa cần database).", case:"CRUD API là bài test kỹ thuật phổ biến nhất khi phỏng vấn vị trí Java Backend — thành thạo phần này là yêu cầu tối thiểu.", task:"Viết 1 REST API đơn giản quản lý danh sách \"model\" (giống AWX Refiner) với endpoint GET và POST."},
{title:"Spring Data JPA & ORM", points:["ORM ánh xạ giữa class Java và bảng database, giảm code SQL thủ công.","@Entity đánh dấu class tương ứng với 1 bảng, @Id đánh dấu khóa chính.","JpaRepository cung cấp sẵn các method CRUD cơ bản (save, findById, findAll, delete) không cần viết SQL.","Có thể viết custom query bằng tên method (findByName) hoặc @Query khi cần phức tạp hơn.","ORM tiện lợi nhưng cần hiểu SQL bên dưới để debug khi performance có vấn đề (N+1 query...)."], practice:"Kết nối Entity Product ở tuần 15 với database thật qua Spring Data JPA, thay List tạm bằng JpaRepository, test lại toàn bộ CRUD.", case:"Hầu hết hệ thống backend thực tế đều cần lưu dữ liệu lâu dài qua database — JPA là kỹ năng phải có để biến demo thành ứng dụng thật.", task:"Định nghĩa 1 Entity Model với vài field, tạo Repository kế thừa JpaRepository và thử save/find dữ liệu."},
{title:"Authentication & JWT cơ bản", points:["Authentication trả lời \"bạn là ai\"; Authorization trả lời \"bạn được làm gì\".","JWT là chuỗi mã hóa chứa thông tin user, được ký để chống giả mạo.","Luồng phổ biến: login trả về JWT → client gửi JWT trong header Authorization ở các request sau.","JWT không nên chứa dữ liệu nhạy cảm vì phần payload chỉ encode chứ không mã hóa.","Spring Security là thư viện phổ biến để tích hợp authentication/authorization vào Spring Boot."], practice:"Thêm 1 endpoint /login trả về JWT giả lập (có thể dùng thư viện jjwt), thử decode token đó ở jwt.io để xem payload.", case:"Gần như mọi hệ thống backend production đều cần cơ chế authentication — JWT là chuẩn phổ biến nhất cho REST API stateless hiện nay.", task:"Đọc thử cấu trúc 1 JWT thật (header.payload.signature) bằng jwt.io, xác định phần nào chứa thông tin gì."},
{title:"Unit Testing với JUnit", points:["JUnit là framework testing phổ biến nhất cho Java, tương tự Vitest/Jest bên JS.","@Test đánh dấu 1 method là test case; assertEquals/assertTrue kiểm tra kết quả mong đợi.","@BeforeEach/@AfterEach chạy trước/sau mỗi test, dùng để setup/cleanup dữ liệu test.","Mockito giúp giả lập (mock) dependency bên ngoài khi test logic, không phụ thuộc hệ thống thật.","Test tốt nên độc lập với nhau — thứ tự chạy test không được ảnh hưởng tới kết quả."], practice:"Viết test case JUnit cho CRUD API ở tuần 15/16, dùng MockMvc hoặc test trực tiếp method service.", case:"Dự án backend không có test coverage cho business logic quan trọng thường bị đánh giá thấp về chất lượng trong review kỹ thuật khi ứng tuyển hoặc audit code.", task:"Viết 1–2 test case JUnit cho hàm chia có xử lý exception đã viết ở tuần 5."},
{title:"Design Patterns phổ biến trong Java", points:["Singleton đảm bảo 1 class chỉ có đúng 1 instance trong toàn ứng dụng (ví dụ 1 connection pool).","Factory pattern tách logic tạo object ra khỏi nơi sử dụng, dễ mở rộng thêm loại mới.","Builder pattern giúp tạo object phức tạp với nhiều field optional mà không cần constructor rối rắm.","Strategy pattern cho phép đổi thuật toán/xử lý linh hoạt tại runtime thông qua interface chung.","Design pattern là công cụ giải quyết vấn đề lặp lại, không phải mục tiêu để nhồi vào mọi chỗ."], practice:"Refactor 1 chỗ trong code Spring Boot đang new trực tiếp object phụ thuộc, chuyển sang inject qua constructor (@Autowired).", case:"Spring Boot bản chất được xây trên nguyên lý Dependency Injection — hiểu design pattern giúp giải thích được 'tại sao Spring hoạt động như vậy' thay vì chỉ copy code mẫu.", task:"Nhận diện xem trong code Spring Boot đã viết (JpaRepository, @Service...) có dùng pattern nào ở trên không."},
{title:"Triển khai Java với Docker cơ bản", points:["Docker đóng gói ứng dụng cùng môi trường chạy (JDK, dependency) thành 1 image thống nhất.","Dockerfile định nghĩa các bước build image: FROM, COPY, RUN, CMD/ENTRYPOINT.","Build image bằng docker build, chạy container bằng docker run.","Multi-stage build giúp giảm kích thước image cuối (build bằng JDK, chạy bằng JRE nhẹ hơn).","Docker giúp môi trường dev/staging/production giống nhau, tránh lỗi \"chạy trên máy tôi thì được\"."], practice:"Viết 1 Dockerfile đơn giản để đóng gói ứng dụng Spring Boot đã tạo ở tuần 14, build và chạy thử container.", case:"Hầu hết công ty deploy backend Java lên Docker/Kubernetes ngày nay — không biết Docker gần như đồng nghĩa không thể tham gia quy trình deploy thực tế của team.", task:"Viết 1 Dockerfile đơn giản để đóng gói ứng dụng Spring Boot đã tạo ở tuần 14, build và chạy thử container."},
{title:"Spring Security nâng cao", points:["Spring Security cho phép phân quyền chi tiết theo role (ADMIN, USER...) trên từng endpoint.","@PreAuthorize kiểm tra quyền ngay tại method trước khi cho thực thi.","SecurityFilterChain định nghĩa endpoint nào public, endpoint nào cần xác thực.","Phân biệt rõ 401 (chưa xác thực) và 403 (đã xác thực nhưng không đủ quyền) khi trả response lỗi.","Không nên tự viết hệ thống authentication từ đầu khi đã có Spring Security xử lý tốt các trường hợp phổ biến."], practice:"Thêm 2 role (ADMIN, USER) vào hệ thống JWT ở tuần 17, giới hạn 1 endpoint chỉ ADMIN mới gọi được, test bằng 2 token khác role.", case:"Phân quyền theo role là yêu cầu gần như bắt buộc ở mọi hệ thống backend có nhiều loại người dùng (admin, nhân viên, khách hàng...).", task:"Thêm phân quyền đơn giản (ADMIN/USER) vào REST API đã viết ở tuần 15, thử gọi bằng 2 role khác nhau."},
{title:"Caching cơ bản với Redis", points:["Cache lưu tạm kết quả tính toán/tra cứu tốn kém để lần sau trả nhanh hơn mà không cần làm lại.","Redis là in-memory data store phổ biến để làm cache layer trước database.","@Cacheable trong Spring Boot tự động cache kết quả method theo key, không cần tự viết logic thủ công.","Cần đặt thời gian hết hạn (TTL) cho cache để tránh trả dữ liệu cũ mãi mãi.","Cache hữu ích cho dữ liệu đọc nhiều, ghi ít — không phù hợp cho dữ liệu thay đổi liên tục."], practice:"Thử thêm @Cacheable vào 1 method truy vấn dữ liệu trong project Spring Boot, đo thời gian phản hồi trước/sau.", case:"Cache giúp giảm tải database đáng kể ở các API đọc nhiều — kỹ thuật tối ưu performance rất thường gặp khi hệ thống có lượng truy cập lớn.", task:"Thử thêm @Cacheable vào 1 method truy vấn dữ liệu trong project Spring Boot, đo thời gian phản hồi trước/sau."},
{title:"Kiến trúc Microservices tổng quan", points:["Microservices chia hệ thống lớn thành nhiều service nhỏ độc lập, mỗi service 1 trách nhiệm rõ ràng.","Trái ngược với Monolith (toàn bộ logic gói trong 1 ứng dụng duy nhất, dễ phát triển ban đầu hơn).","Các service giao tiếp qua REST API hoặc message queue (Kafka, RabbitMQ) thay vì gọi hàm trực tiếp.","Đánh đổi: phức tạp hơn về vận hành, cần xử lý network failure, đồng bộ dữ liệu giữa các service.","Không nên bắt đầu dự án mới bằng microservices — thường bắt đầu Monolith rồi tách dần khi cần."], practice:"Vẽ sơ đồ đơn giản (trên giấy hoặc draw.io) 1 hệ thống e-commerce chia thành 3 service: Order, Product, User — xác định chúng cần gọi nhau ở đâu.", case:"Nhiều công ty lớn (Amazon, Netflix) nổi tiếng với kiến trúc microservices — hiểu tư duy này giúp đọc hiểu các hệ thống doanh nghiệp lớn dù chưa trực tiếp xây dựng chúng.", task:"Vẽ sơ đồ đơn giản: nếu AWX Refiner tách thành microservices, những service nào sẽ tách riêng (model management, auth, notification...)?"},
{title:"CI/CD cơ bản cho ứng dụng Java", points:["CI (Continuous Integration) tự động build + test mỗi khi có code mới được push lên.","CD (Continuous Deployment/Delivery) tự động triển khai ứng dụng sau khi CI pass.","GitHub Actions là công cụ phổ biến để định nghĩa pipeline CI/CD bằng file YAML.","Pipeline cơ bản: checkout code → build (Maven/Gradle) → chạy test → build Docker image → deploy.","CI/CD giúp phát hiện lỗi sớm và giảm rủi ro khi deploy thủ công."], practice:"Viết 1 file GitHub Actions đơn giản tự động build và chạy test cho project Spring Boot mỗi khi push code, quan sát kết quả ở tab Actions.", case:"CI/CD là quy trình chuẩn ở mọi team backend chuyên nghiệp — code không qua được pipeline test tự động thường không được phép merge vào nhánh chính.", task:"Viết 1 file GitHub Actions đơn giản chạy 'mvn test' mỗi khi push code lên GitHub, quan sát kết quả ở tab Actions."},
];

/* ============ TOEIC TRACK — 16 TUẦN / 4 THÁNG (MỤC TIÊU 800+) ============ */
const toeicWeeks = [
{title:"Làm quen cấu trúc đề & đánh giá đầu vào", points:["TOEIC gồm 2 phần: Listening (100 câu, ~45 phút) và Reading (100 câu, 75 phút), tổng 990 điểm.","Làm 1 đề thi thử đầy đủ để xác định điểm xuất phát và phần yếu nhất.","Mục tiêu 800+ nghĩa là cần cân bằng cả Listening và Reading, không bỏ hẳn phần nào.","Lập thời gian biểu học cố định mỗi ngày, duy trì đều đặn quan trọng hơn học dồn.","Chuẩn bị bộ từ vựng theo chủ đề công sở cơ bản (office, meeting, contract...) để học dần mỗi ngày."], practice:"Làm 1 đề TOEIC thử đầy đủ (hoặc rút gọn), tự chấm điểm, ghi lại số câu đúng/sai theo từng Part vào 1 bảng theo dõi.", case:"Đề thi thật luôn ưu tiên thí sinh làm quen format trước — nhiều bạn mất điểm oan chỉ vì bỡ ngỡ dạng câu hỏi chứ không phải do kém tiếng Anh.", task:"Làm 1 đề TOEIC thử đầy đủ (hoặc rút gọn), tự chấm điểm và ghi lại phần nào yếu nhất.", days:[
{label:'Thứ 2', title:'Tìm hiểu format đề thi TOEIC', content:'TOEIC gồm 7 Part: Part 1-4 thuộc Listening (Part 1: mô tả tranh 6 câu, Part 2: hỏi-đáp 25 câu, Part 3: hội thoại 39 câu, Part 4: bài nói 30 câu), Part 5-7 thuộc Reading (Part 5: điền từ đơn 30 câu, Part 6: điền từ đoạn văn 16 câu, Part 7: đọc hiểu 54 câu). Tổng thời gian khoảng 2 tiếng, không nghỉ giữa giờ.', exercises:["Tìm và lưu lại 1 bảng tóm tắt cấu trúc 7 Part kèm số câu và thời gian, để ở nơi dễ thấy trong quá trình học.","Vẽ sơ đồ hoặc bảng cho thấy 2 phần Listening/Reading chiếm bao nhiêu % tổng thời gian thi.","Tìm hiểu thêm về hình thức thi và quy định phòng thi ở nơi bạn dự định đăng ký thi."]},
{label:'Thứ 3', title:'Làm 1 đề thử đầy đủ', content:'Lần đầu làm đề, mục tiêu KHÔNG phải để đạt điểm cao mà để có số liệu thật về trình độ hiện tại — làm nghiêm túc, tính giờ đầy đủ như thi thật để kết quả phản ánh đúng thực lực.', exercises:["Làm 1 đề TOEIC đầy đủ (hoặc bản rút gọn), ghi lại thời gian bắt đầu và kết thúc từng phần.","Ghi chú lại cảm giác/khó khăn gặp phải ở từng Part ngay khi vừa làm xong, để so sánh với kết quả thực tế.","Đánh dấu lại những câu bạn phải đoán (không chắc chắn) để phân biệt với câu làm chắc chắn khi phân tích sau."]},
{label:'Thứ 4', title:'Tự chấm điểm & quy đổi thang điểm', content:'TOEIC quy đổi số câu đúng sang thang điểm 5-495 cho mỗi kỹ năng (Listening và Reading), tổng tối đa 990. Bảng quy đổi chính thức không tuyến tính tuyệt đối, nhưng có thể tra bảng quy đổi tham khảo có sẵn trong sách luyện thi hoặc tìm online để ước lượng điểm.', exercises:["Đếm số câu đúng ở Listening và Reading riêng biệt, tra bảng quy đổi điểm ước lượng, ghi lại kết quả làm mốc so sánh.","So sánh điểm ước lượng của bạn với mục tiêu 800+ để biết khoảng cách cần thu hẹp trong 4 tháng.","Tìm hiểu xem điểm 800+ tương đương trình độ nào theo khung CEFR để hình dung rõ mục tiêu."]},
{label:'Thứ 5', title:'Phân tích lỗi sai theo từng Part', content:'Lập 1 bảng đơn giản: mỗi hàng là 1 Part, ghi số câu đúng/sai. Việc này giúp nhìn ra ngay Part nào đang yếu nhất để ưu tiên thời gian học trong các tuần tới, thay vì học dàn trải đều cho mọi phần.', exercises:["Lập bảng thống kê số câu đúng/sai theo từng Part (1 đến 7) từ đề đã làm ở Thứ 3, xác định 2 Part yếu nhất.","Tô màu hoặc đánh dấu nổi bật 2 Part yếu nhất trong bảng thống kê để dễ theo dõi các tuần sau.","Viết ra 1 giả thuyết ban đầu về lý do bạn sai nhiều ở 2 Part đó (từ vựng, ngữ pháp, tốc độ...)."]},
{label:'Thứ 6', title:'Lập thời gian biểu học tập 4 tháng', content:'Với 1-2 tiếng/ngày, phân chia hợp lý: phần lớn thời gian dành cho 2 Part yếu nhất đã xác định ở Thứ 5, nhưng vẫn duy trì ôn tập các Part khác để không bị tụt lại. Lịch học cụ thể, viết ra giấy hoặc ứng dụng nhắc việc, giúp duy trì đều đặn tốt hơn nhiều so với chỉ "định học".', exercises:["Viết ra lịch học cụ thể cho 4 tháng tới: mỗi ngày trong tuần dành bao nhiêu phút cho Listening, bao nhiêu cho Reading, cố định khung giờ học nếu có thể.","In ra hoặc lưu lịch học này ở nơi dễ thấy mỗi ngày để nhắc nhở duy trì.","Đặt 1 mốc kiểm tra giữa tháng để tự đánh giá xem có bám sát lịch học đã đặt ra không."]},
]},
{title:"Ngữ pháp nền tảng: thì động từ & cấu trúc câu", points:["TOEIC Part 5-6 kiểm tra ngữ pháp qua câu đơn lẻ và đoạn văn ngắn.","Ôn lại các thì cơ bản: hiện tại đơn, quá khứ đơn, hiện tại hoàn thành — nhóm câu hỏi xuất hiện thường xuyên.","Nắm vững cấu trúc câu cơ bản: chủ ngữ - động từ - tân ngữ, vị trí tính từ/trạng từ trong câu.","Phân biệt danh động từ (V-ing) và động từ nguyên mẫu có \"to\" sau các động từ phổ biến.","Học ngữ pháp qua ví dụ câu thực tế thay vì học thuộc lý thuyết suông."], practice:"Làm 25 câu Part 5 tập trung chủ điểm thì động từ, ghi lại các câu sai và lý do sai vào sổ tay lỗi.", case:"Part 5 chiếm 30/100 câu Reading — chỉ riêng nắm chắc ngữ pháp cơ bản đã đảm bảo được một lượng điểm ổn định.", task:"Làm 25 câu Part 5 tập trung chủ điểm thì động từ, ghi lại các câu sai và lý do sai.", days:[
{label:'Thứ 2', title:'Ôn thì hiện tại đơn & hiện tại tiếp diễn', content:'Thì hiện tại đơn diễn tả thói quen, sự thật hiển nhiên, lịch trình cố định (dấu hiệu: always, usually, every day). Thì hiện tại tiếp diễn diễn tả hành động đang xảy ra tại thời điểm nói (dấu hiệu: now, at the moment). Trong Part 5, nhận diện đúng dấu hiệu thời gian giúp chọn đúng dạng động từ.', exercises:["Viết 5 câu ví dụ dùng thì hiện tại đơn và 5 câu dùng hiện tại tiếp diễn liên quan chủ đề công sở (họp hành, báo cáo...).","Tìm và gạch chân thì động từ trong 5 câu tiếng Anh bất kỳ bạn gặp hàng ngày để luyện nhận diện thực tế.","Tự đặt 3 câu hỏi kiểu Part 5 (có chỗ trống) rồi tự trả lời để luyện tư duy ra đề."], quiz:[
{q:"The manager ___ the reports every Monday morning.", opts:["review","reviews","is reviewing","reviewed"], correct:1, explain:"\"every Monday morning\" là dấu hiệu thói quen lặp lại → hiện tại đơn; chủ ngữ số ít \"the manager\" nên động từ thêm -s."},
{q:"Please be quiet. The director ___ a presentation right now.", opts:["gives","give","is giving","has given"], correct:2, explain:"\"right now\" là dấu hiệu điển hình của hiện tại tiếp diễn — hành động đang xảy ra tại thời điểm nói."},
{q:"Our company ___ its products to over 30 countries.", opts:["export","exports","is exporting","exported"], correct:1, explain:"Sự thật/thói quen kinh doanh lâu dài → hiện tại đơn, chủ ngữ số ít nên thêm -s."},
{q:"Look! The new employees ___ into the meeting room.", opts:["walk","walks","are walking","walked"], correct:2, explain:"\"Look!\" là dấu hiệu điển hình của hiện tại tiếp diễn — mời người nghe chú ý vào hành động đang diễn ra."},
{q:"The train usually ___ on time.", opts:["arrive","arrives","is arriving","arrived"], correct:1, explain:"\"usually\" là trạng từ tần suất của hiện tại đơn; chủ ngữ số ít \"the train\" nên động từ thêm -s."},
]},
{label:'Thứ 3', title:'Ôn thì quá khứ đơn & hiện tại hoàn thành', content:'Quá khứ đơn diễn tả hành động đã kết thúc tại 1 thời điểm xác định trong quá khứ. Hiện tại hoàn thành diễn tả hành động xảy ra trong quá khứ nhưng còn liên quan/ảnh hưởng đến hiện tại, hoặc chưa xác định rõ thời điểm (already, just, since, for) — 2 thì hay bị nhầm lẫn nhất của người học tiếng Việt.', exercises:["Viết 5 cặp câu minh họa sự khác biệt giữa quá khứ đơn và hiện tại hoàn thành cho cùng 1 tình huống.","Viết 1 đoạn văn ngắn kể lại 1 việc bạn đã làm xong hôm nay, cố tình dùng cả 2 thì đã học.","Tìm 3 câu có since/for trong tài liệu tiếng Anh bất kỳ, xác định since đi với mốc thời gian còn for đi với khoảng thời gian."], quiz:[
{q:"She ___ the report yesterday afternoon.", opts:["has finished","finished","finishes","is finishing"], correct:1, explain:"\"yesterday afternoon\" là mốc thời gian xác định trong quá khứ → dùng quá khứ đơn."},
{q:"I have ___ visited Japan three times.", opts:["already","yesterday","ago","last year"], correct:0, explain:"\"already\" đi kèm hiện tại hoàn thành; \"yesterday/ago/last year\" chỉ đi với quá khứ đơn."},
{q:"They ___ for this company since 2015.", opts:["worked","work","have worked","are working"], correct:2, explain:"\"since 2015\" (từ 1 mốc thời gian đến nay) là dấu hiệu của hiện tại hoàn thành."},
{q:"He ___ his car last week.", opts:["has sold","sold","sells","is selling"], correct:1, explain:"\"last week\" là mốc thời gian xác định đã qua → quá khứ đơn."},
{q:"She just ___ the project.", opts:["finish","finished","has finished","is finishing"], correct:2, explain:"\"just\" là dấu hiệu điển hình của hiện tại hoàn thành, diễn tả việc vừa mới hoàn thành."},
]},
{label:'Thứ 4', title:'Luyện Part 5 chủ điểm thì động từ', content:'Áp dụng kiến thức 2 ngày trước vào luyện đề thật — tìm dấu hiệu thời gian trong câu (từ khóa như yesterday, since, now) trước khi chọn đáp án, đừng chỉ dựa vào cảm giác quen mắt.', exercises:["Làm 15 câu Part 5 tập trung chủ điểm thì động từ, đối chiếu đáp án và ghi lại câu sai kèm lý do.","Với mỗi câu sai, thử tự đặt lại câu hỏi tương tự (đổi chủ ngữ/tình huống) để luyện thêm dạng đó.","Phân loại 15 câu vừa làm theo mức độ tự tin: chắc chắn đúng / không chắc / đoán mò."], quiz:[
{q:"Every employee ___ a badge to enter the building.", opts:["need","needs","needed","is needing"], correct:1, explain:"Sự thật/quy định hiện tại, chủ ngữ số ít \"every employee\" → hiện tại đơn, thêm -s."},
{q:"The CEO ___ to Tokyo next Monday for a conference.", opts:["travels","traveled","is traveling","travel"], correct:2, explain:"Kế hoạch tương lai đã sắp xếp trước (\"next Monday\") thường dùng hiện tại tiếp diễn trong tiếng Anh giao tiếp/công sở."},
{q:"She ___ in this department for five years.", opts:["works","worked","has worked","is working"], correct:2, explain:"\"for five years\" (khoảng thời gian kéo dài đến hiện tại) → hiện tại hoàn thành."},
{q:"Currently, the technicians ___ the new equipment.", opts:["install","installs","are installing","installed"], correct:2, explain:"\"Currently\" là dấu hiệu của hiện tại tiếp diễn."},
{q:"The company ___ its policy last year.", opts:["changes","changed","has changed","is changing"], correct:1, explain:"\"last year\" là mốc thời gian xác định trong quá khứ → quá khứ đơn."},
{q:"Our team ___ the deadline every single time.", opts:["meet","meets","is meeting","met"], correct:1, explain:"\"every single time\" chỉ thói quen lặp lại → hiện tại đơn."},
{q:"I ___ this issue several times, but it keeps happening.", opts:["reported","report","have reported","am reporting"], correct:2, explain:"\"several times\" (không rõ mốc thời gian cụ thể, còn ảnh hưởng đến hiện tại) → hiện tại hoàn thành."},
{q:"Right now, Mr. Kim ___ with a client.", opts:["speaks","spoke","is speaking","has spoken"], correct:2, explain:"\"Right now\" là dấu hiệu của hiện tại tiếp diễn."},
{q:"The factory ___ 500 units per day on average.", opts:["produce","produces","is producing","produced"], correct:1, explain:"\"on average\" chỉ số liệu thường xuyên/thói quen sản xuất → hiện tại đơn."},
{q:"They ___ the contract yet.", opts:["haven't signed","didn't sign","don't sign","aren't signing"], correct:0, explain:"\"yet\" trong câu phủ định là dấu hiệu của hiện tại hoàn thành."},
]},
{label:'Thứ 5', title:'Cấu trúc câu cơ bản & vị trí từ loại', content:'Cấu trúc câu tiếng Anh cơ bản: Chủ ngữ - Động từ - Tân ngữ (S-V-O). Tính từ thường đứng trước danh từ hoặc sau động từ to be; trạng từ thường đứng sau động từ chính hoặc đầu/cuối câu. Nắm vững vị trí này giúp làm nhanh các câu Part 5 hỏi về từ loại.', exercises:["Viết 5 câu, mỗi câu xác định rõ đâu là S-V-O và vị trí của tính từ/trạng từ (nếu có).","Viết thêm 3 câu có trạng từ ở các vị trí khác nhau trong câu.","Tìm 1 đoạn văn tiếng Anh ngắn, gạch chân toàn bộ tính từ và trạng từ xuất hiện trong đó."], quiz:[
{q:"The manager gave a ___ presentation.", opts:["clear","clearly","clarity","clarify"], correct:0, explain:"Cần tính từ đứng trước danh từ \"presentation\" → clear."},
{q:"She explained the process ___.", opts:["clear","clearly","clarity","clarify"], correct:1, explain:"Cần trạng từ bổ nghĩa cho động từ \"explained\", đứng cuối câu → clearly."},
{q:"This is a very ___ solution.", opts:["practical","practically","practice","practicality"], correct:0, explain:"Sau \"very\" và trước danh từ \"solution\" cần tính từ → practical."},
{q:"He ___ completed the assignment.", opts:["success","successful","successfully","succeed"], correct:2, explain:"Cần trạng từ đứng trước động từ \"completed\" → successfully."},
{q:"The company values ___ in all its employees.", opts:["honest","honestly","honesty","honestic"], correct:2, explain:"Sau động từ \"values\" cần danh từ làm tân ngữ → honesty."},
]},
{label:'Thứ 6', title:'Luyện thêm Part 5 & tổng kết tuần', content:'Ôn lại tất cả câu sai đã note trong tuần, phân loại xem lỗi chủ yếu do chưa nắm vững thì động từ hay do nhầm vị trí từ loại — điều này quyết định trọng tâm ôn tập của tuần sau.', exercises:["Làm thêm 15 câu Part 5 tổng hợp, tổng kết lại toàn bộ lỗi sai của tuần vào sổ tay theo 2 nhóm: lỗi thì động từ và lỗi cấu trúc câu.","Làm lại đúng 5 câu đã sai trong tuần (không xem đáp án cũ) để kiểm tra đã sửa được lỗi chưa.","Viết 1 câu tóm tắt: chủ điểm ngữ pháp nào tuần này bạn thấy khó nhất, cần ôn thêm."], quiz:[
{q:"Employees ___ attend the training session next week.", opts:["must","musts","musting","musted"], correct:0, explain:"Động từ khuyết thiếu (modal verb) \"must\" luôn theo sau bởi động từ nguyên mẫu, không chia."},
{q:"The new policy takes effect ___ January 1st.", opts:["on","in","at","by"], correct:0, explain:"Giới từ \"on\" dùng với ngày cụ thể (on + ngày tháng)."},
{q:"She is responsible ___ managing the budget.", opts:["of","for","with","at"], correct:1, explain:"Cụm cố định \"responsible for\" (chịu trách nhiệm về)."},
{q:"The team worked ___ to meet the deadline.", opts:["hard","hardly","harder","hardness"], correct:0, explain:"\"hard\" vừa là tính từ vừa là trạng từ chỉ cách thức (làm việc chăm chỉ); \"hardly\" nghĩa là hầu như không, khác nghĩa hoàn toàn."},
{q:"He arrived ___ the meeting on time.", opts:["at","in","on","to"], correct:0, explain:"Cụm cố định \"arrive at\" + địa điểm/sự kiện cụ thể."},
{q:"The manager will ___ the results tomorrow.", opts:["announce","announces","announced","announcing"], correct:0, explain:"Sau \"will\" (modal verb) luôn là động từ nguyên mẫu."},
{q:"This department is in charge ___ customer service.", opts:["of","for","with","on"], correct:0, explain:"Cụm cố định \"in charge of\" (phụ trách)."},
{q:"The invoice must be paid ___ 30 days.", opts:["within","while","during","between"], correct:0, explain:"\"within\" dùng để chỉ giới hạn thời gian (trong vòng bao lâu)."},
{q:"We look forward ___ hearing from you.", opts:["to","for","at","on"], correct:0, explain:"Cụm cố định \"look forward to\" + V-ing (mong chờ)."},
{q:"The results were ___ than expected.", opts:["good","better","best","well"], correct:1, explain:"Sau \"than\" cần dạng so sánh hơn → better."},
]},
]},
{title:"Từ vựng công sở & Listening Part 1-2", points:["Part 1 (mô tả tranh) cần từ vựng miêu tả hành động, vị trí đồ vật (in front of, next to...).","Part 2 (hỏi-đáp ngắn) cần phản xạ nhanh với các dạng câu hỏi Wh-, Yes/No, câu hỏi lựa chọn.","Nghe kỹ từ để hỏi đầu câu (What, Where, When, Who) vì nó quyết định loại câu trả lời cần tìm.","Cảnh giác với \"bẫy\" từ đồng âm thường xuất hiện ở đáp án gây nhiễu.","Luyện nghe chép chính tả (dictation) giúp cải thiện khả năng bắt âm rõ rệt."], practice:"Nghe và làm thử 10 câu Part 1 + 10 câu Part 2, sau đó nghe lại transcript để đối chiếu từ nghe sai, ghi lại từ mới vào sổ từ vựng.", case:"Part 1-2 tuy dễ nhưng chiếm 30/100 câu Listening — làm chắc phần này là nền tảng để đạt điểm Listening cao.", task:"Nghe và làm thử 10 câu Part 1 + 10 câu Part 2, sau đó nghe lại transcript để đối chiếu từ nghe sai.", days:[
{label:'Thứ 2', title:'Từ vựng miêu tả hành động & vị trí (Part 1)', content:'Part 1 yêu cầu chọn câu mô tả đúng nhất bức tranh — từ vựng cần tập trung vào động từ miêu tả hành động (standing, holding, pointing...) và giới từ chỉ vị trí (in front of, next to, between, across from).', exercises:["Tự mô tả 3 bức tranh/tình huống bất kỳ bằng tiếng Anh, cố dùng ít nhất 5 từ trong danh sách bên dưới.","Ghép các từ vừa học thành 5 câu hoàn chỉnh mô tả hành động con người trong văn phòng.","Che phần nghĩa tiếng Việt, tự đoán nghĩa từng từ trước rồi mới đối chiếu lại."], vocab:[
{term:"stand", meaning:"đứng", example:"A man is standing near the window."},
{term:"hold", meaning:"cầm, giữ", example:"She is holding a cup of coffee."},
{term:"point", meaning:"chỉ (tay/vật)", example:"He is pointing at the screen."},
{term:"carry", meaning:"mang, vác", example:"The worker is carrying a box."},
{term:"lean", meaning:"tựa, nghiêng", example:"A bicycle is leaning against the wall."},
{term:"reach", meaning:"với tới", example:"She is reaching for a file on the shelf."},
{term:"wear", meaning:"mặc, đeo", example:"The man is wearing a helmet."},
{term:"push", meaning:"đẩy", example:"He is pushing a cart."},
{term:"pull", meaning:"kéo", example:"They are pulling a rope."},
{term:"examine", meaning:"kiểm tra, xem xét", example:"The technician is examining the machine."},
{term:"in front of", meaning:"phía trước", example:"The car is parked in front of the building."},
{term:"next to", meaning:"bên cạnh", example:"The chair is next to the desk."},
{term:"between", meaning:"ở giữa", example:"The printer is between the two desks."},
{term:"across from", meaning:"đối diện", example:"The bank is across from the park."},
{term:"on top of", meaning:"trên đỉnh, trên cùng", example:"Books are stacked on top of each other."},
{term:"underneath", meaning:"bên dưới", example:"The cat is sleeping underneath the table."},
{term:"behind", meaning:"phía sau", example:"The garden is behind the house."},
{term:"along", meaning:"dọc theo", example:"People are walking along the river."},
{term:"arrange", meaning:"sắp xếp", example:"The items are arranged on the shelf."},
{term:"gather", meaning:"tụ tập", example:"A crowd has gathered near the entrance."},
]},
{label:'Thứ 3', title:'Luyện Part 1 có tính giờ', content:'Part 1 chỉ có 6 câu nhưng cần phản xạ rất nhanh — mỗi câu chỉ có khoảng vài giây suy nghĩ trước khi nghe đáp án. Luyện nghe kèm tính giờ giúp làm quen với tốc độ này thay vì chỉ luyện không giới hạn thời gian.', exercises:["Luyện 10 câu Part 1 có tính giờ nghiêm ngặt, nghe lại transcript đối chiếu những câu nghe chưa rõ.","Nghe lại 3 câu bạn làm sai, chỉ ra chính xác từ/cụm từ nào khiến bạn chọn nhầm đáp án.","Nghe 1 câu Part 1 lại 2 lần, ghi lại xem lần 2 có nghe rõ hơn lần 1 không."]},
{label:'Thứ 4', title:'Các dạng câu hỏi Part 2', content:'Part 2 có 3 dạng chính: câu hỏi Wh- (What, Where, When, Who, Why, How), câu hỏi Yes/No, và câu hỏi lựa chọn (A or B). Mẹo quan trọng: chỉ cần nghe rõ 2-3 từ ĐẦU câu hỏi là đã có thể loại được nhiều đáp án sai — không cần nghe hiểu 100% cả câu.', exercises:["Với mỗi dạng câu hỏi bên dưới, tự viết thêm 1 ví dụ câu hỏi + câu trả lời khác của riêng bạn.","Che phần trả lời mẫu, tự nghĩ ra 1 câu trả lời hợp lý cho từng câu hỏi trước khi xem đáp án.","Tự viết 3 câu hỏi Part 2 kiểu Yes/No và tự viết 2 cách trả lời khác nhau (Yes và No) cho mỗi câu."], vocab:[
{term:"What...?", meaning:"hỏi sự việc/vật → trả lời bằng thông tin cụ thể", example:"What time does the store open? → At 9 a.m."},
{term:"Where...?", meaning:"hỏi địa điểm → trả lời bằng nơi chốn", example:"Where is the conference room? → On the third floor."},
{term:"Who...?", meaning:"hỏi người → trả lời bằng tên/chức danh", example:"Who signed this contract? → Mr. Tanaka did."},
{term:"Why...?", meaning:"hỏi lý do → trả lời bằng \"Because...\" hoặc lý do trực tiếp", example:"Why was the meeting canceled? → Because the manager is sick."},
{term:"How...?", meaning:"hỏi cách thức/mức độ → trả lời bằng phương thức hoặc số lượng", example:"How do I get to the airport? → Take the shuttle bus."},
{term:"Yes/No question", meaning:"trả lời bắt đầu bằng Yes/No hoặc ý tương đương", example:"Did you send the email? → Not yet."},
{term:"Or question (lựa chọn)", meaning:"trả lời chọn 1 trong 2, hoặc \"either/neither\"", example:"Should I call or email you? → Either is fine."},
{term:"Tag question", meaning:"trả lời xác nhận đồng ý/không đồng ý", example:"The report is ready, isn't it? → Yes, it is."},
{term:"Suggestion", meaning:"trả lời chấp nhận hoặc từ chối đề nghị", example:"Why don't we take a break? → Sure, good idea."},
{term:"Statement (không phải câu hỏi)", meaning:"trả lời phản hồi phù hợp với câu nói", example:"I think the deadline is too tight. → I agree, let's ask for more time."},
]},
{label:'Thứ 5', title:'Luyện Part 2 có tính giờ', content:'Khoảng cách giữa các câu hỏi trong Part 2 khá ngắn — nếu bị phân tâm suy nghĩ về câu trước, rất dễ bỏ lỡ câu sau. Luyện tập theo nhịp độ thật giúp xây dựng phản xạ "buông câu cũ, tập trung câu mới" ngay lập tức.', exercises:["Luyện 15 câu Part 2 có tính giờ liên tục không dừng, chấm điểm và ghi chú dạng câu hỏi nào hay sai nhất.","Ghi lại tổng thời gian làm 15 câu Part 2, tính trung bình mỗi câu mất bao nhiêu giây.","Đánh dấu những câu bạn bị \"bẫy\" bởi từ đồng âm, ghi chú riêng loại lỗi này để cảnh giác về sau."]},
{label:'Thứ 6', title:'Nghe lại transcript & tổng kết tuần', content:'Nghe lại toàn bộ audio đã luyện trong tuần kèm xem transcript giúp phát hiện những từ/cụm từ bạn nghe sai do chưa quen phát âm, dù có thể bạn đã biết nghĩa của từ đó khi đọc.', exercises:["Nghe lại toàn bộ Part 1-2 đã luyện trong tuần, đối chiếu transcript, ghi ra sổ từ vựng những từ nghe chưa quen dù đã biết nghĩa.","Tổng hợp toàn bộ từ mới của tuần vào 1 danh sách, sắp xếp theo chủ đề.","Tự đọc to lại toàn bộ transcript đã nghe trong tuần để luyện phát âm và làm quen nhịp điệu câu."]},
]},
{title:"Reading Part 5 nâng cao & tổng kết tháng 1", points:["Part 5 thường kiểm tra từ loại (danh từ/động từ/tính từ/trạng từ) qua vị trí trống trong câu.","Xác định vị trí từ cần điền trước, sau đó mới xét nghĩa — nhiều câu chỉ cần biết từ loại là chọn được đáp án.","Học nhóm từ đi kèm cố định (collocations) như \"make a decision\", \"take responsibility\".","Không cần dịch toàn bộ câu để làm Part 5 — kỹ năng nhận diện cấu trúc quan trọng hơn hiểu 100% nghĩa.","Cuối tháng 1: làm lại 1 đề thử để so sánh tiến bộ so với tuần 1."], practice:"Làm 1 đề mini (Listening Part 1-2 + Reading Part 5, khoảng 30 câu) có tính giờ, so sánh điểm với tuần 1.", case:"Thí sinh đạt 800+ thường không giỏi vượt trội mọi thứ, mà làm rất chắc các câu Part 5 và Part 1-2 — đây là 'điểm sàn an toàn' của hầu hết thí sinh điểm cao.", task:"Làm 1 đề mini (Listening Part 1-2 + Reading Part 5, khoảng 30 câu) có tính giờ, so sánh điểm với tuần 1.", days:[
{label:'Thứ 2', title:'Nhận diện từ loại qua vị trí trong câu', content:'Phần lớn câu hỏi Part 5 có thể giải bằng cách xác định từ loại cần điền dựa vào VỊ TRÍ trong câu, không cần hiểu 100% nghĩa cả câu. Ví dụ: sau tính từ sở hữu (their, his) hoặc mạo từ (a, the) thường là danh từ; đứng trước danh từ thường là tính từ.', example:'Their ___ (decision) was final.  → cần danh từ (decision)\nShe made a ___ (quick) decision. → cần tính từ (quick)', exercises:["Làm 10 câu Part 5 chỉ tập trung xác định từ loại cần điền (không cần dịch nghĩa cả câu), đối chiếu đáp án.","Với mỗi câu đã làm, viết ra lý do từ loại bạn chọn đáp án đó.","Tự tạo 3 câu Part 5 mới dựa trên cấu trúc câu bạn vừa phân tích, tự đố lại bản thân."]},
{label:'Thứ 3', title:'Học collocation thường gặp', content:'Collocation là các cụm từ đi kèm cố định theo thói quen ngôn ngữ (ví dụ "make a decision" chứ không phải "do a decision"). Nhiều câu Part 5-6 kiểm tra chính xác kiến thức collocation này thay vì ngữ pháp thuần túy.', exercises:["Học 15 collocation thường gặp trong đề thi TOEIC (chủ đề công sở), viết mỗi collocation kèm 1 câu ví dụ.","Viết 5 câu ví dụ tự nghĩ ra có sử dụng đúng các collocation vừa học.","Ghép các collocation đã học thành 1 đoạn email công sở ngắn hoàn chỉnh."]},
{label:'Thứ 4', title:'Luyện Part 5 tổng hợp có tính giờ', content:'Kết hợp toàn bộ kiến thức đã học trong tháng: nhận diện thì động từ, từ loại theo vị trí, và collocation — luyện với tốc độ tính giờ để quen áp lực thời gian thật.', exercises:["Làm 20 câu Part 5 tổng hợp có tính giờ (mục tiêu dưới 10 phút), chấm điểm và phân loại lỗi sai theo nhóm kiến thức.","Phân loại các câu sai xem thuộc nhóm lỗi thì động từ, từ loại, hay collocation để biết đang yếu phần nào nhất.","Thử làm lại 20 câu đó lần 2 ngay sau khi chữa lỗi, xem có cải thiện điểm số không."]},
{label:'Thứ 5', title:'Làm đề mini tổng hợp', content:'Đề mini kết hợp Part 1-2 (Listening) và Part 5 (Reading) là bài kiểm tra tổng thể đầu tiên sau 4 tuần học có hệ thống — giúp đánh giá khách quan mức độ tiến bộ so với đề thử ban đầu ở tuần 1.', exercises:["Làm 1 đề mini khoảng 30 câu (Part 1-2 + Part 5) có tính giờ nghiêm ngặt như thi thật.","Ghi lại chính xác thời gian làm từng Part trong đề mini, so với mốc thời gian gợi ý.","Highlight lại 3 câu bạn tự tin nhất và 3 câu bạn không chắc nhất để phân tích riêng sau."]},
{label:'Thứ 6', title:'Tổng kết tháng 1 & lên kế hoạch tháng 2', content:'So sánh điểm đề mini hôm nay với đề thử ở tuần 1 — nếu có tiến bộ dù nhỏ, đó là tín hiệu tốt cho thấy phương pháp học đang đúng hướng. Tháng 2 sẽ mở rộng sang Part 3-4 (Listening) và Part 6 (Reading), đòi hỏi nền tảng ngữ pháp và từ vựng đã xây trong tháng 1.', exercises:["So sánh chi tiết điểm số và số câu đúng theo từng Part giữa đề mini hôm nay và đề thử tuần 1, viết ra 2-3 điểm đã cải thiện rõ rệt nhất.","Viết 1 đoạn nhật ký học tập ngắn tổng kết cảm nhận sau tháng 1.","Đặt mục tiêu cụ thể (bằng số liệu) cho tháng 2, ví dụ: \"giảm số câu sai Part 3 xuống dưới X câu\"."]},
]},
{title:"Listening Part 3 — hội thoại ngắn", points:["Part 3 là hội thoại 2-3 người, mỗi bài có 3 câu hỏi liên quan.","Đọc trước câu hỏi và đáp án trước khi nghe giúp biết cần chú ý thông tin gì.","Câu hỏi cuối cùng mỗi bài thường liên quan ý định/hành động tiếp theo — cần nghe đến cuối đoạn.","Ghi chú nhanh (note-taking) các con số, tên, thời gian nhắc đến trong lúc nghe.","Một số câu hỏi kèm hình ảnh/biểu đồ yêu cầu kết hợp thông tin nghe được với hình."], practice:"Làm 3 bài hội thoại Part 3 (9 câu), sau đó nghe lại và note ra những từ khóa quan trọng đã bỏ lỡ.", case:"Part 3 là phần nhiều thí sinh mất điểm nhất vì tốc độ hội thoại nhanh và có 3 câu hỏi dồn dập cho 1 bài nghe.", task:"Làm 3 bài hội thoại Part 3 (9 câu), sau đó nghe lại và note ra những từ khóa quan trọng đã bỏ lỡ."},
{title:"Listening Part 4 — bài nói ngắn", points:["Part 4 là các bài nói dài hơn Part 3 (thông báo, quảng cáo, voice mail...), mỗi bài 3 câu hỏi.","Nhận diện loại bài nói giúp đoán trước nội dung sẽ nghe.","Chiến lược đọc trước câu hỏi vẫn áp dụng như Part 3, càng quan trọng hơn vì bài dài hơn.","Từ vựng thường gặp: thông báo nội bộ, lịch trình, sự kiện công ty — nên học theo chủ đề này.","Luyện nghe tốc độ thật (không làm chậm lại) để quen với tốc độ đề thi thật."], practice:"Làm 3 bài Part 4 (9 câu), chấm điểm và liệt kê loại bài nói nào mình yếu nhất.", case:"Part 4 thường có giọng đọc chuẩn hơn Part 3 (ít hội thoại tự nhiên) nên với thí sinh luyện đúng phương pháp, đây lại là phần dễ ăn điểm hơn Part 3.", task:"Làm 3 bài Part 4 (9 câu), chấm điểm và liệt kê loại bài nói nào mình yếu nhất."},
{title:"Reading Part 6 — đoạn văn điền từ", points:["Part 6 giống Part 5 nhưng đặt trong đoạn văn có ngữ cảnh, cần đọc câu trước/sau để chọn đúng.","Có dạng câu hỏi chọn cả 1 câu hoàn chỉnh để điền vào chỗ trống — cần hiểu mạch ý cả đoạn.","Chú ý các từ nối (however, therefore, in addition) vì gợi ý quan hệ logic giữa các câu.","Thì động từ trong Part 6 phụ thuộc ngữ cảnh thời gian của cả đoạn, không chỉ câu chứa chỗ trống.","Làm Part 6 chậm hơn Part 5 một chút vì cần đọc hiểu ngữ cảnh, nhưng vẫn cần kiểm soát thời gian."], practice:"Làm 2 đoạn Part 6 (8 câu), phân tích riêng câu dạng \"chọn cả câu\" xem đã hiểu đúng mạch ý đoạn chưa.", case:"Part 6 chỉ có 16 câu nhưng lại bị nhiều thí sinh bỏ qua ôn luyện kỹ — trong khi đây là phần tương đối dễ lấy điểm nếu nắm vững ngữ pháp theo ngữ cảnh.", task:"Làm 2 đoạn Part 6 (8 câu), phân tích riêng câu dạng \"chọn cả câu\" xem đã hiểu đúng mạch ý đoạn chưa."},
{title:"Từ vựng mở rộng & tổng kết tháng 2", points:["Mở rộng từ vựng theo chủ đề: tài chính, nhân sự, sản xuất, du lịch công tác.","Học từ vựng theo cụm (collocation) thay vì từ đơn lẻ giúp nhớ lâu và dùng đúng ngữ cảnh hơn.","Ôn lại các câu sai của tháng 2, phân loại lỗi theo dạng (ngữ pháp/từ vựng/nghe không kịp).","Làm 1 đề mini tổng hợp cả 4 kỹ năng đã học (Part 1-4 Listening, Part 5-6 Reading).","Cuối tháng 2 nên đã quen với format và tốc độ của từng dạng câu hỏi."], practice:"Làm 1 đề mini đầy đủ hơn (khoảng 50 câu, đủ Part 1-6), so sánh điểm với đề thử tháng 1.", case:"Nhiều đề thi thật lặp lại các chủ đề quen thuộc (họp hành, du lịch công tác, tuyển dụng) — học từ vựng đúng chủ đề tiết kiệm thời gian hơn học từ vựng ngẫu nhiên.", task:"Làm 1 đề mini đầy đủ hơn (khoảng 50 câu, đủ Part 1-6), so sánh điểm với đề thử tháng 1."},
{title:"Reading Part 7 — đọc hiểu đơn", points:["Part 7 chiếm phần lớn thời gian Reading, cần chiến lược quản lý thời gian chặt chẽ.","Đọc lướt (skim) tiêu đề và câu đầu đoạn trước để nắm ý chính, sau đó đọc kỹ theo câu hỏi.","Câu hỏi dạng \"theo đoạn văn, điều gì đúng\" cần đối chiếu từng đáp án với văn bản, không đoán.","Câu hỏi từ đồng nghĩa cần xét nghĩa theo ngữ cảnh cụ thể, không theo nghĩa từ điển chung.","Luyện đọc nhanh nhưng chính xác quan trọng hơn đọc chậm để hiểu 100%."], practice:"Làm 2 bài đọc đơn Part 7 (10 câu) trong thời gian giới hạn khoảng 15 phút, tự đánh giá tốc độ đọc.", case:"Part 7 đơn chiếm khoảng 29 câu — đây là phần 'ăn chắc' cần luyện tốc độ đọc trước khi chuyển sang phần khó hơn.", task:"Làm 2 bài đọc đơn Part 7 (10 câu) trong thời gian giới hạn khoảng 15 phút, tự đánh giá tốc độ đọc."},
{title:"Reading Part 7 — đọc hiểu kép/ba", points:["Dạng đọc kép/ba yêu cầu kết hợp thông tin từ 2-3 văn bản khác nhau.","Luôn xác định câu hỏi cần thông tin từ văn bản nào trước khi tìm kiếm, tránh đọc lan man.","Câu hỏi khó nhất thường yêu cầu suy luận chéo giữa 2 văn bản.","Quản lý thời gian: nên dành không quá 8-10 phút cho mỗi bộ đọc kép/ba.","Đây là phần khó nhất của đề thi — không cần làm hoàn hảo, ưu tiên các câu dễ suy luận trước."], practice:"Làm 1 bộ đọc kép hoặc ba (khoảng 5 câu), đo thời gian làm và ghi lại câu nào cần suy luận chéo.", case:"Đọc hiểu kép/ba tuy khó nhưng chỉ chiếm khoảng 25 câu cuối — chiến thuật hợp lý là làm chắc phần dễ trước, dành thời gian còn lại cho phần khó.", task:"Làm 1 bộ đọc kép hoặc ba (khoảng 5 câu), đo thời gian làm và ghi lại câu nào cần suy luận chéo."},
{title:"Luyện đề tổng hợp có tính giờ", points:["Bắt đầu luyện đề theo đúng format thời gian thật: 45 phút Listening liền mạch + 75 phút Reading liền mạch.","Quen với việc không dừng lại giữa chừng — đề thi thật không có cơ hội tua lại băng nghe.","Ghi nhận Part nào tốn thời gian nhất trong Reading để phân bổ lại thời gian hợp lý hơn.","Sau khi làm xong, dành thời gian review kỹ tất cả câu sai thay vì chỉ xem điểm số.","Áp lực thời gian là yếu tố quan trọng nhất ảnh hưởng điểm số ở giai đoạn luyện đề."], practice:"Làm 1 đề TOEIC đầy đủ có tính giờ nghiêm ngặt, ghi lại điểm từng phần và thời gian còn dư/thiếu ở Reading.", case:"Nhiều thí sinh luyện đề rời rạc từng Part mà không luyện full-test có tính giờ — dẫn đến làm tốt khi luyện tập nhưng đuối sức khi thi thật vì không quen áp lực thời gian liên tục 2 tiếng.", task:"Làm 1 đề TOEIC đầy đủ có tính giờ nghiêm ngặt, ghi lại điểm từng phần và thời gian còn dư/thiếu ở Reading."},
{title:"Phân tích lỗi sai & tổng kết tháng 3", points:["Lập bảng thống kê lỗi sai theo Part, theo dạng câu hỏi để biết chính xác điểm yếu còn lại.","Với Listening: xác định lỗi do không nghe kịp tốc độ, không hiểu từ vựng, hay do mất tập trung.","Với Reading: xác định lỗi do thiếu từ vựng, sai ngữ pháp, hay do hết thời gian chưa kịp làm.","Ưu tiên ôn lại đúng nhóm lỗi sai nhiều nhất thay vì học lan man toàn bộ kiến thức.","Mục tiêu cuối tháng 3: điểm mini-test tổng hợp nên đã cải thiện rõ rệt so với tháng 2."], practice:"Làm 1 đề đầy đủ khác, lập bảng thống kê lỗi sai chi tiết theo Part và dạng câu hỏi.", case:"Việc thống kê lỗi sai có hệ thống là điều phân biệt thí sinh tự học hiệu quả với thí sinh học tràn lan không tiến bộ dù luyện rất nhiều đề.", task:"Làm 1 đề đầy đủ khác, lập bảng thống kê lỗi sai chi tiết theo Part và dạng câu hỏi."},
{title:"Chiến thuật Listening tốc độ cao", points:["Trong lúc nghe Part 3-4, tranh thủ đọc trước câu hỏi của bài tiếp theo nếu đã trả lời xong bài hiện tại.","Nếu bỏ lỡ 1 câu, đừng dừng lại suy nghĩ — bỏ qua ngay để không ảnh hưởng các câu sau.","Luyện tai với nhiều giọng khác nhau (Anh-Anh, Anh-Mỹ, Anh-Úc) vì đề thi có đủ các giọng này.","Đoán đáp án có cơ sở (loại trừ) tốt hơn bỏ trống — TOEIC không trừ điểm câu sai.","Giữ nhịp độ ổn định xuyên suốt, tránh dồn tập trung hết vào các bài đầu rồi đuối ở cuối."], practice:"Làm 2 đề Listening liên tiếp không nghỉ để luyện sức bền tập trung, ghi lại thời điểm bắt đầu mất tập trung.", case:"Giọng Anh-Úc thường là giọng gây khó nhất cho thí sinh Việt Nam vì ít được tiếp xúc trong quá trình học phổ thông — cần chủ động luyện thêm giọng này.", task:"Làm 2 đề Listening liên tiếp không nghỉ để luyện sức bền tập trung, ghi lại thời điểm bắt đầu mất tập trung."},

/* ============ STATE & PERSISTENCE ============ */
let currentTrack = 'fe';
let currentWeek = 0;
let currentDay = 0;
let currentNoteTab = 0;
let notes = {};
try { notes = JSON.parse(localStorage.getItem('roadmap-notes') || '{}'); } catch(e){ notes = {}; }
function noteKey(tabIdx){ return `${currentTrack}:${currentWeek}:${tabIdx}`; }
function saveNotes(){ localStorage.setItem('roadmap-notes', JSON.stringify(notes)); }
let progress = {};
try { progress = JSON.parse(localStorage.getItem('roadmap-progress') || '{}'); } catch(e){ progress = {}; }
const savedCode = {};
try { Object.assign(savedCode, JSON.parse(localStorage.getItem('roadmap-code') || '{}')); } catch(e){}

function saveProgress(){ localStorage.setItem('roadmap-progress', JSON.stringify(progress)); }
function saveCode(){ localStorage.setItem('roadmap-code', JSON.stringify(savedCode)); }
function isDone(trackKey, weekIdx){ return !!(progress[trackKey] && progress[trackKey][weekIdx]); }
function setDone(trackKey, weekIdx, val){
  if(!progress[trackKey]) progress[trackKey] = {};
  progress[trackKey][weekIdx] = val;
  saveProgress();
}
function countDone(trackKey){
  const t = tracks[trackKey];
  let c = 0;
  for(let i=0;i<t.weeks.length;i++){ if(isDone(trackKey,i)) c++; }
  return c;
}

    item.innerHTML = `<span class="num">T${i+1}</span><span class="title">${title}</span><span class="tick">${isDone(currentTrack,i) ? '✓' : ''}</span>`;
    item.addEventListener('click', () => { currentWeek = i; currentDay = 0; currentNoteTab = 0; renderAll(); });
    sidebar.appendChild(item);
  });
}

/* ============ TEST ENGINE (for Algorithm track) ============ */
function deepEqual(a, b){
  if (Array.isArray(a) && Array.isArray(b)) {
    if (a.length !== b.length) return false;
    return a.every((v,i) => deepEqual(v, b[i]));
  }
  if (a && b && typeof a === 'object' && typeof b === 'object') {
    const ak = Object.keys(a).sort(), bk = Object.keys(b).sort();
    if (ak.length !== bk.length) return false;
    return ak.every((k,i) => k === bk[i] && deepEqual(a[k], b[k]));
  }
  return a === b;
}
function anagramEqual(a, b){
  const norm = (arr) => arr.map(inner => [...inner].sort().join(',')).sort().join('|');
  try { return norm(a) === norm(b); } catch(e){ return false; }
}

/* ============ DAY TABS (real daily content, when available) ============ */
function dayTabsHTML(days){
  const tabs = days.map((d,i) => `<button class="day-tab${i===currentDay?' active':''}" data-day="${i}">${d.label}</button>`).join('');
  const d = days[currentDay] || days[0];

  const vocabHTML = d.vocab ? `
    <div class="vocab-table">
      <div class="vocab-row head"><span>Từ / Mẫu câu</span><span>Nghĩa / Gợi ý</span><span>Ví dụ</span></div>
      ${d.vocab.map(v => `<div class="vocab-row"><span class="term">${v.term}</span><span class="meaning">${v.meaning}</span><span class="example">${v.example}</span></div>`).join('')}
    </div>` : '';

  const quizHTML = d.quiz ? `
    <div class="quiz-block">
      <div class="quiz-title">Luyện tập có đáp án (${d.quiz.length} câu)</div>
      ${d.quiz.map((item,qi) => `
        <div class="quiz-item" data-qi="${qi}">
          <div class="quiz-q">${qi+1}. ${item.q}</div>
          <div class="quiz-opts">
            ${item.opts.map((opt,oi) => `<button class="quiz-opt" data-qi="${qi}" data-oi="${oi}">${String.fromCharCode(65+oi)}. ${opt}</button>`).join('')}
          </div>
          <div class="quiz-explain" style="display:none"></div>
        </div>
      `).join('')}
    </div>` : '';

  return `
    <div class="day-tabs">${tabs}</div>
    <div class="day-detail">
      <h4>${d.title}</h4>
      <div class="content">${d.content}</div>
      ${d.example ? `<div class="code-example">${d.example.replace(/</g,'&lt;')}</div>` : ''}
      <div class="exercise-box"><b>Bài tập ngày hôm nay (${d.exercises.length} bài)</b><ol class="exercise-list">${d.exercises.map(ex => `<li>${ex}</li>`).join('')}</ol></div>
      ${vocabHTML}
      ${quizHTML}
    </div>
  `;
}
function bindDayTabs(days){
  document.querySelectorAll('.day-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentDay = parseInt(btn.dataset.day, 10);
      renderMain();
    });
  });
  const d = (days && days[currentDay]) || (days && days[0]);
  if (d && d.quiz) {
    document.querySelectorAll('.quiz-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        const qi = parseInt(btn.dataset.qi, 10);
        const item = d.quiz[qi];
        const container = btn.closest('.quiz-item');
        if (container.classList.contains('answered')) return;
        container.classList.add('answered');
        const oi = parseInt(btn.dataset.oi, 10);
        container.querySelectorAll('.quiz-opt').forEach((optBtn,idx) => {
          if (idx === item.correct) optBtn.classList.add('correct');
          else if (idx === oi) optBtn.classList.add('incorrect');
        });
        const explainEl = container.querySelector('.quiz-explain');
        explainEl.textContent = (oi === item.correct ? '✓ Chính xác! ' : '✗ Chưa đúng. ') + item.explain;
        explainEl.style.display = 'block';
      });
    });
  }
}

/* ============ NOTES PANEL (right side, wide screens) ============ */
function getNoteTabs(){
  const t = tracks[currentTrack];
  const w = t.weeks[currentWeek];
  const hasDays = t.isAlgo ? !!problems[w.problemId].days : !!w.days;
  if (hasDays) {
    const days = t.isAlgo ? problems[w.problemId].days : w.days;
    return [...days.map(d => d.label), 'Tổng kết'];
  }
  return ['Ghi chú tuần'];
}
function renderNotesPanel(){
  const panel = document.getElementById('notesPanel');
  const t = tracks[currentTrack];
  panel.style.setProperty('--track-color', `var(${t.color})`);
  const tabs = getNoteTabs();
  if (currentNoteTab >= tabs.length) currentNoteTab = 0;
  const key = noteKey(currentNoteTab);
  const value = notes[key] || '';
  panel.innerHTML = `
    <div class="notes-header">
      <div class="title">Ghi chú của bạn</div>
      <div class="notes-tabs">${tabs.map((label,i) => `<button class="notes-tab${i===currentNoteTab?' active':''}" data-tab="${i}">${label}</button>`).join('')}</div>
    </div>
    <div class="notes-body">
      <textarea id="notesArea" placeholder="Ghi lại ý chính, từ mới, đoạn code hay cần nhớ, câu hỏi cần tra cứu thêm...">${value.replace(/</g,'&lt;')}</textarea>
      <div class="notes-saved" id="notesSaved">✓ đã lưu</div>
      <div class="notes-hint">Mỗi tab lưu ghi chú riêng cho ngày/tuần tương ứng, tự động lưu trên trình duyệt này.</div>
    </div>
  `;
  bindNotesPanel();
}
function bindNotesPanel(){
  document.querySelectorAll('.notes-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentNoteTab = parseInt(btn.dataset.tab, 10);
      renderNotesPanel();
    });
  });
  const area = document.getElementById('notesArea');
  const savedFlag = document.getElementById('notesSaved');
  let saveTimer = null;
  area.addEventListener('input', () => {
    notes[noteKey(currentNoteTab)] = area.value;
    saveNotes();
    savedFlag.classList.add('show');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => savedFlag.classList.remove('show'), 1200);
  });
}

          <div class="console">
            <div class="console-topbar">console</div>
            <div class="console-body" id="console-body"><div class="console-empty">nhấn "Chạy test" để kiểm tra bài giải</div></div>
          </div>
          <div class="info-box case"><b>Ứng dụng thực tế</b>${problem.caseReal}</div>
        </div>
      </div>
      <div class="week-nav">
        <button class="nav-btn" id="btn-prev" ${currentWeek === 0 ? 'disabled' : ''}>← Tuần trước</button>
        <button class="nav-btn" id="btn-next" ${currentWeek === t.weeks.length-1 ? 'disabled' : ''}>Tuần tiếp →</button>
      </div>
    `;
    document.getElementById('btn-reset').addEventListener('click', () => {
      document.getElementById('editor').value = problem.starter;
      delete savedCode[w.problemId];
      saveCode();
      document.getElementById('console-body').innerHTML = '<div class="console-empty">nhấn "Chạy test" để kiểm tra bài giải</div>';
    });
    document.getElementById('editor').addEventListener('input', (e) => {
      savedCode[w.problemId] = e.target.value;
      saveCode();
    });
    document.getElementById('btn-run').addEventListener('click', () => runTests(w.problemId, problem));
  }

  document.getElementById('btn-prev').addEventListener('click', () => { if(currentWeek>0){ currentWeek--; currentDay=0; currentNoteTab=0; renderAll(); window.scrollTo(0,0);} });
  document.getElementById('btn-next').addEventListener('click', () => { if(currentWeek<t.weeks.length-1){ currentWeek++; currentDay=0; currentNoteTab=0; renderAll(); window.scrollTo(0,0);} });

  bindDayTabs(t.isAlgo ? problems[w.problemId].days : w.days);
}

function runTests(problemId, problem){
  const code = document.getElementById('editor').value;
  const body = document.getElementById('console-body');
  let userFn;
  try {
    const scope = new Function(code + '\nreturn solve;');
    userFn = scope();
    if (typeof userFn !== 'function') throw new Error('Không tìm thấy hàm solve() hợp lệ.');
  } catch(e){
    body.innerHTML = `<div class="error-line">✗ Lỗi cú pháp: ${e.message}</div>`;
    return;
  }

  let lines = '';
  let passCount = 0;
  problem.tests.forEach((t, i) => {
    try {
      const actual = userFn(...t.args);
      const pass = t.normalize === 'anagram' ? anagramEqual(actual, t.expected) : deepEqual(actual, t.expected);
      if (pass) passCount++;
      const detail = pass ? '' : `mong đợi ${JSON.stringify(t.expected)}, nhận được ${JSON.stringify(actual)}`;
      lines += `<div class="test-line ${pass ? 'pass' : 'fail'}"><span class="mark">${pass ? '✓' : '✗'}</span><span><span class="txt">test ${i+1} — input: ${JSON.stringify(t.args)}</span>${detail ? `<span class="detail">${detail}</span>` : ''}</span></div>`;
    } catch(e){
      lines += `<div class="test-line fail"><span class="mark">✗</span><span><span class="txt">test ${i+1} — lỗi khi chạy</span><span class="detail">${e.message}</span></span></div>`;
    }
  });

  const allPass = passCount === problem.tests.length;
  lines += `<div class="summary-line ${allPass ? 'pass' : 'fail'}">${passCount}/${problem.tests.length} test passed${allPass ? ' — hoàn thành bài này!' : ''}</div>`;
  body.innerHTML = lines;

  if (allPass) {
    setDone(currentTrack, currentWeek, true);
    renderAll();
  }
}

/* ============ INIT ============ */
function renderAll(){
  renderMenu();
  renderSidebar();
  renderMain();
  renderNotesPanel();
}
renderAll();
</script>
</body>
</html>
