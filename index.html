<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện Thuật Toán JS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg-primary:#0B0E14;
    --bg-panel:#11151E;
    --bg-elevated:#1A2030;
    --bg-elevated-2:#212942;
    --border:#242C3E;
    --text-primary:#E7E9F0;
    --text-muted:#8B93A7;
    --text-dim:#5A6273;
    --accent-teal:#4FD1C5;
    --accent-teal-dim:rgba(79,209,197,0.12);
    --accent-amber:#F0B429;
    --accent-amber-dim:rgba(240,180,41,0.12);
    --accent-coral:#FF6B6B;
    --accent-coral-dim:rgba(255,107,107,0.12);
    --accent-violet:#9F7AEA;
    --accent-violet-dim:rgba(159,122,234,0.12);
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg-primary);
    color:var(--text-primary);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  ::selection{background:var(--accent-teal-dim); color:var(--accent-teal);}

  /* Header */
  header{
    padding:20px 28px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:12px;}
  .brand .dot{
    width:10px; height:10px; border-radius:50%;
    background:var(--accent-teal);
    display:inline-block;
    box-shadow:0 0 12px var(--accent-teal);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.4;}}
  .brand h1{
    font-family:var(--mono);
    font-size:18px;
    font-weight:700;
    letter-spacing:-0.02em;
  }
  .brand .path{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-dim);
  }
  .stats{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-muted);
    display:flex;
    gap:18px;
  }
  .stats b{color:var(--accent-teal); font-weight:600;}

  /* Layout */
  .app{
    flex:1;
    display:grid;
    grid-template-columns:260px 1fr;
    min-height:0;
  }
  @media (max-width:860px){
    .app{grid-template-columns:1fr;}
    .sidebar{border-right:none; border-bottom:1px solid var(--border); max-height:220px;}
  }

  /* Sidebar */
  .sidebar{
    border-right:1px solid var(--border);
    overflow-y:auto;
    padding:16px 0;
  }
  .sidebar-group{margin-bottom:6px;}
  .sidebar-label{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.12em;
    color:var(--text-dim);
    padding:8px 20px 6px;
    text-transform:uppercase;
  }
  .problem-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:10px 20px;
    cursor:pointer;
    border-left:2px solid transparent;
    transition:background .15s, border-color .15s;
  }
  .problem-item:hover{background:var(--bg-elevated);}
  .problem-item.active{
    background:var(--bg-elevated);
    border-left-color:var(--accent-teal);
  }
  .problem-item .name{
    font-size:13.5px;
    color:var(--text-primary);
  }
  .problem-item .badge{
    font-family:var(--mono);
    font-size:10px;
    font-weight:600;
    padding:2px 7px;
    border-radius:20px;
    white-space:nowrap;
  }
  .badge.easy{background:var(--accent-violet-dim); color:var(--accent-violet);}
  .badge.medium{background:var(--accent-amber-dim); color:var(--accent-amber);}
  .badge.hard{background:var(--accent-coral-dim); color:var(--accent-coral);}
  .problem-item .check{
    font-family:var(--mono);
    color:var(--accent-teal);
    font-size:12px;
    width:14px;
    text-align:center;
  }

  /* Main */
  main{
    padding:28px 32px 40px;
    overflow-y:auto;
  }
  .problem-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin-bottom:6px;
  }
  .problem-header h2{
    font-family:var(--mono);
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .desc{
    color:var(--text-muted);
    font-size:14.5px;
    line-height:1.6;
    max-width:70ch;
    margin:12px 0 20px;
  }
  .example{
    font-family:var(--mono);
    font-size:12.5px;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    color:var(--text-muted);
    margin-bottom:22px;
    max-width:70ch;
  }
  .example b{color:var(--accent-teal); font-weight:600;}

  .editor-wrap{
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:var(--bg-panel);
    margin-bottom:16px;
  }
  .editor-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 14px;
    background:var(--bg-elevated);
    border-bottom:1px solid var(--border);
  }
  .editor-topbar .fname{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-muted);
  }
  .btn-row{display:flex; gap:10px;}
  button{
    font-family:var(--mono);
    font-size:12.5px;
    font-weight:600;
    border:none;
    border-radius:6px;
    padding:8px 16px;
    cursor:pointer;
    transition:transform .1s, opacity .15s;
  }
  button:active{transform:scale(0.97);}
  .btn-run{
    background:var(--accent-teal);
    color:#04211E;
  }
  .btn-run:hover{opacity:0.88;}
  .btn-reset{
    background:transparent;
    color:var(--text-muted);
    border:1px solid var(--border);
  }
  .btn-reset:hover{color:var(--text-primary); border-color:var(--text-dim);}

  textarea#editor{
    width:100%;
    min-height:220px;
    background:var(--bg-panel);
    color:var(--text-primary);
    border:none;
    outline:none;
    resize:vertical;
    font-family:var(--mono);
    font-size:13.5px;
    line-height:1.65;
    padding:16px 18px;
    tab-size:2;
  }

  /* Console */
  .console{
    border:1px solid var(--border);
    border-radius:10px;
    background:#080A0F;
    overflow:hidden;
  }
  .console-topbar{
    padding:9px 14px;
    background:var(--bg-elevated);
    border-bottom:1px solid var(--border);
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-dim);
    display:flex;
    justify-content:space-between;
  }
  .console-body{
    padding:14px 16px;
    font-family:var(--mono);
    font-size:13px;
    line-height:1.9;
    min-height:60px;
    max-height:320px;
    overflow-y:auto;
  }
  .console-empty{color:var(--text-dim);}
  .console-empty .cursor{
    display:inline-block;
    width:7px; height:14px;
    background:var(--text-dim);
    vertical-align:middle;
    margin-left:4px;
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{0%,49%{opacity:1;} 50%,100%{opacity:0;}}

  .test-line{display:flex; gap:10px; align-items:flex-start; margin-bottom:6px;}
  .test-line .mark{width:14px; flex-shrink:0;}
  .test-line.pass .mark{color:var(--accent-teal);}
  .test-line.fail .mark{color:var(--accent-coral);}
  .test-line .txt{color:var(--text-muted);}
  .test-line.fail .txt{color:var(--text-primary);}
  .test-line .detail{color:var(--text-dim); display:block; margin-top:2px; font-size:12px;}
  .summary-line{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--border);
    font-weight:600;
  }
  .summary-line.pass{color:var(--accent-teal);}
  .summary-line.fail{color:var(--accent-coral);}
  .error-line{color:var(--accent-coral); white-space:pre-wrap;}

  footer{
    text-align:center;
    padding:16px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-dim);
    border-top:1px solid var(--border);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    <h1>luyện thuật toán JS</h1>
    <span class="path">~/practice/algorithms</span>
  </div>
  <div class="stats">
    <span>đã giải: <b id="stat-solved">0</b>/<span id="stat-total">0</span></span>
  </div>
</header>

<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main>
    <div class="problem-header">
      <h2 id="p-title"></h2>
      <span class="badge" id="p-badge"></span>
    </div>
    <p class="desc" id="p-desc"></p>
    <div class="example" id="p-example"></div>

    <div class="editor-wrap">
      <div class="editor-topbar">
        <span class="fname" id="p-signature">solution.js</span>
        <div class="btn-row">
          <button class="btn-reset" id="btn-reset">Đặt lại</button>
          <button class="btn-run" id="btn-run">▶ Chạy test</button>
        </div>
      </div>
      <textarea id="editor" spellcheck="false"></textarea>
    </div>

    <div class="console">
      <div class="console-topbar">
        <span>console</span>
        <span id="console-time"></span>
      </div>
      <div class="console-body" id="console-body">
        <div class="console-empty">nhấn "Chạy test" để kiểm tra bài giải<span class="cursor"></span></div>
      </div>
    </div>
  </main>
</div>

<footer>được tạo cho việc luyện tập cá nhân · toàn bộ code chạy ngay trên trình duyệt, không gửi đi đâu cả</footer>

<script>
const problems = [
  {
    id: 'two-sum',
    name: 'Two Sum',
    difficulty: 'easy',
    signature: 'function solve(nums, target)',
    desc: 'Cho mảng số nguyên nums và một số target, trả về chỉ số (index) của hai phần tử có tổng bằng target. Giả sử luôn có đúng một đáp án và không dùng một phần tử hai lần.',
    example: '<b>Input:</b> nums = [2,7,11,15], target = 9\n<b>Output:</b> [0,1]',
    starter: 'function solve(nums, target) {\n  // viết code tại đây\n}',
    tests: [
      { args: [[2,7,11,15], 9], expected: [0,1] },
      { args: [[3,2,4], 6], expected: [1,2] },
      { args: [[3,3], 6], expected: [0,1] },
    ],
  },
  {
    id: 'reverse-string',
    name: 'Đảo ngược chuỗi',
    difficulty: 'easy',
    signature: 'function solve(str)',
    desc: 'Viết hàm đảo ngược một chuỗi ký tự, không dùng hàm .reverse() có sẵn của Array.',
    example: '<b>Input:</b> "hello"\n<b>Output:</b> "olleh"',
    starter: 'function solve(str) {\n  // viết code tại đây\n}',
    tests: [
      { args: ['hello'], expected: 'olleh' },
      { args: ['JavaScript'], expected: 'tpircSavaJ' },
      { args: [''], expected: '' },
    ],
  },
  {
    id: 'fizzbuzz',
    name: 'FizzBuzz',
    difficulty: 'easy',
    signature: 'function solve(n)',
    desc: 'Trả về mảng từ 1 đến n, thay số chia hết cho 3 bằng "Fizz", chia hết cho 5 bằng "Buzz", chia hết cho cả hai bằng "FizzBuzz".',
    example: '<b>Input:</b> 5\n<b>Output:</b> ["1","2","Fizz","4","Buzz"]',
    starter: 'function solve(n) {\n  // viết code tại đây\n}',
    tests: [
      { args: [5], expected: ["1","2","Fizz","4","Buzz"] },
      { args: [15], expected: ["1","2","Fizz","4","Buzz","Fizz","7","8","Fizz","Buzz","11","Fizz","13","14","FizzBuzz"] },
    ],
  },
  {
    id: 'valid-palindrome',
    name: 'Kiểm tra Palindrome',
    difficulty: 'easy',
    signature: 'function solve(str)',
    desc: 'Kiểm tra một chuỗi có phải là palindrome hay không (đọc xuôi và ngược giống nhau), bỏ qua khoảng trắng và không phân biệt hoa thường.',
    example: '<b>Input:</b> "A man a plan a canal Panama"\n<b>Output:</b> true',
    starter: 'function solve(str) {\n  // viết code tại đây\n}',
    tests: [
      { args: ['A man a plan a canal Panama'], expected: true },
      { args: ['race a car'], expected: false },
      { args: ['level'], expected: true },
    ],
  },
  {
    id: 'binary-search',
    name: 'Tìm kiếm nhị phân',
    difficulty: 'medium',
    signature: 'function solve(sortedArr, target)',
    desc: 'Cài đặt binary search trên mảng đã sắp xếp tăng dần, trả về chỉ số của target, hoặc -1 nếu không tìm thấy. Độ phức tạp yêu cầu O(log n).',
    example: '<b>Input:</b> sortedArr = [1,3,5,7,9,11], target = 7\n<b>Output:</b> 3',
    starter: 'function solve(sortedArr, target) {\n  // viết code tại đây\n}',
    tests: [
      { args: [[1,3,5,7,9,11], 7], expected: 3 },
      { args: [[1,3,5,7,9,11], 2], expected: -1 },
      { args: [[5], 5], expected: 0 },
    ],
  },
  {
    id: 'group-anagrams',
    name: 'Nhóm Anagram',
    difficulty: 'medium',
    signature: 'function solve(words)',
    desc: 'Cho mảng chuỗi, nhóm các từ là anagram của nhau lại thành các mảng con. Thứ tự các nhóm và thứ tự trong nhóm không quan trọng (kết quả sẽ được so sánh sau khi sắp xếp).',
    example: '<b>Input:</b> ["eat","tea","tan","ate","nat","bat"]\n<b>Output:</b> [["eat","tea","ate"],["tan","nat"],["bat"]]',
    starter: 'function solve(words) {\n  // viết code tại đây\n}',
    tests: [
      { args: [["eat","tea","tan","ate","nat","bat"]], expected: [["ate","eat","tea"],["nat","tan"],["bat"]], normalize: 'anagram' },
    ],
  },
  {
    id: 'debounce',
    name: 'Cài đặt Debounce',
    difficulty: 'medium',
    signature: 'function solve(fn, delay)',
    desc: 'Viết hàm debounce(fn, delay) trả về một hàm mới: chỉ gọi fn sau khi ngừng gọi hàm mới liên tục trong khoảng thời gian delay (ms). Bài này được kiểm tra logic gọi hàm bằng giả lập, không dùng timer thật.',
    example: '<b>Input:</b> debounce(fn, 100) rồi gọi liên tục 5 lần trong 50ms\n<b>Output:</b> fn chỉ được gọi 1 lần, với tham số của lần gọi cuối',
    starter: 'function solve(fn, delay) {\n  let timer = null;\n  return function(...args) {\n    // viết code tại đây\n  };\n}',
    tests: [
      { args: [], custom: 'debounce' },
    ],
  },
  {
    id: 'max-subarray',
    name: 'Tổng mảng con lớn nhất',
    difficulty: 'hard',
    signature: 'function solve(nums)',
    desc: 'Cho mảng số nguyên (có thể âm), tìm tổng lớn nhất của một mảng con liên tiếp. Yêu cầu độ phức tạp O(n) (thuật toán Kadane).',
    example: '<b>Input:</b> [-2,1,-3,4,-1,2,1,-5,4]\n<b>Output:</b> 6  (mảng con [4,-1,2,1])',
    starter: 'function solve(nums) {\n  // viết code tại đây\n}',
    tests: [
      { args: [[-2,1,-3,4,-1,2,1,-5,4]], expected: 6 },
      { args: [[1]], expected: 1 },
      { args: [[5,4,-1,7,8]], expected: 23 },
      { args: [[-3,-1,-2]], expected: -1 },
    ],
  },
  {
    id: 'flatten',
    name: 'Làm phẳng mảng lồng nhau',
    difficulty: 'hard',
    signature: 'function solve(arr)',
    desc: 'Viết hàm làm phẳng hoàn toàn một mảng lồng nhau ở bất kỳ độ sâu nào, không dùng Array.prototype.flat(Infinity).',
    example: '<b>Input:</b> [1,[2,[3,[4,5]],6]]\n<b>Output:</b> [1,2,3,4,5,6]',
    starter: 'function solve(arr) {\n  // viết code tại đây\n}',
    tests: [
      { args: [[1,[2,[3,[4,5]],6]]], expected: [1,2,3,4,5,6] },
      { args: [[1,2,3]], expected: [1,2,3] },
      { args: [[[1],[2,[3]]]], expected: [1,2,3] },
    ],
  },
];

const solved = new Set();
let currentId = problems[0].id;
const savedCode = {};

const sidebar = document.getElementById('sidebar');
const groups = { easy: 'Dễ', medium: 'Trung bình', hard: 'Khó' };

function renderSidebar(){
  sidebar.innerHTML = '';
  Object.keys(groups).forEach(diff => {
    const group = document.createElement('div');
    group.className = 'sidebar-group';
    const label = document.createElement('div');
    label.className = 'sidebar-label';
    label.textContent = groups[diff];
    group.appendChild(label);
    problems.filter(p => p.difficulty === diff).forEach(p => {
      const item = document.createElement('div');
      item.className = 'problem-item' + (p.id === currentId ? ' active' : '');
      item.innerHTML = `
        <span class="check">${solved.has(p.id) ? '✓' : ''}</span>
        <span class="name" style="flex:1">${p.name}</span>
        <span class="badge ${p.difficulty}">${groups[p.difficulty]}</span>
      `;
      item.addEventListener('click', () => selectProblem(p.id));
      group.appendChild(item);
    });
    sidebar.appendChild(group);
  });
  document.getElementById('stat-total').textContent = problems.length;
  document.getElementById('stat-solved').textContent = solved.size;
}

function selectProblem(id){
  currentId = id;
  const p = problems.find(x => x.id === id);
  document.getElementById('p-title').textContent = p.name;
  document.getElementById('p-badge').textContent = groups[p.difficulty];
  document.getElementById('p-badge').className = 'badge ' + p.difficulty;
  document.getElementById('p-desc').textContent = p.desc;
  document.getElementById('p-example').innerHTML = p.example;
  document.getElementById('p-signature').textContent = p.signature.match(/solve\(.*\)/)[0] + '.js';
  document.getElementById('editor').value = savedCode[id] || p.starter;
  resetConsole();
  renderSidebar();
}

document.getElementById('btn-reset').addEventListener('click', () => {
  const p = problems.find(x => x.id === currentId);
  document.getElementById('editor').value = p.starter;
  delete savedCode[currentId];
  resetConsole();
});

document.getElementById('editor').addEventListener('input', (e) => {
  savedCode[currentId] = e.target.value;
});

function resetConsole(){
  document.getElementById('console-body').innerHTML =
    '<div class="console-empty">nhấn "Chạy test" để kiểm tra bài giải<span class="cursor"></span></div>';
  document.getElementById('console-time').textContent = '';
}

function deepEqual(a, b){
  return JSON.stringify(a) === JSON.stringify(b);
}

function anagramEqual(a, b){
  const norm = (arr) => arr.map(inner => [...inner].sort().join(',')).sort().join('|');
  try { return norm(a) === norm(b); } catch(e){ return false; }
}

function runDebounceTest(userFn){
  // Simulated timer to test debounce logic deterministically
  let calls = [];
  const fakeFn = (...args) => calls.push(args);
  let scheduled = null;
  const originalSetTimeout = window.setTimeout;
  const originalClearTimeout = window.clearTimeout;
  let virtualTime = 0;
  let pending = null;

  window.setTimeout = (cb, ms) => { pending = { cb, fireAt: virtualTime + ms }; return 1; };
  window.clearTimeout = () => { pending = null; };

  try {
    const debounced = userFn(fakeFn, 100);
    debounced(1);
    debounced(2);
    debounced(3);
    if (pending) { pending.cb(); }
    window.setTimeout = originalSetTimeout;
    window.clearTimeout = originalClearTimeout;
    const pass = calls.length === 1 && deepEqual(calls[0], [3]);
    return { pass, detail: pass ? '' : `gọi ${calls.length} lần, kỳ vọng đúng 1 lần với tham số cuối cùng` };
  } catch(e){
    window.setTimeout = originalSetTimeout;
    window.clearTimeout = originalClearTimeout;
    throw e;
  }
}

document.getElementById('btn-run').addEventListener('click', () => {
  const p = problems.find(x => x.id === currentId);
  const code = document.getElementById('editor').value;
  const body = document.getElementById('console-body');
  const now = new Date();
  document.getElementById('console-time').textContent =
    now.toLocaleTimeString('vi-VN', { hour12: false });

  let userFn;
  try {
    const scope = new Function(code + '\nreturn solve;');
    userFn = scope();
    if (typeof userFn !== 'function') throw new Error('Không tìm thấy hàm solve() hợp lệ.');
  } catch(e){
    body.innerHTML = `<div class="error-line">✗ Lỗi cú pháp: ${e.message}</div>`;
    return;
  }

  let lines = '';
  let passCount = 0;

  p.tests.forEach((t, i) => {
    try {
      let pass, detail = '';
      if (t.custom === 'debounce') {
        const r = runDebounceTest(userFn);
        pass = r.pass; detail = r.detail;
      } else {
        const actual = userFn(...t.args);
        pass = t.normalize === 'anagram' ? anagramEqual(actual, t.expected) : deepEqual(actual, t.expected);
        if (!pass) {
          detail = `mong đợi ${JSON.stringify(t.expected)}, nhận được ${JSON.stringify(actual)}`;
        }
      }
      if (pass) passCount++;
      lines += `<div class="test-line ${pass ? 'pass' : 'fail'}">
        <span class="mark">${pass ? '✓' : '✗'}</span>
        <span>
          <span class="txt">test ${i + 1}${t.custom ? '' : ' — input: ' + JSON.stringify(t.args)}</span>
          ${detail ? `<span class="detail">${detail}</span>` : ''}
        </span>
      </div>`;
    } catch(e){
      lines += `<div class="test-line fail">
        <span class="mark">✗</span>
        <span><span class="txt">test ${i + 1} — lỗi khi chạy</span><span class="detail">${e.message}</span></span>
      </div>`;
    }
  });

  const allPass = passCount === p.tests.length;
  lines += `<div class="summary-line ${allPass ? 'pass' : 'fail'}">
    ${passCount}/${p.tests.length} test passed${allPass ? ' — hoàn thành bài này!' : ''}
  </div>`;

  body.innerHTML = lines;

  if (allPass) {
    solved.add(p.id);
    renderSidebar();
  }
});

renderSidebar();
selectProblem(currentId);
</script>
</body>
</html>
