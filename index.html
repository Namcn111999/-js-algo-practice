{q:"RDS instance được đặt ở Private Subnet có truy cập internet trực tiếp được không?", opts:["Có, luôn truy cập được", "Không, cần qua NAT Gateway nếu cần ra ngoài (thường không cần với DB)", "Luôn bị chặn hoàn toàn mọi kết nối", "Không liên quan đến Subnet"], correct:1, explain:"Private Subnet không có route trực tiếp ra internet, phù hợp cho database."},
{q:"Checklist bảo mật RDS cơ bản nên bao gồm điều gì?", opts:["Không cần checklist gì", "Private Subnet, Security Group hạn chế, Encryption, backup định kỳ", "Chỉ cần đặt mật khẩu mạnh", "Chỉ cần bật Multi-AZ"], correct:1, explain:"Đây là 4 yếu tố bảo mật cơ bản cần kiểm tra cho RDS production."},
{q:"Vì sao nên tùy chỉnh Parameter Group thay vì luôn dùng mặc định?", opts:["Không cần thiết", "Để tối ưu hiệu năng/hành vi database theo đúng nhu cầu ứng dụng cụ thể", "Mặc định luôn sai", "Bắt buộc theo quy định AWS"], correct:1, explain:"Tùy chỉnh giúp database hoạt động tối ưu hơn cho khối lượng công việc cụ thể."},
]},
{label:'Thứ 6', title:'Tổng kết tuần 5', content:'RDS là dịch vụ quản lý database quan trọng bậc nhất trong kiến trúc AWS thực tế — hiểu đúng Multi-AZ/Read Replica/Backup là kiến thức thi SAA gặp thường xuyên nhất trong nhóm database. So với tự triển khai database trên EC2, RDS đánh đổi 1 phần quyền kiểm soát để lấy sự tiện lợi vận hành. Amazon Aurora là lựa chọn nâng cao hơn khi cần hiệu năng cao và khả năng scale tốt hơn MySQL/PostgreSQL gốc, dù chi phí cao hơn.', exercises:["Vẽ sơ đồ kiến trúc hoàn chỉnh: EC2 (Public Subnet) kết nối RDS Multi-AZ (Private Subnet) có 1 Read Replica.","Viết lại từ trí nhớ sự khác biệt Multi-AZ vs Read Replica, tự chấm điểm độ chính xác.","Ước tính chi phí RDS hàng tháng cho kiến trúc đã vẽ bằng AWS Pricing Calculator.","Dọn dẹp toàn bộ RDS instance/snapshot test không cần dùng để tránh phát sinh phí.","Viết 3 câu hỏi bạn còn thắc mắc về RDS để tự tra cứu thêm."], quiz:[
{q:"Chủ đề trọng tâm của tuần 5 tháng 2 là gì?", opts:["EC2 và Security Group", "RDS: Multi-AZ, Read Replica, Backup, bảo mật", "S3 storage class", "VPC và Subnet"], correct:1, explain:"Tuần 5 tập trung toàn diện vào dịch vụ RDS."},
{q:"Điểm khác biệt cốt lõi giữa Multi-AZ và Read Replica là gì?", opts:["Không có khác biệt", "Multi-AZ cho High Availability, Read Replica cho scale đọc", "Cả hai đều giống hệt nhau về mục đích", "Multi-AZ chỉ dùng cho Aurora"], correct:1, explain:"Đây là kiến thức cốt lõi cần nắm vững sau tuần 5."},
{q:"Vì sao RDS phù hợp hơn tự cài database trên EC2 cho hầu hết trường hợp?", opts:["Không có lý do gì", "Giảm đáng kể công sức vận hành (patching, backup, failover tự động)", "RDS luôn nhanh hơn tuyệt đối", "RDS miễn phí hoàn toàn"], correct:1, explain:"Lợi ích chính của RDS là giảm gánh nặng vận hành, không phải luôn nhanh hơn tuyệt đối."},
{q:"Aurora nên cân nhắc dùng khi nào?", opts:["Không bao giờ nên dùng", "Khi cần hiệu năng và khả năng scale cao hơn MySQL/PostgreSQL gốc, chấp nhận chi phí cao hơn", "Chỉ dùng cho ứng dụng nhỏ", "Aurora luôn rẻ hơn MySQL"], correct:1, explain:"Aurora là lựa chọn nâng cao, đánh đổi chi phí lấy hiệu năng."},
{q:"Kiến trúc EC2 (Public) + RDS Multi-AZ (Private) + Read Replica thể hiện nguyên tắc gì?", opts:["Không có nguyên tắc cụ thể", "Tách lớp bảo mật (Public/Private) kết hợp cả High Availability và khả năng scale đọc", "Chỉ để tăng chi phí", "Chỉ dùng cho mục đích demo"], correct:1, explain:"Đây là kiến trúc kết hợp đầy đủ các nguyên tắc bảo mật và độ sẵn sàng đã học."},
{q:"Việc dọn dẹp tài nguyên RDS test sau khi học có quan trọng không?", opts:["Không quan trọng", "Quan trọng, vì RDS instance chạy liên tục sẽ phát sinh phí đáng kể", "Chỉ cần dọn 1 lần duy nhất trong đời", "RDS luôn miễn phí"], correct:1, explain:"RDS ngoài Free Tier tính phí theo giờ, cần dọn dẹp để tránh phát sinh chi phí không cần thiết."},
{q:"Đề thi SAA thường hỏi về RDS theo dạng nào?", opts:["Không bao giờ hỏi về RDS", "Câu hỏi tình huống chọn đúng giải pháp (Multi-AZ/Read Replica/Backup) cho yêu cầu cụ thể", "Chỉ hỏi lý thuyết thuần túy", "Chỉ hỏi về giá cả"], correct:1, explain:"Dạng câu hỏi tình huống là phổ biến nhất, đòi hỏi hiểu rõ khi nào dùng giải pháp nào."},
{q:"RDS Multi-AZ và Read Replica có thể dùng đồng thời cho 1 instance chính không?", opts:["Không thể kết hợp", "Có, đây là kiến trúc phổ biến cho hệ thống cần cả HA và scale đọc", "Chỉ 1 trong 2 được phép tồn tại", "Chỉ Aurora mới kết hợp được"], correct:1, explain:"Kết hợp cả 2 là thiết kế phổ biến trong thực tế production."},
{q:"Sau tuần 5, kiến thức nào là nền tảng quan trọng nhất cần nhớ?", opts:["Chỉ cần nhớ giá cả", "Phân biệt đúng khi nào dùng Multi-AZ, khi nào dùng Read Replica, và chiến lược backup phù hợp", "Chỉ cần nhớ tên dịch vụ", "Không có kiến thức nào quan trọng"], correct:1, explain:"Đây là 3 trụ cột kiến thức RDS quan trọng nhất cho cả thực tế và đề thi."},
{q:"RDS thuộc nhóm dịch vụ nào trong AWS Well-Architected Framework?", opts:["Không thuộc trụ cột nào", "Liên quan đến Reliability (độ tin cậy) và Performance Efficiency", "Chỉ liên quan Cost Optimization", "Chỉ liên quan Security"], correct:1, explain:"Thiết kế RDS đúng cách ảnh hưởng trực tiếp đến độ tin cậy và hiệu năng hệ thống."},
]},
]},
{title:"Load Balancer & Auto Scaling", points:["Elastic Load Balancer phân phối traffic đến nhiều EC2 instance, tăng độ sẵn sàng và khả năng chịu tải.","Application Load Balancer (ALB) hoạt động ở tầng 7 (HTTP/HTTPS); Network Load Balancer (NLB) hoạt động ở tầng 4, phù hợp traffic cực lớn cần độ trễ thấp.","Auto Scaling Group tự động tăng/giảm số lượng EC2 instance dựa trên metric, giúp tối ưu chi phí và đảm bảo hiệu năng.","Health Check giúp Load Balancer/ASG phát hiện instance bị lỗi và tự động thay thế.","Kết hợp ALB + ASG là kiến trúc chuẩn cho ứng dụng web có khả năng mở rộng trên AWS."], practice:"Tạo Auto Scaling Group với 2-3 EC2 instance chạy web server, gắn Application Load Balancer phía trước.", case:"Thiết kế high-availability kết hợp ALB + ASG là pattern kiến trúc xuất hiện trong phần lớn câu hỏi tình huống của đề thi SAA.", task:"Cấu hình Scaling Policy tự động thêm instance khi CPU trung bình vượt 70%, thử giả lập tải để quan sát Auto Scaling hoạt động.", days:[
{label:'Thứ 2', title:'ELB cơ bản & các loại Load Balancer', content:'Elastic Load Balancer (ELB) phân phối traffic đến nhiều target (EC2 instance, container, Lambda) để tăng độ sẵn sàng. AWS có 3 loại chính: Application Load Balancer (ALB, tầng 7 HTTP/HTTPS, hỗ trợ routing theo path/host, phù hợp web app hiện đại), Network Load Balancer (NLB, tầng 4 TCP/UDP, độ trễ cực thấp, xử lý hàng triệu request/giây), và Classic Load Balancer (CLB, thế hệ cũ). ALB là lựa chọn phổ biến nhất cho ứng dụng web hiện đại vì hỗ trợ routing thông minh và tích hợp tốt với container/microservices.', exercises:["Tạo 1 Application Load Balancer, gắn với 2 EC2 instance chạy web server đã có từ trước.","So sánh ALB và NLB theo 3 tiêu chí: tầng OSI, use case, độ trễ.","Thử truy cập DNS name của ALB, xác nhận traffic được phân phối luân phiên giữa 2 instance.","Tìm hiểu path-based routing của ALB dùng để làm gì (ví dụ /api đi đến 1 target group khác /images).","Đọc thêm về Gateway Load Balancer (loại thứ 4, ít phổ biến hơn), dùng trong tình huống nào."], quiz:[
{q:"ALB hoạt động ở tầng nào của mô hình OSI?", opts:["Tầng 3", "Tầng 4", "Tầng 7", "Tầng 2"], correct:2, explain:"ALB là Application Load Balancer, hoạt động ở tầng ứng dụng (tầng 7)."},
{q:"NLB phù hợp nhất cho tình huống nào?", opts:["Routing theo path URL", "Traffic cực lớn, cần độ trễ cực thấp", "Chỉ dùng cho HTTPS", "Không dùng được cho web app"], correct:1, explain:"NLB tối ưu cho hiệu năng và độ trễ cực thấp ở tầng transport."},
{q:"ALB hỗ trợ routing theo tiêu chí nào?", opts:["Chỉ theo IP nguồn", "Theo path hoặc host trong request", "Chỉ theo thời gian trong ngày", "Không hỗ trợ routing thông minh"], correct:1, explain:"Path-based và host-based routing là tính năng nổi bật của ALB."},
{q:"Classic Load Balancer (CLB) so với ALB/NLB thế nào?", opts:["CLB mới hơn và nên ưu tiên dùng", "CLB là thế hệ cũ, ít dùng cho ứng dụng mới", "CLB nhanh hơn cả 2 loại kia", "CLB không tồn tại"], correct:1, explain:"CLB là generation cũ, AWS khuyến nghị dùng ALB/NLB cho ứng dụng mới."},
{q:"Load Balancer giúp ích gì cho độ sẵn sàng hệ thống?", opts:["Không giúp ích gì", "Phân phối traffic đến nhiều instance, tránh single point of failure", "Chỉ giúp tăng tốc độ mạng", "Chỉ dùng để giảm chi phí"], correct:1, explain:"Phân tán traffic là cách cơ bản để tăng độ sẵn sàng, tránh phụ thuộc 1 instance duy nhất."},
{q:"Traffic vào ALB sau đó được chuyển tiếp đến đâu?", opts:["Trực tiếp đến internet", "Đến Target Group chứa các target cụ thể", "Đến IAM", "Đến CloudTrail"], correct:1, explain:"ALB luôn định tuyến traffic đến Target Group đã cấu hình."},
{q:"Vì sao ALB phù hợp với kiến trúc microservices?", opts:["Không liên quan gì đến microservices", "Hỗ trợ routing theo path đến nhiều service khác nhau qua nhiều Target Group", "ALB chỉ hỗ trợ 1 service duy nhất", "ALB không hỗ trợ container"], correct:1, explain:"Khả năng định tuyến linh hoạt theo path/host rất phù hợp kiến trúc nhiều service nhỏ."},
{q:"Gateway Load Balancer dùng cho mục đích gì?", opts:["Chỉ dùng cho web app thông thường", "Triển khai và quản lý các thiết bị ảo bảo mật mạng bên thứ 3 (firewall...)", "Thay thế hoàn toàn ALB", "Không tồn tại loại này"], correct:1, explain:"Gateway Load Balancer là loại chuyên biệt cho các appliance mạng/bảo mật."},
{q:"DNS name của ALB dùng để làm gì?", opts:["Địa chỉ IP cố định duy nhất", "Điểm truy cập để client kết nối đến Load Balancer", "Chỉ dùng nội bộ VPC", "Không có tác dụng thực tế"], correct:1, explain:"Client truy cập ứng dụng thông qua DNS name của ALB, được phân giải sang nhiều IP."},
{q:"1 ALB có thể phục vụ nhiều ứng dụng khác nhau không?", opts:["Không, chỉ phục vụ 1 ứng dụng duy nhất", "Có, qua nhiều Target Group và routing rule khác nhau", "Chỉ NLB mới làm được điều này", "Cần tạo riêng 1 ALB cho mỗi ứng dụng bắt buộc"], correct:1, explain:"1 ALB có thể định tuyến đến nhiều Target Group phục vụ nhiều ứng dụng/service khác nhau."},
]},
{label:'Thứ 3', title:'Target Group & Health Check', content:'Target Group là nhóm các target mà Load Balancer phân phối traffic đến — 1 ALB có thể có nhiều Target Group, mỗi group ứng với 1 routing rule khác nhau. Health Check định kỳ kiểm tra tình trạng từng target (thường bằng HTTP request đến 1 path cụ thể như /health) — target không phản hồi đúng sẽ bị đánh dấu \"unhealthy\" và tạm thời loại khỏi danh sách nhận traffic. Cấu hình Health Check gồm: Interval, Timeout, Healthy/Unhealthy threshold.', exercises:["Xem Target Group hiện tại của ALB, kiểm tra trạng thái Health Check của từng target.","Thử dừng 1 EC2 instance trong Target Group, quan sát nó chuyển sang unhealthy và bị loại khỏi traffic.","Cấu hình lại Health Check path thành 1 endpoint cụ thể (ví dụ /health) thay vì mặc định \"/\".","Tìm hiểu ý nghĩa của Healthy Threshold và Unhealthy Threshold, thử đổi giá trị và quan sát tác động.","Khởi động lại instance vừa dừng, quan sát nó tự động chuyển về healthy và nhận traffic trở lại."], quiz:[
{q:"Target Group dùng để làm gì?", opts:["Lưu trữ dữ liệu", "Nhóm các target mà Load Balancer phân phối traffic đến", "Quản lý IAM", "Tạo VPC"], correct:1, explain:"Target Group là đơn vị tổ chức các target nhận traffic từ Load Balancer."},
{q:"Health Check giúp ích gì?", opts:["Không có tác dụng gì", "Phát hiện target không phản hồi đúng và tạm loại khỏi traffic", "Mã hóa dữ liệu", "Tăng tốc độ mạng"], correct:1, explain:"Health Check đảm bảo traffic chỉ đi đến các target đang hoạt động tốt."},
{q:"Khi 1 target bị đánh dấu unhealthy, điều gì xảy ra?", opts:["Bị xóa vĩnh viễn khỏi Target Group", "Tạm thời không nhận traffic cho đến khi khỏe lại", "Không có gì thay đổi", "Toàn bộ hệ thống dừng hoạt động"], correct:1, explain:"Target unhealthy chỉ tạm thời loại khỏi traffic, có thể tự phục hồi khi healthy trở lại."},
{q:"Healthy Threshold nghĩa là gì?", opts:["Không có ý nghĩa cụ thể", "Số lần kiểm tra thành công liên tiếp để coi target là healthy", "Số lượng target tối đa", "Thời gian chờ tối đa"], correct:1, explain:"Đây là ngưỡng số lần check thành công liên tiếp cần đạt để chuyển trạng thái."},
{q:"Health Check path mặc định thường là gì nếu không cấu hình riêng?", opts:["/health", "/", "/status", "/api"], correct:1, explain:"Mặc định Health Check thường kiểm tra path gốc \"/\" nếu không chỉ định khác."},
{q:"Interval trong Health Check là gì?", opts:["Thời gian chờ phản hồi tối đa", "Tần suất (khoảng thời gian) giữa các lần kiểm tra", "Số lượng target", "Không có ý nghĩa"], correct:1, explain:"Interval quyết định bao lâu thực hiện 1 lần kiểm tra health check."},
{q:"Timeout trong Health Check là gì?", opts:["Tần suất kiểm tra", "Thời gian tối đa chờ phản hồi trước khi coi là thất bại", "Số lượng instance", "Không liên quan đến health check"], correct:1, explain:"Timeout xác định giới hạn thời gian chờ phản hồi cho mỗi lần kiểm tra."},
{q:"Vì sao nên dùng 1 endpoint riêng (như /health) thay vì path gốc cho Health Check?", opts:["Không có lý do gì", "Endpoint riêng có thể kiểm tra sâu hơn tình trạng ứng dụng (database, dependency...)", "Path gốc luôn lỗi", "Bắt buộc theo quy định AWS"], correct:1, explain:"Endpoint /health chuyên biệt có thể kiểm tra kỹ hơn tình trạng thực sự của ứng dụng."},
{q:"Khi instance vừa unhealthy được khởi động lại và khỏe mạnh, nó có tự động nhận traffic trở lại không?", opts:["Không bao giờ tự động", "Có, sau khi vượt qua Healthy Threshold trong các lần check tiếp theo", "Cần xóa và tạo lại Target Group", "Chỉ nhận traffic nếu restart cả ALB"], correct:1, explain:"Hệ thống Health Check tự động phát hiện và khôi phục trạng thái nhận traffic."},
{q:"1 Target Group có thể chứa loại target nào?", opts:["Chỉ EC2 instance", "EC2, IP, hoặc Lambda function", "Chỉ container", "Chỉ RDS"], correct:1, explain:"Target Group linh hoạt hỗ trợ nhiều loại target khác nhau."},
]},
{label:'Thứ 4', title:'Auto Scaling Group cơ bản', content:'Auto Scaling Group (ASG) tự động điều chỉnh số lượng EC2 instance dựa trên Launch Template (định nghĩa AMI, instance type, Security Group dùng để tạo instance mới). ASG có 3 thông số cốt lõi: Minimum (số instance tối thiểu luôn duy trì), Desired Capacity (số instance mong muốn hiện tại), Maximum (số instance tối đa cho phép scale lên). ASG tự động thay thế instance bị lỗi để duy trì Desired Capacity — cơ chế tự phục hồi (self-healing) quan trọng.', exercises:["Tạo 1 Launch Template định nghĩa AMI + instance type cho web server đã dùng trước đó.","Tạo Auto Scaling Group từ Launch Template, đặt Min=2, Desired=2, Max=4.","Thử terminate thủ công 1 instance trong ASG, quan sát ASG tự động tạo instance mới để duy trì Desired Capacity.","Gắn ASG vừa tạo với Target Group của ALB ở bài trước, xác nhận instance mới tự động được thêm vào Load Balancer.","Viết giải thích bằng lời của bạn về sự khác biệt giữa Minimum, Desired, và Maximum trong ASG."], quiz:[
{q:"Trong ASG, Desired Capacity nghĩa là gì?", opts:["Số instance tối đa", "Số instance hiện đang mong muốn duy trì", "Số instance tối thiểu tuyệt đối", "Không có ý nghĩa cụ thể"], correct:1, explain:"Desired Capacity là số lượng instance ASG cố gắng duy trì tại một thời điểm."},
{q:"Khi 1 instance trong ASG bị lỗi/terminate, điều gì xảy ra?", opts:["Không có gì xảy ra", "ASG tự động tạo instance mới để duy trì Desired Capacity", "Toàn bộ ASG dừng hoạt động", "Phải tạo lại thủ công"], correct:1, explain:"Đây là cơ chế self-healing đặc trưng của Auto Scaling Group."},
{q:"Launch Template dùng để định nghĩa gì cho ASG?", opts:["Chỉ số lượng instance", "AMI, instance type, Security Group dùng để tạo instance mới", "Chỉ giá cả", "Chỉ Region"], correct:1, explain:"Launch Template là khuôn mẫu để ASG biết cách tạo instance mới."},
{q:"Minimum trong ASG có ý nghĩa gì?", opts:["Số instance tối đa cho phép", "Số instance tối thiểu luôn phải duy trì", "Không có ý nghĩa gì", "Số instance mong muốn hiện tại"], correct:1, explain:"Minimum đảm bảo luôn có ít nhất số lượng instance này chạy."},
{q:"Maximum trong ASG có ý nghĩa gì?", opts:["Số instance tối thiểu", "Giới hạn trên cho số instance ASG được phép scale lên", "Không có tác dụng", "Số instance mặc định ban đầu"], correct:1, explain:"Maximum ngăn ASG scale vượt quá giới hạn, kiểm soát chi phí."},
{q:"ASG có thể tự động thay thế instance bị lỗi Health Check không?", opts:["Không, cần can thiệp thủ công", "Có, đây là tính năng tự phục hồi mặc định", "Chỉ khi bật tính năng trả phí thêm", "Chỉ với Aurora"], correct:1, explain:"Tự động thay thế instance lỗi là hành vi mặc định của ASG."},
{q:"ASG gắn với Target Group của ALB để làm gì?", opts:["Không có mối liên hệ nào", "Để instance mới tự động được thêm vào nhận traffic từ Load Balancer", "Chỉ để hiển thị thông tin", "Để tính chi phí"], correct:1, explain:"Kết hợp ASG với Target Group giúp instance mới tự động tham gia phục vụ traffic ngay."},
{q:"Nếu Desired Capacity thay đổi thủ công (ví dụ tăng lên), ASG sẽ làm gì?", opts:["Không phản ứng gì", "Tự động tạo thêm instance để đạt Desired Capacity mới", "Xóa hết instance hiện tại", "Báo lỗi"], correct:1, explain:"ASG luôn cố gắng đưa số instance thực tế khớp với Desired Capacity."},
{q:"Launch Template có thể tái sử dụng cho nhiều ASG khác nhau không?", opts:["Không, mỗi ASG cần Launch Template riêng", "Có, có thể dùng chung 1 Launch Template cho nhiều ASG", "Chỉ dùng được 1 lần duy nhất", "Không liên quan đến ASG"], correct:1, explain:"Launch Template có thể tái sử dụng linh hoạt cho nhiều Auto Scaling Group."},
{q:"Vì sao ASG là thành phần quan trọng trong kiến trúc chịu tải cao?", opts:["Không quan trọng lắm", "Tự động điều chỉnh số lượng tài nguyên theo tải thực tế, vừa đảm bảo hiệu năng vừa tối ưu chi phí", "Chỉ giúp giảm chi phí", "Chỉ giúp tăng bảo mật"], correct:1, explain:"ASG cân bằng cả hiệu năng và chi phí bằng cách scale linh hoạt theo nhu cầu thực tế."},
]},
{label:'Thứ 5', title:'Scaling Policy & CloudWatch Alarm', content:'Scaling Policy định nghĩa QUY TẮC để ASG tự động tăng/giảm Desired Capacity, phổ biến nhất là Target Tracking (giữ 1 metric ở mức mục tiêu, ví dụ CPU trung bình 50%). CloudWatch Alarm giám sát metric và kích hoạt hành động khi vượt ngưỡng — có thể dùng làm trigger cho Scaling Policy dạng Step Scaling. Kết hợp ASG + Scaling Policy + CloudWatch tạo thành hệ thống tự động co giãn theo tải thực tế, tối ưu cả hiệu năng lẫn chi phí.', exercises:["Tạo 1 Target Tracking Scaling Policy giữ CPU trung bình ở mức 50% cho ASG đã tạo.","Giả lập tải cao trên 1 instance, quan sát ASG tự động scale up.","Xem CloudWatch Alarm được tự động tạo ra khi thiết lập Scaling Policy, đọc hiểu ngưỡng và hành động của nó.","Sau khi tải giảm, quan sát ASG tự động scale down về gần Desired Capacity ban đầu.","Tìm hiểu Cooldown Period trong Auto Scaling dùng để làm gì."], quiz:[
{q:"Target Tracking Scaling Policy hoạt động dựa trên nguyên tắc gì?", opts:["Ngẫu nhiên", "Giữ 1 metric ở mức mục tiêu, tự tính số instance cần thiết", "Chỉ scale theo giờ cố định", "Không tự động"], correct:1, explain:"Target Tracking tự động điều chỉnh để giữ metric (như CPU) ở mức mục tiêu đã đặt."},
{q:"CloudWatch Alarm dùng để làm gì trong bối cảnh Auto Scaling?", opts:["Lưu trữ log", "Giám sát metric và kích hoạt hành động khi vượt ngưỡng", "Tạo Security Group", "Quản lý DNS"], correct:1, explain:"CloudWatch Alarm là cơ chế trigger cho các hành động scaling."},
{q:"Cooldown Period trong Auto Scaling có tác dụng gì?", opts:["Không có tác dụng", "Tránh việc scale liên tục quá nhanh, cho hệ thống thời gian ổn định", "Tăng tốc độ scale", "Giảm chi phí Load Balancer"], correct:1, explain:"Cooldown ngăn ASG phản ứng thái quá với biến động ngắn hạn."},
{q:"Step Scaling khác Target Tracking ở điểm nào?", opts:["Không khác gì", "Step Scaling tăng/giảm theo bậc cụ thể dựa trên ngưỡng CloudWatch Alarm, không tự động tính toán như Target Tracking", "Step Scaling nhanh hơn luôn", "Target Tracking không dùng CloudWatch"], correct:1, explain:"Step Scaling yêu cầu định nghĩa các bậc scale cụ thể, khác cơ chế tự tính của Target Tracking."},
{q:"Metric phổ biến nhất dùng cho Target Tracking Scaling là gì?", opts:["Chỉ có thể dùng metric tùy chỉnh", "CPU Utilization trung bình", "Số lượng IAM User", "Dung lượng ổ đĩa S3"], correct:1, explain:"CPU Utilization là metric phổ biến nhất, dễ hiểu và dễ áp dụng."},
{q:"Nếu không có Cooldown Period, điều gì có thể xảy ra?", opts:["Không có vấn đề gì", "ASG có thể scale up/down liên tục (thrashing) gây lãng phí và bất ổn định", "Hệ thống sẽ nhanh hơn", "Chi phí luôn giảm"], correct:1, explain:"Thiếu Cooldown có thể gây hiện tượng scale liên tục không cần thiết."},
{q:"CloudWatch Alarm được tự động tạo khi thiết lập Target Tracking Policy phải không?", opts:["Không, cần tạo alarm thủ công riêng", "Đúng, AWS tự động tạo alarm tương ứng khi cấu hình Target Tracking", "Không liên quan đến CloudWatch", "Chỉ dùng cho Step Scaling"], correct:1, explain:"Target Tracking tự động sinh ra CloudWatch Alarm cần thiết phía sau."},
{q:"Sau khi tải giảm, ASG sẽ làm gì theo mặc định?", opts:["Giữ nguyên số instance mãi mãi", "Tự động scale down về gần Desired Capacity phù hợp với tải mới", "Xóa hết ASG", "Tăng thêm instance"], correct:1, explain:"ASG tự động điều chỉnh giảm khi tải không còn cao, tối ưu chi phí."},
{q:"Scaling Policy giúp tối ưu điều gì?", opts:["Chỉ tối ưu bảo mật", "Cân bằng giữa hiệu năng (đủ tài nguyên khi cần) và chi phí (không dư thừa khi không cần)", "Chỉ tối ưu tốc độ mạng", "Không có tác dụng tối ưu"], correct:1, explain:"Đây là mục tiêu cốt lõi của Scaling Policy: cân bằng hiệu năng-chi phí."},
{q:"Giả lập tải cao để test Scaling Policy có phải cách hợp lý để kiểm tra không?", opts:["Không nên làm vậy bao giờ", "Có, đây là cách thực tế để xác nhận hệ thống scale đúng như thiết kế", "Chỉ nên test trên production thật", "Không cần test trước khi triển khai"], correct:1, explain:"Load testing là bước quan trọng để xác nhận Scaling Policy hoạt động đúng."},
]},
{label:'Thứ 6', title:'Tổng kết tuần 6', content:'Kết hợp ALB + ASG + CloudWatch là kiến trúc \"chuẩn vàng\" cho ứng dụng web scale được trên AWS — pattern gần như chắc chắn xuất hiện trong các câu hỏi thiết kế của đề thi SAA. Nắm vững luồng hoạt động: traffic vào ALB → phân phối đến Target Group → CloudWatch giám sát metric → Scaling Policy điều chỉnh ASG khi cần → instance mới tự động join Target Group.', exercises:["Vẽ sơ đồ đầy đủ luồng traffic qua ALB → Target Group → ASG → CloudWatch → Scaling Policy.","Viết lại từ trí nhớ ý nghĩa của Min/Desired/Max trong ASG, tự kiểm tra độ chính xác.","Xóa Scaling Policy test, đặt ASG về Desired=1 để tiết kiệm chi phí trước khi nghỉ.","Ước tính chi phí chạy 2-4 EC2 instance liên tục 1 tháng bằng AWS Pricing Calculator.","Viết 3 tình huống thực tế mà kiến trúc ALB+ASG sẽ phát huy tác dụng rõ rệt nhất."], quiz:[
{q:"Chủ đề trọng tâm tuần 6 tháng 2 là gì?", opts:["RDS và database", "Load Balancer (ALB/NLB) và Auto Scaling Group", "S3 storage", "IAM và bảo mật"], correct:1, explain:"Tuần 6 tập trung vào kiến trúc chịu tải cao với ALB và ASG."},
{q:"Luồng traffic chuẩn trong kiến trúc ALB+ASG là gì?", opts:["Không có luồng cố định", "Traffic → ALB → Target Group → EC2 instance (trong ASG)", "Traffic đi thẳng vào từng EC2", "Traffic qua RDS trước"], correct:1, explain:"Đây là luồng chuẩn của kiến trúc web application chịu tải cao trên AWS."},
{q:"Vì sao ALB+ASG là pattern phổ biến trong đề thi SAA?", opts:["Không phổ biến lắm", "Vì đây là kiến trúc nền tảng cho hầu hết ứng dụng web cần độ sẵn sàng và khả năng scale cao", "Chỉ vì dễ nhớ", "Không có lý do đặc biệt"], correct:1, explain:"Đây là kiến trúc cơ bản và quan trọng nhất cho web application trên AWS."},
{q:"CloudWatch đóng vai trò gì trong kiến trúc ALB+ASG?", opts:["Không có vai trò gì", "Giám sát metric để kích hoạt Scaling Policy điều chỉnh ASG", "Chỉ lưu trữ log tĩnh", "Thay thế Load Balancer"], correct:1, explain:"CloudWatch là mắt xích giám sát kết nối giữa tải thực tế và hành động scaling."},
{q:"Instance mới do ASG tạo ra có tự động join Target Group không?", opts:["Không bao giờ, cần thêm thủ công", "Có, nếu ASG đã được gắn với Target Group từ trước", "Chỉ join nếu restart ALB", "Không liên quan đến Target Group"], correct:1, explain:"Khi đã gắn ASG với Target Group, instance mới tự động được thêm vào."},
{q:"Vì sao nên dọn dẹp Scaling Policy/ASG test sau khi học xong?", opts:["Không cần thiết", "Tránh phát sinh chi phí không cần thiết khi các instance vẫn tiếp tục chạy", "Chỉ để gọn gàng Console", "Không có lý do liên quan chi phí"], correct:1, explain:"EC2 instance chạy liên tục sẽ tính phí, nên dọn dẹp tài nguyên test là cần thiết."},
{q:"Kiến trúc ALB+ASG phù hợp nhất với tình huống nào?", opts:["Ứng dụng có traffic hoàn toàn cố định, không đổi", "Ứng dụng có traffic biến động, cần scale tự động và độ sẵn sàng cao", "Chỉ ứng dụng nội bộ nhỏ", "Chỉ ứng dụng tĩnh không cần server"], correct:1, explain:"Traffic biến động và yêu cầu độ sẵn sàng cao là lý do chính để dùng ALB+ASG."},
{q:"Min/Desired/Max của ASG nên được thiết lập dựa trên yếu tố gì?", opts:["Ngẫu nhiên không cần tính toán", "Dự đoán tải thực tế và ngân sách chi phí cho phép", "Chỉ dựa vào sở thích cá nhân", "Luôn đặt giá trị cao nhất có thể"], correct:1, explain:"Các thông số này cần cân nhắc kỹ dựa trên đặc điểm tải và ngân sách."},
{q:"Sau tuần 6, kiến thức nào là quan trọng nhất cần ghi nhớ?", opts:["Chỉ cần nhớ giá cả dịch vụ", "Luồng hoạt động đầy đủ: ALB → Target Group → ASG → CloudWatch → Scaling Policy", "Chỉ cần nhớ tên các dịch vụ", "Không có kiến thức trọng tâm nào"], correct:1, explain:"Hiểu rõ luồng liên kết giữa các thành phần là kiến thức cốt lõi của tuần này."},
{q:"Kiến trúc ALB+ASG có giúp giảm thiểu downtime khi 1 instance gặp sự cố không?", opts:["Không giúp ích gì", "Có, vì traffic tự động chuyển sang các instance khác vẫn khỏe mạnh", "Chỉ giúp tăng tốc độ", "Chỉ áp dụng cho NLB"], correct:1, explain:"Đây chính là lợi ích cốt lõi của việc phân phối tải qua Load Balancer kết hợp Auto Scaling."},
]},
]},
{title:"Route 53 & CloudFront", points:["Route 53 là dịch vụ DNS của AWS, chuyển đổi tên miền thành địa chỉ IP, hỗ trợ nhiều routing policy.","CloudFront là dịch vụ CDN, cache nội dung tại các edge location gần người dùng để giảm độ trễ.","Kết hợp CloudFront + S3 là pattern phổ biến để host và phân phối nội dung tĩnh hiệu quả toàn cầu.","Origin trong CloudFront là nguồn dữ liệu gốc (S3 bucket, EC2, ALB...) mà CloudFront lấy nội dung để cache.","TTL quyết định thời gian CloudFront giữ cache trước khi lấy lại dữ liệu mới từ origin."], practice:"Tạo 1 CloudFront distribution trỏ đến S3 bucket static website đã tạo ở tuần 3, so sánh tốc độ tải trước/sau khi qua CDN.", case:"CloudFront giúp giảm đáng kể chi phí và độ trễ khi phục vụ người dùng ở nhiều khu vực địa lý khác nhau.", task:"Cấu hình Route 53 để trỏ 1 tên miền (hoặc subdomain miễn phí) tới CloudFront distribution vừa tạo.", days:[
{label:'Thứ 2', title:'Route 53 cơ bản & Routing Policy', content:'Route 53 là dịch vụ DNS được quản lý của AWS, chuyển đổi tên miền thành địa chỉ IP. Route 53 hỗ trợ nhiều Routing Policy: Simple (1 tên miền trỏ 1 địa chỉ cố định), Weighted (phân phối traffic theo tỷ lệ phần trăm giữa nhiều đích, hữu ích cho A/B testing), Latency-based (trỏ đến Region có độ trễ thấp nhất), Failover (tự động chuyển sang backup nếu primary không phản hồi Health Check). Hosted Zone là nơi chứa các bản ghi DNS cho 1 tên miền — có Public Hosted Zone và Private Hosted Zone (chỉ dùng nội bộ VPC).', exercises:["Tìm hiểu các loại DNS record cơ bản: A (trỏ IP), CNAME (trỏ tên miền khác), Alias (đặc biệt của Route 53).","Nếu có sẵn 1 domain, tạo 1 Hosted Zone trong Route 53.","Đọc về Weighted Routing Policy, hình dung 1 tình huống thực tế dùng nó (ví dụ triển khai dần phiên bản mới).","Tìm hiểu Failover Routing Policy hoạt động dựa trên Health Check thế nào.","So sánh Public Hosted Zone và Private Hosted Zone, khi nào nên dùng loại nào."], quiz:[
{q:"Route 53 là dịch vụ gì?", opts:["CDN", "DNS được quản lý", "Database", "Load Balancer"], correct:1, explain:"Route 53 là dịch vụ DNS được AWS quản lý hoàn toàn."},
{q:"Weighted Routing Policy dùng để làm gì?", opts:["Chỉ trỏ 1 địa chỉ cố định", "Phân phối traffic theo tỷ lệ % giữa nhiều đích", "Chỉ dùng cho email", "Không tồn tại"], correct:1, explain:"Weighted Policy phù hợp cho A/B testing hoặc triển khai dần phiên bản mới."},
{q:"Alias record trong Route 53 khác gì CNAME thông thường?", opts:["Không có khác biệt", "Alias là loại đặc biệt của Route 53, có thể trỏ trực tiếp đến tài nguyên AWS (như CloudFront/ALB) mà không tốn thêm chi phí truy vấn", "CNAME nhanh hơn Alias", "Alias chỉ dùng cho email"], correct:1, explain:"Alias là tính năng độc quyền của Route 53, tối ưu cho việc trỏ đến tài nguyên AWS."},
{q:"Failover Routing Policy hoạt động dựa trên gì?", opts:["Ngẫu nhiên", "Health Check để tự động chuyển sang backup khi primary lỗi", "Giá cả", "Không hoạt động tự động"], correct:1, explain:"Failover Policy giám sát Health Check để quyết định route đến primary hay secondary."},
{q:"Latency-based Routing Policy tối ưu điều gì?", opts:["Chi phí thấp nhất", "Độ trễ thấp nhất bằng cách trỏ đến Region gần người dùng nhất", "Bảo mật cao nhất", "Không tối ưu gì cả"], correct:1, explain:"Latency-based routing chọn endpoint có độ trễ mạng thấp nhất cho người dùng."},
{q:"Public Hosted Zone khác Private Hosted Zone thế nào?", opts:["Không khác gì", "Public Hosted Zone phân giải DNS công khai trên internet; Private chỉ dùng nội bộ trong VPC", "Private Hosted Zone nhanh hơn", "Public Hosted Zone miễn phí, Private thì không"], correct:1, explain:"Phạm vi truy cập là điểm khác biệt cốt lõi giữa 2 loại Hosted Zone."},
{q:"Hosted Zone dùng để làm gì?", opts:["Lưu trữ file tĩnh", "Chứa các bản ghi DNS cho 1 tên miền cụ thể", "Chạy Lambda function", "Quản lý IAM User"], correct:1, explain:"Hosted Zone là container chứa toàn bộ record DNS của 1 domain."},
{q:"A record trong DNS dùng để làm gì?", opts:["Trỏ tên miền đến 1 tên miền khác", "Trỏ tên miền đến 1 địa chỉ IP cụ thể", "Chỉ dùng cho email", "Không có tác dụng thực tế"], correct:1, explain:"A record là loại bản ghi DNS cơ bản nhất, trỏ trực tiếp đến địa chỉ IPv4."},
{q:"CNAME record dùng để làm gì?", opts:["Trỏ trực tiếp đến IP", "Trỏ tên miền này đến 1 tên miền khác (alias dạng chuẩn DNS)", "Chỉ dùng cho DNS nội bộ", "Không tồn tại trong DNS"], correct:1, explain:"CNAME ánh xạ 1 tên miền sang 1 tên miền khác, khác Alias độc quyền của Route 53."},
{q:"Simple Routing Policy phù hợp khi nào?", opts:["Khi cần cân bằng tải phức tạp", "Khi chỉ có 1 tài nguyên duy nhất, không cần logic routing đặc biệt", "Chỉ dùng cho Disaster Recovery", "Không bao giờ nên dùng"], correct:1, explain:"Simple Policy là lựa chọn cơ bản nhất, phù hợp tình huống đơn giản không cần logic phức tạp."},
]},
{label:'Thứ 3', title:'CloudFront cơ bản & Edge Location', content:'CloudFront là mạng phân phối nội dung (CDN) của AWS, cache nội dung tại các Edge Location gần người dùng trên toàn cầu để giảm độ trễ và tải cho origin server. Khi người dùng request nội dung, CloudFront kiểm tra Edge Location gần nhất có cache chưa — nếu có (cache hit) trả về ngay, nếu chưa (cache miss) mới lấy từ Origin rồi cache lại. Distribution là cấu hình CloudFront gắn với 1 Origin cụ thể (S3, EC2, ALB, hoặc server bên ngoài AWS). CloudFront còn có thể tích hợp AWS WAF để chống tấn công web.', exercises:["Đọc về khái niệm Edge Location, tìm xem AWS có bao nhiêu Edge Location gần Việt Nam nhất.","Tìm hiểu sự khác biệt giữa cache hit và cache miss, tác động của nó đến tốc độ tải trang.","Xem lại CloudFront distribution đã tạo ở tháng 1 (nếu còn), kiểm tra Origin đang trỏ đến đâu.","Tìm hiểu TTL trong CloudFront ảnh hưởng thế nào đến tần suất lấy dữ liệu mới từ Origin.","Đọc về khả năng tích hợp CloudFront với AWS WAF để chống tấn công, ghi chú lại lợi ích chính."], quiz:[
{q:"CloudFront là dịch vụ gì?", opts:["DNS", "Content Delivery Network (CDN)", "Database", "IAM"], correct:1, explain:"CloudFront là dịch vụ CDN của AWS."},
{q:"Edge Location dùng để làm gì?", opts:["Lưu trữ dữ liệu vĩnh viễn", "Cache nội dung gần người dùng để giảm độ trễ", "Chạy code Lambda", "Quản lý domain"], correct:1, explain:"Edge Location là các điểm phân phối nội dung gần người dùng trên toàn cầu."},
{q:"Cache hit nghĩa là gì?", opts:["Nội dung chưa có trong cache, phải lấy từ Origin", "Nội dung đã có sẵn trong cache, trả về ngay không cần gọi Origin", "Lỗi hệ thống", "Không liên quan đến CDN"], correct:1, explain:"Cache hit là khi Edge Location đã có sẵn nội dung, phục vụ nhanh không cần gọi Origin."},
{q:"Cache miss xảy ra khi nào?", opts:["Khi nội dung đã có sẵn trong cache", "Khi nội dung chưa có trong cache tại Edge Location, cần lấy từ Origin", "Khi CloudFront bị lỗi", "Không bao giờ xảy ra"], correct:1, explain:"Cache miss buộc CloudFront phải lấy dữ liệu mới từ Origin, chậm hơn cache hit."},
{q:"TTL trong CloudFront quyết định điều gì?", opts:["Tốc độ mạng", "Thời gian giữ cache trước khi lấy lại dữ liệu mới từ Origin", "Số lượng Edge Location", "Chi phí dịch vụ"], correct:1, explain:"TTL kiểm soát tần suất CloudFront làm mới cache từ Origin."},
{q:"Origin trong CloudFront là gì?", opts:["Chỉ có thể là S3", "Nguồn dữ liệu gốc mà CloudFront lấy nội dung để cache (S3, EC2, ALB...)", "Tên gọi khác của Edge Location", "Không có khái niệm Origin"], correct:1, explain:"Origin là nguồn cung cấp nội dung gốc cho CloudFront cache."},
{q:"Distribution trong CloudFront là gì?", opts:["Loại chứng chỉ SSL", "Cấu hình CloudFront gắn với 1 Origin cụ thể", "Loại Routing Policy", "Tên gọi khác của VPC"], correct:1, explain:"Distribution là đơn vị cấu hình chính của CloudFront, định nghĩa Origin và các quy tắc cache."},
{q:"AWS WAF khi tích hợp với CloudFront giúp ích gì?", opts:["Không có tác dụng gì", "Bảo vệ ứng dụng khỏi các cuộc tấn công web phổ biến (SQL injection, XSS...)", "Tăng tốc độ mạng", "Giảm chi phí lưu trữ"], correct:1, explain:"WAF cung cấp thêm lớp bảo vệ chống tấn công ở tầng ứng dụng."},
{q:"Vì sao CloudFront giúp giảm tải cho Origin server?", opts:["Không giúp giảm tải gì cả", "Vì phần lớn request được phục vụ từ cache tại Edge Location, không cần gọi đến Origin mỗi lần", "CloudFront chỉ chuyển tiếp mọi request đến Origin", "CloudFront không liên quan đến Origin"], correct:1, explain:"Caching hiệu quả giúp giảm đáng kể số lượng request thực sự đến Origin."},
{q:"CloudFront có phải là dịch vụ toàn cầu (global) không?", opts:["Không, chỉ hoạt động trong 1 Region", "Có, phân phối nội dung qua mạng lưới Edge Location trên toàn cầu", "Chỉ hoạt động ở Mỹ", "Không rõ phạm vi hoạt động"], correct:1, explain:"CloudFront là dịch vụ toàn cầu với mạng lưới Edge Location phủ khắp thế giới."},
]},
{label:'Thứ 4', title:'CloudFront + S3 kết hợp', content:'Kết hợp CloudFront + S3 là pattern rất phổ biến để phân phối nội dung tĩnh hiệu quả toàn cầu — S3 lưu trữ gốc, CloudFront cache và phân phối gần người dùng. Origin Access Control (OAC) đảm bảo S3 bucket CHỈ cho phép CloudFront truy cập, không cho truy cập trực tiếp từ internet — tăng bảo mật đáng kể so với để bucket public hoàn toàn. Cấu hình này giúp: giảm chi phí data transfer từ S3, tăng tốc độ tải toàn cầu, và ẩn địa chỉ S3 gốc khỏi người dùng cuối.', exercises:["Cấu hình Origin Access Control (OAC) cho CloudFront distribution trỏ đến S3 bucket của bạn.","Sau khi bật OAC, thử truy cập trực tiếp URL S3 (không qua CloudFront), xác nhận bị từ chối truy cập.","Truy cập nội dung qua URL CloudFront, xác nhận vẫn tải được bình thường.","So sánh tốc độ tải 1 file ảnh qua CloudFront so với truy cập trực tiếp S3 (nếu có thể đo được).","Viết giải thích lý do vì sao nên dùng OAC thay vì để S3 bucket public hoàn toàn."], quiz:[
{q:"Origin Access Control (OAC) giúp ích gì khi kết hợp CloudFront + S3?", opts:["Không có tác dụng gì", "Đảm bảo S3 chỉ cho phép CloudFront truy cập, không public trực tiếp", "Tăng tốc độ mạng", "Mã hóa domain"], correct:1, explain:"OAC là cơ chế bảo mật giới hạn truy cập S3 chỉ qua CloudFront."},
{q:"Sau khi bật OAC, truy cập trực tiếp URL S3 sẽ thế nào?", opts:["Vẫn truy cập bình thường", "Bị từ chối truy cập (Access Denied)", "Tự động chuyển hướng sang CloudFront", "Xóa luôn dữ liệu"], correct:1, explain:"OAC chặn truy cập trực tiếp, chỉ cho phép CloudFront lấy dữ liệu."},
{q:"OAC là phiên bản thay thế của cơ chế cũ nào?", opts:["IAM Role", "OAI (Origin Access Identity)", "Security Group", "VPC Peering"], correct:1, explain:"OAC là phiên bản mới, khuyến nghị thay thế cho OAI cũ."},
{q:"Vì sao kết hợp CloudFront + S3 giúp giảm chi phí data transfer?", opts:["Không giúp giảm chi phí gì", "Traffic qua CloudFront thường có mức giá data transfer ưu đãi hơn so với truy cập trực tiếp S3", "CloudFront miễn phí hoàn toàn", "S3 tính phí cao hơn khi có CloudFront"], correct:1, explain:"AWS thường có mức giá ưu đãi hơn cho traffic đi qua CloudFront so với S3 trực tiếp."},
{q:"Nếu để S3 bucket public hoàn toàn thay vì dùng OAC, rủi ro là gì?", opts:["Không có rủi ro gì", "Bất kỳ ai cũng có thể truy cập trực tiếp dữ liệu, bỏ qua lớp bảo vệ và cache của CloudFront", "Chỉ ảnh hưởng đến tốc độ", "Chỉ ảnh hưởng đến chi phí"], correct:1, explain:"Public bucket mất đi lớp kiểm soát truy cập quan trọng mà OAC cung cấp."},
{q:"Việc kết hợp CloudFront + S3 phù hợp nhất cho loại nội dung nào?", opts:["Nội dung động thay đổi liên tục theo user", "Nội dung tĩnh như ảnh, video, file website", "Chỉ dữ liệu database", "Chỉ email"], correct:1, explain:"Nội dung tĩnh là trường hợp sử dụng lý tưởng nhất cho pattern CloudFront+S3."},
{q:"CloudFront có thể phục vụ nội dung ngay cả khi Origin S3 tạm thời không khả dụng không?", opts:["Không bao giờ có thể", "Có thể trong 1 khoảng thời gian nếu nội dung đã có sẵn trong cache (tùy cấu hình)", "Luôn báo lỗi ngay lập tức", "Không liên quan đến cache"], correct:1, explain:"Với cấu hình phù hợp, cache vẫn có thể phục vụ dù Origin gặp sự cố tạm thời."},
{q:"Ẩn địa chỉ S3 gốc khỏi người dùng cuối mang lại lợi ích gì?", opts:["Không có lợi ích gì", "Giảm khả năng bị tấn công trực tiếp vào bucket, tăng bảo mật tổng thể", "Chỉ để trang trí", "Làm chậm tốc độ truy cập"], correct:1, explain:"Che giấu địa chỉ gốc là 1 lớp bảo mật bổ sung, giảm bề mặt tấn công."},
{q:"Khi nào nên cân nhắc KHÔNG dùng CloudFront trước S3?", opts:["Luôn luôn nên dùng CloudFront trong mọi trường hợp", "Khi nội dung thay đổi cực kỳ thường xuyên và không có lợi ích cache đáng kể", "Không bao giờ nên bỏ qua CloudFront", "CloudFront bắt buộc với mọi S3 bucket"], correct:1, explain:"Với nội dung thay đổi liên tục, lợi ích cache có thể không đáng kể so với độ phức tạp thêm vào."},
{q:"Việc test truy cập cả 2 đường (trực tiếp S3 và qua CloudFront) sau khi cấu hình OAC có ý nghĩa gì?", opts:["Không có ý nghĩa gì", "Xác nhận đúng: S3 bị chặn trực tiếp nhưng vẫn truy cập được qua CloudFront", "Chỉ để kiểm tra tốc độ", "Không cần thiết phải test"], correct:1, explain:"Đây là bước xác minh quan trọng để đảm bảo cấu hình bảo mật hoạt động đúng như mong đợi."},
]},
{label:'Thứ 5', title:'Custom Domain & HTTPS với ACM', content:'AWS Certificate Manager (ACM) cấp chứng chỉ SSL/TLS MIỄN PHÍ để bật HTTPS cho CloudFront, ALB, hoặc API Gateway — tự động gia hạn. Để gắn Custom Domain vào CloudFront, cần: xin chứng chỉ ACM cho domain đó (bắt buộc ở Region us-east-1 cho CloudFront), cấu hình Alternate Domain Name trong CloudFront, và tạo bản ghi Alias trong Route 53 trỏ về CloudFront. Có HTTPS không chỉ tăng bảo mật mà còn ảnh hưởng đến SEO và uy tín với người dùng.', exercises:["Đọc quy trình xin chứng chỉ ACM cho 1 domain, ghi chú các bước chính (validation qua DNS hoặc email).","Tìm hiểu vì sao ACM cho CloudFront bắt buộc phải xin ở Region us-east-1.","Nếu có domain thật, thử cấu hình Custom Domain cho CloudFront distribution với chứng chỉ ACM.","Tạo bản ghi Alias trong Route 53 trỏ domain về CloudFront distribution.","Viết lại quy trình đầy đủ (5-6 bước) để có 1 website HTTPS với domain riêng chạy qua CloudFront."], quiz:[
{q:"ACM (AWS Certificate Manager) dùng để làm gì?", opts:["Quản lý IAM User", "Cấp chứng chỉ SSL/TLS miễn phí và tự động gia hạn", "Tạo VPC", "Quản lý Auto Scaling"], correct:1, explain:"ACM cung cấp chứng chỉ SSL/TLS miễn phí, tự động gia hạn cho các dịch vụ AWS."},
{q:"Chứng chỉ ACM cho CloudFront bắt buộc xin ở Region nào?", opts:["Bất kỳ Region nào", "us-east-1", "ap-southeast-1", "Không cần chọn Region"], correct:1, explain:"Đây là yêu cầu đặc biệt: chứng chỉ CloudFront phải nằm ở us-east-1 dù CloudFront là dịch vụ toàn cầu."},
{q:"ACM có tính phí cho chứng chỉ công khai (public certificate) không?", opts:["Có, tính phí theo tháng", "Miễn phí hoàn toàn cho chứng chỉ public dùng với dịch vụ AWS", "Chỉ miễn phí năm đầu tiên", "Chỉ miễn phí cho tài khoản Enterprise"], correct:1, explain:"Chứng chỉ public của ACM miễn phí khi dùng với các dịch vụ AWS tích hợp."},
{q:"ACM tự động làm gì khi chứng chỉ sắp hết hạn?", opts:["Không làm gì, người dùng phải tự gia hạn", "Tự động gia hạn nếu domain vẫn còn validation hợp lệ", "Xóa chứng chỉ ngay lập tức", "Gửi email yêu cầu thanh toán"], correct:1, explain:"Tự động gia hạn là lợi ích lớn của ACM so với chứng chỉ SSL truyền thống."},
{q:"Alternate Domain Name trong CloudFront dùng để làm gì?", opts:["Không có tác dụng gì", "Cho phép CloudFront distribution nhận request từ 1 domain tùy chỉnh (không phải domain CloudFront mặc định)", "Chỉ dùng cho email", "Thay thế Origin"], correct:1, explain:"Đây là cấu hình cần thiết để dùng Custom Domain thay vì domain mặc định của CloudFront."},
{q:"Alias record trong Route 53 trỏ CloudFront distribution dùng để làm gì?", opts:["Không cần thiết", "Kết nối domain của bạn (như www.example.com) với CloudFront distribution", "Chỉ dùng cho email server", "Thay thế ACM"], correct:1, explain:"Đây là bước cuối cùng để domain thật trỏ đúng đến CloudFront."},
{q:"Validation chứng chỉ ACM có thể thực hiện qua phương thức nào?", opts:["Chỉ qua điện thoại", "DNS hoặc Email", "Chỉ qua Fax", "Không cần validation"], correct:1, explain:"ACM hỗ trợ 2 phương thức xác thực chủ sở hữu domain: DNS và Email."},
{q:"HTTPS mang lại lợi ích gì ngoài bảo mật?", opts:["Không có lợi ích nào khác", "Ảnh hưởng tích cực đến SEO và tăng uy tín với người dùng", "Chỉ làm chậm website", "Không liên quan đến SEO"], correct:1, explain:"Các công cụ tìm kiếm và trình duyệt hiện đại ưu tiên/đánh dấu cảnh báo với site không HTTPS."},
{q:"Quy trình đầy đủ để có website HTTPS domain riêng qua CloudFront gồm những bước nào?", opts:["Chỉ cần tạo CloudFront là đủ", "Xin chứng chỉ ACM (us-east-1) → cấu hình Alternate Domain Name → tạo Alias record ở Route 53", "Chỉ cần mua domain", "Không cần các bước cụ thể"], correct:1, explain:"Đây là quy trình chuẩn 3 bước để hoàn thiện Custom Domain + HTTPS."},
{q:"Nếu không cấu hình đúng Alternate Domain Name, điều gì có thể xảy ra khi truy cập bằng Custom Domain?", opts:["Không có vấn đề gì", "CloudFront có thể từ chối request vì domain không khớp với cấu hình", "Tự động sửa lỗi", "Luôn hoạt động bình thường"], correct:1, explain:"CloudFront kiểm tra domain trong request khớp với Alternate Domain Name đã cấu hình."},
]},
{label:'Thứ 6', title:'Tổng kết tuần 7', content:'Route 53 + CloudFront + ACM tạo thành bộ 3 dịch vụ hoàn chỉnh để có 1 website production với domain riêng, HTTPS, và tốc độ tải nhanh toàn cầu — hoàn toàn không cần server riêng nếu nội dung là tĩnh. Đây là kiến trúc rất phổ biến cho landing page, blog, tài liệu, ứng dụng frontend SPA. Hiểu rõ luồng DNS → CDN → Origin giúp debug hiệu quả khi có vấn đề về tốc độ tải hoặc chứng chỉ SSL trong thực tế công việc.', exercises:["Vẽ sơ đồ đầy đủ: Route 53 (domain) → CloudFront (CDN+HTTPS) → S3 (origin, qua OAC).","Viết lại từ trí nhớ sự khác biệt giữa Routing Policy Weighted và Failover.","Kiểm tra lại toàn bộ cấu hình CloudFront/Route53/ACM đã làm, đảm bảo không có gì public không cần thiết.","Ước tính chi phí CloudFront + Route 53 hàng tháng cho 1 website nhỏ bằng AWS Pricing Calculator.","Viết 3 lợi ích chính của việc dùng CloudFront thay vì chỉ host trực tiếp trên S3/EC2 không qua CDN."], quiz:[
{q:"Chủ đề trọng tâm tuần 7 tháng 2 là gì?", opts:["RDS và Load Balancer", "Route 53 (DNS) và CloudFront (CDN) kết hợp HTTPS qua ACM", "Lambda và Serverless", "IAM và VPC"], correct:1, explain:"Tuần 7 xây dựng bộ 3 dịch vụ hoàn chỉnh cho website production: DNS, CDN, chứng chỉ SSL."},
{q:"Bộ 3 dịch vụ Route53+CloudFront+ACM giúp tạo ra điều gì?", opts:["Không tạo ra gì đặc biệt", "1 website production với domain riêng, HTTPS, tốc độ tải nhanh toàn cầu", "Chỉ 1 trang test nội bộ", "Chỉ dùng cho email"], correct:1, explain:"Đây là bộ công cụ hoàn chỉnh để triển khai website chuyên nghiệp không cần server riêng."},
{q:"Luồng hoạt động DNS → CDN → Origin nghĩa là gì?", opts:["Không có luồng cụ thể", "Route 53 phân giải domain đến CloudFront, CloudFront lấy/cache nội dung từ Origin (S3/EC2...)", "Chỉ có 1 bước duy nhất", "Origin luôn đứng trước CDN"], correct:1, explain:"Đây là luồng xử lý chuẩn khi người dùng truy cập 1 website qua kiến trúc này."},
{q:"Kiến trúc Route53+CloudFront+S3 phù hợp nhất cho loại ứng dụng nào?", opts:["Ứng dụng backend xử lý nghiệp vụ phức tạp", "Landing page, blog, tài liệu, ứng dụng frontend SPA (nội dung tĩnh)", "Chỉ database", "Chỉ email server"], correct:1, explain:"Đây là kiến trúc lý tưởng cho nội dung tĩnh không cần xử lý server-side phức tạp."},
{q:"Vì sao cần kiểm tra lại cấu hình để đảm bảo không có gì public không cần thiết?", opts:["Không cần kiểm tra gì", "Tránh rò rỉ dữ liệu hoặc bị truy cập trái phép do cấu hình sai (như S3 bucket không qua OAC)", "Chỉ để trang trí", "Không liên quan đến bảo mật"], correct:1, explain:"Đây là bước rà soát bảo mật quan trọng sau khi hoàn thành cấu hình."},
{q:"Đề thi SAA thường hỏi về CloudFront+S3 theo hướng nào?", opts:["Không bao giờ hỏi về chủ đề này", "Câu hỏi tình huống về thiết kế phân phối nội dung tĩnh hiệu quả, bảo mật (dùng OAC)", "Chỉ hỏi về giá cả", "Chỉ hỏi lý thuyết DNS đơn thuần"], correct:1, explain:"Dạng câu hỏi thiết kế kiến trúc là phổ biến nhất cho chủ đề CDN+Storage."},
{q:"Vì sao nên hiểu rõ luồng DNS→CDN→Origin để debug thực tế?", opts:["Không cần thiết", "Giúp xác định nhanh vấn đề nằm ở đâu khi có lỗi tải trang hoặc chứng chỉ SSL", "Chỉ để thi cử", "Không liên quan đến công việc thực tế"], correct:1, explain:"Hiểu luồng xử lý giúp khoanh vùng lỗi hiệu quả (DNS sai, cache cũ, hay Origin lỗi)."},
{q:"Sau tuần 7, bạn đã có khả năng triển khai điều gì hoàn chỉnh?", opts:["Chỉ 1 EC2 instance đơn giản", "1 website tĩnh có domain riêng, HTTPS, tốc độ tải nhanh toàn cầu, không cần server riêng", "Chỉ 1 database", "Không có khả năng mới nào"], correct:1, explain:"Đây là năng lực thực tế quan trọng đạt được sau khi hoàn thành tuần 7."},
{q:"Ước tính chi phí cho kiến trúc Route53+CloudFront+S3 với traffic thấp thường ở mức nào?", opts:["Rất đắt, hàng nghìn USD/tháng", "Tương đối thấp, phù hợp cho dự án cá nhân/nhỏ", "Miễn phí hoàn toàn vĩnh viễn", "Không thể ước tính được"], correct:1, explain:"Với traffic thấp, chi phí các dịch vụ này thường ở mức rất phải chăng."},
{q:"Kiến thức tuần 7 bổ trợ gì cho tuần 8 (Lambda/Serverless) sắp tới?", opts:["Không liên quan gì đến nhau", "CloudFront+S3 làm phần frontend tĩnh, kết hợp với API Gateway+Lambda ở backend tạo thành kiến trúc serverless đầy đủ", "Chỉ là kiến thức độc lập không liên quan", "Tuần 7 không cần thiết cho serverless"], correct:1, explain:"CloudFront+S3 (frontend) và Lambda (backend) thường kết hợp trong kiến trúc serverless hoàn chỉnh."},
]},
]},
{title:"Lambda & Serverless — tổng kết tháng 2", points:["Lambda cho phép chạy code mà không cần quản lý server, tự động scale theo số lượng request, tính phí theo thời gian thực thi thực tế.","Lambda function được kích hoạt bởi trigger — API Gateway, S3 event, EventBridge...","Cold start là độ trễ xảy ra khi Lambda function chưa được \"làm nóng\" — cần lưu ý khi thiết kế ứng dụng nhạy cảm về độ trễ.","API Gateway kết hợp với Lambda tạo thành kiến trúc REST API serverless phổ biến, không cần EC2.","Serverless giảm đáng kể công sức vận hành nhưng phù hợp nhất với workload có tính chất event-driven hơn là chạy liên tục 24/7."], practice:"Viết 1 Lambda function đơn giản (trả về \"Hello World\"), gắn với API Gateway để gọi được qua HTTP.", case:"Kiến trúc serverless (API Gateway + Lambda + DynamoDB) là 1 trong những pattern được hỏi nhiều nhất trong đề thi SAA.", task:"Viết 1 Lambda function được kích hoạt tự động khi có file mới upload vào S3 bucket, ví dụ tự động log tên file ra CloudWatch.", days:[
{label:'Thứ 2', title:'Lambda cơ bản & Trigger', content:'Lambda cho phép chạy code mà không cần quản lý server — chỉ cần upload code, AWS tự động cấp phát tài nguyên khi có sự kiện kích hoạt (trigger) và tự động scale theo số lượng request đồng thời. Lambda tính phí theo số lần gọi VÀ thời gian thực thi thực tế, khác hẳn EC2 phải trả tiền dù không có traffic. Trigger phổ biến: API Gateway, S3 Event, EventBridge (lịch trình định kỳ), SQS. Cold Start là độ trễ khi Lambda chưa được \"làm nóng\" — ảnh hưởng đáng kể đến ứng dụng nhạy cảm về độ trễ.', exercises:["Viết 1 Lambda function đơn giản trả về \"Hello World\" kèm timestamp hiện tại.","Cấu hình Lambda function tự động chạy khi có file mới upload vào S3 bucket (S3 Event trigger).","Tìm hiểu EventBridge Scheduled Rule dùng để chạy Lambda theo lịch cố định.","Đọc về Cold Start, tìm hiểu Provisioned Concurrency giúp giảm Cold Start thế nào.","So sánh chi phí chạy 1 tác vụ nhỏ trên Lambda so với chạy 1 EC2 instance 24/7."], quiz:[
{q:"Lambda tính phí dựa trên yếu tố nào?", opts:["Chỉ số lần gọi", "Số lần gọi VÀ thời gian thực thi thực tế", "Chỉ thời gian server chạy 24/7", "Miễn phí hoàn toàn"], correct:1, explain:"Lambda tính phí theo cả số lần gọi và thời gian thực thi thực tế (mili-giây)."},
{q:"Trigger nào dùng để kích hoạt Lambda theo lịch định kỳ?", opts:["S3 Event", "EventBridge Scheduled Rule", "API Gateway", "SQS"], correct:1, explain:"EventBridge Scheduled Rule cho phép chạy Lambda theo lịch cố định như cron job."},
{q:"Cold Start trong Lambda là gì?", opts:["Lỗi hệ thống", "Độ trễ khi Lambda chưa có execution environment sẵn sàng", "Thời gian gọi API Gateway", "Không tồn tại khái niệm này"], correct:1, explain:"Cold Start xảy ra khi cần khởi tạo môi trường thực thi mới cho Lambda."},
{q:"Provisioned Concurrency giúp ích gì?", opts:["Không có tác dụng gì", "Giảm Cold Start bằng cách giữ sẵn 1 số execution environment luôn sẵn sàng", "Tăng chi phí không cần thiết", "Chỉ dùng cho S3"], correct:1, explain:"Provisioned Concurrency giữ instance Lambda \"ấm\" sẵn, giảm độ trễ Cold Start."},
{q:"Lambda có thể được kích hoạt bởi S3 Event khi nào?", opts:["Không bao giờ liên kết được với S3", "Khi có file mới upload hoặc thay đổi trong S3 bucket", "Chỉ khi xóa bucket", "Chỉ khi đổi tên bucket"], correct:1, explain:"S3 Event trigger cho phép Lambda tự động phản ứng với các thay đổi trong bucket."},
{q:"So với EC2, Lambda có ưu điểm gì về chi phí khi traffic thấp/không ổn định?", opts:["Không có ưu điểm gì", "Chỉ trả tiền khi thực sự chạy, không tốn phí lúc không có traffic", "Lambda luôn đắt hơn EC2", "Chi phí giống hệt nhau"], correct:1, explain:"Mô hình tính phí theo lần gọi giúp Lambda tiết kiệm hơn nhiều cho tải không ổn định."},
{q:"EventBridge dùng để làm gì trong hệ sinh thái Lambda?", opts:["Chỉ lưu trữ log", "Kích hoạt Lambda theo lịch trình hoặc phản ứng với sự kiện hệ thống", "Thay thế IAM", "Quản lý VPC"], correct:1, explain:"EventBridge là dịch vụ điều phối sự kiện, thường dùng làm trigger cho Lambda."},
{q:"Lambda tự động scale theo yếu tố nào?", opts:["Không tự động scale", "Số lượng request đồng thời (concurrent executions)", "Chỉ theo giờ trong ngày", "Theo dung lượng ổ đĩa"], correct:1, explain:"Lambda tự động tạo thêm execution environment khi có nhiều request đồng thời."},
{q:"SQS khi dùng làm trigger cho Lambda phục vụ mục đích gì?", opts:["Không liên quan đến Lambda", "Xử lý message trong hàng đợi một cách bất đồng bộ, đáng tin cậy", "Chỉ dùng cho email", "Thay thế API Gateway"], correct:1, explain:"SQS+Lambda là pattern phổ biến cho xử lý message bất đồng bộ."},
{q:"Vì sao Cold Start ảnh hưởng đáng kể đến ứng dụng nhạy cảm về độ trễ?", opts:["Không ảnh hưởng gì", "Vì lần gọi đầu tiên (hoặc sau thời gian nghỉ) sẽ chậm hơn đáng kể so với các lần gọi tiếp theo", "Cold Start chỉ ảnh hưởng đến chi phí", "Cold Start không tồn tại thực tế"], correct:1, explain:"Cold Start gây độ trễ thêm, đặc biệt quan trọng với ứng dụng real-time."},
]},
{label:'Thứ 3', title:'API Gateway + Lambda', content:'API Gateway kết hợp với Lambda tạo thành kiến trúc REST API serverless hoàn toàn, không cần EC2 hay quản lý server nào. API Gateway nhận HTTP request, định tuyến đến đúng Lambda function tương ứng, và trả kết quả về client — hỗ trợ đầy đủ các phương thức REST. Có thể cấu hình nhiều endpoint khác nhau trỏ đến các Lambda function khác nhau. API Gateway còn hỗ trợ Authorization, Throttling, và tích hợp CORS cho ứng dụng frontend gọi API từ domain khác.', exercises:["Tạo 1 REST API trong API Gateway, gắn với Lambda function \"Hello World\" đã viết ở bài trước.","Test gọi API vừa tạo qua trình duyệt hoặc công cụ như Postman, xác nhận nhận được response đúng.","Thêm 1 endpoint mới (ví dụ /users) gắn với 1 Lambda function khác, xử lý logic khác.","Tìm hiểu CORS là gì và vì sao cần cấu hình khi frontend gọi API này.","Đọc về API Gateway Throttling, tìm hiểu nó giúp bảo vệ hệ thống khỏi lạm dụng thế nào."], quiz:[
{q:"API Gateway + Lambda tạo thành kiến trúc gì?", opts:["Database quan hệ", "REST API serverless không cần EC2", "CDN", "VPN"], correct:1, explain:"Đây là kiến trúc serverless phổ biến nhất cho xây dựng API."},
{q:"API Gateway hỗ trợ những phương thức HTTP nào?", opts:["Chỉ GET", "Đầy đủ các phương thức REST (GET/POST/PUT/DELETE...)", "Chỉ POST", "Không hỗ trợ HTTP"], correct:1, explain:"API Gateway hỗ trợ đầy đủ các phương thức chuẩn của REST API."},
{q:"CORS cần cấu hình khi nào?", opts:["Không bao giờ cần thiết", "Khi frontend ở domain khác gọi API, trình duyệt yêu cầu xác nhận quyền truy cập cross-origin", "Chỉ khi dùng HTTPS", "Chỉ khi có nhiều Lambda function"], correct:1, explain:"CORS là cơ chế bảo mật trình duyệt, cần cấu hình đúng để cho phép gọi API từ domain khác."},
{q:"API Gateway Throttling dùng để làm gì?", opts:["Tăng tốc độ xử lý", "Giới hạn tốc độ request để chống lạm dụng/quá tải hệ thống", "Mã hóa dữ liệu", "Quản lý domain"], correct:1, explain:"Throttling bảo vệ backend khỏi bị quá tải do quá nhiều request."},
{q:"1 API Gateway có thể gắn với nhiều Lambda function khác nhau không?", opts:["Không, chỉ 1 Lambda duy nhất", "Có, mỗi endpoint có thể gắn với 1 Lambda function riêng biệt", "Chỉ Lambda cùng 1 Region mới gắn được", "Không thể tạo nhiều endpoint"], correct:1, explain:"API Gateway linh hoạt cho phép định tuyến nhiều endpoint đến nhiều Lambda khác nhau."},
{q:"Authorization trong API Gateway dùng để làm gì?", opts:["Không có tác dụng gì", "Kiểm soát quyền truy cập vào API, chỉ cho phép request hợp lệ", "Chỉ để trang trí Console", "Thay thế Lambda hoàn toàn"], correct:1, explain:"Authorization đảm bảo chỉ những request được xác thực mới gọi được API."},
{q:"Kiến trúc API Gateway + Lambda có cần quản lý server không?", opts:["Có, vẫn cần EC2 phía sau", "Không, hoàn toàn serverless, không cần quản lý server nào", "Chỉ cần quản lý 1 phần nhỏ", "Cần Docker container riêng"], correct:1, explain:"Đây chính là ưu điểm cốt lõi: hoàn toàn không cần quản lý hạ tầng server."},
{q:"Response từ Lambda được trả về client qua đâu?", opts:["Trực tiếp không qua trung gian", "Thông qua API Gateway, đóng gói thành HTTP response chuẩn", "Qua S3", "Qua RDS"], correct:1, explain:"API Gateway đóng vai trò trung gian định dạng response trả về đúng chuẩn HTTP."},
{q:"Vì sao nên test API qua công cụ như Postman trước khi tích hợp frontend?", opts:["Không cần thiết", "Giúp xác nhận API hoạt động đúng độc lập trước khi thêm độ phức tạp của frontend", "Chỉ để trang trí", "Postman không dùng được cho việc này"], correct:1, explain:"Test độc lập giúp cô lập vấn đề, dễ debug hơn khi có lỗi xảy ra."},
{q:"Có thể thêm endpoint mới vào API Gateway đã tồn tại không?", opts:["Không, phải tạo API mới hoàn toàn", "Có, có thể mở rộng thêm endpoint/method mới bất cứ lúc nào", "Chỉ thêm được 1 lần duy nhất", "Cần xóa API cũ trước"], correct:1, explain:"API Gateway cho phép mở rộng linh hoạt theo nhu cầu phát triển."},
]},
{label:'Thứ 4', title:'DynamoDB cơ bản (bổ trợ serverless)', content:'DynamoDB là NoSQL database được AWS quản lý hoàn toàn, tự động scale, độ trễ đọc/ghi thấp ổn định — lựa chọn phổ biến nhất để kết hợp với kiến trúc serverless. Dữ liệu lưu theo Table gồm các Item, mỗi Item có Partition Key (bắt buộc) và tùy chọn thêm Sort Key. On-Demand Capacity Mode tự động scale theo traffic thực tế, phù hợp ứng dụng mới chưa dự đoán được tải; Provisioned Capacity Mode cần đặt trước RCU/WCU, phù hợp tải ổn định.', exercises:["Tạo 1 DynamoDB table đơn giản (ví dụ Users) với Partition Key là userId.","Thêm vài item vào table qua AWS Console, thử truy vấn lại theo Partition Key.","Sửa Lambda function ở bài trước để ghi dữ liệu vào DynamoDB table thay vì chỉ trả về text tĩnh.","So sánh On-Demand và Provisioned Capacity Mode, xác định tình huống phù hợp cho mỗi loại.","Tìm hiểu vì sao DynamoDB là lựa chọn phổ biến hơn RDS trong kiến trúc serverless thuần túy."], quiz:[
{q:"DynamoDB thuộc loại database nào?", opts:["Quan hệ (SQL)", "NoSQL", "Data Warehouse", "In-memory cache"], correct:1, explain:"DynamoDB là dịch vụ NoSQL được AWS quản lý hoàn toàn."},
{q:"Partition Key trong DynamoDB dùng để làm gì?", opts:["Không có tác dụng gì", "Quyết định cách dữ liệu được phân tán trong table", "Mã hóa dữ liệu", "Định tuyến DNS"], correct:1, explain:"Partition Key là thuộc tính bắt buộc, ảnh hưởng cách dữ liệu được lưu trữ/phân tán."},
{q:"On-Demand Capacity Mode của DynamoDB phù hợp khi nào?", opts:["Tải ổn định, dự đoán được hoàn toàn", "Traffic chưa dự đoán được, muốn tự động scale theo request thực tế", "Không bao giờ nên dùng", "Chỉ dùng cho dữ liệu tĩnh"], correct:1, explain:"On-Demand tự động scale, phù hợp ứng dụng mới hoặc tải khó dự đoán."},
{q:"Provisioned Capacity Mode yêu cầu người dùng làm gì?", opts:["Không cần làm gì", "Đặt trước RCU/WCU (khả năng đọc/ghi mỗi giây)", "Chỉ cần bật lên là xong", "Không thể cấu hình thủ công"], correct:1, explain:"Provisioned Mode cần chủ động đặt trước công suất đọc/ghi mong muốn."},
{q:"Item trong DynamoDB tương đương với khái niệm gì trong SQL?", opts:["Table", "Row (dòng dữ liệu)", "Column", "Database"], correct:1, explain:"Item là 1 bản ghi dữ liệu, tương tự 1 row trong database quan hệ."},
{q:"Vì sao DynamoDB phù hợp với kiến trúc serverless hơn RDS trong nhiều trường hợp?", opts:["Không có sự khác biệt", "DynamoDB không cần quản lý kết nối phức tạp và scale tự động mượt mà hơn cho tải serverless", "RDS luôn nhanh hơn DynamoDB", "DynamoDB không hỗ trợ Lambda"], correct:1, explain:"Đặc tính serverless-native của DynamoDB phù hợp tự nhiên với Lambda."},
{q:"Sort Key trong DynamoDB có bắt buộc phải có không?", opts:["Bắt buộc phải có luôn", "Tùy chọn, chỉ cần khi cần sắp xếp/truy vấn theo nhiều tiêu chí trong cùng Partition Key", "Chỉ Partition Key mới quan trọng, Sort Key không có tác dụng", "Không thể thêm Sort Key sau khi tạo table"], correct:1, explain:"Sort Key là tùy chọn, bổ sung khả năng truy vấn linh hoạt hơn."},
{q:"DynamoDB có yêu cầu định nghĩa schema cố định cho mọi item như SQL không?", opts:["Có, bắt buộc giống hệt SQL", "Không, DynamoDB linh hoạt về schema (mỗi item có thể có thuộc tính khác nhau)", "Chỉ áp dụng cho Provisioned Mode", "Không thể lưu dữ liệu nếu thiếu schema"], correct:1, explain:"Tính linh hoạt schema là đặc trưng NoSQL của DynamoDB."},
{q:"Việc ghi dữ liệu từ Lambda vào DynamoDB thể hiện pattern gì?", opts:["Không có pattern cụ thể", "Kết hợp compute (Lambda) và storage (DynamoDB) trong kiến trúc serverless", "Chỉ là ví dụ ngẫu nhiên", "Pattern chỉ dùng cho demo, không dùng thực tế"], correct:1, explain:"Đây là kết hợp cốt lõi của backend serverless thực tế."},
{q:"Truy vấn theo Partition Key trong DynamoDB có tốc độ thế nào?", opts:["Rất chậm", "Rất nhanh, đây là truy vấn được tối ưu nhất trong DynamoDB", "Không thể truy vấn theo Partition Key", "Tốc độ ngẫu nhiên"], correct:1, explain:"Truy vấn theo Partition Key là hình thức tối ưu nhất, tận dụng đúng cơ chế phân tán dữ liệu."},
]},
{label:'Thứ 5', title:'Serverless Architecture Pattern', content:'Kiến trúc serverless hoàn chỉnh thường gồm: CloudFront + S3 (frontend tĩnh) → API Gateway → Lambda → DynamoDB — toàn bộ không cần quản lý server, tự động scale theo tải thực tế. Ưu điểm: chi phí tối ưu cho tải không ổn định, không lo vá lỗi/nâng cấp hệ điều hành, scale gần như vô hạn tự động. Hạn chế: Cold Start ảnh hưởng độ trễ, giới hạn thời gian chạy Lambda tối đa 15 phút, phức tạp hơn khi debug/monitor so với ứng dụng monolithic truyền thống.', exercises:["Vẽ sơ đồ đầy đủ kiến trúc serverless: CloudFront+S3 → API Gateway → Lambda → DynamoDB.","Liệt kê 3 ưu điểm và 3 hạn chế của kiến trúc serverless so với kiến trúc EC2 truyền thống.","Hình dung 1 ứng dụng thực tế phù hợp với kiến trúc serverless, giải thích vì sao.","Hình dung 1 ứng dụng KHÔNG phù hợp với serverless, giải thích vì sao.","So sánh chi phí ước tính giữa chạy serverless và chạy EC2+RDS cho 1 ứng dụng có traffic thấp, không ổn định."], quiz:[
{q:"Kiến trúc serverless hoàn chỉnh thường gồm những thành phần nào?", opts:["Chỉ cần EC2 và RDS", "CloudFront+S3 (frontend) → API Gateway → Lambda → DynamoDB", "Chỉ cần Lambda đơn lẻ", "Chỉ cần S3"], correct:1, explain:"Đây là kiến trúc serverless đầy đủ từ frontend đến backend đến lưu trữ."},
{q:"Ưu điểm chính của serverless so với EC2 truyền thống là gì?", opts:["Không có ưu điểm gì", "Không cần quản lý server, tự động scale, trả tiền theo dùng thực tế", "Serverless luôn nhanh hơn EC2", "Serverless không giới hạn thời gian chạy"], correct:1, explain:"Đây là 3 lợi ích cốt lõi của mô hình serverless."},
{q:"Thời gian chạy tối đa của 1 Lambda function là bao lâu?", opts:["1 phút", "15 phút", "1 giờ", "Không giới hạn"], correct:1, explain:"Lambda giới hạn tối đa 15 phút cho mỗi lần thực thi."},
{q:"Hạn chế nào của serverless cần lưu ý khi thiết kế?", opts:["Không có hạn chế nào", "Cold Start ảnh hưởng độ trễ, giới hạn thời gian chạy, phức tạp hơn khi debug", "Serverless luôn rẻ hơn tuyệt đối", "Serverless không hỗ trợ database"], correct:1, explain:"Đây là các đánh đổi thực tế cần cân nhắc khi chọn kiến trúc serverless."},
{q:"Kiến trúc serverless phù hợp nhất với loại tải nào?", opts:["Tải ổn định 24/7 không đổi", "Tải không ổn định, có lúc cao lúc thấp (event-driven)", "Xử lý video thời lượng dài liên tục", "Không phù hợp trường hợp nào"], correct:1, explain:"Serverless tỏa sáng nhất với workload event-driven, không liên tục."},
{q:"Ứng dụng nào KHÔNG phù hợp với kiến trúc serverless thuần túy?", opts:["Form liên hệ đơn giản", "Xử lý video dài liên tục vượt quá 15 phút chạy Lambda", "Blog cá nhân ít traffic", "API nhỏ gọi không thường xuyên"], correct:1, explain:"Giới hạn thời gian chạy 15 phút của Lambda không phù hợp tác vụ dài."},
{q:"Vì sao debug/monitor serverless phức tạp hơn ứng dụng monolithic?", opts:["Không phức tạp hơn", "Hệ thống phân tán thành nhiều thành phần nhỏ (Lambda, API Gateway...) khiến việc theo dõi luồng xử lý khó hơn", "Serverless không có log", "Chỉ vì thiếu công cụ"], correct:1, explain:"Kiến trúc phân tán (distributed) vốn khó debug hơn hệ thống tập trung (monolithic)."},
{q:"Chi phí serverless so với EC2+RDS cho traffic thấp, không ổn định thường thế nào?", opts:["Serverless luôn đắt hơn nhiều", "Serverless thường rẻ hơn đáng kể vì không trả tiền lúc không có traffic", "Chi phí luôn bằng nhau", "Không thể so sánh được"], correct:1, explain:"Với tải thấp/không ổn định, mô hình trả-tiền-theo-dùng của serverless thường tiết kiệm hơn."},
{q:"Kiến trúc serverless có giúp giảm công sức vận hành (DevOps) không?", opts:["Không giúp gì", "Có, giảm đáng kể việc quản lý patching, scaling, uptime server thủ công", "Serverless tăng thêm công sức vận hành", "Không liên quan đến vận hành"], correct:1, explain:"Đây là 1 trong những lợi ích lớn nhất của mô hình serverless."},
{q:"Việc vẽ sơ đồ kiến trúc trước khi triển khai có lợi ích gì?", opts:["Không có lợi ích gì", "Giúp hình dung rõ luồng dữ liệu và phát hiện vấn đề thiết kế sớm trước khi code", "Chỉ để trang trí tài liệu", "Làm mất thời gian không cần thiết"], correct:1, explain:"Thiết kế trước khi triển khai là thực hành tốt giúp tránh sai sót về sau."},
]},
{label:'Thứ 6', title:'Tổng kết tháng 2', content:'Sau tháng 2, bạn đã có đủ kiến thức về các dịch vụ nâng cao: RDS, ALB+ASG, Route53+CloudFront, và Serverless (Lambda+API Gateway+DynamoDB) — 4 nhóm kiến trúc chính chiếm phần lớn câu hỏi thiết kế trong đề thi SAA. Kết hợp với nền tảng tháng 1, bạn đã đủ khả năng thiết kế được hầu hết các kiến trúc web application phổ biến trên AWS. Tháng 3 sẽ tập trung vào bảo mật/giám sát nâng cao, High Availability/Disaster Recovery, và luyện đề tổng hợp.', exercises:["Vẽ 1 sơ đồ kiến trúc TỔNG HỢP kết hợp mọi thứ đã học 2 tháng.","Tự làm bài test nhỏ: viết lại tên và mục đích chính của 10 dịch vụ AWS đã học, không nhìn tài liệu.","Xác định 3 dịch vụ bạn còn tự tin thấp nhất sau 2 tháng, lên kế hoạch ôn lại trước khi qua tháng 3.","Dọn dẹp toàn bộ tài nguyên test không cần dùng (đặc biệt NAT Gateway, RDS, Load Balancer).","Viết 1 đoạn nhật ký ngắn tổng kết 2 tháng học AWS: điều gì thú vị nhất, điều gì khó nhất."], quiz:[
{q:"Sau tháng 2, kiến thức trọng tâm đã học gồm những gì?", opts:["Chỉ IAM và EC2", "RDS, ALB+ASG, Route53+CloudFront, Serverless (Lambda+API Gateway+DynamoDB)", "Chỉ S3", "Không có kiến thức mới nào"], correct:1, explain:"Đây là 4 nhóm kiến trúc chính đã học trong tháng 2."},
{q:"Kết hợp kiến thức tháng 1 và tháng 2 giúp bạn làm được gì?", opts:["Không có khả năng gì mới", "Thiết kế được hầu hết các kiến trúc web application phổ biến trên AWS", "Chỉ tạo được 1 EC2 instance đơn giản", "Chỉ dùng để thi lý thuyết"], correct:1, explain:"Sau 2 tháng, nền tảng kiến thức đủ để thiết kế kiến trúc thực tế đa dạng."},
{q:"Tháng 3 sẽ tập trung vào chủ đề gì theo lộ trình?", opts:["Học lại từ đầu tháng 1", "Bảo mật/giám sát nâng cao, High Availability/DR, và luyện đề tổng hợp", "Chỉ học thêm về Lambda", "Kết thúc khóa học tại đây"], correct:1, explain:"Tháng 3 nâng cao thêm về bảo mật, độ sẵn sàng, và chuẩn bị thi thật."},
{q:"Vì sao nên dọn dẹp NAT Gateway, RDS, Load Balancer sau khi học?", opts:["Không cần thiết", "Đây là những dịch vụ dễ phát sinh chi phí cao nhất nếu để chạy không cần thiết", "Chỉ để gọn Console", "Chúng luôn miễn phí"], correct:1, explain:"3 dịch vụ này thường có chi phí theo giờ cao, cần đặc biệt lưu ý dọn dẹp."},
{q:"Việc tự kiểm tra lại tên và mục đích 10 dịch vụ đã học có ích gì?", opts:["Không có ích gì", "Củng cố trí nhớ và phát hiện những phần còn yếu cần ôn lại", "Chỉ để mất thời gian", "Không liên quan đến việc học hiệu quả"], correct:1, explain:"Tự kiểm tra (active recall) là phương pháp học hiệu quả đã được chứng minh."},
{q:"4 nhóm kiến trúc học trong tháng 2 có mối liên hệ gì với nhau?", opts:["Hoàn toàn độc lập, không liên quan", "Đều là các building block có thể kết hợp linh hoạt để tạo kiến trúc web application hoàn chỉnh", "Chỉ 1 trong 4 nhóm là quan trọng", "Không có mối liên hệ thực tế nào"], correct:1, explain:"Các dịch vụ này thường được kết hợp cùng nhau trong 1 kiến trúc thực tế."},
{q:"Đề thi SAA-C03 có xu hướng hỏi về sự kết hợp giữa nhiều dịch vụ không?", opts:["Không, chỉ hỏi từng dịch vụ riêng lẻ", "Có, phần lớn câu hỏi tình huống yêu cầu kết hợp kiến thức nhiều dịch vụ để thiết kế giải pháp", "Chỉ hỏi lý thuyết đơn thuần", "Không có câu hỏi tình huống nào"], correct:1, explain:"Đề thi thường yêu cầu tư duy tổng hợp nhiều dịch vụ, không chỉ kiến thức đơn lẻ."},
{q:"Xác định điểm yếu sau mỗi giai đoạn học có tác dụng gì?", opts:["Không có tác dụng gì", "Giúp tập trung ôn tập đúng trọng tâm trước khi chuyển sang giai đoạn tiếp theo", "Chỉ để tự phê bình bản thân", "Làm mất động lực học"], correct:1, explain:"Xác định điểm yếu là bước quan trọng để ôn tập có mục tiêu, hiệu quả hơn."},
{q:"Viết nhật ký tổng kết quá trình học có lợi ích gì về lâu dài?", opts:["Không có lợi ích gì", "Giúp theo dõi hành trình học tập, duy trì động lực và nhận ra tiến bộ của bản thân", "Chỉ là hình thức, không có giá trị thực tế", "Làm mất thời gian không cần thiết"], correct:1, explain:"Ghi chép lại hành trình học tập giúp nhìn thấy rõ sự tiến bộ, duy trì động lực dài hạn."},
{q:"Kỹ năng thiết kế kiến trúc AWS có phải chỉ cần cho việc thi cử không?", opts:["Đúng, chỉ dùng để thi", "Không, đây là kỹ năng thực tế áp dụng trực tiếp vào công việc triển khai hệ thống thật", "Chỉ có giá trị lý thuyết", "Không có ứng dụng thực tế nào"], correct:1, explain:"Kiến thức thiết kế kiến trúc AWS có giá trị thực tiễn cao, vượt xa mục đích thi cử."},
]},
]},
{title:"DynamoDB & các dịch vụ lưu trữ khác", points:["DynamoDB là NoSQL database được AWS quản lý hoàn toàn, có khả năng scale gần như vô hạn với độ trễ thấp ổn định.","Partition Key (và Sort Key nếu có) quyết định cách dữ liệu được phân bổ — thiết kế key tốt rất quan trọng để tránh \"hot partition\".","DynamoDB phù hợp cho ứng dụng cần đọc/ghi tốc độ cao, ít quan hệ phức tạp, khác với RDS phù hợp dữ liệu có quan hệ.","EFS là dịch vụ file storage dùng chung được cho nhiều EC2 instance, khác với EBS (chỉ gắn được 1 instance tại 1 thời điểm thông thường).","So sánh S3 vs EBS vs EFS: S3 là object storage, EBS là block storage gắn với 1 instance, EFS là file storage chia sẻ được nhiều instance."], practice:"Tạo 1 bảng DynamoDB đơn giản, thêm/sửa/xóa vài item qua AWS Console hoặc CLI.", case:"Phân biệt đúng khi nào dùng S3/EBS/EFS/RDS/DynamoDB là nhóm câu hỏi chiếm tỷ trọng lớn nhất trong đề thi SAA.", task:"Viết 1 bảng so sánh 5 dịch vụ lưu trữ đã học (S3, EBS, EFS, RDS, DynamoDB): dùng khi nào, ưu nhược điểm."},
{title:"Bảo mật & giám sát", points:["CloudWatch thu thập metric, log, và cho phép đặt alarm khi tài nguyên vượt ngưỡng.","CloudTrail ghi lại lịch sử mọi API call trong tài khoản AWS — quan trọng cho việc audit và điều tra sự cố bảo mật.","KMS quản lý khóa mã hóa, dùng để mã hóa dữ liệu tại nghỉ (at rest) cho S3, RDS, EBS...","Shared Responsibility Model: AWS chịu trách nhiệm bảo mật \"của\" cloud, khách hàng chịu trách nhiệm bảo mật \"trong\" cloud.","WAF bảo vệ ứng dụng khỏi các cuộc tấn công web phổ biến (SQL injection, XSS...) ở tầng CloudFront/ALB."], practice:"Tạo 1 CloudWatch Alarm cảnh báo khi CPU của EC2 instance vượt 80%, thử test bằng cách giả lập tải cao.", case:"Shared Responsibility Model là khái niệm nền tảng gần như chắc chắn xuất hiện trong đề thi SAA, cả câu hỏi trực tiếp lẫn câu hỏi tình huống.", task:"Bật CloudTrail cho tài khoản AWS, xem log ghi lại các hành động bạn vừa thực hiện trong các tuần trước."},
{title:"Kiến trúc High Availability & Disaster Recovery", points:["Availability Zone là các trung tâm dữ liệu độc lập trong 1 Region — thiết kế multi-AZ giúp ứng dụng chịu được sự cố ở 1 AZ.","Region là khu vực địa lý chứa nhiều AZ — chọn Region gần người dùng giúp giảm độ trễ.","Disaster Recovery có nhiều chiến lược: Backup & Restore, Pilot Light, Warm Standby, Multi-Site Active-Active — mỗi chiến lược đánh đổi giữa chi phí và RTO/RPO.","RTO là thời gian tối đa chấp nhận được để khôi phục hệ thống; RPO là lượng dữ liệu tối đa chấp nhận mất.","Thiết kế kiến trúc \"well-architected\" cần cân bằng 5 trụ cột: Operational Excellence, Security, Reliability, Performance Efficiency, Cost Optimization."], practice:"Vẽ sơ đồ kiến trúc 1 ứng dụng web đơn giản triển khai trên 2 AZ với ALB + ASG + RDS Multi-AZ.", case:"Câu hỏi tình huống về DR strategy (chọn đúng chiến lược theo yêu cầu RTO/RPO cụ thể) là dạng câu hỏi khó và hay gặp nhất trong đề thi SAA.", task:"Với sơ đồ đã vẽ, viết ra RTO/RPO ước lượng cho kiến trúc đó, và đề xuất 1 cải tiến để giảm RTO nếu cần."},
{title:"Luyện đề tổng hợp & sẵn sàng thi", points:["Đề thi SAA-C03 gồm 65 câu hỏi, thời gian 130 phút, điểm đạt tối thiểu 720/1000.","Phần lớn câu hỏi là dạng tình huống (scenario-based) — mô tả 1 bài toán thực tế và yêu cầu chọn kiến trúc/dịch vụ phù hợp nhất.","Kỹ năng loại trừ đáp án sai quan trọng không kém việc biết đáp án đúng — thường có 2 đáp án rõ ràng sai, 2 đáp án còn lại cần phân tích kỹ.","Nên làm ít nhất 2-3 bộ đề thi thử đầy đủ trước khi thi thật để quen áp lực thời gian.","Ôn lại các dịch vụ hay bị nhầm lẫn nhất: SQS vs SNS, S3 vs EBS vs EFS, Security Group vs NACL, Multi-AZ vs Read Replica."], practice:"Làm 1 đề thi thử SAA-C03 đầy đủ (65 câu, tính giờ 130 phút), chấm điểm và phân tích lỗi sai.", case:"Tự tin đạt trên 750/1000 trong 2 lần luyện đề liên tiếp là dấu hiệu tốt cho thấy đã sẵn sàng đăng ký thi thật.", task:"Lập danh sách 10 khái niệm/dịch vụ bạn còn nhầm lẫn nhất qua các tuần học, dành riêng thời gian tuần này để ôn sâu từng cái."},
];

/* ============ TIẾNG HÀN — 16 TUẦN / 4 THÁNG ĐẦU (hướng tới TOPIK 6, sẽ mở rộng tiếp) ============ */
const koreanWeeks = [
{title:"Nguyên âm cơ bản (기본 모음)", points:["Hangul là bảng chữ cái tiếng Hàn, gồm nguyên âm và phụ âm, được thiết kế khoa học, học được trong thời gian ngắn.","10 nguyên âm cơ bản: ㅏ(a), ㅑ(ya), ㅓ(eo), ㅕ(yeo), ㅗ(o), ㅛ(yo), ㅜ(u), ㅠ(yu), ㅡ(eu), ㅣ(i).","Nguyên âm chia làm 2 nhóm: nét ngang (ㅡ,ㅗ,ㅛ,ㅜ,ㅠ) và nét dọc (ㅣ,ㅏ,ㅑ,ㅓ,ㅕ) — nhận biết nhóm giúp nhớ cách viết đúng thứ tự nét.","Mỗi nguyên âm khi đứng 1 mình cần ghép với phụ âm câm ㅇ ở vị trí đầu (ví dụ 아 = a).","Luyện viết đúng thứ tự nét ngay từ đầu quan trọng hơn viết nhanh — thói quen sai khó sửa về sau."], practice:"Luyện viết tay 10 nguyên âm cơ bản, mỗi nguyên âm 10 lần, đọc to khi viết.", case:"Hangul được vua Sejong sáng tạo năm 1443 để giúp người dân dễ học chữ viết — đây là lý do bảng chữ cái này rất logic và dễ tiếp cận hơn chữ Hán hay Nhật.", task:"Viết được và đọc đúng 10 nguyên âm cơ bản không cần nhìn bảng, tự kiểm tra bằng cách viết ngẫu nhiên.", days:[

{label:'Thứ 5', title:'Ghép nguyên âm với phụ âm ㄴ, ㅁ, ㅅ (làm quen sớm)', content:'Làm quen sớm với 3 phụ âm đơn giản (ㄴ=n, ㅁ=m, ㅅ=s) giúp thực hành ghép âm tiết thực tế. Công thức ghép: phụ âm + nguyên âm nét dọc → viết cạnh nhau (ví dụ 나 = ㄴ+ㅏ); phụ âm + nguyên âm nét ngang → phụ âm trên, nguyên âm dưới (ví dụ 노 = ㄴ+ㅗ). Đây là quy tắc cấu trúc âm tiết quan trọng nhất của Hangul, áp dụng cho toàn bộ phụ âm sau này.', exercises:['Ghép 3 phụ âm (ㄴ,ㅁ,ㅅ) với cả 10 nguyên âm, viết ra ít nhất 20 âm tiết khác nhau.','Đọc to toàn bộ 20 âm tiết vừa viết, chỉ luyện phát âm.','Tìm 3 từ tiếng Hàn đơn giản chứa các phụ âm này (ví dụ 나무=cây, 사람=người) và thử đọc thử.','Viết 5 âm tiết ngẫu nhiên mới (không lặp lại bài đã làm), đọc to và tự kiểm tra bằng cách ghép ngược lại.','Tìm hiểu ý nghĩa của 3 từ trong số các từ đã đọc thử (나무, 사람...) để bắt đầu xây vốn từ vựng.'], quiz:[

{label:'Thứ 6', title:'Tổng kết tuần 1 & luyện viết tự do', content:'Mục tiêu tuần đầu không phải hoàn hảo mà là XÂY DỰNG THÓI QUEN — viết đúng thứ tự nét, nhận diện mặt chữ, cảm giác ban đầu về âm thanh. Lặp lại viết tay nhiều lần là phương pháp hiệu quả nhất được chứng minh cho việc ghi nhớ hệ chữ viết mới, hiệu quả hơn nhiều so với chỉ nhìn và gõ trên điện thoại. Từ tuần sau, bạn sẽ học nốt phụ âm và bắt đầu ghép được âm tiết có ý nghĩa thực sự.', exercises:['Không nhìn tài liệu, viết ra toàn bộ 10 nguyên âm cơ bản theo trí nhớ, tự chấm điểm.','Viết 1 trang giấy tự do luyện các âm tiết đã học, không cần đúng nghĩa.','Tự đánh giá theo thang 1-10: mức độ tự tin nhận diện và viết được 10 nguyên âm cơ bản.','Tự tạo 1 bài test nhỏ: viết 10 nguyên âm theo thứ tự ngẫu nhiên bạn tự nghĩ ra, nhờ người khác đọc để bạn viết lại.','Ghi lại 3 điều bạn thấy khó nhất về Hangul sau tuần đầu, đặt mục tiêu cải thiện trong tuần 2.'], quiz:[

{title:"Phụ âm cơ bản (기본 자음)", points:["14 phụ âm cơ bản: ㄱ(g/k), ㄴ(n), ㄷ(d/t), ㄹ(r/l), ㅁ(m), ㅂ(b/p), ㅅ(s), ㅇ(câm/ng), ㅈ(j), ㅊ(ch), ㅋ(k), ㅌ(t), ㅍ(p), ㅎ(h).","Một số phụ âm phát âm khác nhau tùy vị trí trong âm tiết.","Cấu trúc âm tiết tiếng Hàn: phụ âm đầu + nguyên âm + (phụ âm cuối, không bắt buộc) — ví dụ 한 = ㅎ+ㅏ+ㄴ.","Ghép phụ âm với nguyên âm tạo thành khối âm tiết vuông vắn, không viết rời như chữ Latin.","Luyện ghép các phụ âm đã học với 10 nguyên âm ở tuần 1 để tạo thành âm tiết hoàn chỉnh."], practice:"Luyện viết 14 phụ âm cơ bản, sau đó ghép thử ít nhất 20 âm tiết khác nhau và đọc to.", case:"Phát âm chuẩn ngay từ giai đoạn Hangul giúp tránh phải sửa lỗi phát âm về sau — đây là giai đoạn quan trọng nhất dù có vẻ đơn giản.", task:"Viết tên của bạn bằng tiếng Hàn (phiên âm gần đúng) bằng những phụ âm/nguyên âm đã học.", days:[

{q:"ㄱ đọc gần âm nào?", opts:["g/k", "d/t", "b/p", "j"], correct:0, explain:"ㄱ đọc gần \"g\" nhẹ ở đầu, gần \"k\" ở cuối âm tiết."},
{q:"ㄷ đọc gần âm nào?", opts:["g/k", "d/t", "b/p", "j"], correct:1, explain:"ㄷ đọc gần \"đ\" nhẹ ở đầu, gần \"t\" ở cuối."},

{label:'Thứ 6', title:'Tổng kết tuần 2 & kiểm tra tổng hợp', content:'Sau 2 tuần, bạn đã học đủ 10 nguyên âm + 14 phụ âm cơ bản — nền tảng của gần như toàn bộ Hangul. Đây là tốc độ khá nhanh — LUYỆN TẬP LẶP LẠI ĐỀU ĐẶN quan trọng hơn học nhanh mà không nhớ. Nếu chưa vững, hoàn toàn bình thường và nên dành thêm 1-2 ngày ôn lại trước khi qua tuần 3. Từ tuần 3, độ khó tăng nhẹ nhưng bạn đã có nền tảng vững để tiếp thu nhanh hơn.', exercises:['Làm bài tự kiểm tra: nhìn 20 âm tiết ngẫu nhiên, viết lại chính xác.','Ôn lại toàn bộ 8 từ vựng đã học ở Thứ 5, đảm bảo nhớ cả cách đọc và nghĩa.','Tự đánh giá theo thang 1-10 mức độ tự tin với toàn bộ phụ âm+nguyên âm cơ bản, nếu dưới 7 thì dành thêm thời gian ôn.','Làm bài tự kiểm tra: viết 14 phụ âm + 10 nguyên âm hoàn toàn theo trí nhớ trong 5 phút, tính thời gian.','Ôn lại toàn bộ 8 từ vựng đã học tuần này bằng cách viết nghĩa tiếng Việt trước, tự đoán từ tiếng Hàn tương ứng.'], quiz:[
