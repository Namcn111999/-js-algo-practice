const feWeeks = [
{title:"Kiến trúc Component & Composable trong Vue 3", points:["Composable là hàm bắt đầu bằng \"use\" đóng gói logic có thể tái sử dụng, tách biệt khỏi UI.","Nguyên tắc: mỗi component nên làm một việc, logic phức tạp đẩy ra composable.","So với mixin cũ ở Vue 2, composable tránh xung đột tên và dễ trace nguồn gốc hơn.","Composable có thể nhận tham số reactive (ref/computed) và trả về state + method.","Trong AWX Refiner, các pattern lặp lại như gọi API + loading state là ứng viên tốt để tách composable."], practice:"Viết composable useApiRequest(url) tự quản lý state loading/data/error, dùng lại nó ở ít nhất 2 nơi khác nhau trong project demo.", case:"Trong các dự án Vue 3 thực tế, composable là cách chuẩn để chia sẻ logic gọi API, xử lý form, hay theo dõi kích thước màn hình — tránh lặp code giữa các component mà không cần Pinia cho những state không thực sự global.", task:"Chọn 1 đoạn logic lặp lại trong AWX Refiner (ví dụ gọi API + loading state), tách thành composable useXxx() và áp dụng lại ở 2 component.", days:[
{label:'Thứ 2', title:'Vì sao cần Composable', content:'Trước Composition API, logic dùng chung giữa các component thường được xử lý bằng mixin — nhưng mixin có 2 vấn đề lớn: xung đột tên khi 2 mixin cùng định nghĩa 1 property, và không rõ property/method nào đến từ mixin nào khi đọc code. Composable giải quyết cả 2 vấn đề này bằng cách trả về object rõ ràng và import tường minh — bạn luôn biết chính xác 1 biến "đến từ đâu".', exercises:["Tìm 2 chỗ trong project (hoặc dự án demo) đang có logic trùng lặp — ví dụ pattern loading/data/error khi gọi API. Ghi ra giấy điểm chung giữa 2 chỗ đó.","Giải thích bằng lời (không cần viết code) tại sao mixin cũ dễ gây xung đột tên hơn composable.","Liệt kê thêm 1 ví dụ ngoài AWX Refiner có thể áp dụng composable."]},
{label:'Thứ 3', title:'Cấu trúc 1 Composable chuẩn', content:'Một composable là hàm JS thường, quy ước đặt tên bắt đầu bằng "use". Nó có thể dùng ref/reactive bên trong và return ra 1 object chứa state + method để component dùng. Composable KHÔNG nên được gọi bên trong điều kiện (if) hay vòng lặp — luôn gọi ở top-level của setup(), giống quy tắc Hooks bên React.', example:'function useToggle(initial = false) {\n  const state = ref(initial);\n  function toggle() { state.value = !state.value; }\n  return { state, toggle };\n}', exercises:["Viết composable useToggle(initial) như ví dụ trên, dùng nó ở 2 component khác nhau (ví dụ 1 modal và 1 dropdown).","Viết thêm composable useCounter(initial=0) có increment()/decrement(), dùng thử ở 1 component.","Thử gọi useToggle() bên trong 1 điều kiện if (sai cách) để tự quan sát vấn đề xảy ra, rồi sửa lại đúng cách."]},
{label:'Thứ 4', title:'Composable gọi API', content:'Pattern phổ biến nhất trong thực tế: composable quản lý vòng đời của 1 lời gọi API — bao gồm trạng thái loading, data trả về, và error nếu có. Cần nhớ reset error/data khi gọi lại API mới, tránh hiển thị dữ liệu/lỗi cũ trong lúc đang load lại.', example:'function useApiRequest(url) {\n  const data = ref(null), error = ref(null), loading = ref(false);\n  async function fetchData() {\n    loading.value = true; error.value = null;\n    try { data.value = await (await fetch(url)).json(); }\n    catch (e) { error.value = e.message; }\n    finally { loading.value = false; }\n  }\n  return { data, error, loading, fetchData };\n}', exercises:["Cài đặt useApiRequest(url) như trên, test với 1 API công khai (ví dụ jsonplaceholder.typicode.com/todos/1).","Thêm khả năng hủy request cũ khi fetchData() được gọi lại trước khi request trước hoàn thành.","Viết vài dòng console.log kiểm tra useApiRequest trả về đúng trạng thái loading/data/error qua từng bước."]},
{label:'Thứ 5', title:'Composable dùng composable khác', content:'Composable có thể gọi các composable khác bên trong nó — đây là cách chia nhỏ logic phức tạp thành các phần dễ hiểu, mỗi phần chỉ làm 1 việc (Single Responsibility). Ví dụ useUserProfile có thể dùng useApiRequest bên trong để lấy dữ liệu, rồi thêm logic riêng (format tên, tính tuổi...) lên trên.', exercises:["Viết thêm 1 composable mới gọi lại useApiRequest bên trong (ví dụ useUserProfile dùng useApiRequest để lấy data user, sau đó thêm 1 computed để format lại tên hiển thị).","Vẽ sơ đồ (trên giấy) thể hiện composable nào gọi composable nào trong ví dụ useUserProfile.","Thử refactor 1 composable dài đang làm nhiều việc thành 2 composable nhỏ hơn, mỗi cái 1 trách nhiệm."]},
{label:'Thứ 6', title:'Áp dụng thực tế & tổng kết tuần', content:'Checklist nhận diện 1 đoạn code nên tách thành composable: (1) logic xuất hiện ở 2+ nơi, (2) logic không phụ thuộc trực tiếp vào template cụ thể, (3) logic có thể test độc lập không cần render UI. Nếu thỏa cả 3 điều kiện, gần như chắc chắn nên tách composable.', exercises:["Áp dụng useApiRequest (hoặc composable tương tự) vào ít nhất 1 chỗ thật trong AWX Refiner, thay thế code loading/data/error đang viết tay.","Viết lại checklist 3 tiêu chí nhận diện composable bằng lời của chính bạn (không nhìn lại bài học).","Sau khi áp dụng vào AWX Refiner, đo lại xem file component ngắn đi bao nhiêu dòng code."]},
]},
{title:"Reactivity system nội bộ (Proxy, ref vs reactive)", points:["Vue 3 dùng Proxy để theo dõi thay đổi object, thay cho Object.defineProperty ở Vue 2.","ref() bọc giá trị primitive trong object có .value; reactive() dùng cho object/array, không cần .value.","reactive() mất reactivity khi destructure — dùng toRefs() để giữ lại.","computed là giá trị được cache, chỉ tính lại khi dependency thay đổi.","watch theo dõi nguồn cụ thể; watchEffect tự động track mọi dependency dùng bên trong nó."], practice:"Viết 1 component nhỏ có object reactive() chứa 3 field, thử destructure trực tiếp (sai) rồi sửa bằng toRefs(), log ra console để thấy khác biệt về reactivity.", case:"Bug phổ biến trong dự án lớn: destructure props hoặc store state trực tiếp khiến UI không cập nhật khi state đổi — hiểu rõ ref/reactive giúp debug nhanh loại lỗi này.", task:"Viết đoạn code nhỏ minh họa việc destructure reactive() làm mất reactivity, rồi sửa lại bằng toRefs().", days:[
{label:'Thứ 2', title:'Vì sao Vue 3 chuyển sang Proxy', content:'Vue 2 dùng Object.defineProperty để theo dõi thay đổi, nhưng cách này có 2 hạn chế lớn: không phát hiện được khi thêm/xóa property mới vào object (phải dùng Vue.set), và không theo dõi được thay đổi qua index của mảng. Proxy trong Vue 3 bọc toàn bộ object và bắt được MỌI thao tác đọc/ghi, kể cả thêm property mới hay đổi index mảng — không cần API đặc biệt nào nữa.', exercises:["Đọc lại 1 đoạn code Vue 2 cũ (nếu có) dùng Vue.set(), thử hình dung nó sẽ đơn giản hơn thế nào nếu viết lại bằng Vue 3 reactive().","Viết ra 2 ví dụ cụ thể Vue 2 sẽ KHÔNG phát hiện được thay đổi (thêm property mới, đổi index mảng).","Thử tạo 1 Proxy JS thuần (không qua Vue) bằng new Proxy({}, handler) để hiểu cơ chế get/set bên dưới."]},
{label:'Thứ 3', title:'ref() vs reactive() — khi nào dùng cái nào', content:'ref() dùng cho giá trị đơn (số, chuỗi, boolean) hoặc khi bạn muốn gán lại toàn bộ giá trị (ví dụ user.value = newUser). reactive() dùng cho object/array mà bạn chỉ sửa từng field bên trong, không gán lại toàn bộ. Quy tắc thực dụng: nếu không chắc, dùng ref() cho mọi thứ — nó hoạt động với cả object và an toàn hơn khi destructure.', example:'const count = ref(0);           // primitive\nconst user = reactive({ name: "An", age: 20 }); // object', exercises:["Viết 1 component nhỏ dùng cả ref() cho 1 số đếm và reactive() cho 1 object user, log ra console để thấy cách truy cập khác nhau (.value vs truy cập trực tiếp).","Viết 1 object chứa 5 field bằng reactive(), thử sửa từng field và quan sát UI cập nhật đúng.","Thử gán lại toàn bộ user.value bằng ref(), so sánh với việc gán lại reactive() (không cho phép theo cách này)."]},
{label:'Thứ 4', title:'Mất reactivity khi destructure', content:'Khi destructure trực tiếp từ 1 object reactive(), các biến lấy ra chỉ còn là giá trị thường (snapshot), không còn liên kết với object gốc — thay đổi sau đó sẽ KHÔNG kích hoạt re-render. toRefs() chuyển từng property của object reactive thành ref riêng biệt, giữ nguyên liên kết reactivity khi destructure.', example:'const state = reactive({ count: 0 });\nconst { count } = state;         // SAI — mất reactivity\nconst { count } = toRefs(state); // ĐÚNG — vẫn liên kết với state.count', exercises:["Viết đoạn code minh họa lỗi mất reactivity khi destructure trực tiếp, sau đó sửa lại bằng toRefs() và xác nhận UI cập nhật đúng.","Thử dùng toRef() cho 1 field riêng lẻ, so sánh cú pháp khác gì toRefs().","Tìm trong 1 dự án thật xem có đoạn code nào đang destructure store/props có thể đang bị mất reactivity."]},
{label:'Thứ 5', title:'computed vs watch vs watchEffect', content:'computed dùng khi cần 1 giá trị được TÍNH ra từ state khác (có return, có cache). watch dùng khi cần chạy 1 HÀNH ĐỘNG phụ (side effect) khi 1 nguồn cụ thể thay đổi — bạn chỉ định rõ nguồn cần theo dõi. watchEffect tự động theo dõi MỌI reactive value được dùng bên trong nó, tiện nhưng khó kiểm soát hơn khi hàm phức tạp.', exercises:["Viết 1 ví dụ: computed tính \"họ tên đầy đủ\" từ firstName+lastName, và 1 watch gọi console.log mỗi khi searchQuery thay đổi (giả lập gọi API).","Viết thêm 1 watch có immediate:true để chạy ngay khi component mount.","So sánh code cùng 1 logic viết bằng watch và watchEffect, nhận xét đoạn nào dễ đọc hơn."]},
{label:'Thứ 6', title:'Áp dụng thực tế & tổng kết tuần', content:'Bug UI "không cập nhật dù data đã đổi" gần như luôn quy về 1 trong 2 nguyên nhân: destructure reactive() sai cách, hoặc gán lại toàn bộ object thay vì sửa từng field. Khi debug loại bug này, luôn kiểm tra ref/reactive được dùng đúng cách trước khi nghi ngờ nguyên nhân phức tạp hơn.', exercises:["Rà lại 1 component thật trong AWX Refiner, tìm xem có chỗ nào destructure props hoặc store state trực tiếp có thể gây mất reactivity không.","Viết ra 3 dấu hiệu nhận biết 1 bug là do reactivity sai cách (không phải do logic sai).","Ghi chú lại phát hiện reactivity bạn tìm được trong dự án tuần này."]},
]},
{title:"State management pattern (Pinia)", points:["Pinia thay thế Vuex ở Vue 3, API đơn giản hơn và hỗ trợ TypeScript tốt.","Store gồm state, getters (như computed), actions (như methods, có thể async).","Nguyên tắc: chỉ đưa state vào store khi nhiều component không liên quan cần dùng chung.","Tránh lạm dụng store cho state cục bộ chỉ 1 component dùng — ref/reactive local là đủ.","Có thể chia nhiều store nhỏ theo domain (userStore, modelStore...) thay vì 1 store khổng lồ."], practice:"Tạo 1 Pinia store quản lý danh sách item (thêm/xóa/sửa), viết 1 getter tính toán (ví dụ đếm số item), và 1 action gọi API giả lập.", case:"Ở quy mô enterprise, chia store theo domain (thay vì 1 store khổng lồ) giúp nhiều dev làm việc song song mà không đụng code nhau, và dễ code-split theo route.", task:"Liệt kê 3 state hiện đang truyền qua nhiều props (prop drilling) trong AWX Refiner, đánh giá xem có nên đưa vào store không.", days:[
{label:'Thứ 2', title:'Khi nào cần store toàn cục', content:'Nguyên tắc quyết định: nếu state chỉ được dùng bởi 1 component và con cháu trực tiếp của nó, dùng props/provide-inject là đủ. Chỉ đưa vào Pinia store khi state cần chia sẻ giữa nhiều component KHÔNG có quan hệ cha-con trực tiếp (user đăng nhập, giỏ hàng, filter đang chọn ở nhiều trang khác nhau). Đưa quá nhiều state cục bộ vào store khiến app khó debug vì state "toàn cục" ở khắp nơi.', exercises:["Liệt kê 3 state trong AWX Refiner hiện tại — với mỗi cái, quyết định nó nên là local state, props, hay Pinia store, và giải thích lý do.","Viết ra 1 ví dụ state SAI khi đưa vào store (chỉ 1 component dùng) để tự nhận diện phản ví dụ.","Thử tưởng tượng nếu KHÔNG có Pinia, bạn sẽ truyền 3 state đã liệt kê qua props như thế nào."]},
{label:'Thứ 3', title:'Cấu trúc 1 Pinia store', content:'defineStore() nhận 1 id duy nhất và 1 object gồm state (hàm trả về object dữ liệu ban đầu), getters (giống computed), và actions (giống methods, có thể async). Actions là nơi DUY NHẤT nên thay đổi state trực tiếp — tránh sửa state từ bên ngoài store để dễ trace nguồn gốc thay đổi.', example:'export const useCartStore = defineStore("cart", {\n  state: () => ({ items: [] }),\n  getters: { total: (s) => s.items.reduce((a,b)=>a+b.price,0) },\n  actions: { addItem(item) { this.items.push(item); } }\n});', exercises:["Tạo 1 store quản lý danh sách item (thêm/xóa), viết 1 getter tính tổng số lượng item.","Thêm 1 getter thứ 2 (ví dụ lọc item theo điều kiện) vào store đã tạo.","Thử gọi trực tiếp store.items.push() từ component (sai cách) rồi sửa lại gọi qua action đúng cách."]},
{label:'Thứ 4', title:'Actions bất đồng bộ (gọi API)', content:'Actions trong Pinia có thể là async function bình thường — không cần cú pháp đặc biệt nào khác. Pattern phổ biến: action set loading=true, gọi API, set data khi thành công, set error khi thất bại, cuối cùng set loading=false trong finally.', example:'actions: {\n  async fetchItems() {\n    this.loading = true;\n    try { this.items = await api.getItems(); }\n    finally { this.loading = false; }\n  }\n}', exercises:["Thêm 1 action bất đồng bộ vào store ở Thứ 3, gọi 1 API giả lập (có thể dùng setTimeout để mô phỏng độ trễ mạng).","Thêm xử lý lỗi (try/catch) vào action bất đồng bộ, lưu error vào 1 state riêng trong store.","Gọi action đó từ 2 component khác nhau, xác nhận cả 2 đều nhận được cùng 1 state cập nhật."]},
{label:'Thứ 5', title:'Chia nhỏ store theo domain', content:'Thay vì 1 store "app" khổng lồ chứa mọi thứ, chia thành nhiều store nhỏ theo domain nghiệp vụ (userStore, cartStore, modelStore...). Điều này giúp nhiều dev làm việc song song không đụng code nhau, và dễ code-split store theo route nếu cần. 1 store vẫn có thể gọi action/state của store khác khi cần phối hợp.', exercises:["Nếu project của bạn có 1 store lớn gộp nhiều domain khác nhau, thử vẽ ra (trên giấy) cách chia nó thành 2-3 store nhỏ hơn.","Viết ra tên gợi ý cho 2-3 store nhỏ nếu chia store lớn của bạn.","Thử để 1 action trong store A gọi action của store B, quan sát cách 2 store phối hợp."]},
{label:'Thứ 6', title:'Áp dụng thực tế & tổng kết tuần', content:'Trước khi thêm state mới vào store, tự hỏi: "state này có thực sự cần chia sẻ giữa nhiều component không liên quan không?" Nếu câu trả lời là không, giữ nó ở local state — store gọn gàng dễ maintain hơn nhiều so với store ôm đồm mọi thứ.', exercises:["Chọn 1 trong 3 state đã liệt kê ở Thứ 2 mà bạn xác định nên đưa vào store, thực sự implement nó vào Pinia store thật trong dự án.","Viết 1 đoạn ghi chú ngắn tổng kết: bạn đã học được gì mới về Pinia so với trước đây.","Kiểm tra lại toàn bộ store trong dự án, đánh dấu state nào có thể nên chuyển về local state."]},
]},
{title:"Performance: lazy loading & code splitting", points:["Code splitting chia bundle thành nhiều chunk nhỏ, chỉ tải khi cần.","Vue Router hỗ trợ lazy load route: component: () => import('./View.vue').","defineAsyncComponent cho phép lazy load component không qua router.","Lazy load ảnh bằng loading=\"lazy\" hoặc IntersectionObserver.","Đo tác động bằng Lighthouse hoặc tab Network trong DevTools trước/sau khi áp dụng."], practice:"Chuyển 2 route bất kỳ trong 1 project Vue sang lazy load, dùng Chrome DevTools Coverage tab đo % code chưa dùng tới khi tải trang chủ.", case:"Các ứng dụng dashboard lớn (như AWX Refiner) thường có hàng chục màn hình quản trị — lazy load theo route là kỹ thuật bắt buộc để giữ thời gian tải ban đầu nhanh.", task:"Chọn 1 route ít dùng trong AWX Refiner, chuyển sang lazy load và so sánh kích thước bundle trước/sau.", days:[
{label:'Thứ 2', title:'Vì sao bundle lớn ảnh hưởng performance', content:'Khi tải trang, trình duyệt phải tải VÀ parse toàn bộ JS bundle trước khi trang tương tác được (Time to Interactive). Bundle càng lớn, thời gian này càng lâu — đặc biệt ảnh hưởng nặng trên mạng chậm hoặc thiết bị yếu. Code splitting giải quyết vấn đề này bằng cách chỉ tải phần code thực sự cần cho màn hình hiện tại.', exercises:["Mở DevTools Network trên 1 trang thật, xem kích thước file JS chính được tải về là bao nhiêu KB/MB.","So sánh kích thước bundle giữa build production và dev mode, giải thích sự khác biệt.","Ghi lại thời gian tải trang hiển thị trong tab Network trước khi tối ưu, làm mốc so sánh."]},
{label:'Thứ 3', title:'Lazy load route với dynamic import', content:'Vue Router hỗ trợ sẵn lazy loading chỉ bằng cách thay import tĩnh bằng dynamic import trong khai báo route component. Khi build, Vite tự động tách route đó thành 1 chunk riêng, chỉ tải khi người dùng thực sự vào route đó.', example:'// Thay vì:\nimport SettingsView from "./SettingsView.vue";\n// Dùng:\nconst SettingsView = () => import("./SettingsView.vue");', exercises:["Chuyển 2 route ít dùng trong project sang lazy load bằng dynamic import.","Xác nhận trong build output (thư mục dist) thực sự xuất hiện file chunk riêng cho route vừa lazy load.","Thử lazy load thêm 1 route thứ 3, đo lại tổng kích thước bundle chính đã giảm bao nhiêu."]},
{label:'Thứ 4', title:'defineAsyncComponent cho component thường', content:'Với các component KHÔNG phải route (ví dụ 1 modal nặng, 1 chart phức tạp chỉ hiện khi người dùng bấm nút), dùng defineAsyncComponent để lazy load tương tự, kèm tùy chọn loadingComponent hiển thị trong lúc chờ tải.', example:'const HeavyChart = defineAsyncComponent(() =>\n  import("./HeavyChart.vue")\n);', exercises:["Tìm 1 component nặng trong project chỉ hiện có điều kiện (ví dụ modal), chuyển sang defineAsyncComponent.","Thêm 1 loadingComponent đơn giản (ví dụ spinner) hiển thị trong lúc defineAsyncComponent đang tải.","Thử xử lý trường hợp lỗi khi component async load thất bại."]},
{label:'Thứ 5', title:'Lazy load ảnh & IntersectionObserver', content:'Với hình ảnh, thuộc tính loading="lazy" của thẻ img đã được hầu hết trình duyệt hiện đại hỗ trợ sẵn, không cần thư viện. Với các trường hợp phức tạp hơn, IntersectionObserver cho phép tự viết logic "chỉ tải khi phần tử sắp xuất hiện trong màn hình".', example:'<img src="photo.jpg" loading="lazy" alt="..." />', exercises:["Thêm loading=\"lazy\" vào các thẻ img trong 1 trang có nhiều ảnh, so sánh Network tab trước/sau khi cuộn trang.","Thử đặt thuộc tính width/height cho ảnh có loading=\"lazy\" để tránh layout shift khi ảnh tải xong.","Tìm 1 ví dụ thực tế (không phải ảnh) có thể áp dụng IntersectionObserver, ví dụ animation chỉ chạy khi cuộn tới."]},
{label:'Thứ 6', title:'Đo lường & áp dụng thực tế', content:'Lighthouse chấm điểm Performance dựa trên các chỉ số như First Contentful Paint, Time to Interactive. Luôn đo TRƯỚC khi tối ưu để có baseline so sánh, rồi đo lại SAU khi áp dụng lazy loading để xác nhận thực sự cải thiện, không chỉ đoán.', exercises:["Chạy Lighthouse trên 1 trang của AWX Refiner trước và sau khi áp dụng lazy loading cho ít nhất 1 route, so sánh điểm Performance.","So sánh điểm Lighthouse Performance trước/sau, ghi lại chênh lệch cụ thể.","Viết 1 đoạn tóm tắt ngắn về những gì đã tối ưu trong tuần, dùng làm ghi chú cho code review sau này."]},
]},
{title:"Virtual DOM & thuật toán diffing", points:["Virtual DOM là cây object JS đại diện cho DOM thật, giúp so sánh (diff) rẻ hơn thao tác DOM trực tiếp.","Vue 3 dùng thuật toán diff tối ưu hơn Vue 2 nhờ compile-time hints (patch flag).","key trong v-for giúp Vue nhận diện đúng phần tử khi list thay đổi, tránh render sai.","Không phải lúc nào Virtual DOM cũng nhanh hơn thao tác DOM trực tiếp — nó đánh đổi để dễ maintain.","Hiểu cơ chế này giải thích tại sao thiếu key gây bug re-render kỳ lạ."], practice:"Tạo 1 danh sách 20 item render bằng v-for, thử đổi thứ tự index làm key rồi dùng Vue Devtools quan sát component nào bị re-render không cần thiết.", case:"Bug UI 'nhảy lung tung' khi xóa/thêm item giữa danh sách gần như luôn bắt nguồn từ dùng sai key trong v-for — lỗi rất phổ biến khi review code frontend.", task:"Tìm 1 chỗ dùng v-for trong code hiện tại thiếu key hoặc dùng index làm key, đánh giá rủi ro và sửa nếu cần."},
{title:"CSS Architecture", points:["BEM (Block Element Modifier) đặt tên class theo cấu trúc rõ ràng, tránh xung đột style.","Utility-first (như TailwindCSS) ưu tiên compose class nhỏ thay vì viết CSS riêng.","Scoped style trong Vue SFC tự động giới hạn phạm vi CSS theo component.","CSS Variables giúp theming động (dark mode, design token) mà không cần build lại.","Kiến trúc CSS nên nhất quán toàn dự án, tránh trộn lẫn nhiều cách đặt tên."], practice:"Chọn 1 trang bất kỳ, viết lại toàn bộ CSS theo đúng 1 quy ước (BEM hoặc utility-first) từ đầu đến cuối, không trộn lẫn.", case:"Dự án có nhiều dev cùng viết CSS mà không theo quy ước chung thường dẫn đến !important tràn lan và CSS ngày càng khó bảo trì — vấn đề rất thực tế ở các team frontend lớn.", task:"Xem lại 1 file .vue trong dự án, đánh giá style đang theo quy ước nào và có nhất quán với phần còn lại không."},
{title:"Accessibility (a11y) cơ bản cho SPA", points:["Dùng đúng thẻ HTML ngữ nghĩa (button, nav, header) thay vì div/span cho mọi thứ.","Mọi input cần có label liên kết (for/id hoặc aria-label).","Đảm bảo tương phản màu đủ để người khiếm thị màu vẫn đọc được.","Hỗ trợ điều hướng bằng bàn phím (Tab, Enter, Esc) cho modal, dropdown.","aria-* attributes bổ sung ngữ nghĩa cho screen reader khi HTML thuần không đủ."], practice:"Audit 1 trang bất kỳ bằng Lighthouse Accessibility score, sửa ít nhất 3 vấn đề nó chỉ ra (thiếu label, contrast thấp...).", case:"Nhiều công ty (đặc biệt khách hàng doanh nghiệp lớn ở Âu-Mỹ) yêu cầu bắt buộc đạt chuẩn WCAG — thiếu a11y có thể khiến sản phẩm không được duyệt hợp đồng.", task:"Thử điều hướng 1 form trong AWX Refiner chỉ bằng bàn phím (không dùng chuột), ghi lại chỗ nào bị kẹt."},
{title:"Web Security: XSS, CSRF trong ứng dụng FE", points:["XSS xảy ra khi input người dùng được render thẳng thành HTML/JS mà không escape.","Vue tự động escape nội dung trong {{ }}, nhưng v-html thì không — cẩn thận khi dùng.","CSRF lợi dụng session đã login để gửi request giả mạo.","CSRF token hoặc SameSite cookie là cách phòng chống phổ biến.","Không bao giờ tin dữ liệu từ client, kể cả khi đã validate ở FE."], practice:"Viết 1 đoạn demo nhỏ: hiển thị input người dùng bằng v-html với nội dung chứa thẻ script, quan sát hành vi, sau đó sửa lại an toàn bằng cách escape hoặc dùng thư viện sanitize (DOMPurify).", case:"Các cuộc pentest bảo mật ở doanh nghiệp thường tìm chính xác các điểm dùng v-html không kiểm soát — đây là lỗ hổng XSS kinh điển vẫn xuất hiện trong code thực tế.", task:"Tìm trong dự án chỗ nào đang dùng v-html, kiểm tra dữ liệu đưa vào có được sanitize không."},
{title:"HTTP caching & network optimization", points:["Cache-Control header quyết định trình duyệt lưu cache bao lâu, khi nào phải revalidate.","ETag giúp server trả 304 Not Modified nếu nội dung không đổi, tiết kiệm băng thông.","Gộp nhiều request nhỏ hoặc dùng HTTP/2 multiplexing để giảm overhead.","Debounce/throttle request khi người dùng gõ tìm kiếm liên tục.","Dùng DevTools tab Network để phân tích request nào chậm, request nào lặp không cần thiết."], practice:"Mở DevTools Network trên 1 trang thật, tìm 1 API bị gọi lại nhiều lần không cần thiết khi gõ tìm kiếm, thêm debounce 300ms và đo số lượng request giảm bao nhiêu.", case:"Chi phí server tăng vọt vì frontend gọi API không kiểm soát là vấn đề thực tế nhiều team gặp khi scale — debounce/cache ở FE là cách rẻ nhất để giảm tải backend.", task:"Mở DevTools Network khi thao tác trên AWX Refiner, tìm 1 request có thể debounce hoặc cache lại."},
{title:"TypeScript nâng cao cho FE", points:["Generics cho phép viết hàm/type tái sử dụng với nhiều kiểu dữ liệu mà vẫn type-safe.","Utility types như Partial, Pick, Omit giúp biến đổi type có sẵn mà không viết lại.","Union type và discriminated union giúp mô hình hóa nhiều trạng thái rõ ràng (loading/success/error).","unknown an toàn hơn any vì bắt buộc kiểm tra kiểu trước khi dùng.","Type guard (typeof, in, instanceof) giúp TypeScript thu hẹp kiểu trong từng nhánh code."], practice:"Viết 1 type ApiState<T> gồm 3 nhánh {status:'loading'} | {status:'success',data:T} | {status:'error',message:string} và áp dụng cho 1 component gọi API thật.", case:"Codebase TypeScript lớn thường có bug ở chỗ dùng any để 'cho qua' lỗi compiler — dần dà mất hết lợi ích type-safety; không lạm dụng any là kỹ năng phân biệt dev giỏi và dev thường.", task:"Viết 1 type union cho trạng thái gọi API (loading | success | error) và áp dụng vào 1 component thực tế."},
{title:"Testing FE với Vitest", points:["Unit test kiểm tra 1 đơn vị logic nhỏ (function, composable) độc lập với UI.","Component test kiểm tra component render đúng, phản ứng đúng với sự kiện người dùng.","Vitest tích hợp tốt với Vite, cú pháp gần giống Jest.","Mock API call khi test để không phụ thuộc vào backend thật.","Test không cần phủ 100%, ưu tiên phần logic quan trọng và dễ vỡ khi refactor."], practice:"Viết 3 test case cho 1 function util (ví dụ formatCurrency): 1 case input hợp lệ, 1 case edge case (số 0/âm), 1 case input không hợp lệ.", case:"Trong CI/CD chuyên nghiệp, PR không có test cho logic quan trọng thường bị reviewer từ chối merge — viết test là kỹ năng bắt buộc, không phải tùy chọn.", task:"Viết 1 unit test đơn giản cho 1 composable hoặc function util hiện có trong dự án."},
{title:"Build tools: Vite", points:["Vite dùng ES Module native trong dev, khởi động nhanh hơn Webpack truyền thống.","Tree-shaking loại bỏ code không dùng tới khi build production.","Chia chunk hợp lý giúp trình duyệt cache hiệu quả hơn khi deploy version mới.","Plugin Vite mở rộng khả năng xử lý (SVG, i18n, compress ảnh...).","Phân biệt rõ config cho dev và production trong vite.config.js."], practice:"Chạy build production (vite build), dùng plugin rollup-plugin-visualizer để xem chunk nào nặng nhất, đề xuất cách giảm.", case:"Bundle size tăng dần theo thời gian là vấn đề âm thầm ở dự án lâu năm — định kỳ phân tích bundle là việc senior FE dev thường làm trước mỗi release lớn.", task:"Xem file vite.config trong dự án, liệt kê các plugin đang dùng và tác dụng của từng cái."},
{title:"Browser rendering pipeline", points:["Trình duyệt xử lý qua các bước: Parse HTML/CSS → Style → Layout → Paint → Composite.","Thay đổi CSS ảnh hưởng layout (width, height) tốn kém hơn thay đổi chỉ ảnh hưởng paint (color).","transform và opacity được tối ưu bởi GPU, nên ưu tiên dùng cho animation.","Reflow hàng loạt do đọc/ghi DOM xen kẽ gây giật lag — nên gộp (batch) lại.","Hiểu pipeline này giải thích tại sao animate width lại giật hơn animate transform."], practice:"Tạo 1 animation di chuyển 1 box bằng cách đổi thuộc tính 'left' (gây reflow), đo FPS bằng Performance tab, sau đó đổi sang 'transform: translateX' và so sánh FPS.", case:"Animation giật lag trên thiết bị yếu thường do đổi sai thuộc tính CSS (layout-triggering thay vì composite-only) — lỗi performance cổ điển hay bị hỏi khi phỏng vấn senior FE.", task:"Tìm 1 chỗ trong CSS/animation của dự án đang animate thuộc tính gây reflow (width, top...), đề xuất đổi sang transform."},
{title:"Web APIs nâng cao", points:["IntersectionObserver phát hiện phần tử xuất hiện trong viewport, dùng cho lazy load, infinite scroll.","Web Worker chạy JS ở luồng riêng, không block UI khi xử lý nặng.","ResizeObserver theo dõi thay đổi kích thước phần tử mà không cần lắng nghe resize toàn trang.","localStorage/sessionStorage lưu dữ liệu phía client, khác nhau về vòng đời.","Các API này giúp giảm tải cho main thread và cải thiện trải nghiệm người dùng."], practice:"Cài đặt infinite scroll đơn giản bằng IntersectionObserver cho 1 danh sách dài (fetch thêm data khi cuộn đến cuối).", case:"Các bảng dữ liệu lớn trong dashboard quản trị (model list, log list...) gần như luôn cần phân trang hoặc infinite scroll để không load hết dữ liệu cùng lúc gây treo trang.", task:"Nghĩ 1 tính năng trong AWX Refiner có thể hưởng lợi từ IntersectionObserver (ví dụ infinite scroll danh sách model)."},
{title:"Design patterns trong FE", points:["Observer pattern: component lắng nghe và phản ứng khi state thay đổi (nền tảng của reactivity).","Factory pattern: hàm tạo ra component/object khác nhau dựa trên điều kiện đầu vào.","Singleton: đảm bảo chỉ có 1 instance duy nhất (ví dụ 1 instance axios dùng chung toàn app).","Provide/Inject trong Vue là dạng Dependency Injection, tránh truyền props qua nhiều tầng.","Nhận diện pattern giúp đọc hiểu code người khác nhanh hơn, không phải để áp dụng máy móc."], practice:"Refactor 1 chỗ đang truyền props qua 2-3 tầng component sang dùng provide/inject, so sánh độ rõ ràng của code trước/sau.", case:"'Prop drilling' là code smell rất phổ biến trong codebase Vue lớn tuổi — nhận diện và refactor đúng lúc là kỹ năng phân biệt code sạch và code rối.", task:"Tìm 1 chỗ trong dự án đang truyền props qua 3+ tầng component, đánh giá có nên dùng provide/inject không."},
{title:"SSR vs CSR vs SSG", points:["CSR: trình duyệt tải JS rồi mới render — SEO kém, first paint chậm hơn.","SSR: server render HTML sẵn, tốt cho SEO và tốc độ tải đầu.","SSG: build sẵn HTML tĩnh lúc build time, nhanh nhất nhưng không hợp nội dung động.","Nuxt.js là framework phổ biến để làm SSR/SSG cho Vue.","Chọn hướng nào phụ thuộc yêu cầu SEO và tần suất thay đổi nội dung, không có hướng nào tốt hơn tuyệt đối."], practice:"Dựng thử 1 project Nuxt nhỏ (npx nuxi init), so sánh view-source của trang CSR thuần và trang SSR Nuxt để thấy khác biệt HTML trả về.", case:"Landing page hoặc trang blog của sản phẩm SaaS thường cần SSR/SSG để lên Google tốt, trong khi phần dashboard sau đăng nhập (như AWX Refiner) vẫn dùng CSR vì không cần SEO.", task:"AWX Refiner hiện là CSR — thử nghĩ xem có phần nào (landing page, docs) sẽ hưởng lợi nếu chuyển sang SSR/SSG."},
{title:"Micro-frontend là gì, khi nào cần", points:["Micro-frontend chia 1 ứng dụng lớn thành nhiều phần độc lập, có thể phát triển/deploy riêng.","Phù hợp với team lớn, nhiều nhóm cùng làm trên 1 sản phẩm mà không muốn đụng code nhau.","Module Federation (Webpack 5) là kỹ thuật phổ biến để chia sẻ code giữa các micro-frontend.","Đánh đổi: phức tạp hơn về hạ tầng, cần đồng bộ version dependency giữa các phần.","Không nên áp dụng cho dự án nhỏ hoặc team nhỏ — độ phức tạp không đáng."], practice:"Đọc 1 case study thực tế về micro-frontend (ví dụ của Spotify hoặc IKEA), tóm tắt lại lý do họ chọn kiến trúc này bằng 3-4 câu.", case:"Micro-frontend chỉ thực sự đáng đầu tư khi có nhiều team lớn (50+ dev) làm cùng 1 sản phẩm — với quy mô nhỏ hơn, chi phí phức tạp thường lớn hơn lợi ích.", task:"Viết vài dòng nhận định xem AWX Refiner có đang ở quy mô cần micro-frontend hay chưa, vì sao."},
{title:"Progressive Web App (PWA) cơ bản", points:["PWA là web app có thể cài đặt như app native, hoạt động offline nhờ Service Worker.","Service Worker là script chạy nền, can thiệp vào network request để cache tài nguyên.","manifest.json khai báo icon, tên app, màu theme khi cài lên màn hình chính.","PWA phù hợp cho ứng dụng cần dùng offline hoặc muốn trải nghiệm giống app di động.","Không phải app nào cũng cần PWA — cân nhắc dựa trên nhu cầu người dùng thực tế."], practice:"Thêm 1 file manifest.json cơ bản và 1 Service Worker đơn giản (cache 1 vài file tĩnh) vào 1 project demo, thử tắt mạng và load lại trang.", case:"Ứng dụng thương mại điện tử hoặc tin tức thường dùng PWA để giữ chân người dùng ở khu vực mạng yếu — đây là bài toán thực tế PWA giải quyết tốt.", task:"Thử mở 1 web PWA quen thuộc trên điện thoại, quan sát cách nó hoạt động khi mất mạng."},
{title:"Debugging & performance profiling", points:["Tab Performance trong DevTools ghi lại timeline render, giúp tìm hàm nào tốn thời gian nhất.","Vue Devtools extension giúp xem component tree, props, state real-time.","console.time/console.timeEnd đo nhanh thời gian chạy 1 đoạn code cụ thể.","Memory tab giúp phát hiện memory leak (component không được garbage collect sau khi unmount).","Luôn đo trước khi tối ưu — đừng đoán chỗ nào chậm mà không có số liệu."], practice:"Ghi lại 1 đoạn Performance timeline khi thao tác 1 trang có danh sách dài, tìm hàm nào chiếm 'Self time' nhiều nhất trong flame chart.", case:"Khi người dùng report 'trang bị đơ', bước đầu tiên của FE dev chuyên nghiệp luôn là mở Performance tab để có số liệu cụ thể, thay vì đoán mò.", task:"Dùng tab Performance ghi lại 1 thao tác trong AWX Refiner cảm thấy chậm, xem hàm nào chiếm nhiều thời gian nhất."},
{title:"Code review & clean code cho FE", points:["Đặt tên biến/hàm rõ nghĩa quan trọng hơn viết comment giải thích code khó hiểu.","1 hàm nên làm 1 việc — nếu tên hàm có chữ \"and\" thường là dấu hiệu nên tách nhỏ.","Khi review code người khác, hỏi \"tại sao\" trước khi hỏi \"sao không làm cách khác\".","Convention nhất quán quan trọng hơn convention \"đúng nhất\" về lý thuyết.","Refactor an toàn khi có test bảo vệ — nếu chưa có test, cẩn trọng hơn khi đổi cấu trúc."], practice:"Chọn 1 hàm dài hơn 30 dòng trong 1 project, refactor tách thành 2-3 hàm nhỏ hơn, mỗi hàm có 1 trách nhiệm rõ ràng.", case:"Code review ở môi trường chuyên nghiệp thường xoay quanh việc đặt tên và tách hàm hợp lý hơn là style cá nhân — kỹ năng ảnh hưởng trực tiếp đến việc code có được approve nhanh hay không.", task:"Tự review lại 1 đoạn code bạn viết tuần trước, tìm 1 chỗ có thể đặt tên rõ hơn hoặc tách nhỏ hàm."},
{title:"Nuxt.js tổng quan", points:["Nuxt là framework xây trên Vue, hỗ trợ sẵn SSR/SSG, routing tự động theo cấu trúc thư mục.","File-based routing: mỗi file trong pages/ tự động thành 1 route, không cần khai báo thủ công.","Nuxt cung cấp sẵn tối ưu SEO (meta tag động) dễ dàng hơn so với tự cấu hình Vue CSR.","useFetch/useAsyncData là composable đặc trưng của Nuxt để fetch dữ liệu tương thích SSR.","Nuxt phù hợp khi dự án cần SEO tốt hoặc muốn giảm cấu hình thủ công so với Vue CLI/Vite thuần."], practice:"Tạo 1 trang trong Nuxt project demo, dùng useFetch để lấy dữ liệu từ 1 API công khai (ví dụ JSONPlaceholder), kiểm tra view-source thấy dữ liệu đã có sẵn trong HTML.", case:"Các công ty chuyển từ Vue CSR sang Nuxt thường vì lý do SEO hoặc muốn giảm thời gian cấu hình routing/build thủ công.", task:"Đọc qua tài liệu Nuxt, so sánh cấu trúc thư mục pages/ với cách tổ chức route hiện tại của AWX Refiner."},
{title:"Pinia nâng cao: plugin & persisted state", points:["Pinia hỗ trợ plugin để mở rộng hành vi cho mọi store (ví dụ tự động lưu localStorage).","pinia-plugin-persistedstate giúp giữ state qua lần reload trang mà không cần tự viết logic lưu/khôi phục.","Có thể subscribe vào store ($subscribe) để lắng nghe mọi thay đổi state, hữu ích cho logging/debug.","Composing nhiều store với nhau cần cẩn thận tránh phụ thuộc vòng.","Không phải state nào cũng cần persist — chỉ nên lưu những gì thực sự cần giữ qua phiên làm việc."], practice:"Thêm pinia-plugin-persistedstate vào 1 store, chọn 1 field (ví dụ filter đang chọn) để tự động lưu qua localStorage, test bằng cách reload trang.", case:"Tính năng 'giữ nguyên bộ lọc sau khi F5' là yêu cầu UX rất hay gặp trong các dashboard quản trị — pattern này giải quyết gọn bằng persisted state.", task:"Xác định 1 state trong AWX Refiner nên được giữ lại sau khi reload trang (ví dụ filter đang chọn), thử áp dụng persisted state."},
{title:"Web Components & Custom Elements", points:["Web Components là chuẩn trình duyệt cho phép tạo custom HTML tag tái sử dụng, độc lập framework.","Shadow DOM đóng gói style/markup của component, tránh xung đột CSS với trang cha.","Có thể dùng Web Components bên trong Vue, hữu ích khi cần chia sẻ UI giữa nhiều dự án khác framework.","Web Components chạy được ở bất kỳ nơi nào hỗ trợ HTML/JS chuẩn, không cần build riêng.","Đánh đổi: cú pháp và tooling kém tiện hơn Vue component thông thường."], practice:"Tạo 1 custom element đơn giản (ví dụ my-badge) bằng Web Components API thuần (customElements.define), nhúng thử vào 1 trang HTML bất kỳ.", case:"Design system dùng chung giữa nhiều dự án khác framework (Vue, React, Angular) đôi khi được xây bằng Web Components để không phụ thuộc framework cụ thể.", task:"Thử tạo 1 custom element đơn giản bằng Web Components API thuần, không dùng framework."},
{title:"GraphQL vs REST từ góc nhìn Frontend", points:["REST trả về cấu trúc dữ liệu cố định theo endpoint; GraphQL cho phép client tự chọn field cần lấy.","GraphQL giúp giảm over-fetching/under-fetching dữ liệu so với REST truyền thống.","REST đơn giản hơn để cache (theo URL); GraphQL cần thư viện riêng (Apollo Client, urql) để cache hiệu quả.","Chọn GraphQL hợp lý khi UI phức tạp cần dữ liệu từ nhiều nguồn; REST vẫn đủ tốt cho hầu hết CRUD đơn giản.","Không cần đổi toàn bộ hệ thống — có thể đánh giá theo từng tính năng cụ thể cần loại API nào."], practice:"Viết thử 1 GraphQL query giả định lấy đúng 3 field cần thiết cho 1 màn hình cụ thể, so sánh với response JSON đầy đủ mà REST API tương ứng trả về.", case:"Ứng dụng mobile với băng thông hạn chế thường được nhắc tới như lý do điển hình để chọn GraphQL thay vì REST, vì giảm dữ liệu thừa truyền qua mạng.", task:"So sánh 1 API REST đang dùng trong AWX Refiner với cách nó sẽ trông như thế nào nếu viết bằng GraphQL query."},
];

/* ============ JAVA BACKEND TRACK — 24 TUẦN / 6 THÁNG ============ */
const beWeeks = [
{title:"Java cơ bản: cú pháp, kiểu dữ liệu, biến", points:["Java là ngôn ngữ biên dịch — code .java được compile thành bytecode .class chạy trên JVM.","Kiểu dữ liệu nguyên thủy (int, double, boolean, char...) khác với kiểu tham chiếu (String, Object).","Biến phải khai báo kiểu rõ ràng (static typing), không suy luận linh hoạt như JavaScript.","Java phân biệt hoa thường; mỗi file .java có class public phải trùng tên file.","Câu lệnh điều kiện (if/else, switch) và vòng lặp (for/while) khá giống JS về cú pháp."], practice:"Viết chương trình nhận 2 số từ bàn phím (Scanner), in ra tổng, hiệu, tích, thương.", case:"Hầu hết hệ thống backend doanh nghiệp (ngân hàng, bảo hiểm) vẫn chạy Java vì tính ổn định và hệ sinh thái enterprise lâu đời — nắm vững cú pháp cơ bản là bước đầu bắt buộc.", task:"Cài JDK, viết chương trình Java đầu tiên in ra \"Hello World\" và 1 phép tính đơn giản, chạy bằng javac rồi java.", days:[
{label:'Thứ 2', title:'Cài đặt môi trường & chương trình đầu tiên', content:'JDK bao gồm compiler (javac) biên dịch file .java thành bytecode .class, và JVM (java) chạy bytecode đó. Mỗi file .java chứa 1 class public phải trùng tên file (ví dụ Main.java chứa class Main). Điểm vào chương trình luôn là method public static void main(String[] args).', example:'public class Main {\n  public static void main(String[] args) {\n    System.out.println("Hello World");\n  }\n}', exercises:["Cài JDK, viết và chạy chương trình Hello World bằng lệnh javac Main.java rồi java Main.","Thử đổi tên class trong file .java khác với tên file, quan sát lỗi compiler báo gì.","Viết thêm 1 dòng in ra kết quả phép tính ngay trong cùng chương trình Hello World."]},
{label:'Thứ 3', title:'Kiểu dữ liệu & biến', content:'Kiểu nguyên thủy (int, double, boolean, char, long...) lưu trực tiếp giá trị. Kiểu tham chiếu (String, class tự định nghĩa, mảng...) lưu địa chỉ tham chiếu đến object trong heap. Java là static typing — kiểu của biến phải khai báo rõ và không đổi được sau đó, khác JS/TS linh hoạt hơn.', example:'int age = 25;\ndouble price = 19.99;\nString name = "AWX";\nboolean isActive = true;', exercises:["Khai báo 5 biến với 5 kiểu dữ liệu khác nhau, in giá trị của chúng ra console.","Thử gán 1 giá trị double vào biến int, quan sát lỗi compiler báo gì và giải thích tại sao.","Tra cứu kích thước bộ nhớ (byte) của từng kiểu dữ liệu (int=4 byte, double=8 byte...)."]},
{label:'Thứ 4', title:'Toán tử & câu lệnh điều kiện', content:'Java hỗ trợ đầy đủ toán tử số học (+,-,*,/,%), so sánh (==, !=, >, <), logic (&&, ||, !) — cú pháp gần giống JavaScript. if/else if/else xử lý rẽ nhánh; switch phù hợp khi so sánh 1 biến với nhiều giá trị cụ thể, tránh chuỗi if-else dài.', example:'int score = 85;\nif (score >= 90) System.out.println("A");\nelse if (score >= 70) System.out.println("B");\nelse System.out.println("C");', exercises:["Viết chương trình nhập điểm (0-100), in ra xếp loại A/B/C/D dùng if-else.","Viết thêm 1 chương trình dùng switch-case thay vì if-else cho cùng bài toán xếp loại điểm.","Thử kết hợp nhiều điều kiện bằng && và || trong 1 câu if, ví dụ kiểm tra điểm nằm trong khoảng cụ thể."]},
{label:'Thứ 5', title:'Vòng lặp & mảng cơ bản', content:'for phù hợp khi biết trước số lần lặp; while/do-while phù hợp khi điều kiện dừng phụ thuộc logic runtime. Mảng trong Java có kích thước cố định khi khai báo (int[] arr = new int[5];), khác với Array linh hoạt của JS.', example:'int[] scores = {80, 90, 75, 60};\nint sum = 0;\nfor (int i = 0; i < scores.length; i++) {\n  sum += scores[i];\n}', exercises:["Viết chương trình tính tổng và trung bình cộng của 1 mảng điểm số cho sẵn.","Viết thêm chương trình tìm giá trị lớn nhất/nhỏ nhất trong mảng bằng vòng lặp.","Thử dùng vòng lặp for-each thay vì for thường để duyệt mảng, so sánh cú pháp."]},
{label:'Thứ 6', title:'Áp dụng thực tế: chương trình tổng hợp', content:'Kết hợp toàn bộ kiến thức tuần này: khai báo biến, nhập dữ liệu, dùng vòng lặp và điều kiện để xử lý logic thực tế — bài tổng hợp giúp kiểm tra bạn đã nắm chắc nền tảng trước khi bước vào OOP tuần sau.', exercises:["Viết chương trình nhập vào 1 mảng điểm số (dùng Scanner), tính điểm trung bình, và phân loại học lực (Giỏi/Khá/Trung bình/Yếu) dựa trên điểm trung bình đó.","Mở rộng chương trình: cho phép nhập số lượng điểm số tùy ý, dùng mảng kích thước động hoặc ArrayList nếu đã biết.","Viết thêm phần xử lý khi người dùng nhập điểm không hợp lệ (âm hoặc quá lớn)."]},
]},
{title:"OOP: Class & Object", points:["Class là khuôn mẫu định nghĩa thuộc tính (field) và hành vi (method) của object.","Object là thực thể cụ thể được tạo ra từ class bằng từ khóa new.","Constructor là method đặc biệt chạy khi tạo object, dùng để khởi tạo giá trị ban đầu.","Access modifier (private, public, protected) kiểm soát phạm vi truy cập field/method.","Getter/Setter là cách phổ biến để truy cập field private một cách có kiểm soát (encapsulation)."], practice:"Viết class BankAccount với field balance, method deposit()/withdraw() có kiểm tra số dư âm.", case:"Encapsulation (field private + getter/setter) là yêu cầu tối thiểu trong mọi code review Java chuyên nghiệp — lộ field public trực tiếp gần như luôn bị từ chối merge.", task:"Viết class Model (giống khái niệm model trong AWX Refiner) với vài field private, constructor, getter/setter, rồi tạo vài object thử.", days:[
{label:'Thứ 2', title:'Class là gì, vì sao cần OOP', content:'Lập trình hướng đối tượng (OOP) mô hình hóa dữ liệu và hành vi liên quan thành các "đối tượng" thay vì viết hàm và biến rời rạc (procedural). Class là bản thiết kế (blueprint) định nghĩa object sẽ có field (dữ liệu) và method (hành vi) gì. Lợi ích chính: dữ liệu và logic liên quan được nhóm lại, dễ tái sử dụng và mở rộng hơn.', exercises:["Nghĩ về 1 khái niệm thực tế (ví dụ Xe hơi, Tài khoản ngân hàng), liệt kê nó nên có field gì và method gì nếu mô hình hóa thành class.","Viết thêm 1 class khác (ví dụ Book: title, author) áp dụng cùng cách tư duy vừa học.","So sánh cách bạn sẽ viết class này bằng procedural để thấy rõ khác biệt với OOP."]},
{label:'Thứ 3', title:'Field & Constructor', content:'Field là biến khai báo trong class, đại diện cho dữ liệu của mỗi object. Constructor là method đặc biệt cùng tên với class, được gọi tự động khi tạo object bằng từ khóa new, dùng để khởi tạo giá trị ban đầu cho field.', example:'public class Account {\n  private double balance;\n  public Account(double initialBalance) {\n    this.balance = initialBalance;\n  }\n}', exercises:["Viết class Account với field balance và constructor nhận initialBalance, tạo thử 2 object Account với số dư khác nhau.","Thêm 1 constructor thứ 2 không tham số (default constructor) khởi tạo balance = 0.","Tạo 3 object Account khác nhau, in ra balance của từng object để xác nhận chúng độc lập với nhau."]},
{label:'Thứ 4', title:'Access modifier & Encapsulation', content:'private giới hạn field/method chỉ truy cập được trong chính class đó — đây là cách thực hành encapsulation chuẩn: field luôn private, truy cập từ bên ngoài thông qua getter/setter có kiểm soát (setter có thể validate dữ liệu trước khi gán).', example:'public double getBalance() { return balance; }\npublic void deposit(double amount) {\n  if (amount > 0) balance += amount;\n}', exercises:["Thêm method deposit()/withdraw() vào class Account, đảm bảo withdraw() không cho phép rút quá số dư hiện có.","Thử bỏ private đi (đổi thành public) để quan sát field bị sửa trực tiếp từ bên ngoài — rồi khôi phục lại private.","Thêm validate cho constructor: không cho phép khởi tạo balance âm ngay từ đầu."]},
{label:'Thứ 5', title:'this keyword & Method Overloading', content:'this dùng để tham chiếu đến chính object hiện tại, thường dùng khi tên tham số trùng tên field. Method Overloading cho phép nhiều method cùng tên nhưng khác tham số (số lượng hoặc kiểu) — Java tự chọn đúng method dựa trên tham số truyền vào lúc gọi.', example:'public void deposit(double amount) { this.balance += amount; }\npublic void deposit(double amount, String note) { /* ... */ }', exercises:["Viết 2 phiên bản overload của method deposit() — 1 bản chỉ nhận amount, 1 bản nhận thêm ghi chú giao dịch.","Viết 1 method overload thứ 3 (ví dụ deposit không tham số, nạp mặc định 1 khoản cố định).","Giải thích bằng lời sự khác nhau giữa Method Overloading và việc chỉ đổi tên hàm khác nhau."]},
{label:'Thứ 6', title:'Áp dụng thực tế & hoàn thiện BankAccount', content:'Ghép toàn bộ kiến thức tuần này thành 1 class hoàn chỉnh, thể hiện đúng encapsulation: field private, constructor khởi tạo hợp lệ, method public có kiểm tra điều kiện trước khi thay đổi state — tiêu chuẩn tối thiểu mọi class Java trong code review chuyên nghiệp.', exercises:["Hoàn thiện class BankAccount đầy đủ: field private balance, constructor, deposit(), withdraw() có validate, getBalance(). Viết đoạn code test thử: nạp tiền, rút tiền hợp lệ, rút tiền vượt số dư.","Viết thêm method transferTo(Account other, double amount) chuyển tiền giữa 2 object Account.","Viết đoạn code test đầy đủ: tạo 2 account, chuyển tiền giữa chúng, in ra số dư cuối cùng."]},
]},
{title:"Kế thừa & Đa hình", points:["extends cho phép 1 class kế thừa field/method từ class cha, tránh lặp code.","Đa hình cho phép gọi cùng 1 method nhưng hành vi khác nhau tùy class con.","@Override đánh dấu method con ghi đè method cha, giúp compiler kiểm tra lỗi.","super() gọi constructor của class cha từ class con.","Đa hình hữu ích khi xử lý danh sách nhiều loại object khác nhau qua cùng 1 kiểu cha."], practice:"Viết class Shape cha, các class con Circle/Square override method calculateArea(), tính tổng diện tích của 1 danh sách Shape hỗn hợp.", case:"Đa hình là nền tảng của các framework enterprise Java (Spring xử lý mọi bean qua interface) — hiểu sai đa hình khiến rất khó đọc hiểu code Spring sau này.", task:"Tạo class cha Animal và 2 class con Dog, Cat override method makeSound(), thử gọi qua 1 mảng kiểu Animal.", days:[
{label:'Thứ 2', title:'extends — kế thừa cơ bản', content:'extends cho phép 1 class con thừa hưởng toàn bộ field/method public và protected từ class cha, tránh viết lại code trùng lặp. Class con có thể thêm field/method riêng, hoặc ghi đè (override) hành vi của class cha khi cần khác biệt.', example:'public class Animal {\n  protected String name;\n  public void eat() { System.out.println(name + " is eating"); }\n}\npublic class Dog extends Animal { }', exercises:["Viết class Animal với field name và method eat(), tạo class Dog extends Animal, thử gọi eat() từ object Dog.","Thêm field tuổi (age) vào Animal, thử truy cập field đó từ object Dog để xác nhận kế thừa hoạt động đúng.","Thử khai báo field private (thay vì protected) ở Animal, quan sát Dog có truy cập được không."]},
{label:'Thứ 3', title:'@Override & super()', content:'@Override đánh dấu rõ ràng method này ghi đè method của class cha — nếu tên/tham số không khớp chính xác, compiler báo lỗi ngay thay vì âm thầm tạo ra 1 method mới không liên quan. super() gọi constructor của class cha, thường ở dòng đầu tiên trong constructor của class con.', example:'public class Dog extends Animal {\n  public Dog(String name) { super(); this.name = name; }\n  @Override\n  public void eat() { System.out.println(name + " is eating dog food"); }\n}', exercises:["Viết class Dog và Cat cùng extends Animal, mỗi class override method makeSound() với âm thanh khác nhau.","Thêm class con thứ 3 (ví dụ Bird) cũng override makeSound().","Thử KHÔNG gọi super() trong constructor của Dog, quan sát điều gì xảy ra."]},
{label:'Thứ 4', title:'Đa hình runtime (Polymorphism)', content:'Đa hình cho phép 1 biến khai báo kiểu cha (Animal) nhưng trỏ tới object của bất kỳ class con nào (Dog, Cat), và khi gọi method, Java tự động chạy đúng phiên bản override của class con thực sự tại runtime — gọi là dynamic dispatch.', example:'Animal[] animals = { new Dog("Rex"), new Cat("Mimi") };\nfor (Animal a : animals) { a.makeSound(); } // gọi đúng version của từng loại', exercises:["Tạo 1 mảng Animal chứa cả Dog và Cat, dùng vòng lặp gọi makeSound() cho từng phần tử, quan sát mỗi object gọi đúng version override của nó.","Thêm 1 method mới trong Animal (ví dụ move()) mà KHÔNG override ở class con nào, xác nhận Dog/Cat vẫn dùng chung version của Animal.","Viết thêm vòng lặp tính tổng tuổi của tất cả animal trong mảng."]},
{label:'Thứ 5', title:'instanceof & downcasting', content:'Khi cần gọi method CHỈ có ở class con (không có ở class cha), phải kiểm tra kiểu bằng instanceof trước rồi ép kiểu (downcast) về class con tương ứng. Lạm dụng instanceof/downcast nhiều thường là dấu hiệu thiết kế class chưa tối ưu.', example:'if (animal instanceof Dog) {\n  Dog dog = (Dog) animal;\n  dog.fetch(); // method chỉ Dog mới có\n}', exercises:["Thêm 1 method riêng chỉ Dog có (ví dụ fetch()), viết code dùng instanceof để gọi đúng method đó khi duyệt qua mảng Animal.","Thử dùng instanceof kiểm tra kiểu Cat trong cùng vòng lặp, gọi 1 method riêng của Cat.","Giải thích bằng lời tại sao lạm dụng instanceof/downcast nhiều lần là dấu hiệu thiết kế chưa tối ưu."]},
{label:'Thứ 6', title:'Áp dụng thực tế & tổng kết tuần', content:'Đa hình là nền tảng giúp code linh hoạt: bạn có thể thêm class con mới (ví dụ Bird) mà không cần sửa code đang xử lý mảng Animal — đây chính là nguyên lý Open/Closed trong lập trình hướng đối tượng.', exercises:["Thêm 1 class con mới (ví dụ Bird extends Animal) vào hệ thống đã viết, xác nhận code vòng lặp cũ vẫn chạy đúng mà không cần sửa gì.","Viết thêm 1 method chung trong Animal nhận danh sách animal và in ra thông tin từng con (dùng đa hình, không cần instanceof).","Tổng kết bằng lời: đa hình giúp code linh hoạt hơn cụ thể ở điểm nào trong ví dụ Animal này."]},
]},
{title:"Interface & Abstract class", points:["Interface định nghĩa \"hợp đồng\" các method phải implement, không chứa logic (trước Java 8).","Abstract class có thể chứa cả method đã implement và method trừu tượng chưa implement.","1 class có thể implement nhiều interface nhưng chỉ extends 1 class (abstract hoặc thường).","Interface phù hợp khi muốn định nghĩa khả năng cho nhiều class không liên quan.","Abstract class phù hợp khi các class con có chung 1 phần logic cơ bản."], practice:"Định nghĩa interface PaymentMethod với method pay(amount), implement ở 2 class CreditCardPayment và CashPayment.", case:"Các hệ thống thanh toán thực tế luôn dùng interface để dễ dàng thêm phương thức thanh toán mới (Momo, ZaloPay...) mà không sửa code cũ — đúng nguyên lý Open/Closed.", task:"Định nghĩa interface Trainable với method train(), implement nó ở 2 class khác nhau.", days:[
{label:'Thứ 2', title:'Interface — hợp đồng method', content:'Interface định nghĩa danh sách method mà bất kỳ class nào implement nó BẮT BUỘC phải cung cấp cách triển khai cụ thể — giống như 1 "hợp đồng". Interface (trước Java 8) không chứa logic, chỉ chứa signature của method.', example:'public interface PaymentMethod {\n  void pay(double amount);\n}\npublic class CreditCardPayment implements PaymentMethod {\n  public void pay(double amount) { System.out.println("Paid " + amount + " by card"); }\n}', exercises:["Định nghĩa interface PaymentMethod, implement nó ở 2 class CreditCardPayment và CashPayment với logic pay() khác nhau.","Thêm class thứ 3 implement PaymentMethod (ví dụ BankTransferPayment).","Thử tạo object trực tiếp từ interface để xác nhận Java không cho phép, giải thích tại sao."]},
{label:'Thứ 3', title:'Abstract class', content:'Abstract class nằm giữa class thường và interface: CÓ THỂ chứa method đã implement sẵn (dùng chung cho mọi class con) VÀ method trừu tượng (abstract, bắt buộc class con implement). Không thể tạo object trực tiếp từ abstract class — chỉ dùng làm class cha để kế thừa.', example:'public abstract class Shape {\n  public void describe() { System.out.println("This is a shape"); }\n  public abstract double calculateArea();\n}', exercises:["Viết abstract class Shape với 1 method thường (describe()) và 1 method abstract (calculateArea()), tạo 2 class con Circle/Square implement calculateArea().","Thêm class con thứ 3 (ví dụ Triangle) cũng implement calculateArea().","Thử gọi describe() từ cả 3 class con, xác nhận chúng dùng chung đúng 1 version từ Shape."]},
{label:'Thứ 4', title:'1 class implement nhiều interface', content:'Khác với extends (chỉ kế thừa được 1 class), 1 class có thể implement NHIỀU interface cùng lúc — hữu ích khi 1 object cần đáp ứng nhiều "khả năng" độc lập với nhau.', example:'public class Product implements Comparable<Product>, Sellable {\n  // phải implement method của cả 2 interface\n}', exercises:["Định nghĩa thêm 1 interface thứ 2 (ví dụ Refundable với method refund()), cho 1 class implement cả PaymentMethod lẫn Refundable.","Viết đoạn code xử lý 1 object vừa là PaymentMethod vừa là Refundable, gọi cả 2 method pay() và refund().","Liệt kê thêm 1 khả năng thứ 3 (interface khác) mà 1 class thanh toán trong thực tế có thể cần."]},
{label:'Thứ 5', title:'Interface vs Abstract class — khi nào dùng cái nào', content:'Dùng Interface khi các class không liên quan cần chia sẻ 1 khả năng chung (nhiều loại thanh toán khác nhau đều pay() được). Dùng Abstract class khi các class con có quan hệ "là một loại của" rõ ràng VÀ có phần logic chung có thể dùng lại.', exercises:["Viết ra 1 bảng so sánh ngắn: 3 điểm khác biệt chính giữa Interface và Abstract class, kèm 1 ví dụ thực tế cho mỗi loại.","Áp dụng bảng so sánh vừa viết vào 1 tình huống cụ thể khác ngoài ví dụ Shape/PaymentMethod đã học.","Nghĩ 1 trường hợp có thể dùng CẢ interface lẫn abstract class cùng lúc, giải thích lý do."]},
{label:'Thứ 6', title:'Áp dụng thực tế & tổng kết tháng 1', content:'Các hệ thống thanh toán thực tế luôn dùng interface để dễ dàng thêm phương thức thanh toán mới (Momo, ZaloPay...) mà không cần sửa code xử lý thanh toán đã có — đây là ứng dụng trực tiếp của nguyên lý Open/Closed đã học ở tuần 3.', exercises:["Hoàn thiện hệ thống PaymentMethod: có ít nhất 3 class implement (CreditCard, Cash, và 1 loại tự chọn), viết đoạn code xử lý thanh toán nhận vào PaymentMethod bất kỳ và gọi pay() — xác nhận hoạt động đúng với cả 3 loại.","Viết thêm 1 class Factory đơn giản: nhận vào tên loại thanh toán, trả về đúng object PaymentMethod tương ứng.","Tổng kết tháng 1 Java Backend bằng 3-4 câu: khái niệm nào bạn thấy khó nhất, sẽ ưu tiên ôn lại."]},
]},
{title:"Exception Handling", points:["try/catch/finally xử lý lỗi runtime mà không làm crash toàn chương trình.","Checked exception (bắt buộc catch hoặc khai báo throws) khác unchecked exception (RuntimeException).","finally luôn chạy dù có exception hay không, thường dùng để đóng tài nguyên (file, connection).","Tự định nghĩa custom exception bằng cách extends Exception hoặc RuntimeException.","Không nên catch Exception chung chung rồi bỏ qua — luôn xử lý hoặc log rõ ràng."], practice:"Viết class InsufficientFundsException custom, ném ra khi rút tiền vượt số dư trong ví dụ BankAccount ở tuần 2.", case:"Hệ thống production luôn cần custom exception có message rõ ràng để log lỗi hữu ích — exception chung chung là ác mộng khi debug production.", task:"Viết hàm chia 2 số, ném custom exception khi chia cho 0, và catch xử lý ở nơi gọi."},
{title:"Collections Framework", points:["List (ArrayList, LinkedList) lưu dữ liệu có thứ tự, cho phép trùng lặp.","Set (HashSet, TreeSet) không cho phép trùng lặp; HashSet không đảm bảo thứ tự.","Map (HashMap, TreeMap) lưu cặp key-value, tra cứu theo key rất nhanh (gần O(1) với HashMap).","Chọn cấu trúc dữ liệu phù hợp quan trọng hơn nhớ hết API — hỏi \"cần thứ tự không, cần unique không, cần tra cứu nhanh không\".","Duyệt Collection bằng for-each hoặc Stream API (Java 8+)."], practice:"Dùng HashMap<String,Integer> để đếm số lần xuất hiện của mỗi từ trong 1 đoạn văn bản dài.", case:"Đếm tần suất, group dữ liệu theo key là thao tác cực kỳ phổ biến trong xử lý dữ liệu backend thực tế (thống kê log, báo cáo...).", task:"Dùng HashMap để đếm tần suất xuất hiện của từng ký tự trong 1 chuỗi."},
{title:"String & StringBuilder", points:["String trong Java là immutable — mỗi lần \"sửa\" thực chất tạo object String mới.","Nối chuỗi bằng + trong vòng lặp lớn kém hiệu quả vì tạo nhiều object thừa.","StringBuilder mutable, phù hợp khi cần nối/sửa chuỗi nhiều lần trong vòng lặp.","Các method thường dùng: substring(), split(), trim(); dùng equals() để so sánh nội dung, không dùng ==.","== so sánh tham chiếu (địa chỉ object), equals() so sánh nội dung — lỗi phổ biến của người mới."], practice:"Viết hàm nối 10.000 chuỗi nhỏ bằng String + trong vòng lặp và bằng StringBuilder, đo thời gian chạy của cả 2 cách.", case:"Dùng String + trong vòng lặp lớn là lỗi performance kinh điển bị bắt lỗi trong code review Java ở môi trường chuyên nghiệp.", task:"Viết hàm dùng StringBuilder để đảo ngược 1 chuỗi, so sánh cách viết với dùng String + trong vòng lặp."},
{title:"Java 8: Lambda & Stream API", points:["Lambda expression là cách viết hàm ẩn danh gọn hơn, cú pháp (params) -> expression.","Stream API xử lý Collection theo phong cách functional: filter, map, reduce, collect.","Stream không thay đổi dữ liệu gốc, trả về stream mới sau mỗi phép biến đổi (giống method chain trong JS).","Functional interface (Runnable, Comparator...) chỉ có 1 method trừu tượng, dùng được với lambda.","Stream giúp code ngắn gọn hơn nhưng debug khó hơn vòng lặp thường — cân nhắc độ phức tạp bài toán."], practice:"Từ 1 List<Employee> có field salary, dùng Stream để lọc nhân viên lương lớn hơn X rồi tính lương trung bình.", case:"Xử lý danh sách bằng Stream thay vì vòng lặp thủ công là phong cách code Java hiện đại được kỳ vọng ở dev từ mid-level trở lên.", task:"Dùng Stream API: từ 1 List<Integer>, lọc số chẵn rồi tính tổng bằng filter + reduce."},
{title:"Generics trong Java", points:["Generics cho phép class/method hoạt động với nhiều kiểu dữ liệu mà vẫn type-safe tại compile time.","List<String> đảm bảo compiler bắt lỗi nếu thêm nhầm kiểu khác vào list.","Ký hiệu quy ước: T (Type), E (Element), K/V (Key/Value) khi định nghĩa generic.","Bounded type (<T extends Number>) giới hạn generic chỉ nhận kiểu con của 1 class/interface.","Generics giúp tránh phải ép kiểu (cast) thủ công và giảm lỗi runtime."], practice:"Viết class Pair<K,V> chứa 2 giá trị bất kỳ kiểu, có method getKey()/getValue().", case:"Các thư viện enterprise Java (Optional<T>, List<T>...) đều dựa trên Generics — không hiểu Generics sẽ rất khó đọc signature của các thư viện phổ biến.", task:"Viết 1 class Box<T> chứa 1 giá trị kiểu T bất kỳ, với method get/set."},
{title:"Multithreading cơ bản", points:["Thread là 1 luồng thực thi độc lập, cho phép chương trình làm nhiều việc \"song song\".","Tạo thread bằng extends Thread hoặc implements Runnable (Runnable linh hoạt hơn).","Race condition xảy ra khi nhiều thread cùng truy cập/sửa 1 dữ liệu chung không kiểm soát.","Từ khóa synchronized đảm bảo chỉ 1 thread truy cập đoạn code tại 1 thời điểm.","Multithreading mạnh nhưng phức tạp — chỉ dùng khi thực sự cần xử lý song song."], practice:"Viết 2 thread cùng tăng 1 biến counter chung 10.000 lần không đồng bộ, quan sát kết quả sai lệch, sau đó sửa bằng synchronized và so sánh.", case:"Race condition là nguyên nhân của nhiều bug 'ngẫu nhiên khó tái hiện' nổi tiếng khó debug nhất trong hệ thống backend thực tế có xử lý song song.", task:"Viết 2 Thread cùng in số đếm từ 1 đến 5, quan sát thứ tự output có bị xen kẽ không dự đoán được."},
{title:"File I/O trong Java", points:["java.io và java.nio là 2 package chính để đọc/ghi file trong Java.","BufferedReader/BufferedWriter đọc/ghi theo dòng, hiệu quả hơn đọc từng byte.","try-with-resources tự động đóng file/stream sau khi dùng xong, tránh leak tài nguyên.","Files.readAllLines() (java.nio) là cách ngắn gọn để đọc nhanh 1 file nhỏ.","Luôn xử lý exception khi làm việc với file vì file có thể không tồn tại hoặc thiếu quyền."], practice:"Viết chương trình đọc 1 file CSV đơn giản (tên,tuổi) và in ra danh sách người trên 18 tuổi.", case:"Xử lý file (import/export CSV, log file) vẫn là tác vụ backend rất phổ biến trong các hệ thống doanh nghiệp, đặc biệt các module báo cáo.", task:"Viết chương trình đọc 1 file text và đếm số dòng, số từ trong file đó."},
{title:"Maven/Gradle — quản lý dependency", points:["Maven/Gradle quản lý thư viện bên ngoài (dependency) và quy trình build của dự án Java.","pom.xml (Maven) hoặc build.gradle khai báo dependency, version, plugin cần dùng.","Dependency scope (compile, test, runtime) quyết định thư viện dùng ở giai đoạn nào.","Build lifecycle: compile → test → package → install/deploy.","Gradle dùng Groovy/Kotlin DSL, thường nhanh hơn Maven nhờ build cache và incremental build."], practice:"Tạo project Maven mới, thêm dependency Gson hoặc Jackson, viết code chuyển 1 object Java thành chuỗi JSON.", case:"Không dự án Java thực tế nào không dùng build tool để quản lý dependency — kỹ năng nền tảng bắt buộc trước khi làm việc với bất kỳ codebase Java nào.", task:"Tạo 1 project Maven/Gradle mới, thêm 1 dependency đơn giản (ví dụ JUnit) và build thử."},
{title:"JDBC — kết nối Database", points:["JDBC là API chuẩn để Java giao tiếp với database quan hệ.","Connection, Statement/PreparedStatement, ResultSet là 3 thành phần chính khi thao tác JDBC.","PreparedStatement tránh SQL Injection bằng cách tham số hóa câu query thay vì nối chuỗi thủ công.","Luôn đóng Connection/Statement/ResultSet sau khi dùng (hoặc dùng try-with-resources).","JDBC là nền tảng để hiểu ORM (JPA/Hibernate) hoạt động bên dưới thế nào."], practice:"Kết nối tới 1 database SQLite/MySQL cục bộ, viết query SELECT lấy danh sách và in ra console.", case:"Dù đã có ORM hiện đại, hiểu JDBC vẫn cần thiết để debug các câu query phức tạp hoặc tối ưu performance mà ORM sinh SQL không hiệu quả.", task:"Viết đoạn code JDBC kết nối tới 1 database (SQLite/MySQL) và query 1 bảng đơn giản."},
{title:"Giới thiệu Spring Boot", points:["Spring Boot giúp xây dựng ứng dụng Java (đặc biệt REST API) nhanh, ít cấu hình thủ công.","@SpringBootApplication là annotation khởi động toàn bộ ứng dụng Spring Boot.","Dependency Injection (DI) là core concept: Spring tự quản lý vòng đời và inject các object (bean) cần thiết.","@Component, @Service, @Repository đánh dấu các loại bean khác nhau theo tầng trong ứng dụng.","Spring Boot dùng embedded server (Tomcat) nên chạy được ngay bằng lệnh, không cần cài server riêng."], practice:"Tạo project Spring Boot với 1 dependency Spring Web, viết 1 endpoint GET /hello trả về chuỗi 'Hello Spring Boot'.", case:"Spring Boot là framework backend Java phổ biến nhất hiện nay ở các công ty — hầu hết vị trí Java Backend đều yêu cầu thành thạo Spring Boot.", task:"Tạo project Spring Boot mới (dùng start.spring.io), chạy thử và xem log khởi động ứng dụng."},
{title:"REST API với Spring Boot", points:["@RestController đánh dấu class xử lý request và trả về dữ liệu (thường là JSON).","@GetMapping, @PostMapping, @PutMapping, @DeleteMapping map tới các HTTP method tương ứng.","@RequestBody lấy dữ liệu từ body request, @PathVariable lấy dữ liệu từ URL path.","Response nên có status code rõ ràng (200, 201, 404, 400...) thay vì luôn trả 200.","Thiết kế REST tốt: đặt tên endpoint theo resource (danh từ), dùng đúng HTTP method cho đúng hành động."], practice:"Xây REST API CRUD đầy đủ (GET/POST/PUT/DELETE) cho 1 resource đơn giản (ví dụ Product) lưu tạm trong List (chưa cần database).", case:"CRUD API là bài test kỹ thuật phổ biến nhất khi phỏng vấn vị trí Java Backend — thành thạo phần này là yêu cầu tối thiểu.", task:"Viết 1 REST API đơn giản quản lý danh sách \"model\" (giống AWX Refiner) với endpoint GET và POST."},
{title:"Spring Data JPA & ORM", points:["ORM ánh xạ giữa class Java và bảng database, giảm code SQL thủ công.","@Entity đánh dấu class tương ứng với 1 bảng, @Id đánh dấu khóa chính.","JpaRepository cung cấp sẵn các method CRUD cơ bản (save, findById, findAll, delete) không cần viết SQL.","Có thể viết custom query bằng tên method (findByName) hoặc @Query khi cần phức tạp hơn.","ORM tiện lợi nhưng cần hiểu SQL bên dưới để debug khi performance có vấn đề (N+1 query...)."], practice:"Kết nối Entity Product ở tuần 15 với database thật qua Spring Data JPA, thay List tạm bằng JpaRepository, test lại toàn bộ CRUD.", case:"Hầu hết hệ thống backend thực tế đều cần lưu dữ liệu lâu dài qua database — JPA là kỹ năng phải có để biến demo thành ứng dụng thật.", task:"Định nghĩa 1 Entity Model với vài field, tạo Repository kế thừa JpaRepository và thử save/find dữ liệu."},
{title:"Authentication & JWT cơ bản", points:["Authentication trả lời \"bạn là ai\"; Authorization trả lời \"bạn được làm gì\".","JWT là chuỗi mã hóa chứa thông tin user, được ký để chống giả mạo.","Luồng phổ biến: login trả về JWT → client gửi JWT trong header Authorization ở các request sau.","JWT không nên chứa dữ liệu nhạy cảm vì phần payload chỉ encode chứ không mã hóa.","Spring Security là thư viện phổ biến để tích hợp authentication/authorization vào Spring Boot."], practice:"Thêm 1 endpoint /login trả về JWT giả lập (có thể dùng thư viện jjwt), thử decode token đó ở jwt.io để xem payload.", case:"Gần như mọi hệ thống backend production đều cần cơ chế authentication — JWT là chuẩn phổ biến nhất cho REST API stateless hiện nay.", task:"Đọc thử cấu trúc 1 JWT thật (header.payload.signature) bằng jwt.io, xác định phần nào chứa thông tin gì."},
{title:"Unit Testing với JUnit", points:["JUnit là framework testing phổ biến nhất cho Java, tương tự Vitest/Jest bên JS.","@Test đánh dấu 1 method là test case; assertEquals/assertTrue kiểm tra kết quả mong đợi.","@BeforeEach/@AfterEach chạy trước/sau mỗi test, dùng để setup/cleanup dữ liệu test.","Mockito giúp giả lập (mock) dependency bên ngoài khi test logic, không phụ thuộc hệ thống thật.","Test tốt nên độc lập với nhau — thứ tự chạy test không được ảnh hưởng tới kết quả."], practice:"Viết test case JUnit cho CRUD API ở tuần 15/16, dùng MockMvc hoặc test trực tiếp method service.", case:"Dự án backend không có test coverage cho business logic quan trọng thường bị đánh giá thấp về chất lượng trong review kỹ thuật khi ứng tuyển hoặc audit code.", task:"Viết 1–2 test case JUnit cho hàm chia có xử lý exception đã viết ở tuần 5."},
{title:"Design Patterns phổ biến trong Java", points:["Singleton đảm bảo 1 class chỉ có đúng 1 instance trong toàn ứng dụng (ví dụ 1 connection pool).","Factory pattern tách logic tạo object ra khỏi nơi sử dụng, dễ mở rộng thêm loại mới.","Builder pattern giúp tạo object phức tạp với nhiều field optional mà không cần constructor rối rắm.","Strategy pattern cho phép đổi thuật toán/xử lý linh hoạt tại runtime thông qua interface chung.","Design pattern là công cụ giải quyết vấn đề lặp lại, không phải mục tiêu để nhồi vào mọi chỗ."], practice:"Refactor 1 chỗ trong code Spring Boot đang new trực tiếp object phụ thuộc, chuyển sang inject qua constructor (@Autowired).", case:"Spring Boot bản chất được xây trên nguyên lý Dependency Injection — hiểu design pattern giúp giải thích được 'tại sao Spring hoạt động như vậy' thay vì chỉ copy code mẫu.", task:"Nhận diện xem trong code Spring Boot đã viết (JpaRepository, @Service...) có dùng pattern nào ở trên không."},
{title:"Triển khai Java với Docker cơ bản", points:["Docker đóng gói ứng dụng cùng môi trường chạy (JDK, dependency) thành 1 image thống nhất.","Dockerfile định nghĩa các bước build image: FROM, COPY, RUN, CMD/ENTRYPOINT.","Build image bằng docker build, chạy container bằng docker run.","Multi-stage build giúp giảm kích thước image cuối (build bằng JDK, chạy bằng JRE nhẹ hơn).","Docker giúp môi trường dev/staging/production giống nhau, tránh lỗi \"chạy trên máy tôi thì được\"."], practice:"Viết 1 Dockerfile đơn giản để đóng gói ứng dụng Spring Boot đã tạo ở tuần 14, build và chạy thử container.", case:"Hầu hết công ty deploy backend Java lên Docker/Kubernetes ngày nay — không biết Docker gần như đồng nghĩa không thể tham gia quy trình deploy thực tế của team.", task:"Viết 1 Dockerfile đơn giản để đóng gói ứng dụng Spring Boot đã tạo ở tuần 14, build và chạy thử container."},
{title:"Spring Security nâng cao", points:["Spring Security cho phép phân quyền chi tiết theo role (ADMIN, USER...) trên từng endpoint.","@PreAuthorize kiểm tra quyền ngay tại method trước khi cho thực thi.","SecurityFilterChain định nghĩa endpoint nào public, endpoint nào cần xác thực.","Phân biệt rõ 401 (chưa xác thực) và 403 (đã xác thực nhưng không đủ quyền) khi trả response lỗi.","Không nên tự viết hệ thống authentication từ đầu khi đã có Spring Security xử lý tốt các trường hợp phổ biến."], practice:"Thêm 2 role (ADMIN, USER) vào hệ thống JWT ở tuần 17, giới hạn 1 endpoint chỉ ADMIN mới gọi được, test bằng 2 token khác role.", case:"Phân quyền theo role là yêu cầu gần như bắt buộc ở mọi hệ thống backend có nhiều loại người dùng (admin, nhân viên, khách hàng...).", task:"Thêm phân quyền đơn giản (ADMIN/USER) vào REST API đã viết ở tuần 15, thử gọi bằng 2 role khác nhau."},
{title:"Caching cơ bản với Redis", points:["Cache lưu tạm kết quả tính toán/tra cứu tốn kém để lần sau trả nhanh hơn mà không cần làm lại.","Redis là in-memory data store phổ biến để làm cache layer trước database.","@Cacheable trong Spring Boot tự động cache kết quả method theo key, không cần tự viết logic thủ công.","Cần đặt thời gian hết hạn (TTL) cho cache để tránh trả dữ liệu cũ mãi mãi.","Cache hữu ích cho dữ liệu đọc nhiều, ghi ít — không phù hợp cho dữ liệu thay đổi liên tục."], practice:"Thử thêm @Cacheable vào 1 method truy vấn dữ liệu trong project Spring Boot, đo thời gian phản hồi trước/sau.", case:"Cache giúp giảm tải database đáng kể ở các API đọc nhiều — kỹ thuật tối ưu performance rất thường gặp khi hệ thống có lượng truy cập lớn.", task:"Thử thêm @Cacheable vào 1 method truy vấn dữ liệu trong project Spring Boot, đo thời gian phản hồi trước/sau."},
{title:"Kiến trúc Microservices tổng quan", points:["Microservices chia hệ thống lớn thành nhiều service nhỏ độc lập, mỗi service 1 trách nhiệm rõ ràng.","Trái ngược với Monolith (toàn bộ logic gói trong 1 ứng dụng duy nhất, dễ phát triển ban đầu hơn).","Các service giao tiếp qua REST API hoặc message queue (Kafka, RabbitMQ) thay vì gọi hàm trực tiếp.","Đánh đổi: phức tạp hơn về vận hành, cần xử lý network failure, đồng bộ dữ liệu giữa các service.","Không nên bắt đầu dự án mới bằng microservices — thường bắt đầu Monolith rồi tách dần khi cần."], practice:"Vẽ sơ đồ đơn giản (trên giấy hoặc draw.io) 1 hệ thống e-commerce chia thành 3 service: Order, Product, User — xác định chúng cần gọi nhau ở đâu.", case:"Nhiều công ty lớn (Amazon, Netflix) nổi tiếng với kiến trúc microservices — hiểu tư duy này giúp đọc hiểu các hệ thống doanh nghiệp lớn dù chưa trực tiếp xây dựng chúng.", task:"Vẽ sơ đồ đơn giản: nếu AWX Refiner tách thành microservices, những service nào sẽ tách riêng (model management, auth, notification...)?"},
{title:"CI/CD cơ bản cho ứng dụng Java", points:["CI (Continuous Integration) tự động build + test mỗi khi có code mới được push lên.","CD (Continuous Deployment/Delivery) tự động triển khai ứng dụng sau khi CI pass.","GitHub Actions là công cụ phổ biến để định nghĩa pipeline CI/CD bằng file YAML.","Pipeline cơ bản: checkout code → build (Maven/Gradle) → chạy test → build Docker image → deploy.","CI/CD giúp phát hiện lỗi sớm và giảm rủi ro khi deploy thủ công."], practice:"Viết 1 file GitHub Actions đơn giản tự động build và chạy test cho project Spring Boot mỗi khi push code, quan sát kết quả ở tab Actions.", case:"CI/CD là quy trình chuẩn ở mọi team backend chuyên nghiệp — code không qua được pipeline test tự động thường không được phép merge vào nhánh chính.", task:"Viết 1 file GitHub Actions đơn giản chạy 'mvn test' mỗi khi push code lên GitHub, quan sát kết quả ở tab Actions."},
];

{q:"Part 5 kiểm tra chủ yếu điều gì?", opts:["Nghe hiểu", "Ngữ pháp/từ vựng qua câu đơn", "Đọc hiểu đoạn dài", "Phát âm"], correct:1, explain:"Part 5 là câu đơn có chỗ trống, kiểm tra ngữ pháp và từ vựng."},
{q:"Part 7 là dạng bài gì?", opts:["Nghe hội thoại", "Đọc hiểu đoạn văn (single/double/triple passage)", "Điền từ vào đoạn văn", "Chỉ có 1 câu hỏi"], correct:1, explain:"Part 7 là phần đọc hiểu với 1 hoặc nhiều đoạn văn liên quan."},
{q:"Tổng điểm tối đa TOEIC là bao nhiêu?", opts:["100", "500", "990", "1000"], correct:2, explain:"990 là điểm tối đa (495 Listening + 495 Reading)."},

{label:'Thứ 3', title:'Làm 1 đề thử đầy đủ', content:'Lần đầu làm đề, mục tiêu KHÔNG phải để đạt điểm cao mà để có số liệu thật về trình độ hiện tại — làm nghiêm túc, tính giờ đầy đủ như thi thật để kết quả phản ánh đúng thực lực.', exercises:["Làm 1 đề TOEIC đầy đủ (hoặc bản rút gọn), ghi lại thời gian bắt đầu và kết thúc từng phần.","Ghi chú lại cảm giác/khó khăn gặp phải ở từng Part ngay khi vừa làm xong, để so sánh với kết quả thực tế.","Đánh dấu lại những câu bạn phải đoán (không chắc chắn) để phân biệt với câu làm chắc chắn khi phân tích sau.","Ghi lại cảm giác của bạn ngay sau khi làm xong đề (tự tin, lo lắng, mệt...) để so sánh tâm lý ở lần luyện đề sau.","Đếm số câu bạn phải bỏ trống hoàn toàn vì hết giờ, ghi chú riêng để theo dõi cải thiện."], quiz:[
{q:"Vì sao nên làm đề thử NGAY từ đầu, trước khi học kỹ?", opts:["Không cần thiết", "Để biết điểm xuất phát, xác định điểm yếu cần ưu tiên", "Để lấy chứng chỉ", "Vì bắt buộc theo quy định"], correct:1, explain:"Đề thử đầu tiên cho số liệu thật để lập kế hoạch học tập đúng trọng tâm."},
{q:"Khi làm đề thử, có nên tra từ điển giữa chừng không?", opts:["Có, nên tra cho chính xác", "Không, nên làm nghiêm túc như thi thật", "Chỉ tra từ khó", "Tùy ý thích"], correct:1, explain:"Làm nghiêm túc giống điều kiện thật mới cho kết quả đánh giá chính xác."},
{q:"Thời gian làm bài Reading là bao lâu?", opts:["45 phút", "60 phút", "75 phút", "90 phút"], correct:2, explain:"Reading có 75 phút cho 100 câu, không nghỉ giữa các Part."},
{q:"Nếu hết giờ mà chưa làm xong, nên làm gì?", opts:["Bỏ trống các câu còn lại", "Vẫn nên tô đáp án cho các câu còn lại vì không bị trừ điểm", "Dừng thi luôn", "Xin thêm giờ"], correct:1, explain:"TOEIC không trừ điểm câu sai nên luôn nên chọn 1 đáp án."},
{q:"Mục đích chính của đề thử đầu tiên là gì?", opts:["Đạt điểm cao nhất có thể", "Đánh giá trình độ hiện tại, chưa cần điểm cao", "Để thi lấy chứng chỉ", "Không có mục đích cụ thể"], correct:1, explain:"Đây là bước đánh giá xuất phát điểm, không phải bài kiểm tra thành tích."},
{q:"Nên làm đề thử trong điều kiện thế nào để có kết quả chính xác nhất?", opts:["Vừa làm vừa xem TV", "Giống điều kiện thi thật (đủ thời gian, không gián đoạn)", "Chia làm nhiều ngày", "Không cần tính giờ"], correct:1, explain:"Điều kiện càng giống thi thật, kết quả đánh giá càng chính xác."},
{q:"Sau khi làm xong đề thử, bước tiếp theo là gì?", opts:["Quên luôn kết quả", "Chấm điểm và phân tích lỗi sai", "Làm đề khác ngay lập tức", "Không cần làm gì thêm"], correct:1, explain:"Phân tích lỗi sai là bước quan trọng để biến điểm số thành kế hoạch học tập."},
{q:"Làm đề thử sớm giúp lập kế hoạch học tập thế nào?", opts:["Không giúp ích gì", "Tập trung vào phần yếu nhất thay vì học dàn trải", "Học ngẫu nhiên không cần kế hoạch", "Chỉ cần học từ vựng"], correct:1, explain:"Biết điểm yếu giúp phân bổ thời gian học hiệu quả hơn."},
{q:"Điểm số đề thử đầu tiên có nên gây áp lực không?", opts:["Có, cần lo lắng nhiều", "Không, đây chỉ là điểm khởi đầu để đo tiến bộ", "Nên bỏ học nếu điểm thấp", "Không quan trọng, bỏ qua luôn"], correct:1, explain:"Điểm thấp ở lần đầu là bình thường, quan trọng là theo dõi tiến bộ sau này."},
{q:"Vì sao nên giữ lại đề thử đầu tiên để so sánh sau này?", opts:["Không cần thiết", "Để đo lường tiến bộ qua thời gian", "Chỉ để lưu kỷ niệm", "Vì bắt buộc phải giữ"], correct:1, explain:"So sánh với điểm khởi đầu là cách khách quan nhất để thấy tiến bộ thực tế."},

{label:'Thứ 4', title:'Tự chấm điểm & quy đổi thang điểm', content:'TOEIC quy đổi số câu đúng sang thang điểm 5-495 cho mỗi kỹ năng (Listening và Reading), tổng tối đa 990. Bảng quy đổi chính thức không tuyến tính tuyệt đối, nhưng có thể tra bảng quy đổi tham khảo có sẵn trong sách luyện thi hoặc tìm online để ước lượng điểm.', exercises:["Đếm số câu đúng ở Listening và Reading riêng biệt, tra bảng quy đổi điểm ước lượng, ghi lại kết quả làm mốc so sánh.","So sánh điểm ước lượng của bạn với mục tiêu 800+ để biết khoảng cách cần thu hẹp trong 4 tháng.","Tìm hiểu xem điểm 800+ tương đương trình độ nào theo khung CEFR để hình dung rõ mục tiêu.","Tra thêm 1 bảng quy đổi điểm TOEIC khác (nếu có) để so sánh, xem kết quả có chênh lệch nhiều không.","Viết ra khoảng cách điểm số hiện tại so với mục tiêu 800, chia nhỏ thành mục tiêu từng tháng."], quiz:[
{q:"TOEIC tính điểm dựa trên gì?", opts:["Số câu trả lời đúng, quy đổi qua bảng chuẩn hóa", "Thời gian làm bài", "Số câu bỏ trống", "Cảm tính giám thị"], correct:0, explain:"Điểm số được quy đổi từ số câu đúng qua bảng chuẩn hóa của ETS."},
{q:"Bảng quy đổi điểm TOEIC có cố định tuyệt đối giữa các đề không?", opts:["Có, luôn giống hệt nhau", "Không hoàn toàn, có thể thay đổi nhẹ tùy độ khó đề", "Không liên quan gì đến đề thi", "Chỉ áp dụng 1 lần duy nhất"], correct:1, explain:"Độ khó đề khác nhau nên bảng quy đổi có thể điều chỉnh nhẹ."},
{q:"Điểm Listening tối đa là bao nhiêu?", opts:["100", "300", "495", "500"], correct:2, explain:"Listening tối đa 495 điểm, cộng với Reading 495 thành tổng 990."},
{q:"Điểm Reading tối đa là bao nhiêu?", opts:["100", "300", "495", "500"], correct:2, explain:"Reading tối đa 495 điểm, tương tự Listening."},
{q:"Mục tiêu 800+ cần đạt tỷ lệ đúng khoảng bao nhiêu %?", opts:["30-40%", "50-60%", "Khoảng 80-85% mỗi phần", "100%"], correct:2, explain:"800+ đòi hỏi tỷ lệ đúng cao ở cả 2 kỹ năng, khoảng 80-85%."},
{q:"Vì sao cần quy đổi điểm thay vì tính % đơn giản?", opts:["Không cần lý do gì", "Vì độ khó câu hỏi khác nhau giữa các đề", "Vì quy đổi dễ tính hơn", "Không có sự khác biệt"], correct:1, explain:"Quy đổi giúp điểm số công bằng dù đề thi có độ khó khác nhau."},
{q:"Sau khi chấm điểm, việc quan trọng tiếp theo là gì?", opts:["Không cần làm gì thêm", "Phân tích chi tiết lỗi sai theo từng Part", "Quên kết quả đi", "Làm đề khác ngay"], correct:1, explain:"Điểm số chỉ có ý nghĩa khi đi kèm phân tích để cải thiện."},
{q:"Nếu điểm Listening thấp hơn Reading nhiều, nên làm gì?", opts:["Bỏ qua, không cần điều chỉnh", "Ưu tiên thời gian học cho Listening nhiều hơn", "Chỉ học Reading thôi", "Ngừng học TOEIC"], correct:1, explain:"Cân bằng lại thời gian học theo đúng điểm yếu thực tế."},
{q:"Vì sao không nên chỉ nhìn tổng điểm mà bỏ qua điểm từng phần?", opts:["Không có lý do", "Tổng điểm không cho biết điểm yếu cụ thể ở đâu", "Điểm từng phần không quan trọng", "Chỉ cần tổng điểm cao là đủ"], correct:1, explain:"Điểm từng phần mới thực sự chỉ ra nơi cần cải thiện."},
{q:"Khoảng cách điểm hiện tại và mục tiêu nên được xử lý thế nào?", opts:["Bỏ qua không quan tâm", "Chia nhỏ thành mục tiêu theo từng tháng", "Cố đạt ngay lập tức", "Không cần đặt mục tiêu"], correct:1, explain:"Mục tiêu nhỏ theo từng giai đoạn giúp lộ trình khả thi và có động lực hơn."},
