<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lộ Trình Học Tập · FE / Java Backend / Thuật Toán / TOEIC</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg-primary:#F6F7FA;
    --bg-panel:#FFFFFF;
    --bg-elevated:#EEF0F5;
    --border:#E1E4EA;
    --text-primary:#1B2130;
    --text-muted:#5B6472;
    --text-dim:#9AA3B2;
    --fe:#0E8F82;
    --fe-dim:rgba(14,143,130,0.09);
    --be:#C2760B;
    --be-dim:rgba(194,118,11,0.10);
    --algo:#7C3AED;
    --algo-dim:rgba(124,58,237,0.09);
    --toeic:#2563EB;
    --toeic-dim:rgba(37,99,235,0.09);
    --coral:#DC2626;
    --coral-dim:rgba(220,38,38,0.09);
    --amber2:#B45309;
    --amber2-dim:rgba(180,83,9,0.08);
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:var(--bg-primary); color:var(--text-primary); font-family:var(--sans); display:flex; flex-direction:column; min-height:100vh;}
  ::selection{background:var(--algo-dim); color:var(--algo);}

  header{padding:14px 28px 0; border-bottom:1px solid var(--border); background:var(--bg-panel); position:sticky; top:0; z-index:10;}
  .brand{display:flex; align-items:baseline; gap:12px; margin-bottom:14px;}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--algo); display:inline-block;}
  .brand h1{font-family:var(--mono); font-size:15.5px; font-weight:700; letter-spacing:-0.02em;}
  .brand .path{font-family:var(--mono); font-size:11.5px; color:var(--text-dim);}

  nav.menu{display:flex; gap:4px; overflow-x:auto;}
  .menu-btn{display:flex; flex-direction:column; align-items:flex-start; gap:3px; padding:10px 18px; border:none; background:transparent; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; font-family:var(--sans); transition:.15s;}
  .menu-btn .label{font-size:13.5px; font-weight:600; color:var(--text-muted);}
  .menu-btn .sub{font-family:var(--mono); font-size:10.5px; color:var(--text-dim);}
  .menu-btn:hover .label{color:var(--text-primary);}
  .menu-btn.active{border-bottom-color:var(--track-color, var(--algo));}
  .menu-btn.active .label{color:var(--track-color, var(--algo));}
  .menu-btn.active .sub{color:var(--track-color, var(--algo));}

  .app{flex:1; display:grid; grid-template-columns:250px 1fr; min-height:0;}
  @media (max-width:860px){ .app{grid-template-columns:1fr;} .sidebar{border-right:none; border-bottom:1px solid var(--border); max-height:220px;} }

  .sidebar{border-right:1px solid var(--border); overflow-y:auto; padding:14px 0; background:var(--bg-panel);}
  .month-label{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--text-dim); padding:12px 20px 6px; text-transform:uppercase;}
  .month-label:first-child{padding-top:4px;}
  .week-item{display:flex; align-items:center; gap:10px; padding:8px 20px; cursor:pointer; border-left:2px solid transparent; transition:background .15s, border-color .15s;}
  .week-item:hover{background:var(--bg-elevated);}
  .week-item.active{background:var(--bg-elevated); border-left-color:var(--track-color, var(--algo));}
  .week-item .num{font-family:var(--mono); font-size:12px; color:var(--text-dim); width:20px; flex-shrink:0;}
  .week-item .title{font-size:12.5px; color:var(--text-muted); flex:1; line-height:1.3;}
  .week-item.active .title{color:var(--text-primary);}
  .week-item .tick{font-size:12px; color:var(--track-color, var(--algo)); flex-shrink:0; width:14px; text-align:center;}

  main{padding:26px 32px 60px; overflow-y:auto; max-width:920px;}
  .week-title{font-family:var(--mono); font-size:21px; font-weight:700; letter-spacing:-0.01em; margin-bottom:4px;}
  .week-subtitle{color:var(--text-dim); font-size:12.5px; margin-bottom:18px;}

  .day-plan{border:1px solid var(--border); border-radius:10px; background:var(--bg-elevated); padding:14px 18px; margin-bottom:22px;}
  .day-plan b{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:10px; font-weight:700;}
  .day-plan .row{display:flex; gap:12px; padding:4px 0; font-size:13px; line-height:1.5;}
  .day-plan .row .d{font-family:var(--mono); font-weight:700; color:var(--text-primary); width:52px; flex-shrink:0;}
  .day-plan .row .t{color:var(--text-muted);}

  .section{border:1px solid var(--border); border-radius:12px; background:var(--bg-panel); overflow:hidden; margin-bottom:20px;}
  .section-head{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background:var(--bg-elevated); border-bottom:1px solid var(--border);}
  .track-tag{font-family:var(--mono); font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; letter-spacing:.04em; background:var(--track-dim, var(--algo-dim)); color:var(--track-color, var(--algo));}

  .check-btn{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11.5px; background:var(--bg-panel); border:1px solid var(--border); color:var(--text-muted); padding:7px 13px; border-radius:6px; cursor:pointer; transition:.15s;}
  .check-btn:hover{border-color:var(--text-dim); color:var(--text-primary);}
  .check-btn.checked{background:var(--track-dim, var(--algo-dim)); border-color:var(--track-color, var(--algo)); color:var(--track-color, var(--algo));}

  .section-body{padding:20px 22px;}
  .points{list-style:none; margin-bottom:4px;}
  .points li{position:relative; padding-left:20px; margin-bottom:11px; font-size:14px; line-height:1.65; color:var(--text-muted);}
  .points li::before{content:'—'; position:absolute; left:0; color:var(--text-dim);}

  .info-box{border-radius:8px; padding:14px 16px; font-size:13.5px; line-height:1.6; color:var(--text-primary); margin-top:14px;}
  .info-box b{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; font-weight:700;}
  .info-box.practice{background:var(--toeic-dim); border:1px solid rgba(37,99,235,0.25);}
  .info-box.practice b{color:var(--toeic);}
  .info-box.case{background:var(--amber2-dim); border:1px solid rgba(180,83,9,0.22);}
  .info-box.case b{color:var(--amber2);}
  .info-box.apply{background:var(--bg-elevated); border:1px solid var(--border);}
  .info-box.apply b{color:var(--text-dim);}

  .algo-desc{color:var(--text-muted); font-size:14px; line-height:1.6; margin-bottom:14px;}
  .algo-example{font-family:var(--mono); font-size:12px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; padding:11px 14px; color:var(--text-muted); margin-bottom:14px; white-space:pre-wrap;}
  .algo-example b{color:var(--algo); font-weight:600;}

  .editor-wrap{border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:14px; margin-top:14px;}
  .editor-topbar{display:flex; align-items:center; justify-content:space-between; padding:8px 14px; background:var(--bg-elevated); border-bottom:1px solid var(--border);}
  .editor-topbar .fname{font-family:var(--mono); font-size:11.5px; color:var(--text-muted);}
  .btn-row{display:flex; gap:8px;}
  button.action{font-family:var(--mono); font-size:12px; font-weight:600; border:none; border-radius:6px; padding:7px 14px; cursor:pointer; transition:transform .1s, opacity .15s;}
  button.action:active{transform:scale(0.97);}
  .btn-run{background:var(--algo); color:#fff;}
  .btn-run:hover{opacity:.88;}
  .btn-reset{background:var(--bg-panel); color:var(--text-muted); border:1px solid var(--border);}
  .btn-reset:hover{color:var(--text-primary); border-color:var(--text-dim);}

  textarea.editor{width:100%; min-height:180px; background:#FAFBFC; color:var(--text-primary); border:none; outline:none; resize:vertical; font-family:var(--mono); font-size:13px; line-height:1.6; padding:14px 16px; tab-size:2;}

  .console{border:1px solid var(--border); border-radius:10px; background:#FAFBFC; overflow:hidden;}
  .console-topbar{padding:8px 14px; background:var(--bg-elevated); border-bottom:1px solid var(--border); font-family:var(--mono); font-size:11.5px; color:var(--text-dim);}
  .console-body{padding:13px 16px; font-family:var(--mono); font-size:12.5px; line-height:1.8; min-height:50px;}
  .console-empty{color:var(--text-dim);}
  .test-line{display:flex; gap:9px; align-items:flex-start; margin-bottom:5px;}
  .test-line .mark{width:13px; flex-shrink:0;}
  .test-line.pass .mark{color:var(--fe);}
  .test-line.fail .mark{color:var(--coral);}
  .test-line .txt{color:var(--text-muted);}
  .test-line.fail .txt{color:var(--text-primary);}
  .test-line .detail{color:var(--text-dim); display:block; margin-top:2px; font-size:11.5px;}
  .summary-line{margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); font-weight:600;}
  .summary-line.pass{color:var(--fe);}
  .summary-line.fail{color:var(--coral);}
  .error-line{color:var(--coral); white-space:pre-wrap;}

  .week-nav{display:flex; justify-content:space-between; margin-top:20px; gap:10px;}
  .nav-btn{font-family:var(--mono); font-size:12.5px; font-weight:600; background:var(--bg-panel); border:1px solid var(--border); color:var(--text-primary); padding:10px 18px; border-radius:8px; cursor:pointer; flex:1; text-align:center; transition:.15s;}
  .nav-btn:hover{border-color:var(--text-dim);}
  .nav-btn:disabled{opacity:.35; cursor:default;}

  footer{text-align:center; padding:16px; font-family:var(--mono); font-size:11px; color:var(--text-dim); border-top:1px solid var(--border); background:var(--bg-panel);}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span><h1>lộ trình học tập</h1><span class="path">6 tháng FE/BE/Thuật toán · 4 tháng TOEIC</span></div>
  <nav class="menu" id="menu"></nav>
</header>

<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
</div>

<footer>tự học mỗi ngày, đều đặn mỗi tuần · tiến độ lưu trên trình duyệt này</footer>

<script>
/* ============ ALGORITHM PROBLEMS BANK ============ */
const problems = {
'two-sum':{name:'Two Sum', difficulty:'Dễ', signature:'function solve(nums, target)', desc:'Cho mảng số nguyên nums và số target, trả về chỉ số của hai phần tử có tổng bằng target.', example:'<b>Input:</b> nums=[2,7,11,15], target=9\n<b>Output:</b> [0,1]', starter:'function solve(nums, target) {\n  // viết code tại đây\n}', approach:'Dùng HashMap lưu giá trị đã duyệt qua cùng chỉ số, kiểm tra xem target - số hiện tại đã tồn tại trong map chưa — độ phức tạp O(n) thay vì O(n²) nếu duyệt 2 vòng lặp lồng nhau.', caseReal:'Dạng bài tìm cặp giá trị thỏa điều kiện xuất hiện nhiều trong xử lý dữ liệu thực tế, ví dụ tìm 2 giao dịch có tổng bằng 1 số tiền nghi vấn trong hệ thống chống gian lận.', tests:[{args:[[2,7,11,15],9], expected:[0,1]},{args:[[3,2,4],6], expected:[1,2]},{args:[[3,3],6], expected:[0,1]}]},
'fizzbuzz':{name:'FizzBuzz', difficulty:'Dễ', signature:'function solve(n)', desc:'Trả về mảng từ 1 đến n, số chia hết cho 3 thành "Fizz", cho 5 thành "Buzz", cho cả hai thành "FizzBuzz".', example:'<b>Input:</b> 5\n<b>Output:</b> ["1","2","Fizz","4","Buzz"]', starter:'function solve(n) {\n  // viết code tại đây\n}', approach:'Duyệt từ 1 đến n, dùng toán tử modulo (%) kiểm tra chia hết cho 3 và 5, chú ý kiểm tra điều kiện chia hết cho cả hai trước.', caseReal:'FizzBuzz nổi tiếng vì được dùng làm câu hỏi sàng lọc nhanh trong phỏng vấn — không phải vì độ khó mà để kiểm tra khả năng suy luận logic cơ bản.', tests:[{args:[5], expected:["1","2","Fizz","4","Buzz"]},{args:[15], expected:["1","2","Fizz","4","Buzz","Fizz","7","8","Fizz","Buzz","11","Fizz","13","14","FizzBuzz"]}]},
'reverse-string':{name:'Đảo ngược chuỗi', difficulty:'Dễ', signature:'function solve(str)', desc:'Đảo ngược một chuỗi ký tự, không dùng .reverse() có sẵn của Array.', example:'<b>Input:</b> "hello"\n<b>Output:</b> "olleh"', starter:'function solve(str) {\n  // viết code tại đây\n}', approach:'Dùng 2 con trỏ (two pointers) từ đầu và cuối chuỗi, hoán đổi ký tự và di chuyển vào giữa — độ phức tạp O(n).', caseReal:'Two-pointer là kỹ thuật nền tảng dùng lại trong rất nhiều bài toán mảng/chuỗi khác, không chỉ riêng đảo ngược.', tests:[{args:['hello'], expected:'olleh'},{args:['JavaScript'], expected:'tpircSavaJ'},{args:[''], expected:''}]},
'valid-palindrome':{name:'Kiểm tra Palindrome', difficulty:'Dễ', signature:'function solve(str)', desc:'Kiểm tra chuỗi có phải palindrome không, bỏ qua khoảng trắng và không phân biệt hoa thường.', example:'<b>Input:</b> "A man a plan a canal Panama"\n<b>Output:</b> true', starter:'function solve(str) {\n  // viết code tại đây\n}', approach:'Chuẩn hóa chuỗi (bỏ khoảng trắng, viết thường) rồi dùng two-pointer so sánh từ 2 đầu vào giữa.', caseReal:'Kiểm tra tính đối xứng của dữ liệu xuất hiện trong xử lý văn bản, kiểm tra mã checksum, hoặc bài toán chuỗi DNA trong sinh học tính toán.', tests:[{args:['A man a plan a canal Panama'], expected:true},{args:['race a car'], expected:false},{args:['level'], expected:true}]},
'count-chars':{name:'Đếm tần suất ký tự', difficulty:'Dễ', signature:'function solve(str)', desc:'Đếm số lần xuất hiện của mỗi ký tự trong chuỗi, trả về object {ký_tự: số_lần}.', example:'<b>Input:</b> "aabbc"\n<b>Output:</b> {a:2, b:2, c:1}', starter:'function solve(str) {\n  // viết code tại đây\n}', approach:'Dùng object/HashMap làm bộ đếm, duyệt qua từng ký tự và tăng giá trị đếm tương ứng — O(n).', caseReal:'Đếm tần suất là bước đầu tiên của rất nhiều bài toán phân tích dữ liệu, ví dụ đếm số lần xuất hiện từ khóa trong log hệ thống.', tests:[{args:['aabbc'], expected:{a:2,b:2,c:1}},{args:['xyz'], expected:{x:1,y:1,z:1}}]},
'bubble-sort':{name:'Bubble Sort', difficulty:'Dễ', signature:'function solve(arr)', desc:'Tự cài đặt Bubble Sort để sắp xếp mảng số tăng dần (không dùng .sort() có sẵn).', example:'<b>Input:</b> [5,3,8,1]\n<b>Output:</b> [1,3,5,8]', starter:'function solve(arr) {\n  // viết code tại đây\n}', approach:'So sánh từng cặp phần tử liền kề, hoán đổi nếu sai thứ tự, lặp lại nhiều vòng cho đến khi không còn hoán đổi nào — độ phức tạp O(n²).', caseReal:'Bubble Sort ít dùng trong thực tế vì chậm, nhưng là bài học nền tảng để hiểu độ phức tạp thuật toán trước khi học QuickSort/MergeSort.', tests:[{args:[[5,3,8,1]], expected:[1,3,5,8]},{args:[[1]], expected:[1]},{args:[[4,2,2,1]], expected:[1,2,2,4]}]},
'binary-search':{name:'Tìm kiếm nhị phân', difficulty:'Trung bình', signature:'function solve(sortedArr, target)', desc:'Cài đặt binary search trên mảng đã sắp xếp tăng dần, trả về chỉ số của target hoặc -1. Yêu cầu O(log n).', example:'<b>Input:</b> sortedArr=[1,3,5,7,9,11], target=7\n<b>Output:</b> 3', starter:'function solve(sortedArr, target) {\n  // viết code tại đây\n}', approach:'So sánh phần tử giữa mảng với target, thu hẹp phạm vi tìm kiếm về nửa trái hoặc nửa phải — độ phức tạp O(log n).', caseReal:'Binary search là nền tảng của nhiều hệ thống thực tế: tìm kiếm trong database đã đánh index, git bisect tìm commit gây lỗi.', tests:[{args:[[1,3,5,7,9,11],7], expected:3},{args:[[1,3,5,7,9,11],2], expected:-1},{args:[[5],5], expected:0}]},
'valid-parentheses':{name:'Ngoặc hợp lệ', difficulty:'Trung bình', signature:'function solve(str)', desc:'Kiểm tra chuỗi chỉ gồm (){}[] có hợp lệ không (mở/đóng đúng thứ tự, dùng Stack).', example:'<b>Input:</b> "({[]})"\n<b>Output:</b> true', starter:'function solve(str) {\n  // viết code tại đây\n}', approach:'Dùng Stack: gặp dấu mở thì đẩy vào stack, gặp dấu đóng thì kiểm tra đỉnh stack có khớp không rồi pop ra.', caseReal:'Kỹ thuật Stack kiểm tra cặp ngoặc được dùng trong trình biên dịch/parser thực tế để kiểm tra cú pháp code hợp lệ.', tests:[{args:['({[]})'], expected:true},{args:['(]'], expected:false},{args:['(('], expected:false},{args:[''], expected:true}]},
'merge-sorted-arrays':{name:'Trộn 2 mảng đã sắp xếp', difficulty:'Dễ', signature:'function solve(a, b)', desc:'Trộn 2 mảng số đã sắp xếp tăng dần thành 1 mảng sắp xếp tăng dần.', example:'<b>Input:</b> a=[1,3,5], b=[2,4,6]\n<b>Output:</b> [1,2,3,4,5,6]', starter:'function solve(a, b) {\n  // viết code tại đây\n}', approach:'Dùng 2 con trỏ duyệt song song 2 mảng, so sánh và lấy phần tử nhỏ hơn ra mảng kết quả — O(n+m).', caseReal:'Đây chính là bước "merge" trong Merge Sort, và là thao tác cốt lõi khi gộp log từ nhiều server đã sắp xếp theo thời gian.', tests:[{args:[[1,3,5],[2,4,6]], expected:[1,2,3,4,5,6]},{args:[[],[1,2]], expected:[1,2]},{args:[[1],[]], expected:[1]}]},
'remove-duplicates':{name:'Xóa phần tử trùng', difficulty:'Dễ', signature:'function solve(sortedArr)', desc:'Cho mảng số đã sắp xếp tăng dần, trả về mảng mới chỉ giữ giá trị duy nhất.', example:'<b>Input:</b> [1,1,2,2,3]\n<b>Output:</b> [1,2,3]', starter:'function solve(sortedArr) {\n  // viết code tại đây\n}', approach:'Vì mảng đã sắp xếp, chỉ cần so sánh phần tử hiện tại với phần tử trước đó, bỏ qua nếu trùng — O(n).', caseReal:'Loại bỏ dữ liệu trùng lặp là thao tác làm sạch dữ liệu (data cleaning) rất phổ biến trước khi xử lý hoặc phân tích dữ liệu thực tế.', tests:[{args:[[1,1,2,2,3]], expected:[1,2,3]},{args:[[1,1,1]], expected:[1]},{args:[[]], expected:[]}]},
'factorial':{name:'Giai thừa (đệ quy)', difficulty:'Dễ', signature:'function solve(n)', desc:'Tính n! bằng đệ quy (n! = n * (n-1) * ... * 1, 0! = 1).', example:'<b>Input:</b> 5\n<b>Output:</b> 120', starter:'function solve(n) {\n  // viết code tại đây, dùng đệ quy\n}', approach:'Hàm đệ quy với điều kiện dừng (base case) n<=1 trả về 1, ngược lại trả về n * solve(n-1).', caseReal:'Giai thừa xuất hiện trong tính toán xác suất, tổ hợp — nền tảng cho các bài toán thống kê và machine learning cơ bản.', tests:[{args:[5], expected:120},{args:[0], expected:1},{args:[1], expected:1},{args:[6], expected:720}]},
'fibonacci':{name:'Fibonacci', difficulty:'Trung bình', signature:'function solve(n)', desc:'Trả về số Fibonacci thứ n (F(0)=0, F(1)=1). Nên dùng memoization để tối ưu.', example:'<b>Input:</b> 10\n<b>Output:</b> 55', starter:'function solve(n) {\n  // viết code tại đây\n}', approach:'Đệ quy thuần có độ phức tạp mũ O(2^n) do tính lại nhiều lần; dùng memoization (lưu kết quả đã tính) đưa về O(n).', caseReal:'Fibonacci là ví dụ kinh điển để học memoization/Dynamic Programming — kỹ thuật áp dụng rộng rãi để tối ưu bài toán đệ quy có tính toán lặp lại.', tests:[{args:[0], expected:0},{args:[1], expected:1},{args:[10], expected:55},{args:[20], expected:6765}]},
'missing-number':{name:'Tìm số bị thiếu', difficulty:'Trung bình', signature:'function solve(nums)', desc:'Cho mảng n số phân biệt lấy từ đoạn 0..n, tìm số duy nhất bị thiếu.', example:'<b>Input:</b> [3,0,1]\n<b>Output:</b> 2', starter:'function solve(nums) {\n  // viết code tại đây\n}', approach:'Tính tổng kỳ vọng của dãy 0..n bằng công thức n(n+1)/2, trừ đi tổng thực tế của mảng để ra số bị thiếu — O(n).', caseReal:'Dùng công thức toán học thay vì brute-force giúp tối ưu đáng kể — tư duy hữu ích khi cần xử lý dữ liệu lớn với thời gian giới hạn.', tests:[{args:[[3,0,1]], expected:2},{args:[[0,1]], expected:2},{args:[[9,6,4,2,3,5,7,0,1]], expected:8}]},
'flatten':{name:'Làm phẳng mảng lồng nhau', difficulty:'Khó', signature:'function solve(arr)', desc:'Làm phẳng hoàn toàn mảng lồng nhau ở bất kỳ độ sâu nào, không dùng .flat(Infinity).', example:'<b>Input:</b> [1,[2,[3,[4,5]],6]]\n<b>Output:</b> [1,2,3,4,5,6]', starter:'function solve(arr) {\n  // viết code tại đây\n}', approach:'Dùng đệ quy: duyệt từng phần tử, nếu là mảng thì gọi đệ quy làm phẳng tiếp, nếu không thì thêm thẳng vào kết quả.', caseReal:'Làm phẳng dữ liệu lồng nhau thường gặp khi xử lý JSON response phức tạp từ API hoặc cấu trúc cây (tree) trong hệ thống thực tế.', tests:[{args:[[1,[2,[3,[4,5]],6]]], expected:[1,2,3,4,5,6]},{args:[[1,2,3]], expected:[1,2,3]},{args:[[[1],[2,[3]]]], expected:[1,2,3]}]},
'group-anagrams':{name:'Nhóm Anagram', difficulty:'Trung bình', signature:'function solve(words)', desc:'Nhóm các từ là anagram của nhau lại thành các mảng con.', example:'<b>Input:</b> ["eat","tea","tan","ate","nat","bat"]\n<b>Output:</b> [["eat","tea","ate"],["tan","nat"],["bat"]]', starter:'function solve(words) {\n  // viết code tại đây\n}', approach:'Dùng HashMap với key là chuỗi đã sắp xếp ký tự (chữ ký chung của các anagram), value là danh sách các từ có cùng chữ ký.', caseReal:'Kỹ thuật "chuẩn hóa thành key rồi group" được dùng để phát hiện trùng lặp gần đúng, ví dụ nhóm bài viết đạo văn có nội dung xáo trộn thứ tự từ.', tests:[{args:[["eat","tea","tan","ate","nat","bat"]], expected:[["ate","eat","tea"],["nat","tan"],["bat"]], normalize:'anagram'}]},
'longest-substring':{name:'Chuỗi con không lặp dài nhất', difficulty:'Khó', signature:'function solve(str)', desc:'Tìm độ dài của chuỗi con dài nhất không chứa ký tự lặp lại (sliding window).', example:'<b>Input:</b> "abcabcbb"\n<b>Output:</b> 3', starter:'function solve(str) {\n  // viết code tại đây\n}', approach:'Dùng sliding window với 1 Set lưu ký tự trong cửa sổ hiện tại, mở rộng cửa sổ về bên phải và thu hẹp bên trái khi gặp ký tự trùng.', caseReal:'Sliding window là kỹ thuật nền tảng cho bài toán phân tích chuỗi/mảng liên tục, ví dụ phát hiện đoạn traffic bất thường trong 1 khoảng thời gian trượt.', tests:[{args:['abcabcbb'], expected:3},{args:['bbbbb'], expected:1},{args:['pwwkew'], expected:3},{args:[''], expected:0}]},
'merge-intervals':{name:'Gộp khoảng thời gian', difficulty:'Khó', signature:'function solve(intervals)', desc:'Cho mảng các khoảng [start,end], gộp các khoảng chồng lấn lại với nhau.', example:'<b>Input:</b> [[1,3],[2,6],[8,10]]\n<b>Output:</b> [[1,6],[8,10]]', starter:'function solve(intervals) {\n  // viết code tại đây\n}', approach:'Sắp xếp các khoảng theo giá trị bắt đầu, sau đó duyệt qua và gộp khoảng hiện tại với khoảng trước nếu chúng chồng lấn.', caseReal:'Gộp khoảng thời gian là bài toán thực tế khi xử lý lịch họp (tìm khoảng trống chung), hoặc gộp khoảng booking phòng trong hệ thống đặt lịch.', tests:[{args:[[[1,3],[2,6],[8,10]]], expected:[[1,6],[8,10]]},{args:[[[1,4],[4,5]]], expected:[[1,5]]}]},

'queue-two-stacks':{name:'Queue bằng 2 Stack', difficulty:'Khó', signature:'function solve(operations)', desc:'Cài đặt hàng đợi bằng 2 Stack. operations là mảng lệnh ["enqueue",giá_trị] hoặc ["dequeue"]. Trả về mảng kết quả các lệnh dequeue theo thứ tự.', example:'<b>Input:</b> [["enqueue",1],["enqueue",2],["dequeue"],["enqueue",3],["dequeue"]]\n<b>Output:</b> [1,2]', starter:'function solve(operations) {\n  // gợi ý: dùng 2 mảng làm 2 stack\n}', approach:'Dùng 1 stack cho việc enqueue (đẩy trực tiếp), khi dequeue mà stack kia rỗng thì đổ hết stack enqueue sang stack dequeue rồi pop.', caseReal:'Bài toán "dùng cấu trúc dữ liệu này để cài đặt cấu trúc dữ liệu khác" là dạng câu hỏi phỏng vấn kinh điển để kiểm tra hiểu bản chất Stack/Queue.', tests:[{args:[[["enqueue",1],["enqueue",2],["dequeue"],["enqueue",3],["dequeue"]]], expected:[1,2]},{args:[[["enqueue","a"],["dequeue"],["enqueue","b"],["enqueue","c"],["dequeue"],["dequeue"]]], expected:['a','b','c']}]},
'max-subarray':{name:'Tổng mảng con lớn nhất', difficulty:'Khó', signature:'function solve(nums)', desc:'Tìm tổng lớn nhất của 1 mảng con liên tiếp (thuật toán Kadane, O(n)).', example:'<b>Input:</b> [-2,1,-3,4,-1,2,1,-5,4]\n<b>Output:</b> 6', starter:'function solve(nums) {\n  // viết code tại đây\n}', approach:'Thuật toán Kadane: duyệt qua mảng, tại mỗi bước giữ tổng lớn nhất kết thúc tại vị trí hiện tại, reset về 0 nếu tổng đang âm — O(n).', caseReal:'Kadane là ví dụ kinh điển về DP 1 chiều, ứng dụng thực tế trong phân tích chuỗi lợi nhuận/lỗ liên tiếp (tìm giai đoạn lãi lớn nhất trong dữ liệu chứng khoán).', tests:[{args:[[-2,1,-3,4,-1,2,1,-5,4]], expected:6},{args:[[1]], expected:1},{args:[[5,4,-1,7,8]], expected:23},{args:[[-3,-1,-2]], expected:-1}]},

'is-prime':{name:'Kiểm tra số nguyên tố', difficulty:'Dễ', signature:'function solve(n)', desc:'Kiểm tra một số nguyên dương có phải số nguyên tố hay không.', example:'<b>Input:</b> 7\n<b>Output:</b> true', starter:'function solve(n) {\n  // viết code tại đây\n}', approach:'Chỉ cần kiểm tra các ước từ 2 đến căn bậc hai của n — không cần kiểm tra hết đến n, giảm độ phức tạp xuống O(√n).', caseReal:'Kiểm tra số nguyên tố là nền tảng của các thuật toán mã hóa (RSA) dùng trong bảo mật hệ thống thực tế.', tests:[{args:[7], expected:true},{args:[8], expected:false},{args:[1], expected:false},{args:[2], expected:true}]},

const feWeeks = [
{title:"Kiến trúc Component & Composable trong Vue 3", points:["Composable là hàm bắt đầu bằng \"use\" đóng gói logic có thể tái sử dụng, tách biệt khỏi UI.","Nguyên tắc: mỗi component nên làm một việc, logic phức tạp đẩy ra composable.","So với mixin cũ ở Vue 2, composable tránh xung đột tên và dễ trace nguồn gốc hơn.","Composable có thể nhận tham số reactive (ref/computed) và trả về state + method.","Trong AWX Refiner, các pattern lặp lại như gọi API + loading state là ứng viên tốt để tách composable."], practice:"Viết composable useApiRequest(url) tự quản lý state loading/data/error, dùng lại nó ở ít nhất 2 nơi khác nhau trong project demo.", case:"Trong các dự án Vue 3 thực tế, composable là cách chuẩn để chia sẻ logic gọi API, xử lý form, hay theo dõi kích thước màn hình — tránh lặp code giữa các component mà không cần Pinia cho những state không thực sự global.", task:"Chọn 1 đoạn logic lặp lại trong AWX Refiner (ví dụ gọi API + loading state), tách thành composable useXxx() và áp dụng lại ở 2 component."},
{title:"Reactivity system nội bộ (Proxy, ref vs reactive)", points:["Vue 3 dùng Proxy để theo dõi thay đổi object, thay cho Object.defineProperty ở Vue 2.","ref() bọc giá trị primitive trong object có .value; reactive() dùng cho object/array, không cần .value.","reactive() mất reactivity khi destructure — dùng toRefs() để giữ lại.","computed là giá trị được cache, chỉ tính lại khi dependency thay đổi.","watch theo dõi nguồn cụ thể; watchEffect tự động track mọi dependency dùng bên trong nó."], practice:"Viết 1 component nhỏ có object reactive() chứa 3 field, thử destructure trực tiếp (sai) rồi sửa bằng toRefs(), log ra console để thấy khác biệt về reactivity.", case:"Bug phổ biến trong dự án lớn: destructure props hoặc store state trực tiếp khiến UI không cập nhật khi state đổi — hiểu rõ ref/reactive giúp debug nhanh loại lỗi này.", task:"Viết đoạn code nhỏ minh họa việc destructure reactive() làm mất reactivity, rồi sửa lại bằng toRefs()."},
{title:"State management pattern (Pinia)", points:["Pinia thay thế Vuex ở Vue 3, API đơn giản hơn và hỗ trợ TypeScript tốt.","Store gồm state, getters (như computed), actions (như methods, có thể async).","Nguyên tắc: chỉ đưa state vào store khi nhiều component không liên quan cần dùng chung.","Tránh lạm dụng store cho state cục bộ chỉ 1 component dùng — ref/reactive local là đủ.","Có thể chia nhiều store nhỏ theo domain (userStore, modelStore...) thay vì 1 store khổng lồ."], practice:"Tạo 1 Pinia store quản lý danh sách item (thêm/xóa/sửa), viết 1 getter tính toán (ví dụ đếm số item), và 1 action gọi API giả lập.", case:"Ở quy mô enterprise, chia store theo domain (thay vì 1 store khổng lồ) giúp nhiều dev làm việc song song mà không đụng code nhau, và dễ code-split theo route.", task:"Liệt kê 3 state hiện đang truyền qua nhiều props (prop drilling) trong AWX Refiner, đánh giá xem có nên đưa vào store không."},
{title:"Performance: lazy loading & code splitting", points:["Code splitting chia bundle thành nhiều chunk nhỏ, chỉ tải khi cần.","Vue Router hỗ trợ lazy load route: component: () => import('./View.vue').","defineAsyncComponent cho phép lazy load component không qua router.","Lazy load ảnh bằng loading=\"lazy\" hoặc IntersectionObserver.","Đo tác động bằng Lighthouse hoặc tab Network trong DevTools trước/sau khi áp dụng."], practice:"Chuyển 2 route bất kỳ trong 1 project Vue sang lazy load, dùng Chrome DevTools Coverage tab đo % code chưa dùng tới khi tải trang chủ.", case:"Các ứng dụng dashboard lớn (như AWX Refiner) thường có hàng chục màn hình quản trị — lazy load theo route là kỹ thuật bắt buộc để giữ thời gian tải ban đầu nhanh.", task:"Chọn 1 route ít dùng trong AWX Refiner, chuyển sang lazy load và so sánh kích thước bundle trước/sau."},
{title:"Virtual DOM & thuật toán diffing", points:["Virtual DOM là cây object JS đại diện cho DOM thật, giúp so sánh (diff) rẻ hơn thao tác DOM trực tiếp.","Vue 3 dùng thuật toán diff tối ưu hơn Vue 2 nhờ compile-time hints (patch flag).","key trong v-for giúp Vue nhận diện đúng phần tử khi list thay đổi, tránh render sai.","Không phải lúc nào Virtual DOM cũng nhanh hơn thao tác DOM trực tiếp — nó đánh đổi để dễ maintain.","Hiểu cơ chế này giải thích tại sao thiếu key gây bug re-render kỳ lạ."], practice:"Tạo 1 danh sách 20 item render bằng v-for, thử đổi thứ tự index làm key rồi dùng Vue Devtools quan sát component nào bị re-render không cần thiết.", case:"Bug UI 'nhảy lung tung' khi xóa/thêm item giữa danh sách gần như luôn bắt nguồn từ dùng sai key trong v-for — lỗi rất phổ biến khi review code frontend.", task:"Tìm 1 chỗ dùng v-for trong code hiện tại thiếu key hoặc dùng index làm key, đánh giá rủi ro và sửa nếu cần."},
{title:"CSS Architecture", points:["BEM (Block Element Modifier) đặt tên class theo cấu trúc rõ ràng, tránh xung đột style.","Utility-first (như TailwindCSS) ưu tiên compose class nhỏ thay vì viết CSS riêng.","Scoped style trong Vue SFC tự động giới hạn phạm vi CSS theo component.","CSS Variables giúp theming động (dark mode, design token) mà không cần build lại.","Kiến trúc CSS nên nhất quán toàn dự án, tránh trộn lẫn nhiều cách đặt tên."], practice:"Chọn 1 trang bất kỳ, viết lại toàn bộ CSS theo đúng 1 quy ước (BEM hoặc utility-first) từ đầu đến cuối, không trộn lẫn.", case:"Dự án có nhiều dev cùng viết CSS mà không theo quy ước chung thường dẫn đến !important tràn lan và CSS ngày càng khó bảo trì — vấn đề rất thực tế ở các team frontend lớn.", task:"Xem lại 1 file .vue trong dự án, đánh giá style đang theo quy ước nào và có nhất quán với phần còn lại không."},
{title:"Accessibility (a11y) cơ bản cho SPA", points:["Dùng đúng thẻ HTML ngữ nghĩa (button, nav, header) thay vì div/span cho mọi thứ.","Mọi input cần có label liên kết (for/id hoặc aria-label).","Đảm bảo tương phản màu đủ để người khiếm thị màu vẫn đọc được.","Hỗ trợ điều hướng bằng bàn phím (Tab, Enter, Esc) cho modal, dropdown.","aria-* attributes bổ sung ngữ nghĩa cho screen reader khi HTML thuần không đủ."], practice:"Audit 1 trang bất kỳ bằng Lighthouse Accessibility score, sửa ít nhất 3 vấn đề nó chỉ ra (thiếu label, contrast thấp...).", case:"Nhiều công ty (đặc biệt khách hàng doanh nghiệp lớn ở Âu-Mỹ) yêu cầu bắt buộc đạt chuẩn WCAG — thiếu a11y có thể khiến sản phẩm không được duyệt hợp đồng.", task:"Thử điều hướng 1 form trong AWX Refiner chỉ bằng bàn phím (không dùng chuột), ghi lại chỗ nào bị kẹt."},
{title:"Web Security: XSS, CSRF trong ứng dụng FE", points:["XSS xảy ra khi input người dùng được render thẳng thành HTML/JS mà không escape.","Vue tự động escape nội dung trong {{ }}, nhưng v-html thì không — cẩn thận khi dùng.","CSRF lợi dụng session đã login để gửi request giả mạo.","CSRF token hoặc SameSite cookie là cách phòng chống phổ biến.","Không bao giờ tin dữ liệu từ client, kể cả khi đã validate ở FE."], practice:"Viết 1 đoạn demo nhỏ: hiển thị input người dùng bằng v-html với nội dung chứa thẻ script, quan sát hành vi, sau đó sửa lại an toàn bằng cách escape hoặc dùng thư viện sanitize (DOMPurify).", case:"Các cuộc pentest bảo mật ở doanh nghiệp thường tìm chính xác các điểm dùng v-html không kiểm soát — đây là lỗ hổng XSS kinh điển vẫn xuất hiện trong code thực tế.", task:"Tìm trong dự án chỗ nào đang dùng v-html, kiểm tra dữ liệu đưa vào có được sanitize không."},
{title:"HTTP caching & network optimization", points:["Cache-Control header quyết định trình duyệt lưu cache bao lâu, khi nào phải revalidate.","ETag giúp server trả 304 Not Modified nếu nội dung không đổi, tiết kiệm băng thông.","Gộp nhiều request nhỏ hoặc dùng HTTP/2 multiplexing để giảm overhead.","Debounce/throttle request khi người dùng gõ tìm kiếm liên tục.","Dùng DevTools tab Network để phân tích request nào chậm, request nào lặp không cần thiết."], practice:"Mở DevTools Network trên 1 trang thật, tìm 1 API bị gọi lại nhiều lần không cần thiết khi gõ tìm kiếm, thêm debounce 300ms và đo số lượng request giảm bao nhiêu.", case:"Chi phí server tăng vọt vì frontend gọi API không kiểm soát là vấn đề thực tế nhiều team gặp khi scale — debounce/cache ở FE là cách rẻ nhất để giảm tải backend.", task:"Mở DevTools Network khi thao tác trên AWX Refiner, tìm 1 request có thể debounce hoặc cache lại."},
{title:"TypeScript nâng cao cho FE", points:["Generics cho phép viết hàm/type tái sử dụng với nhiều kiểu dữ liệu mà vẫn type-safe.","Utility types như Partial, Pick, Omit giúp biến đổi type có sẵn mà không viết lại.","Union type và discriminated union giúp mô hình hóa nhiều trạng thái rõ ràng (loading/success/error).","unknown an toàn hơn any vì bắt buộc kiểm tra kiểu trước khi dùng.","Type guard (typeof, in, instanceof) giúp TypeScript thu hẹp kiểu trong từng nhánh code."], practice:"Viết 1 type ApiState<T> gồm 3 nhánh {status:'loading'} | {status:'success',data:T} | {status:'error',message:string} và áp dụng cho 1 component gọi API thật.", case:"Codebase TypeScript lớn thường có bug ở chỗ dùng any để 'cho qua' lỗi compiler — dần dà mất hết lợi ích type-safety; không lạm dụng any là kỹ năng phân biệt dev giỏi và dev thường.", task:"Viết 1 type union cho trạng thái gọi API (loading | success | error) và áp dụng vào 1 component thực tế."},
{title:"Testing FE với Vitest", points:["Unit test kiểm tra 1 đơn vị logic nhỏ (function, composable) độc lập với UI.","Component test kiểm tra component render đúng, phản ứng đúng với sự kiện người dùng.","Vitest tích hợp tốt với Vite, cú pháp gần giống Jest.","Mock API call khi test để không phụ thuộc vào backend thật.","Test không cần phủ 100%, ưu tiên phần logic quan trọng và dễ vỡ khi refactor."], practice:"Viết 3 test case cho 1 function util (ví dụ formatCurrency): 1 case input hợp lệ, 1 case edge case (số 0/âm), 1 case input không hợp lệ.", case:"Trong CI/CD chuyên nghiệp, PR không có test cho logic quan trọng thường bị reviewer từ chối merge — viết test là kỹ năng bắt buộc, không phải tùy chọn.", task:"Viết 1 unit test đơn giản cho 1 composable hoặc function util hiện có trong dự án."},
{title:"Build tools: Vite", points:["Vite dùng ES Module native trong dev, khởi động nhanh hơn Webpack truyền thống.","Tree-shaking loại bỏ code không dùng tới khi build production.","Chia chunk hợp lý giúp trình duyệt cache hiệu quả hơn khi deploy version mới.","Plugin Vite mở rộng khả năng xử lý (SVG, i18n, compress ảnh...).","Phân biệt rõ config cho dev và production trong vite.config.js."], practice:"Chạy build production (vite build), dùng plugin rollup-plugin-visualizer để xem chunk nào nặng nhất, đề xuất cách giảm.", case:"Bundle size tăng dần theo thời gian là vấn đề âm thầm ở dự án lâu năm — định kỳ phân tích bundle là việc senior FE dev thường làm trước mỗi release lớn.", task:"Xem file vite.config trong dự án, liệt kê các plugin đang dùng và tác dụng của từng cái."},
{title:"Browser rendering pipeline", points:["Trình duyệt xử lý qua các bước: Parse HTML/CSS → Style → Layout → Paint → Composite.","Thay đổi CSS ảnh hưởng layout (width, height) tốn kém hơn thay đổi chỉ ảnh hưởng paint (color).","transform và opacity được tối ưu bởi GPU, nên ưu tiên dùng cho animation.","Reflow hàng loạt do đọc/ghi DOM xen kẽ gây giật lag — nên gộp (batch) lại.","Hiểu pipeline này giải thích tại sao animate width lại giật hơn animate transform."], practice:"Tạo 1 animation di chuyển 1 box bằng cách đổi thuộc tính 'left' (gây reflow), đo FPS bằng Performance tab, sau đó đổi sang 'transform: translateX' và so sánh FPS.", case:"Animation giật lag trên thiết bị yếu thường do đổi sai thuộc tính CSS (layout-triggering thay vì composite-only) — lỗi performance cổ điển hay bị hỏi khi phỏng vấn senior FE.", task:"Tìm 1 chỗ trong CSS/animation của dự án đang animate thuộc tính gây reflow (width, top...), đề xuất đổi sang transform."},
{title:"Web APIs nâng cao", points:["IntersectionObserver phát hiện phần tử xuất hiện trong viewport, dùng cho lazy load, infinite scroll.","Web Worker chạy JS ở luồng riêng, không block UI khi xử lý nặng.","ResizeObserver theo dõi thay đổi kích thước phần tử mà không cần lắng nghe resize toàn trang.","localStorage/sessionStorage lưu dữ liệu phía client, khác nhau về vòng đời.","Các API này giúp giảm tải cho main thread và cải thiện trải nghiệm người dùng."], practice:"Cài đặt infinite scroll đơn giản bằng IntersectionObserver cho 1 danh sách dài (fetch thêm data khi cuộn đến cuối).", case:"Các bảng dữ liệu lớn trong dashboard quản trị (model list, log list...) gần như luôn cần phân trang hoặc infinite scroll để không load hết dữ liệu cùng lúc gây treo trang.", task:"Nghĩ 1 tính năng trong AWX Refiner có thể hưởng lợi từ IntersectionObserver (ví dụ infinite scroll danh sách model)."},
{title:"Design patterns trong FE", points:["Observer pattern: component lắng nghe và phản ứng khi state thay đổi (nền tảng của reactivity).","Factory pattern: hàm tạo ra component/object khác nhau dựa trên điều kiện đầu vào.","Singleton: đảm bảo chỉ có 1 instance duy nhất (ví dụ 1 instance axios dùng chung toàn app).","Provide/Inject trong Vue là dạng Dependency Injection, tránh truyền props qua nhiều tầng.","Nhận diện pattern giúp đọc hiểu code người khác nhanh hơn, không phải để áp dụng máy móc."], practice:"Refactor 1 chỗ đang truyền props qua 2-3 tầng component sang dùng provide/inject, so sánh độ rõ ràng của code trước/sau.", case:"'Prop drilling' là code smell rất phổ biến trong codebase Vue lớn tuổi — nhận diện và refactor đúng lúc là kỹ năng phân biệt code sạch và code rối.", task:"Tìm 1 chỗ trong dự án đang truyền props qua 3+ tầng component, đánh giá có nên dùng provide/inject không."},
{title:"SSR vs CSR vs SSG", points:["CSR: trình duyệt tải JS rồi mới render — SEO kém, first paint chậm hơn.","SSR: server render HTML sẵn, tốt cho SEO và tốc độ tải đầu.","SSG: build sẵn HTML tĩnh lúc build time, nhanh nhất nhưng không hợp nội dung động.","Nuxt.js là framework phổ biến để làm SSR/SSG cho Vue.","Chọn hướng nào phụ thuộc yêu cầu SEO và tần suất thay đổi nội dung, không có hướng nào tốt hơn tuyệt đối."], practice:"Dựng thử 1 project Nuxt nhỏ (npx nuxi init), so sánh view-source của trang CSR thuần và trang SSR Nuxt để thấy khác biệt HTML trả về.", case:"Landing page hoặc trang blog của sản phẩm SaaS thường cần SSR/SSG để lên Google tốt, trong khi phần dashboard sau đăng nhập (như AWX Refiner) vẫn dùng CSR vì không cần SEO.", task:"AWX Refiner hiện là CSR — thử nghĩ xem có phần nào (landing page, docs) sẽ hưởng lợi nếu chuyển sang SSR/SSG."},
{title:"Micro-frontend là gì, khi nào cần", points:["Micro-frontend chia 1 ứng dụng lớn thành nhiều phần độc lập, có thể phát triển/deploy riêng.","Phù hợp với team lớn, nhiều nhóm cùng làm trên 1 sản phẩm mà không muốn đụng code nhau.","Module Federation (Webpack 5) là kỹ thuật phổ biến để chia sẻ code giữa các micro-frontend.","Đánh đổi: phức tạp hơn về hạ tầng, cần đồng bộ version dependency giữa các phần.","Không nên áp dụng cho dự án nhỏ hoặc team nhỏ — độ phức tạp không đáng."], practice:"Đọc 1 case study thực tế về micro-frontend (ví dụ của Spotify hoặc IKEA), tóm tắt lại lý do họ chọn kiến trúc này bằng 3-4 câu.", case:"Micro-frontend chỉ thực sự đáng đầu tư khi có nhiều team lớn (50+ dev) làm cùng 1 sản phẩm — với quy mô nhỏ hơn, chi phí phức tạp thường lớn hơn lợi ích.", task:"Viết vài dòng nhận định xem AWX Refiner có đang ở quy mô cần micro-frontend hay chưa, vì sao."},
{title:"Progressive Web App (PWA) cơ bản", points:["PWA là web app có thể cài đặt như app native, hoạt động offline nhờ Service Worker.","Service Worker là script chạy nền, can thiệp vào network request để cache tài nguyên.","manifest.json khai báo icon, tên app, màu theme khi cài lên màn hình chính.","PWA phù hợp cho ứng dụng cần dùng offline hoặc muốn trải nghiệm giống app di động.","Không phải app nào cũng cần PWA — cân nhắc dựa trên nhu cầu người dùng thực tế."], practice:"Thêm 1 file manifest.json cơ bản và 1 Service Worker đơn giản (cache 1 vài file tĩnh) vào 1 project demo, thử tắt mạng và load lại trang.", case:"Ứng dụng thương mại điện tử hoặc tin tức thường dùng PWA để giữ chân người dùng ở khu vực mạng yếu — đây là bài toán thực tế PWA giải quyết tốt.", task:"Thử mở 1 web PWA quen thuộc trên điện thoại, quan sát cách nó hoạt động khi mất mạng."},
{title:"Debugging & performance profiling", points:["Tab Performance trong DevTools ghi lại timeline render, giúp tìm hàm nào tốn thời gian nhất.","Vue Devtools extension giúp xem component tree, props, state real-time.","console.time/console.timeEnd đo nhanh thời gian chạy 1 đoạn code cụ thể.","Memory tab giúp phát hiện memory leak (component không được garbage collect sau khi unmount).","Luôn đo trước khi tối ưu — đừng đoán chỗ nào chậm mà không có số liệu."], practice:"Ghi lại 1 đoạn Performance timeline khi thao tác 1 trang có danh sách dài, tìm hàm nào chiếm 'Self time' nhiều nhất trong flame chart.", case:"Khi người dùng report 'trang bị đơ', bước đầu tiên của FE dev chuyên nghiệp luôn là mở Performance tab để có số liệu cụ thể, thay vì đoán mò.", task:"Dùng tab Performance ghi lại 1 thao tác trong AWX Refiner cảm thấy chậm, xem hàm nào chiếm nhiều thời gian nhất."},
{title:"Code review & clean code cho FE", points:["Đặt tên biến/hàm rõ nghĩa quan trọng hơn viết comment giải thích code khó hiểu.","1 hàm nên làm 1 việc — nếu tên hàm có chữ \"and\" thường là dấu hiệu nên tách nhỏ.","Khi review code người khác, hỏi \"tại sao\" trước khi hỏi \"sao không làm cách khác\".","Convention nhất quán quan trọng hơn convention \"đúng nhất\" về lý thuyết.","Refactor an toàn khi có test bảo vệ — nếu chưa có test, cẩn trọng hơn khi đổi cấu trúc."], practice:"Chọn 1 hàm dài hơn 30 dòng trong 1 project, refactor tách thành 2-3 hàm nhỏ hơn, mỗi hàm có 1 trách nhiệm rõ ràng.", case:"Code review ở môi trường chuyên nghiệp thường xoay quanh việc đặt tên và tách hàm hợp lý hơn là style cá nhân — kỹ năng ảnh hưởng trực tiếp đến việc code có được approve nhanh hay không.", task:"Tự review lại 1 đoạn code bạn viết tuần trước, tìm 1 chỗ có thể đặt tên rõ hơn hoặc tách nhỏ hàm."},
{title:"Nuxt.js tổng quan", points:["Nuxt là framework xây trên Vue, hỗ trợ sẵn SSR/SSG, routing tự động theo cấu trúc thư mục.","File-based routing: mỗi file trong pages/ tự động thành 1 route, không cần khai báo thủ công.","Nuxt cung cấp sẵn tối ưu SEO (meta tag động) dễ dàng hơn so với tự cấu hình Vue CSR.","useFetch/useAsyncData là composable đặc trưng của Nuxt để fetch dữ liệu tương thích SSR.","Nuxt phù hợp khi dự án cần SEO tốt hoặc muốn giảm cấu hình thủ công so với Vue CLI/Vite thuần."], practice:"Tạo 1 trang trong Nuxt project demo, dùng useFetch để lấy dữ liệu từ 1 API công khai (ví dụ JSONPlaceholder), kiểm tra view-source thấy dữ liệu đã có sẵn trong HTML.", case:"Các công ty chuyển từ Vue CSR sang Nuxt thường vì lý do SEO hoặc muốn giảm thời gian cấu hình routing/build thủ công.", task:"Đọc qua tài liệu Nuxt, so sánh cấu trúc thư mục pages/ với cách tổ chức route hiện tại của AWX Refiner."},
{title:"Pinia nâng cao: plugin & persisted state", points:["Pinia hỗ trợ plugin để mở rộng hành vi cho mọi store (ví dụ tự động lưu localStorage).","pinia-plugin-persistedstate giúp giữ state qua lần reload trang mà không cần tự viết logic lưu/khôi phục.","Có thể subscribe vào store ($subscribe) để lắng nghe mọi thay đổi state, hữu ích cho logging/debug.","Composing nhiều store với nhau cần cẩn thận tránh phụ thuộc vòng.","Không phải state nào cũng cần persist — chỉ nên lưu những gì thực sự cần giữ qua phiên làm việc."], practice:"Thêm pinia-plugin-persistedstate vào 1 store, chọn 1 field (ví dụ filter đang chọn) để tự động lưu qua localStorage, test bằng cách reload trang.", case:"Tính năng 'giữ nguyên bộ lọc sau khi F5' là yêu cầu UX rất hay gặp trong các dashboard quản trị — pattern này giải quyết gọn bằng persisted state.", task:"Xác định 1 state trong AWX Refiner nên được giữ lại sau khi reload trang (ví dụ filter đang chọn), thử áp dụng persisted state."},
{title:"Web Components & Custom Elements", points:["Web Components là chuẩn trình duyệt cho phép tạo custom HTML tag tái sử dụng, độc lập framework.","Shadow DOM đóng gói style/markup của component, tránh xung đột CSS với trang cha.","Có thể dùng Web Components bên trong Vue, hữu ích khi cần chia sẻ UI giữa nhiều dự án khác framework.","Web Components chạy được ở bất kỳ nơi nào hỗ trợ HTML/JS chuẩn, không cần build riêng.","Đánh đổi: cú pháp và tooling kém tiện hơn Vue component thông thường."], practice:"Tạo 1 custom element đơn giản (ví dụ my-badge) bằng Web Components API thuần (customElements.define), nhúng thử vào 1 trang HTML bất kỳ.", case:"Design system dùng chung giữa nhiều dự án khác framework (Vue, React, Angular) đôi khi được xây bằng Web Components để không phụ thuộc framework cụ thể.", task:"Thử tạo 1 custom element đơn giản bằng Web Components API thuần, không dùng framework."},
{title:"GraphQL vs REST từ góc nhìn Frontend", points:["REST trả về cấu trúc dữ liệu cố định theo endpoint; GraphQL cho phép client tự chọn field cần lấy.","GraphQL giúp giảm over-fetching/under-fetching dữ liệu so với REST truyền thống.","REST đơn giản hơn để cache (theo URL); GraphQL cần thư viện riêng (Apollo Client, urql) để cache hiệu quả.","Chọn GraphQL hợp lý khi UI phức tạp cần dữ liệu từ nhiều nguồn; REST vẫn đủ tốt cho hầu hết CRUD đơn giản.","Không cần đổi toàn bộ hệ thống — có thể đánh giá theo từng tính năng cụ thể cần loại API nào."], practice:"Viết thử 1 GraphQL query giả định lấy đúng 3 field cần thiết cho 1 màn hình cụ thể, so sánh với response JSON đầy đủ mà REST API tương ứng trả về.", case:"Ứng dụng mobile với băng thông hạn chế thường được nhắc tới như lý do điển hình để chọn GraphQL thay vì REST, vì giảm dữ liệu thừa truyền qua mạng.", task:"So sánh 1 API REST đang dùng trong AWX Refiner với cách nó sẽ trông như thế nào nếu viết bằng GraphQL query."},
];

/* ============ JAVA BACKEND TRACK — 24 TUẦN / 6 THÁNG ============ */
const beWeeks = [
{title:"Java cơ bản: cú pháp, kiểu dữ liệu, biến", points:["Java là ngôn ngữ biên dịch — code .java được compile thành bytecode .class chạy trên JVM.","Kiểu dữ liệu nguyên thủy (int, double, boolean, char...) khác với kiểu tham chiếu (String, Object).","Biến phải khai báo kiểu rõ ràng (static typing), không suy luận linh hoạt như JavaScript.","Java phân biệt hoa thường; mỗi file .java có class public phải trùng tên file.","Câu lệnh điều kiện (if/else, switch) và vòng lặp (for/while) khá giống JS về cú pháp."], practice:"Viết chương trình nhận 2 số từ bàn phím (Scanner), in ra tổng, hiệu, tích, thương.", case:"Hầu hết hệ thống backend doanh nghiệp (ngân hàng, bảo hiểm) vẫn chạy Java vì tính ổn định và hệ sinh thái enterprise lâu đời — nắm vững cú pháp cơ bản là bước đầu bắt buộc.", task:"Cài JDK, viết chương trình Java đầu tiên in ra \"Hello World\" và 1 phép tính đơn giản, chạy bằng javac rồi java."},
{title:"OOP: Class & Object", points:["Class là khuôn mẫu định nghĩa thuộc tính (field) và hành vi (method) của object.","Object là thực thể cụ thể được tạo ra từ class bằng từ khóa new.","Constructor là method đặc biệt chạy khi tạo object, dùng để khởi tạo giá trị ban đầu.","Access modifier (private, public, protected) kiểm soát phạm vi truy cập field/method.","Getter/Setter là cách phổ biến để truy cập field private một cách có kiểm soát (encapsulation)."], practice:"Viết class BankAccount với field balance, method deposit()/withdraw() có kiểm tra số dư âm.", case:"Encapsulation (field private + getter/setter) là yêu cầu tối thiểu trong mọi code review Java chuyên nghiệp — lộ field public trực tiếp gần như luôn bị từ chối merge.", task:"Viết class Model (giống khái niệm model trong AWX Refiner) với vài field private, constructor, getter/setter, rồi tạo vài object thử."},
{title:"Kế thừa & Đa hình", points:["extends cho phép 1 class kế thừa field/method từ class cha, tránh lặp code.","Đa hình cho phép gọi cùng 1 method nhưng hành vi khác nhau tùy class con.","@Override đánh dấu method con ghi đè method cha, giúp compiler kiểm tra lỗi.","super() gọi constructor của class cha từ class con.","Đa hình hữu ích khi xử lý danh sách nhiều loại object khác nhau qua cùng 1 kiểu cha."], practice:"Viết class Shape cha, các class con Circle/Square override method calculateArea(), tính tổng diện tích của 1 danh sách Shape hỗn hợp.", case:"Đa hình là nền tảng của các framework enterprise Java (Spring xử lý mọi bean qua interface) — hiểu sai đa hình khiến rất khó đọc hiểu code Spring sau này.", task:"Tạo class cha Animal và 2 class con Dog, Cat override method makeSound(), thử gọi qua 1 mảng kiểu Animal."},
{title:"Interface & Abstract class", points:["Interface định nghĩa \"hợp đồng\" các method phải implement, không chứa logic (trước Java 8).","Abstract class có thể chứa cả method đã implement và method trừu tượng chưa implement.","1 class có thể implement nhiều interface nhưng chỉ extends 1 class (abstract hoặc thường).","Interface phù hợp khi muốn định nghĩa khả năng cho nhiều class không liên quan.","Abstract class phù hợp khi các class con có chung 1 phần logic cơ bản."], practice:"Định nghĩa interface PaymentMethod với method pay(amount), implement ở 2 class CreditCardPayment và CashPayment.", case:"Các hệ thống thanh toán thực tế luôn dùng interface để dễ dàng thêm phương thức thanh toán mới (Momo, ZaloPay...) mà không sửa code cũ — đúng nguyên lý Open/Closed.", task:"Định nghĩa interface Trainable với method train(), implement nó ở 2 class khác nhau."},
{title:"Exception Handling", points:["try/catch/finally xử lý lỗi runtime mà không làm crash toàn chương trình.","Checked exception (bắt buộc catch hoặc khai báo throws) khác unchecked exception (RuntimeException).","finally luôn chạy dù có exception hay không, thường dùng để đóng tài nguyên (file, connection).","Tự định nghĩa custom exception bằng cách extends Exception hoặc RuntimeException.","Không nên catch Exception chung chung rồi bỏ qua — luôn xử lý hoặc log rõ ràng."], practice:"Viết class InsufficientFundsException custom, ném ra khi rút tiền vượt số dư trong ví dụ BankAccount ở tuần 2.", case:"Hệ thống production luôn cần custom exception có message rõ ràng để log lỗi hữu ích — exception chung chung là ác mộng khi debug production.", task:"Viết hàm chia 2 số, ném custom exception khi chia cho 0, và catch xử lý ở nơi gọi."},
{title:"Collections Framework", points:["List (ArrayList, LinkedList) lưu dữ liệu có thứ tự, cho phép trùng lặp.","Set (HashSet, TreeSet) không cho phép trùng lặp; HashSet không đảm bảo thứ tự.","Map (HashMap, TreeMap) lưu cặp key-value, tra cứu theo key rất nhanh (gần O(1) với HashMap).","Chọn cấu trúc dữ liệu phù hợp quan trọng hơn nhớ hết API — hỏi \"cần thứ tự không, cần unique không, cần tra cứu nhanh không\".","Duyệt Collection bằng for-each hoặc Stream API (Java 8+)."], practice:"Dùng HashMap<String,Integer> để đếm số lần xuất hiện của mỗi từ trong 1 đoạn văn bản dài.", case:"Đếm tần suất, group dữ liệu theo key là thao tác cực kỳ phổ biến trong xử lý dữ liệu backend thực tế (thống kê log, báo cáo...).", task:"Dùng HashMap để đếm tần suất xuất hiện của từng ký tự trong 1 chuỗi."},
{title:"String & StringBuilder", points:["String trong Java là immutable — mỗi lần \"sửa\" thực chất tạo object String mới.","Nối chuỗi bằng + trong vòng lặp lớn kém hiệu quả vì tạo nhiều object thừa.","StringBuilder mutable, phù hợp khi cần nối/sửa chuỗi nhiều lần trong vòng lặp.","Các method thường dùng: substring(), split(), trim(); dùng equals() để so sánh nội dung, không dùng ==.","== so sánh tham chiếu (địa chỉ object), equals() so sánh nội dung — lỗi phổ biến của người mới."], practice:"Viết hàm nối 10.000 chuỗi nhỏ bằng String + trong vòng lặp và bằng StringBuilder, đo thời gian chạy của cả 2 cách.", case:"Dùng String + trong vòng lặp lớn là lỗi performance kinh điển bị bắt lỗi trong code review Java ở môi trường chuyên nghiệp.", task:"Viết hàm dùng StringBuilder để đảo ngược 1 chuỗi, so sánh cách viết với dùng String + trong vòng lặp."},
{title:"Java 8: Lambda & Stream API", points:["Lambda expression là cách viết hàm ẩn danh gọn hơn, cú pháp (params) -> expression.","Stream API xử lý Collection theo phong cách functional: filter, map, reduce, collect.","Stream không thay đổi dữ liệu gốc, trả về stream mới sau mỗi phép biến đổi (giống method chain trong JS).","Functional interface (Runnable, Comparator...) chỉ có 1 method trừu tượng, dùng được với lambda.","Stream giúp code ngắn gọn hơn nhưng debug khó hơn vòng lặp thường — cân nhắc độ phức tạp bài toán."], practice:"Từ 1 List<Employee> có field salary, dùng Stream để lọc nhân viên lương lớn hơn X rồi tính lương trung bình.", case:"Xử lý danh sách bằng Stream thay vì vòng lặp thủ công là phong cách code Java hiện đại được kỳ vọng ở dev từ mid-level trở lên.", task:"Dùng Stream API: từ 1 List<Integer>, lọc số chẵn rồi tính tổng bằng filter + reduce."},
{title:"Generics trong Java", points:["Generics cho phép class/method hoạt động với nhiều kiểu dữ liệu mà vẫn type-safe tại compile time.","List<String> đảm bảo compiler bắt lỗi nếu thêm nhầm kiểu khác vào list.","Ký hiệu quy ước: T (Type), E (Element), K/V (Key/Value) khi định nghĩa generic.","Bounded type (<T extends Number>) giới hạn generic chỉ nhận kiểu con của 1 class/interface.","Generics giúp tránh phải ép kiểu (cast) thủ công và giảm lỗi runtime."], practice:"Viết class Pair<K,V> chứa 2 giá trị bất kỳ kiểu, có method getKey()/getValue().", case:"Các thư viện enterprise Java (Optional<T>, List<T>...) đều dựa trên Generics — không hiểu Generics sẽ rất khó đọc signature của các thư viện phổ biến.", task:"Viết 1 class Box<T> chứa 1 giá trị kiểu T bất kỳ, với method get/set."},
{title:"Multithreading cơ bản", points:["Thread là 1 luồng thực thi độc lập, cho phép chương trình làm nhiều việc \"song song\".","Tạo thread bằng extends Thread hoặc implements Runnable (Runnable linh hoạt hơn).","Race condition xảy ra khi nhiều thread cùng truy cập/sửa 1 dữ liệu chung không kiểm soát.","Từ khóa synchronized đảm bảo chỉ 1 thread truy cập đoạn code tại 1 thời điểm.","Multithreading mạnh nhưng phức tạp — chỉ dùng khi thực sự cần xử lý song song."], practice:"Viết 2 thread cùng tăng 1 biến counter chung 10.000 lần không đồng bộ, quan sát kết quả sai lệch, sau đó sửa bằng synchronized và so sánh.", case:"Race condition là nguyên nhân của nhiều bug 'ngẫu nhiên khó tái hiện' nổi tiếng khó debug nhất trong hệ thống backend thực tế có xử lý song song.", task:"Viết 2 Thread cùng in số đếm từ 1 đến 5, quan sát thứ tự output có bị xen kẽ không dự đoán được."},
{title:"File I/O trong Java", points:["java.io và java.nio là 2 package chính để đọc/ghi file trong Java.","BufferedReader/BufferedWriter đọc/ghi theo dòng, hiệu quả hơn đọc từng byte.","try-with-resources tự động đóng file/stream sau khi dùng xong, tránh leak tài nguyên.","Files.readAllLines() (java.nio) là cách ngắn gọn để đọc nhanh 1 file nhỏ.","Luôn xử lý exception khi làm việc với file vì file có thể không tồn tại hoặc thiếu quyền."], practice:"Viết chương trình đọc 1 file CSV đơn giản (tên,tuổi) và in ra danh sách người trên 18 tuổi.", case:"Xử lý file (import/export CSV, log file) vẫn là tác vụ backend rất phổ biến trong các hệ thống doanh nghiệp, đặc biệt các module báo cáo.", task:"Viết chương trình đọc 1 file text và đếm số dòng, số từ trong file đó."},
{title:"Maven/Gradle — quản lý dependency", points:["Maven/Gradle quản lý thư viện bên ngoài (dependency) và quy trình build của dự án Java.","pom.xml (Maven) hoặc build.gradle khai báo dependency, version, plugin cần dùng.","Dependency scope (compile, test, runtime) quyết định thư viện dùng ở giai đoạn nào.","Build lifecycle: compile → test → package → install/deploy.","Gradle dùng Groovy/Kotlin DSL, thường nhanh hơn Maven nhờ build cache và incremental build."], practice:"Tạo project Maven mới, thêm dependency Gson hoặc Jackson, viết code chuyển 1 object Java thành chuỗi JSON.", case:"Không dự án Java thực tế nào không dùng build tool để quản lý dependency — kỹ năng nền tảng bắt buộc trước khi làm việc với bất kỳ codebase Java nào.", task:"Tạo 1 project Maven/Gradle mới, thêm 1 dependency đơn giản (ví dụ JUnit) và build thử."},
{title:"JDBC — kết nối Database", points:["JDBC là API chuẩn để Java giao tiếp với database quan hệ.","Connection, Statement/PreparedStatement, ResultSet là 3 thành phần chính khi thao tác JDBC.","PreparedStatement tránh SQL Injection bằng cách tham số hóa câu query thay vì nối chuỗi thủ công.","Luôn đóng Connection/Statement/ResultSet sau khi dùng (hoặc dùng try-with-resources).","JDBC là nền tảng để hiểu ORM (JPA/Hibernate) hoạt động bên dưới thế nào."], practice:"Kết nối tới 1 database SQLite/MySQL cục bộ, viết query SELECT lấy danh sách và in ra console.", case:"Dù đã có ORM hiện đại, hiểu JDBC vẫn cần thiết để debug các câu query phức tạp hoặc tối ưu performance mà ORM sinh SQL không hiệu quả.", task:"Viết đoạn code JDBC kết nối tới 1 database (SQLite/MySQL) và query 1 bảng đơn giản."},
{title:"Giới thiệu Spring Boot", points:["Spring Boot giúp xây dựng ứng dụng Java (đặc biệt REST API) nhanh, ít cấu hình thủ công.","@SpringBootApplication là annotation khởi động toàn bộ ứng dụng Spring Boot.","Dependency Injection (DI) là core concept: Spring tự quản lý vòng đời và inject các object (bean) cần thiết.","@Component, @Service, @Repository đánh dấu các loại bean khác nhau theo tầng trong ứng dụng.","Spring Boot dùng embedded server (Tomcat) nên chạy được ngay bằng lệnh, không cần cài server riêng."], practice:"Tạo project Spring Boot với 1 dependency Spring Web, viết 1 endpoint GET /hello trả về chuỗi 'Hello Spring Boot'.", case:"Spring Boot là framework backend Java phổ biến nhất hiện nay ở các công ty — hầu hết vị trí Java Backend đều yêu cầu thành thạo Spring Boot.", task:"Tạo project Spring Boot mới (dùng start.spring.io), chạy thử và xem log khởi động ứng dụng."},
{title:"REST API với Spring Boot", points:["@RestController đánh dấu class xử lý request và trả về dữ liệu (thường là JSON).","@GetMapping, @PostMapping, @PutMapping, @DeleteMapping map tới các HTTP method tương ứng.","@RequestBody lấy dữ liệu từ body request, @PathVariable lấy dữ liệu từ URL path.","Response nên có status code rõ ràng (200, 201, 404, 400...) thay vì luôn trả 200.","Thiết kế REST tốt: đặt tên endpoint theo resource (danh từ), dùng đúng HTTP method cho đúng hành động."], practice:"Xây REST API CRUD đầy đủ (GET/POST/PUT/DELETE) cho 1 resource đơn giản (ví dụ Product) lưu tạm trong List (chưa cần database).", case:"CRUD API là bài test kỹ thuật phổ biến nhất khi phỏng vấn vị trí Java Backend — thành thạo phần này là yêu cầu tối thiểu.", task:"Viết 1 REST API đơn giản quản lý danh sách \"model\" (giống AWX Refiner) với endpoint GET và POST."},
{title:"Spring Data JPA & ORM", points:["ORM ánh xạ giữa class Java và bảng database, giảm code SQL thủ công.","@Entity đánh dấu class tương ứng với 1 bảng, @Id đánh dấu khóa chính.","JpaRepository cung cấp sẵn các method CRUD cơ bản (save, findById, findAll, delete) không cần viết SQL.","Có thể viết custom query bằng tên method (findByName) hoặc @Query khi cần phức tạp hơn.","ORM tiện lợi nhưng cần hiểu SQL bên dưới để debug khi performance có vấn đề (N+1 query...)."], practice:"Kết nối Entity Product ở tuần 15 với database thật qua Spring Data JPA, thay List tạm bằng JpaRepository, test lại toàn bộ CRUD.", case:"Hầu hết hệ thống backend thực tế đều cần lưu dữ liệu lâu dài qua database — JPA là kỹ năng phải có để biến demo thành ứng dụng thật.", task:"Định nghĩa 1 Entity Model với vài field, tạo Repository kế thừa JpaRepository và thử save/find dữ liệu."},
{title:"Authentication & JWT cơ bản", points:["Authentication trả lời \"bạn là ai\"; Authorization trả lời \"bạn được làm gì\".","JWT là chuỗi mã hóa chứa thông tin user, được ký để chống giả mạo.","Luồng phổ biến: login trả về JWT → client gửi JWT trong header Authorization ở các request sau.","JWT không nên chứa dữ liệu nhạy cảm vì phần payload chỉ encode chứ không mã hóa.","Spring Security là thư viện phổ biến để tích hợp authentication/authorization vào Spring Boot."], practice:"Thêm 1 endpoint /login trả về JWT giả lập (có thể dùng thư viện jjwt), thử decode token đó ở jwt.io để xem payload.", case:"Gần như mọi hệ thống backend production đều cần cơ chế authentication — JWT là chuẩn phổ biến nhất cho REST API stateless hiện nay.", task:"Đọc thử cấu trúc 1 JWT thật (header.payload.signature) bằng jwt.io, xác định phần nào chứa thông tin gì."},
{title:"Unit Testing với JUnit", points:["JUnit là framework testing phổ biến nhất cho Java, tương tự Vitest/Jest bên JS.","@Test đánh dấu 1 method là test case; assertEquals/assertTrue kiểm tra kết quả mong đợi.","@BeforeEach/@AfterEach chạy trước/sau mỗi test, dùng để setup/cleanup dữ liệu test.","Mockito giúp giả lập (mock) dependency bên ngoài khi test logic, không phụ thuộc hệ thống thật.","Test tốt nên độc lập với nhau — thứ tự chạy test không được ảnh hưởng tới kết quả."], practice:"Viết test case JUnit cho CRUD API ở tuần 15/16, dùng MockMvc hoặc test trực tiếp method service.", case:"Dự án backend không có test coverage cho business logic quan trọng thường bị đánh giá thấp về chất lượng trong review kỹ thuật khi ứng tuyển hoặc audit code.", task:"Viết 1–2 test case JUnit cho hàm chia có xử lý exception đã viết ở tuần 5."},
{title:"Design Patterns phổ biến trong Java", points:["Singleton đảm bảo 1 class chỉ có đúng 1 instance trong toàn ứng dụng (ví dụ 1 connection pool).","Factory pattern tách logic tạo object ra khỏi nơi sử dụng, dễ mở rộng thêm loại mới.","Builder pattern giúp tạo object phức tạp với nhiều field optional mà không cần constructor rối rắm.","Strategy pattern cho phép đổi thuật toán/xử lý linh hoạt tại runtime thông qua interface chung.","Design pattern là công cụ giải quyết vấn đề lặp lại, không phải mục tiêu để nhồi vào mọi chỗ."], practice:"Refactor 1 chỗ trong code Spring Boot đang new trực tiếp object phụ thuộc, chuyển sang inject qua constructor (@Autowired).", case:"Spring Boot bản chất được xây trên nguyên lý Dependency Injection — hiểu design pattern giúp giải thích được 'tại sao Spring hoạt động như vậy' thay vì chỉ copy code mẫu.", task:"Nhận diện xem trong code Spring Boot đã viết (JpaRepository, @Service...) có dùng pattern nào ở trên không."},
{title:"Triển khai Java với Docker cơ bản", points:["Docker đóng gói ứng dụng cùng môi trường chạy (JDK, dependency) thành 1 image thống nhất.","Dockerfile định nghĩa các bước build image: FROM, COPY, RUN, CMD/ENTRYPOINT.","Build image bằng docker build, chạy container bằng docker run.","Multi-stage build giúp giảm kích thước image cuối (build bằng JDK, chạy bằng JRE nhẹ hơn).","Docker giúp môi trường dev/staging/production giống nhau, tránh lỗi \"chạy trên máy tôi thì được\"."], practice:"Viết 1 Dockerfile đơn giản để đóng gói ứng dụng Spring Boot đã tạo ở tuần 14, build và chạy thử container.", case:"Hầu hết công ty deploy backend Java lên Docker/Kubernetes ngày nay — không biết Docker gần như đồng nghĩa không thể tham gia quy trình deploy thực tế của team.", task:"Viết 1 Dockerfile đơn giản để đóng gói ứng dụng Spring Boot đã tạo ở tuần 14, build và chạy thử container."},
{title:"Spring Security nâng cao", points:["Spring Security cho phép phân quyền chi tiết theo role (ADMIN, USER...) trên từng endpoint.","@PreAuthorize kiểm tra quyền ngay tại method trước khi cho thực thi.","SecurityFilterChain định nghĩa endpoint nào public, endpoint nào cần xác thực.","Phân biệt rõ 401 (chưa xác thực) và 403 (đã xác thực nhưng không đủ quyền) khi trả response lỗi.","Không nên tự viết hệ thống authentication từ đầu khi đã có Spring Security xử lý tốt các trường hợp phổ biến."], practice:"Thêm 2 role (ADMIN, USER) vào hệ thống JWT ở tuần 17, giới hạn 1 endpoint chỉ ADMIN mới gọi được, test bằng 2 token khác role.", case:"Phân quyền theo role là yêu cầu gần như bắt buộc ở mọi hệ thống backend có nhiều loại người dùng (admin, nhân viên, khách hàng...).", task:"Thêm phân quyền đơn giản (ADMIN/USER) vào REST API đã viết ở tuần 15, thử gọi bằng 2 role khác nhau."},
{title:"Caching cơ bản với Redis", points:["Cache lưu tạm kết quả tính toán/tra cứu tốn kém để lần sau trả nhanh hơn mà không cần làm lại.","Redis là in-memory data store phổ biến để làm cache layer trước database.","@Cacheable trong Spring Boot tự động cache kết quả method theo key, không cần tự viết logic thủ công.","Cần đặt thời gian hết hạn (TTL) cho cache để tránh trả dữ liệu cũ mãi mãi.","Cache hữu ích cho dữ liệu đọc nhiều, ghi ít — không phù hợp cho dữ liệu thay đổi liên tục."], practice:"Thử thêm @Cacheable vào 1 method truy vấn dữ liệu trong project Spring Boot, đo thời gian phản hồi trước/sau.", case:"Cache giúp giảm tải database đáng kể ở các API đọc nhiều — kỹ thuật tối ưu performance rất thường gặp khi hệ thống có lượng truy cập lớn.", task:"Thử thêm @Cacheable vào 1 method truy vấn dữ liệu trong project Spring Boot, đo thời gian phản hồi trước/sau."},
{title:"Kiến trúc Microservices tổng quan", points:["Microservices chia hệ thống lớn thành nhiều service nhỏ độc lập, mỗi service 1 trách nhiệm rõ ràng.","Trái ngược với Monolith (toàn bộ logic gói trong 1 ứng dụng duy nhất, dễ phát triển ban đầu hơn).","Các service giao tiếp qua REST API hoặc message queue (Kafka, RabbitMQ) thay vì gọi hàm trực tiếp.","Đánh đổi: phức tạp hơn về vận hành, cần xử lý network failure, đồng bộ dữ liệu giữa các service.","Không nên bắt đầu dự án mới bằng microservices — thường bắt đầu Monolith rồi tách dần khi cần."], practice:"Vẽ sơ đồ đơn giản (trên giấy hoặc draw.io) 1 hệ thống e-commerce chia thành 3 service: Order, Product, User — xác định chúng cần gọi nhau ở đâu.", case:"Nhiều công ty lớn (Amazon, Netflix) nổi tiếng với kiến trúc microservices — hiểu tư duy này giúp đọc hiểu các hệ thống doanh nghiệp lớn dù chưa trực tiếp xây dựng chúng.", task:"Vẽ sơ đồ đơn giản: nếu AWX Refiner tách thành microservices, những service nào sẽ tách riêng (model management, auth, notification...)?"},
{title:"CI/CD cơ bản cho ứng dụng Java", points:["CI (Continuous Integration) tự động build + test mỗi khi có code mới được push lên.","CD (Continuous Deployment/Delivery) tự động triển khai ứng dụng sau khi CI pass.","GitHub Actions là công cụ phổ biến để định nghĩa pipeline CI/CD bằng file YAML.","Pipeline cơ bản: checkout code → build (Maven/Gradle) → chạy test → build Docker image → deploy.","CI/CD giúp phát hiện lỗi sớm và giảm rủi ro khi deploy thủ công."], practice:"Viết 1 file GitHub Actions đơn giản tự động build và chạy test cho project Spring Boot mỗi khi push code, quan sát kết quả ở tab Actions.", case:"CI/CD là quy trình chuẩn ở mọi team backend chuyên nghiệp — code không qua được pipeline test tự động thường không được phép merge vào nhánh chính.", task:"Viết 1 file GitHub Actions đơn giản chạy 'mvn test' mỗi khi push code lên GitHub, quan sát kết quả ở tab Actions."},
];

/* ============ TOEIC TRACK — 16 TUẦN / 4 THÁNG (MỤC TIÊU 800+) ============ */
const toeicWeeks = [
{title:"Làm quen cấu trúc đề & đánh giá đầu vào", points:["TOEIC gồm 2 phần: Listening (100 câu, ~45 phút) và Reading (100 câu, 75 phút), tổng 990 điểm.","Làm 1 đề thi thử đầy đủ để xác định điểm xuất phát và phần yếu nhất.","Mục tiêu 800+ nghĩa là cần cân bằng cả Listening và Reading, không bỏ hẳn phần nào.","Lập thời gian biểu học cố định mỗi ngày, duy trì đều đặn quan trọng hơn học dồn.","Chuẩn bị bộ từ vựng theo chủ đề công sở cơ bản (office, meeting, contract...) để học dần mỗi ngày."], practice:"Làm 1 đề TOEIC thử đầy đủ (hoặc rút gọn), tự chấm điểm, ghi lại số câu đúng/sai theo từng Part vào 1 bảng theo dõi.", case:"Đề thi thật luôn ưu tiên thí sinh làm quen format trước — nhiều bạn mất điểm oan chỉ vì bỡ ngỡ dạng câu hỏi chứ không phải do kém tiếng Anh.", task:"Làm 1 đề TOEIC thử đầy đủ (hoặc rút gọn), tự chấm điểm và ghi lại phần nào yếu nhất."},
{title:"Ngữ pháp nền tảng: thì động từ & cấu trúc câu", points:["TOEIC Part 5-6 kiểm tra ngữ pháp qua câu đơn lẻ và đoạn văn ngắn.","Ôn lại các thì cơ bản: hiện tại đơn, quá khứ đơn, hiện tại hoàn thành — nhóm câu hỏi xuất hiện thường xuyên.","Nắm vững cấu trúc câu cơ bản: chủ ngữ - động từ - tân ngữ, vị trí tính từ/trạng từ trong câu.","Phân biệt danh động từ (V-ing) và động từ nguyên mẫu có \"to\" sau các động từ phổ biến.","Học ngữ pháp qua ví dụ câu thực tế thay vì học thuộc lý thuyết suông."], practice:"Làm 25 câu Part 5 tập trung chủ điểm thì động từ, ghi lại các câu sai và lý do sai vào sổ tay lỗi.", case:"Part 5 chiếm 30/100 câu Reading — chỉ riêng nắm chắc ngữ pháp cơ bản đã đảm bảo được một lượng điểm ổn định.", task:"Làm 25 câu Part 5 tập trung chủ điểm thì động từ, ghi lại các câu sai và lý do sai."},
{title:"Từ vựng công sở & Listening Part 1-2", points:["Part 1 (mô tả tranh) cần từ vựng miêu tả hành động, vị trí đồ vật (in front of, next to...).","Part 2 (hỏi-đáp ngắn) cần phản xạ nhanh với các dạng câu hỏi Wh-, Yes/No, câu hỏi lựa chọn.","Nghe kỹ từ để hỏi đầu câu (What, Where, When, Who) vì nó quyết định loại câu trả lời cần tìm.","Cảnh giác với \"bẫy\" từ đồng âm thường xuất hiện ở đáp án gây nhiễu.","Luyện nghe chép chính tả (dictation) giúp cải thiện khả năng bắt âm rõ rệt."], practice:"Nghe và làm thử 10 câu Part 1 + 10 câu Part 2, sau đó nghe lại transcript để đối chiếu từ nghe sai, ghi lại từ mới vào sổ từ vựng.", case:"Part 1-2 tuy dễ nhưng chiếm 30/100 câu Listening — làm chắc phần này là nền tảng để đạt điểm Listening cao.", task:"Nghe và làm thử 10 câu Part 1 + 10 câu Part 2, sau đó nghe lại transcript để đối chiếu từ nghe sai."},
{title:"Reading Part 5 nâng cao & tổng kết tháng 1", points:["Part 5 thường kiểm tra từ loại (danh từ/động từ/tính từ/trạng từ) qua vị trí trống trong câu.","Xác định vị trí từ cần điền trước, sau đó mới xét nghĩa — nhiều câu chỉ cần biết từ loại là chọn được đáp án.","Học nhóm từ đi kèm cố định (collocations) như \"make a decision\", \"take responsibility\".","Không cần dịch toàn bộ câu để làm Part 5 — kỹ năng nhận diện cấu trúc quan trọng hơn hiểu 100% nghĩa.","Cuối tháng 1: làm lại 1 đề thử để so sánh tiến bộ so với tuần 1."], practice:"Làm 1 đề mini (Listening Part 1-2 + Reading Part 5, khoảng 30 câu) có tính giờ, so sánh điểm với tuần 1.", case:"Thí sinh đạt 800+ thường không giỏi vượt trội mọi thứ, mà làm rất chắc các câu Part 5 và Part 1-2 — đây là 'điểm sàn an toàn' của hầu hết thí sinh điểm cao.", task:"Làm 1 đề mini (Listening Part 1-2 + Reading Part 5, khoảng 30 câu) có tính giờ, so sánh điểm với tuần 1."},
{title:"Listening Part 3 — hội thoại ngắn", points:["Part 3 là hội thoại 2-3 người, mỗi bài có 3 câu hỏi liên quan.","Đọc trước câu hỏi và đáp án trước khi nghe giúp biết cần chú ý thông tin gì.","Câu hỏi cuối cùng mỗi bài thường liên quan ý định/hành động tiếp theo — cần nghe đến cuối đoạn.","Ghi chú nhanh (note-taking) các con số, tên, thời gian nhắc đến trong lúc nghe.","Một số câu hỏi kèm hình ảnh/biểu đồ yêu cầu kết hợp thông tin nghe được với hình."], practice:"Làm 3 bài hội thoại Part 3 (9 câu), sau đó nghe lại và note ra những từ khóa quan trọng đã bỏ lỡ.", case:"Part 3 là phần nhiều thí sinh mất điểm nhất vì tốc độ hội thoại nhanh và có 3 câu hỏi dồn dập cho 1 bài nghe.", task:"Làm 3 bài hội thoại Part 3 (9 câu), sau đó nghe lại và note ra những từ khóa quan trọng đã bỏ lỡ."},
{title:"Listening Part 4 — bài nói ngắn", points:["Part 4 là các bài nói dài hơn Part 3 (thông báo, quảng cáo, voice mail...), mỗi bài 3 câu hỏi.","Nhận diện loại bài nói giúp đoán trước nội dung sẽ nghe.","Chiến lược đọc trước câu hỏi vẫn áp dụng như Part 3, càng quan trọng hơn vì bài dài hơn.","Từ vựng thường gặp: thông báo nội bộ, lịch trình, sự kiện công ty — nên học theo chủ đề này.","Luyện nghe tốc độ thật (không làm chậm lại) để quen với tốc độ đề thi thật."], practice:"Làm 3 bài Part 4 (9 câu), chấm điểm và liệt kê loại bài nói nào mình yếu nhất.", case:"Part 4 thường có giọng đọc chuẩn hơn Part 3 (ít hội thoại tự nhiên) nên với thí sinh luyện đúng phương pháp, đây lại là phần dễ ăn điểm hơn Part 3.", task:"Làm 3 bài Part 4 (9 câu), chấm điểm và liệt kê loại bài nói nào mình yếu nhất."},

/* ============ STATE & PERSISTENCE ============ */
let currentTrack = 'fe';
let currentWeek = 0;
let progress = {};
try { progress = JSON.parse(localStorage.getItem('roadmap-progress') || '{}'); } catch(e){ progress = {}; }
const savedCode = {};
try { Object.assign(savedCode, JSON.parse(localStorage.getItem('roadmap-code') || '{}')); } catch(e){}

function saveProgress(){ localStorage.setItem('roadmap-progress', JSON.stringify(progress)); }
function saveCode(){ localStorage.setItem('roadmap-code', JSON.stringify(savedCode)); }
function isDone(trackKey, weekIdx){ return !!(progress[trackKey] && progress[trackKey][weekIdx]); }
function setDone(trackKey, weekIdx, val){
  if(!progress[trackKey]) progress[trackKey] = {};
  progress[trackKey][weekIdx] = val;
  saveProgress();
}
function countDone(trackKey){
  const t = tracks[trackKey];
  let c = 0;
  for(let i=0;i<t.weeks.length;i++){ if(isDone(trackKey,i)) c++; }
  return c;
}

/* ============ RENDER: TOP MENU ============ */
function renderMenu(){
  const menu = document.getElementById('menu');
  menu.innerHTML = '';
  Object.keys(tracks).forEach(key => {
    const t = tracks[key];
    const btn = document.createElement('button');
    btn.className = 'menu-btn' + (key === currentTrack ? ' active' : '');
    btn.style.setProperty('--track-color', `var(${t.color})`);
    btn.innerHTML = `<span class="label">${t.label}</span><span class="sub">${countDone(key)}/${t.weeks.length} tuần</span>`;
    btn.addEventListener('click', () => { currentTrack = key; currentWeek = 0; renderAll(); });
    menu.appendChild(btn);
  });
}

function renderSidebar(){
  const t = tracks[currentTrack];
  const sidebar = document.getElementById('sidebar');

  let lastMonth = 0;
  t.weeks.forEach((w, i) => {

      const label = document.createElement('div');
      label.className = 'month-label';

      sidebar.appendChild(label);
      lastMonth = month;
    }
    const item = document.createElement('div');
    item.className = 'week-item' + (i === currentWeek ? ' active' : '');

    item.innerHTML = `<span class="num">T${i+1}</span><span class="title">${title}</span><span class="tick">${isDone(currentTrack,i) ? '✓' : ''}</span>`;
    item.addEventListener('click', () => { currentWeek = i; renderAll(); });
    sidebar.appendChild(item);
  });
}

/* ============ TEST ENGINE (for Algorithm track) ============ */
function deepEqual(a, b){
  if (Array.isArray(a) && Array.isArray(b)) {
    if (a.length !== b.length) return false;
    return a.every((v,i) => deepEqual(v, b[i]));
  }
  if (a && b && typeof a === 'object' && typeof b === 'object') {
    const ak = Object.keys(a).sort(), bk = Object.keys(b).sort();
    if (ak.length !== bk.length) return false;
    return ak.every((k,i) => k === bk[i] && deepEqual(a[k], b[k]));
  }
  return a === b;
}
function anagramEqual(a, b){
  const norm = (arr) => arr.map(inner => [...inner].sort().join(',')).sort().join('|');
  try { return norm(a) === norm(b); } catch(e){ return false; }
}
