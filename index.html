{title:"Nguyên âm đôi & phụ âm căng (이중모음, 쌍자음)", points:["Nguyên âm đôi là tổ hợp 2 nguyên âm đọc thành 1 âm: ㅐ(ae), ㅔ(e), ㅘ(wa), ㅝ(wo), ㅙ(wae), ㅞ(we), ㅚ(oe), ㅟ(wi), ㅢ(ui).","ㅐ và ㅔ phát âm khá giống nhau trong tiếng Hàn hiện đại, nhiều người bản xứ cũng không phân biệt rõ khi nói.","Phụ âm căng là phụ âm đôi, phát âm căng và dứt khoát hơn: ㄲ, ㄸ, ㅃ, ㅆ, ㅉ.","Phụ âm căng khác hoàn toàn về nghĩa so với phụ âm thường dù nhìn gần giống.","Luyện nghe phân biệt phụ âm thường/căng/bật hơi là kỹ năng khó nhất giai đoạn đầu, cần luyện tai nhiều."], practice:"Luyện viết toàn bộ nguyên âm đôi và phụ âm căng, ghép thử với các phụ âm/nguyên âm đã học ở 2 tuần trước.", case:"Bảng chữ cái Hangul hoàn chỉnh gồm 21 nguyên âm và 19 phụ âm — sau tuần này bạn đã học đủ toàn bộ Hangul cơ bản.", task:"Viết và đọc đúng bộ 3 phụ âm ㄱ/ㄲ/ㅋ, ㄷ/ㄸ/ㅌ, ㅂ/ㅃ/ㅍ, ㅅ/ㅆ, ㅈ/ㅉ/ㅊ để phân biệt độ căng/bật hơi.", days:[
{label:'Thứ 2', title:'ㅐ, ㅔ — nguyên âm đôi dễ nhầm nhất', content:'ㅐ (ae) và ㅔ (e) là 2 nguyên âm mà ngay cả người Hàn hiện đại cũng phát âm gần như giống hệt nhau. Về mặt viết, ㅐ = ㅏ+ㅣ, ㅔ = ㅓ+ㅣ. Với người mới, không cần quá lo phân biệt khi NGHE, nhưng cần nhớ chính xác khi VIẾT vì chính tả vẫn phân biệt rõ. Ví dụ: 개(chó) dùng ㅐ, 게(cua) dùng ㅔ.', exercises:['Viết tay ㅐ và ㅔ mỗi âm 15 lần, ghép với vài phụ âm đã học (개,게,내,네...).','Học 6 từ đơn giản phân biệt theo chính tả: 개(chó)/게(cua), 배(bụng/tàu/lê)/베개(gối).','Nghe và thử phân biệt (dù khó) 5 cặp từ dùng ㅐ/ㅔ khác nhau qua audio.','Viết 5 cặp từ tối thiểu (minimal pairs) khác ngoài 개/게 nếu tìm được, để luyện thêm phân biệt chính tả.','Thử viết 1 câu ngắn có cả ㅐ và ㅔ, đọc to và không cần lo lắng nếu phát âm chưa phân biệt rõ.'], quiz:[
{q:"ㅐ được ghép từ 2 nguyên âm nào?", opts:["ㅏ+ㅣ", "ㅓ+ㅣ", "ㅗ+ㅏ", "ㅜ+ㅓ"], correct:0, explain:"ㅐ = ㅏ + ㅣ."},
{q:"ㅔ được ghép từ 2 nguyên âm nào?", opts:["ㅏ+ㅣ", "ㅓ+ㅣ", "ㅗ+ㅏ", "ㅜ+ㅓ"], correct:1, explain:"ㅔ = ㅓ + ㅣ."},
{q:"Trong tiếng Hàn hiện đại, ㅐ và ㅔ phát âm thế nào?", opts:["Rất khác nhau", "Khá giống nhau, khó phân biệt kể cả người bản xứ", "Không tồn tại sự nhầm lẫn", "Luôn phân biệt rõ ràng"], correct:1, explain:"Đây là hiện tượng phổ biến trong tiếng Hàn hiện đại."},
{q:"개 (chó) dùng nguyên âm nào?", opts:["ㅐ", "ㅔ", "ㅚ", "ㅟ"], correct:0, explain:"개ᅠ(chó) viết với ㅐ."},

{label:'Thứ 5', title:'Luyện tổng hợp 3 mức độ phụ âm', content:'Ngày luyện tập trọng tâm nhất tuần — hệ thống hóa 5 bộ 3 mức độ: ㄱ/ㅋ/ㄲ, ㄷ/ㅌ/ㄸ, ㅂ/ㅍ/ㅃ, ㅅ/ㅆ, ㅈ/ㅊ/ㅉ. Luyện nghe phân biệt 3 mức độ này là kỹ năng khó nhất của giai đoạn học Hangul, nhưng cũng quan trọng nhất. Không nên nản nếu chưa phân biệt tốt — đây là kỹ năng cần luyện nghe liên tục nhiều tháng, không chỉ 1 tuần.', exercises:['Nghe 15 âm tiết ngẫu nhiên thuộc 3 mức độ khác nhau, viết lại chính xác âm nghe được, tự chấm điểm.','Luyện nói bộ 3: 가/카/까, đọc liên tiếp 10 lần để cảm nhận khác biệt.','Ghi âm giọng bạn đọc bộ 3 âm này, nghe lại và tự đánh giá độ rõ ràng.','Tự lập bảng đầy đủ 5 bộ 3 mức độ (thường/bật hơi/căng) ra giấy, dán ở nơi dễ thấy để ôn hàng ngày.','Thử đố 1 người khác đọc ngẫu nhiên 1 âm trong 3 mức độ, bạn đoán xem là mức nào.'], quiz:[

{title:"Quy tắc đọc nối âm & tổng kết Hangul", points:["Batchim là phụ âm cuối của âm tiết, ảnh hưởng đến cách đọc nối với âm tiết tiếp theo.","Quy tắc nối âm (연음): khi âm tiết có batchim đứng trước âm tiết bắt đầu bằng ㅇ, batchim đó được đọc nối sang âm tiết sau.","Một số batchim có cách đọc đại diện khác với chữ viết khi đứng riêng.","Luyện đọc từ có batchim kép (2 phụ âm cuối) như 없다, 닭 — chỉ 1 trong 2 phụ âm được phát âm tùy trường hợp.","Nắm vững quy tắc đọc nối âm là nền tảng để nghe hiểu tiếng Hàn tự nhiên, vì người bản xứ luôn nói nối âm."], practice:"Luyện đọc to 15 từ tiếng Hàn có batchim đơn giản, ghi âm lại giọng đọc của mình để tự nghe lại.", case:"Đây là bước chuyển quan trọng từ \"biết mặt chữ\" sang \"đọc được tiếng Hàn thật\" — nhiều người bỏ qua bước này nên nghe/nói rất khó khăn về sau.", task:"Tự đọc to được đoạn văn tiếng Hàn ngắn (3-4 câu, có phiên âm hỗ trợ) không vấp, đúng quy tắc nối âm cơ bản.", days:[
{label:'Thứ 2', title:'Batchim cơ bản & cách đọc đại diện', content:'Batchim là phụ âm đứng ở vị trí CUỐI âm tiết (ví dụ ㄴ trong 한). Dù có 19 phụ âm có thể làm batchim, khi phát âm CUỐI âm tiết (đứng riêng), chúng chỉ đại diện cho 7 âm: ㄱ,ㄴ,ㄷ,ㄹ,ㅁ,ㅂ,ㅇ. Ví dụ: ㄷ,ㅌ,ㅅ,ㅆ,ㅈ,ㅊ,ㅎ khi làm batchim đều đọc đại diện thành âm "ㄷ". Quy tắc này giúp việc PHÁT ÂM đơn giản hơn nhiều so với phải nhớ 19 cách đọc khác nhau.', exercises:['Học bảng quy tắc 7 âm đại diện cho batchim.','Luyện đọc 10 từ có batchim đơn giản: 책(sách), 밥(cơm), 산(núi), 문(cửa), 강(sông)...','Viết ra 5 từ mới có batchim, tự đọc và kiểm tra lại với quy tắc đại diện.','Viết 5 từ mới có batchim khác với 10 từ đã học ở bài học, tra nghĩa và luyện đọc theo quy tắc đại diện.','Tự kiểm tra: với mỗi batchim trong 19 phụ âm, nói xem nó thuộc nhóm đại diện nào trong 7 âm cuối.'], quiz:[
{q:"Batchim là gì?", opts:["Nguyên âm đầu âm tiết", "Phụ âm cuối âm tiết", "Dấu câu", "Từ nối"], correct:1, explain:"Batchim là phụ âm đứng ở vị trí cuối cùng của 1 âm tiết."},
{q:"Có tối đa bao nhiêu âm ĐẠI DIỆN cho batchim?", opts:["3", "5", "7", "19"], correct:2, explain:"Dù có 19 phụ âm làm batchim được, chỉ có 7 âm đại diện khi đọc riêng."},

{label:'Thứ 3', title:'Quy tắc nối âm (연음) — phần quan trọng nhất', content:'Khi 1 âm tiết có batchim đứng NGAY TRƯỚC 1 âm tiết bắt đầu bằng ㅇ, batchim đó được đọc NỐI sang làm phụ âm đầu âm tiết sau. Ví dụ: 한국어 không đọc rời "han-guk-eo" mà đọc nối "han-gu-geo". Đây LÀ QUY TẮC QUAN TRỌNG NHẤT để nghe hiểu tiếng Hàn tự nhiên — người bản xứ luôn nói nối âm. Không nắm quy tắc này sẽ khiến bạn nghe không kịp dù đã học đủ từ vựng.', exercises:['Học và luyện đọc 8 ví dụ nối âm: 한국어, 직업(nghề nghiệp), 음악(âm nhạc), 발음(phát âm), 연습(luyện tập), 웃어요(cười), 먹어요(ăn), 있어요(có).','Viết cách đọc phiên âm cho 5 từ nối âm khác bạn tự tìm được.','Nghe 1 đoạn hội thoại tiếng Hàn ngắn và cố gắng nhận ra ít nhất 2-3 chỗ có nối âm.','Tự tìm thêm 3 ví dụ nối âm mới trong tài liệu tiếng Hàn bất kỳ bạn có, luyện đọc đúng quy tắc.','Thử đọc chậm rồi đọc nhanh dần 8 ví dụ nối âm đã học, cảm nhận sự khác biệt khi đọc tự nhiên hơn.'], quiz:[
{q:"Nối âm (연음) xảy ra khi nào?", opts:["Khi 2 nguyên âm đứng cạnh nhau", "Khi batchim đứng trước âm tiết bắt đầu bằng ㅇ", "Luôn luôn xảy ra", "Không bao giờ xảy ra"], correct:1, explain:"Đây là điều kiện chính xác để quy tắc nối âm được áp dụng."},

{q:"Quy tắc chung khi âm tiết sau bắt đầu bằng nguyên âm với batchim kép là gì?", opts:["Không có quy tắc", "Cả 2 phụ âm đều được đọc nối", "Chỉ 1 phụ âm được đọc", "Không phụ âm nào được đọc"], correct:1, explain:"Khi nối âm với nguyên âm, thường cả 2 phụ âm trong batchim kép đều được đọc."},
{q:"Vì sao không cần quá lo lắng nếu chưa nhớ hết cách đọc batchim kép ngay?", opts:["Không có lý do", "Sẽ quen dần qua thời gian tiếp xúc với tiếng Hàn thực tế", "Không bao giờ cần biết", "Chỉ người bản xứ mới cần biết"], correct:1, explain:"Đây là kỹ năng sẽ tự nhiên cải thiện qua quá trình học lâu dài."},

{label:'Thứ 5', title:'Luyện đọc đoạn văn ngắn hoàn chỉnh', content:'Bài kiểm tra tổng hợp 4 tuần: đọc 1 đoạn văn ngắn (3-5 câu) kết hợp đầy đủ nguyên âm, phụ âm, batchim, quy tắc nối âm. Mục tiêu là ĐỌC ĐÚNG ÂM, đúng nhịp điệu, chưa cần hiểu 100% nghĩa. Đọc to (không đọc thầm) là phương pháp luyện phát âm hiệu quả nhất — cơ miệng cần "luyện tập" như luyện thể chất. Ghi âm lại giọng đọc và nghe lại là cách tốt để tự phát hiện lỗi.', exercises:['Tìm 1 đoạn văn tiếng Hàn ngắn có phiên âm/dịch hỗ trợ, đọc to 5 lần.','Ghi âm lần đọc thứ 5, nghe lại và tự đánh giá những chỗ còn vấp hoặc sai quy tắc nối âm.','So sánh giọng đọc của bạn với audio mẫu (nếu có), ghi chú 3 điểm cần cải thiện nhất.','Thử đọc đoạn văn đó cho 1 người khác nghe (kể cả người không biết tiếng Hàn), tập trung vào sự tự tin khi đọc to.','Chọn 1 đoạn văn KHÁC (ngắn hơn) và thử áp dụng lại quy trình luyện đọc tương tự.'], quiz:[
{q:"Mục tiêu chính của bài luyện đọc đoạn văn này là gì?", opts:["Hiểu 100% nghĩa", "Đọc ĐÚNG ÂM, đúng nhịp điệu, áp dụng đúng quy tắc nối âm", "Học thuộc lòng", "Dịch sang tiếng Việt"], correct:1, explain:"Trọng tâm là phát âm chính xác, chưa phải hiểu nghĩa hoàn toàn."},
{q:"Vì sao nên đọc TO thay vì đọc thầm?", opts:["Không có sự khác biệt", "Cơ miệng cần luyện tập thực tế như luyện tập thể chất", "Đọc thầm hiệu quả hơn", "Đọc to gây mất tập trung"], correct:1, explain:"Phát âm là kỹ năng vận động, cần luyện tập thực tế bằng miệng."},
{q:"Ghi âm giọng đọc của mình có lợi ích gì?", opts:["Không có lợi ích gì", "Giúp tự phát hiện lỗi phát âm khi nghe lại", "Chỉ để giải trí", "Làm mất thời gian không cần thiết"], correct:1, explain:"Nghe lại giọng mình giúp phát hiện lỗi mà lúc nói không nhận ra."},
{q:"Đoạn văn luyện đọc nên có đặc điểm gì hỗ trợ người mới?", opts:["Không cần hỗ trợ gì", "Có phiên âm/dịch nghĩa hỗ trợ đi kèm", "Phải hoàn toàn bằng tiếng Hàn không chú thích", "Phải rất dài và phức tạp"], correct:1, explain:"Có hỗ trợ giúp người học tự kiểm tra và không bị lạc hướng."},
{q:"Đây là bài kiểm tra tổng hợp của mấy tuần đã học?", opts:["1 tuần", "2 tuần", "3 tuần", "4 tuần"], correct:3, explain:"Bài luyện đọc tổng hợp toàn bộ 4 tuần Hangul đã học."},
{q:"Kỹ năng nào KHÔNG được kiểm tra qua bài luyện đọc này?", opts:["Nhận diện chữ Hangul", "Áp dụng quy tắc nối âm", "Ngữ pháp nâng cao (chưa học tới)", "Phát âm batchim"], correct:2, explain:"Ngữ pháp nâng cao chưa được học nên không nằm trong phạm vi kiểm tra."},
{q:"So sánh giọng đọc của mình với audio mẫu giúp ích gì?", opts:["Không giúp ích gì", "Nhận ra điểm cần cải thiện cụ thể", "Chỉ để so sánh cho vui", "Không cần thiết"], correct:1, explain:"So sánh trực tiếp giúp xác định chính xác điểm cần luyện thêm."},
{q:"Vì sao chưa cần hiểu 100% nghĩa của đoạn văn ở giai đoạn này?", opts:["Không có lý do", "Vì chưa học đủ ngữ pháp/từ vựng, trọng tâm là phát âm đúng trước", "Vì nghĩa không quan trọng", "Vì không thể hiểu được"], correct:1, explain:"Ngữ pháp và từ vựng sẽ được xây dựng dần từ tháng 2."},
{q:"Sau bài luyện đọc này, giai đoạn tiếp theo trong lộ trình là gì?", opts:["Học lại Hangul từ đầu", "Tổng kết tháng 1, chuẩn bị học ngữ pháp", "Ngừng học tiếng Hàn", "Học TOPIK 6 ngay"], correct:1, explain:"Sau khi hoàn thành Hangul, bước tiếp theo là tổng kết và chuyển sang ngữ pháp."},
{q:"Phương pháp luyện tập tốt nhất được đề xuất là gì?", opts:["Đọc 1 lần duy nhất", "Đọc to nhiều lần, ghi âm, so sánh và tự sửa", "Chỉ đọc thầm", "Chỉ nghe không cần đọc"], correct:1, explain:"Đây là quy trình luyện tập lặp lại có phản hồi (ghi âm + so sánh), hiệu quả nhất."},

{label:'Thứ 6', title:'Tổng kết tháng 1 — sẵn sàng cho ngữ pháp', content:'Chúc mừng bạn đã hoàn thành tháng đầu tiên — cột mốc khó nhất về tâm lý (bảng chữ cái hoàn toàn mới) đã qua. Từ tháng 2, bạn bắt đầu học ngữ pháp thực sự: trợ từ, cách chia động từ, các thì — lúc tiếng Hàn "trở nên có nghĩa" thay vì chỉ là âm thanh ghép lại. Duy trì ôn lại Hangul định kỳ (5-10 phút/ngày) vài tuần tới để tránh quên khi chuyển sang tập trung ngữ pháp mới.', exercises:['Làm bài tự kiểm tra tổng hợp: viết + đọc toàn bộ 21 nguyên âm, 19 phụ âm, giải thích được quy tắc nối âm bằng lời của bạn.','Ôn lại toàn bộ từ vựng đã học tháng 1 (khoảng 30-35 từ qua các tuần), đảm bảo nhớ nghĩa.','Viết 1 đoạn nhật ký ngắn tổng kết cảm nhận sau tháng đầu học tiếng Hàn — điều gì thú vị nhất, điều gì khó nhất.','Viết ra lộ trình bạn hình dung cho tháng 2 dựa trên những gì đã biết (ngữ pháp cơ bản sắp học).','Tự thưởng cho bản thân bằng cách nào đó (đơn giản như nghe 1 bài nhạc Hàn Quốc) để ăn mừng hoàn thành tháng đầu.'], quiz:[
{q:"Batchim là gì?", opts:["Nguyên âm đầu âm tiết","Phụ âm đứng ở CUỐI âm tiết","Dấu câu","Từ nối"], correct:1, explain:"Batchim (받침) là phụ âm cuối cùng của 1 âm tiết, ví dụ ㄴ trong 한."},
{q:"Có tối đa bao nhiêu âm ĐẠI DIỆN khi phát âm batchim đứng riêng?", opts:["3","5","7","19"], correct:2, explain:"Dù có 19 phụ âm làm batchim được, khi đọc riêng chúng chỉ đại diện cho 7 âm: ㄱ,ㄴ,ㄷ,ㄹ,ㅁ,ㅂ,ㅇ."},
{q:"Batchim ㄷ, ㅌ, ㅅ, ㅆ, ㅈ, ㅊ, ㅎ khi đứng riêng đều đọc đại diện thành âm nào?", opts:["ㄱ","ㄴ","ㄷ","ㄹ"], correct:2, explain:"Cả nhóm phụ âm này khi làm batchim đều đọc đại diện thành âm \"ㄷ\"."},
{q:"Quy tắc nối âm (연음) xảy ra khi nào?", opts:["Âm tiết có batchim đứng trước âm tiết bắt đầu bằng ㅇ","Luôn luôn xảy ra bất kể trường hợp nào","Chỉ xảy ra với nguyên âm đôi","Không bao giờ xảy ra"], correct:0, explain:"Khi batchim đứng ngay trước 1 âm tiết bắt đầu bằng ㅇ (phụ âm câm), batchim đó được đọc nối sang."},
{q:"Từ 한국어 khi đọc nối âm sẽ nghe gần giống cách đọc nào?", opts:["han-guk-eo (đọc rời)","han-gu-geo (đọc nối)","ha-guk-o","han-gu-go"], correct:1, explain:"Batchim ㄱ của 국 được đọc nối sang làm phụ âm đầu của 어, tạo thành \"gu-geo\"."},
{q:"Batchim kép (겹받침) nghĩa là gì?", opts:["Có 2 nguyên âm trong âm tiết","Có 2 phụ âm cuối cùng lúc trong 1 âm tiết","Không có batchim","Có 2 âm tiết ghép lại"], correct:1, explain:"Batchim kép là khi 1 âm tiết có 2 phụ âm cuối, ví dụ 없다, 닭."},
{q:"Với từ 없다 (không có), thường mấy phụ âm trong batchim kép được phát âm?", opts:["Cả 2","1 trong 2","Không phụ âm nào","Tùy người nói tự do"], correct:1, explain:"Với batchim kép, thường chỉ 1 trong 2 phụ âm được phát âm theo quy tắc riêng của từng trường hợp."},
{q:"Vì sao quy tắc nối âm quan trọng khi luyện NGHE tiếng Hàn?", opts:["Không quan trọng lắm","Vì người bản xứ luôn nói nối âm tự nhiên, không đọc tách rời","Chỉ quan trọng khi viết văn bản","Chỉ dùng trong bài hát"], correct:1, explain:"Nếu không nắm quy tắc nối âm, người học sẽ nghe không kịp dù đã biết đủ từ vựng, vì âm thực tế khác cách đọc tách rời."},
{q:"Từ 사람 (người) — âm tiết nào KHÔNG có batchim?", opts:["사","람","Cả 2 đều không có","Cả 2 đều có"], correct:0, explain:"사 không có phụ âm cuối; 람 có batchim ㅁ."},
{q:"Đọc nối âm khác gì so với đọc tách rời từng âm tiết?", opts:["Không khác gì cả","Đọc nối âm tự nhiên và trôi chảy hơn, âm cuối \"chảy\" sang âm tiết sau","Đọc nối âm luôn chậm hơn","Chỉ dùng khi hát"], correct:1, explain:"Đọc nối âm là cách phát âm tự nhiên thật sự của người bản xứ, khác hẳn cách đọc tách rời từng âm tiết của người mới học."},
{q:"Sau khi hoàn thành Hangul (Tháng 1), bước tiếp theo trong lộ trình là gì?", opts:["Học ngay TOPIK 6","Học ngữ pháp sơ cấp và trợ từ cơ bản","Ngừng học tiếng Hàn","Học chữ Hán trước"], correct:1, explain:"Tháng 2 sẽ chuyển sang trợ từ cơ bản (은/는, 이/가...) và 2 thể lịch sự đầu tiên."},
{q:"Tại sao nên luyện đọc TO thay vì chỉ đọc thầm khi học Hangul?", opts:["Không có sự khác biệt","Cơ miệng cần luyện tập thực tế để phát âm chuẩn, giống luyện tập thể chất","Đọc thầm nhanh hơn nên luôn tốt hơn","Đọc to gây ồn nên nên tránh"], correct:1, explain:"Phát âm là kỹ năng vận động cơ miệng, cần luyện tập thực tế bằng cách đọc to, không chỉ đọc trong đầu."},

{title:"Đại từ nhân xưng & câu chào hỏi cơ bản", points:["저 (jeo) là \"tôi\" thể trang trọng/khiêm nhường, 나 (na) là \"tôi\" thể thân mật — người mới nên dùng 저 trong hầu hết tình huống.","이것/그것/저것 (cái này/cái đó/cái kia) là hệ thống chỉ định theo khoảng cách, có 3 cấp thay vì 2 như tiếng Việt.","안녕하세요 (xin chào, thể trang trọng lịch sự) là câu chào phổ biến nhất, dùng được trong hầu hết tình huống giao tiếp hàng ngày.","감사합니다/고맙습니다 đều nghĩa \"cảm ơn\", 감사합니다 trang trọng hơn một chút, dùng phổ biến trong môi trường công việc.","Tiếng Hàn có hệ thống kính ngữ phức tạp theo tuổi tác/địa vị — người mới nên bắt đầu học và dùng thể trang trọng trước."], practice:"Học thuộc 10 câu giao tiếp cơ bản (chào hỏi, cảm ơn, xin lỗi, tạm biệt), luyện nói to từng câu 5 lần.", case:"Người Hàn Quốc coi trọng việc dùng đúng kính ngữ theo tuổi tác — bắt đầu bằng thể trang trọng luôn là lựa chọn an toàn khi giao tiếp với người lạ.", task:"Tự giới thiệu bản thân bằng tiếng Hàn (tên, quốc tịch, nghề nghiệp) trong 3-4 câu, dùng thể trang trọng đã học.", days:[
{label:'Thứ 2', title:'저 vs 나 & cách xưng hô cơ bản', content:'저 (jeo) là \"tôi\" thể khiêm nhường/trang trọng, dùng khi nói chuyện với người lớn tuổi hơn, người lạ, hoặc trong môi trường công việc. 나 (na) là \"tôi\" thể thân mật, chỉ dùng với bạn bè cùng tuổi/thân thiết hoặc người nhỏ tuổi hơn. Người mới học nên MẶC ĐỊNH dùng 저 trong hầu hết tình huống để tránh thất lễ, vì văn hóa Hàn Quốc rất coi trọng việc xưng hô đúng theo tuổi tác/địa vị. 당신 (bạn/anh/chị) ít dùng trực tiếp trong giao tiếp thực tế hơn người học tưởng — người Hàn thường gọi nhau bằng tên/chức danh thay vì đại từ \"bạn\".', exercises:["Viết 5 câu giới thiệu bản thân dùng 저 (tôi, thể khiêm nhường).","Tìm hiểu tình huống nào có thể dùng 나 thay vì 저 (ví dụ nói chuyện với bạn thân cùng tuổi).","Học nghĩa của 당신 và lý do vì sao ít dùng trực tiếp trong giao tiếp thực tế.","Thử dịch 3 câu tiếng Việt có chữ \"tôi\" sang tiếng Hàn, chọn đúng 저 hoặc 나 tùy ngữ cảnh.","Ghi chú lại quy tắc chung: khi nào chắc chắn nên dùng 저 để an toàn về mặt lịch sự."], quiz:[
{q:"저 (jeo) dùng trong tình huống nào?", opts:["Chỉ dùng với bạn thân", "Thể khiêm nhường/trang trọng, dùng với người lớn tuổi hoặc người lạ", "Không bao giờ dùng", "Chỉ dùng khi viết văn"], correct:1, explain:"저 là đại từ \"tôi\" thể khiêm nhường, an toàn dùng trong hầu hết tình huống."},
{q:"나 (na) dùng trong tình huống nào?", opts:["Với người lớn tuổi hơn", "Với bạn bè cùng tuổi/thân thiết hoặc người nhỏ tuổi hơn", "Chỉ dùng trong công việc", "Không tồn tại trong tiếng Hàn"], correct:1, explain:"나 là \"tôi\" thể thân mật, chỉ phù hợp với quan hệ gần gũi."},
{q:"Vì sao người mới học nên mặc định dùng 저 thay vì 나?", opts:["Không có lý do gì", "Để tránh thất lễ khi chưa xác định rõ mối quan hệ với người đối diện", "나 khó phát âm hơn", "저 ngắn hơn nên dễ nhớ hơn"], correct:1, explain:"저ن an toàn hơn về mặt lịch sự khi chưa biết rõ tuổi tác/địa vị người đối diện."},
{q:"당신 (bạn/anh/chị) có được dùng phổ biến trong giao tiếp thực tế không?", opts:["Rất phổ biến, dùng thường xuyên", "Ít dùng trực tiếp hơn người học thường nghĩ, người Hàn hay gọi tên/chức danh thay thế", "Chỉ dùng trong văn viết", "Không tồn tại trong tiếng Hàn"], correct:1, explain:"당신 ít phổ biến trong giao tiếp trực tiếp hơn nhiều so với suy nghĩ ban đầu của người học."},
{q:"Việc chọn đúng đại từ nhân xưng phản ánh điều gì trong văn hóa Hàn Quốc?", opts:["Không phản ánh điều gì", "Sự tôn trọng tuổi tác/địa vị, một giá trị văn hóa quan trọng", "Chỉ là quy tắc ngữ pháp đơn thuần", "Không có ý nghĩa văn hóa nào"], correct:1, explain:"Xưng hô đúng cách gắn liền với văn hóa tôn trọng thứ bậc trong xã hội Hàn Quốc."},
{q:"Nếu chưa chắc chắn về mối quan hệ với người đối diện, nên chọn đại từ nào?", opts:["나", "저", "당신", "Không cần chọn đại từ nào"], correct:1, explain:"저 luôn là lựa chọn an toàn khi chưa rõ mối quan hệ."},
{q:"Tiếng Việt có hệ thống xưng hô phức tạp tương tự tiếng Hàn không?", opts:["Hoàn toàn giống hệt", "Có phần tương đồng (tôi/tao/mình) nhưng cách vận hành khác nhau", "Tiếng Việt không có đại từ nhân xưng", "Không thể so sánh được"], correct:1, explain:"Cả 2 ngôn ngữ đều có ý thức về mức độ trang trọng, nhưng quy tắc cụ thể khác nhau."},
{q:"Giới thiệu bản thân lần đầu gặp mặt nên dùng đại từ nào?", opts:["나", "저", "당신", "Không cần dùng đại từ"], correct:1, explain:"Lần đầu gặp mặt luôn nên dùng thể khiêm nhường 저 để thể hiện phép lịch sự."},
{q:"Việc học đại từ nhân xưng đúng cách có ý nghĩa gì cho việc học tiếp theo?", opts:["Không có ý nghĩa gì", "Là nền tảng cần thiết trước khi xây dựng câu giao tiếp hoàn chỉnh", "Chỉ là kiến thức phụ không quan trọng", "Không liên quan đến ngữ pháp khác"], correct:1, explain:"Đại từ nhân xưng là thành phần cơ bản xuất hiện trong hầu hết câu giao tiếp."},
{q:"Đại từ nào phù hợp khi nói chuyện với sếp trong công việc?", opts:["나", "저", "Không cần đại từ", "Cả 2 đều được"], correct:1, explain:"저 luôn phù hợp trong môi trường công việc trang trọng."},

{label:'Thứ 3', title:'이것/그것/저것 & hệ thống chỉ định', content:'이것 (cái này, gần người nói), 그것 (cái đó, gần người nghe), 저것 (cái kia, xa cả 2 người) — hệ thống chỉ định 3 cấp theo khoảng cách, khác tiếng Việt chỉ có \"này/đó/kia\" nhưng không phân biệt rõ dựa trên vị trí tương đối. Dạng rút gọn khi nói: 이거, 그거, 저거 (bỏ 것 thành 거) — thường dùng trong khẩu ngữ hàng ngày hơn dạng đầy đủ. Cùng hệ thống này còn có 여기(ở đây)/거기(ở đó)/저기(ở kia) cho địa điểm.', exercises:["Học 3 từ 이것/그것/저것 kèm dạng rút gọn 이거/그거/저거.","Viết 3 câu ví dụ mô tả 1 vật ở gần bạn, 1 vật gần người nghe, 1 vật ở xa cả 2.","Học thêm 여기/거기/저기 (ở đây/đó/kia) cho địa điểm.","So sánh hệ thống 3 cấp của tiếng Hàn với hệ thống 2 cấp (này/đó) hay dùng trong tiếng Việt.","Thực hành chỉ vào các đồ vật xung quanh và gọi tên bằng 이것/그것/저것 phù hợp khoảng cách."], quiz:[
{q:"이것 nghĩa là gì?", opts:["Cái này (gần người nói)", "Cái đó (gần người nghe)", "Cái kia (xa cả 2)", "Không có nghĩa cụ thể"], correct:0, explain:"이것 chỉ vật ở gần người đang nói."},
{q:"그것 nghĩa là gì?", opts:["Cái này", "Cái đó (gần người nghe)", "Cái kia", "Không xác định"], correct:1, explain:"그것 chỉ vật ở gần người đang nghe."},
{q:"저것 nghĩa là gì?", opts:["Cái này", "Cái đó", "Cái kia (xa cả người nói và người nghe)", "Không có nghĩa"], correct:2, explain:"저것 chỉ vật ở xa cả 2 người trong cuộc hội thoại."},
{q:"Dạng rút gọn của 이것 khi nói là gì?", opts:["이거", "이건", "이게", "이것만"], correct:0, explain:"이거 là dạng rút gọn thường dùng trong khẩu ngữ."},
{q:"Hệ thống chỉ định tiếng Hàn có mấy cấp theo khoảng cách?", opts:["1", "2", "3", "5"], correct:2, explain:"Tiếng Hàn có hệ thống 3 cấp: gần người nói, gần người nghe, xa cả 2."},
{q:"여기 nghĩa là gì?", opts:["Ở đây", "Ở đó", "Ở kia", "Cái này"], correct:0, explain:"여기 chỉ địa điểm gần người nói, tương ứng 이것 cho vật."},
{q:"거기 nghĩa là gì?", opts:["Ở đây", "Ở đó (gần người nghe)", "Ở kia", "Cái đó"], correct:1, explain:"거기 chỉ địa điểm gần người nghe, tương ứng 그것 cho vật."},
{q:"So với tiếng Việt (này/đó), hệ thống chỉ định tiếng Hàn có gì khác?", opts:["Không có gì khác", "Tiếng Hàn có 3 cấp phân biệt rõ theo vị trí tương đối, tiếng Việt chỉ có 2 cấp", "Tiếng Việt phức tạp hơn tiếng Hàn", "Không thể so sánh được"], correct:1, explain:"Đây là điểm khác biệt cấu trúc quan trọng cần lưu ý khi học."},
{q:"저기 nghĩa là gì?", opts:["Ở đây", "Ở đó", "Ở kia (xa cả 2 người)", "Cái kia"], correct:2, explain:"저기 chỉ địa điểm xa cả người nói và người nghe."},
{q:"Việc luyện chỉ tay vào đồ vật và gọi tên có tác dụng gì?", opts:["Không có tác dụng gì", "Giúp ghi nhớ hệ thống chỉ định qua trải nghiệm thực tế, trực quan", "Chỉ để giải trí", "Làm mất thời gian không cần thiết"], correct:1, explain:"Học qua tương tác thực tế giúp ghi nhớ sâu và tự nhiên hơn học lý thuyết suông."},

{label:'Thứ 4', title:'Câu chào hỏi & cảm ơn thông dụng', content:'안녕하세요 là câu chào phổ biến nhất, dùng được cả buổi sáng/trưa/tối. 안녕히 가세요 (tạm biệt, nói khi NGƯỜI KHÁC rời đi, bạn ở lại) và 안녕히 계세요 (tạm biệt, nói khi BẠN rời đi, người khác ở lại) — đây là điểm ngữ pháp thú vị: câu tạm biệt tiếng Hàn phân biệt theo VAI TRÒ ai đang rời đi. 감사합니다 (trang trọng hơn) và 고맙습니다 (thân thiện hơn 1 chút) đều nghĩa cảm ơn, dùng tương đối thay thế nhau được trong hầu hết tình huống.', exercises:["Học phân biệt rõ 안녕히 가세요 và 안녕히 계세요, viết ra tình huống cụ thể dùng mỗi câu.","Luyện nói 10 câu giao tiếp cơ bản đã học (chào, cảm ơn, xin lỗi, tạm biệt) 5 lần mỗi câu.","Học thêm 죄송합니다 (xin lỗi, trang trọng) và 미안해요 (xin lỗi, thân thiện hơn).","Đóng vai tình huống: bạn đến thăm nhà 1 người bạn Hàn Quốc rồi ra về, thực hành đúng câu tạm biệt.","Viết 1 đoạn hội thoại ngắn (4 câu) có đủ chào hỏi đầu và tạm biệt cuối."], quiz:[
{q:"안녕하세요 dùng được vào thời điểm nào trong ngày?", opts:["Chỉ buổi sáng", "Chỉ buổi tối", "Cả sáng, trưa, tối", "Chỉ buổi trưa"], correct:2, explain:"안녕하세요 là câu chào chung dùng được mọi thời điểm trong ngày, khác tiếng Anh có Good morning/afternoon riêng."},
{q:"안녕히 가세요 nói khi nào?", opts:["Khi bạn rời đi, người khác ở lại", "Khi người khác rời đi, bạn ở lại", "Chỉ dùng buổi sáng", "Không có ngữ cảnh cụ thể"], correct:1, explain:"안녕히 가세요 nói với người ĐANG RỜI ĐI, trong khi bạn ở lại."},
{q:"안녕히 계세요 nói khi nào?", opts:["Khi bạn rời đi, người khác ở lại", "Khi người khác rời đi", "Chỉ dùng khi gặp mặt", "Không tồn tại trong tiếng Hàn"], correct:0, explain:"안녕히 계세요 nói khi CHÍNH BẠN rời đi, người kia ở lại."},
{q:"감사합니다 và 고맙습니다 khác nhau thế nào?", opts:["Không khác gì, đều nghĩa cảm ơn, 감사합니다 trang trọng hơn 1 chút", "Nghĩa hoàn toàn khác nhau", "Chỉ 1 trong 2 từ đúng", "고맙습니다 không tồn tại"], correct:0, explain:"Cả 2 đều nghĩa cảm ơn, có thể dùng thay thế nhau trong hầu hết tình huống."},
{q:"죄송합니다 nghĩa là gì?", opts:["Cảm ơn", "Xin lỗi (trang trọng)", "Tạm biệt", "Xin chào"], correct:1, explain:"죄송합니다 là lời xin lỗi ở mức độ trang trọng."},
{q:"Vì sao câu tạm biệt tiếng Hàn phân biệt theo vai trò ai đang rời đi?", opts:["Không có lý do đặc biệt", "Đây là đặc điểm ngữ pháp/văn hóa riêng của tiếng Hàn, khác tiếng Việt chỉ có 1 câu tạm biệt chung", "Do lỗi dịch thuật", "Chỉ là ngẫu nhiên"], correct:1, explain:"Đây là điểm ngữ pháp thú vị và đặc trưng của tiếng Hàn cần ghi nhớ riêng."},
{q:"미안해요 khác 죄송합니다 ở điểm nào?", opts:["Không khác gì", "미안해요 thân thiện hơn, ít trang trọng hơn 죄송합니다", "미안해요 trang trọng hơn", "Cả 2 đều không đúng ngữ pháp"], correct:1, explain:"미안해요 phù hợp tình huống thân mật hơn, 죄송합니다 cho tình huống trang trọng."},
{q:"Nếu bạn đến thăm nhà bạn rồi ra về, nên nói câu tạm biệt nào?", opts:["안녕히 계세요 (vì bạn là người rời đi)", "안녕히 가세요", "Không cần nói gì", "Cả 2 câu đều sai"], correct:0, explain:"Vì bạn là người rời đi (chủ nhà ở lại), nên dùng 안녕히 계세요."},
{q:"Luyện nói to các câu giao tiếp cơ bản nhiều lần có tác dụng gì?", opts:["Không có tác dụng gì", "Giúp phản xạ tự nhiên khi cần dùng trong giao tiếp thực tế", "Chỉ để giải trí", "Làm mất thời gian không cần thiết"], correct:1, explain:"Luyện phát âm lặp lại giúp các câu giao tiếp trở thành phản xạ tự nhiên."},
{q:"Câu chào hỏi cơ bản có vai trò gì trong việc học giao tiếp?", opts:["Không quan trọng", "Là nền tảng đầu tiên và thường dùng nhất trong mọi cuộc hội thoại thực tế", "Chỉ cần biết khi đi du lịch", "Không cần thiết phải học kỹ"], correct:1, explain:"Câu chào hỏi là thành phần xuất hiện trong hầu như mọi tình huống giao tiếp."},

{label:'Thứ 5', title:'Kính ngữ cơ bản & văn hóa xưng hô', content:'Tiếng Hàn có hệ thống kính ngữ (존댓말) phức tạp: không chỉ thay đổi đuôi câu mà còn có TỪ VỰNG RIÊNG cho hành động của người lớn tuổi/địa vị cao hơn — ví dụ 먹다 (ăn, thường) có dạng kính ngữ là 드시다 khi nói về việc ăn của người lớn tuổi. Ở trình độ sơ cấp, chưa cần học sâu từ vựng kính ngữ riêng biệt này, nhưng cần HIỂU khái niệm để không bất ngờ khi gặp trong phim/thực tế. Tuổi tác trong văn hóa Hàn Quốc ảnh hưởng trực tiếp đến cách xưng hô — hỏi tuổi là câu hỏi rất phổ biến khi mới quen.', exercises:["Tìm hiểu khái niệm 존댓말 (kính ngữ) là gì, phân biệt với thể trang trọng thông thường đã học.","Học 1 ví dụ từ vựng kính ngữ đơn giản: 드시다 (dạng kính ngữ của 먹다 - ăn).","Tìm hiểu vì sao người Hàn thường hỏi tuổi khi mới quen nhau.","Xem 1 đoạn phim/video Hàn Quốc ngắn (có phụ đề), thử nhận diện 1 câu dùng kính ngữ đặc biệt.","Viết suy nghĩ của bạn về sự khác biệt văn hóa xưng hô giữa Việt Nam và Hàn Quốc."], quiz:[
{q:"존댓말 nghĩa là gì?", opts:["Thể suồng sã", "Kính ngữ/hệ thống ngôn ngữ trang trọng", "Tên gọi khác của tiếng Hàn", "Không có nghĩa cụ thể"], correct:1, explain:"존댓말 là hệ thống kính ngữ, bao gồm cả đuôi câu và từ vựng riêng biệt."},
{q:"드시다 là dạng kính ngữ của động từ nào?", opts:["가다 (đi)", "먹다 (ăn)", "보다 (xem)", "오다 (đến)"], correct:1, explain:"드시다 là cách nói kính ngữ của 먹다, dùng khi nói về việc ăn của người lớn tuổi/địa vị cao hơn."},
{q:"Kính ngữ trong tiếng Hàn chỉ thể hiện qua đuôi câu (thể trang trọng) hay có thêm gì khác?", opts:["Chỉ qua đuôi câu", "Còn có từ vựng riêng biệt cho hành động của người được tôn trọng", "Không có kính ngữ trong tiếng Hàn", "Chỉ dùng trong văn viết"], correct:1, explain:"Kính ngữ tiếng Hàn phức tạp hơn chỉ đổi đuôi câu, còn có từ vựng đặc biệt riêng."},
{q:"Ở trình độ sơ cấp, người học cần làm gì với từ vựng kính ngữ đặc biệt?", opts:["Phải học thuộc hết ngay lập tức", "Chỉ cần hiểu khái niệm tồn tại, chưa cần học sâu ngay", "Bỏ qua hoàn toàn không cần biết", "Không liên quan đến trình độ sơ cấp"], correct:1, explain:"Ở giai đoạn này chỉ cần nhận biết khái niệm, chưa cần thành thạo từ vựng kính ngữ chi tiết."},
{q:"Vì sao người Hàn thường hỏi tuổi khi mới quen nhau?", opts:["Không có lý do gì đặc biệt", "Để xác định cách xưng hô và mức độ trang trọng phù hợp trong giao tiếp", "Chỉ là tò mò cá nhân", "Không liên quan đến ngôn ngữ"], correct:1, explain:"Tuổi tác quyết định trực tiếp cách xưng hô trong văn hóa Hàn Quốc."},
{q:"Việc hiểu khái niệm kính ngữ giúp ích gì khi xem phim/nghe nhạc Hàn Quốc?", opts:["Không giúp ích gì", "Nhận diện được các câu nói đặc biệt dành cho người lớn tuổi/địa vị cao, không bị bối rối", "Chỉ để dịch thuật chính xác hơn", "Không liên quan đến việc xem phim"], correct:1, explain:"Hiểu khái niệm giúp không bất ngờ khi gặp từ vựng/cách nói đặc biệt trong nội dung thực tế."},
{q:"Tuổi tác ảnh hưởng thế nào đến cách xưng hô trong tiếng Hàn?", opts:["Không ảnh hưởng gì", "Ảnh hưởng trực tiếp đến việc chọn đại từ, thể lịch sự, và cách gọi nhau", "Chỉ ảnh hưởng trong văn viết", "Chỉ áp dụng cho người già"], correct:1, explain:"Tuổi tác là yếu tố quyết định quan trọng trong toàn bộ hệ thống xưng hô tiếng Hàn."},
{q:"So với tiếng Việt, mức độ phức tạp của hệ thống kính ngữ tiếng Hàn thế nào?", opts:["Đơn giản hơn nhiều", "Có nét tương đồng về ý thức tôn trọng nhưng cách thể hiện qua ngữ pháp phức tạp hơn", "Không có sự khác biệt nào", "Không thể so sánh được"], correct:1, explain:"Cả 2 ngôn ngữ đều coi trọng tôn ti trật tự nhưng tiếng Hàn thể hiện rõ ràng hơn qua ngữ pháp."},
{q:"Việc xem phim có phụ đề để nhận diện kính ngữ có lợi ích gì?", opts:["Không có lợi ích gì", "Kết hợp học lý thuyết với ứng dụng thực tế, giúp nhận diện ngữ cảnh dùng kính ngữ", "Chỉ để giải trí đơn thuần", "Làm mất thời gian ôn tập"], correct:1, explain:"Học qua ngữ cảnh thực tế giúp hiểu sâu hơn cách kính ngữ được sử dụng tự nhiên."},
{q:"Kính ngữ sẽ được học sâu hơn ở giai đoạn nào của lộ trình?", opts:["Không bao giờ cần học thêm", "Ở các trình độ cao hơn (TOPIK 3-4 trở lên), sau khi vững nền tảng sơ cấp", "Ngay tuần sau", "Chỉ cần học 1 lần là đủ mãi mãi"], correct:1, explain:"Kính ngữ chi tiết là kiến thức nâng cao, phù hợp học sau khi có nền tảng sơ cấp vững chắc."},

{label:'Thứ 6', title:'Tổng kết tuần 5', content:'Tuần này là bước chuyển quan trọng từ \"chỉ biết chữ\" sang \"bắt đầu giao tiếp thực sự\" — đại từ nhân xưng, hệ thống chỉ định, và câu chào hỏi cơ bản là nền tảng của MỌI cuộc hội thoại tiếng Hàn. Ghi nhớ nguyên tắc an toàn: dùng 저 thay vì 나, dùng thể trang trọng khi chưa chắc chắn về mối quan hệ với người đối diện. Từ tuần sau, bạn sẽ học trợ từ — thành phần ngữ pháp cốt lõi quyết định cấu trúc câu tiếng Hàn.', exercises:["Viết 1 đoạn giới thiệu bản thân hoàn chỉnh (5-6 câu) dùng 저, câu chào, và ít nhất 1 câu chỉ định.","Ôn lại toàn bộ câu giao tiếp cơ bản đã học tuần này, tự kiểm tra bằng cách nói to không nhìn tài liệu.","Tổng hợp danh sách từ vựng/cụm từ mới học tuần này (khoảng 15-20 mục).","Tự đánh giá theo thang 1-10 mức độ tự tin giao tiếp cơ bản (chào hỏi, giới thiệu) bằng tiếng Hàn.","Đặt mục tiêu cụ thể cho tuần sau (trợ từ cơ bản) dựa trên điểm còn yếu tuần này."], quiz:[
{q:"Chủ đề trọng tâm tuần 5 tháng 2 là gì?", opts:["Trợ từ cơ bản", "Đại từ nhân xưng, hệ thống chỉ định, câu chào hỏi cơ bản", "Thì quá khứ", "Batchim và nối âm"], correct:1, explain:"Tuần 5 tập trung vào các thành phần giao tiếp cơ bản đầu tiên."},
{q:"Nguyên tắc an toàn về đại từ nhân xưng đã học tuần này là gì?", opts:["Luôn dùng 나 cho tiện", "Dùng 저 thay vì 나 khi chưa chắc chắn về mối quan hệ", "Không cần đại từ nào cả", "Dùng 당신 cho mọi trường hợp"], correct:1, explain:"저 là lựa chọn an toàn nhất khi chưa rõ mối quan hệ với người đối diện."},
{q:"Sau tuần 5, bạn đã có khả năng làm gì bằng tiếng Hàn?", opts:["Chưa có khả năng giao tiếp nào", "Chào hỏi cơ bản, giới thiệu bản thân, chỉ định đồ vật đơn giản", "Đã có thể giao tiếp trôi chảy hoàn toàn", "Chỉ biết đọc chữ, chưa nói được gì"], correct:1, explain:"Đây là những kỹ năng giao tiếp cơ bản đầu tiên đã đạt được sau tuần 5."},
{q:"Tuần 6 sắp tới sẽ học về chủ đề gì?", opts:["Tiếp tục câu chào hỏi", "Trợ từ cơ bản (조사)", "Thì quá khứ", "Kính ngữ nâng cao"], correct:1, explain:"Trợ từ là thành phần ngữ pháp cốt lõi sẽ học ngay tuần sau."},
{q:"Vì sao đại từ nhân xưng và câu chào hỏi được coi là nền tảng của mọi hội thoại?", opts:["Không có lý do đặc biệt", "Vì đây là thành phần xuất hiện ngay từ đầu và xuyên suốt hầu hết mọi cuộc giao tiếp", "Chỉ vì dễ học nhất", "Không liên quan đến hội thoại thực tế"], correct:1, explain:"Đây là những yếu tố cơ bản nhất, có mặt trong hầu như mọi tình huống giao tiếp."},
{q:"Việc viết đoạn giới thiệu bản thân hoàn chỉnh cuối tuần có mục đích gì?", opts:["Không có mục đích gì", "Tổng hợp và áp dụng đồng thời các kiến thức đã học rời rạc trong tuần", "Chỉ để luyện viết", "Không liên quan đến việc ôn tập"], correct:1, explain:"Đây là cách kiểm tra khả năng vận dụng tổng hợp kiến thức đã học."},
{q:"Tự đánh giá mức độ tự tin theo thang 1-10 có tác dụng gì?", opts:["Không có tác dụng gì", "Giúp nhận thức rõ điểm mạnh/yếu để định hướng ôn tập tiếp theo", "Chỉ để ghi chép cho có", "Gây áp lực không cần thiết"], correct:1, explain:"Tự đánh giá khách quan giúp có kế hoạch học tập phù hợp cho giai đoạn tiếp theo."},
{q:"Kiến thức tuần 5 có nền tảng từ tháng nào trước đó?", opts:["Không liên quan đến tháng trước", "Xây dựng trên nền tảng Hangul đã học vững chắc ở tháng 1", "Hoàn toàn độc lập với kiến thức cũ", "Chỉ liên quan đến tuần 4"], correct:1, explain:"Khả năng đọc viết Hangul từ tháng 1 là điều kiện tiên quyết để học ngữ pháp giao tiếp."},
{q:"Trợ từ (sẽ học tuần 6) có vai trò gì trong tiếng Hàn?", opts:["Không quan trọng", "Là thành phần ngữ pháp cốt lõi quyết định cấu trúc và vai trò các từ trong câu", "Chỉ là yếu tố trang trí câu", "Không liên quan đến ngữ pháp cơ bản"], correct:1, explain:"Trợ từ là đặc trưng ngữ pháp quan trọng nhất của tiếng Hàn, sẽ học kỹ ở tuần sau."},
{q:"Duy trì luyện tập đều đặn quan trọng thế nào cho giai đoạn học tiếp theo?", opts:["Không quan trọng", "Rất quan trọng vì ngữ pháp mới sẽ liên tục xây dựng trên nền tảng đã học", "Chỉ cần học 1 lần là đủ", "Không ảnh hưởng đến tiến độ học"], correct:1, explain:"Ngữ pháp tiếng Hàn có tính lũy tiến, cần nền tảng vững để tiếp thu kiến thức mới hiệu quả."},
], vocab:[

{title:"Trợ từ cơ bản (조사) — 은/는, 이/가, 을/를", points:["은/는 là trợ từ chủ đề, dùng để nhấn mạnh hoặc giới thiệu chủ đề của câu — 은 đi sau phụ âm, 는 đi sau nguyên âm.","이/가 là trợ từ chủ ngữ, thường dùng khi giới thiệu thông tin mới hoặc nhấn mạnh chủ thể hành động.","Phân biệt 은/는 và 이/가 là 1 trong những điểm ngữ pháp khó nhất cho người mới, vì tiếng Việt không có khái niệm tương đương rõ ràng.","을/를 là trợ từ tân ngữ, đánh dấu đối tượng chịu tác động của động từ — 을 đi sau phụ âm, 를 đi sau nguyên âm.","Trợ từ trong tiếng Hàn gắn liền vào sau danh từ, quyết định vai trò ngữ pháp — khác hẳn tiếng Việt dựa vào trật tự từ."], practice:"Viết 10 câu đơn giản (chủ ngữ - tân ngữ - động từ) áp dụng đúng trợ từ 은/는, 이/가, 을/를 tùy ngữ cảnh.", case:"Trợ từ là đặc điểm ngữ pháp cốt lõi phân biệt tiếng Hàn với tiếng Việt — nắm vững trợ từ là nền tảng bắt buộc trước khi học ngữ pháp phức tạp hơn.", task:"Tìm 5 câu tiếng Hàn đơn giản (từ sách/app học tiếng Hàn), xác định và giải thích tại sao mỗi trợ từ được dùng như vậy.", days:[
{label:'Thứ 2', title:'은/는 — trợ từ chủ đề', content:'은/는 đánh dấu CHỦ ĐỀ của câu (topic), thường dùng khi giới thiệu 1 chủ đề đã biết hoặc so sánh/đối chiếu. 은 đi sau danh từ có batchim, 는 đi sau danh từ kết thúc nguyên âm. Ví dụ: 저는 학생이에요 (Tôi là học sinh) — 저는 nhấn mạnh \"về phần tôi thì...\". 은/는 còn dùng để SO SÁNH: 오늘은 추워요, 어제는 따뜻했어요 (Hôm nay thì lạnh, hôm qua thì ấm) — thể hiện sự đối lập giữa 2 chủ đề.', exercises:["Học quy tắc chọn 은 (sau batchim) hay 는 (sau nguyên âm), viết 5 ví dụ cho mỗi trường hợp.","Viết 3 câu dùng 은/는 để giới thiệu bản thân (nghề nghiệp, quê quán, sở thích).","Viết 2 câu dùng 은/는 để so sánh/đối lập 2 điều (ví dụ thời tiết hôm nay và hôm qua).","Tìm 5 câu tiếng Hàn đơn giản có 은/는 từ tài liệu bất kỳ, xác định vì sao dùng trợ từ này.","Thử dịch 3 câu tiếng Việt có ý \"về phần...\" sang tiếng Hàn dùng 은/는."], quiz:[
{q:"은/는 đánh dấu thành phần nào trong câu?", opts:["Tân ngữ", "Chủ đề (topic)", "Trạng ngữ", "Không có vai trò gì"], correct:1, explain:"은/는 là trợ từ chủ đề, giới thiệu điều đang được bàn luận."},
{q:"은 đi sau danh từ như thế nào?", opts:["Kết thúc nguyên âm", "Có batchim (kết thúc phụ âm)", "Bất kỳ danh từ nào", "Chỉ sau động từ"], correct:1, explain:"은 dùng khi danh từ trước đó có batchim (kết thúc bằng phụ âm)."},
{q:"는 đi sau danh từ như thế nào?", opts:["Có batchim", "Kết thúc nguyên âm", "Bất kỳ trường hợp nào", "Chỉ sau tính từ"], correct:1, explain:"는 dùng khi danh từ trước đó kết thúc bằng nguyên âm."},
{q:"저는 학생이에요 có nghĩa gì?", opts:["Tôi là học sinh (giới thiệu chủ đề \"tôi\")", "Bạn là học sinh", "Anh ấy là học sinh", "Không có nghĩa cụ thể"], correct:0, explain:"저는 giới thiệu chủ đề \"về phần tôi\", theo sau là thông tin về chủ đề đó."},
{q:"은/는 có thể dùng để làm gì ngoài giới thiệu chủ đề?", opts:["Không dùng được cho mục đích nào khác", "So sánh/đối lập giữa 2 điều", "Chỉ dùng cho câu hỏi", "Chỉ dùng cho câu phủ định"], correct:1, explain:"은/는 rất hữu ích để thể hiện sự đối lập, ví dụ so sánh thời tiết 2 ngày khác nhau."},
{q:"오늘은 추워요 nghĩa là gì?", opts:["Hôm nay nóng", "Hôm nay thì lạnh (có ý so sánh/đối lập)", "Ngày mai lạnh", "Không có nghĩa cụ thể"], correct:1, explain:"은 ở đây có ý nhấn mạnh sự đối lập, ngụ ý có thể ngày khác thì khác."},
{q:"Vì sao trợ từ được coi là đặc trưng ngữ pháp cốt lõi của tiếng Hàn?", opts:["Không có lý do gì", "Vì tiếng Hàn là ngôn ngữ chắp dính, dùng trợ từ để đánh dấu vai trò từ thay vì dựa vào trật tự từ", "Trợ từ chỉ là yếu tố phụ không quan trọng", "Tiếng Hàn không có trợ từ"], correct:1, explain:"Đây là đặc trưng cơ bản phân biệt tiếng Hàn với tiếng Việt (ngôn ngữ phân tích)."},
{q:"학교는 커요 (Trường thì lớn) sử dụng trợ từ nào?", opts:["이/가", "을/를", "은/는", "Không dùng trợ từ nào"], correct:2, explain:"는 đánh dấu \"trường\" là chủ đề đang được nói đến (커요 kết thúc nguyên âm ㅛ)."},
{q:"Trợ từ 은/는 gắn vào danh từ ở vị trí nào?", opts:["Đầu câu, không liên quan đến danh từ", "Ngay sau danh từ mà nó đánh dấu", "Cuối câu", "Trước động từ, không liên quan danh từ"], correct:1, explain:"Trợ từ tiếng Hàn luôn gắn liền ngay sau danh từ mà nó đánh dấu vai trò."},
{q:"Việc học trợ từ 은/는 trước 이/가 và 을/를 trong tuần này có ý nghĩa gì?", opts:["Không có ý nghĩa thứ tự cụ thể", "Xây dựng nền tảng dần dần, từ trợ từ cơ bản nhất đến phức tạp hơn", "Ngẫu nhiên không có logic", "Trợ từ nào học trước cũng như nhau"], correct:1, explain:"Học tuần tự giúp xây dựng nền tảng vững chắc trước khi so sánh các trợ từ dễ nhầm lẫn."},

{label:'Thứ 3', title:'이/가 — trợ từ chủ ngữ', content:'이/가 đánh dấu CHỦ NGỮ ngữ pháp của câu, thường dùng khi giới thiệu THÔNG TIN MỚI (lần đầu nhắc đến) hoặc nhấn mạnh CHỦ THỂ thực hiện hành động. 이 đi sau danh từ có batchim, 가 đi sau danh từ kết thúc nguyên âm. Ví dụ: 친구가 왔어요 (Bạn tôi đã đến) — 가 nhấn mạnh CHÍNH BẠN TÔI là người đến. So với 은/는, 이/가 thường xuất hiện khi câu trả lời câu hỏi \"AI\" hoặc \"CÁI GÌ\" một cách trực tiếp.', exercises:["Học quy tắc chọn 이 (sau batchim) hay 가 (sau nguyên âm), viết 5 ví dụ cho mỗi trường hợp.","Viết 3 câu dùng 이/가 để giới thiệu thông tin mới (ví dụ \"Có 1 con mèo trong phòng\").","Thử trả lời câu hỏi \"누가 왔어요?\" (Ai đã đến?) bằng câu dùng 이/가 đúng ngữ pháp.","Tìm 5 câu tiếng Hàn đơn giản có 이/가, xác định vì sao dùng trợ từ này thay vì 은/는.","Viết 1 đoạn hội thoại ngắn (hỏi-đáp) có dùng cả 이/가 trong câu trả lời."], quiz:[
{q:"이/가 đánh dấu thành phần nào trong câu?", opts:["Tân ngữ", "Chủ ngữ ngữ pháp", "Trạng từ", "Không có vai trò gì"], correct:1, explain:"이/가 là trợ từ chủ ngữ, đánh dấu chủ thể thực hiện hành động."},
{q:"이 đi sau danh từ như thế nào?", opts:["Kết thúc nguyên âm", "Có batchim", "Bất kỳ trường hợp nào", "Chỉ sau tính từ"], correct:1, explain:"이 dùng khi danh từ trước có batchim."},
{q:"가 đi sau danh từ như thế nào?", opts:["Có batchim", "Kết thúc nguyên âm", "Bất kỳ trường hợp nào", "Chỉ sau động từ"], correct:1, explain:"가 dùng khi danh từ trước kết thúc bằng nguyên âm."},
{q:"이/가 thường dùng khi nào?", opts:["Chỉ khi so sánh", "Khi giới thiệu thông tin mới hoặc nhấn mạnh chủ thể hành động", "Chỉ trong câu phủ định", "Không có quy tắc sử dụng cụ thể"], correct:1, explain:"이/가 phù hợp khi giới thiệu điều mới hoặc trả lời câu hỏi \"ai/cái gì\"."},
{q:"친구가 왔어요 nghĩa là gì và nhấn mạnh điều gì?", opts:["Bạn tôi đã đến, nhấn mạnh CHÍNH BẠN TÔI là người đến", "Tôi đã đến nhà bạn", "Bạn tôi sẽ đến", "Không có nghĩa cụ thể"], correct:0, explain:"가 nhấn mạnh chủ thể \"bạn tôi\" là người thực hiện hành động đến."},

{label:'Thứ 4', title:'Phân biệt 은/는 vs 이/가', content:'Đây là điểm ngữ pháp khó nhất cho người Việt vì tiếng Việt không phân biệt rõ 2 khái niệm này. Quy tắc thực dụng: dùng 은/는 khi nói về 1 CHỦ ĐỀ đã biết/đang bàn luận, hoặc khi SO SÁNH; dùng 이/가 khi giới thiệu THÔNG TIN MỚI hoặc trả lời câu hỏi \"ai/cái gì\". So sánh trực tiếp: 저는 학생이에요 (Về tôi thì, tôi là học sinh) vs 제가 학생이에요 (CHÍNH TÔI là học sinh — nhấn mạnh). Không có quy tắc tuyệt đối 100%, cần cảm nhận qua nhiều ví dụ thực tế.', exercises:["So sánh 2 câu ví dụ: 저는 학생이에요 vs 제가 학생이에요, giải thích sắc thái khác nhau.","Làm 10 câu điền trợ từ (은/는 hoặc 이/가) dựa vào ngữ cảnh cho sẵn.","Viết 1 đoạn hội thoại ngắn có cả 2 loại trợ từ, giải thích lý do chọn từng loại.","Tìm 3 câu tiếng Hàn thực tế (từ bài hát/phim) có 은/는 hoặc 이/가, phân tích ngữ cảnh dùng.","Tự đặt 5 câu của riêng bạn, mỗi câu cố tình chọn đúng 1 trong 2 loại trợ từ."], quiz:[
{q:"Vì sao phân biệt 은/는 và 이/가 khó với người Việt?", opts:["Không khó", "Vì tiếng Việt không có khái niệm tương đương rõ ràng để so sánh", "Vì 2 trợ từ này giống hệt nhau", "Vì tiếng Hàn không có quy tắc rõ ràng"], correct:1, explain:"Đây là điểm ngữ pháp phổ biến nhất gây khó khăn cho người học tiếng Việt."},
{q:"Quy tắc thực dụng khi nào dùng 은/는?", opts:["Khi giới thiệu thông tin hoàn toàn mới", "Khi nói về chủ đề đã biết hoặc khi so sánh", "Không có quy tắc nào", "Luôn dùng 은/는 trong mọi trường hợp"], correct:1, explain:"은/는 phù hợp với chủ đề quen thuộc hoặc mục đích so sánh."},
{q:"Quy tắc thực dụng khi nào dùng 이/가?", opts:["Khi nói về chủ đề đã biết", "Khi giới thiệu thông tin mới hoặc trả lời câu hỏi ai/cái gì", "Không bao giờ cần dùng", "Chỉ dùng trong câu hỏi"], correct:1, explain:"이/가 phù hợp khi đưa ra thông tin mới hoặc nhấn mạnh chủ thể."},
{q:"Có quy tắc tuyệt đối 100% để phân biệt 2 trợ từ này không?", opts:["Có, luôn áp dụng được trong mọi trường hợp", "Không hoàn toàn, cần cảm nhận qua nhiều ví dụ thực tế", "Không có quy tắc nào cả", "Chỉ áp dụng cho văn viết"], correct:1, explain:"Đây là điểm ngữ pháp tinh tế, cần tích lũy kinh nghiệm qua thực hành nhiều."},
{q:"Làm bài điền trợ từ dựa vào ngữ cảnh có tác dụng gì?", opts:["Không có tác dụng gì", "Rèn luyện khả năng phân biệt thực tế qua nhiều tình huống cụ thể", "Chỉ để kiểm tra ngữ pháp máy móc", "Không liên quan đến kỹ năng giao tiếp"], correct:1, explain:"Luyện tập qua nhiều ngữ cảnh giúp phát triển trực giác ngôn ngữ tự nhiên."},
{q:"Tìm ví dụ thực tế từ bài hát/phim giúp ích gì cho việc phân biệt 2 trợ từ?", opts:["Không có ích gì", "Thấy được cách người bản xứ dùng trợ từ trong ngữ cảnh tự nhiên, không chỉ lý thuyết sách vở", "Chỉ để giải trí", "Làm mất thời gian ôn tập"], correct:1, explain:"Ngữ liệu thực tế giúp hiểu sâu hơn cách trợ từ được dùng trong đời sống thực."},
{q:"Tự đặt câu và cố tình chọn đúng 1 trong 2 trợ từ có mục đích gì?", opts:["Không có mục đích cụ thể", "Chủ động luyện tập phân biệt, thay vì chỉ đọc và nhận diện thụ động", "Chỉ để giải trí", "Không hiệu quả bằng đọc lý thuyết"], correct:1, explain:"Tạo câu chủ động là cách luyện tập tích cực, hiệu quả hơn học thụ động."},
{q:"Nếu 1 câu vừa có thể dùng 은/는 vừa có thể dùng 이/가 hợp lý, điều đó có nghĩa gì?", opts:["Câu đó sai ngữ pháp", "Có thể cả 2 đều đúng ngữ pháp nhưng mang sắc thái ý nghĩa khác nhau", "Chỉ 1 trong 2 là đúng tuyệt đối", "Không thể xảy ra trường hợp này"], correct:1, explain:"Nhiều trường hợp cả 2 trợ từ đều đúng ngữ pháp, chỉ khác về sắc thái nhấn mạnh."},
{q:"Kỹ năng phân biệt 은/는 và 이/가 có cải thiện nhanh trong 1 tuần không?", opts:["Có, hoàn thiện ngay lập tức", "Cần thời gian tích lũy qua thực hành liên tục, không chỉ 1 tuần", "Không thể cải thiện được", "Không cần luyện tập gì thêm"], correct:1, explain:"Đây là kỹ năng cần tích lũy dài hạn qua tiếp xúc và thực hành nhiều."},
{q:"So sánh 2 câu ví dụ đối lập (như 저는 vs 제가) có tác dụng học tập gì?", opts:["Không có tác dụng gì", "Làm rõ sự khác biệt sắc thái qua đối chiếu trực tiếp, dễ ghi nhớ hơn học riêng lẻ", "Chỉ gây nhầm lẫn thêm", "Không cần thiết phải so sánh"], correct:1, explain:"So sánh trực tiếp là phương pháp học hiệu quả để làm nổi bật sự khác biệt tinh tế."},

{label:'Thứ 5', title:'을/를 — trợ từ tân ngữ', content:'을/를 đánh dấu TÂN NGỮ của câu — đối tượng CHỊU TÁC ĐỘNG của động từ. 을 đi sau danh từ có batchim, 를 đi sau danh từ kết thúc nguyên âm. Ví dụ: 밥을 먹어요 (Ăn cơm) — 밥 (có batchim ㅂ) + 을; 커피를 마셔요 (Uống cà phê) — 커피 (kết thúc nguyên âm) + 를. Cấu trúc câu cơ bản tiếng Hàn theo thứ tự Chủ ngữ - Tân ngữ - Động từ (SOV), KHÁC tiếng Việt/tiếng Anh theo thứ tự SVO — động từ luôn đứng CUỐI câu.', exercises:["Học quy tắc chọn 을 (sau batchim) hay 를 (sau nguyên âm), viết 5 ví dụ cho mỗi trường hợp.","Viết 5 câu hoàn chỉnh theo cấu trúc S-O-V (chủ ngữ-tân ngữ-động từ) dùng 을/를.","So sánh trật tự từ tiếng Hàn (SOV) với tiếng Việt (SVO) qua 3 câu cụ thể.","Viết 1 đoạn văn ngắn (4-5 câu) mô tả các hoạt động hàng ngày, dùng đúng trợ từ 을/를.","Tìm 5 câu tiếng Hàn đơn giản có 을/를, xác định đâu là tân ngữ trong mỗi câu."], quiz:[
{q:"을/를 đánh dấu thành phần nào trong câu?", opts:["Chủ ngữ", "Tân ngữ (đối tượng chịu tác động của động từ)", "Chủ đề", "Trạng từ"], correct:1, explain:"을/를 là trợ từ tân ngữ, đánh dấu đối tượng bị tác động bởi hành động."},
{q:"을 đi sau danh từ như thế nào?", opts:["Kết thúc nguyên âm", "Có batchim", "Bất kỳ trường hợp nào", "Chỉ sau động từ"], correct:1, explain:"을 dùng khi danh từ trước có batchim."},
{q:"를 đi sau danh từ như thế nào?", opts:["Có batchim", "Kết thúc nguyên âm", "Bất kỳ trường hợp nào", "Chỉ sau tính từ"], correct:1, explain:"를 dùng khi danh từ trước kết thúc bằng nguyên âm."},
{q:"밥을 먹어요 nghĩa là gì?", opts:["Ăn cơm", "Uống nước", "Đi học", "Không có nghĩa cụ thể"], correct:0, explain:"밥 (cơm) + 을 (vì có batchim ㅂ) + 먹어요 (ăn) = ăn cơm."},
{q:"커피를 마셔요 dùng trợ từ nào và vì sao?", opts:["을, vì 커피 có batchim", "를, vì 커피 kết thúc nguyên âm", "이, vì là chủ ngữ", "은, vì là chủ đề"], correct:1, explain:"커피 kết thúc bằng nguyên âm nên dùng 를."},
{q:"Cấu trúc câu cơ bản tiếng Hàn theo thứ tự nào?", opts:["Chủ ngữ - Động từ - Tân ngữ (SVO)", "Chủ ngữ - Tân ngữ - Động từ (SOV)", "Động từ - Chủ ngữ - Tân ngữ", "Không có thứ tự cố định"], correct:1, explain:"Tiếng Hàn theo cấu trúc SOV, động từ luôn đứng cuối câu."},
{q:"Tiếng Việt và tiếng Anh theo cấu trúc câu nào?", opts:["SOV giống tiếng Hàn", "SVO (Chủ ngữ - Động từ - Tân ngữ)", "OSV", "Không có cấu trúc cố định"], correct:1, explain:"Tiếng Việt/Anh theo SVO, khác hẳn tiếng Hàn (SOV)."},
{q:"Vì sao cần lưu ý trật tự từ SOV khi học tiếng Hàn?", opts:["Không cần lưu ý gì", "Vì khác hẳn tiếng Việt (SVO), dễ gây nhầm lẫn khi mới bắt đầu xây dựng câu", "Trật tự từ không quan trọng trong tiếng Hàn", "Tiếng Hàn không có trật tự từ cố định"], correct:1, explain:"Sự khác biệt cấu trúc câu là điểm cần đặc biệt chú ý khi chuyển đổi tư duy ngôn ngữ."},
{q:"학교에 가요 (Đi đến trường) có dùng 을/를 không?", opts:["Có, luôn cần 을/를", "Không, vì 학교 ở đây không phải tân ngữ trực tiếp của 가다 (đi), dùng trợ từ khác (에)", "Chỉ dùng khi nói về trường học", "Câu này không đúng ngữ pháp"], correct:1, explain:"가다 (đi) thường không có tân ngữ trực tiếp theo kiểu 을/를, mà dùng trợ từ chỉ hướng khác (에)."},
{q:"Việc luyện viết câu theo đúng cấu trúc S-O-V giúp ích gì?", opts:["Không có ích gì", "Hình thành thói quen tư duy đúng trật tự từ tiếng Hàn ngay từ đầu", "Chỉ để luyện viết chữ đẹp", "Không liên quan đến ngữ pháp"], correct:1, explain:"Luyện tập theo đúng cấu trúc giúp hình thành phản xạ ngôn ngữ chính xác."},

{label:'Thứ 6', title:'Tổng kết tuần 6', content:'Trợ từ là đặc điểm ngữ pháp cốt lõi phân biệt tiếng Hàn (ngôn ngữ chắp dính, dùng trợ từ) với tiếng Việt (ngôn ngữ phân tích, dựa vào trật tự từ). Sau tuần này, bạn đã nắm 3 trợ từ quan trọng nhất: 은/는 (chủ đề), 이/가 (chủ ngữ, nhấn mạnh/thông tin mới), 을/를 (tân ngữ). Đây là nền tảng bắt buộc trước khi học các trợ từ khác và ngữ pháp phức tạp hơn.', exercises:["Làm bài tự kiểm tra: điền đúng trợ từ (은/는, 이/가, 을/를) cho 15 câu cho sẵn.","Viết 1 đoạn văn hoàn chỉnh (6-8 câu) tự giới thiệu, dùng đầy đủ cả 3 loại trợ từ đã học.","Ôn lại sự khác biệt giữa 은/는 và 이/가 bằng lời của chính bạn, không nhìn tài liệu.","Tổng hợp lại toàn bộ quy tắc chọn trợ từ (theo batchim/nguyên âm) thành 1 bảng ghi nhớ.","Tự đánh giá mức độ tự tin sử dụng trợ từ theo thang 1-10, xác định điểm cần ôn thêm."], quiz:[
{q:"Chủ đề trọng tâm tuần 6 tháng 2 là gì?", opts:["Câu chào hỏi cơ bản", "3 trợ từ cơ bản: 은/는, 이/가, 을/를", "Thì quá khứ", "Thể trang trọng 습니다"], correct:1, explain:"Tuần 6 tập trung vào 3 trợ từ nền tảng nhất của tiếng Hàn."},
{q:"3 trợ từ đã học trong tuần 6 đảm nhận vai trò gì?", opts:["Không có vai trò cụ thể", "은/는 (chủ đề), 이/가 (chủ ngữ), 을/를 (tân ngữ)", "Cả 3 đều giống hệt nhau", "Chỉ dùng trong văn viết"], correct:1, explain:"Đây là 3 vai trò ngữ pháp cốt lõi mà trợ từ đảm nhận trong câu tiếng Hàn."},
{q:"Vì sao trợ từ được coi là đặc trưng phân biệt tiếng Hàn với tiếng Việt?", opts:["Không có sự khác biệt nào", "Tiếng Hàn là ngôn ngữ chắp dính (dùng trợ từ); tiếng Việt là ngôn ngữ phân tích (dựa vào trật tự từ)", "Tiếng Việt cũng có hệ thống trợ từ y hệt", "Không liên quan đến phân loại ngôn ngữ"], correct:1, explain:"Đây là khác biệt loại hình ngôn ngữ học quan trọng giữa 2 ngôn ngữ."},
{q:"Không nắm vững trợ từ sẽ gây hậu quả gì khi nói/viết tiếng Hàn?", opts:["Không có hậu quả gì", "Người nghe/đọc có thể hiểu sai vai trò ngữ pháp của từng thành phần trong câu", "Chỉ ảnh hưởng nhẹ đến giọng điệu", "Không ảnh hưởng đến việc hiểu nghĩa câu"], correct:1, explain:"Trợ từ sai có thể làm thay đổi hoàn toàn cách hiểu vai trò các thành phần trong câu."},
{q:"Bài tự kiểm tra điền trợ từ cho 15 câu có mục đích gì?", opts:["Không có mục đích gì", "Đánh giá khách quan mức độ nắm vững 3 trợ từ đã học trong tuần", "Chỉ để làm bài tập cho có", "Không liên quan đến việc học thực sự"], correct:1, explain:"Đây là cách kiểm tra hiệu quả để xác định mức độ thành thạo thực tế."},
{q:"Viết đoạn văn tự giới thiệu dùng đủ 3 loại trợ từ có ý nghĩa gì?", opts:["Không có ý nghĩa gì", "Kiểm tra khả năng vận dụng tổng hợp cả 3 trợ từ trong 1 văn bản thực tế liền mạch", "Chỉ để luyện viết", "Không liên quan đến ngữ pháp trợ từ"], correct:1, explain:"Đây là bài kiểm tra tổng hợp về khả năng áp dụng đồng thời nhiều trợ từ."},
{q:"Bảng ghi nhớ quy tắc chọn trợ từ theo batchim/nguyên âm có tác dụng gì?", opts:["Không có tác dụng gì", "Tài liệu tra cứu nhanh, hỗ trợ ôn tập định kỳ về sau", "Chỉ để trang trí", "Không cần thiết vì đã học thuộc"], correct:1, explain:"Tổng hợp thành tài liệu riêng giúp ôn tập hiệu quả và tra cứu nhanh khi cần."},
{q:"Nền tảng trợ từ cơ bản có cần thiết trước khi học các trợ từ khác không?", opts:["Không cần thiết", "Có, đây là nền tảng bắt buộc trước khi mở rộng sang các trợ từ và ngữ pháp phức tạp hơn", "Có thể học trợ từ nâng cao trước", "Không liên quan đến trình tự học"], correct:1, explain:"3 trợ từ cơ bản là nền tảng thiết yếu cho toàn bộ hệ thống ngữ pháp tiếng Hàn sau này."},
{q:"Tuần 7 sắp tới sẽ học về chủ đề gì?", opts:["Tiếp tục trợ từ", "Động từ/tính từ thể 습니다/ㅂ니다 (thể trang trọng)", "Thì quá khứ", "Từ vựng gia đình"], correct:1, explain:"Sau khi nắm vững trợ từ, tuần 7 sẽ học thể chia động từ trang trọng đầu tiên."},
{q:"Kiến thức trợ từ tuần 6 có liên hệ gì với việc chia động từ sẽ học tuần 7?", opts:["Không liên quan gì đến nhau", "Cả 2 đều là thành phần cần thiết để xây dựng câu tiếng Hàn hoàn chỉnh, kết hợp cùng nhau trong câu thực tế", "Chỉ là 2 chủ đề độc lập", "Trợ từ không cần thiết khi đã học thể động từ"], correct:1, explain:"Trợ từ và cách chia động từ đều là thành phần cấu thành nên câu tiếng Hàn hoàn chỉnh, cần dùng phối hợp."},

{title:"Động từ/tính từ thể 습니다/ㅂ니다 (thể trang trọng)", points:["Thể 습니다/ㅂ니다 là dạng chia trang trọng nhất, dùng trong tình huống công việc, thuyết trình, tin tức.","Quy tắc chia: động từ có batchim + 습니다; động từ không có batchim + ㅂ니다.","Ví dụ: 먹다 (ăn) → 먹습니다; 가다 (đi) → 갑니다.","Dạng câu hỏi thay 다 bằng 까: 습니까?/ㅂ니까?","Đây là 1 trong 2 thể trang trọng chính của tiếng Hàn (cùng với 해요체 sẽ học sau) — TOPIK 1 yêu cầu thành thạo cả 2 thể này."], practice:"Chia 15 động từ/tính từ cơ bản sang thể 습니다/ㅂ니다, cả câu khẳng định và câu hỏi.", case:"Thể 습니다 xuất hiện rất nhiều trong tin tức, bản tin thời tiết tiếng Hàn — nghe được thể này giúp bạn tiếp cận nguồn tài liệu nghe thực tế ngay từ trình độ sơ cấp.", task:"Viết 1 đoạn giới thiệu ngắn (5 câu) về công việc/sở thích của bạn, toàn bộ động từ chia ở thể 습니다/ㅂ니다.", days:[
{label:'Thứ 2', title:'Quy tắc chia thể 습니다/ㅂ니다', content:'Thể 습니다/ㅂ니다 là thể trang trọng NHẤT trong tiếng Hàn, dùng trong tình huống công việc chính thức, thuyết trình, tin tức, phát biểu công khai. Quy tắc chia: lấy gốc động từ (bỏ 다), nếu gốc kết thúc bằng PHỤ ÂM (có batchim) thì thêm 습니다; nếu kết thúc bằng NGUYÊN ÂM (không batchim) thì thêm ㅂ니다. Ví dụ: 먹다 (ăn) → gốc 먹 (có batchim ㄱ) → 먹습니다; 가다 (đi) → gốc 가 (nguyên âm) → 갑니다.', exercises:["Học quy tắc chia thể 습니다/ㅂ니다 dựa vào batchim của gốc động từ.","Chia 10 động từ cơ bản (먹다, 가다, 오다, 보다, 읽다...) sang thể 습니다/ㅂ니다.","Chia 5 tính từ cơ bản (예쁘다, 크다, 작다...) sang thể trang trọng tương tự.","Viết 5 câu hoàn chỉnh dùng thể 습니다/ㅂ니다 mô tả hoạt động hàng ngày.","Tìm 3 ví dụ thể 습니다 trong tin tức/thông báo tiếng Hàn (nếu có tài liệu tham khảo)."], quiz:[
{q:"Thể 습니다/ㅂ니다 được dùng trong tình huống nào?", opts:["Chỉ với bạn thân", "Tình huống công việc chính thức, thuyết trình, tin tức", "Không bao giờ dùng", "Chỉ dùng khi viết nhật ký"], correct:1, explain:"Đây là thể trang trọng nhất, phù hợp các tình huống chính thức."},
{q:"Khi gốc động từ có batchim, thêm gì để tạo thể trang trọng?", opts:["ㅂ니다", "습니다", "해요", "아요"], correct:1, explain:"Gốc có batchim (phụ âm cuối) thì thêm 습니다."},
{q:"Khi gốc động từ không có batchim (kết thúc nguyên âm), thêm gì?", opts:["습니다", "ㅂ니다", "어요", "지 않다"], correct:1, explain:"Gốc kết thúc nguyên âm thì thêm ㅂ니다."},
{q:"먹다 (ăn) chia sang thể trang trọng là gì?", opts:["먹어요", "먹습니다", "먹아요", "먹입니다"], correct:1, explain:"먹 có batchim ㄱ nên thêm 습니다 = 먹습니다."},
{q:"가다 (đi) chia sang thể trang trọng là gì?", opts:["가습니다", "갑니다", "가어요", "가입니다"], correct:1, explain:"가 kết thúc nguyên âm nên thêm ㅂ니다 = 갑니다."},
{q:"Đây là 1 trong mấy thể lịch sự chính của tiếng Hàn?", opts:["1", "2", "3", "4"], correct:1, explain:"Tiếng Hàn có 2 thể lịch sự chính: 습니다/ㅂ니다 và 해요."},
{q:"Thể 습니다/ㅂ니다 phù hợp với TOPIK cấp độ nào?", opts:["Không liên quan đến TOPIK", "TOPIK 1 yêu cầu thành thạo cả 2 thể lịch sự", "Chỉ TOPIK 6", "Không cần biết cho TOPIK"], correct:1, explain:"TOPIK 1 yêu cầu thành thạo cả 습니다 và 해요."},
{q:"보다 (xem) chia sang thể trang trọng là gì?", opts:["봅니다", "보습니다", "보아요", "봐요"], correct:0, explain:"보 kết thúc nguyên âm nên thêm ㅂ니다 = 봅니다."},
{q:"Vì sao thể 습니다 xuất hiện nhiều trong tin tức tiếng Hàn?", opts:["Không có lý do gì", "Vì đây là ngữ cảnh trang trọng, cần thể lịch sự cao nhất", "Vì thể này dễ nghe hơn", "Không liên quan đến ngữ cảnh"], correct:1, explain:"Tin tức là ngữ cảnh trang trọng, phù hợp dùng thể lịch sự cao nhất."},
{q:"읽다 (đọc) chia sang thể trang trọng là gì?", opts:["읽어요", "읽습니다", "읽아요", "읽입니다"], correct:1, explain:"읽 có batchim (ㄺ) nên thêm 습니다 = 읽습니다."},

{label:'Thứ 3', title:'Câu hỏi & câu phủ định thể trang trọng', content:'Dạng câu hỏi của thể trang trọng thay đuôi 다 bằng 까: 먹습니다 → 먹습니까? (Có ăn không?); 갑니다 → 갑니까? (Có đi không?). Dạng phủ định có 2 cách: dùng 안 đặt TRƯỚC động từ (안 먹습니다 = không ăn), hoặc dùng cấu trúc 지 않다 (먹지 않습니다 = không ăn, trang trọng hơn). Với danh từ + 이다 (là), phủ định dùng 아니다: 학생입니다 (là học sinh) → 학생이 아닙니다 (không phải là học sinh).', exercises:["Chuyển 5 câu khẳng định thể 습니다/ㅂ니다 đã viết hôm trước sang dạng câu hỏi (thêm 까).","Học 2 cách phủ định: 안 + động từ và động từ + 지 않다, viết 3 ví dụ cho mỗi cách.","Viết 3 câu phủ định dạng 이다/아니다 (là/không phải là) ở thể trang trọng.","Viết 1 đoạn hội thoại ngắn hỏi-đáp (2-3 cặp câu) dùng thể 습니까?/습니다 hoàn chỉnh.","So sánh sắc thái giữa 안 먹습니다 và 먹지 않습니다, tìm hiểu cách nào phổ biến hơn."], quiz:[
{q:"Dạng câu hỏi của thể trang trọng tạo bằng cách nào?", opts:["Thêm 요 vào cuối", "Thay 다 bằng 까", "Thêm 은/는", "Không thể tạo câu hỏi"], correct:1, explain:"Thay đuôi 다 thành 까 để tạo câu hỏi: 습니다→습니까, ㅂ니다→ㅂ니까."},
{q:"먹습니다 ở dạng câu hỏi là gì?", opts:["먹습니까?", "먹어요?", "먹다까?", "먹습니다까?"], correct:0, explain:"Thay 다 bằng 까: 먹습니다 → 먹습니까?"},

{label:'Thứ 5', title:'Ứng dụng trong tình huống công việc', content:'Thể 습니다/ㅂ니다 đặc biệt quan trọng trong môi trường công việc tiếng Hàn: họp hành, thuyết trình, email công việc trang trọng, phỏng vấn xin việc. Đây là thể AN TOÀN NHẤT khi giao tiếp với người có địa vị cao hơn hoặc trong tình huống chính thức lần đầu gặp — không bao giờ bị coi là thất lễ dù có thể hơi \"cứng\" trong giao tiếp đời thường thân mật.', exercises:["Viết 1 đoạn giới thiệu bản thân trang trọng (dùng cho phỏng vấn xin việc) hoàn toàn bằng thể 습니다/ㅂ니다.","Viết 1 câu mở đầu và 1 câu kết thúc điển hình cho 1 bài thuyết trình công việc bằng thể trang trọng.","Tìm hiểu vì sao thể 습니다 phù hợp với môi trường công sở hơn thể 해요 trong nhiều tình huống.","Thử viết 1 email công việc ngắn (3-4 câu) bằng tiếng Hàn dùng thể 습니다/ㅂ니다.","Liệt kê 3 tình huống cụ thể trong công việc nên ưu tiên dùng thể 습니다/ㅂ니다."], quiz:[

{label:'Thứ 6', title:'Tổng kết tuần 7', content:'Sau tuần này, bạn đã thành thạo 1 trong 2 thể lịch sự quan trọng nhất của tiếng Hàn — thể 습니다/ㅂ니다, thể trang trọng và an toàn nhất trong mọi tình huống giao tiếp chính thức. Nắm vững quy tắc chia theo batchim, dạng câu hỏi (thêm 까), và 2 cách phủ định là nền tảng vững chắc. Tuần sau sẽ học thể 해요 — thể lịch sự nhưng thân mật hơn, phổ biến hơn trong giao tiếp đời thường.', exercises:["Làm bài tự kiểm tra: chia 10 động từ/tính từ ngẫu nhiên sang thể 습니다/ㅂ니다 không nhìn tài liệu.","Viết 1 đoạn văn hoàn chỉnh (6-8 câu) hoàn toàn bằng thể trang trọng, có cả câu khẳng định, phủ định, câu hỏi.","Ôn lại quy tắc chia theo batchim bằng lời của chính bạn.","Tổng hợp danh sách 25 động từ/tính từ đã chia qua thể 습니다/ㅂ니다 trong tuần thành 1 bảng ôn tập.","Tự đánh giá mức độ tự tin với thể 습니다/ㅂ니다 theo thang 1-10."], quiz:[
{q:"Chủ đề trọng tâm tuần 7 tháng 2 là gì?", opts:["Trợ từ cơ bản", "Thể trang trọng 습니다/ㅂ니다", "Thể 해요", "Thì quá khứ"], correct:1, explain:"Tuần 7 tập trung hoàn toàn vào thể lịch sự trang trọng nhất."},
{q:"Sau tuần 7, bạn đã thành thạo bao nhiêu trong 2 thể lịch sự chính?", opts:["0", "1 (thể 습니다/ㅂ니다)", "2", "Không thể lịch sự nào"], correct:1, explain:"Đã hoàn thành 1 trong 2 thể lịch sự, thể còn lại (해요) sẽ học tuần sau."},
{q:"3 kỹ năng chính đã luyện trong tuần 7 là gì?", opts:["Không có kỹ năng cụ thể nào", "Quy tắc chia theo batchim, dạng câu hỏi (thêm 까), 2 cách phủ định", "Chỉ học từ vựng mới", "Chỉ luyện phát âm"], correct:1, explain:"Đây là 3 trụ cột kỹ năng ngữ pháp đã được luyện tập xuyên suốt tuần."},
{q:"Tuần 8 sắp tới sẽ học về chủ đề gì?", opts:["Tiếp tục thể 습니다", "Thể 해요 & tổng kết tháng 2", "Thì quá khứ", "Từ vựng gia đình"], correct:1, explain:"Tuần 8 sẽ học thể lịch sự còn lại và tổng kết toàn bộ tháng 2."},
{q:"Bài tự kiểm tra chia 10 động từ ngẫu nhiên không nhìn tài liệu có mục đích gì?", opts:["Không có mục đích gì", "Đánh giá khách quan mức độ thành thạo thực sự sau 1 tuần luyện tập", "Chỉ để làm bài tập cho có", "Không liên quan đến việc học thực chất"], correct:1, explain:"Đây là cách kiểm tra hiệu quả để xác định mức độ nắm vững kiến thức."},
{q:"Đoạn văn hoàn chỉnh có cả khẳng định, phủ định, câu hỏi giúp ích gì?", opts:["Không có ích gì", "Kiểm tra khả năng vận dụng toàn diện thể ngữ pháp trong 1 văn bản liền mạch", "Chỉ để luyện viết", "Không liên quan đến ngữ pháp đã học"], correct:1, explain:"Đây là bài kiểm tra tổng hợp về khả năng áp dụng đầy đủ các dạng câu."},
{q:"Bảng ôn tập 25 động từ/tính từ đã chia có tác dụng gì lâu dài?", opts:["Không có tác dụng gì", "Tài liệu ôn tập định kỳ, tránh quên kiến thức đã học qua thời gian", "Chỉ để trang trí", "Không cần thiết vì đã học thuộc"], correct:1, explain:"Tài liệu tổng hợp giúp duy trì và củng cố kiến thức về lâu dài."},
{q:"Vì sao nên học thể 습니다 trước thể 해요 theo lộ trình?", opts:["Không có lý do đặc biệt về thứ tự", "Quy tắc chia của 습니다 đơn giản hơn (dựa vào batchim), phù hợp làm nền tảng trước khi học 해요 phức tạp hơn", "Thể 해요 không quan trọng", "Thứ tự học không ảnh hưởng gì"], correct:1, explain:"습니다 có quy tắc rõ ràng hơn, là bước đệm hợp lý trước khi học 해요 (dựa vào nguyên âm, phức tạp hơn)."},
{q:"Tự đánh giá mức độ tự tin theo thang 1-10 sau tuần 7 có ích lợi gì?", opts:["Không có ích lợi gì", "Xác định rõ điểm mạnh/yếu để có kế hoạch ôn tập phù hợp trước khi học thể mới", "Chỉ để ghi chép cho có", "Gây áp lực không cần thiết"], correct:1, explain:"Tự đánh giá khách quan giúp chuẩn bị tốt hơn cho kiến thức mới sắp học."},
{q:"Kiến thức thể 습니다 tuần 7 có nền tảng từ đâu trong lộ trình đã học?", opts:["Không liên quan đến kiến thức trước đó", "Dựa trên nền tảng Hangul (tháng 1) và trợ từ cơ bản (tuần 6) đã học", "Hoàn toàn độc lập, không cần kiến thức nền", "Chỉ liên quan đến tuần 6"], correct:1, explain:"Việc chia động từ đòi hỏi đọc viết Hangul tốt và hiểu cấu trúc câu có trợ từ đã học trước đó."},

{title:"Động từ/tính từ thể 해요 & tổng kết tháng 2", points:["Thể 해요 là thể lịch sự nhưng thân mật hơn 습니다, dùng phổ biến nhất trong giao tiếp hàng ngày.","Quy tắc chia dựa vào nguyên âm cuối của gốc động từ (ㅏ/ㅗ thêm 아요, các nguyên âm khác thêm 어요, một số trường hợp bất quy tắc).","Ví dụ: 가다 → 가요; 먹다 → 먹어요; 하다 → 해요 (bất quy tắc phổ biến nhất).","Trong hội thoại thực tế, người Hàn dùng 해요체 nhiều hơn 습니다체.","Cả 2 thể đều là thể lịch sự, khác với thể suồng sã (반말) dùng với bạn bè thân — TOPIK 1-2 tập trung vào 2 thể lịch sự trước."], practice:"Chia lại 15 động từ/tính từ đã học ở tuần 7 sang thể 해요, so sánh sắc thái với thể 습니다.", case:"Thể 해요 là thể bạn sẽ nghe nhiều nhất khi xem phim/nghe nhạc Hàn Quốc — luyện thành thạo giúp bạn hiểu phần lớn hội thoại đời thường.", task:"Viết lại đoạn giới thiệu bản thân đã viết ở tuần 7, chuyển toàn bộ sang thể 해요, cảm nhận sự khác biệt sắc thái.", days:[

{q:"Quy tắc chia thể 해요 dựa vào yếu tố nào của gốc động từ?", opts:["Batchim cuối", "Nguyên âm cuối", "Số lượng âm tiết", "Không có quy tắc cụ thể"], correct:1, explain:"Khác 습니다 (dựa batchim), thể 해요 dựa vào nguyên âm cuối của gốc."},
{q:"Nguyên âm nào của gốc động từ sẽ thêm 아요?", opts:["ㅓ, ㅜ", "ㅏ hoặc ㅗ", "ㅣ, ㅡ", "Mọi nguyên âm đều thêm 아요"], correct:1, explain:"Gốc có nguyên âm ㅏ hoặc ㅗ thì thêm 아요."},
{q:"Nguyên âm nào của gốc động từ sẽ thêm 어요?", opts:["ㅏ, ㅗ", "Các nguyên âm còn lại (không phải ㅏ/ㅗ)", "Chỉ ㅣ", "Không có trường hợp nào thêm 어요"], correct:1, explain:"Các nguyên âm khác ngoài ㅏ/ㅗ thì thêm 어요."},
{q:"가다 (đi) chia sang thể 해요 là gì?", opts:["가어요", "가요", "갑니다", "가습니다"], correct:1, explain:"가 có nguyên âm ㅏ nên thêm 아요, rút gọn thành 가요."},
{q:"먹다 (ăn) chia sang thể 해요 là gì?", opts:["먹아요", "먹어요", "먹습니다", "먹요"], correct:1, explain:"먹 có nguyên âm ㅓ (không phải ㅏ/ㅗ) nên thêm 어요."},
{q:"오다 (đến) chia sang thể 해요 là gì?", opts:["오아요", "와요 (dạng rút gọn)", "오어요", "옵니다"], correct:1, explain:"오 + 아요 rút gọn thành 와요 theo quy tắc kết hợp nguyên âm."},
{q:"Thể 해요 có phức tạp hơn thể 습니다/ㅂ니다 không?", opts:["Đơn giản hơn nhiều", "Phức tạp hơn vì phụ thuộc nguyên âm cuối, có nhiều biến thể hơn", "Giống hệt nhau về độ phức tạp", "Không thể so sánh được"], correct:1, explain:"Quy tắc dựa vào nguyên âm phức tạp hơn quy tắc dựa vào batchim của 습니다."},

{q:"Vì sao cần xác định nguyên âm cuối gốc trước khi chia thể 해요?", opts:["Không cần thiết", "Vì đây là yếu tố quyết định chọn 아요 hay 어요", "Chỉ cần đoán ngẫu nhiên", "Nguyên âm không ảnh hưởng đến cách chia"], correct:1, explain:"Nguyên âm cuối gốc là yếu tố quyết định trực tiếp quy tắc chia thể 해요."},

{label:'Thứ 4', title:'So sánh sắc thái 습니다 vs 해요', content:'Cả 2 thể đều LỊCH SỰ (không phải suồng sã), khác biệt chủ yếu ở SẮC THÁI: 습니다 trang trọng/cứng nhắc hơn, phù hợp công việc chính thức; 해요 lịch sự nhưng THÂN MẬT/gần gũi hơn, phù hợp giao tiếp hàng ngày với đồng nghiệp, người quen. Trong thực tế, người Hàn dùng 해요 nhiều hơn hẳn trong đời sống thường ngày — phim ảnh, nhạc pop chủ yếu dùng thể này.', exercises:["Viết cùng 1 đoạn văn (5 câu) 2 lần: 1 lần bằng thể 습니다, 1 lần bằng thể 해요, cảm nhận sự khác biệt.","Liệt kê 3 tình huống nên ưu tiên dùng 습니다 và 3 tình huống nên ưu tiên dùng 해요.","Xem 1 đoạn phim/video Hàn Quốc ngắn, thử đếm xem nhân vật dùng thể nào nhiều hơn.","Viết giải thích bằng lời của bạn: vì sao cả 2 thể đều \"lịch sự\" nhưng khác nhau về sắc thái.","Thử chuyển đổi 5 câu bất kỳ giữa 2 thể để luyện phản xạ linh hoạt."], quiz:[
{q:"습니다 và 해요 có điểm chung gì?", opts:["Không có điểm chung nào", "Cả 2 đều là thể LỊCH SỰ, khác thể suồng sã (반말)", "Cả 2 đều là thể suồng sã", "Chỉ 1 trong 2 là thể lịch sự thật sự"], correct:1, explain:"Cả 2 đều thuộc nhóm thể lịch sự, chỉ khác nhau về sắc thái trang trọng/thân mật."},
{q:"습니다 khác 해요 chủ yếu ở điểm nào?", opts:["Không có sự khác biệt nào", "Sắc thái: 습니다 trang trọng/cứng nhắc hơn, 해요 thân mật/gần gũi hơn", "습니다 là thể suồng sã", "해요 chỉ dùng trong văn viết"], correct:1, explain:"Đây là khác biệt cốt lõi về mức độ trang trọng giữa 2 thể lịch sự."},
{q:"Trong đời sống thường ngày, người Hàn dùng thể nào nhiều hơn?", opts:["습니다 nhiều hơn hẳn", "해요 nhiều hơn hẳn", "Cả 2 dùng như nhau tuyệt đối", "Không dùng thể nào cả"], correct:1, explain:"해요 phổ biến hơn trong giao tiếp đời thường, phim ảnh, âm nhạc."},
{q:"습니다 phù hợp nhất với tình huống nào?", opts:["Nói chuyện với bạn thân", "Môi trường công việc chính thức", "Xem phim giải trí", "Nghe nhạc pop"], correct:1, explain:"습니다 phù hợp nhất với ngữ cảnh trang trọng, chính thức."},
{q:"해요 phù hợp nhất với tình huống nào?", opts:["Chỉ trong văn bản pháp lý", "Giao tiếp hàng ngày với đồng nghiệp, người quen", "Chỉ trong bài phát biểu chính thức", "Không phù hợp tình huống nào"], correct:1, explain:"해요 tự nhiên và phù hợp cho giao tiếp đời thường, ít trang trọng hơn."},
{q:"Xem phim/video Hàn Quốc để đếm tần suất dùng thể nào có mục đích gì?", opts:["Không có mục đích gì", "Kiểm chứng thực tế xem thể nào phổ biến hơn trong giao tiếp tự nhiên", "Chỉ để giải trí", "Không liên quan đến việc học ngữ pháp"], correct:1, explain:"Quan sát thực tế giúp xác nhận lý thuyết đã học bằng ví dụ sống động."},
{q:"Vì sao cả 2 thể đều được gọi là \"lịch sự\" dù khác sắc thái?", opts:["Không có lý do gì", "Vì cả 2 đều thể hiện sự tôn trọng người nghe, khác hẳn thể suồng sã dùng với bạn thân", "Chỉ 1 trong 2 thực sự lịch sự", "Lịch sự không liên quan đến thể ngữ pháp"], correct:1, explain:"Cả 2 đều nằm trong nhóm thể tôn trọng người nghe, phân biệt với 반말 (suồng sã)."},
{q:"Viết cùng 1 đoạn văn bằng cả 2 thể có tác dụng gì?", opts:["Không có tác dụng gì", "Cảm nhận trực tiếp sự khác biệt sắc thái giữa 2 thể qua cùng 1 nội dung", "Chỉ để luyện viết", "Làm mất thời gian không cần thiết"], correct:1, explain:"So sánh trực tiếp cùng nội dung giúp thấy rõ khác biệt về sắc thái, không chỉ hình thức."},
{q:"Việc chọn sai thể (dùng 해요 khi cần 습니다 hoặc ngược lại) có ảnh hưởng gì?", opts:["Không ảnh hưởng gì", "Có thể gây cảm giác không phù hợp/hơi thất lễ tùy ngữ cảnh, dù vẫn là thể lịch sự", "Sẽ gây hiểu nhầm hoàn toàn về nghĩa câu", "Luôn gây lỗi ngữ pháp nghiêm trọng"], correct:1, explain:"Cả 2 đều là thể lịch sự nên không gây lỗi nghiêm trọng, nhưng chọn sai ngữ cảnh có thể tạo cảm giác không phù hợp."},
{q:"3 tình huống nên ưu tiên dùng 해요 là gì?", opts:["Không có tình huống cụ thể", "Trò chuyện với đồng nghiệp, bạn quen biết, giao tiếp hàng ngày không quá trang trọng", "Chỉ trong phỏng vấn xin việc", "Chỉ trong văn bản chính thức"], correct:1, explain:"Đây là các ví dụ điển hình cho ngữ cảnh phù hợp dùng thể 해요."},

{label:'Thứ 5', title:'Luyện tổng hợp qua hội thoại thực tế', content:'Luyện tổng hợp qua hội thoại thực tế giúp củng cố cả 2 thể đã học trong bối cảnh tự nhiên — ví dụ hội thoại giữa đồng nghiệp (thường dùng 해요) chuyển sang báo cáo với sếp (chuyển sang 습니다). Khả năng CHUYỂN ĐỔI LINH HOẠT giữa 2 thể tùy theo đối tượng giao tiếp là kỹ năng thực tế quan trọng trong văn hóa Hàn Quốc.', exercises:["Viết 1 đoạn hội thoại giả định (6-8 câu) giữa 2 đồng nghiệp dùng thể 해요.","Viết 1 đoạn hội thoại khác (4-5 câu) mô phỏng báo cáo công việc với cấp trên dùng thể 습니다.","Thử đóng vai chuyển đổi giữa 2 tình huống trên, luyện phản xạ đổi thể phù hợp ngữ cảnh.","Nghe 1 đoạn hội thoại tiếng Hàn thực tế (phim/nhạc), xác định thể đang được dùng.","Tự ghi âm bản thân nói 5 câu ở thể 해요 và 5 câu ở thể 습니다, so sánh sự tự nhiên giữa 2 lần đọc."], quiz:[
{q:"Khả năng chuyển đổi linh hoạt giữa 2 thể quan trọng vì sao?", opts:["Không quan trọng", "Người Hàn liên tục điều chỉnh mức độ trang trọng tùy theo người đang giao tiếp cùng", "Chỉ 1 thể là đủ dùng mọi lúc", "Không liên quan đến giao tiếp thực tế"], correct:1, explain:"Đây là kỹ năng giao tiếp thực tế quan trọng trong văn hóa Hàn Quốc."},
{q:"Hội thoại giữa đồng nghiệp thường dùng thể nào?", opts:["습니다 luôn luôn", "Thường là 해요, tùy mối quan hệ cụ thể", "Thể suồng sã 반말", "Không có quy tắc chung"], correct:1, explain:"Đồng nghiệp cùng cấp thường giao tiếp bằng 해요, thân mật nhưng vẫn lịch sự."},

{q:"Việc luyện đóng vai chuyển đổi giữa 2 tình huống có mục đích gì?", opts:["Không có mục đích gì", "Luyện phản xạ thực tế đổi thể phù hợp theo từng ngữ cảnh giao tiếp khác nhau", "Chỉ để giải trí", "Không liên quan đến kỹ năng giao tiếp thực tế"], correct:1, explain:"Đây là kỹ năng thực hành quan trọng, mô phỏng tình huống giao tiếp đa dạng thực tế."},
{q:"Nghe hội thoại tiếng Hàn thực tế để xác định thể đang dùng giúp ích gì?", opts:["Không có ích gì", "Rèn luyện khả năng nhận diện thể ngữ pháp trong ngữ cảnh tự nhiên, không chỉ lý thuyết", "Chỉ để giải trí", "Không liên quan đến việc học"], correct:1, explain:"Nhận diện thực tế củng cố khả năng ứng dụng kiến thức đã học vào tình huống sống động."},
{q:"Ghi âm và so sánh giọng đọc ở 2 thể khác nhau có tác dụng gì?", opts:["Không có tác dụng gì", "Tự đánh giá độ tự nhiên và trôi chảy khi chuyển đổi giữa 2 thể", "Chỉ để giải trí", "Làm mất thời gian không cần thiết"], correct:1, explain:"So sánh trực tiếp giúp nhận ra mức độ thành thạo với từng thể khi phát âm thực tế."},
{q:"Văn hóa Hàn Quốc coi trọng điều gì qua việc chuyển đổi thể linh hoạt?", opts:["Không coi trọng điều gì đặc biệt", "Sự nhạy bén trong việc đánh giá đúng mối quan hệ và ngữ cảnh giao tiếp", "Chỉ là quy tắc ngữ pháp máy móc", "Không liên quan đến văn hóa"], correct:1, explain:"Khả năng đọc đúng ngữ cảnh xã hội là giá trị văn hóa quan trọng, thể hiện qua ngôn ngữ."},
{q:"Nếu không chắc chắn nên dùng thể nào trong 1 tình huống mới, nên làm gì?", opts:["Dùng thể suồng sã cho tiện", "Ưu tiên thể lịch sự (해요 hoặc 습니다) để an toàn, quan sát thêm ngữ cảnh", "Không nói gì cả", "Luôn dùng thể 반말"], correct:1, explain:"Khi không chắc chắn, luôn nên chọn thể lịch sự để tránh thất lễ."},
{q:"Luyện tổng hợp qua hội thoại thực tế khác gì so với chỉ học chia động từ đơn lẻ?", opts:["Không khác gì", "Đặt kiến thức vào bối cảnh sử dụng thực tế, gần với giao tiếp đời sống hơn", "Không có giá trị học tập nào", "Chỉ là hình thức khác của cùng 1 nội dung"], correct:1, explain:"Luyện qua hội thoại giúp kiến thức trở nên thực tế và dễ ứng dụng hơn học tách biệt."},
{q:"Sau ngày luyện tổng hợp này, kỹ năng nào đã được củng cố mạnh nhất?", opts:["Không có kỹ năng nào được củng cố", "Khả năng nhận diện và chuyển đổi linh hoạt giữa 2 thể lịch sự theo ngữ cảnh", "Chỉ kỹ năng viết chữ", "Chỉ kỹ năng nghe đơn thuần"], correct:1, explain:"Đây chính là mục tiêu cốt lõi của ngày luyện tập tổng hợp này."},

{label:'Thứ 6', title:'Tổng kết tháng 2', content:'Sau tháng 2, bạn đã có nền tảng ngữ pháp sơ cấp quan trọng nhất: đại từ nhân xưng, 3 trợ từ cơ bản, và cả 2 thể lịch sự (습니다/ㅂ니다 và 해요) — đủ để xây dựng câu tiếng Hàn cơ bản hoàn chỉnh và giao tiếp trong nhiều tình huống khác nhau. Kết hợp với nền tảng Hangul vững chắc từ tháng 1, bạn đã sẵn sàng học thì quá khứ/tương lai và từ vựng mở rộng ở tháng 3.', exercises:["Viết 1 đoạn văn hoàn chỉnh (8-10 câu) tự giới thiệu bản thân, dùng đầy đủ trợ từ và cả 2 thể lịch sự.","Làm bài tự kiểm tra tổng hợp: chia 10 động từ sang cả 2 thể (습니다 và 해요), điền đúng trợ từ cho 10 câu.","Ôn lại toàn bộ ngữ pháp đã học tháng 2 bằng lời của chính bạn, không nhìn tài liệu.","Viết 1 đoạn nhật ký tổng kết tháng 2: điều gì bạn tự tin nhất, điều gì còn cần ôn thêm.","Đặt mục tiêu cụ thể cho tháng 3 (thì quá khứ/tương lai) dựa trên điểm còn yếu của tháng 2."], quiz:[
{q:"Sau tháng 2, bạn đã có nền tảng ngữ pháp nào?", opts:["Chưa có nền tảng gì", "Đại từ nhân xưng, 3 trợ từ cơ bản, cả 2 thể lịch sự", "Chỉ biết bảng chữ cái", "Chỉ biết vài từ vựng đơn lẻ"], correct:1, explain:"Đây là tổng hợp đầy đủ những gì đã học xuyên suốt tháng 2."},
{q:"Kết hợp nền tảng Hangul (tháng 1) và ngữ pháp (tháng 2) giúp bạn làm được gì?", opts:["Không có khả năng gì mới", "Xây dựng câu tiếng Hàn cơ bản hoàn chỉnh và giao tiếp trong nhiều tình huống", "Chỉ đọc được chữ, chưa hiểu nghĩa", "Không có tiến bộ đáng kể nào"], correct:1, explain:"Đây là năng lực thực tế đạt được sau 2 tháng học có hệ thống."},
{q:"Tháng 3 sẽ tập trung vào chủ đề gì theo lộ trình?", opts:["Học lại Hangul từ đầu", "Thì quá khứ/tương lai và từ vựng mở rộng", "Ngừng học tiếng Hàn", "Chỉ ôn lại tháng 2"], correct:1, explain:"Tháng 3 xây dựng tiếp trên nền tảng đã có, học các thì và mở rộng vốn từ."},
{q:"Bài tự kiểm tra tổng hợp cuối tháng 2 nên bao gồm những gì?", opts:["Chỉ cần kiểm tra 1 nội dung", "Chia động từ ở cả 2 thể VÀ điền đúng trợ từ cho các câu", "Chỉ cần nhớ từ vựng", "Không cần kiểm tra gì"], correct:1, explain:"Bài kiểm tra tổng hợp nên bao quát cả trợ từ và cả 2 thể chia động từ đã học."},
{q:"Viết nhật ký tổng kết tháng 2 có lợi ích tâm lý gì?", opts:["Không có lợi ích gì", "Nhìn nhận rõ tiến bộ đã đạt được, duy trì động lực cho tháng tiếp theo", "Chỉ là hình thức không cần thiết", "Có thể gây chán nản không nên làm"], correct:1, explain:"Nhìn lại tiến bộ cụ thể giúp duy trì động lực học tập dài hạn."},
{q:"Vì sao nên đặt mục tiêu cụ thể cho tháng 3 dựa trên điểm yếu tháng 2?", opts:["Không cần thiết", "Giúp tập trung ôn tập đúng trọng tâm, xây dựng kế hoạch học có định hướng rõ ràng", "Chỉ để có kế hoạch cho vui", "Không liên quan đến hiệu quả học tập"], correct:1, explain:"Mục tiêu dựa trên điểm yếu thực tế giúp việc học tháng 3 hiệu quả và có trọng tâm hơn."},
{q:"Đoạn văn tự giới thiệu 8-10 câu dùng đủ ngữ pháp đã học có mục đích gì?", opts:["Không có mục đích gì", "Kiểm tra khả năng vận dụng tổng hợp toàn bộ kiến thức tháng 2 trong 1 văn bản hoàn chỉnh", "Chỉ để luyện viết", "Không liên quan đến việc tổng kết"], correct:1, explain:"Đây là bài kiểm tra tổng hợp toàn diện nhất cho cả tháng học."},
{q:"Sau khi hoàn thành thì quá khứ/tương lai ở tháng 3, bạn sẽ có khả năng gì mới?", opts:["Không có khả năng gì mới", "Kể chuyện về quá khứ và diễn đạt dự định tương lai bằng tiếng Hàn", "Chỉ nói được về hiện tại", "Không liên quan đến kỹ năng giao tiếp"], correct:1, explain:"Đây là năng lực quan trọng sẽ được xây dựng thêm trong tháng 3 sắp tới."},
{q:"Việc duy trì luyện tập đều đặn có vai trò gì cho thành công lâu dài?", opts:["Không quan trọng", "Là chìa khóa quan trọng nhất cho việc tiếp thu ngữ pháp phức tạp hơn ở các giai đoạn sau", "Chỉ cần học tập trung 1 lần là đủ", "Không ảnh hưởng đến kết quả học tập"], correct:1, explain:"Ngữ pháp tiếng Hàn có tính lũy tiến cao, đòi hỏi luyện tập liên tục để tiếp thu hiệu quả."},
{q:"Tổng thể, thành quả lớn nhất sau 2 tháng học có hệ thống là gì?", opts:["Chỉ là điểm số hoặc chứng chỉ", "Nền tảng ngữ pháp vững chắc VÀ thói quen học tập có phương pháp, sẵn sàng cho giai đoạn nâng cao hơn", "Không có thành quả đáng kể nào", "Chỉ là ghi nhớ được nhiều từ vựng rời rạc"], correct:1, explain:"Thành quả quan trọng nhất là nền tảng vững chắc kết hợp phương pháp học bền vững cho hành trình dài phía trước."},
], vocab:[
{term:"목표", meaning:"mục tiêu", example:"이번 달 목표를 세워요. (Đặt mục tiêu tháng này.)"},
{term:"발전", meaning:"sự phát triển", example:"실력이 발전했어요. (Trình độ đã phát triển.)"},
{term:"노력", meaning:"sự nỗ lực", example:"많이 노력했어요. (Đã nỗ lực rất nhiều.)"},
{term:"자신감", meaning:"sự tự tin", example:"자신감이 생겼어요. (Đã có được sự tự tin.)"},

{term:"준비", meaning:"sự chuẩn bị", example:"시험 준비를 해요. (Chuẩn bị cho kỳ thi.)"},

{term:"향상", meaning:"sự nâng cao", example:"실력 향상이 보여요. (Thấy rõ sự nâng cao trình độ.)"},

{term:"루틴", meaning:"thói quen, lịch trình đều đặn", example:"아침 루틴이에요. (Đây là thói quen buổi sáng.)"},
{term:"성실", meaning:"sự chăm chỉ, tận tâm", example:"성실하게 공부해요. (Học tập chăm chỉ tận tâm.)"},
{term:"꿈", meaning:"giấc mơ, ước mơ", example:"큰 꿈이 있어요. (Có ước mơ lớn.)"},
