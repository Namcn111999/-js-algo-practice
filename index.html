<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học Tập Hàng Ngày · FE / Java Backend / Thuật Toán</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg-primary:#0B0E14;
    --bg-panel:#11151E;
    --bg-elevated:#1A2030;
    --border:#242C3E;
    --text-primary:#E7E9F0;
    --text-muted:#8B93A7;
    --text-dim:#5A6273;
    --fe:#4FD1C5;       /* teal - Frontend */
    --fe-dim:rgba(79,209,197,0.12);
    --be:#F0B429;        /* amber - Java Backend */
    --be-dim:rgba(240,180,41,0.12);
    --algo:#9F7AEA;       /* violet - Algorithm */
    --algo-dim:rgba(159,122,234,0.12);
    --coral:#FF6B6B;
    --coral-dim:rgba(255,107,107,0.12);
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg-primary);
    color:var(--text-primary);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  ::selection{background:var(--algo-dim); color:var(--algo);}

  header{
    padding:18px 28px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    position:sticky; top:0; z-index:10;
    background:rgba(11,14,20,0.92);
    backdrop-filter:blur(8px);
  }
  .brand{display:flex; align-items:baseline; gap:12px;}
  .brand .dot{
    width:10px; height:10px; border-radius:50%;
    background:var(--algo);
    display:inline-block;
    box-shadow:0 0 12px var(--algo);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.4;}}
  .brand h1{font-family:var(--mono); font-size:16px; font-weight:700; letter-spacing:-0.02em;}
  .brand .path{font-family:var(--mono); font-size:11.5px; color:var(--text-dim);}

  .progress-wrap{display:flex; align-items:center; gap:14px;}
  .progress-track{
    width:140px; height:6px; border-radius:6px;
    background:var(--bg-elevated); overflow:hidden;
  }
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--fe),var(--algo)); border-radius:6px; transition:width .3s;}
  .progress-label{font-family:var(--mono); font-size:12px; color:var(--text-muted);}
  .progress-label b{color:var(--text-primary);}

  .app{
    flex:1;
    display:grid;
    grid-template-columns:220px 1fr;
    min-height:0;
  }
  @media (max-width:860px){
    .app{grid-template-columns:1fr;}
    .sidebar{border-right:none; border-bottom:1px solid var(--border); max-height:180px;}
  }

  .sidebar{
    border-right:1px solid var(--border);
    overflow-y:auto;
    padding:14px 0;
  }
  .sidebar-label{
    font-family:var(--mono); font-size:10px; letter-spacing:.12em;
    color:var(--text-dim); padding:6px 20px 8px; text-transform:uppercase;
  }
  .day-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 20px; cursor:pointer;
    border-left:2px solid transparent;
    transition:background .15s, border-color .15s;
  }
  .day-item:hover{background:var(--bg-elevated);}
  .day-item.active{background:var(--bg-elevated); border-left-color:var(--algo);}
  .day-item .num{font-family:var(--mono); font-size:12.5px; color:var(--text-dim); width:20px;}
  .day-item .theme{font-size:12.5px; color:var(--text-muted); flex:1; line-height:1.3;}
  .day-item.active .theme{color:var(--text-primary);}
  .day-dots{display:flex; gap:3px; flex-shrink:0;}
  .day-dots span{width:5px; height:5px; border-radius:50%; background:var(--border);}
  .day-dots span.done.fe{background:var(--fe);}
  .day-dots span.done.be{background:var(--be);}
  .day-dots span.done.algo{background:var(--algo);}

  main{padding:26px 32px 60px; overflow-y:auto; max-width:920px;}

  .day-title{
    font-family:var(--mono); font-size:22px; font-weight:700;
    letter-spacing:-0.01em; margin-bottom:4px;
  }
  .day-subtitle{color:var(--text-dim); font-size:13px; margin-bottom:28px;}

  .section{
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--bg-panel);
    margin-bottom:24px;
    overflow:hidden;
  }
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px;
    background:var(--bg-elevated);
    border-bottom:1px solid var(--border);
  }
  .section-head .left{display:flex; align-items:center; gap:10px;}
  .track-tag{
    font-family:var(--mono); font-size:10.5px; font-weight:700;
    padding:3px 9px; border-radius:20px; letter-spacing:.04em;
  }
  .track-tag.fe{background:var(--fe-dim); color:var(--fe);}
  .track-tag.be{background:var(--be-dim); color:var(--be);}
  .track-tag.algo{background:var(--algo-dim); color:var(--algo);}
  .section-head h3{font-size:15px; font-weight:600;}

  .check-btn{
    display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:11.5px;
    background:transparent; border:1px solid var(--border);
    color:var(--text-muted); padding:6px 12px; border-radius:6px;
    cursor:pointer; transition:.15s;
  }
  .check-btn:hover{border-color:var(--text-dim); color:var(--text-primary);}
  .check-btn.checked{background:var(--fe-dim); border-color:var(--fe); color:var(--fe);}
  .check-btn.checked.be-style{background:var(--be-dim); border-color:var(--be); color:var(--be);}

  .section-body{padding:18px 20px;}
  .points{list-style:none; margin-bottom:16px;}
  .points li{
    position:relative; padding-left:20px; margin-bottom:10px;
    font-size:14px; line-height:1.65; color:var(--text-muted);
  }
  .points li::before{
    content:'—'; position:absolute; left:0; color:var(--text-dim);
  }
  .task-box{
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:8px;
    padding:13px 16px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--text-primary);
  }
  .task-box b{
    display:block; font-family:var(--mono); font-size:10.5px;
    letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim);
    margin-bottom:6px; font-weight:700;
  }

  /* Algorithm section specifics */
  .algo-desc{color:var(--text-muted); font-size:14px; line-height:1.6; margin-bottom:14px;}
  .algo-example{
    font-family:var(--mono); font-size:12px;
    background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:8px; padding:11px 14px; color:var(--text-muted);
    margin-bottom:16px; white-space:pre-wrap;
  }
  .algo-example b{color:var(--algo); font-weight:600;}

  .editor-wrap{border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:14px;}
  .editor-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 14px; background:var(--bg-elevated); border-bottom:1px solid var(--border);
  }
  .editor-topbar .fname{font-family:var(--mono); font-size:11.5px; color:var(--text-muted);}
  .btn-row{display:flex; gap:8px;}
  button.action{
    font-family:var(--mono); font-size:12px; font-weight:600;
    border:none; border-radius:6px; padding:7px 14px; cursor:pointer;
    transition:transform .1s, opacity .15s;
  }
  button.action:active{transform:scale(0.97);}
  .btn-run{background:var(--algo); color:#1A0E33;}
  .btn-run:hover{opacity:.88;}
  .btn-reset{background:transparent; color:var(--text-muted); border:1px solid var(--border);}
  .btn-reset:hover{color:var(--text-primary); border-color:var(--text-dim);}

  textarea.editor{
    width:100%; min-height:180px; background:var(--bg-panel);
    color:var(--text-primary); border:none; outline:none; resize:vertical;
    font-family:var(--mono); font-size:13px; line-height:1.6; padding:14px 16px; tab-size:2;
  }

  .console{border:1px solid var(--border); border-radius:10px; background:#080A0F; overflow:hidden;}
  .console-topbar{
    padding:8px 14px; background:var(--bg-elevated); border-bottom:1px solid var(--border);
    font-family:var(--mono); font-size:11.5px; color:var(--text-dim);
  }
  .console-body{padding:13px 16px; font-family:var(--mono); font-size:12.5px; line-height:1.8; min-height:50px;}
  .console-empty{color:var(--text-dim);}
  .test-line{display:flex; gap:9px; align-items:flex-start; margin-bottom:5px;}
  .test-line .mark{width:13px; flex-shrink:0;}
  .test-line.pass .mark{color:var(--algo);}
  .test-line.fail .mark{color:var(--coral);}
  .test-line .txt{color:var(--text-muted);}
  .test-line.fail .txt{color:var(--text-primary);}
  .test-line .detail{color:var(--text-dim); display:block; margin-top:2px; font-size:11.5px;}
  .summary-line{margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); font-weight:600;}
  .summary-line.pass{color:var(--algo);}
  .summary-line.fail{color:var(--coral);}
  .error-line{color:var(--coral); white-space:pre-wrap;}

  .day-nav{
    display:flex; justify-content:space-between; margin-top:8px; gap:10px;
  }
  .nav-btn{
    font-family:var(--mono); font-size:12.5px; font-weight:600;
    background:var(--bg-panel); border:1px solid var(--border); color:var(--text-primary);
    padding:10px 18px; border-radius:8px; cursor:pointer; flex:1; text-align:center;
    transition:.15s;
  }
  .nav-btn:hover{border-color:var(--text-dim);}
  .nav-btn:disabled{opacity:.35; cursor:default;}

  footer{
    text-align:center; padding:16px; font-family:var(--mono);
    font-size:11px; color:var(--text-dim); border-top:1px solid var(--border);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    <h1>học tập hàng ngày</h1>
    <span class="path">FE · Java Backend · Thuật toán</span>
  </div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <span class="progress-label" id="progress-label"><b>0</b>/20 ngày</span>
  </div>
</header>

<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-label">Lộ trình 20 ngày</div>
  </nav>
  <main id="main"></main>
</div>

<footer>tự học mỗi ngày ~1–2 tiếng · tiến độ được lưu ngay trên trình duyệt này</footer>

<script>
/* ============ DATA: 20-DAY CURRICULUM ============ */
const curriculum = [
{day:1, theme:"Nền tảng: Component & OOP",
 fe:{title:"Kiến trúc Component & Composable trong Vue 3", points:[
   "Composable là hàm bắt đầu bằng \"use\" đóng gói logic có thể tái sử dụng, tách biệt khỏi UI.",
   "Nguyên tắc: mỗi component nên làm một việc, logic phức tạp đẩy ra composable.",
   "So với mixin cũ ở Vue 2, composable tránh xung đột tên và dễ trace nguồn gốc hơn.",
   "Composable có thể nhận tham số reactive (ref/computed) và trả về state + method.",
   "Trong AWX Refiner, các pattern lặp lại như gọi API + loading state là ứng viên tốt để tách composable."],
  task:"Chọn 1 đoạn logic lặp lại trong AWX Refiner (ví dụ gọi API + loading state), tách thành composable useXxx() và áp dụng lại ở 2 component."},
 be:{title:"Java cơ bản: cú pháp, kiểu dữ liệu, biến", points:[
   "Java là ngôn ngữ biên dịch — code .java được compile thành bytecode .class chạy trên JVM.",
   "Kiểu dữ liệu nguyên thủy (int, double, boolean, char...) khác với kiểu tham chiếu (String, Object).",
   "Biến phải khai báo kiểu rõ ràng (static typing), không suy luận linh hoạt như JavaScript.",
   "Java phân biệt hoa thường; mỗi file .java có class public phải trùng tên file.",
   "Câu lệnh điều kiện (if/else, switch) và vòng lặp (for/while) khá giống JS về cú pháp."],
  task:"Cài JDK, viết chương trình Java đầu tiên in ra \"Hello World\" và 1 phép tính đơn giản, chạy bằng javac rồi java."},
 algoId:"two-sum"},

{day:2, theme:"Reactivity & Class/Object",
 fe:{title:"Reactivity system nội bộ (Proxy, ref vs reactive)", points:[
   "Vue 3 dùng Proxy để theo dõi thay đổi object, thay cho Object.defineProperty ở Vue 2.",
   "ref() bọc giá trị primitive trong object có .value; reactive() dùng cho object/array, không cần .value.",
   "reactive() mất reactivity khi destructure — dùng toRefs() để giữ lại.",
   "computed là giá trị được cache, chỉ tính lại khi dependency thay đổi.",
   "watch theo dõi nguồn cụ thể; watchEffect tự động track mọi dependency dùng bên trong nó."],
  task:"Viết đoạn code nhỏ minh họa việc destructure reactive() làm mất reactivity, rồi sửa lại bằng toRefs()."},
 be:{title:"OOP: Class & Object", points:[
   "Class là khuôn mẫu định nghĩa thuộc tính (field) và hành vi (method) của object.",
   "Object là thực thể cụ thể được tạo ra từ class bằng từ khóa new.",
   "Constructor là method đặc biệt chạy khi tạo object, dùng để khởi tạo giá trị ban đầu.",
   "Access modifier (private, public, protected) kiểm soát phạm vi truy cập field/method.",
   "Getter/Setter là cách phổ biến để truy cập field private một cách có kiểm soát (encapsulation)."],
  task:"Viết class Model (giống khái niệm model trong AWX Refiner) với vài field private, constructor, getter/setter, rồi tạo vài object thử."},
 algoId:"fizzbuzz"},

{day:3, theme:"State Management & Kế thừa",
 fe:{title:"State management pattern (Pinia)", points:[
   "Pinia thay thế Vuex ở Vue 3, API đơn giản hơn và hỗ trợ TypeScript tốt.",
   "Store gồm state, getters (như computed), actions (như methods, có thể async).",
   "Nguyên tắc: chỉ đưa state vào store khi nhiều component không liên quan cần dùng chung.",
   "Tránh lạm dụng store cho state cục bộ chỉ 1 component dùng — ref/reactive local là đủ.",
   "Có thể chia nhiều store nhỏ theo domain (userStore, modelStore...) thay vì 1 store khổng lồ."],
  task:"Liệt kê 3 state hiện đang truyền qua nhiều props (prop drilling) trong AWX Refiner, đánh giá xem có nên đưa vào store không."},
 be:{title:"Kế thừa (Inheritance) & Đa hình (Polymorphism)", points:[
   "extends cho phép 1 class kế thừa field/method từ class cha, tránh lặp code.",
   "Đa hình cho phép gọi cùng 1 method nhưng hành vi khác nhau tùy class con.",
   "@Override đánh dấu method con ghi đè method cha, giúp compiler kiểm tra lỗi.",
   "super() gọi constructor của class cha từ class con.",
   "Đa hình hữu ích khi xử lý danh sách nhiều loại object khác nhau qua cùng 1 kiểu cha."],
  task:"Tạo class cha Animal và 2 class con Dog, Cat override method makeSound(), thử gọi qua 1 mảng kiểu Animal."},
 algoId:"reverse-string"},

{day:4, theme:"Performance & Interface",
 fe:{title:"Performance: lazy loading & code splitting", points:[
   "Code splitting chia bundle thành nhiều chunk nhỏ, chỉ tải khi cần.",
   "Vue Router hỗ trợ lazy load route: component: () => import('./View.vue').",
   "defineAsyncComponent cho phép lazy load component không qua router.",
   "Lazy load ảnh bằng loading=\"lazy\" hoặc IntersectionObserver.",
   "Đo tác động bằng Lighthouse hoặc tab Network trong DevTools trước/sau khi áp dụng."],
  task:"Chọn 1 route ít dùng trong AWX Refiner, chuyển sang lazy load và so sánh kích thước bundle trước/sau."},
 be:{title:"Interface & Abstract class", points:[
   "Interface định nghĩa \"hợp đồng\" các method phải implement, không chứa logic (trước Java 8).",
   "Abstract class có thể chứa cả method đã implement và method trừu tượng chưa implement.",
   "1 class có thể implement nhiều interface nhưng chỉ extends 1 class (abstract hoặc thường).",
   "Interface phù hợp khi muốn định nghĩa khả năng (Comparable, Runnable...) cho nhiều class không liên quan.",
   "Abstract class phù hợp khi các class con có chung 1 phần logic cơ bản."],
  task:"Định nghĩa interface Trainable với method train(), implement nó ở 2 class khác nhau."},
 algoId:"valid-palindrome"},

{day:5, theme:"Virtual DOM & Exception",
 fe:{title:"Virtual DOM & thuật toán diffing", points:[
   "Virtual DOM là cây object JS đại diện cho DOM thật, giúp so sánh (diff) rẻ hơn thao tác DOM trực tiếp.",
   "Vue 3 dùng thuật toán diff tối ưu hơn Vue 2 nhờ compile-time hints (patch flag).",
   "key trong v-for giúp Vue nhận diện đúng phần tử khi list thay đổi, tránh render sai.",
   "Không phải lúc nào Virtual DOM cũng nhanh hơn thao tác DOM trực tiếp — nó đánh đổi để dễ maintain.",
   "Hiểu cơ chế này giúp giải thích tại sao thiếu key gây bug re-render kỳ lạ."],
  task:"Tìm 1 chỗ dùng v-for trong code hiện tại thiếu key hoặc dùng index làm key, đánh giá rủi ro và sửa nếu cần."},
 be:{title:"Exception Handling", points:[
   "try/catch/finally xử lý lỗi runtime mà không làm crash toàn chương trình.",
   "Checked exception (bắt buộc catch hoặc khai báo throws) khác unchecked exception (RuntimeException).",
   "finally luôn chạy dù có exception hay không, thường dùng để đóng tài nguyên (file, connection).",
   "Tự định nghĩa custom exception bằng cách extends Exception hoặc RuntimeException.",
   "Không nên catch Exception chung chung rồi bỏ qua — luôn xử lý hoặc log rõ ràng."],
  task:"Viết hàm chia 2 số, ném custom exception khi chia cho 0, và catch xử lý ở nơi gọi."},
 algoId:"count-chars"},

{day:6, theme:"CSS Architecture & Collections",
 fe:{title:"CSS Architecture", points:[
   "BEM (Block Element Modifier) đặt tên class theo cấu trúc rõ ràng, tránh xung đột style.",
   "Utility-first (như TailwindCSS) ưu tiên compose class nhỏ thay vì viết CSS riêng.",
   "Scoped style trong Vue SFC (<style scoped>) tự động giới hạn phạm vi CSS theo component.",
   "CSS Variables giúp theming động (dark mode, design token) mà không cần build lại.",
   "Kiến trúc CSS nên nhất quán toàn dự án, tránh trộn lẫn nhiều cách đặt tên."],
  task:"Xem lại 1 file .vue trong dự án, đánh giá style đang theo quy ước nào và có nhất quán với phần còn lại không."},
 be:{title:"Collections Framework", points:[
   "List (ArrayList, LinkedList) lưu dữ liệu có thứ tự, cho phép trùng lặp.",
   "Set (HashSet, TreeSet) không cho phép trùng lặp; HashSet không đảm bảo thứ tự.",
   "Map (HashMap, TreeMap) lưu cặp key-value, tra cứu theo key rất nhanh (gần O(1) với HashMap).",
   "Chọn cấu trúc dữ liệu phù hợp quan trọng hơn nhớ hết API — hỏi \"cần thứ tự không, cần unique không, cần tra cứu nhanh không\".",
   "Duyệt Collection bằng for-each hoặc Stream API (Java 8+)."],
  task:"Dùng HashMap để đếm tần suất xuất hiện của từng ký tự trong 1 chuỗi."},
 algoId:"bubble-sort"},

{day:7, theme:"Accessibility & String",
 fe:{title:"Accessibility (a11y) cơ bản cho SPA", points:[
   "Dùng đúng thẻ HTML ngữ nghĩa (button, nav, header) thay vì div/span cho mọi thứ.",
   "Mọi input cần có label liên kết (for/id hoặc aria-label).",
   "Đảm bảo tương phản màu đủ để người khiếm thị màu vẫn đọc được.",

/* ============ STATE & PERSISTENCE ============ */
let currentDay = 1;
let progress = {};
try { progress = JSON.parse(localStorage.getItem('daily-progress') || '{}'); } catch(e){ progress = {}; }
const savedCode = {};
try { Object.assign(savedCode, JSON.parse(localStorage.getItem('daily-code') || '{}')); } catch(e){}

function saveProgress(){
  localStorage.setItem('daily-progress', JSON.stringify(progress));
  updateHeaderProgress();
  renderSidebar();
}
function saveCode(){
  localStorage.setItem('daily-code', JSON.stringify(savedCode));
}
function getDayProgress(day){
  return progress[day] || {fe:false, be:false, algo:false};
}
function setDayProgress(day, key, val){
  if(!progress[day]) progress[day] = {fe:false, be:false, algo:false};
  progress[day][key] = val;
  saveProgress();
}

function updateHeaderProgress(){
  const total = curriculum.length;
  let full = 0;
  curriculum.forEach(d => {
    const p = getDayProgress(d.day);
    if(p.fe && p.be && p.algo) full++;
  });
  document.getElementById('progress-fill').style.width = (full/total*100) + '%';
  document.getElementById('progress-label').innerHTML = `<b>${full}</b>/${total} ngày`;
}

/* ============ SIDEBAR ============ */
function renderSidebar(){
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '<div class="sidebar-label">Lộ trình 20 ngày</div>';
  curriculum.forEach(d => {
    const p = getDayProgress(d.day);
    const item = document.createElement('div');
    item.className = 'day-item' + (d.day === currentDay ? ' active' : '');
    item.innerHTML = `
      <span class="num">${String(d.day).padStart(2,'0')}</span>
      <span class="theme">${d.theme}</span>
      <span class="day-dots">
        <span class="${p.fe ? 'done fe' : ''}"></span>
        <span class="${p.be ? 'done be' : ''}"></span>
        <span class="${p.algo ? 'done algo' : ''}"></span>
      </span>
    `;
    item.addEventListener('click', () => selectDay(d.day));
    sidebar.appendChild(item);
  });
}

/* ============ TEST ENGINE ============ */
function deepEqual(a, b){
  if (Array.isArray(a) && Array.isArray(b)) {
    if (a.length !== b.length) return false;
    return a.every((v,i) => deepEqual(v, b[i]));
  }
  if (a && b && typeof a === 'object' && typeof b === 'object') {
    const ak = Object.keys(a).sort(), bk = Object.keys(b).sort();
    if (ak.length !== bk.length) return false;
    return ak.every((k,i) => k === bk[i] && deepEqual(a[k], b[k]));
  }
  return a === b;
}
function anagramEqual(a, b){
  const norm = (arr) => arr.map(inner => [...inner].sort().join(',')).sort().join('|');
  try { return norm(a) === norm(b); } catch(e){ return false; }
}

function runTests(d, problem){
  const code = document.getElementById('editor').value;
  const body = document.getElementById('console-body');
  let userFn;
  try {
    const scope = new Function(code + '\nreturn solve;');
    userFn = scope();
    if (typeof userFn !== 'function') throw new Error('Không tìm thấy hàm solve() hợp lệ.');
  } catch(e){
    body.innerHTML = `<div class="error-line">✗ Lỗi cú pháp: ${e.message}</div>`;
    return;
  }

  let lines = '';
  let passCount = 0;
  problem.tests.forEach((t, i) => {
    try {
      const actual = userFn(...t.args);
      const pass = t.normalize === 'anagram' ? anagramEqual(actual, t.expected) : deepEqual(actual, t.expected);
      if (pass) passCount++;
      const detail = pass ? '' : `mong đợi ${JSON.stringify(t.expected)}, nhận được ${JSON.stringify(actual)}`;
      lines += `<div class="test-line ${pass ? 'pass' : 'fail'}">
        <span class="mark">${pass ? '✓' : '✗'}</span>
        <span><span class="txt">test ${i+1} — input: ${JSON.stringify(t.args)}</span>${detail ? `<span class="detail">${detail}</span>` : ''}</span>
      </div>`;
    } catch(e){
      lines += `<div class="test-line fail"><span class="mark">✗</span><span><span class="txt">test ${i+1} — lỗi khi chạy</span><span class="detail">${e.message}</span></span></div>`;
    }
  });

  const allPass = passCount === problem.tests.length;
  lines += `<div class="summary-line ${allPass ? 'pass' : 'fail'}">${passCount}/${problem.tests.length} test passed${allPass ? ' — hoàn thành bài này!' : ''}</div>`;
  body.innerHTML = lines;

  if (allPass) {
    setDayProgress(d.day, 'algo', true);
    selectDay(d.day);
  }
}
